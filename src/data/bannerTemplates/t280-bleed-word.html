<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Bleed Word — "new", lowercase, black weight, tracked so tight the letters touch, set far too big
     for its cobalt block so it bleeds off the edges: type as a cropped shape, still readable.
     TALL → photo + caption strip above, the word bleeding across the bottom block
     7/10+ → the letters stack into a n/e/w tower bleeding off the right-hand column */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #2340D8; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F2EEE4; color: #111; font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
  .left { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .ph { position: relative; flex: 1; min-height: 0; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .strip { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 2vmin; padding: 2.2vmin 4.4vmin; font-size: 1.9vmin; font-weight: 500; letter-spacing: .02em; }
  .strip b { font-weight: 900; }
  .strip .cta { font-weight: 700; padding-bottom: .4vmin; border-bottom: .35vmin solid #111; white-space: nowrap; }
  .strip .mid { color: #2340D8; font-weight: 700; }

  .blk { flex: none; position: relative; height: 36vmin; background: #2340D8; overflow: hidden; }
  .word { position: absolute; left: -2vmin; bottom: 9vmin; font-weight: 900; font-size: 52vmin; line-height: .56; letter-spacing: -.075em; color: #F2EEE4; white-space: nowrap; }
  .word span { display: inline-block; }

  /* SHORTER PORTRAIT — a n/e/w tower in a cobalt column on the right */
  @media (min-aspect-ratio: 7/10) {
    .banner { flex-direction: row; }
    .blk { height: 100%; width: 42%; }
    .word { left: auto; right: -6vmin; bottom: auto; top: 50%; transform: translateY(-50%); font-size: 60vmin; line-height: .5; letter-spacing: -.05em; text-align: right; }
    .word span { display: block; }
    .word span + span { margin-top: 3.6vmin; }
    .strip { padding: 2vmin 3.6vmin; white-space: nowrap; }
    .strip .mid { display: none; }
  }
  @media (min-aspect-ratio: 9/10) {
    .blk { width: 40%; }
    .word { font-size: 56vmin; right: -5vmin; }
    .word span + span { margin-top: 3vmin; }
    .strip .mid { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .blk { width: 38%; }
    .word { font-size: 58vmin; right: -3vmin; }
    .strip .mid { display: inline; }
    .strip { padding: 2.2vmin 4.4vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="left">
    <div class="ph"><img class="photo" src="{{PRODUCT_IMAGE}}" alt=""></div>
    <div class="strip"><span><b>Just landed</b> — the new collection</span><span class="mid">From $45</span><span class="cta">Shop now →</span></div>
  </div>
  <div class="blk">
    <div class="word"><span>n</span><span>e</span><span>w</span></div>
  </div>
</div>
</body>
</html>
