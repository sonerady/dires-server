<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Weekend Forecast — the festival weather widget: a three-day outlook (drawn sun / cloud icons, highs), the discount rising
     day by day like the temperature, and a UV-style "sale index" bar with its marker in the red.
     tall → photo above, forecast below · square & wide → forecast left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #CFE8F5; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #CFE8F5; color: #0F2A44; font-family: "Figtree", "Helvetica Neue", Arial, sans-serif; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; }

  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 54%; object-fit: cover; object-position: 50% 20%; }
  .wx { position: absolute; left: 0; right: 0; top: 54%; bottom: 0; box-sizing: border-box; padding: 4vmin 6vmin 5vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .loc { display: flex; justify-content: space-between; align-items: center; font-size: 1.8vmin; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .loc span:first-child::before { content: ""; display: inline-block; width: 1.3vmin; height: 1.3vmin; margin-right: 1vmin; border-radius: 50%; background: #FF6B4A; vertical-align: .1vmin; }
  .hero { display: flex; justify-content: space-between; align-items: center; gap: 2vmin; }
  .sun { flex: none; width: 24vmin; height: 24vmin; }
  h1 { margin: 0; font-size: 11.4vmin; line-height: .9; letter-spacing: -.01em; }
  h1 i { color: #FF6B4A; }

  .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vmin; }
  .d { background: rgba(255,255,255,.55); padding: 2vmin 2vmin 2.2vmin; display: flex; flex-direction: column; align-items: flex-start; gap: .6vmin; }
  .d.on { background: #0F2A44; color: #F4FAFD; }
  .d .dn { font-size: 1.8vmin; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .d svg { width: 8vmin; height: 8vmin; margin: .4vmin 0; }
  .d .t { font-size: 5.6vmin; line-height: 1; }
  .d .p { margin-top: .6vmin; font-size: 2.1vmin; font-weight: 800; padding: .5vmin 1.2vmin; background: #FFB21E; color: #0F2A44; }
  .d.on .p { background: #FF6B4A; color: #fff; }

  .uv { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2vmin; font-size: 1.8vmin; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .bar { position: relative; height: 1.4vmin; background: linear-gradient(90deg, #7BC67B 0%, #F4E04D 30%, #FFB21E 52%, #FF6B4A 74%, #9B5DE5 100%); }
  .bar i { position: absolute; left: 82%; top: -1.2vmin; width: 3.8vmin; height: 3.8vmin; margin-left: -1.9vmin; border-radius: 50%; background: #fff; border: .5vmin solid #0F2A44; box-sizing: border-box; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 3vmin; }
  .code { font-size: 2vmin; line-height: 1.4; }
  .code b { font-weight: 800; letter-spacing: .08em; }
  .cta { padding: 1.8vmin 3vmin; background: #0F2A44; color: #F4FAFD; font-size: 2vmin; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 5/8) {
    h1 { font-size: 10vmin; }
    .sun { width: 19vmin; height: 19vmin; }
    .d { flex-direction: row; flex-wrap: wrap; align-items: center; gap: .4vmin 1.4vmin; padding: 1.6vmin 1.8vmin; }
    .d .dn { width: 100%; }
    .d svg { width: 6.4vmin; height: 6.4vmin; margin: 0; }
    .d .t { font-size: 4.8vmin; }
    .d .p { margin-top: .4vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: 46%; }
    .wx { top: 46%; padding: 3vmin 6vmin 4vmin; }
    h1 { font-size: 9vmin; }
    .sun { width: 18vmin; height: 18vmin; }
    .d { flex-direction: row; flex-wrap: wrap; align-items: center; gap: .4vmin 1.4vmin; padding: 1.6vmin 1.8vmin; }
    .d .dn { width: 100%; }
    .d svg { width: 6vmin; height: 6vmin; margin: 0; }
    .d .t { font-size: 4.6vmin; }
    .d .p { margin-top: .4vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; width: 46%; height: 100%; object-position: 50% 25%; }
    .wx { top: 0; right: 46%; padding: 5vmin 4.5vmin 4.5vmin; }
    h1 { font-size: 7.8vmin; }
    .sun { width: 13vmin; height: 13vmin; }
    .days { gap: 1.4vmin; }
    .d { flex-direction: column; align-items: flex-start; padding: 1.6vmin 1.4vmin; }
    .d svg { width: 6.4vmin; height: 6.4vmin; }
    .d .t { font-size: 4.4vmin; }
    .d .p { font-size: 1.8vmin; padding: .4vmin .9vmin; }
    .uv { font-size: 1.6vmin; gap: 1.4vmin; }
    .foot { flex-direction: column; align-items: flex-start; gap: 2vmin; }
    .code { font-size: 1.8vmin; }
    .cta { font-size: 1.8vmin; padding: 1.5vmin 2.4vmin; }
    .loc span:last-child { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 40%; object-position: 50% 30%; }
    .wx { right: 40%; padding: 5vmin 6vmin 5vmin; }
    h1 { font-size: 9.4vmin; }
    .sun { width: 18vmin; height: 18vmin; }
    .days { gap: 2vmin; }
    .d { flex-direction: row; flex-wrap: wrap; align-items: center; gap: .4vmin 1.6vmin; padding: 1.8vmin 2vmin; }
    .d .dn { width: 100%; }
    .d svg { width: 7vmin; height: 7vmin; }
    .d .t { font-size: 5vmin; }
    .d .p { font-size: 2vmin; }
    .uv { font-size: 1.8vmin; }
    .foot { flex-direction: row; align-items: center; }
    .code { font-size: 2vmin; }
    .cta { font-size: 2vmin; padding: 1.8vmin 3vmin; }
    .loc span:last-child { display: inline; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="wx">
    <div class="loc"><span>Weekend forecast · Studio Oro</span><span>03—05 Jul</span></div>
    <div class="hero"><h1 class="serif">Hot, hotter,<br><i>40% off.</i></h1>
      <svg class="sun" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#FF6B4A" stroke-width="3.4" stroke-linecap="round"><path d="M50 3v11M50 86v11M3 50h11M86 50h11M16.8 16.8l7.8 7.8M75.4 75.4l7.8 7.8M83.2 16.8l-7.8 7.8M24.6 75.4l-7.8 7.8"/></g><circle cx="50" cy="50" r="26" fill="#FFB21E"/><circle cx="50" cy="50" r="26" fill="none" stroke="#FF6B4A" stroke-width="3.4"/><text x="50" y="58" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="25" fill="#0F2A44">32°</text></svg></div>
    <div class="days">
      <div class="d"><span class="dn">Fri</span>
        <svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#FFB21E" stroke-width="2.4" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5L32 32M32 8l-3.5 3.5M11.5 28.5L8 32"/></g><circle cx="20" cy="20" r="8" fill="#FFB21E"/></svg>
        <span class="t serif">28°</span><span class="p">−20%</span></div>
      <div class="d"><span class="dn">Sat</span>
        <svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#FFB21E" stroke-width="2.4" stroke-linecap="round"><path d="M16 3v4M4 15h4M7.5 6.5l3 3M24.5 6.5l-3 3"/></g><circle cx="16" cy="16" r="7" fill="#FFB21E"/><path d="M12 33 h19 a6 6 0 0 0 0 -12 a8 8 0 0 0 -15 2 a5 5 0 0 0 -4 10 z" fill="#fff" stroke="#0F2A44" stroke-width="1.4"/></svg>
        <span class="t serif">30°</span><span class="p">−30%</span></div>
      <div class="d on"><span class="dn">Sun</span>
        <svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#FF6B4A" stroke-width="2.4" stroke-linecap="round"><path d="M20 2v6M20 32v6M2 20h6M32 20h6M7 7l4 4M29 29l4 4M33 7l-4 4M11 29l-4 4"/></g><circle cx="20" cy="20" r="9" fill="#FF6B4A"/></svg>
        <span class="t serif">32°</span><span class="p">−40%</span></div>
    </div>
    <div class="uv"><span>Sale index</span><div class="bar"><i></i></div><span>Very high</span></div>
    <div class="foot"><div class="code">Prices drop daily.<br>Code <b>SUNNY</b> · festival edit</div><div class="cta">Shop the edit</div></div>
  </div>
</div>
</body>
</html>
