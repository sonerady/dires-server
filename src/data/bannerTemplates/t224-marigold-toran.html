<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Marigold Toran — Diwali: a toran of marigold swags and hanging strands (with mango-leaf tassels) is strung
     along the top of a deep plum panel; a corner of rangoli blooms in magenta, saffron and peacock teal, and a small
     diya marks the kicker. Rozha One brings a Devanagari-rooted high-contrast voice.
     tall → photo above the panel; square/wide → photo left, panel right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #3A0F2E; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #3A0F2E; color: #FCEBD2; font-family: "Hind", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 78vmin); object-fit: cover; object-position: 50% 18%; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; top: calc(100% - 78vmin); overflow: hidden; background: radial-gradient(80vmin 60vmin at 100% 100%, #521643 0%, #3A0F2E 70%); }
  .toran { position: absolute; left: 0; top: 0; width: 100%; height: 22vmin; }
  .rangoli { position: absolute; right: -2vmin; bottom: -2vmin; width: 38vmin; height: 38vmin; opacity: .85; }
  .copy { position: absolute; left: 7vmin; right: 7vmin; top: 25vmin; bottom: 6vmin; display: flex; flex-direction: column; }
  .k { display: flex; align-items: center; gap: 1.6vmin; font-size: 1.9vmin; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: #F7C131; }
  .k svg { width: 4.4vmin; height: 3vmin; flex: none; }
  h1 { margin: 2vmin 0 0; font-family: "Rozha One", "Bodoni 72", Georgia, serif; font-weight: 400; font-size: 12vmin; line-height: .95; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: #F29A1E; }
  .p { margin-top: 2vmin; font-size: 2.4vmin; line-height: 1.45; color: #E9CFC0; max-width: 56vmin; }
  .offer { margin-top: 3vmin; display: flex; align-items: baseline; gap: 1.6vmin; }
  .offer span { font-size: 1.8vmin; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #E9CFC0; }
  .offer b { font-family: "Rozha One", Georgia, serif; font-weight: 400; font-size: 7vmin; line-height: 1; color: #FCEBD2; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 2.4vmin; font-size: 2vmin; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .foot .cta { background: #F29A1E; color: #3A0F2E; padding: 1.5vmin 3vmin; white-space: nowrap; }
  .foot .code { white-space: nowrap; }
  .foot .code em { font-style: normal; color: #F7C131; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 64vmin); }
    .panel { top: calc(100% - 64vmin); }
    .toran { height: 18vmin; }
    .copy { top: 20vmin; bottom: 4.6vmin; }
    h1 { font-size: 10vmin; }
    .p { display: none; }
    .offer { margin-top: 2vmin; }
    .offer b { font-size: 6vmin; }
    .rangoli { width: 34vmin; height: 34vmin; }
  }
  /* square / wide → photo left, panel right */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 48%; height: 100%; object-position: 50% 25%; }
    .panel { left: 48%; top: 0; }
    .toran { height: 17vmin; }
    .copy { left: 5vmin; right: 5vmin; top: 22vmin; bottom: 6vmin; }
    .k { font-size: 1.7vmin; letter-spacing: .2em; }
    h1 { font-size: 8.4vmin; }
    .p { display: block; font-size: 2.1vmin; }
    .offer { flex-direction: column; gap: .4vmin; }
    .offer b { font-size: 6.6vmin; }
    .foot { flex-direction: column; align-items: flex-start; gap: 2vmin; font-size: 1.8vmin; }
    .rangoli { width: 32vmin; height: 32vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .panel { left: 46%; }
    .toran { height: 20vmin; }
    .copy { left: 8vmin; right: 8vmin; top: 25vmin; bottom: 7vmin; }
    .k { font-size: 1.9vmin; letter-spacing: .26em; }
    h1 { font-size: 10.6vmin; }
    .p { font-size: 2.3vmin; max-width: 46vmin; }
    .offer { flex-direction: row; gap: 1.6vmin; }
    .foot { flex-direction: row; align-items: center; font-size: 1.9vmin; }
    .rangoli { width: 34vmin; height: 34vmin; }
  }
</style>
</head>
