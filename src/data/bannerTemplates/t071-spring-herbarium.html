<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Spring Herbarium — the look as a pressed specimen: sage paper plate, line-drawn tulip, herbarium label as offer card.
     tall → photo above the plate; square/wide → photo left, plate right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EDEFE2; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #EDEFE2; color: #22362A; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 60%; object-fit: cover; object-position: 50% 16%; }
  .plate { position: absolute; left: 0; right: 0; top: 60%; bottom: 0; }
  .top { position: absolute; left: 6vmin; right: 6vmin; top: 3.6vmin; display: flex; justify-content: space-between; font-size: 1.7vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; padding-bottom: 1.3vmin; border-bottom: 1px solid rgba(34,54,42,.5); }
  h1 { position: absolute; left: 5.4vmin; top: 9vmin; margin: 0; font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-weight: 400; font-size: 14.5vmin; line-height: .84; letter-spacing: -.025em; }
  h1 i { display: block; padding-left: 7vmin; color: #B9543C; }
  .fig { position: absolute; right: 6vmin; top: 9.6vmin; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 2.6vmin; text-align: right; line-height: 1.2; }
  .plant { position: absolute; right: 4vmin; bottom: 10vmin; width: 32vmin; height: calc(100% - 26vmin); }
  .label { position: absolute; left: 6vmin; bottom: 5vmin; width: 58%; border: 1px solid #22362A; background: #F6F6EE; }
  .label .t { padding: 1vmin 1.6vmin; font-size: 1.7vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; background: #22362A; color: #F6F6EE; }
  .row { display: flex; align-items: baseline; padding: .75vmin 1.6vmin; border-top: 1px solid rgba(34,54,42,.35); }
  .row span { width: 38%; flex: none; font-size: 1.65vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .62; }
  .row b { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 3.3vmin; line-height: 1.1; }
  /* tall: label as a 2×2 grid so the plate stays airy */
  .label { display: grid; grid-template-columns: 1fr 1fr; }
  .label .t { grid-column: 1 / -1; }
  .row { flex-direction: column; border-top: 0; border-left: 1px solid rgba(34,54,42,.35); padding: .9vmin 1.6vmin 1.1vmin; }
  .row:nth-child(even) { border-left: 0; }
  .row:nth-child(n+4) { border-top: 1px solid rgba(34,54,42,.35); }
  .row span { width: auto; margin-bottom: .3vmin; }
  .cta { position: absolute; right: 6vmin; bottom: 5vmin; font-size: 2.1vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; padding-bottom: .7vmin; border-bottom: .3vmin solid #22362A; }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: 56%; }
    .plate { top: 56%; }
    h1 { font-size: 12.5vmin; }
    .plant { width: 28vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .plate { top: 0; left: 50%; }
    .top { left: 5vmin; right: 5vmin; top: 5vmin; }
    .top span:last-child { display: none; }
    h1 { left: 4.4vmin; top: 11vmin; font-size: 12.5vmin; }
    h1 i { padding-left: 5vmin; }
    .fig { top: auto; right: 5vmin; bottom: 44vmin; }
    .plant { right: 1vmin; top: 30vmin; bottom: auto; height: 24vmin; width: 22vmin; }
    .label { left: 5vmin; right: 5vmin; width: auto; bottom: 11vmin; display: block; }
    .row { flex-direction: row; border-left: 0; padding: .75vmin 1.6vmin; }
    .row:nth-child(n) { border-top: 1px solid rgba(34,54,42,.35); }
    .row span { width: 38%; margin: 0; }
    .cta { left: 5vmin; right: auto; bottom: 5vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .plate { left: 46%; }
    .top { left: 6vmin; right: 6vmin; }
    .top span:last-child { display: inline; }
    h1 { left: 5.4vmin; top: 12vmin; font-size: 15vmin; }
    h1 i { padding-left: 8vmin; }
    .fig { right: 6vmin; top: 12vmin; bottom: auto; }
    .plant { right: 3vmin; top: auto; bottom: 11vmin; height: 52vmin; width: 30vmin; }
    .label { left: 6vmin; right: auto; width: 52%; bottom: 6vmin; }
    .cta { left: auto; right: 6vmin; bottom: 6vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="plate">
    <div class="top"><span>Plate IV — New season</span><span>SS 26</span></div>
    <h1>In full<i>bloom.</i></h1>
    <div class="fig">fig. 1<br>freshly picked</div>
    <svg class="plant" viewBox="0 0 120 220" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <g fill="#E8B4A2" opacity=".85">
        <path d="M60 74 C 45 70, 40 50, 45 30 C 51 39, 55 41, 60 30 C 65 41, 69 39, 75 30 C 80 50, 75 70, 60 74 Z" transform="translate(3 3)"/>
        <circle cx="96" cy="118" r="6"/><circle cx="104" cy="104" r="4.5"/><circle cx="18" cy="136" r="5"/>
      </g>
      <g fill="none" stroke="#22362A" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 74 C 45 70, 40 50, 45 30 C 51 39, 55 41, 60 30 C 65 41, 69 39, 75 30 C 80 50, 75 70, 60 74 Z"/>
        <path d="M60 30 C 57 46, 57 60, 60 74"/>
        <path d="M60 74 C 62 110, 56 160, 60 218"/>
        <path d="M59 206 C 36 178, 28 148, 34 112 C 44 140, 52 170, 59 196"/>
        <path d="M34 112 C 42 146, 50 176, 58 200"/>
        <path d="M61 190 C 82 166, 90 140, 86 112 C 76 138, 68 162, 61 182"/>
        <path d="M86 112 C 80 140, 72 164, 62 186"/>
        <path d="M76 218 C 80 190, 88 160, 104 132"/>
        <path d="M84 176 C 90 170, 94 162, 96 124"/><path d="M92 152 C 98 140, 102 124, 104 108"/>
        <path d="M44 218 C 38 196, 28 170, 18 142"/>
        <path d="M34 184 C 28 180, 22 172, 20 166"/>
        <circle cx="96" cy="118" r="6"/><circle cx="104" cy="104" r="4.5"/><circle cx="18" cy="136" r="5"/>
        <path d="M8 218 L 112 218" stroke-width=".7"/>
      </g>
    </svg>
    <div class="label">
      <div class="t">Herbarium — Studio Oro</div>
      <div class="row"><span>Specimen</span><b>The spring collection</b></div>
      <div class="row"><span>Offer</span><b>20% off first order</b></div>
      <div class="row"><span>Code</span><b>BLOOM20</b></div>
      <div class="row"><span>Until</span><b>30 April</b></div>
    </div>
    <div class="cta">Shop the edit →</div>
  </div>
</div>
</body>
</html>
