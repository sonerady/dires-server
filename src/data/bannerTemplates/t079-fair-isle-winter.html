<style>
  /* Fair Isle Winter — the winter edit as a knitting pattern card: a stitched Fair Isle band sewn to the photo's hem,
     rib-knit oatmeal ground, and the offer written as pattern notes. tall → photo above; square/wide → photo left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ECE3D3; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #1F2A44; font-family: "IBM Plex Mono", "Courier New", monospace;
    background-color: #ECE3D3; background-image: repeating-linear-gradient(90deg, transparent 0 1.1vmin, rgba(31,42,68,.045) 1.1vmin 1.3vmin, transparent 1.3vmin 2.2vmin); }
  .defs { position: absolute; width: 0; height: 0; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 57%; object-fit: cover; object-position: 50% 16%; }
  .band { position: absolute; left: 0; right: 0; top: 57%; width: 100%; height: 10.2vmin; display: block; }
  .band-v { display: none; }
  .card { position: absolute; left: 0; right: 0; top: calc(57% + 10.2vmin); bottom: 0; }
  .k em { font-style: normal; }
  .k { position: absolute; left: 6vmin; right: 6vmin; top: 3.6vmin; display: flex; justify-content: space-between; font-size: 1.8vmin; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  h1 { position: absolute; left: 5.6vmin; top: 7.6vmin; margin: 0; font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 11.4vmin; line-height: .94; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #B8454A; }
  .flake { position: absolute; right: 6vmin; top: 8vmin; width: 17vmin; height: 17vmin; }
  .notes { position: absolute; left: 6vmin; right: 6vmin; bottom: 11.6vmin; margin: 0; padding: 0; list-style: none; font-size: 2vmin; }
  .notes li { display: flex; justify-content: space-between; gap: 2vmin; padding: .75vmin 0; border-bottom: 1px dashed rgba(31,42,68,.45); }
  .notes li span { opacity: .7; text-transform: uppercase; letter-spacing: .12em; font-size: 1.75vmin; }
  .notes li b { font-weight: 600; }
  .cta { position: absolute; left: 6vmin; right: 6vmin; bottom: 4.4vmin; display: flex; justify-content: space-between; align-items: center; padding: 1.4vmin 2.4vmin; background: #1F2A44; color: #F1E8D8; font-size: 2.1vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  @media (min-aspect-ratio: 3/5) {
    h1 { font-size: 10.4vmin; }
    .notes li:nth-child(4) { display: none; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: 53%; }
    .band { top: 53%; height: 9vmin; }
    .card { top: calc(53% + 9vmin); }
    h1 { font-size: 9.6vmin; }
    .flake { width: 13vmin; height: 13vmin; }
    .notes li:nth-child(2) { display: none; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 30%; }
    .band { display: none; }
    .band-v { display: block; position: absolute; top: 0; bottom: 0; left: 50%; width: 9vmin; height: 100%; }
    .card { top: 0; left: calc(50% + 9vmin); }
    .k { left: 4.4vmin; right: 4vmin; top: 5vmin; }
    .k span:last-child, .k em { display: none; }
    h1 { left: 4vmin; top: 10vmin; font-size: 8.4vmin; }
    .flake { right: auto; left: 12vmin; top: 36vmin; width: 16vmin; height: 16vmin; }
    .notes { left: 4.4vmin; right: 4vmin; bottom: 13vmin; font-size: 1.75vmin; }
    .notes li { flex-direction: column; gap: .2vmin; }
    .notes li span { font-size: 1.6vmin; }
    .notes li:nth-child(2), .notes li:nth-child(4) { display: flex; }
    .cta { left: 4.4vmin; right: 4vmin; bottom: 5vmin; font-size: 1.8vmin; padding: 1.3vmin 1.8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; object-position: 55% 30%; }
    .band-v { left: 46%; width: 10vmin; }
    .card { left: calc(46% + 10vmin); }
    .k { left: 6vmin; right: 6vmin; }
    .k span:last-child { display: inline; }
    .k em { display: inline; }
    h1 { left: 5.6vmin; top: 11vmin; font-size: 11vmin; }
    .flake { left: auto; right: 8vmin; top: 36vmin; width: 18vmin; height: 18vmin; }
    .notes { left: 6vmin; right: 6vmin; bottom: 15vmin; font-size: 2vmin; }
    .notes li { flex-direction: row; gap: 2vmin; }
    .notes li span { font-size: 1.75vmin; }
    .cta { left: 6vmin; right: 6vmin; bottom: 6vmin; font-size: 2.1vmin; padding: 1.4vmin 2.4vmin; }
  }
</style>
