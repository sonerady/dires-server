<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,600;0,700;1,600&family=Karla:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Park Entrance — the monumental routed-wood sign at a wilderness park gate: a dark-stained cedar board
     between two log posts on a dry-stone base, cream letters routed into the grain (lit from above, so each
     letter carries a shadowed upper wall), an invented peak-and-pine emblem, and a smaller plank hung on
     chains below it with the offer. tall → photo above, gate below · square/wide → photo left, gate right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1D2A20; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #1D2A20; color: #EEDFBC; font-family: "Zilla Slab", Rockwell, Georgia, serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 88vmin); object-fit: cover; object-position: 50% 20%; }
  .gate { position: absolute; left: 0; right: 0; bottom: 0; height: 88vmin; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 100%, #2A3A2B 0, #1D2A20 60%, #16211A 100%); }
  .gate::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7vmin;
    background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.493) 7.7%, rgba(0,0,0,.472) 15.4%, rgba(0,0,0,.437) 23.1%, rgba(0,0,0,.392) 30.8%, rgba(0,0,0,.339) 38.5%, rgba(0,0,0,.28) 46.2%, rgba(0,0,0,.22) 53.8%, rgba(0,0,0,.162) 61.5%, rgba(0,0,0,.108) 69.2%, rgba(0,0,0,.063) 76.9%, rgba(0,0,0,.029) 84.6%, rgba(0,0,0,.008) 92.3%, rgba(0,0,0,0)); }

  /* log posts */
  .post { position: absolute; top: 3vmin; bottom: 4vmin; width: 7.4vmin; border-radius: 3.7vmin 3.7vmin 0 0;
    background: linear-gradient(90deg, #2E1E14, #6B4A33 22%, #8A6446 42%, #6B4A33 70%, #2A1B12); }
  .post::after { content: ""; position: absolute; left: 1.2vmin; right: 1.2vmin; top: 1.2vmin; height: 5vmin; border-radius: 50%; background: radial-gradient(circle, #A78059 0 20%, #7A5638 21% 38%, #A78059 39% 52%, #6B4A33 53%); opacity: .75; }
  .p1 { left: 7vmin; } .p2 { right: 7vmin; }

  /* the board */
  .board { position: absolute; left: 3vmin; right: 3vmin; top: 7vmin; height: 52vmin; box-sizing: border-box;
    padding: 3.6vmin 4vmin 3.2vmin; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 .3vmin, transparent .3vmin 1.7vmin, rgba(255,220,170,.05) 1.7vmin 2vmin, transparent 2vmin 3.1vmin),
      linear-gradient(180deg, #5A3A26, #4B2F1F 55%, #3F271A);
    box-shadow: 0 1.6vmin 2.4vmin rgba(0,0,0,.55), inset 0 .5vmin 0 rgba(255,220,170,.12), inset 0 -.6vmin 0 rgba(0,0,0,.35); }
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: soft-light; opacity: .9; }
  /* routed inner frame */
  .board::before { content: ""; position: absolute; inset: 1.8vmin; border: .45vmin solid #D9C49A; box-shadow: inset .25vmin .3vmin 0 rgba(0,0,0,.55), .15vmin .2vmin 0 rgba(0,0,0,.4); opacity: .85; }
  .routed { color: #EEDFBC; text-shadow: 0 -.22vmin 0 rgba(0,0,0,.65), 0 .14vmin 0 rgba(255,236,200,.22); }
  .emblem { position: relative; width: 12vmin; height: 12vmin; flex: none; }
  .emblem svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 -.2vmin 0 rgba(0,0,0,.6)); }
  .words { position: relative; display: flex; flex-direction: column; align-items: center; }
  .wel { margin-top: 2vmin; font-family: "Karla", Arial, sans-serif; font-weight: 700; font-size: 2.3vmin; letter-spacing: .42em; text-transform: uppercase; }
  h1 { margin: 1vmin 0 0; font-weight: 700; font-size: 10.2vmin; line-height: .92; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
  h1 br { display: none; }
  .rule { display: flex; align-items: center; gap: 1.6vmin; margin-top: 1.8vmin; width: 100%; }
  .rule::before, .rule::after { content: ""; flex: 1; height: .4vmin; background: #D9C49A; box-shadow: 0 -.2vmin 0 rgba(0,0,0,.55); }
  .rule span { font-style: italic; font-weight: 600; font-size: 3.2vmin; white-space: nowrap; }
  .est { margin-top: 1.4vmin; font-family: "Karla", Arial, sans-serif; font-weight: 500; font-size: 1.9vmin; letter-spacing: .3em; text-transform: uppercase; color: #D9C49A; }

  /* hung plank */
  .chain { position: absolute; top: 59vmin; height: 5vmin; width: .6vmin; background: repeating-linear-gradient(180deg, #9C958A 0 .9vmin, #4A463F .9vmin 1.2vmin); }
  .c1 { left: 27vmin; } .c2 { right: 27vmin; }
  .plank { position: absolute; left: 17vmin; right: 17vmin; top: 64vmin; height: 12.6vmin; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8vmin;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 .3vmin, transparent .3vmin 1.7vmin), linear-gradient(180deg, #5E3D28, #452B1C);
    box-shadow: 0 1vmin 1.6vmin rgba(0,0,0,.5), inset 0 .4vmin 0 rgba(255,220,170,.1); transform: rotate(-1.2deg); }
  .off { font-weight: 700; font-size: 4.4vmin; line-height: 1; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .off b { color: #F2B84B; font-weight: 700; }
  .code { font-family: "Karla", Arial, sans-serif; font-weight: 700; font-size: 1.9vmin; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; color: #D9C49A; }

  /* dry-stone base */
  .stones { position: absolute; left: 0; right: 0; bottom: 0; height: 9vmin; width: 100%; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 80vmin); }
    .gate { height: 80vmin; }
    .board { top: 6vmin; height: 47vmin; padding-top: 3vmin; }
    .emblem { width: 10vmin; height: 10vmin; }
    .wel { margin-top: 1.6vmin; }
    h1 { font-size: 9.6vmin; }
    .chain { top: 53vmin; height: 4.4vmin; }
    .plank { top: 57.4vmin; height: 11.6vmin; }
    .stones { height: 7vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 64vmin); }
    .gate { height: 64vmin; }
    .board { top: 4.6vmin; height: 37vmin; flex-direction: row; gap: 4vmin; padding: 2.4vmin 5vmin; }
    .emblem { width: 13vmin; height: 13vmin; }
    .words { align-items: flex-start; text-align: left; }
    .wel { margin-top: 0; font-size: 2vmin; }
    h1 { font-size: 7.4vmin; }
    .rule { margin-top: 1.4vmin; }
    .rule::before { display: none; }
    .rule span { font-size: 2.8vmin; }
    .est { font-size: 1.7vmin; margin-top: 1vmin; }
    .chain { top: 41.6vmin; height: 3.6vmin; }
    .plank { top: 45.2vmin; height: 10.6vmin; left: 20vmin; right: 20vmin; }
    .off { font-size: 3.8vmin; }
    .code { font-size: 1.7vmin; }
    .stones { height: 6vmin; }
  }
  /* square / wide → photo left, gate right */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .gate { left: 50%; top: 0; height: auto; }
    .gate::before { top: 0; bottom: 0; left: 0; right: auto; width: 5vmin; height: auto;
      background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.493) 7.7%, rgba(0,0,0,.472) 15.4%, rgba(0,0,0,.437) 23.1%, rgba(0,0,0,.392) 30.8%, rgba(0,0,0,.339) 38.5%, rgba(0,0,0,.28) 46.2%, rgba(0,0,0,.22) 53.8%, rgba(0,0,0,.162) 61.5%, rgba(0,0,0,.108) 69.2%, rgba(0,0,0,.063) 76.9%, rgba(0,0,0,.029) 84.6%, rgba(0,0,0,.008) 92.3%, rgba(0,0,0,0)); }
    .post { width: 5.4vmin; top: 5vmin; }
    .p1 { left: 5vmin; } .p2 { right: 5vmin; }
    .board { left: 2.4vmin; right: 2.4vmin; top: 9vmin; height: 52vmin; flex-direction: column; gap: 0; padding: 3vmin 3vmin; }
    .board::before { inset: 1.3vmin; border-width: .35vmin; }
    .emblem { width: 9vmin; height: 9vmin; }
    .words { align-items: center; text-align: center; }
    .wel { margin-top: 1.4vmin; font-size: 1.7vmin; letter-spacing: .34em; }
    h1 { font-size: 7.2vmin; margin-top: .8vmin; }
    h1 br { display: inline; }
    .rule { margin-top: 1.4vmin; }
    .rule::before { display: block; }
    .rule span { font-size: 2.3vmin; }
    .est { font-size: 1.6vmin; letter-spacing: .2em; }
    .chain { top: 61vmin; height: 4vmin; }
    .c1 { left: 13vmin; } .c2 { right: 13vmin; }
    .plank { top: 65vmin; left: 6.5vmin; right: 6.5vmin; height: 15vmin; gap: 1vmin; }
    .off { font-size: 3.6vmin; }
    .code { font-size: 1.6vmin; letter-spacing: .14em; }
    .stones { height: 8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 48%; }
    .gate { left: 48%; }
    .post { width: 7vmin; }
    .p1 { left: 8vmin; } .p2 { right: 8vmin; }
    .board { left: 4vmin; right: 4vmin; top: 8vmin; height: 54vmin; padding: 3.4vmin 4vmin; }
    .board::before { inset: 1.7vmin; border-width: .45vmin; }
    .emblem { width: 11vmin; height: 11vmin; }
    .wel { font-size: 2.1vmin; letter-spacing: .4em; }
    h1 { font-size: 9.4vmin; }
    .rule span { font-size: 2.9vmin; }
    .est { font-size: 1.8vmin; letter-spacing: .28em; }
    .chain { top: 62vmin; height: 4.4vmin; }
    .c1 { left: 22vmin; } .c2 { right: 22vmin; }
    .plank { top: 66.4vmin; left: 14vmin; right: 14vmin; height: 14vmin; }
    .off { font-size: 4.4vmin; }
    .code { font-size: 1.9vmin; letter-spacing: .22em; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="gate">
    <i class="post p1"></i><i class="post p2"></i>
    <div class="board">
      <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .33  0 0 0 0 .2  0 0 0 1.4 -.3"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
      <div class="emblem">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#EEDFBC" stroke-width="4"/>
          <circle cx="50" cy="50" r="39" fill="none" stroke="#EEDFBC" stroke-width="1.6"/>
          <circle cx="63" cy="36" r="7" fill="#F2B84B"/>
          <path d="M14 70 L38 38 L48 50 L58 34 L86 70 Z" fill="#EEDFBC"/>
          <path d="M38 38 L32 46 L37 45 L41 50 L44 46 Z M58 34 L52 43 L57 42 L61 46 L64 42 Z" fill="#4B2F1F"/>
          <path d="M28 78 L34 66 L31 66 L36 57 L33 57 L38 48 L43 57 L40 57 L45 66 L42 66 L48 78 Z" fill="#2E4632" stroke="#EEDFBC" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M11 72 H89" stroke="#EEDFBC" stroke-width="2.4"/>
        </svg>
      </div>
      <div class="words routed">
        <span class="wel">Welcome to</span>
        <h1>Trail <br>Season</h1>
        <div class="rule"><span>The Outdoor Collection</span></div>
        <span class="est">Est. 2026 · Open all year</span>
      </div>
    </div>
    <i class="chain c1"></i><i class="chain c2"></i>
    <div class="plank routed">
      <span class="off">Entry <b>25% off</b></span>
      <span class="code">Code TRAIL25 · Enter now →</span>
    </div>
    <svg class="stones" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 20 V9 Q6 4 14 7 Q20 3 28 6 Q34 2 42 6 Q49 3 56 7 Q63 2 71 6 Q78 4 86 7 Q92 3 100 6 Q107 2 115 6 Q122 4 129 7 Q136 2 144 6 Q151 3 158 7 Q165 2 173 6 Q180 4 188 7 Q194 3 200 6 V20 Z" fill="#6E6A60"/>
      <path d="M0 20 V14 Q8 10 17 13 Q24 9 33 12 Q41 9 49 13 Q57 10 66 13 Q74 9 83 12 Q91 10 99 13 Q108 9 117 12 Q125 10 133 13 Q142 9 151 12 Q159 10 167 13 Q176 9 185 12 Q193 10 200 12 V20 Z" fill="#57534B"/>
      <path d="M14 7 Q13 12 17 13 M42 6 Q40 11 49 13 M71 6 Q70 11 66 13 M100 6 Q98 10 99 13 M129 7 Q128 11 133 13 M158 7 Q156 11 151 12 M188 7 Q186 11 185 12" fill="none" stroke="#3E3B35" stroke-width=".5"/>
    </svg>
  </div>
</div>
</body>
</html>
