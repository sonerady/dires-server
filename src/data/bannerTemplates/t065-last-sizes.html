<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Last Sizes — final clearance as a stock sheet: the size run crossed out chip by chip, the survivors highlighted */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F4F3EF; }
  .banner { --pw: 52%; --chip: 12vmin; position: fixed; inset: 0; overflow: hidden; background: #F4F3EF; color: #111; font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace; }
  .photo { position: absolute; left: 0; top: 0; width: var(--pw); height: 100%; object-fit: cover; object-position: 50% 22%; }
  .rail { position: absolute; left: var(--pw); top: 0; width: 4.4vmin; height: 100%; background: #111; overflow: hidden; }
  .rail span { position: absolute; left: 50%; top: 0; transform-origin: 0 0; transform: rotate(90deg) translateY(-50%); white-space: nowrap; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 2.6vmin; letter-spacing: .3em; color: #F0E23C; line-height: 1; padding-left: 3vmin; }
  .col { position: absolute; left: calc(var(--pw) + 4.4vmin + 4.6vmin); right: 4.6vmin; top: 5vmin; bottom: 5vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .kick { display: flex; justify-content: space-between; font-size: 1.7vmin; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding-bottom: 1.4vmin; border-bottom: 1px solid #111; }
  h1 { margin: 2.4vmin 0 0; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 15.5vmin; line-height: .84; letter-spacing: -.005em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.6vmin; }
  .c { position: relative; height: var(--chip); border: .3vmin solid #111; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 6vmin; line-height: 1; color: #9A9892; border-color: #BDBBB4; }
  .c svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .c.on { background: #111; border-color: #111; color: #F0E23C; }
  .c.on small { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 1.6vmin; letter-spacing: .12em; color: #F4F3EF; margin-top: .8vmin; text-transform: uppercase; }
  .deal { display: block; }
  .pct { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 15vmin; line-height: .8; letter-spacing: -.01em; white-space: nowrap; padding-bottom: 1.4vmin; }
  .pct mark { background: linear-gradient(transparent 55%, #F0E23C 55%, #F0E23C 92%, transparent 92%); color: inherit; padding: 0 .5vmin; }
  .note { font-size: 2vmin; line-height: 1.45; margin-top: 2vmin; }
  .cta { display: flex; justify-content: space-between; align-items: center; background: #111; color: #F4F3EF; padding: 2vmin 2.4vmin; font-size: 1.9vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .cta b { color: #F0E23C; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --pw: 50%; --chip: 9.4vmin; }
    h1 { font-size: 13vmin; margin-top: 2vmin; }
    .c { font-size: 5vmin; }
    .pct { font-size: 14.5vmin; }
    .note { font-size: 1.8vmin; margin-top: 1.4vmin; }
    .cta { padding: 1.7vmin 2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --pw: 48%; --chip: 10vmin; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 1.4vmin; }
    h1 { font-size: 11.5vmin; }
    .c { font-size: 4.8vmin; }
    .pct { font-size: 16vmin; }
    .note { margin-top: 1vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --pw: 48%; --chip: 11vmin; }
    .col { left: calc(var(--pw) + 4.4vmin + 6vmin); right: 6vmin; top: 6vmin; bottom: 6vmin; }
    .grid { grid-template-columns: repeat(6, 1fr); gap: 1.2vmin; }
    h1 { font-size: 13vmin; }
    h1 br { display: none; }
    .c { font-size: 4.6vmin; }
    .c.on small { font-size: 1.6vmin; letter-spacing: .06em; }
    .deal { display: flex; align-items: flex-end; gap: 4vmin; }
    .pct { font-size: 19vmin; }
    .note { margin: 0 0 .6vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="rail"><span>LAST CALL ● FINAL CLEARANCE ● LAST CALL ● FINAL CLEARANCE ● LAST CALL ● FINAL CLEARANCE ● LAST CALL ●</span></div>
  <div class="col">
    <div>
      <div class="kick"><span>Final clearance</span><span>Stock 03/26</span></div>
      <h1>Last<br> sizes</h1>
    </div>
    <div class="grid">
      <div class="c">XS<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L100 100 M100 0 L0 100" stroke="#111" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg></div>
      <div class="c">S<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L100 100 M100 0 L0 100" stroke="#111" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg></div>
      <div class="c on">M<small>1 left</small></div>
      <div class="c">L<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L100 100 M100 0 L0 100" stroke="#111" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg></div>
      <div class="c on">XL<small>2 left</small></div>
      <div class="c">XXL<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L100 100 M100 0 L0 100" stroke="#111" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg></div>
    </div>
    <div class="deal">
      <div class="pct"><mark>−70%</mark></div>
      <div class="note">Final reductions.<br>No restocks, no rain checks.</div>
    </div>
    <div class="cta"><span>Shop last sizes</span><b>→</b></div>
  </div>
</div>
</body>
</html>
