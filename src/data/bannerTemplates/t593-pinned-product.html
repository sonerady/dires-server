<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Pinned Product — the moment a host pins an item in a live shopping stream: the photo is the stream,
     and a white "pinned" card (thumbnail crop, name, price, stock meter, Buy) sits just under it.
     tall / 3:4 → header · headline · stream · pinned card · square / wide → stream left, headline + card right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EFE8DF; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #231E1A; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #F4EEE6 0%, #E9E0D4 100%);
    display: flex; flex-direction: column; padding: 5vmin 6vmin 5vmin; box-sizing: border-box; }

  .head { flex: none; display: flex; align-items: center; gap: 1.6vmin; }
  .brand { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 3.2vmin; letter-spacing: -.01em; white-space: nowrap; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 1vmin; padding: .9vmin 1.6vmin; border-radius: 99vmin; background: #231E1A; color: #F4EEE6;
    font-size: 1.7vmin; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
  .live i { width: 1.1vmin; height: 1.1vmin; border-radius: 50%; background: #FF4A2E; }
  h1 { flex: none; margin: 3vmin 0 0; font-family: "Fraunces", Georgia, serif; font-weight: 300; font-size: 8.4vmin; line-height: .98; letter-spacing: -.03em; }
  h1 i { font-weight: 400; color: #C2461F; }

  .sub { flex: none; margin-top: 1.8vmin; max-width: 70vmin; font-size: 2vmin; line-height: 1.45; color: #6E655C; }
  .queue { display: none; }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 3.6vmin; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; display: block; }

  .side { flex: none; }
  .card { position: relative; margin-top: 3.4vmin; background: #FFFDFA; border-radius: 2.2vmin; padding: 2.2vmin; display: flex; align-items: center; gap: 2.4vmin;
    box-shadow: 0 1.6vmin 4vmin rgba(60,40,20,.14), 0 .2vmin .6vmin rgba(60,40,20,.08); }
  .card::before { content: ""; position: absolute; left: 50%; top: -1.4vmin; width: 3vmin; height: 3vmin; background: #FFFDFA; transform: translateX(-50%) rotate(45deg); border-radius: .4vmin; }
  .thumb { position: relative; flex: none; width: 14vmin; height: 14vmin; overflow: hidden; background: #E9E0D4; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; display: block; }
  .info { position: relative; flex: 1 1 auto; min-width: 0; }
  .pin { display: flex; align-items: center; gap: .8vmin; font-size: 1.6vmin; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #C2461F; white-space: nowrap; }
  .pin svg { width: 2vmin; height: 2vmin; display: block; }
  .name { margin-top: .8vmin; font-size: 2.6vmin; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .price { margin-top: .6vmin; font-size: 3.2vmin; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .price s { margin-left: .8vmin; font-size: 1.8vmin; font-weight: 500; color: #9A8F84; }
  .stock { margin-top: 1.2vmin; display: flex; align-items: center; gap: 1.2vmin; font-size: 1.6vmin; font-weight: 600; color: #6E655C; white-space: nowrap; }
  .stock i { display: block; width: 12vmin; height: .8vmin; border-radius: 99vmin; background: linear-gradient(90deg, #FF4A2E 0 18%, #EADFD3 18% 100%); }
  .buy { position: relative; flex: none; padding: 2.2vmin 3.4vmin; border-radius: 99vmin; background: #FF4A2E; color: #fff; font-size: 2.2vmin; font-weight: 800; white-space: nowrap; }
  .small { margin-top: 2.6vmin; font-size: 1.7vmin; color: #7C7268; letter-spacing: .02em; }

  @media (min-aspect-ratio: 7/10) {
    .banner { padding: 4.4vmin 6vmin 4.4vmin; }
    h1 { font-size: 7.2vmin; margin-top: 2.4vmin; }
    .sub { margin-top: 1.4vmin; }
    .stage { margin-top: 3vmin; }
    .card { margin-top: 3vmin; }
    .thumb { width: 12vmin; height: 12vmin; }
  }
  /* ── square: stream left, headline + card right ── */
  @media (min-aspect-ratio: 9/10) {
    .banner { display: block; padding: 0; }
    .stage { position: absolute; left: 5vmin; top: 5vmin; bottom: 5vmin; width: 46%; height: auto; margin: 0; }
    .head { position: absolute; left: calc(46% + 10vmin); right: 5vmin; top: 5.4vmin; }
    h1 { position: absolute; left: calc(46% + 10vmin); right: 5vmin; top: 13vmin; margin: 0; font-size: 7vmin; }
    .sub { position: absolute; left: calc(46% + 10vmin); right: 5vmin; top: 31vmin; margin: 0; font-size: 1.8vmin; }
    .queue { display: flex; flex-wrap: wrap; align-items: center; gap: 1.2vmin 1vmin; position: absolute; left: calc(46% + 10vmin); right: 5vmin; top: 43vmin; }
    .queue span { flex-basis: 100%; font-size: 1.6vmin; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #9A8F84; white-space: nowrap; }
    .queue i { font-style: normal; width: 4.2vmin; height: 4.2vmin; border-radius: 50%; display: grid; place-items: center; border: 1px solid #CFC3B5; font-size: 1.6vmin; font-weight: 700; color: #6E655C; }
    .queue i.on { background: #FF4A2E; border-color: #FF4A2E; color: #fff; }
    .side { position: absolute; left: calc(46% + 10vmin); right: 5vmin; bottom: 5vmin; }
    .card { flex-wrap: wrap; gap: 2vmin; padding: 2.4vmin; }
    .card::before { left: -1.2vmin; top: 6vmin; transform: rotate(45deg); }
    .thumb { width: 11vmin; height: 11vmin; }
    .info { flex: 1 1 18vmin; }
    .name { white-space: normal; line-height: 1.15; }
    .buy { flex: 1 1 100%; text-align: center; }
    .stock i { width: 8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .stage { left: 6vmin; top: 6vmin; bottom: 6vmin; width: 44%; }
    .head { left: calc(44% + 13vmin); right: 7vmin; top: 7vmin; }
    h1 { left: calc(44% + 13vmin); right: 7vmin; top: 16vmin; font-size: 8.4vmin; }
    .sub { left: calc(44% + 13vmin); right: 7vmin; top: 37vmin; font-size: 2vmin; }
    .queue { left: calc(44% + 13vmin); right: 7vmin; top: 49vmin; }
    .side { left: calc(44% + 13vmin); right: 7vmin; bottom: 6vmin; }
    .card { flex-wrap: nowrap; gap: 2.4vmin; }
    .thumb { width: 13vmin; height: 13vmin; }
    .name { white-space: nowrap; }
    .buy { flex: none; }
    .stock i { width: 10vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="head"><div class="brand">Hollis &amp; Rue</div><div class="live"><i></i>LIVE · 2.8K</div></div>
  <h1>Shop it while it's <i>on&nbsp;screen.</i></h1>
  <div class="sub">The host pins each piece as it's styled — tap the card to buy without leaving the live.</div>
  <div class="queue"><span>In this stream</span><i>01</i><i>02</i><i class="on">03</i><i>04</i><i>05</i><i>06</i></div>
  <div class="stage"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="side">
    <div class="card">
      <div class="thumb"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
      <div class="info">
        <div class="pin"><svg viewBox="0 0 24 24" fill="#C2461F"><path d="M15 2l7 7-2 1-3.5 3.5L17 18l-1.5 1.5-4-4L5 22l-1-1 6.5-6.5-4-4L8 9l4.5.5L16 6l1-2z"/></svg>Pinned by host</div>
        <div class="name">The Everyday Piece</div>
        <div class="price">$74<s>$98</s></div>
        <div class="stock"><i></i>Only 9 left</div>
      </div>
      <div class="buy">Buy now</div>
    </div>
    <div class="small">Live price ends when the stream does · free 30-day returns</div>
  </div>
</div>
</body>
</html>
