<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Collector Shelf — a collector's display wall: LED-lit cubbies with oak shelf lips and brass
     plaques. The grail sits in the big case; two detail crops of the same piece fill the small
     cases and the last one is left empty, "reserved" for the next pair. Archive-sale copy.
     tall → big case on top, small cases + copy below; square/wide → big case left, rest right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1B1A18; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #F1ECE2; font-family: "Geist Mono", Menlo, monospace;
    background: radial-gradient(120vmin 80vmin at 50% 0%, #272521 0%, #1B1A18 70%); }
  .hdr { position: absolute; left: 5vmin; right: 5vmin; top: 3.6vmin; display: flex; justify-content: space-between; font-size: 1.7vmin; letter-spacing: .14em; text-transform: uppercase; color: #BDB5A6; white-space: nowrap; }
  .hdr b { color: #D6B26A; font-weight: 600; }
  .cub { position: absolute; box-sizing: border-box; background: #2A2825; padding: 1.8vmin 1.8vmin 0; border-bottom: 1.6vmin solid #B8946A;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), inset 0 -2vmin 3vmin rgba(0,0,0,.45), 0 1.4vmin 2.4vmin rgba(0,0,0,.45); }
  .cub::before { content: ""; position: absolute; left: 1.8vmin; right: 1.8vmin; top: .7vmin; height: .45vmin; background: #FFF6E4; box-shadow: 0 0 1.4vmin .4vmin rgba(255,238,205,.55); z-index: 2; }
  .cub::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1.6vmin; height: .4vmin; background: #D9BE92; }
  .cub .in { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .cub img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .big { left: 5vmin; right: 5vmin; top: 9vmin; height: calc(100% - 91vmin); }
  .big img { object-position: 50% 20%; }
  .plaque { position: absolute; left: 50%; top: calc(100% + 2.8vmin); transform: translateX(-50%); padding: .7vmin 1.6vmin; background: linear-gradient(180deg, #E2C487 0%, #B8914B 100%); color: #2A2010; font-size: 1.6vmin; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.5); }
  .smalls { position: absolute; left: 5vmin; right: 5vmin; bottom: 44vmin; height: 26vmin; }
  .smalls .cub { top: 0; bottom: 0; width: calc((100% - 6vmin) / 3); }
  .s1 { left: 0; } .s2 { left: calc((100% - 6vmin) / 3 + 3vmin); } .s3 { right: 0; }
  .s1 img { transform: scale(2.2); transform-origin: 50% 30%; object-position: 50% 30%; }
  .s2 img { transform: scale(2.4); transform-origin: 50% 72%; object-position: 50% 70%; }
  .s3 .in { border: .3vmin dashed rgba(241,236,226,.35); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 1.6vmin; letter-spacing: .1em; text-transform: uppercase; color: #BDB5A6; line-height: 1.5; }
  .s3 .in b { display: block; font-family: "Syne", sans-serif; font-weight: 700; font-size: 4vmin; color: #D6B26A; letter-spacing: 0; line-height: 1; margin-bottom: .6vmin; }
  .smalls .plaque { top: calc(100% + 2.4vmin); font-size: 1.6vmin; padding: .5vmin 1.2vmin; letter-spacing: .06em; }
  .txt { position: absolute; left: 5vmin; right: 5vmin; bottom: 5vmin; }
  h1 { margin: 0; font-family: "Syne", "Helvetica Neue", sans-serif; font-weight: 800; font-size: 8.8vmin; line-height: .92; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: #D6B26A; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 3vmin; margin-top: 3vmin; padding-top: 2.4vmin; border-top: 1px solid rgba(241,236,226,.25); }
  .offer { font-size: 1.8vmin; letter-spacing: .1em; text-transform: uppercase; color: #BDB5A6; line-height: 1.5; white-space: nowrap; }
  .offer strong { display: block; font-family: "Syne", sans-serif; font-weight: 700; font-size: 3.6vmin; letter-spacing: -.01em; text-transform: none; color: #F1ECE2; }
  .cta { flex: none; border: .3vmin solid #D6B26A; color: #D6B26A; padding: 1.6vmin 2.4vmin; font-size: 1.9vmin; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }

  /* 2:3 → shorter copy block, bigger case */
  @media (min-aspect-ratio: 3/5) {
    .big { height: calc(100% - 80vmin); }
    .smalls { bottom: 41vmin; height: 20vmin; }
    .txt { bottom: 4.4vmin; }
    h1 { font-size: 8vmin; }
    .row { margin-top: 2.4vmin; padding-top: 2vmin; }
  }
  /* 3:4 / 4:5 → big case left, a column of small cases + copy right */
  @media (min-aspect-ratio: 7/10) {
    .hdr { left: 4vmin; right: 4vmin; }
    .big { left: 4vmin; right: auto; width: calc(58% - 6vmin); top: 9vmin; height: calc(100% - 22vmin); }
    .smalls { left: auto; right: 4vmin; width: calc(42% - 6vmin); top: 9vmin; bottom: auto; height: 68vmin; }
    .smalls .cub { left: 0; right: 0; width: auto; height: 17vmin; top: auto; bottom: auto; }
    .s1 { top: 0 !important; } .s2 { top: 25vmin !important; } .s3 { top: 50vmin !important; }
    .smalls .plaque { top: calc(100% + 2.2vmin); }
    .txt { left: auto; right: 4vmin; width: calc(42% - 6vmin); bottom: 4vmin; }
    h1 { font-size: 6.2vmin; }
    .row { flex-direction: column; align-items: stretch; gap: 2vmin; margin-top: 2.4vmin; padding-top: 2vmin; }
    .offer strong { font-size: 3vmin; }
    .cta { text-align: center; padding: 1.4vmin 1.6vmin; font-size: 1.7vmin; }
  }
  /* square */
  @media (min-aspect-ratio: 9/10) {
    .big { width: calc(52% - 6vmin); }
    .smalls { width: calc(48% - 6vmin); height: 22vmin; }
    .smalls .cub { top: 0 !important; bottom: 0; height: auto; width: calc((100% - 3vmin) / 2); }
    .s1 { left: 0 !important; right: auto !important; } .s2 { left: auto !important; right: 0 !important; } .s3 { display: none; }
    .smalls .plaque { font-size: 1.6vmin; }
    .txt { width: calc(48% - 6vmin); }
    h1 { font-size: 6.6vmin; }
  }
  /* wide → three small cases across */
  @media (min-aspect-ratio: 6/5) {
    .hdr { left: 5vmin; right: 5vmin; }
    .big { left: 5vmin; width: calc(46% - 7vmin); }
    .smalls { right: 5vmin; width: calc(54% - 8vmin); height: 26vmin; }
    .smalls .cub { width: calc((100% - 6vmin) / 3); }
    .s1 { left: 0 !important; } .s2 { left: calc((100% - 6vmin) / 3 + 3vmin) !important; right: auto !important; } .s3 { display: block; left: auto !important; right: 0 !important; }
    .txt { right: 5vmin; width: calc(54% - 8vmin); bottom: 5vmin; }
    h1 { font-size: 8.4vmin; }
    .row { flex-direction: row; align-items: center; }
    .offer strong { font-size: 3.4vmin; }
    .cta { font-size: 1.9vmin; padding: 1.6vmin 2.4vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="hdr"><span>The collector’s wall</span><span>Archive <b>Nº 01—03</b></span></div>
  <div class="cub big"><div class="in"><img src="{{PRODUCT_IMAGE}}" alt=""></div><span class="plaque">Nº 01 · The grail · SS26</span></div>
  <div class="smalls">
    <div class="cub s1"><div class="in"><img src="{{PRODUCT_IMAGE}}" alt=""></div><span class="plaque">Nº 02 · Detail</span></div>
    <div class="cub s2"><div class="in"><img src="{{PRODUCT_IMAGE}}" alt=""></div><span class="plaque">Nº 03 · Detail</span></div>
    <div class="cub s3"><div class="in"><b>+1</b>Reserved<br>for yours</div><span class="plaque">Nº 04 · Open</span></div>
  </div>
  <div class="txt">
    <h1>Make room on <em>the shelf.</em></h1>
    <div class="row">
      <div class="offer">Archive sale<strong>Up to 40% off</strong></div>
      <div class="cta">Shop the archive →</div>
    </div>
  </div>
</div>
</body>
</html>
