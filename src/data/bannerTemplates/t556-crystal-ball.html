<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Crystal Ball — a fortune-teller's parlour in plum velvet: draped curtain folds, a glowing crystal orb on a brass
     stand with a blurred reflection of the product swimming inside, and a "your future looks well-dressed" reading.
     tall → photo on top, orb + copy below · 3:4 → photo left, orb over copy right · square → orb + copy left,
     photo right · wide → copy + orb left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #2A1433; }
  .banner { --txt: #F5E9F1; --lilac: #D3BDF2; --brass: #C9A45C; --D: 30vmin;
    position: fixed; inset: 0; overflow: hidden; color: var(--txt); font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0, rgba(255,255,255,.035) 3.5vmin, rgba(0,0,0,.18) 7vmin, rgba(0,0,0,.28) 9vmin),
      radial-gradient(ellipse 70% 55% at 30% 75%, #4B2560 0%, #341943 50%, #22102B 100%); }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 62vmin); object-fit: cover; object-position: 50% 26%; display: block; box-shadow: 0 2vmin 6vmin rgba(10,0,16,.5); }

  .seer { position: absolute; left: 7vmin; bottom: 9vmin; width: var(--D); height: calc(var(--D) * 1.26); }
  .glow { position: absolute; left: 50%; top: calc(var(--D) / 2); width: calc(var(--D) * 1.9); height: calc(var(--D) * 1.9); transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(211,189,242,.42), rgba(211,189,242,.12) 55%, transparent); }
  .orb { position: absolute; left: 0; top: 0; width: var(--D); height: var(--D); border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 60%, #6E4B8E 0%, #3A2150 70%, #251332 100%);
    box-shadow: inset 0 0 0 1px rgba(245,233,241,.35), 0 0 5vmin rgba(211,189,242,.35); }
  .orb img { position: absolute; left: -15%; top: -15%; width: 130%; height: 130%; object-fit: cover; object-position: 50% 30%; filter: blur(1.4vmin) saturate(1.3); opacity: .75; }
  .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(ellipse 26% 16% at 34% 24%, rgba(255,255,255,.75), transparent),
      radial-gradient(circle at 50% 50%, transparent 52%, rgba(34,10,48,.6) 100%),
      radial-gradient(ellipse 60% 22% at 50% 88%, rgba(211,189,242,.35), transparent); }
  .stand { position: absolute; left: 18%; right: 18%; top: calc(var(--D) * .9); height: calc(var(--D) * .36);
    background: linear-gradient(90deg, #7A5A26, #E7C98A 35%, #C9A45C 55%, #6E4E1E);
    clip-path: polygon(22% 0, 78% 0, 70% 38%, 100% 100%, 0 100%, 30% 38%); }

  .copy { position: absolute; left: 44vmin; right: 6vmin; bottom: 8vmin; display: flex; flex-direction: column; align-items: flex-start; }
  .kick { font-size: 1.6vmin; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--lilac); white-space: nowrap; }
  h1 { margin: 1.8vmin 0 0; font-family: "Italiana", Didot, serif; font-weight: 400; font-size: 7.6vmin; line-height: 1; letter-spacing: .01em; }
  h1 i { font-style: normal; color: var(--lilac); }
  .sub { margin-top: 1.8vmin; font-size: 2vmin; line-height: 1.45; color: #D9C8D8; }
  .offer { margin-top: 2.6vmin; display: flex; align-items: baseline; gap: 1.4vmin; font-size: 1.7vmin; letter-spacing: .1em; text-transform: uppercase; color: #D9C8D8; white-space: nowrap; }
  .offer b { font-family: "Italiana", serif; font-weight: 400; font-size: 5vmin; letter-spacing: 0; color: var(--txt); }
  .cta { margin-top: 2.2vmin; padding: 1.6vmin 3.2vmin; border-radius: 99vmin; background: linear-gradient(90deg, #E7C98A, #C9A45C); color: #2A1433; font-size: 1.7vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .fine { margin-top: 1.6vmin; font-size: 1.6vmin; color: #A68FA6; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --D: 26vmin; }
    .photo { width: 50vmin; height: 100%; }
    .seer { left: auto; right: calc(25vmin - var(--D) / 2); top: 8vmin; bottom: auto; }
    .copy { left: 56vmin; right: 5vmin; bottom: 6vmin; }
    h1 { font-size: 6vmin; }
    .sub { font-size: 1.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --D: 24vmin; }
    .photo { left: auto; right: 0; width: 48%; }
    .seer { left: 7vmin; right: auto; top: 7vmin; }
    .copy { left: 7vmin; right: calc(48% + 6vmin); bottom: 6vmin; }
    h1 { font-size: 6.4vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --D: 26vmin; }
    .photo { width: 40%; }
    .seer { left: calc(30% - var(--D) / 2); right: auto; top: 7vmin; bottom: auto; }
    .copy { left: 6vmin; right: calc(40% + 6vmin); top: auto; bottom: 7vmin; align-items: center; text-align: center; }
    h1 { font-size: 7.4vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="seer">
    <div class="glow"></div>
    <div class="stand"></div>
    <div class="orb"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  </div>
  <div class="copy">
    <div class="kick">Madame Oriel · Future edit</div>
    <h1>The future looks<br><i>well&#8209;dressed.</i></h1>
    <div class="sub">Every order reveals a hidden gift.</div>
    <div class="offer"><b>−35%</b>foretold, until 31 Oct</div>
    <div class="cta">Reveal my fortune</div>
    <div class="fine">Free returns · no crystal required</div>
  </div>
</div>
</body>
</html>
