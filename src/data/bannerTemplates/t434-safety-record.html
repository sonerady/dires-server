<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Safety Record — the factory-floor record board, repurposed: "this floor has worked 364 days without a sale",
     on black flip tiles, a red "record ends today" plate for the offer, yellow/black hazard chevrons on the seam
     and a painted walkway line carrying the CTA. tall / 3:4 → photo above; square / wide → photo left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #17563A; }
  .banner { --P: 82vmin; --t: 1vmin; position: fixed; inset: 0; overflow: hidden; color: #F4F3EC; font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
    background: radial-gradient(120% 70% at 30% 40%, #1C6443 0%, #17563A 55%, #124630 100%); }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--P)); object-fit: cover; object-position: 50% 22%; display: block; }
  .haz { position: absolute; left: 0; right: 0; top: calc(100% - var(--P)); height: 4.4vmin; z-index: 2;
    background: repeating-linear-gradient(-45deg, #F2C21B 0 3vmin, #141414 3vmin 6vmin); box-shadow: 0 .6vmin 1.2vmin rgba(0,0,0,.35); }

  .board { position: absolute; left: 0; right: 0; bottom: 9.5vmin; height: calc(var(--P) - 4.4vmin - 9.5vmin); box-sizing: border-box; padding: 4.6vmin 6vmin 3vmin; display: flex; flex-direction: column; justify-content: center; }
  .pre { display: flex; justify-content: space-between; align-items: baseline; font-weight: 500; font-size: 3.4vmin; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .pre small { font-family: "Roboto Mono", Menlo, monospace; font-weight: 500; font-size: 1.7vmin; letter-spacing: .1em; color: #BFD8C7; }
  .rec { margin-top: 2.2vmin; display: flex; align-items: center; gap: 3.4vmin; }
  .tiles { display: flex; gap: calc(var(--t) * 1.2); flex: none; }
  .tile { position: relative; width: calc(var(--t) * 17); height: calc(var(--t) * 24); background: linear-gradient(180deg, #232323 0 49.4%, #0B0B0B 49.4% 50.6%, #1A1A1A 50.6% 100%);
    border-radius: calc(var(--t) * .8); box-shadow: 0 calc(var(--t) * .8) calc(var(--t) * 1.6) rgba(0,0,0,.45), inset 0 0 0 calc(var(--t) * .3) rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: calc(var(--t) * 20); line-height: 1; color: #F7F6EF; overflow: hidden; }
  .tile::before, .tile::after { content: ""; position: absolute; top: 50%; width: calc(var(--t) * .9); height: calc(var(--t) * 3); margin-top: calc(var(--t) * -1.5); background: #3A3A3A; border-radius: calc(var(--t) * .3); }
  .tile::before { left: calc(var(--t) * -.3); } .tile::after { right: calc(var(--t) * -.3); }
  .tile i { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.9); }
  .unit { font-weight: 600; font-size: 5.6vmin; line-height: .95; letter-spacing: .02em; text-transform: uppercase; }
  .unit em { font-style: normal; color: #F2C21B; }

  .plate { margin-top: 3.6vmin; align-self: flex-start; display: flex; align-items: center; gap: 2.4vmin; background: #D2372A; color: #FFF7EE; padding: 1.6vmin 2.6vmin 1.6vmin 2.2vmin; transform: rotate(-1.5deg);
    box-shadow: 0 .6vmin 1.4vmin rgba(0,0,0,.35); position: relative; }
  .plate::before, .plate::after { content: ""; position: absolute; top: 50%; width: 1.2vmin; height: 1.2vmin; margin-top: -.6vmin; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4F4F4, #8C8C8C 70%); }
  .plate::before { left: .7vmin; } .plate::after { right: .7vmin; }
  .plate b { font-weight: 700; font-size: 6.4vmin; line-height: 1; letter-spacing: .01em; padding-left: 1vmin; }
  .plate span { font-weight: 500; font-size: 2.4vmin; line-height: 1.15; letter-spacing: .1em; text-transform: uppercase; }
  .info { margin-top: 3vmin; display: flex; gap: 3vmin; font-family: "Roboto Mono", Menlo, monospace; font-size: 1.9vmin; letter-spacing: .06em; text-transform: uppercase; color: #CFE3D5; white-space: nowrap; }
  .info b { color: #F4F3EC; font-weight: 700; }

  /* concrete floor with a painted walkway line */
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 9.5vmin; box-sizing: border-box; padding: 0 6vmin; display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #5E605C 0%, #6B6D68 100%); white-space: nowrap; }
  .floor::before { content: ""; position: absolute; left: 0; right: 0; top: 1.4vmin; height: 1.3vmin; background: #F2C21B; }
  .floor .cta { position: relative; margin-top: 2.2vmin; font-weight: 700; font-size: 3.2vmin; letter-spacing: .14em; text-transform: uppercase; color: #FFFFFF; }
  .floor small { position: relative; margin-top: 2.2vmin; font-family: "Roboto Mono", Menlo, monospace; font-size: 1.7vmin; letter-spacing: .12em; text-transform: uppercase; color: #E6E6E0; }

  /* 3:4 / 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .banner { --P: 70vmin; --t: .8vmin; }
    .board { padding: 3.6vmin 6vmin 2vmin; }
    .pre { font-size: 2.9vmin; }
    .unit { font-size: 4.8vmin; }
    .plate { margin-top: 2.8vmin; }
    .plate b { font-size: 5.4vmin; }
    .plate span { font-size: 2.1vmin; }
    .info { margin-top: 2.4vmin; }
    .floor { height: 8.5vmin; }
    .board { bottom: 8.5vmin; height: calc(var(--P) - 4.4vmin - 8.5vmin); }
  }
  /* square → photo left, hazard band down the seam */
  @media (min-aspect-ratio: 9/10) {
    .banner { --t: .74vmin; }
    .photo { width: 46%; height: 100%; object-position: 50% 24%; }
    .haz { top: 0; bottom: 0; left: 46%; right: auto; width: 4.4vmin; height: auto; }
    .board { left: calc(46% + 4.4vmin); top: 0; bottom: 8.5vmin; height: auto; padding: 5vmin 4.6vmin 2vmin; }
    .pre { font-size: 2.6vmin; }
    .pre small { display: none; }
    .board { justify-content: space-between; padding: 6vmin 4.6vmin 4.4vmin; }
    .pre { font-size: 3vmin; white-space: normal; line-height: 1.15; }
    .rec { margin-top: 0; flex-direction: column; align-items: flex-start; gap: 3vmin; }
    .unit { font-size: 6.4vmin; line-height: .92; }
    .plate { margin-top: 0; gap: 1.8vmin; padding: 1.5vmin 2.4vmin 1.5vmin 2vmin; }
    .plate b { font-size: 6vmin; }
    .plate span { font-size: 2vmin; }
    .info { margin-top: 0; flex-direction: column; gap: 1.2vmin; font-size: 1.8vmin; }
    .floor { left: calc(46% + 4.4vmin); padding: 0 4.6vmin; }
    .floor small { display: none; }
    .floor .cta { font-size: 2.8vmin; }
  }
  /* wide */
  @media (min-aspect-ratio: 6/5) {
    .banner { --t: .84vmin; }
    .photo { width: 44%; object-position: 50% 30%; }
    .haz { left: 44%; }
    .board { left: calc(44% + 4.4vmin); padding: 6vmin 6vmin 4.4vmin; }
    .pre small { display: inline; }
    .pre { font-size: 3.2vmin; white-space: nowrap; }
    .rec { margin-top: 3vmin; flex-direction: row; align-items: center; gap: 3vmin; }
    .unit { font-size: 5.2vmin; }
    .plate { margin-top: 4.4vmin; }
    .plate b { font-size: 6.4vmin; }
    .plate span { font-size: 2.2vmin; }
    .info { flex-direction: row; gap: 3vmin; margin-top: 3.4vmin; }
    .floor { left: calc(44% + 4.4vmin); padding: 0 6vmin; }
    .floor small { display: inline; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="haz"></div>
  <div class="board">
    <div class="pre"><span>This floor has worked</span><small>Board Nº 7</small></div>
    <div class="rec">
      <div class="tiles"><div class="tile">3<i></i></div><div class="tile">6<i></i></div><div class="tile">4<i></i></div></div>
      <div class="unit">Days<br> without<br> <em>a sale.</em></div>
    </div>
    <div class="plate"><b>−30%</b><span>Record ends<br>today</span></div>
    <div class="info"><span>Code <b>FLOOR30</b></span><span>72 hours only</span><span>Prev. best 363</span></div>
  </div>
  <div class="floor"><span class="cta">Shop the floor →</span><small>Atelier Nord Works</small></div>
</div>
</body>
</html>
