<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Mood Ring — the paper colour chart that came in a 70s mood-ring box: a cream card on a thermochromic,
     oil-slick backdrop, six glossy stone swatches with their moods, flared-serif headline and the offer.
     tall / 3:4 → photo on top, chart card below · square / wide → photo left, chart card on the right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1B2E6B; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #2A2340; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(70vmin 60vmin at 12% 88%, rgba(43,179,163,.95) 0%, rgba(43,179,163,0) 70%),
      radial-gradient(80vmin 70vmin at 92% 70%, rgba(123,63,181,.95) 0%, rgba(123,63,181,0) 70%),
      radial-gradient(60vmin 50vmin at 55% 100%, rgba(224,165,58,.9) 0%, rgba(224,165,58,0) 70%),
      radial-gradient(90vmin 70vmin at 40% 55%, rgba(46,98,201,.9) 0%, rgba(46,98,201,0) 75%),
      #1B2E6B; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 72vmin); object-fit: cover; object-position: 50% 20%; display: block; }
  .card { position: absolute; left: 5vmin; right: 5vmin; bottom: 5vmin; height: 62vmin; box-sizing: border-box; padding: 5vmin 5vmin 4.4vmin; display: flex; flex-direction: column;
    background: #F6EEDF; border-radius: 1.4vmin; box-shadow: 0 1.6vmin 4vmin rgba(15,12,40,.4), inset 0 0 0 .8vmin #F6EEDF, inset 0 0 0 1px #B8923A, inset 0 0 0 1.1vmin #F6EEDF, inset 0 0 0 calc(1.1vmin + 1px) #B8923A; }
  .k { width: fit-content; font-size: 1.8vmin; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #8A6A22; white-space: nowrap; }
  h1 { width: fit-content; margin: 2.2vmin 0 0; font-family: "Chonburi", Georgia, serif; font-weight: 400; font-size: 7.4vmin; line-height: 1.02; letter-spacing: -.01em; color: #2A2340; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #1E9C9A, #2E62C9 50%, #7B3FB5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .d { margin-top: 2.2vmin; font-size: 2.4vmin; font-weight: 500; line-height: 1.42; color: #4A4260; max-width: 64vmin; }
  .d b { font-weight: 800; color: #2A2340; }
  .act { margin-top: 2.6vmin; display: flex; align-items: center; gap: 3vmin; }
  .cta { background: #2A2340; color: #F6EEDF; border-radius: 99vmin; padding: 1.7vmin 3.2vmin; font-size: 2.1vmin; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .code { font-size: 1.8vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; color: #4A4260; }
  .code b { color: #7B3FB5; font-weight: 800; }
  /* the ring stone badge */
  .ring { position: absolute; right: 5vmin; top: 5vmin; width: 22vmin; height: 15.4vmin; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FFF8EA; text-align: center;
    background: radial-gradient(ellipse 40% 30% at 32% 26%, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 100%), conic-gradient(from 200deg at 55% 60%, #1E9C9A, #2E62C9, #7B3FB5, #C0306E, #E0A53A, #3FB38A, #1E9C9A);
    box-shadow: 0 0 0 .9vmin #D9B35C, 0 0 0 1.2vmin #8A6A22, 0 1vmin 2vmin rgba(30,20,60,.35), inset 0 -1.2vmin 2vmin rgba(20,10,50,.45); }
  .ring b { font-family: "Chonburi", Georgia, serif; font-weight: 400; font-size: 5.8vmin; line-height: 1; text-shadow: 0 .3vmin .6vmin rgba(20,10,50,.5); }
  .ring small { margin-top: .4vmin; font-size: 1.7vmin; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; text-shadow: 0 .2vmin .4vmin rgba(20,10,50,.5); }
  /* mood key: a row of glossy stones */
  .key { margin-top: auto; border-top: 1px solid rgba(184,146,58,.6); padding-top: 2.4vmin; }
  .key ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2vmin 1vmin; }
  .key li { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 1.7vmin; font-weight: 500; line-height: 1.3; color: #6A6080; white-space: nowrap; }
  .key li b { margin-top: 1.1vmin; font-size: 1.9vmin; font-weight: 800; color: #2A2340; }
  .st { flex: none; width: 5.4vmin; height: 3.8vmin; border-radius: 50%; box-shadow: 0 0 0 .45vmin #D9B35C, 0 0 0 .6vmin #8A6A22, 0 .5vmin .8vmin rgba(0,0,0,.25);
    background: radial-gradient(ellipse 45% 35% at 34% 28%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 100%), radial-gradient(circle at 60% 70%, var(--a) 0%, var(--b) 90%); }
  .s1 { --a: #3A3346; --b: #0E0C12; } .s2 { --a: #F2B24A; --b: #A5561A; } .s3 { --a: #7CC45A; --b: #2D6A26; }
  .s4 { --a: #3FD0C3; --b: #0F6A74; } .s5 { --a: #5A8CF0; --b: #1B3A99; } .s6 { --a: #B27CE8; --b: #4B1F82; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 61vmin); }
    .card { height: 53vmin; bottom: 4vmin; left: 6vmin; right: 6vmin; padding: 4vmin 4.4vmin 3.8vmin; }
    h1 { font-size: 6.4vmin; margin-top: 1.6vmin; }
    .d { font-size: 2.1vmin; margin-top: 1.6vmin; }
    .act { margin-top: 2vmin; }
    .cta { font-size: 1.9vmin; padding: 1.5vmin 2.8vmin; }
    .code { font-size: 1.7vmin; }
    .key { padding-top: 2vmin; }
    .key li { font-size: 1.6vmin; }
    .key li b { font-size: 1.7vmin; margin-top: .9vmin; }
    .st { width: 4.8vmin; height: 3.3vmin; }
    .ring { right: 4.4vmin; top: 4vmin; width: 19vmin; height: 13.3vmin; }
    .ring b { font-size: 5vmin; }
    .ring small { font-size: 1.6vmin; }
  }
  /* square → photo left, chart card right, stones in a 3 × 2 grid */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 24%; }
    .card { left: calc(50% + 4vmin); right: 4vmin; top: 5vmin; bottom: 5vmin; height: auto; padding: 4.6vmin 4vmin 4vmin; justify-content: center; }
    .key { margin-top: 4vmin; }
    .ring { display: none; }
    .k { white-space: normal; line-height: 1.6; font-size: 1.7vmin; }
    h1 { font-size: 6.2vmin; }
    .d { font-size: 2vmin; }
    .act { flex-direction: column; align-items: flex-start; gap: 1.8vmin; }
    .key ul { grid-template-columns: repeat(3, 1fr); gap: 2.4vmin 1vmin; }
    .st { width: 4.6vmin; height: 3.2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .card { left: calc(46% + 5vmin); right: 5vmin; top: 6vmin; bottom: 6vmin; padding: 6vmin 5.4vmin 5vmin; justify-content: flex-start; }
    .key { margin-top: auto; }
    .ring { display: flex; top: auto; right: 5.4vmin; bottom: 21vmin; width: 22vmin; height: 15.4vmin; }
    .k { white-space: nowrap; font-size: 1.8vmin; }
    h1 { font-size: 8.4vmin; margin-top: 2.6vmin; }
    .d { font-size: 2.3vmin; margin-top: 2.6vmin; }
    .act { flex-direction: row; align-items: center; gap: 3vmin; margin-top: 3.4vmin; }
    .cta { font-size: 2vmin; }
    .key ul { grid-template-columns: repeat(6, 1fr); }
    .key li { font-size: 1.6vmin; }
    .key li b { font-size: 1.8vmin; }
    .st { width: 5vmin; height: 3.5vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="card">
    <div class="ring"><b>25%</b><small>off</small></div>
    <div class="k">Aura &amp; Co. · Mood chart</div>
    <h1>Colour me<br><em>mellow.</em></h1>
    <div class="d">Whatever your mood today, take <b>25% off</b> every shade in the colour shop.</div>
    <div class="act"><span class="cta">Find your shade</span><span class="code">Code <b>MOOD25</b></span></div>
    <div class="key">
      <ul>
        <li><i class="st s1"></i><b>Black</b><span>Stormy</span></li>
        <li><i class="st s2"></i><b>Amber</b><span>Restless</span></li>
        <li><i class="st s3"></i><b>Green</b><span>Easygoing</span></li>
        <li><i class="st s4"></i><b>Teal</b><span>Mellow</span></li>
        <li><i class="st s5"></i><b>Blue</b><span>Calm</span></li>
        <li><i class="st s6"></i><b>Violet</b><span>Dreamy</span></li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>
