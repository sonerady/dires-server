<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Show Rosette — the horse-show prize ribbon: a pleated claret rosette (drawn in SVG) with swallow-tail
     ribbons, pinned on hunter-green felt beside the class results. Double gold rule on the seam.
     tall → green panel on top, photo below; square/wide → green panel left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1D3528; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #F1E9D6; font-family: "Lato", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 80% at 20% 10%, #24402F 0%, #1D3528 55%, #172B20 100%); }
  .photo { position: absolute; left: 0; bottom: 0; width: 100%; height: calc(100% - 60vmin); object-fit: cover; object-position: 50% 18%; }
  .seam { position: absolute; left: 0; right: 0; top: 60vmin; height: 1.2vmin; margin-top: -1.2vmin; border-top: .3vmin solid #C8A25A; border-bottom: 1px solid #C8A25A; box-sizing: border-box; }

  .panel { position: absolute; left: 0; right: 0; top: 0; height: 60vmin; box-sizing: border-box; padding: 6vmin 6vmin 7vmin; display: flex; align-items: center; gap: 5vmin; }
  .rosette { flex: none; width: 34vmin; height: 42.5vmin; filter: drop-shadow(0 .8vmin 1.2vmin rgba(0,0,0,.35)); }
  .copy { flex: 1; min-width: 0; }
  .k { font-size: 1.8vmin; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #C8A25A; }
  h1 { margin: 2vmin 0 0; font-family: "Playfair Display", Didot, Georgia, serif; font-weight: 400; font-size: 9.6vmin; line-height: 1; letter-spacing: -.01em; }
  h1 i { font-weight: 400; }
  .lede { margin-top: 2vmin; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 2.7vmin; line-height: 1.35; color: #D9CFB6; }
  .res { margin-top: 3vmin; border-top: 1px solid rgba(200,162,90,.55); }
  .res div { display: flex; justify-content: space-between; gap: 2vmin; padding: 1.1vmin 0; border-bottom: 1px solid rgba(200,162,90,.3); font-size: 1.9vmin; letter-spacing: .08em; white-space: nowrap; }
  .res div span { color: #BDB39A; text-transform: uppercase; letter-spacing: .2em; font-size: 1.7vmin; }
  .res div b { font-weight: 700; }
  .cta { margin-top: 3vmin; display: inline-flex; align-items: center; gap: 2vmin; font-size: 1.9vmin; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; white-space: nowrap; }
  .cta i { display: block; width: 7vmin; height: .25vmin; background: #C8A25A; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 54vmin); }
    .seam { top: 54vmin; }
    .panel { height: 54vmin; padding: 5vmin 6vmin 6vmin; }
    .rosette { width: 30vmin; height: 37.5vmin; }
    h1 { font-size: 8.6vmin; }
    .lede { font-size: 2.4vmin; }
    .res { margin-top: 2.2vmin; }
    .res div { padding: .9vmin 0; }
    .cta { margin-top: 2.4vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; top: 0; width: 52%; height: 100%; object-position: 50% 25%; }
    .seam { top: 0; bottom: 0; left: 48%; right: auto; width: 1.2vmin; height: auto; margin: 0; border-top: 0; border-bottom: 0; border-left: 1px solid #C8A25A; border-right: .3vmin solid #C8A25A; }
    .panel { width: 48%; height: 100%; padding: 6vmin 5vmin 6vmin 6vmin; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3vmin; }
    .rosette { width: 22vmin; height: 27.5vmin; margin-left: -1vmin; }
    .copy { flex: none; width: 100%; }
    h1 { font-size: 7.4vmin; margin-top: 1.6vmin; }
    .lede { font-size: 2.3vmin; }
    .res { margin-top: 2.4vmin; }
    .res div { padding: .9vmin 0; font-size: 1.8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 48%; object-position: 40% 25%; }
    .seam { left: 52%; }
    .panel { width: 52%; padding: 7vmin 6vmin 7vmin 7vmin; flex-direction: row; align-items: center; gap: 5vmin; }
    .rosette { width: 26vmin; height: 32.5vmin; margin: 0; }
    .copy { flex: 1; width: auto; }
    h1 { font-size: 8.6vmin; }
    .lede { font-size: 2.5vmin; }
  }
</style>
</head>
