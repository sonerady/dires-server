<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Grip Cut — a sheet of black grip tape with the headline razor-cut out of it so the maple deck shows through,
     four Phillips bolt heads, stray razor scores, and the offer scrawled on in white paint pen.
     The grip ends in a hand-trimmed edge over a sliver of maple where the photo begins.
     tall → grip above, photo below · square/wide → grip left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1C1C1C; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #1C1C1C; color: #F4F1EA; font-family: "Kalam", "Marker Felt", cursive; }
  .photo { position: absolute; left: 0; bottom: 0; width: 100%; height: calc(100% - 86vmin); object-fit: cover; object-position: 50% 18%; }
  .grip { position: absolute; left: 0; right: 0; top: 0; height: 86vmin; background: #E2BD83; }
  .sheet { position: absolute; inset: 0 0 1.4vmin 0; background: #1C1C1C; overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 88% 99.3%, 71% 100%, 52% 99.5%, 33% 100%, 16% 99.2%, 0 100%); }
  .grit { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scores { position: absolute; inset: 0; width: 100%; height: 100%; }
  .kick { position: absolute; left: 6vmin; right: 6vmin; top: 4.6vmin; display: flex; justify-content: space-between; align-items: baseline; font-size: 2.4vmin; transform: rotate(-1deg); }
  .kick b { font-weight: 700; }
  .cut { position: absolute; left: 5vmin; top: 10vmin; margin: 0; font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 24vmin; line-height: .9; letter-spacing: .005em;
    background: repeating-linear-gradient(98deg, #E9C890 0 1vmin, #DDB272 1vmin 1.4vmin, #EBCF9E 1.4vmin 2.9vmin, #D6A964 2.9vmin 3.2vmin, #E6C489 3.2vmin 4.6vmin);
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 .12vmin #000) drop-shadow(.2vmin .3vmin 0 rgba(0,0,0,.9)); }
  .cut span { display: block; }
  .cut span + span { margin-left: 8vmin; }
  .bolts { position: absolute; right: 7vmin; top: 13vmin; width: 13vmin; height: 20vmin; }
  .bolts i { position: absolute; width: 3.2vmin; height: 3.2vmin; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F2F2F2, #9A9A9A 55%, #5E5E5E); box-shadow: 0 .2vmin .3vmin rgba(0,0,0,.6); }
  .bolts i::before, .bolts i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 1.7vmin; height: .35vmin; background: #3A3A3A; transform: translate(-50%,-50%); }
  .bolts i::after { transform: translate(-50%,-50%) rotate(90deg); }
  .bolts i:nth-child(1) { left: 0; top: 0; } .bolts i:nth-child(2) { right: 0; top: 0; } .bolts i:nth-child(3) { left: 0; bottom: 0; } .bolts i:nth-child(4) { right: 0; bottom: 0; }
  .b2 { display: none; }
  .pen { position: absolute; left: 7vmin; right: 6vmin; bottom: 7vmin; transform: rotate(-2.5deg); transform-origin: left bottom; }
  .pen .big { display: block; font-size: 7vmin; font-weight: 700; line-height: 1.05; }
  .pen .big u { text-decoration: none; background: linear-gradient(transparent 70%, rgba(242,107,29,.9) 70% 88%, transparent 88%); }
  .pen .row { display: flex; align-items: center; gap: 3vmin; margin-top: 2vmin; font-size: 3vmin; }
  .pen .code { font-family: "Anton", Impact, sans-serif; font-size: 3.6vmin; letter-spacing: .08em; color: #1C1C1C; background: #E6C489; padding: .6vmin 1.8vmin; transform: rotate(1.5deg); }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 80vmin); }
    .grip { height: 80vmin; }
    .cut { font-size: 21.5vmin; }
    .pen { bottom: 6vmin; }
    .pen .big { font-size: 6.4vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 68vmin); }
    .grip { height: 68vmin; }
    .kick { top: 3.8vmin; font-size: 2.1vmin; }
    .cut { top: 8.5vmin; font-size: 19vmin; }
    .cut span + span { margin-left: 6vmin; }
    .bolts { top: 11vmin; width: 11vmin; height: 16vmin; right: 8vmin; }
    .bolts i { width: 2.8vmin; height: 2.8vmin; }
    .pen { bottom: 5.4vmin; }
    .pen .big { font-size: 5.4vmin; }
    .pen .row { margin-top: 1.4vmin; font-size: 2.6vmin; }
    .pen .code { font-size: 3vmin; }
  }
  /* square / wide → grip left, photo right */
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; top: 0; width: 50%; height: 100%; object-position: 50% 25%; }
    .grip { right: 50%; height: 100%; }
    .sheet { inset: 0 1.4vmin 0 0; clip-path: polygon(0 0, 100% 0, 99.2% 14%, 100% 31%, 99.4% 49%, 100% 68%, 99.1% 84%, 100% 100%, 0 100%); }
    .kick { left: 5vmin; right: 5vmin; top: 4.6vmin; font-size: 2vmin; }
    .cut { left: 4.5vmin; top: 11vmin; font-size: 18vmin; }
    .cut span + span { margin-left: 0; }
    .bolts { right: 6vmin; top: 12vmin; width: 9vmin; height: 12vmin; }
    .bolts i { width: 2.4vmin; height: 2.4vmin; }
    .bolts i::before, .bolts i::after { width: 1.3vmin; height: .3vmin; }
    .pen { left: 5vmin; right: 4vmin; bottom: 6vmin; }
    .b2 { display: block; top: auto; bottom: 25vmin; right: 6vmin; }
    .pen .big { font-size: 4vmin; white-space: nowrap; }
    .pen .row { font-size: 2.2vmin; gap: 2vmin; margin-top: 1.6vmin; }
    .pen .code { font-size: 2.6vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 48%; }
    .grip { right: 48%; }
    .kick { left: 6vmin; right: 6vmin; font-size: 2.2vmin; }
    .cut { left: 5.5vmin; top: 11vmin; font-size: 23vmin; }
    .bolts { right: 8vmin; top: 14vmin; width: 12vmin; height: 17vmin; }
    .b2 { top: auto; bottom: 25vmin; right: 8vmin; }
    .bolts i { width: 3vmin; height: 3vmin; }
    .pen { left: 7vmin; right: 6vmin; bottom: 7vmin; }
    .pen .big { font-size: 5.6vmin; }
    .pen .row { font-size: 2.6vmin; }
    .pen .code { font-size: 3vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="grip">
    <div class="sheet">
      <svg class="grit" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="7"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .55  0 0 0 0 .55  0 0 0 -7 3.3"/></filter><rect width="100%" height="100%" filter="url(#g)" opacity=".6"/></svg>
      <svg class="scores" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g stroke="#C9A36A" stroke-width=".18" fill="none" opacity=".65"><path d="M62 4 L96 30"/><path d="M4 70 L30 64"/><path d="M78 58 L97 52"/><path d="M8 8 L20 3"/></g></svg>
      <div class="kick"><b>Oro Skate Co.</b><span>summer drop ’26 ✶</span></div>
      <div class="bolts"><i></i><i></i><i></i><i></i></div>
      <div class="bolts b2"><i></i><i></i><i></i><i></i></div>
      <h1 class="cut"><span>Hold</span><span>tight.</span></h1>
      <div class="pen">
        <span class="big">30% off <u>the new drop</u></span>
        <span class="row"><span class="code">GRIP30</span><span>shop now →</span></span>
      </div>
    </div>
  </div>
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
</div>
</body>
</html>
