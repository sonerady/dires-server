<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  /* Mood Settings — the season as a phone settings page: a wallpaper-style preview of the look, grouped rows with
     pastel icon tiles, "Softness" and "Layering" switched on, a Warmth slider, and the offer as a blue value row.
     tall → one scrolling settings screen · square & wide → preview left, settings list right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F1F0F5; }
  .banner { position: fixed; inset: 0; overflow: hidden; box-sizing: border-box; padding: 4.6vmin 5.5vmin 5vmin;
    background: #F1F0F5; color: #1C1C22; font-family: "Figtree", "Helvetica Neue", Arial, sans-serif;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto auto auto;
    grid-template-areas: "nav" "title" "ph" "cap" "g1" "g2" "foot"; }

  .nav { grid-area: nav; display: flex; justify-content: space-between; align-items: center; font-size: 2.2vmin; font-weight: 500; color: #4E6BE8; white-space: nowrap; }
  .nav span:first-child::before { content: "‹"; font-size: 3.6vmin; line-height: 0; margin-right: .8vmin; position: relative; top: .3vmin; }
  .nav b { font-weight: 600; }
  .title { grid-area: title; display: flex; flex-wrap: wrap; align-items: center; column-gap: 1.8vmin; margin: 1.8vmin 0 2.6vmin; }
  .title p { flex: 0 0 100%; margin: 1.2vmin 0 0; font-size: 2.3vmin; color: #6D6C78; }
  h1 { margin: 0; font-weight: 800; font-size: 9.4vmin; line-height: 1; letter-spacing: -.035em; white-space: nowrap; }
  .on { font-weight: 800; font-size: 1.7vmin; letter-spacing: .14em; color: #2E8A62; background: #D5F1E4; border-radius: 2vmin; padding: .6vmin 1.3vmin; }

  .ph { grid-area: ph; position: relative; overflow: hidden; min-height: 0; background: #E2E0E8; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .cap { grid-area: cap; margin: 1.4vmin 0 2.4vmin 1.6vmin; font-size: 1.7vmin; letter-spacing: .1em; text-transform: uppercase; color: #8A8996; white-space: nowrap; }

  .g { background: #fff; border-radius: 2.8vmin; padding: 0 2.6vmin; }
  .g1 { grid-area: g1; }
  .g2 { grid-area: g2; margin-top: 2vmin; }
  .r { display: flex; align-items: center; gap: 2vmin; height: 7.8vmin; white-space: nowrap; }
  .r + .r { box-shadow: 0 -1px 0 #ECEBF1; }
  .ic { flex: none; width: 4.6vmin; height: 4.6vmin; border-radius: 1.1vmin; display: flex; align-items: center; justify-content: center; }
  .ic svg { width: 2.6vmin; height: 2.6vmin; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .r .t { flex: 1; font-size: 2.6vmin; font-weight: 500; }
  .r .v { font-size: 2.2vmin; color: #8A8996; }
  .r .v::after { content: "›"; margin-left: 1.2vmin; color: #C4C3CC; font-size: 2.8vmin; }
  .sw { flex: none; width: 7.4vmin; height: 4.4vmin; border-radius: 3vmin; background: #6FD3A2; position: relative; }
  .sw::after { content: ""; position: absolute; right: .4vmin; top: .4vmin; width: 3.6vmin; height: 3.6vmin; border-radius: 50%; background: #fff; box-shadow: 0 .3vmin .8vmin rgba(0,0,0,.16); }
  .sl { flex: none; width: 24vmin; height: .8vmin; border-radius: 1vmin; background: #E6E5EC; position: relative; }
  .sl::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 1vmin; background: linear-gradient(90deg, #FFD3B0, #FF9C8A); }
  .sl::after { content: ""; position: absolute; left: 70%; top: 50%; width: 3.4vmin; height: 3.4vmin; margin: -1.7vmin 0 0 -1.7vmin; border-radius: 50%; background: #fff; box-shadow: 0 .3vmin .9vmin rgba(0,0,0,.2); }
  .r .pct { font-size: 2vmin; color: #8A8996; width: 5vmin; text-align: right; }
  .deal .t { font-weight: 600; }
  .deal .v { color: #4E6BE8; font-weight: 800; font-size: 2.8vmin; }
  .deal .v::after { color: #4E6BE8; }
  .foot { grid-area: foot; margin: 1.3vmin 0 0 1.6vmin; font-size: 1.7vmin; line-height: 1.4; color: #8A8996; white-space: nowrap; }
  .foot b { color: #1C1C22; font-weight: 600; letter-spacing: .06em; }

  /* SHORTER PORTRAIT */
  @media (min-aspect-ratio: 7/10) {
    .banner { padding: 4vmin 5vmin 4.4vmin; }
    .title { margin: 1.2vmin 0 1.8vmin; }
    h1 { font-size: 7.4vmin; }
    .title p { display: none; }
    .r { height: 6.2vmin; }
    .r .t { font-size: 2.3vmin; }
    .cap { margin: 1.2vmin 0 1.6vmin 1.6vmin; }
    .g2 { margin-top: 1.6vmin; }
  }
  /* SQUARE — preview left, settings right */
  @media (min-aspect-ratio: 9/10) {
    .banner { padding: 5vmin; column-gap: 4.4vmin; grid-template-columns: 45% minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto auto auto auto;
      grid-template-areas: "ph nav" "ph title" "ph ." "ph g1" "ph g2" "ph foot" "cap ."; }
    .cap { margin: 1.4vmin 0 0 0; }
    .title { margin: 3vmin 0 0; }
    h1 { font-size: 7.4vmin; }
    .title p { display: block; margin-top: 1.6vmin; }
    .r { height: 6.8vmin; }
    .r .t { font-size: 2.3vmin; }
    .sl { width: 15vmin; }
    .r .pct { display: none; }
    .foot { margin-left: 1.6vmin; }
  }
  /* WIDE */
  @media (min-aspect-ratio: 6/5) {
    .banner { padding: 5vmin 6vmin; column-gap: 5vmin; grid-template-columns: 42% minmax(0, 1fr); }
    h1 { font-size: 8.6vmin; }
    .sl { width: 26vmin; }
    .r .pct { display: block; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="nav"><span>Wardrobe</span><b>Done</b></div>
  <div class="title"><h1>Soft mode</h1><span class="on">ON</span><p>Everything a little softer this season.</p></div>
  <div class="ph"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="cap">Preview · New-season edit</div>
  <div class="g g1">
    <div class="r"><span class="ic" style="background:#9EC5F8"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 11 3.5 3.5 0 0 0 7 18z"/></svg></span><span class="t">Softness</span><span class="sw"></span></div>
    <div class="r"><span class="ic" style="background:#C3AEF2"><svg viewBox="0 0 24 24"><path d="M12 4l9 5-9 5-9-5zM3 14l9 5 9-5"/></svg></span><span class="t">Layering</span><span class="sw"></span></div>
    <div class="r"><span class="ic" style="background:#FFB58F"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span><span class="t">Warmth</span><span class="sl"></span><span class="pct">70%</span></div>
    <div class="r"><span class="ic" style="background:#8FD6B4"><svg viewBox="0 0 24 24"><path d="M5 19C5 10 11 5 19 5c0 8-5 14-14 14zM5 19l7-7"/></svg></span><span class="t">Season</span><span class="v">Autumn</span></div>
  </div>
  <div class="g g2"><div class="r deal"><span class="ic" style="background:#4E6BE8"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8zM7.5 7.5h.01"/></svg></span><span class="t">New-season credit</span><span class="v">−15%</span></div></div>
  <div class="foot">Use <b>SOFT15</b> at checkout · until 12 Oct</div>
</div>
</body>
</html>
