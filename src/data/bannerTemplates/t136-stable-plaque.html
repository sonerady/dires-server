<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Stable Plaque — a split stable door: the top half is open (the look), the lower half is oiled oak boards
     with black strap hinges and an engraved brass name plate, horse-pedigree style ("by … out of …").
     tall → photo above the half-door; square/wide → door left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #33241A; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #33241A; color: #EFE4CC; font-family: "EB Garamond", Garamond, "Times New Roman", serif; font-variant-numeric: lining-nums; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 66vmin); object-fit: cover; object-position: 50% 20%; }

  .door { position: absolute; left: 0; right: 0; bottom: 0; height: 66vmin; overflow: hidden;
    background:
      repeating-linear-gradient(90deg, transparent 0 13.4vmin, rgba(0,0,0,.55) 13.4vmin 13.8vmin, rgba(255,230,190,.08) 13.8vmin 14vmin),
      repeating-linear-gradient(90deg, rgba(255,235,200,.035) 0 .3vmin, transparent .3vmin 1.3vmin, rgba(0,0,0,.05) 1.3vmin 1.7vmin, transparent 1.7vmin 2.6vmin),
      linear-gradient(180deg, #4A3526 0%, #3D2B1E 60%, #33241A 100%); }
  .rail { position: absolute; left: 0; right: 0; top: 0; height: 4.4vmin; background: linear-gradient(180deg, #6A4C35 0%, #563D2B 40%, #3B2A1D 100%); box-shadow: 0 .8vmin 1.4vmin rgba(0,0,0,.45); z-index: 1; }
  .hinge { position: absolute; left: 0; width: 20vmin; height: 3.2vmin; background: linear-gradient(180deg, #2A2A2A, #111 60%, #1C1C1C); clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%); box-shadow: 0 .3vmin .5vmin rgba(0,0,0,.5);
    background-image: radial-gradient(circle at 50% 50%, #555 0 .45vmin, #111 .55vmin, transparent .6vmin), linear-gradient(180deg, #2A2A2A, #111 60%, #1C1C1C);
    background-size: 7vmin 100%, 100% 100%; background-position: 3vmin 0, 0 0; background-repeat: repeat-x, no-repeat; }
  .h1 { top: 6.4vmin; } .h2 { bottom: 6vmin; }

  .plate { position: absolute; left: 50%; top: 12vmin; transform: translateX(-50%); width: 64vmin; box-sizing: border-box; padding: 3.2vmin 5vmin 3.4vmin; text-align: center; z-index: 2;
    background: linear-gradient(135deg, #9C7A3A 0%, #E6C77E 22%, #C49A4C 42%, #F1D998 60%, #B88D42 80%, #8E6C31 100%);
    box-shadow: inset 0 0 0 .35vmin rgba(255,238,190,.45), inset 0 0 0 .7vmin rgba(90,62,20,.35), 0 1.2vmin 2vmin rgba(0,0,0,.5);
    color: #3A2810; text-shadow: 0 .15vmin 0 rgba(255,240,200,.55); }
  .plate i { position: absolute; width: 1.9vmin; height: 1.9vmin; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #F6E3AE, #A9823E 70%, #6E5220); box-shadow: 0 .15vmin .2vmin rgba(0,0,0,.4); }
  .plate i::after { content: ""; position: absolute; left: 15%; right: 15%; top: 45%; height: 10%; background: rgba(60,40,12,.7); transform: rotate(35deg); }
  .plate i:nth-of-type(1) { left: 1.6vmin; top: 1.6vmin; } .plate i:nth-of-type(2) { right: 1.6vmin; top: 1.6vmin; }
  .plate i:nth-of-type(3) { left: 1.6vmin; bottom: 1.6vmin; } .plate i:nth-of-type(4) { right: 1.6vmin; bottom: 1.6vmin; }
  .stall { font-family: "Marcellus", serif; font-size: 1.9vmin; letter-spacing: .42em; margin-right: -.42em; }
  .name { margin-top: 1vmin; font-family: "Marcellus", "Trajan Pro", serif; font-size: 8.6vmin; line-height: 1; letter-spacing: .16em; margin-right: -.16em; }
  .ped { margin-top: 1.2vmin; font-style: italic; font-size: 2.8vmin; }

  .copy { position: absolute; left: 8vmin; right: 8vmin; top: 42vmin; bottom: 5vmin; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 2; }
  .t { font-size: 3.4vmin; line-height: 1.3; }
  .o { margin-top: 1.4vmin; font-family: "Marcellus", serif; font-size: 2vmin; letter-spacing: .26em; margin-right: -.26em; text-transform: uppercase; color: #E2C47E; white-space: nowrap; }
  .cta { margin-top: 2.4vmin; display: flex; align-items: center; gap: 2vmin; font-family: "Marcellus", serif; font-size: 2vmin; letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; }
  .cta i { width: 6vmin; height: 1px; background: #E2C47E; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 60vmin); }
    .door { height: 60vmin; }
    .h1 { top: 5.6vmin; } .h2 { bottom: 4.4vmin; }
    .plate { top: 10vmin; padding: 2.8vmin 5vmin 3vmin; }
    .name { font-size: 7.8vmin; }
    .copy { top: 38vmin; bottom: 4vmin; }
    .t { font-size: 3vmin; }
  }
  /* square/wide: the half-door on the left, rail down the seam, the look on the right */
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; width: 50%; height: 100%; object-position: 50% 25%; }
    .door { right: auto; top: 0; width: 50%; height: auto; }
    .rail { left: auto; right: 0; top: 0; bottom: 0; width: 3.4vmin; height: auto; background: linear-gradient(270deg, #6A4C35 0%, #563D2B 40%, #3B2A1D 100%); box-shadow: -.8vmin 0 1.4vmin rgba(0,0,0,.45); }
    .h1 { top: 12vmin; } .h2 { top: auto; bottom: 12vmin; }
    .hinge { width: 22vmin; }
    .plate { top: 24vmin; left: calc(50% - 1.7vmin); width: 40vmin; padding: 3vmin 3vmin 3.2vmin; }
    .stall { font-size: 1.7vmin; }
    .name { font-size: 6vmin; letter-spacing: .12em; margin-right: -.12em; }
    .ped { font-size: 2.3vmin; }
    .copy { left: 5vmin; right: 8.4vmin; top: 50vmin; bottom: 18vmin; }
    .t { font-size: 2.8vmin; }
    .o { font-size: 1.7vmin; letter-spacing: .16em; margin-right: -.16em; white-space: normal; line-height: 1.6; }
    .cta { font-size: 1.8vmin; letter-spacing: .22em; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 50%; object-position: 40% 25%; }
    .door { width: 50%; }
    .hinge { width: 30vmin; }
    .plate { top: 16vmin; width: 54vmin; padding: 3.4vmin 4vmin 3.6vmin; }
    .stall { font-size: 1.9vmin; }
    .name { font-size: 8vmin; letter-spacing: .16em; margin-right: -.16em; }
    .ped { font-size: 2.7vmin; }
    .copy { left: 7vmin; right: 10.4vmin; top: 50vmin; bottom: 18vmin; }
    .t { font-size: 3.2vmin; }
    .o { font-size: 1.9vmin; letter-spacing: .24em; margin-right: -.24em; white-space: nowrap; }
    .cta { font-size: 1.9vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="door">
    <div class="rail"></div>
    <div class="hinge h1"></div><div class="hinge h2"></div>
    <div class="plate"><i></i><i></i><i></i><i></i>
      <div class="stall">Stall Nº 7</div>
      <div class="name">COUNTRY</div>
      <div class="ped">by Heritage, out of Autumn</div>
    </div>
    <div class="copy">
      <div class="t">The country collection is in.</div>
      <div class="o">20% off all weekend · STABLE20</div>
      <div class="cta">Shop the stable <i></i></div>
    </div>
  </div>
</div>
</body>
</html>
