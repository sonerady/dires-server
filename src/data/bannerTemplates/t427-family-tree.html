<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Family Tree — the family edit drawn as an engraved genealogy chart: monogram roundels for the grandparents
     ("the originals"), the product photo as generation II ("the look"), and three small roundels for the minis,
     joined by hairline connectors. The photo node flexes with the frame. tall → title on top, tree below;
     square/wide → title column left, tree right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F4EFE4; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F4EFE4; color: #22211F; font-family: "Jost", "Helvetica Neue", Arial, sans-serif; }
  .paper { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.55), transparent 70%); }

  .head { position: absolute; left: 7vmin; right: 7vmin; top: 6vmin; text-align: center; }
  .k { font-size: 1.7vmin; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
  .k::after { content: ""; display: block; width: 10vmin; margin: 1.8vmin auto 0; border-top: 1px solid #7A2331; }
  h1 { margin: 2vmin 0 0; font-family: "Cormorant Garamond", Garamond, Georgia, serif; font-weight: 500; font-size: 12vmin; line-height: .92; letter-spacing: -.015em; }
  h1 i { color: #7A2331; }
  .p { display: none; margin-top: 3vmin; font-family: "Cormorant Garamond", serif; font-size: 2.8vmin; line-height: 1.3; }

  .tree { position: absolute; left: 6vmin; right: 6vmin; top: 39vmin; bottom: 20vmin; display: flex; flex-direction: column; align-items: center; }
  .gen { font-size: 1.6vmin; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: #7A2331; white-space: nowrap; }
  .gp { position: relative; display: flex; gap: 14vmin; margin-top: 1.6vmin; }
  .gp::before { content: ""; position: absolute; left: 10vmin; right: 10vmin; top: 5vmin; border-top: 1px solid #22211F; }
  .gp::after { content: ""; position: absolute; left: 50%; top: 5vmin; height: calc(100% - 5vmin + 2vmin); border-left: 1px solid #22211F; }
  .node { position: relative; display: flex; flex-direction: column; align-items: center; }
  .node i { display: flex; align-items: center; justify-content: center; width: 10vmin; height: 10vmin; border-radius: 50%; border: 1px solid #22211F; background: #F4EFE4; box-shadow: inset 0 0 0 .6vmin #F4EFE4, inset 0 0 0 calc(.6vmin + 1px) rgba(34,33,31,.4);
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 4.6vmin; line-height: 1; color: #22211F; }
  .node span { margin-top: 1vmin; font-size: 1.6vmin; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .node span b { font-weight: 500; color: #7A2331; }

  .look { position: relative; flex: 1; min-height: 0; width: 60vmin; margin-top: 2vmin; }
  .look img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .look .tag { position: absolute; left: 100%; top: 50%; margin-left: 1.4vmin; writing-mode: vertical-rl; transform: translateY(-50%); font-size: 1.6vmin; letter-spacing: .24em; text-transform: uppercase; white-space: nowrap; }
  .look .tag b { font-weight: 500; color: #7A2331; }
  .stem { height: 2.4vmin; border-left: 1px solid #22211F; }
  .kids { position: relative; display: flex; gap: 8vmin; padding-top: 2.4vmin; }
  .kids::before { content: ""; position: absolute; left: 4vmin; right: 4vmin; top: 0; border-top: 1px solid #22211F; }
  .kids .node::before { content: ""; position: absolute; left: 50%; top: -2.4vmin; height: 2.4vmin; border-left: 1px solid #22211F; }
  .kids .node i { width: 8vmin; height: 8vmin; font-size: 3.6vmin; }

  .foot { position: absolute; left: 7vmin; right: 7vmin; bottom: 5.4vmin; display: flex; align-items: flex-end; justify-content: space-between; gap: 3vmin; padding-top: 2.4vmin; border-top: 1px solid rgba(34,33,31,.35); }
  .offer { font-family: "Cormorant Garamond", serif; font-size: 3vmin; line-height: 1.15; }
  .offer b { font-weight: 600; color: #7A2331; }
  .cta { flex: none; font-size: 1.8vmin; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; background: #22211F; color: #F4EFE4; padding: 1.8vmin 2.8vmin; white-space: nowrap; }

  /* 2:3 */
  @media (min-aspect-ratio: 5/8) {
    .head { top: 5vmin; }
    h1 { font-size: 10vmin; margin-top: 1.6vmin; }
    .tree { top: 32vmin; bottom: 18vmin; }
    .look { width: 56vmin; }
  }
  /* 3:4 / 4:5 → title left, tree right */
  @media (min-aspect-ratio: 7/10) {
    .head { left: 6vmin; right: auto; width: 34vmin; top: 7vmin; text-align: left; }
    .k::after { margin-left: 0; }
    h1 { font-size: 8.6vmin; margin-top: 2.4vmin; }
    .p { display: block; }
    .tree { left: 42vmin; right: 5vmin; top: 5vmin; bottom: 5vmin; }
    .look { width: 44vmin; }
    .look .tag { display: none; }
    .gp { gap: 12vmin; }
    .kids { gap: 6vmin; }
    .foot { left: 6vmin; right: auto; width: 32vmin; bottom: 6vmin; flex-direction: column; align-items: flex-start; gap: 2.4vmin; }
    .offer { font-size: 2.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .head { width: 36vmin; top: 6vmin; }
    h1 { font-size: 7.8vmin; }
    .tree { left: 46vmin; right: 4vmin; }
    .look { width: 38vmin; }
    .foot { width: 34vmin; bottom: 5vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .head { left: 8vmin; width: 52vmin; top: 9vmin; }
    h1 { font-size: 10vmin; }
    .tree { left: auto; right: 10vmin; width: 70vmin; top: 5vmin; bottom: 5vmin; }
    .look { width: 46vmin; }
    .look .tag { display: block; }
    .foot { left: 8vmin; width: 52vmin; bottom: 8vmin; flex-direction: row; align-items: flex-end; }
    .offer { font-size: 3vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="paper"></div>
  <div class="head">
    <div class="k">The Family Edit · Est. 1961</div>
    <h1>It runs<br><i>in the family.</i></h1>
    <div class="p">Three generations, one wardrobe — matching sizes from 2Y to XXL.</div>
  </div>
  <div class="tree">
    <div class="gen">I · The originals</div>
    <div class="gp">
      <div class="node"><i>N</i><span>Nana <b>'61</b></span></div>
      <div class="node"><i>G</i><span>Grandpa <b>'59</b></span></div>
    </div>
    <div class="look">
      <img src="{{PRODUCT_IMAGE}}" alt="">
      <div class="tag">II · <b>The look</b>, SS27</div>
    </div>
    <div class="stem"></div>
    <div class="kids">
      <div class="node"><i>A</i><span>Ada</span></div>
      <div class="node"><i>L</i><span>Leo</span></div>
      <div class="node"><i>M</i><span>Mia</span></div>
    </div>
  </div>
  <div class="foot">
    <div class="offer">Every generation, one look.<br><b>20% off</b> with FAMILY20</div>
    <div class="cta">Shop the family</div>
  </div>
</div>
</body>
</html>
