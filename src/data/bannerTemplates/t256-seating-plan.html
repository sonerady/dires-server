<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400;1,6..96,500&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Seating Plan — the PR team's top-down seating chart of the show: the runway, rows of seat dots,
     backstage and the photographers' pit, with one front-row seat circled in red for "you".
     tall → photo above, headline + plan + offer below · square & wide → photo left, the plan standing upright on the right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F4F1E9; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F4F1E9; color: #1C2442; font-family: "Karla", "Helvetica Neue", Arial, sans-serif; }

  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 46%; object-fit: cover; object-position: 50% 20%; }
  .copy { position: absolute; left: 6vmin; right: 6vmin; top: calc(46% + 4.4vmin); bottom: 5vmin; display: flex; flex-direction: column; }

  .kick { display: flex; justify-content: space-between; font-size: 1.7vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .kick span:last-child { color: #D2382B; }
  h1 { margin: 1.6vmin 0 0; font-family: "Bodoni Moda", "Didot", "Times New Roman", serif; font-weight: 500; font-size: 9.6vmin; line-height: .95; letter-spacing: -.015em; }
  h1 em { font-weight: 400; }

  .plan { position: relative; flex: 1 1 auto; min-height: 0; margin: 2.6vmin 0 2.4vmin; }
  .plan svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .plan .v { display: none; }

  .offer { display: flex; justify-content: space-between; align-items: flex-end; gap: 3vmin; border-top: 1px solid #1C2442; padding-top: 1.8vmin; }
  .offer .pct { font-family: "Bodoni Moda", serif; font-style: italic; font-size: 7.4vmin; line-height: .9; color: #D2382B; white-space: nowrap; }
  .offer .pct small { font-family: "Karla", sans-serif; font-style: normal; font-size: 2vmin; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #1C2442; margin-left: 1.2vmin; vertical-align: .6vmin; }
  .offer .meta { text-align: right; font-size: 1.8vmin; line-height: 1.55; letter-spacing: .04em; white-space: nowrap; }
  .offer .meta b { font-weight: 700; letter-spacing: .14em; }

  /* 2:3 */
  @media (min-aspect-ratio: 5/8) {
    .photo { height: 42%; }
    .copy { top: calc(42% + 3.6vmin); bottom: 4.4vmin; }
    h1 { font-size: 8.4vmin; }
    .plan { margin: 2vmin 0 1.8vmin; }
    .offer .pct { font-size: 6.6vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: 40%; }
    .copy { top: calc(40% + 3.2vmin); bottom: 4vmin; }
    h1 { font-size: 7.2vmin; }
    h1 br { display: none; }
    .offer .pct { font-size: 6vmin; }
  }
  /* square — photo left, upright plan + copy right */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; height: 100%; object-position: 50% 22%; }
    .copy { left: calc(46% + 4.6vmin); right: 4.6vmin; top: 4.6vmin; bottom: 4.6vmin; display: grid; grid-template-columns: 1fr 18vmin; grid-template-rows: auto auto 1fr auto; column-gap: 3vmin; }
    .kick { grid-column: 1 / -1; }
    h1 { grid-column: 1; grid-row: 2 / 4; font-size: 7.6vmin; margin-top: 3vmin; }
    h1 br { display: inline; }
    .plan { grid-column: 2; grid-row: 2 / 4; margin: 3vmin 0 2.4vmin; }
    .plan .h { display: none; }
    .plan .v { display: block; }
    .offer { grid-column: 1 / -1; flex-direction: column; align-items: flex-start; gap: 1.2vmin; }
    .offer .meta { text-align: left; }
    .offer .pct { font-size: 6.4vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 40%; }
    .copy { left: calc(40% + 5vmin); right: 5vmin; top: 5vmin; bottom: 5vmin; grid-template-columns: 1fr 28vmin; column-gap: 5vmin; }
    h1 { font-size: 8.6vmin; }
    .offer { flex-direction: row; align-items: flex-end; }
    .offer .meta { text-align: right; }
    .offer .pct { font-size: 7vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="copy">
    <div class="kick"><span>Studio Oro · SS27 show</span><span>Seat A12</span></div>
    <h1>Front row,<br><em>reserved for you.</em></h1>
    <div class="plan">
      <!-- horizontal plan -->
      <svg class="h" viewBox="0 0 300 118" preserveAspectRatio="xMidYMid meet" aria-hidden="true" font-family="Karla, Arial, sans-serif">
        <defs>
          <pattern id="hh" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V4" stroke="#1C2442" stroke-width=".7"/></pattern>
          <g id="row"><circle cx="0" cy="0" r="2.6"/><circle cx="10" cy="0" r="2.6"/><circle cx="20" cy="0" r="2.6"/><circle cx="30" cy="0" r="2.6"/><circle cx="40" cy="0" r="2.6"/><circle cx="50" cy="0" r="2.6"/><circle cx="60" cy="0" r="2.6"/><circle cx="70" cy="0" r="2.6"/><circle cx="80" cy="0" r="2.6"/><circle cx="90" cy="0" r="2.6"/><circle cx="100" cy="0" r="2.6"/><circle cx="110" cy="0" r="2.6"/><circle cx="120" cy="0" r="2.6"/><circle cx="130" cy="0" r="2.6"/><circle cx="140" cy="0" r="2.6"/><circle cx="150" cy="0" r="2.6"/><circle cx="160" cy="0" r="2.6"/><circle cx="170" cy="0" r="2.6"/><circle cx="180" cy="0" r="2.6"/><circle cx="190" cy="0" r="2.6"/></g>
        </defs>
        <rect x="2" y="30" width="32" height="58" fill="url(#hh)" stroke="#1C2442" stroke-width="1"/>
        <rect x="8" y="50" width="20" height="18" fill="#F4F1E9"/>
        <text x="18" y="61.5" font-size="5.2" font-weight="700" text-anchor="middle" fill="#1C2442" letter-spacing=".6">BACK</text>
        <rect x="40" y="52" width="218" height="14" fill="#fff" stroke="#1C2442" stroke-width="1"/>
        <text x="149" y="61.2" font-size="5.6" font-weight="700" text-anchor="middle" fill="#1C2442" letter-spacing="4">RUNWAY  →</text>
        <rect x="264" y="38" width="34" height="42" fill="none" stroke="#1C2442" stroke-width="1" stroke-dasharray="2 1.6"/>
        <text x="281" y="57" font-size="5" font-weight="700" text-anchor="middle" fill="#1C2442" letter-spacing=".5">PRESS</text>
        <text x="281" y="64" font-size="5" font-weight="700" text-anchor="middle" fill="#1C2442" letter-spacing=".5">PIT</text>
        <g fill="#1C2442"><use href="#row" x="56" y="44"/><use href="#row" x="56" y="74"/></g>
        <g fill="none" stroke="#1C2442" stroke-width=".9"><use href="#row" x="56" y="34"/><use href="#row" x="56" y="84"/><use href="#row" x="56" y="24"/><use href="#row" x="56" y="94"/></g>
        <g font-size="5" font-weight="700" fill="#1C2442" text-anchor="end"><text x="51" y="46">A</text><text x="51" y="36">B</text><text x="51" y="26">C</text><text x="51" y="76">A</text><text x="51" y="86">B</text><text x="51" y="96">C</text></g>
        <circle cx="166" cy="44" r="3.4" fill="#D2382B"/>
        <circle cx="166" cy="44" r="8.5" fill="none" stroke="#D2382B" stroke-width="1.3"/>
        <path d="M172 38 L186 10 L214 10" fill="none" stroke="#D2382B" stroke-width="1"/>
        <text x="217" y="12" font-size="8" font-weight="700" fill="#D2382B" letter-spacing=".8">YOU · A12</text>
        <text x="4" y="112" font-size="5.6" fill="#1C2442" letter-spacing="1">SEATING PLAN — HALL 2 — 20:00</text>
        <text x="298" y="112" font-size="5.6" fill="#1C2442" letter-spacing="1" text-anchor="end">● FROW   ○ GUESTS</text>
      </svg>
      <!-- upright plan -->
      <svg class="v" viewBox="-52 0 162 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true" font-family="Karla, Arial, sans-serif">
        <defs>
          <pattern id="vh" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V4" stroke="#1C2442" stroke-width=".7"/></pattern>
          <g id="col"><circle cx="0" cy="0" r="2.6"/><circle cx="0" cy="10" r="2.6"/><circle cx="0" cy="20" r="2.6"/><circle cx="0" cy="30" r="2.6"/><circle cx="0" cy="40" r="2.6"/><circle cx="0" cy="50" r="2.6"/><circle cx="0" cy="60" r="2.6"/><circle cx="0" cy="70" r="2.6"/><circle cx="0" cy="80" r="2.6"/><circle cx="0" cy="90" r="2.6"/><circle cx="0" cy="100" r="2.6"/><circle cx="0" cy="110" r="2.6"/><circle cx="0" cy="120" r="2.6"/><circle cx="0" cy="130" r="2.6"/><circle cx="0" cy="140" r="2.6"/><circle cx="0" cy="150" r="2.6"/><circle cx="0" cy="160" r="2.6"/><circle cx="0" cy="170" r="2.6"/><circle cx="0" cy="180" r="2.6"/><circle cx="0" cy="190" r="2.6"/></g>
        </defs>
        <rect x="24" y="266" width="62" height="32" fill="url(#vh)" stroke="#1C2442" stroke-width="1"/>
        <rect x="40" y="274" width="30" height="14" fill="#F4F1E9"/>
        <text x="55" y="283.4" font-size="5.2" font-weight="700" text-anchor="middle" fill="#1C2442" letter-spacing=".6">BACK</text>
        <rect x="48" y="40" width="14" height="220" fill="#fff" stroke="#1C2442" stroke-width="1"/>
        <rect x="32" y="2" width="46" height="30" fill="none" stroke="#1C2442" stroke-width="1" stroke-dasharray="2 1.6"/>
        <text x="55" y="20" font-size="5" font-weight="700" text-anchor="middle" fill="#1C2442" letter-spacing=".5">PRESS PIT</text>
        <g fill="#1C2442"><use href="#col" x="40" y="54"/><use href="#col" x="70" y="54"/></g>
        <g fill="none" stroke="#1C2442" stroke-width=".9"><use href="#col" x="30" y="54"/><use href="#col" x="80" y="54"/><use href="#col" x="20" y="54"/><use href="#col" x="90" y="54"/></g>
        <circle cx="40" cy="144" r="3.4" fill="#D2382B"/>
        <circle cx="40" cy="144" r="8.5" fill="none" stroke="#D2382B" stroke-width="1.3"/>
        <path d="M33 149 L8 166 L-48 166" fill="none" stroke="#D2382B" stroke-width="1"/>
        <text x="-48" y="183" font-size="16" font-weight="700" fill="#D2382B" letter-spacing=".6">YOU</text>
        <text x="-48" y="198" font-size="12" font-weight="700" fill="#D2382B" letter-spacing=".6">A12</text>
      </svg>
    </div>
    <div class="offer">
      <div class="pct">–20%<small>members’ preview</small></div>
      <div class="meta">Thu 09 — Sun 12.10<br>Code <b>FROW20</b></div>
    </div>
  </div>
</div>
</body>
</html>
