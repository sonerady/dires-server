<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* New Year Knot — Hatsuuri, Japan's first sale of the new year: the copy panel is a sheet of washi wrapped with
     vermilion-and-white mizuhiki cords tied in an awaji knot (the knot that "cannot be undone"), with a gold tail.
     Mincho serif, generous white space. tall → photo above the wrapped panel; square/wide → photo left, panel right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F5F1E8; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #1E1B17; font-family: "Zen Kaku Gothic New", "Helvetica Neue", Arial, sans-serif;
    background: repeating-linear-gradient(83deg, rgba(160,140,110,.05) 0 .15vmin, transparent .15vmin 2.3vmin), repeating-linear-gradient(-7deg, rgba(160,140,110,.04) 0 .1vmin, transparent .1vmin 3.1vmin), #F5F1E8; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 80vmin); object-fit: cover; object-position: 50% 18%; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; top: calc(100% - 80vmin); }
  .fold { position: absolute; left: 0; right: 0; top: 0; height: 2.4vmin; background: linear-gradient(180deg, rgba(90,70,40,.16), rgba(90,70,40,0)); }
  .cords { position: absolute; left: 0; right: 0; top: 3vmin; height: 19vmin; }
  .cords .line { position: absolute; left: 0; right: 0; top: 50%; height: 2.4vmin; margin-top: 1.2vmin;
    background: linear-gradient(180deg, #C8352B 0 20%, #F9F6F0 20% 40%, #C8352B 40% 60%, #F9F6F0 60% 80%, #C8352B 80% 100%); box-shadow: 0 .3vmin .5vmin rgba(60,30,10,.18); }
  .cords svg { position: absolute; left: 50%; top: 0; width: 38vmin; height: 19vmin; margin-left: -19vmin; overflow: visible; filter: drop-shadow(0 .3vmin .4vmin rgba(60,30,10,.2)); }
  .copy { position: absolute; left: 7vmin; right: 7vmin; top: 26vmin; bottom: 6vmin; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .k { font-size: 1.8vmin; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #C8352B; margin-right: -.3em; }
  h1 { margin: 2.2vmin 0 0; font-family: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif; font-weight: 500; font-size: 9vmin; line-height: 1.02; letter-spacing: -.01em; }
  .p { display: none; margin-top: 2vmin; font-size: 2.2vmin; line-height: 1.5; color: #57504A; }
  .offer { margin-top: auto; display: flex; align-items: center; gap: 3vmin; }
  .offer b { font-family: "Shippori Mincho", Georgia, serif; font-weight: 700; font-size: 8vmin; line-height: 1; color: #C8352B; }
  .offer span { text-align: left; font-size: 1.8vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; line-height: 1.6; padding-left: 3vmin; border-left: 1px solid rgba(30,27,23,.3); }
  .foot { margin-top: 3vmin; display: flex; align-items: center; gap: 2.4vmin; font-size: 2vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .foot .code { white-space: nowrap; }
  .foot .code em { font-style: normal; color: #C8352B; }
  .foot .cta { background: #1E1B17; color: #F5F1E8; padding: 1.5vmin 3vmin; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 64vmin); }
    .panel { top: calc(100% - 64vmin); }
    .cords { top: 2.6vmin; height: 17vmin; }
    .cords svg { width: 34vmin; height: 17vmin; margin-left: -17vmin; }
    .cords .line { height: 2vmin; margin-top: 1vmin; }
    .copy { top: 22vmin; bottom: 4.4vmin; }
    h1 { font-size: 8.6vmin; margin-top: 1.6vmin; }
    .p { display: none; }
    .offer b { font-size: 7vmin; }
    .foot { margin-top: 2.4vmin; }
  }
  /* square / wide → photo left, wrapped panel right */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 48%; height: 100%; object-position: 50% 25%; }
    .panel { left: 48%; top: 0; }
    .fold { right: auto; bottom: 0; width: 2.4vmin; height: auto; background: linear-gradient(90deg, rgba(90,70,40,.16), rgba(90,70,40,0)); }
    .cords { top: 7vmin; height: 16vmin; }
    .cords svg { width: 32vmin; height: 16vmin; margin-left: -16vmin; }
    .cords .line { height: 1.8vmin; margin-top: .9vmin; }
    .copy { left: 5vmin; right: 5vmin; top: 29vmin; bottom: 6vmin; }
    h1 { font-size: 7.6vmin; }
    .p { display: block; font-size: 2vmin; }
    .offer { flex-direction: column; gap: 1.2vmin; }
    .offer b { font-size: 6.6vmin; }
    .offer span { text-align: center; padding-left: 0; border-left: 0; font-size: 1.7vmin; }
    .foot { flex-direction: column; gap: 1.8vmin; font-size: 1.8vmin; margin-top: 2.4vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .panel { left: 46%; }
    .cords { top: 8vmin; height: 20vmin; }
    .cords svg { width: 40vmin; height: 20vmin; margin-left: -20vmin; }
    .cords .line { height: 2.2vmin; margin-top: 1.1vmin; }
    .copy { left: 8vmin; right: 8vmin; top: 34vmin; bottom: 7vmin; }
    h1 { font-size: 9vmin; }
    .p { font-size: 2.2vmin; }
    .offer { flex-direction: row; gap: 3vmin; }
    .offer b { font-size: 7.4vmin; }
    .offer span { text-align: left; padding-left: 3vmin; border-left: 1px solid rgba(30,27,23,.3); font-size: 1.8vmin; }
    .foot { flex-direction: row; gap: 2.4vmin; font-size: 1.9vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="fold"></div>
    <div class="cords">
      <div class="line"></div>
      <svg viewBox="0 0 200 100" aria-hidden="true">
        <defs>
          <g id="kn">
            <path d="M58 62 C 70 62, 70 36, 86 36 C 104 36, 108 64, 94 72 C 80 80, 66 60, 84 48 C 96 40, 110 20, 100 14 C 90 20, 104 40, 116 48 C 134 60, 120 80, 106 72 C 92 64, 96 36, 114 36 C 130 36, 130 62, 142 62"/>
          </g>
        </defs>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <use href="#kn" stroke="#C8352B" stroke-width="10"/>
          <use href="#kn" stroke="#F9F6F0" stroke-width="6"/>
          <use href="#kn" stroke="#C8352B" stroke-width="2.2"/>
        </g>
        <g fill="none" stroke-linecap="round">
          <path d="M92 74 C 84 86, 76 92, 64 98" stroke="#C9A45C" stroke-width="3"/>
          <path d="M108 74 C 116 86, 124 92, 136 98" stroke="#C9A45C" stroke-width="3"/>
          <path d="M92 74 C 84 86, 76 92, 64 98 M108 74 C 116 86, 124 92, 136 98" stroke="#F3DDA6" stroke-width="1"/>
        </g>
      </svg>
    </div>
    <div class="copy">
      <div class="k">Hatsuuri · 2 January</div>
      <h1>First sale<br>of the year.</h1>
      <div class="p">A clean start, tied with good fortune.</div>
      <div class="offer"><b>20% off</b><span>Plus a lucky bag<br>over $150</span></div>
      <div class="foot"><span class="code">Code <em>HATSU20</em></span><span class="cta">Shop first sale</span></div>
    </div>
  </div>
</div>
</body>
</html>
