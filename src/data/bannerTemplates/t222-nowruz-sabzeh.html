<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Nowruz Sabzeh — the Persian New Year ("new day") at the spring equinox: a band of cobalt-and-turquoise
     eight-point girih tiles runs along the seam, and a dish of sprouted sabzeh tied with a pomegranate ribbon
     sits beside the copy. 13% off until Sizdah Bedar, the thirteenth day.
     tall → photo above a paper panel; square/wide → photo left, tile band down the seam, panel right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F4EDE0; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F4EDE0; color: #1B2F5E; font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 74vmin); object-fit: cover; object-position: 50% 18%; }
  .band { position: absolute; left: 0; right: 0; top: calc(100% - 74vmin); height: 7vmin; overflow: hidden; background: #1C3F8C; }
  .band svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .band .v { display: none; }
  .defs { position: absolute; width: 0; height: 0; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; top: calc(100% - 67vmin); }
  .copy { position: absolute; left: 7vmin; right: 7vmin; top: 6vmin; bottom: 6vmin; display: flex; flex-direction: column; }
  .k { display: flex; align-items: center; gap: 1.6vmin; font-size: 1.8vmin; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: #1F8A8A; }
  .k i { width: 1.1vmin; height: 1.1vmin; background: #B3262E; transform: rotate(45deg); flex: none; }
  h1 { margin: 2.2vmin 0 0; font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 12.4vmin; line-height: .92; letter-spacing: -.025em; }
  h1 i { color: #1F8A8A; }
  .p { margin-top: 2vmin; max-width: 48vmin; font-size: 2.3vmin; line-height: 1.45; color: #3B4A6B; }
  .offer { margin-top: auto; display: flex; align-items: center; gap: 2.4vmin; }
  .offer b { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 10vmin; line-height: .85; color: #B3262E; letter-spacing: -.03em; }
  .offer b sup { font-size: .42em; vertical-align: .95em; font-weight: 400; }
  .offer span { font-size: 1.8vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; line-height: 1.6; border-left: 1px solid rgba(27,47,94,.35); padding-left: 2.4vmin; }
  .offer span em { font-style: normal; color: #1F8A8A; }
  .foot { margin-top: 3vmin; display: flex; align-items: center; gap: 2.4vmin; font-size: 2vmin; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .foot .code { border: 1px solid #1B2F5E; padding: 1.3vmin 1.8vmin; white-space: nowrap; }
  .foot .cta { background: #1B2F5E; color: #F4EDE0; padding: 1.4vmin 2.8vmin; white-space: nowrap; }
  .sabzeh { position: absolute; right: 3vmin; bottom: 4vmin; width: 30vmin; height: 30vmin; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 64vmin); }
    .band { top: calc(100% - 64vmin); height: 6vmin; }
    .panel { top: calc(100% - 58vmin); }
    .copy { top: 4.6vmin; bottom: 4.6vmin; }
    h1 { font-size: 10.4vmin; margin-top: 1.8vmin; }
    .p { display: none; }
    .offer b { font-size: 8.6vmin; }
    .foot { margin-top: 2.6vmin; }
    .sabzeh { width: 27vmin; height: 27vmin; bottom: 3vmin; }
  }
  /* square / wide → photo left, tile band down the seam */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; height: 100%; object-position: 50% 25%; }
    .band { left: 46%; right: auto; top: 0; bottom: 0; width: 6vmin; height: auto; }
    .band .h { display: none; }
    .band .v { display: block; }
    .panel { left: calc(46% + 6vmin); top: 0; }
    .copy { left: 5vmin; right: 4vmin; top: 7vmin; bottom: 6vmin; }
    h1 { font-size: 8.8vmin; margin-top: 2.4vmin; }
    .p { display: block; max-width: 30vmin; font-size: 2vmin; }
    .offer { margin-top: auto; flex-direction: column; align-items: flex-start; gap: 1.4vmin; }
    .offer b { font-size: 8.4vmin; }
    .offer span { border-left: 0; padding-left: 0; border-top: 1px solid rgba(27,47,94,.35); padding-top: 1.2vmin; font-size: 1.7vmin; }
    .foot { flex-direction: column; align-items: flex-start; gap: 1.6vmin; font-size: 1.8vmin; margin-top: 2.6vmin; }
    .sabzeh { right: 1vmin; bottom: 14vmin; width: 22vmin; height: 22vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 48%; }
    .band { left: 48%; width: 7vmin; }
    .panel { left: calc(48% + 7vmin); }
    .copy { left: 7vmin; right: 6vmin; top: 8vmin; bottom: 8vmin; }
    h1 { font-size: 11vmin; }
    .p { max-width: 32vmin; font-size: 2.3vmin; }
    .offer { flex-direction: row; align-items: center; gap: 2.4vmin; }
    .offer b { font-size: 9.4vmin; }
    .offer span { border-top: 0; padding-top: 0; border-left: 1px solid rgba(27,47,94,.35); padding-left: 2.4vmin; font-size: 1.8vmin; }
    .foot { flex-direction: row; align-items: center; gap: 2.4vmin; font-size: 1.9vmin; }
    .sabzeh { right: 5vmin; bottom: auto; top: 20vmin; width: 28vmin; height: 28vmin; }
  }
</style>
</head>
