<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Automat Wall — a 1930s coin-op automat: a chrome-lettered house sign over a walnut wall of nickel-framed glass
     doors, each with a brass knob and a numbered plate. The biggest door holds the product; the little doors hold the
     offer, the code and the "fresh daily" note, like dishes waiting behind glass.
     tall / 3:4 → sign, big door, a row of three small doors; square → big door right, small doors stacked left;
     wide → big door right, one wide + two small doors left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #221A14; }
  .banner { --wood: #221A14; --cream: #F2E9D6; --brass: #D2A64E; --glass: #16211F; --sign: 26vmin;
    position: fixed; inset: 0; overflow: hidden; color: var(--cream);
    font-family: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 .3vmin, transparent .3vmin 2.6vmin, rgba(255,220,170,.03) 2.6vmin 3.4vmin, transparent 3.4vmin 5.2vmin),
      linear-gradient(180deg, #2E231A, #1C1510); }

  .sign { position: absolute; left: 0; right: 0; top: 0; height: var(--sign); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, #0F0C0A, #1A1410); border-bottom: 1.2vmin solid transparent;
    border-image: linear-gradient(90deg, #7D8185, #F4F5F2 20%, #9DA1A4 45%, #E8EAE8 70%, #7D8185) 1; }
  .sign small { font-size: 1.9vmin; font-weight: 500; letter-spacing: .4em; padding-left: .4em; text-transform: uppercase; color: var(--brass); white-space: nowrap; }
  .sign h1 { margin: .6vmin 0 0; font-family: "Righteous", "Futura", sans-serif; font-weight: 400; font-size: 13.4vmin; line-height: 1.02; letter-spacing: .1em; padding-left: .1em; white-space: nowrap;
    background: linear-gradient(180deg, #FFFFFF 0%, #D9DCDE 38%, #7E8387 52%, #C9CDD0 66%, #F5F6F4 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .5vmin 0 #000); }
  .sign span { margin-top: .4vmin; font-size: 2.1vmin; font-weight: 400; letter-spacing: .24em; padding-left: .24em; text-transform: uppercase; white-space: nowrap; }

  .door { position: absolute; box-sizing: border-box;
    background: linear-gradient(135deg, #8A8E92 0%, #F4F5F2 20%, #A3A7AA 42%, #E6E8E6 60%, #7D8185 82%, #C9CCCE 100%);
    box-shadow: 0 1vmin 2vmin rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.55); }
  .glass { position: absolute; left: 1.3vmin; right: 1.3vmin; top: 1.3vmin; bottom: 4.6vmin; overflow: hidden; background: var(--glass); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6); }
  .glass img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .plate { position: absolute; left: 1.6vmin; bottom: 1.1vmin; padding: .3vmin 1vmin .2vmin; background: #1B1612; color: var(--cream); font-size: 1.6vmin; font-weight: 500; letter-spacing: .14em; white-space: nowrap; }
  .knob { position: absolute; right: 1.8vmin; bottom: 1vmin; width: 2.6vmin; height: 2.6vmin; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF0C4, #D2A64E 45%, #7A5A1E 100%); box-shadow: 0 .3vmin .5vmin rgba(0,0,0,.5); }
  .slot { position: absolute; left: 50%; bottom: 1.9vmin; width: 4vmin; height: .5vmin; transform: translateX(-50%); background: #1B1612; border-radius: .3vmin; }

  .hero { left: 6vmin; right: 6vmin; top: calc(var(--sign) + 4vmin); bottom: 43vmin; }
  .row { position: absolute; left: 6vmin; right: 6vmin; bottom: 5vmin; height: 33vmin; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vmin; }
  .row .door { position: relative; }
  .txt .glass { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(118deg, rgba(255,255,255,0) 0 30%, rgba(255,255,255,.07) 34%, rgba(255,255,255,0) 44%), radial-gradient(ellipse at 50% 30%, #243431, var(--glass) 75%); }
  .txt small { font-size: 1.7vmin; font-weight: 500; letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; color: var(--brass); white-space: nowrap; }
  .txt b { margin: .6vmin 0 .4vmin; font-weight: 700; font-size: 7vmin; line-height: 1.05; letter-spacing: .01em; white-space: nowrap; }
  .txt b.sm { font-size: 3.8vmin; font-weight: 600; letter-spacing: .06em; }
  .txt span { font-size: 1.8vmin; letter-spacing: .08em; white-space: nowrap; opacity: .85; }

  /* 3:4 · 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .banner { --sign: 22vmin; }
    .sign h1 { font-size: 11vmin; }
    .hero { top: calc(var(--sign) + 3.4vmin); bottom: 37vmin; left: 7vmin; right: 7vmin; }
    .row { left: 7vmin; right: 7vmin; bottom: 4.4vmin; height: 29vmin; }
    .txt b { font-size: 6.2vmin; }
    .txt b.sm { font-size: 3.4vmin; }
  }
  /* square */
  @media (min-aspect-ratio: 9/10) {
    .banner { --sign: 19vmin; }
    .sign small { font-size: 1.7vmin; letter-spacing: .32em; }
    .sign h1 { font-size: 9.4vmin; margin-top: .2vmin; }
    .sign span { font-size: 1.8vmin; }
    .hero { left: 41vmin; right: 5vmin; top: calc(var(--sign) + 3.4vmin); bottom: 4.4vmin; }
    .row { left: 5vmin; right: auto; width: 32vmin; top: calc(var(--sign) + 3.4vmin); bottom: 4.4vmin; height: auto; grid-template-columns: 1fr; grid-template-rows: repeat(3, 1fr); gap: 2.4vmin; }
    .glass { bottom: 4.2vmin; }
    .txt b { font-size: 5.2vmin; margin: .2vmin 0; }
    .txt b.sm { font-size: 3.2vmin; }
    .txt small { font-size: 1.6vmin; letter-spacing: .14em; }
    .txt span { font-size: 1.6vmin; }
  }
  /* wide */
  @media (min-aspect-ratio: 6/5) {
    .banner { --sign: 20vmin; }
    .sign h1 { font-size: 10vmin; }
    .hero { left: auto; right: 6vmin; width: 62vmin; top: calc(var(--sign) + 4vmin); bottom: 5vmin; }
    .row { left: 6vmin; right: 74vmin; width: auto; top: calc(var(--sign) + 4vmin); bottom: 5vmin;
      grid-template-columns: 1fr 1fr; grid-template-rows: 1.15fr 1fr; gap: 3vmin; }
    .row .door:first-child { grid-column: 1 / 3; }
    .txt b { font-size: 6vmin; }
    .row .door:first-child b { font-size: 8.6vmin; }
    .txt b.sm { font-size: 3.4vmin; }
    .txt small { font-size: 1.7vmin; letter-spacing: .2em; }
    .txt span { font-size: 1.7vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="sign"><small>Ashby's · Est. 1936</small><h1>Automat</h1><span>Put in a coin · open a door</span></div>
  <div class="door hero"><div class="glass"><img src="{{PRODUCT_IMAGE}}" alt=""></div><div class="plate">Nº 1 · The new season</div><i class="slot"></i><i class="knob"></i></div>
  <div class="row">
    <div class="door txt"><div class="glass"><small>Every door</small><b>−30%</b><span>this week</span></div><div class="plate">Nº 2</div><i class="knob"></i></div>
    <div class="door txt"><div class="glass"><small>Your coin</small><b class="sm">NICKEL</b><span>code at till</span></div><div class="plate">Nº 3</div><i class="knob"></i></div>
    <div class="door txt"><div class="glass"><small>Fresh daily</small><b class="sm">Help yourself</b><span>shop now →</span></div><div class="plate">Nº 4</div><i class="knob"></i></div>
  </div>
</div>
</body>
</html>
