<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* RSVP Reply — the little reply card that comes back in the post, already filled in: "joyfully accepts" ticked in
     blue fountain-pen ink, "regretfully declines" struck through, the guest line and "arriving in" answered by hand.
     The card lies slightly askew on a pale envelope-blue desk. tall → photo above the desk; square/wide → photo left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #CDD6DC; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #2B2724; font-family: "EB Garamond", Garamond, "Times New Roman", serif; background: #CDD6DC; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 78vmin); object-fit: cover; object-position: 50% 22%; }
  .desk { position: absolute; left: 0; right: 0; bottom: 0; height: 78vmin;
    background:
      radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.35), transparent 60%),
      repeating-linear-gradient(90deg, rgba(60,80,100,.035) 0 1px, transparent 1px .7vmin),
      #CDD6DC; }
  /* a soft shadow the photo casts onto the desk, eased */
  .desk::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3vmin;
    background: linear-gradient(180deg, rgba(40,55,70,.18), rgba(40,55,70,.177) 7%, rgba(40,55,70,.17) 14%, rgba(40,55,70,.157) 21%, rgba(40,55,70,.141) 28%, rgba(40,55,70,.122) 35%, rgba(40,55,70,.1) 43%, rgba(40,55,70,.079) 50%, rgba(40,55,70,.058) 57%, rgba(40,55,70,.039) 64%, rgba(40,55,70,.023) 71%, rgba(40,55,70,.01) 79%, rgba(40,55,70,.003) 86%, transparent); }

  /* the return envelope peeking out from under the card */
  .env { position: absolute; left: 13vmin; right: 2.5vmin; top: 3vmin; bottom: 13vmin; background: #E8D5C8; transform: rotate(3.2deg);
    box-shadow: 0 1.6vmin 2.4vmin -1.2vmin rgba(40,55,70,.3); overflow: hidden; }
  .env::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 58%; background: #DCC5B6; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .env::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 58%; background: linear-gradient(#C9AE9C,#C9AE9C) 50% 100% / 1px 1px no-repeat; }

  .card { --u: 1.06vmin; position: absolute; left: 7vmin; right: 7vmin; top: 6vmin; bottom: 7vmin; box-sizing: border-box;
    padding: calc(4.4 * var(--u)) calc(6 * var(--u)) calc(3.6 * var(--u)); background: #FBF8F1; transform: rotate(-1.4deg);
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 .25vmin .4vmin rgba(40,55,70,.18), 0 2.4vmin 3.4vmin -1.4vmin rgba(40,55,70,.35); }
  .card::after { content: ""; position: absolute; inset: calc(1.6 * var(--u)); border: 1px solid rgba(43,39,36,.28); pointer-events: none; }
  .head { text-align: center; }
  .head h1 { margin: 0; font-weight: 500; font-size: calc(5.2 * var(--u)); letter-spacing: .34em; margin-right: -.34em; line-height: 1; }
  .head p { margin: calc(1.2 * var(--u)) 0 0; font-style: italic; font-size: max(1.7vmin, calc(2.3 * var(--u))); color: #5E5650; line-height: 1.3; }

  .line { display: flex; align-items: flex-end; gap: calc(1.6 * var(--u)); font-size: max(1.8vmin, calc(2.6 * var(--u))); }
  .line > span { flex: none; padding-bottom: calc(.5 * var(--u)); }
  .line em { flex: 1; min-width: 0; border-bottom: 1px solid rgba(43,39,36,.55); font-style: normal; font-family: "Caveat", "Bradley Hand", cursive; font-weight: 600;
    font-size: calc(5.2 * var(--u)); line-height: 1; color: #22418F; padding: 0 0 calc(.2 * var(--u)) calc(1 * var(--u)); white-space: nowrap; transform: rotate(-1.5deg); transform-origin: 0 100%; }

  .opts { display: flex; flex-direction: column; gap: calc(1.4 * var(--u)); }
  .opt { position: relative; display: flex; align-items: center; gap: calc(2.2 * var(--u)); }
  .box { position: relative; flex: none; width: calc(3.4 * var(--u)); height: calc(3.4 * var(--u)); border: calc(.25 * var(--u)) solid #2B2724; box-sizing: border-box; }
  .box svg { position: absolute; left: -10%; top: -55%; width: 150%; height: 150%; overflow: visible; }
  .yes { font-style: italic; font-size: calc(6.2 * var(--u)); line-height: 1.05; }
  .no { font-style: italic; font-size: max(1.9vmin, calc(3 * var(--u))); color: #8A817A; position: relative; }
  .no svg { position: absolute; left: -4%; top: 30%; width: 108%; height: 40%; overflow: visible; }

  .foot { display: flex; justify-content: space-between; align-items: baseline; gap: calc(2 * var(--u)); border-top: 1px solid rgba(43,39,36,.35); padding-top: calc(1.6 * var(--u));
    font-size: max(1.6vmin, calc(1.8 * var(--u))); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
  .foot b { font-weight: 500; color: #22418F; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 64vmin); }
    .desk { height: 64vmin; }
    .env { top: 2.5vmin; bottom: 10vmin; }
    .card { --u: .82vmin; top: 5.5vmin; bottom: 6vmin; left: 8vmin; right: 8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; height: 100%; object-position: 50% 25%; }
    .desk { left: 46%; top: 0; height: auto; }
    .desk::before { top: 0; bottom: 0; right: auto; width: 3vmin; height: auto;
      background: linear-gradient(90deg, rgba(40,55,70,.18), rgba(40,55,70,.177) 7%, rgba(40,55,70,.17) 14%, rgba(40,55,70,.157) 21%, rgba(40,55,70,.141) 28%, rgba(40,55,70,.122) 35%, rgba(40,55,70,.1) 43%, rgba(40,55,70,.079) 50%, rgba(40,55,70,.058) 57%, rgba(40,55,70,.039) 64%, rgba(40,55,70,.023) 71%, rgba(40,55,70,.01) 79%, rgba(40,55,70,.003) 86%, transparent); }
    .env { left: 9vmin; right: 1.5vmin; top: 5vmin; bottom: 16vmin; }
    .card { --u: .7vmin; left: 4.5vmin; right: 4.5vmin; top: 9vmin; bottom: 9vmin; transform: rotate(-2deg); padding-left: 4.6vmin; padding-right: 4.6vmin; }
    .foot { letter-spacing: .12em; }
    .foot span:last-child { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; object-position: 50% 30%; }
    .desk { left: 46%; }
    .env { left: 14vmin; right: 3vmin; top: 4vmin; bottom: 16vmin; }
    .card { --u: .92vmin; left: 7vmin; right: 7vmin; top: 8vmin; bottom: 9vmin; transform: rotate(-1.6deg); }
    .foot { letter-spacing: .2em; }
    .foot span:last-child { display: inline; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="desk">
    <div class="env"></div>
    <div class="card">
      <div class="head">
        <h1>R.S.V.P.</h1>
        <p>The favour of a reply is requested by the thirtieth of May</p>
      </div>
      <div class="line"><span>M</span><em>the best-dressed guest</em></div>
      <div class="opts">
        <div class="opt">
          <div class="box"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M3 17 C 6 19, 9 23, 11 27 C 15 17, 21 8, 29 1" fill="none" stroke="#22418F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="yes">joyfully accepts</div>
        </div>
        <div class="opt">
          <div class="box"></div>
          <div class="no">regretfully declines<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6 C 20 3, 45 7, 70 4 S 95 5, 100 3" fill="none" stroke="#22418F" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
        </div>
      </div>
      <div class="line"><span>arriving in</span><em>the Guest Edit</em></div>
      <div class="foot"><b>20% off occasionwear</b><span>Code RSVP20</span></div>
    </div>
  </div>
</div>
</body>
</html>
