<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Series Part — a "Part 2" series cover: a giant shadowed numeral, the series name, a three-episode progress strip
     (part 1 watched, part 2 playing, part 3 soon) and the piece featured in this episode.
     tall / 3:4 → numeral band, photo, episode strip · square / wide → numeral + copy left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F1E9DC; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F1E9DC; color: #1C1A17;
    font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column;
    padding: 5vmin 6vmin 5.4vmin; box-sizing: border-box; }
  .banner::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .6;
    background: repeating-linear-gradient(90deg, rgba(28,26,23,.035) 0 1px, transparent 1px 6vmin); }

  .head { position: relative; flex: none; display: flex; align-items: center; gap: 2vmin; }
  .series { font-size: 1.8vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
  .chip { margin-left: auto; font-size: 1.7vmin; font-weight: 600; letter-spacing: .06em; padding: .8vmin 1.8vmin; border: 1px solid #1C1A17; border-radius: 99vmin; white-space: nowrap; }

  .title { position: relative; flex: none; display: grid; grid-template-columns: auto 1fr; align-items: end; column-gap: 4vmin; margin-top: 2vmin; }
  .num { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 36vmin; line-height: .74; color: #E0472B;
    text-shadow: 1.4vmin 1.4vmin 0 #1C1A17; padding-right: 1.4vmin; }
  .tt { padding-bottom: .6vmin; }
  .part { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 12vmin; line-height: .8; letter-spacing: .01em; text-transform: uppercase; }
  .of { font-style: italic; font-size: 2.4vmin; margin-top: 1.2vmin; color: #5B554C; }
  h1 { grid-column: 1 / -1; margin: 3vmin 0 0; font-size: 4vmin; font-weight: 700; line-height: 1.02; letter-spacing: -.025em; }

  .photo { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 4vmin; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }

  .foot { position: relative; flex: none; margin-top: 3.4vmin; }
  .eps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vmin; }
  .ep i { display: block; height: .7vmin; border-radius: 1vmin; background: rgba(28,26,23,.16); }
  .ep.done i { background: #1C1A17; }
  .ep.now i { background: linear-gradient(90deg, #E0472B 0 62%, rgba(28,26,23,.16) 62%); }
  .ep span { display: block; margin-top: 1.1vmin; font-size: 1.7vmin; font-weight: 600; color: #5B554C; white-space: nowrap; }
  .ep.now span { color: #E0472B; }
  .row { display: flex; align-items: center; gap: 2.4vmin; margin-top: 3vmin; }
  .price { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 700; font-size: 6.4vmin; line-height: 1; }
  .note { font-size: 1.8vmin; line-height: 1.3; color: #5B554C; }
  .cta { margin-left: auto; padding: 2vmin 3.2vmin; background: #1C1A17; color: #F1E9DC; font-size: 2.1vmin; font-weight: 700; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { padding: 4.4vmin 6vmin 4.6vmin; }
    .num { font-size: 27vmin; text-shadow: 1.1vmin 1.1vmin 0 #1C1A17; }
    .part { font-size: 9.4vmin; }
    h1 { font-size: 3.4vmin; margin-top: 1.4vmin; }
    .photo { margin-top: 3vmin; }
    .foot { margin-top: 2.8vmin; }
    .row { margin-top: 2.2vmin; }
    .price { font-size: 5.4vmin; }
  }
  /* ── square: numeral + copy left, photo right ── */
  @media (min-aspect-ratio: 9/10) {
    .banner { display: block; padding: 0; }
    .photo { position: absolute; right: 5.6vmin; top: 5.6vmin; bottom: 5.6vmin; width: 46%; height: auto; margin: 0; }
    .head, .title, .foot { position: absolute; left: 5.6vmin; right: calc(46% + 10vmin); }
    .head { top: 5.6vmin; }
    .chip { display: none; }
    .title { top: 13vmin; margin: 0; grid-template-columns: auto 1fr; column-gap: 3vmin; }
    .num { font-size: 30vmin; }
    .part { font-size: 8.4vmin; }
    .of { font-size: 2vmin; }
    h1 { grid-column: 1 / -1; font-size: 4.4vmin; margin-top: 4vmin; }
    .foot { bottom: 5.6vmin; margin: 0; }
    .eps { grid-template-columns: 1fr; gap: 1.2vmin; }
    .ep { display: flex; align-items: center; gap: 1.6vmin; }
    .ep i { flex: none; width: 8vmin; }
    .ep span { margin: 0; }
    .row { flex-wrap: wrap; row-gap: 1.6vmin; }
    .note { display: none; }
    .cta { margin-left: 0; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; right: 6vmin; top: 6vmin; bottom: 6vmin; }
    .head, .title, .foot { left: 7vmin; right: calc(44% + 13vmin); }
    .head { top: 7vmin; }
    .chip { display: block; }
    .title { top: 14vmin; column-gap: 4vmin; }
    .num { font-size: 36vmin; }
    .part { font-size: 11vmin; }
    .of { font-size: 2.4vmin; }
    h1 { font-size: 5vmin; }
    .foot { bottom: 6.4vmin; }
    .eps { grid-template-columns: repeat(3, 1fr); gap: 1.6vmin; }
    .ep { display: block; }
    .ep i { width: auto; }
    .ep span { margin-top: 1.1vmin; }
    .row { flex-wrap: nowrap; }
    .note { display: block; }
    .cta { margin-left: auto; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="head"><div class="series">The Capsule Edit</div><div class="chip">Series · 3 parts</div></div>
  <div class="title">
    <div class="num">2</div>
    <div class="tt"><div class="part">Part</div><div class="of">of three — watch part 1 first</div></div>
    <h1>One piece,<br>styled for the office.</h1>
  </div>
  <div class="photo"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="foot">
    <div class="eps">
      <div class="ep done"><i></i><span>Part 1 · Weekend</span></div>
      <div class="ep now"><i></i><span>Part 2 · Office</span></div>
      <div class="ep"><i></i><span>Part 3 · Friday</span></div>
    </div>
    <div class="row"><div class="price">$74</div><div class="note">Featured in this episode<br>Sizes XS–XL</div><div class="cta">Shop part 2 →</div></div>
  </div>
</div>
</body>
</html>
