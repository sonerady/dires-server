<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* 108 Beads — a mala drawn bead by bead (108 of them, a guru bead and a saffron tassel) around the count of
     the new collection; a meditation tool turned into the drop's number. tall/wide → photo + (mala | copy) ·
     3:4 and square → photo left, copy with the mala stacked on the right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F3ECE2; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F3ECE2; color: #2E2320; font-family: "Karla", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 64vmin); object-fit: cover; object-position: 50% 20%; display: block; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 64vmin; box-sizing: border-box; padding: 5vmin 6vmin 5.4vmin 4vmin; display: flex; align-items: center; gap: 4vmin; }

  .mala { position: relative; flex: none; width: 46vmin; }
  .mala svg { display: block; width: 100%; height: auto; }
  .count { position: absolute; left: 0; right: 0; top: 41%; transform: translateY(-50%); text-align: center; }
  .count small { display: block; font-size: 1.6vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #8A6A55; }
  .count b { display: block; font-family: "Marcellus", Georgia, serif; font-weight: 400; font-size: 13vmin; line-height: 1; letter-spacing: -.02em; margin: .6vmin 0 .2vmin; }
  .count em { font-size: 1.9vmin; font-style: italic; color: #5E4A40; }

  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-self: stretch; }
  .kick { font-size: 1.7vmin; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #B06A1F; white-space: nowrap; }
  h1 { margin: 2vmin 0 0; font-family: "Marcellus", Georgia, serif; font-weight: 400; font-size: 9.2vmin; line-height: .98; letter-spacing: -.01em; }
  .body { margin: 2.4vmin 0 0; font-size: 2vmin; line-height: 1.5; color: #4E3E36; }
  .buy { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1.8vmin; }
  .offer { font-size: 1.8vmin; letter-spacing: .06em; color: #4E3E36; white-space: nowrap; }
  .offer b { font-family: "Marcellus", Georgia, serif; font-weight: 400; font-size: 3.6vmin; letter-spacing: 0; color: #2E2320; margin-right: .8vmin; }
  .cta { display: flex; align-items: center; gap: 1.4vmin; padding: 1.8vmin 3vmin; background: #2E2320; color: #F3ECE2; font-size: 1.8vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 58vmin); }
    .panel { height: 58vmin; padding-top: 4.4vmin; padding-bottom: 4.6vmin; }
    .mala { width: 42vmin; }
    .count b { font-size: 12vmin; }
    h1 { font-size: 8.4vmin; }
    .body { font-size: 1.9vmin; }
  }
  /* ── 3:4 / square → photo left; copy, then mala + offer ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 22%; }
    .panel { left: 50%; top: 0; height: auto; padding: 6vmin 5vmin 5.4vmin 5vmin; flex-direction: column; align-items: stretch; gap: 0; }
    .col { display: contents; }
    .kick { order: 1; } h1 { order: 2; font-size: 8vmin; } .body { order: 3; }
    .mala { order: 4; width: 36vmin; align-self: center; margin: auto 0; }
    .count b { font-size: 10vmin; }
    .buy { order: 5; margin-top: 0; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; }
    .panel { left: 46%; padding: 5vmin 5vmin 5vmin 5vmin; }
    h1 { font-size: 7.2vmin; margin-top: 1.6vmin; }
    .body { display: none; }
    .mala { width: 33vmin; }
    .count b { font-size: 9vmin; }
    .buy { flex-direction: row; align-items: center; justify-content: space-between; gap: 2vmin; }
    .offer { white-space: normal; font-size: 1.7vmin; line-height: 1.3; }
    .offer b { display: block; }
  }
  /* ── wide → photo left, mala | copy ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; object-position: 70% 30%; }
    .panel { left: 44%; padding: 6vmin 6vmin 6vmin 4vmin; flex-direction: row; align-items: center; gap: 4vmin; }
    .col { display: flex; }
    .mala { width: 44vmin; margin: 0; align-self: center; }
    .count b { font-size: 12vmin; }
    h1 { font-size: 8.4vmin; margin-top: 2.4vmin; }
    .body { display: block; }
    .buy { flex-direction: column; align-items: flex-start; margin-top: auto; }
    .offer { white-space: nowrap; font-size: 1.8vmin; }
    .offer b { display: inline; }
  }
</style>
