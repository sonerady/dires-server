<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Size Gauge — the aluminium foot-measuring gauge from the shoe shop floor: black heel cup,
     men's scale in black, women's in red, a width band and a dashed foot resting on the plate,
     slider parked at size 9. Fit-service copy on deep navy.
     tall → photo above, gauge lying across the panel; 3:4 and wider → photo left, gauge standing upright */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1C2333; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #1C2333; color: #F0EDE6; font-family: "Azeret Mono", Menlo, monospace; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 82vmin); object-fit: cover; object-position: 50% 20%; display: block; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 82vmin; }
  .kick { position: absolute; left: 5vmin; right: 5vmin; top: 4.4vmin; display: flex; justify-content: space-between; font-size: 1.7vmin; letter-spacing: .14em; text-transform: uppercase; color: #A9B0C0; white-space: nowrap; }
  .kick b { color: #E0442F; font-weight: 600; }
  h1 { position: absolute; left: 4.6vmin; top: 9.6vmin; margin: 0; font-family: "Oswald", "Arial Narrow", sans-serif; font-weight: 600; font-size: 13vmin; line-height: .92; letter-spacing: -.005em; text-transform: uppercase; white-space: nowrap; }
  h1 em { font-style: normal; color: #E0442F; }
  .gauge { position: absolute; left: 5vmin; top: 27vmin; width: 90vmin; height: 30vmin; filter: drop-shadow(0 1.2vmin 1.4vmin rgba(0,0,0,.45)); }
  .gauge svg { width: 100%; height: 100%; display: block; }
  .gauge { transform: none; }
  .txt { position: absolute; left: 5vmin; right: 5vmin; bottom: 5vmin; display: flex; align-items: flex-end; justify-content: space-between; gap: 4vmin; }
  .txt p { margin: 0; font-size: 1.9vmin; line-height: 1.55; color: #C9CEDA; max-width: 46vmin; }
  .txt p b { display: block; margin-bottom: .8vmin; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 3.6vmin; line-height: 1.05; color: #F0EDE6; text-transform: uppercase; letter-spacing: .01em; }
  .cta { flex: none; background: #E0442F; color: #fff; padding: 2vmin 2.8vmin; font-family: "Oswald", sans-serif; font-weight: 600; font-size: 3vmin; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

  .lib { position: absolute; width: 0; height: 0; overflow: hidden; }
  .gauge .v { display: none; }
  .read { display: none; }
  .read small { display: block; font-size: 1.6vmin; letter-spacing: .14em; text-transform: uppercase; color: #A9B0C0; }
  .read strong { display: block; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 16vmin; line-height: .9; color: #F0EDE6; }
  .read span { display: block; margin-top: .6vmin; font-size: 1.7vmin; letter-spacing: .04em; color: #C9CEDA; white-space: nowrap; }
  .read .cm { margin-top: .2vmin; color: #A9B0C0; }
  .read strong + span { border-top: 1px solid rgba(240,237,230,.3); padding-top: 1vmin; }

  /* 3:4 / 4:5 → photo left; gauge stands upright down the panel, copy beside it */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 52%; height: 100%; object-position: 50% 25%; }
    .panel { left: 52%; top: 0; height: auto; }
    .kick { left: 4vmin; right: 4vmin; top: 4vmin; }
    .kick span:last-child { display: none; }
    .gauge { left: 4vmin; top: 10vmin; width: 22vmin; height: 66vmin; filter: drop-shadow(1vmin .6vmin 1.2vmin rgba(0,0,0,.45)); }
    .gauge .h { display: none; }
    .gauge .v { display: block; }
    h1 { left: 29.5vmin; top: 10vmin; font-size: 5.8vmin; line-height: .95; white-space: normal; }
    .read { display: block; position: absolute; left: 29.5vmin; top: 40vmin; }
    .read strong { font-size: 13vmin; }
    .read span { white-space: normal; line-height: 1.5; }
    .txt { left: 4vmin; right: 4vmin; bottom: 4vmin; flex-direction: column; align-items: stretch; gap: 2.4vmin; }
    .txt p { font-size: 1.7vmin; max-width: none; }
    .txt p b { font-size: 3vmin; }
    .cta { font-size: 2.6vmin; padding: 1.8vmin 2vmin; display: flex; justify-content: space-between; }
  }
  /* square */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; }
    .panel { left: 50%; }
    .gauge { left: 4vmin; top: 10vmin; width: 18vmin; height: 54vmin; }
    h1 { left: 26vmin; top: 10vmin; font-size: 6.4vmin; }
    .read { left: 26vmin; top: 34vmin; }
    .read strong { font-size: 10vmin; }
    .txt { flex-direction: row; align-items: flex-end; gap: 2vmin; }
    .txt p span { display: none; }
    .txt p b { font-size: 2.8vmin; }
    .cta { font-size: 2.4vmin; padding: 1.6vmin 1.8vmin; }
  }
  /* wide → photo 50%, taller upright gauge and a roomier readout */
  @media (min-aspect-ratio: 6/5) {
    .kick { left: 5vmin; right: 5vmin; }
    .kick span:last-child { display: inline; }
    .gauge { left: 6vmin; top: 11vmin; width: 22vmin; height: 66vmin; }
    h1 { left: 35vmin; top: 11vmin; font-size: 9vmin; }
    .read { left: 35vmin; top: 42vmin; }
    .read strong { font-size: 13vmin; }
    .read span { white-space: nowrap; }
    .txt { left: 6vmin; right: 5vmin; bottom: 5vmin; }
    .txt p { font-size: 1.8vmin; }
    .txt p span { display: inline; }
    .txt p b { font-size: 3.2vmin; }
    .cta { font-size: 2.8vmin; padding: 2vmin 2.6vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="kick"><span>Fit service · <b>Nº 26</b></span><span>Heel to toe, both feet</span></div>
    <h1>Find your <em>fit.</em></h1>
    <svg class="lib" width="0" height="0" aria-hidden="true"><defs>
          <linearGradient id="al" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4E7EA"/><stop offset=".45" stop-color="#B7BCC2"/><stop offset=".55" stop-color="#C8CCD1"/><stop offset="1" stop-color="#9DA3AA"/></linearGradient>
          <linearGradient id="br" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
        <g id="gg">
        
        <rect x="1" y="2" width="298" height="96" rx="9" fill="url(#al)" stroke="#7E858D" stroke-width=".8"/>
        <rect x="1" y="2" width="298" height="96" rx="9" fill="url(#br)" opacity=".6"/>
        <!-- heel cup -->
        <path d="M11 2 H28 C19 30 19 70 28 98 H11 C5 98 1 94 1 88 V12 C1 6 5 2 11 2 Z" fill="#16181C"/>
        <!-- men's scale -->
        <g stroke="#16181C" stroke-width=".7">
          <path d="M36 22 H290"/>
          <path d="M40 22 V13 M68 22 V13 M96 22 V13 M124 22 V13 M152 22 V13 M180 22 V13 M208 22 V13 M236 22 V13 M264 22 V13 M292 22 V13"/>
          <path d="M54 22 V17 M82 22 V17 M110 22 V17 M138 22 V17 M166 22 V17 M194 22 V17 M222 22 V17 M250 22 V17 M278 22 V17"/>
        </g>
        <g font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="9" fill="#16181C" text-anchor="middle">
          <text x="40" y="33">4</text><text x="68" y="33">5</text><text x="96" y="33">6</text><text x="124" y="33">7</text><text x="152" y="33">8</text><text x="208" y="33">10</text><text x="236" y="33">11</text><text x="264" y="33">12</text>
        </g>
        <!-- women's scale -->
        <g stroke="#E0442F" stroke-width=".7">
          <path d="M36 78 H290"/>
          <path d="M40 78 V87 M68 78 V87 M96 78 V87 M124 78 V87 M152 78 V87 M180 78 V87 M208 78 V87 M236 78 V87 M264 78 V87 M292 78 V87"/>
          <path d="M54 78 V83 M82 78 V83 M110 78 V83 M138 78 V83 M166 78 V83 M194 78 V83 M222 78 V83 M250 78 V83 M278 78 V83"/>
        </g>
        <g font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="8" fill="#E0442F" text-anchor="middle">
          <text x="40" y="75">5½</text><text x="68" y="75">6½</text><text x="96" y="75">7½</text><text x="124" y="75">8½</text><text x="152" y="75">9½</text><text x="180" y="75">10½</text><text x="208" y="75">11½</text><text x="236" y="75">12½</text><text x="264" y="75">13½</text>
        </g>
        <g font-family="Azeret Mono, monospace" font-weight="600" font-size="5" fill="#16181C">
          <text x="33" y="15">M</text><text x="33" y="90" fill="#E0442F">W</text>
        </g>
        <!-- width band -->
        <path d="M200 46 L292 40 L292 60 L200 56 Z" fill="#16181C" opacity=".1"/>
        <g font-family="Azeret Mono, monospace" font-weight="600" font-size="6" fill="#16181C" text-anchor="middle">
          <text x="206" y="54">A</text><text x="222" y="53.5">B</text><text x="238" y="53">C</text><text x="254" y="52.5">D</text><text x="270" y="52">E</text><text x="286" y="51.5" font-size="5">EE</text>
        </g>
        <text x="246" y="43" font-family="Azeret Mono, monospace" font-size="4" letter-spacing="1" fill="#555B62" text-anchor="middle">WIDTH</text>
        <!-- foot resting on the plate -->
        <path d="M30 50 C30 39 42 36 60 38 C92 41 118 35 146 35 C168 35 178 42 178 50 C178 58 168 65 146 65 C118 65 92 59 60 62 C42 64 30 61 30 50 Z" fill="none" stroke="#16181C" stroke-width=".8" stroke-dasharray="2.4 1.8"/>
        <!-- slider parked at 9 -->
        <rect x="173" y="4" width="14" height="22" rx="1.5" fill="#16181C"/>
        <path d="M180 26 L176 31 H184 Z" fill="#16181C"/>
        <text x="180" y="18" font-family="Oswald, sans-serif" font-weight="700" font-size="10" fill="#F0EDE6" text-anchor="middle">9</text>
        <circle cx="180" cy="50" r="2.2" fill="#E0442F"/>
        <text x="96" y="52" font-family="Azeret Mono, monospace" font-size="4.2" letter-spacing=".8" fill="#555B62" text-anchor="middle">FIT GAUGE · MODEL 26</text>
      </g></defs></svg>
    <div class="gauge">
      <svg class="h" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true"><use href="#gg"/></svg>
      <svg class="v" viewBox="0 0 100 300" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(100 0) rotate(90)"><use href="#gg"/></g></svg>
    </div>
    <div class="read"><small>Your size</small><strong>9</strong><span>UK 8 · EU 42.5</span><span class="cm">27 cm heel–toe</span></div>
    <div class="txt">
      <p><b>Free size exchanges</b>On the whole new season, <span>any size, </span>30 days.</p>
      <div class="cta">Find my size →</div>
    </div>
  </div>
</div>
</body>
</html>
