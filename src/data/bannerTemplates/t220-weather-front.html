<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;900&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Weather Front — a synoptic chart: the seam between photo and page is drawn as a cold front (blue triangles
     advancing into the page), faint isobars with pressure numbers, a red L and blue H, a warm front, and a map key
     that turns the symbols into the offer. tall → photo above, chart below · square/wide → photo left, front down the seam */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EEF1EC; }
  .banner { --panel: 90vmin; position: fixed; inset: 0; overflow: hidden; background: #EEF1EC; color: #10212B; font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "Spline Sans Mono", Menlo, monospace; }

  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); object-fit: cover; object-position: 50% 20%; }
  .chart { position: absolute; left: 0; right: 0; bottom: 0; height: var(--panel); overflow: hidden; }
  .map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .front { position: absolute; display: block; }
  .front.h { left: 0; right: 0; top: calc(100% - var(--panel) - .35vmin); width: 100%; height: 3.4vmin; }
  .front.v { display: none; }

  .copy { position: absolute; left: 6vmin; right: 6vmin; top: 7vmin; bottom: 5.4vmin; display: flex; flex-direction: column; }
  .meta { display: flex; justify-content: space-between; gap: 2vmin; font-size: 1.7vmin; letter-spacing: .08em; text-transform: uppercase; color: #3E5563; }
  h1 { margin: 2.6vmin 0 0; font-weight: 900; font-size: 11.4vmin; line-height: .9; letter-spacing: -.045em; }
  h1 em { font-style: normal; color: #2F63C9; }
  .lede { margin: 2.6vmin 0 0; max-width: 60vmin; font-weight: 500; font-size: 2.5vmin; line-height: 1.4; color: #2D4250; }
  .key { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vmin; }
  .key div { display: flex; align-items: center; gap: 1.6vmin; padding: 1.6vmin 1.8vmin; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(16,33,43,.12); }
  .key svg { flex: none; width: 7vmin; height: 3vmin; }
  .key span { font-size: 1.7vmin; line-height: 1.3; letter-spacing: .04em; text-transform: uppercase; color: #3E5563; }
  .key b { display: block; font-family: "Schibsted Grotesk", sans-serif; font-weight: 900; font-size: 3.6vmin; letter-spacing: -.02em; text-transform: none; color: #10212B; line-height: 1.05; }
  .foot { margin-top: 2vmin; display: flex; justify-content: space-between; align-items: center; gap: 3vmin; }
  .foot .code { font-size: 1.9vmin; line-height: 1.4; letter-spacing: .04em; color: #3E5563; }
  .foot .code b { color: #10212B; font-weight: 600; letter-spacing: .12em; }
  .cta { flex: none; padding: 1.9vmin 3.2vmin; background: #10212B; color: #EEF1EC; font-weight: 700; font-size: 2.1vmin; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 5/8) {
    .banner { --panel: 82vmin; }
    .copy { top: 6vmin; bottom: 4.6vmin; }
    h1 { font-size: 10.2vmin; }
    .lede { font-size: 2.3vmin; margin-top: 2vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 68vmin; }
    .copy { top: 5.4vmin; bottom: 4vmin; }
    h1 { font-size: 8.6vmin; margin-top: 2vmin; }
    .lede { display: none; }
    .key div { padding: 1.2vmin 1.6vmin; }
    .key b { font-size: 3.2vmin; }
    .foot { margin-top: 1.6vmin; }
    .cta { padding: 1.6vmin 2.8vmin; }
  }
  /* square / wide → photo left, the front runs down the seam */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 48%; height: 100%; object-position: 50% 22%; }
    .chart { left: 48%; top: 0; height: auto; }
    .front.h { display: none; }
    .front.v { display: block; left: calc(48% - .35vmin); top: 0; bottom: 0; width: 3.4vmin; height: 100%; }
    .copy { left: 7.4vmin; right: 4.6vmin; top: 5vmin; bottom: 4.6vmin; }
    .meta span:last-child { display: none; }
    h1 { font-size: 7.6vmin; margin-top: 2.4vmin; }
    .lede { display: block; font-size: 2vmin; margin-top: 2vmin; }
    .key { grid-template-columns: 1fr; gap: 1vmin; }
    .key div { padding: 1.1vmin 1.4vmin; }
    .key svg { width: 5.6vmin; height: 2.4vmin; }
    .key b { font-size: 2.8vmin; }
    .key span { font-size: 1.6vmin; }
    .foot { flex-direction: column; align-items: stretch; gap: 1.6vmin; margin-top: 1.6vmin; }
    .foot .code { font-size: 1.7vmin; }
    .cta { text-align: center; font-size: 1.8vmin; padding: 1.5vmin 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; object-position: 50% 28%; }
    .chart { left: 44%; }
    .front.v { left: calc(44% - .35vmin); }
    .copy { left: 8.4vmin; right: 6vmin; top: 6vmin; bottom: 5.6vmin; }
    .meta span:last-child { display: inline; }
    h1 { font-size: 9.6vmin; }
    .lede { font-size: 2.2vmin; max-width: 58vmin; }
    .key { grid-template-columns: 1fr 1fr; gap: 1.6vmin; }
    .key div { padding: 1.4vmin 1.6vmin; }
    .key b { font-size: 3.2vmin; }
    .foot { flex-direction: row; align-items: center; margin-top: 2vmin; }
    .foot .code { font-size: 1.8vmin; }
    .cta { font-size: 2vmin; padding: 1.8vmin 3vmin; }
  }
</style>
</head>
<body>

</div>
</body>
