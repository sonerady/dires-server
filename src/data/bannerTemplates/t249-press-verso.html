<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;800;900&family=Courier+Prime:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Press Verso — an agency press print, front and back: china-marker crop corners on the colour front; on the verso,
     a circular archive stamp, a red release-date stamp, the typed caption slip pasted on, and the picture editor's
     pencil note. tall → front above, verso below · square & wide → front left, verso right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EFE8D8; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #EFE8D8; color: #1D1B18; font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif; }
  .front { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 76vmin); }
  .front img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  /* china-marker crop corners */
  .crop { position: absolute; width: 7vmin; height: 7vmin; border: 0 solid rgba(206,44,30,.9); }
  .crop.a { left: 3.4vmin; top: 3.4vmin; border-left-width: .6vmin; border-top-width: .6vmin; }
  .crop.b { right: 3.4vmin; top: 3.4vmin; border-right-width: .6vmin; border-top-width: .6vmin; }
  .crop.c { left: 3.4vmin; bottom: 3.4vmin; border-left-width: .6vmin; border-bottom-width: .6vmin; }
  .crop.d { right: 3.4vmin; bottom: 3.4vmin; border-right-width: .6vmin; border-bottom-width: .6vmin; }

  /* the verso */
  .verso { position: absolute; left: 0; right: 0; bottom: 0; height: 76vmin; box-sizing: border-box; padding: 5.4vmin 6vmin 5.4vmin; display: flex; flex-direction: column; justify-content: space-between;
    background: radial-gradient(ellipse at 30% 20%, #F7F2E6, #EFE8D8 70%); }
  .verso::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(29,27,24,.25); }
  .kick { display: inline-block; font-family: "Courier Prime", "Courier New", monospace; font-size: 1.8vmin; letter-spacing: .08em; text-transform: uppercase; color: #6A6358; }
  h1 { margin: 1.4vmin 0 0; display: block; max-width: 62vmin; font-weight: 900; font-size: 10vmin; line-height: .9; letter-spacing: -.04em; }

  .seal { position: absolute; right: 5vmin; top: 3.4vmin; width: 23vmin; height: 23vmin; transform: rotate(-14deg); opacity: .86; color: #463C8E; }
  .seal svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .seal text { font-family: "Libre Franklin", Arial, sans-serif; font-weight: 800; fill: currentColor; }

  /* the pasted caption slip */
  .slip { position: relative; background: #FBF9F3; padding: 2.4vmin 2.8vmin; box-shadow: 0 .3vmin .8vmin rgba(60,48,30,.18); transform: rotate(-.8deg); font-family: "Courier Prime", "Courier New", monospace; font-size: 2.1vmin; line-height: 1.5; }
  .slip b { font-weight: 700; }
  .slip::before { content: ""; position: absolute; left: 38%; top: -1.2vmin; width: 11vmin; height: 2.6vmin; background: rgba(226,218,196,.8); transform: rotate(2deg); }

  .bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 3vmin; }
  .date { flex: none; border: .45vmin solid rgba(200,40,28,.88); color: rgba(200,40,28,.9); padding: 1vmin 1.8vmin .8vmin; transform: rotate(3deg); text-align: center; font-weight: 800; text-transform: uppercase; }
  .date small { display: block; font-size: 1.6vmin; line-height: 1.2; letter-spacing: .24em; margin-bottom: .3vmin; }
  .date b { display: block; font-weight: 900; font-size: 3.8vmin; line-height: 1.05; letter-spacing: .02em; white-space: nowrap; }
  .pencil { font-family: "Caveat", "Bradley Hand", cursive; font-weight: 600; font-size: 3.6vmin; line-height: 1; color: #57524A; transform: rotate(-3deg); text-align: right; }
  .pencil b { display: block; white-space: nowrap; font-weight: 700; font-size: 5vmin; color: #1D1B18; }

  @media (min-aspect-ratio: 7/10) {
    .front { width: 52%; height: 100%; }
    .verso { left: 52%; top: 0; height: auto; padding: 5vmin 4.6vmin; }
    .verso::before { left: 0; top: 0; bottom: 0; width: 1px; height: auto; }
    h1 { font-size: 7.4vmin; margin-top: 16vmin; }
    .seal { width: 17vmin; height: 17vmin; right: 3.6vmin; top: 3vmin; }
    .slip { font-size: 1.8vmin; padding: 2vmin 2.2vmin; }
    .bot { flex-direction: column; align-items: flex-start; gap: 2.4vmin; }
    .date b { font-size: 3vmin; }
    .pencil { text-align: left; font-size: 3vmin; }
    .pencil b { font-size: 4.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .front { width: 50%; }
    .verso { left: 50%; padding: 4.6vmin; }
    h1 { font-size: 6.6vmin; margin-top: 13vmin; }
    .seal { width: 15vmin; height: 15vmin; }
    .slip { font-size: 1.7vmin; line-height: 1.45; }
    .bot { flex-direction: row; align-items: flex-end; }
    .date b { font-size: 2.6vmin; }
    .pencil { text-align: right; font-size: 2.8vmin; }
    .pencil b { font-size: 3.6vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .front { width: 45%; }
    .verso { left: 45%; padding: 5.4vmin 6vmin; }
    h1 { font-size: 8.6vmin; margin-top: 2vmin; max-width: 48vmin; }
    .seal { width: 21vmin; height: 21vmin; right: 5vmin; top: 4vmin; }
    .slip { font-size: 2vmin; max-width: 70vmin; }
    .date b { font-size: 3.4vmin; }
    .pencil { font-size: 3.4vmin; }
    .pencil b { font-size: 4.8vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="front"><img src="{{PRODUCT_IMAGE}}" alt=""><i class="crop a"></i><i class="crop b"></i><i class="crop c"></i><i class="crop d"></i></div>
  <div class="verso">
    <div class="seal"><svg viewBox="0 0 100 100"><defs><path id="ring" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs><circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1.4"/><text font-size="9.6" letter-spacing="2.2"><textPath href="#ring">STUDIO ORO · PICTURE ARCHIVE ·</textPath></text><text x="50" y="47" text-anchor="middle" font-size="10">Nº 26</text><text x="50" y="60" text-anchor="middle" font-size="7" letter-spacing="1">PRESS</text></svg></div>
    <div><div class="kick">Verso · Print 26/114</div><h1>For immediate release.</h1></div>
    <div class="slip"><b>NEW SEASON —</b> The autumn/winter collection lands in store and online today. Press edit <b>−30%</b> with code <b>PRESS30</b>. Photo: Studio Oro.</div>
    <div class="bot"><div class="date"><small>Released</small><b>25 Sep 2026</b></div><div class="pencil">use full page<b>−30% · 3 days</b></div></div>
  </div>
</div>
</body>
</html>
