<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Rolling Price — a descending sale shown as a mechanical price counter: ivory drums with Bodoni numerals,
     the last drum caught mid-roll from 9 down to 8, a red reading line across the window, past prices struck out below.
     tall → photo above the white panel; square / wide → counter panel left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F7F5F0; }
  .banner { --panel: 72vmin; --dh: 22vmin; --dw: 15vmin; position: fixed; inset: 0; overflow: hidden; background: #F7F5F0; color: #111; font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); object-fit: cover; object-position: 50% 22%; }
  .panel { position: absolute; left: 6vmin; right: 6vmin; bottom: 5.5vmin; height: calc(var(--panel) - 10vmin); display: flex; flex-direction: column; }
  .kick { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.8vmin; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding-bottom: 1.4vmin; border-bottom: 1px solid #111; }
  .kick b { color: #D2201F; font-weight: 700; }
  h1 { margin: 2.2vmin 0 0; font-family: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif; font-weight: 400; font-size: 5.8vmin; line-height: 1.04; letter-spacing: -.01em; }
  h1 em { font-style: italic; }

  .meter { margin-top: auto; display: flex; align-items: center; gap: 2.4vmin; }
  .label { font-size: 1.8vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #D2201F; display: flex; align-items: center; gap: 1vmin; writing-mode: vertical-rl; transform: rotate(180deg); }
  .label::after { content: ""; width: 1.1vmin; height: 1.1vmin; border-radius: 50%; background: #D2201F; }
  .drums { position: relative; display: flex; gap: .5vmin; padding: 1vmin; background: #111; }
  .drums::before, .drums::after { content: ""; position: absolute; top: 50%; z-index: 2; margin-top: -1vmin; border: 1vmin solid transparent; }
  .drums::before { left: 0; border-left-color: #D2201F; }
  .drums::after { right: 0; border-right-color: #D2201F; }
  .drum, .cur { position: relative; width: var(--dw); height: var(--dh); overflow: hidden; background: linear-gradient(#BDB8AE 0%, #E9E5DC 16%, #FBFAF6 42%, #FFFFFF 50%, #FBFAF6 58%, #E9E5DC 84%, #BDB8AE 100%); }
  .cur { width: calc(var(--dw) * .8); display: flex; align-items: center; justify-content: center; font-family: "Bodoni Moda", Didot, Georgia, serif; font-size: calc(var(--dh) * .62); line-height: 1; }
  .col { position: absolute; left: 0; right: 0; top: 0; }
  .col span { display: block; height: var(--dh); line-height: var(--dh); text-align: center; font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 500; font-size: calc(var(--dh) * .74); }
  .roll .col { transform: translateY(calc(var(--dh) * .16)); }
  .roll .col::before { content: "8"; position: absolute; left: 0; right: 0; top: calc(var(--dh) * -1); height: var(--dh); line-height: var(--dh); text-align: center; font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 500; font-size: calc(var(--dh) * .74); }
  .drum::before, .cur::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(rgba(17,17,17,.28), rgba(17,17,17,0) 30%, rgba(17,17,17,0) 70%, rgba(17,17,17,.28)); }

  .hist { margin-top: 2.2vmin; display: flex; flex-wrap: wrap; align-items: baseline; gap: .8vmin 2vmin; font-family: "Bodoni Moda", Didot, Georgia, serif; font-size: 3vmin; }
  .hist s { color: #8D8A83; text-decoration-color: #D2201F; text-decoration-thickness: .3vmin; }
  .hist small { font-family: "Inter Tight", Arial, sans-serif; font-size: 1.7vmin; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #6E6B64; }
  .foot { margin-top: 3vmin; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; }
  .foot p { margin: 0; font-size: 2.1vmin; line-height: 1.35; color: #3C3A36; }
  .foot p b { font-weight: 700; color: #111; }
  .cta { flex: none; background: #111; color: #F7F5F0; padding: 2vmin 3.2vmin; font-size: 1.9vmin; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 64vmin; --dh: 16vmin; --dw: 11vmin; }
    .panel { bottom: 4.5vmin; height: calc(var(--panel) - 8vmin); }
    h1 { font-size: 5.2vmin; margin-top: 1.8vmin; }
    .hist { margin-top: 1.8vmin; font-size: 2.7vmin; }
    .foot { margin-top: 2.4vmin; }
    .cta { padding: 1.7vmin 2.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --dh: 15vmin; --dw: 9.4vmin; }
    .photo { left: auto; right: 0; width: 46%; height: 100%; object-position: 50% 25%; }
    .panel { left: 5.5vmin; right: calc(46% + 5vmin); top: 5.5vmin; bottom: 5.5vmin; height: auto; }
    h1 { font-size: 5.8vmin; margin-top: 3vmin; }
    h1 br.b { display: none; }
    .meter { gap: 1.8vmin; }
    .hist { font-size: 2.6vmin; gap: .6vmin 1.6vmin; }
    .foot { flex-direction: column; align-items: flex-start; gap: 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --dh: 19vmin; --dw: 12.5vmin; }
    .photo { width: 46%; object-position: 65% 25%; }
    .panel { left: 7vmin; right: calc(46% + 7vmin); top: 6.5vmin; bottom: 6.5vmin; }
    h1 { font-size: 7vmin; }
    h1 br.b { display: inline; }
    .meter { gap: 2.4vmin; }
    .hist { font-size: 3vmin; }
    .foot { flex-direction: row; align-items: center; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="kick"><span>Studio Oro</span><b>Descending sale</b></div>
    <h1>The price rolls <em>down</em><br class="b"> every six hours.</h1>
    <div class="meter">
      <div class="label">Now</div>
      <div class="drums">
        <div class="cur">€</div>
        <div class="drum"><div class="col"><span>1</span></div></div>
        <div class="drum"><div class="col"><span>4</span></div></div>
        <div class="drum roll"><div class="col"><span>9</span></div></div>
      </div>
    </div>
    <div class="hist"><small>Was</small><s>€240</s><s>€210</s><s>€180</s><small>Next · €129</small></div>
    <div class="foot"><p>Next roll at 06:00.<br><b>Wait for it — if it lasts.</b></p><span class="cta">Buy at €149</span></div>
  </div>
</div>
</body>
</html>
