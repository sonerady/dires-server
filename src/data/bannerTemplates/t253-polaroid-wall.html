<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* Polaroid Wall — the final-selects board backstage: black foam-core, the approved look as a big instant print,
     a detail print beside it, strips of white artist tape, sharpie captions and embossed label-maker tape for the offer.
     tall → big print above, detail print + label stack below · square & wide → big print left, the rest right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #171717; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #1A1A1A; font-family: "Space Mono", "Courier New", monospace;
    background: radial-gradient(ellipse 80% 60% at 40% 35%, #262626 0%, #1A1A1A 60%, #121212 100%); }
  .banner::before { content: ""; position: absolute; inset: 0; opacity: .5;
    background: repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.018) 0 .2vmin, transparent .2vmin .5vmin); }
  .hand { font-family: "Caveat Brush", "Bradley Hand", "Marker Felt", cursive; }

  /* instant prints */
  .pol { position: absolute; background: #F6F4EE; box-shadow: 0 1.4vmin 2.6vmin rgba(0,0,0,.55), 0 .2vmin .4vmin rgba(0,0,0,.4); box-sizing: border-box; }
  .pol img { position: absolute; object-fit: cover; display: block; }
  .pol .cap { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; color: #1D1D1D; line-height: 1; }
  .tape { position: absolute; width: 13vmin; height: 4.2vmin; background: rgba(238,234,222,.86); box-shadow: 0 .2vmin .4vmin rgba(0,0,0,.18);
    clip-path: polygon(2% 8%, 12% 0, 26% 6%, 40% 0, 56% 5%, 72% 0, 88% 6%, 100% 2%, 98% 92%, 86% 100%, 70% 94%, 54% 100%, 38% 95%, 22% 100%, 8% 94%, 0 100%); }

  .main { left: 9vmin; right: 9vmin; top: 14vmin; height: 60%; padding: 2.6vmin 2.6vmin 0; transform: rotate(-1.8deg); z-index: 2; }
  .main img { left: 2.6vmin; top: 2.6vmin; width: calc(100% - 5.2vmin); height: calc(100% - 13.6vmin); object-position: 50% 20%; }
  .main .cap { bottom: 2.6vmin; font-size: 6.4vmin; }
  .main .cap em { font-style: normal; color: #D2261A; }
  .main .t1 { left: -3vmin; top: -1.6vmin; transform: rotate(-38deg); }
  .main .t2 { right: -3vmin; top: -1.6vmin; transform: rotate(36deg); }

  .det { left: 6vmin; width: 38vmin; bottom: 6vmin; height: 20%; padding: 2vmin; transform: rotate(4deg); z-index: 3; }
  .det .win { position: absolute; left: 2vmin; top: 2vmin; width: calc(100% - 4vmin); height: calc(100% - 9vmin); overflow: hidden; }
  .det img { left: 0; top: 0; width: 100%; height: 100%; object-position: 50% 45%; transform: scale(1.9); transform-origin: 50% 42%; }
  .det .cap { bottom: 1.6vmin; font-size: 4.4vmin; }
  .det .t3 { left: calc(50% - 6.5vmin); top: -2.2vmin; transform: rotate(-4deg); }

  /* label-maker tape */
  .dy { position: absolute; display: inline-block; white-space: nowrap; color: #FFFFFF; font-weight: 700; text-transform: uppercase; letter-spacing: .2em;
    padding: .9vmin 1.8vmin .9vmin 2.2vmin; font-size: 2.3vmin; line-height: 1;
    text-shadow: 0 -.1vmin 0 rgba(0,0,0,.45), 0 .12vmin 0 rgba(255,255,255,.45);
    box-shadow: inset 0 .25vmin 0 rgba(255,255,255,.14), inset 0 -.25vmin 0 rgba(0,0,0,.25), 0 .3vmin .6vmin rgba(0,0,0,.4); }
  .dy.red { background: linear-gradient(#D51F2C, #B3121F); }
  .dy.blk { background: linear-gradient(#2E2E30, #111112); }
  .dy.blu { background: linear-gradient(#1F4FD6, #143AA8); }

  .d1 { left: 7vmin; top: 5.6vmin; transform: rotate(-1.5deg); z-index: 4; }
  .d2 { right: 7vmin; top: 6.2vmin; transform: rotate(1.2deg); z-index: 4; }
  .stack { position: absolute; right: 5vmin; bottom: 6vmin; width: 48vmin; height: auto; z-index: 4; }
  .stack .dy { position: static; display: table; margin-left: auto; }
  .stack .big { font-size: 9vmin; letter-spacing: .08em; padding: 1.2vmin 2vmin 1.2vmin 2.6vmin; transform: rotate(-2deg); margin-top: 1.6vmin; }
  .stack .s1 { transform: rotate(1.5deg); }
  .stack .s3 { transform: rotate(-.5deg); margin-top: 1.8vmin; }
  .stack .note { margin-top: 2.4vmin; text-align: right; color: #EDEAE2; font-size: 4.2vmin; line-height: 1; transform: rotate(-2deg); }

  /* 2:3 */
  @media (min-aspect-ratio: 5/8) {
    .main { top: 13vmin; height: 54%; left: 14vmin; right: 14vmin; }
    .det { height: 23%; width: 34vmin; bottom: 5vmin; }
    .stack { bottom: 5vmin; }
    .stack .big { font-size: 7.6vmin; }
  }
  /* shorter portrait: big print left-of-centre, stack beside detail */
  @media (min-aspect-ratio: 7/10) {
    .main { left: 6vmin; right: auto; width: 52vmin; top: 13vmin; height: calc(100% - 20vmin); }
    .main .cap { font-size: 5.4vmin; }
    .det { left: auto; right: 7vmin; width: 32vmin; top: 17vmin; bottom: auto; height: 38%; }
    .stack { right: 5vmin; width: 36vmin; bottom: 6vmin; height: auto; }
    .stack .big { font-size: 6.2vmin; }
    .d2 { top: 5.6vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .main { left: 5vmin; width: 48vmin; top: 12vmin; height: calc(100% - 18vmin); }
    .det { right: 6vmin; width: 30vmin; top: 12vmin; height: 36vmin; }
    .det .cap { font-size: 3.8vmin; }
    .stack { right: 5vmin; width: 38vmin; bottom: 6vmin; }
    .stack .big { font-size: 5.8vmin; }
    .stack .note { font-size: 3.8vmin; }
    .dy { font-size: 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .main { left: 8vmin; width: 52vmin; top: 12vmin; height: calc(100% - 18vmin); transform: rotate(-2.2deg); }
    .det { left: 66vmin; right: auto; width: 32vmin; top: 16vmin; height: 42vmin; transform: rotate(3deg); }
    .stack { right: 7vmin; width: 42vmin; bottom: auto; top: 20vmin; }
    .stack .big { font-size: 7.4vmin; }
    .stack .note { font-size: 4.4vmin; margin-top: 3.4vmin; }
    .d1 { left: 8vmin; }
    .d2 { right: 7vmin; }
    .dy { font-size: 2.2vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <span class="dy red d1">Final selects</span>
  <span class="dy blk d2">SS27 · Board 3</span>
  <div class="pol main">
    <img src="{{PRODUCT_IMAGE}}" alt="">
    <i class="tape t1"></i><i class="tape t2"></i>
    <div class="cap hand">Look 04 — <em>approved ✓</em></div>
  </div>
  <div class="pol det">
    <div class="win"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
    <i class="tape t3"></i>
    <div class="cap hand">the detail</div>
  </div>
  <div class="stack">
    <span class="dy blk s1">New season edit</span>
    <span class="dy red big">20% off</span>
    <span class="dy blu s3">Code SELECT20</span>
    <div class="note hand">online till Sun 12.10 →</div>
  </div>
</div>
</body>
</html>
