<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Radio Tuner — the late-night mix show on a black hi-fi faceplate: glowing ON AIR lamp, an amber backlit FM dial
     with tick scale and a red needle parked on the station, the show title in italic serif, knurled knobs and a
     signal meter. The drop is "on air".
     tall → photo above, faceplate below · square & wide → faceplate left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #111; }
  .banner { --pl: #141415; --amb: #FFB547; --red: #FF3B2F; --txt: #EDE8DF; --mute: #8E8A84;
    position: fixed; inset: 0; overflow: hidden; color: var(--txt); font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, rgba(0,0,0,0) 1px .5vmin), linear-gradient(180deg, #1D1D1F, #111112); }

  .photo { position: absolute; left: 0; right: 0; top: 0; height: calc(100% - 70vmin); overflow: hidden; }
  .photo img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .photo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .5vmin; background: linear-gradient(90deg, #4A4A4C, #9A9A9C, #4A4A4C); }

  .face { position: absolute; left: 6vmin; right: 6vmin; bottom: 5vmin; height: 60vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 3vmin; }
  .air { display: flex; align-items: center; gap: 1.6vmin; font-weight: 600; font-size: 2.6vmin; letter-spacing: .24em; text-transform: uppercase; white-space: nowrap; color: #FFE3DD;
    background: #3A0D0B; padding: 1vmin 2vmin; border-radius: .6vmin; box-shadow: inset 0 0 0 1px rgba(255,59,47,.6), 0 0 2.4vmin rgba(255,59,47,.45); text-shadow: 0 0 1vmin rgba(255,59,47,.9); }
  .air i { width: 1.6vmin; height: 1.6vmin; border-radius: 50%; background: var(--red); box-shadow: 0 0 1vmin var(--red), 0 0 2vmin var(--red); }
  .stn { text-align: right; font-weight: 500; font-size: 1.8vmin; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
  .stn b { display: block; font-weight: 600; font-size: 3.6vmin; letter-spacing: .08em; color: var(--txt); }

  .dial { position: relative; height: 17vmin; background: linear-gradient(180deg, #1A1206, #2A1C08 50%, #1A1206); border-radius: .8vmin; box-shadow: inset 0 0 0 .4vmin #050505, inset 0 1vmin 2vmin rgba(0,0,0,.7), 0 0 0 1px #3A3A3C; overflow: hidden; }
  .dial::before { content: ""; position: absolute; left: 4%; right: 4%; top: 4.4vmin; height: 2.6vmin;
    background: repeating-linear-gradient(90deg, rgba(255,181,71,.85) 0 1px, rgba(0,0,0,0) 1px 10%) 0 0 / 100% 100%, repeating-linear-gradient(90deg, rgba(255,181,71,.55) 0 1px, rgba(0,0,0,0) 1px 2%) 0 1vmin / 100% 1.6vmin no-repeat; }
  .dial::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 45%; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0)); }
  .nums { position: absolute; left: 4%; right: 4%; top: 7.8vmin; display: flex; justify-content: space-between; font-weight: 500; font-size: 2.4vmin; line-height: 1; color: var(--amb); text-shadow: 0 0 .8vmin rgba(255,181,71,.7); }
  .nums span { width: 0; display: flex; justify-content: center; }
  .band { position: absolute; left: 1.6vmin; top: 1.4vmin; font-weight: 600; font-size: 1.7vmin; letter-spacing: .2em; color: var(--amb); opacity: .85; }
  .mhz { position: absolute; right: 1.6vmin; bottom: 1.2vmin; font-weight: 500; font-size: 1.7vmin; letter-spacing: .16em; color: var(--amb); opacity: .85; }
  .am { position: absolute; left: 4%; right: 4%; bottom: 1.4vmin; display: flex; justify-content: space-between; font-size: 1.6vmin; color: rgba(255,181,71,.55); padding-right: 6vmin; }
  .ndl { position: absolute; top: .8vmin; bottom: .8vmin; left: calc(4% + 92% * .495); width: .5vmin; margin-left: -.25vmin; background: var(--red); box-shadow: 0 0 1vmin var(--red); z-index: 1; }

  .show { display: flex; align-items: flex-end; justify-content: space-between; gap: 3vmin; }
  .ttl { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 9.4vmin; line-height: .95; letter-spacing: -.01em; }
  .ttl small { display: block; font-family: "Oswald", sans-serif; font-style: normal; font-weight: 500; font-size: 2vmin; letter-spacing: .24em; text-transform: uppercase; color: var(--amb); margin-bottom: 1vmin; }
  .knob { flex: none; width: 13vmin; height: 13vmin; border-radius: 50%; background: repeating-conic-gradient(#2E2E30 0 3deg, #4A4A4D 3deg 6deg); box-shadow: 0 .6vmin 1.2vmin rgba(0,0,0,.6), inset 0 0 0 .3vmin #0A0A0A; position: relative; }
  .knob::after { content: ""; position: absolute; inset: 1.8vmin; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5A5A5E, #1E1E20 70%); }
  .knob::before { content: ""; position: absolute; left: 50%; top: 2.2vmin; width: .5vmin; height: 3vmin; margin-left: -.25vmin; background: var(--txt); z-index: 1; transform-origin: 50% 4.3vmin; transform: rotate(35deg); }

  .ft { display: flex; justify-content: space-between; align-items: center; gap: 3vmin; border-top: 1px solid rgba(237,232,223,.22); padding-top: 2vmin; }
  .info { font-weight: 400; font-size: 2.4vmin; letter-spacing: .06em; line-height: 1.35; white-space: nowrap; }
  .info b { font-weight: 600; color: var(--amb); letter-spacing: .1em; }
  .sig { display: flex; align-items: flex-end; gap: .6vmin; height: 4vmin; }
  .sig i { width: 1vmin; background: #3FD28B; box-shadow: 0 0 .8vmin rgba(63,210,139,.6); }
  .sig i:nth-child(1) { height: 25%; } .sig i:nth-child(2) { height: 45%; } .sig i:nth-child(3) { height: 65%; } .sig i:nth-child(4) { height: 85%; } .sig i:nth-child(5) { height: 100%; background: #2A3A31; box-shadow: none; }
  .cta { flex: none; font-weight: 600; font-size: 2.2vmin; letter-spacing: .18em; text-transform: uppercase; color: #141415; background: var(--amb); padding: 1.3vmin 2.2vmin; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 62vmin); }
    .face { left: 12vmin; right: 12vmin; height: 54vmin; bottom: 4vmin; }
    .dial { height: 15vmin; }
    .ttl { font-size: 8.4vmin; }
    .knob { width: 11vmin; height: 11vmin; }
    .knob::after { inset: 1.5vmin; }
    .knob::before { top: 1.8vmin; transform-origin: 50% 3.7vmin; }
  }

  /* square & wide: faceplate left, photo right */
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; top: 0; bottom: 0; height: 100%; width: 46%; }
    .photo::after { left: 0; right: auto; top: 0; width: .5vmin; height: 100%; background: linear-gradient(180deg, #4A4A4C, #9A9A9C, #4A4A4C); }
    .face { left: 5vmin; right: calc(46% + 5vmin); top: 5vmin; bottom: 5vmin; height: auto; }
    .nums span:nth-child(even) { visibility: hidden; }
    .am { display: none; }
    .dial { height: 14vmin; }
    .ttl { font-size: 7.6vmin; }
    .knob { width: 10vmin; height: 10vmin; }
    .knob::after { inset: 1.4vmin; }
    .knob::before { top: 1.6vmin; height: 2.4vmin; transform-origin: 50% 3.4vmin; }
    .ft { flex-direction: column; align-items: flex-start; gap: 2vmin; }
    .sig { display: none; }
    .info { font-size: 2.2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; }
    .face { left: 6vmin; right: calc(44% + 6vmin); top: 6vmin; bottom: 6vmin; }
    .nums span:nth-child(even) { visibility: visible; }
    .am { display: flex; }
    .dial { height: 16vmin; }
    .ttl { font-size: 8.6vmin; }
    .knob { width: 12vmin; height: 12vmin; }
    .knob::after { inset: 1.7vmin; }
    .knob::before { top: 2vmin; height: 3vmin; transform-origin: 50% 4vmin; }
    .ft { flex-direction: row; align-items: center; }
    .sig { display: flex; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="photo"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="face">
    <div class="top">
      <div class="air"><i></i>On air</div>
      <div class="stn">Studio Oro FM<b>97.9 · Stereo</b></div>
    </div>
    <div class="dial">
      <span class="band">FM</span>
      <div class="nums"><span>88</span><span>90</span><span>92</span><span>94</span><span>96</span><span>98</span><span>100</span><span>102</span><span>104</span><span>106</span><span>108</span></div>
      <div class="am"><span>53</span><span>60</span><span>70</span><span>80</span><span>100</span><span>130</span><span>160</span></div>
      <span class="mhz">MHz</span>
      <i class="ndl"></i>
    </div>
    <div class="show">
      <div class="ttl"><small>Friday night mix</small>The Drop Show</div>
      <div class="knob"></div>
    </div>
    <div class="ft">
      <div class="info">Fri · 9pm till late<br>Call-in code <b>FM30</b> · 30% off</div>
      <div class="sig"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cta">Tune in · shop</div>
    </div>
  </div>
</div>
</body>
</html>
