<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&family=Clicker+Script&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tooled Leather — a saddle-leather flap with Sheridan-style carved scrolls in two corners, a saddle-stitched edge,
     debossed slab lettering, a gold-foil script and a scalloped brass concho carrying the offer.
     tall → photo above, leather below · square & wide → photo left, leather right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #7A4520; }
  .banner { --cream: #F3DDB8; --foil: #EBC47C; --deep: #3A1C09; --panel: 78vmin;
    position: fixed; inset: 0; overflow: hidden; color: var(--cream); font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; background: #7A4520; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); object-fit: cover; object-position: 50% 20%; display: block; }

  .hide { position: absolute; left: 0; right: 0; bottom: 0; height: var(--panel); overflow: hidden;
    background:
      radial-gradient(70% 60% at 30% 35%, rgba(255,190,120,.22), transparent 70%),
      radial-gradient(90% 80% at 80% 95%, rgba(40,15,0,.45), transparent 70%),
      linear-gradient(160deg, #A8652E 0%, #8D5022 45%, #6B3915 100%);
    box-shadow: inset 0 1.2vmin 1.6vmin -.6vmin rgba(30,10,0,.6); }
  .hide::before { content: ""; position: absolute; inset: 2.6vmin; border: .38vmin dashed rgba(246,222,184,.8); pointer-events: none; }
  .hide::after { content: ""; position: absolute; inset: 1.4vmin; border: 1px solid rgba(40,15,0,.45); pointer-events: none; }
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none; }

  .scroll { position: absolute; width: 30vmin; height: 30vmin; pointer-events: none; }
  .scroll.a { right: 3.4vmin; top: 3.4vmin; transform: scaleX(-1); }
  .scroll.b { right: 3.4vmin; bottom: 3.4vmin; transform: rotate(180deg); }

  .copy { position: absolute; left: 9vmin; right: 9vmin; top: 9vmin; bottom: 8vmin; display: flex; flex-direction: column; align-items: flex-start; }
  .k { font-size: 2vmin; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; color: var(--foil); white-space: nowrap; }
  h1 { margin: 5vmin 0 0; font-family: "Holtwood One SC", "Rockwell Extra Bold", Georgia, serif; font-weight: 400; font-size: 10.4vmin; line-height: 1.02; letter-spacing: -.01em;
    color: #2E1406; text-shadow: 0 -.15vmin 0 rgba(10,3,0,.6), 0 .22vmin 0 rgba(255,214,160,.34); }
  .script { margin-top: 1.2vmin; font-family: "Clicker Script", cursive; font-size: 7.6vmin; line-height: 1; color: var(--foil); text-shadow: 0 .25vmin .2vmin rgba(40,15,0,.55); white-space: nowrap; }
  .lede { margin-top: 2.2vmin; max-width: 44vmin; font-size: 2.7vmin; font-weight: 500; line-height: 1.3; letter-spacing: .03em; color: var(--cream); }
  .cta { margin-top: auto; display: flex; align-items: center; gap: 1.6vmin; font-size: 2.5vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; white-space: nowrap;
    padding-bottom: 1.1vmin; border-bottom: .35vmin dashed var(--cream); }

  /* scalloped brass concho */
  .concho { position: absolute; right: 8vmin; bottom: 9vmin; width: 29vmin; height: 29vmin; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, #F0CF86 0 5deg, #9E7430 5deg 10deg);
    -webkit-mask: radial-gradient(circle, #000 60%, transparent 60.4%), repeating-conic-gradient(#000 0 7.5deg, transparent 7.5deg 15deg); -webkit-mask-composite: source-over;
    mask: radial-gradient(circle, #000 60%, transparent 60.4%), repeating-conic-gradient(#000 0 7.5deg, transparent 7.5deg 15deg); }
  .concho-shadow { position: absolute; right: 8vmin; bottom: 9vmin; width: 29vmin; height: 29vmin; border-radius: 50%; box-shadow: .6vmin 1.4vmin 2.4vmin rgba(30,10,0,.55); transform: scale(.93); }
  .plate { position: absolute; right: calc(8vmin + 4.9vmin); bottom: calc(9vmin + 4.9vmin); width: 19.2vmin; height: 19.2vmin; border-radius: 50%; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #3B230A;
    background: radial-gradient(circle at 35% 28%, #FFF1C9 0%, #E9C57E 38%, #B88A3E 78%, #8C6424 100%);
    box-shadow: inset 0 0 0 .5vmin rgba(90,60,20,.55), inset 0 0 0 1.1vmin rgba(255,236,190,.45), inset 0 -.8vmin 1.4vmin rgba(80,50,10,.5); }
  .plate .n { font-family: "Holtwood One SC", Georgia, serif; font-size: 5.4vmin; line-height: .95; text-shadow: 0 .2vmin 0 rgba(255,240,200,.6); }
  .plate .o { font-size: 2vmin; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; margin-top: .4vmin; }
  .plate .c { font-size: 1.6vmin; font-weight: 700; letter-spacing: .12em; margin-top: .8vmin; padding-top: .7vmin; border-top: 1px solid rgba(59,35,10,.6); }

  /* 3:4 – 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 64vmin; }
    .copy { top: 8vmin; bottom: 7vmin; }
    h1 { margin-top: 4vmin; font-size: 9.6vmin; }
    .script { font-size: 6.8vmin; }
    .concho, .concho-shadow { width: 26vmin; height: 26vmin; bottom: 8vmin; }
    .plate { width: 17.2vmin; height: 17.2vmin; right: calc(8vmin + 4.4vmin); bottom: calc(8vmin + 4.4vmin); }
    .plate .n { font-size: 4.8vmin; }
    .plate .c { font-size: 1.6vmin; }
  }
  /* square: photo left, leather right */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .hide { left: 50%; top: 0; height: auto; box-shadow: inset 1.2vmin 0 1.6vmin -.6vmin rgba(30,10,0,.6); }
    .scroll { width: 27vmin; height: 27vmin; }
    .copy { left: 7.4vmin; right: 6vmin; top: 8vmin; bottom: 7vmin; }
    .k { margin-top: 25vmin; font-size: 1.7vmin; letter-spacing: .28em; }
    h1 { margin-top: 2.4vmin; font-size: 6.4vmin; }
    .script { font-size: 5.2vmin; margin-top: .8vmin; }
    .lede { font-size: 2vmin; max-width: 26vmin; margin-top: 1.6vmin; }
    .cta { font-size: 1.9vmin; }
    .concho, .concho-shadow { width: 19vmin; height: 19vmin; right: 5.4vmin; bottom: 15vmin; }
    .plate { width: 12.6vmin; height: 12.6vmin; right: calc(5.4vmin + 3.2vmin); bottom: calc(15vmin + 3.2vmin); }
    .plate .n { font-size: 3.5vmin; }
    .plate .o { font-size: 1.6vmin; letter-spacing: .2em; }
    .plate .c { display: none; }
  }
  /* wide */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 48%; }
    .hide { left: 48%; }
    .scroll { width: 30vmin; height: 30vmin; }
    .copy { left: 9vmin; right: 8vmin; top: 9vmin; bottom: 8.4vmin; }
    .k { margin-top: 0; font-size: 1.9vmin; }
    h1 { margin-top: 20vmin; font-size: 9vmin; }
    .script { font-size: 6.4vmin; }
    .lede { font-size: 2.4vmin; max-width: 38vmin; }
    .cta { font-size: 2.2vmin; }
    .concho, .concho-shadow { width: 25vmin; height: 25vmin; right: 8vmin; bottom: 10vmin; }
    .plate { width: 16.6vmin; height: 16.6vmin; right: calc(8vmin + 4.2vmin); bottom: calc(10vmin + 4.2vmin); }
    .plate .n { font-size: 4.6vmin; }
    .plate .o { font-size: 1.8vmin; }
    .plate .c { display: block; font-size: 1.6vmin; }
  }
</style>
</head>
<body>
<div class="banner">

    <div class="copy">
      <div class="k">Hand-tooled · Nº 26</div>
