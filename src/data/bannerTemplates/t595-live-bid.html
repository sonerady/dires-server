<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Live Bid — an auction running inside a live stream: the photo is the lot on camera, the current bid in huge signal yellow,
     a scrolling bid ladder of handles, a "going once, twice" timer bar and a raise-the-bid CTA.
     tall / 3:4 → header · lot · bid board stacked · square / wide → lot left, bid board right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0B0B0B; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #0B0B0B; color: #F2F0EA; font-family: "IBM Plex Mono", ui-monospace, monospace;
    display: flex; flex-direction: column; padding: 5vmin 5.6vmin 5vmin; box-sizing: border-box; }

  .head { flex: none; display: flex; align-items: flex-end; gap: 2vmin; }
  .title { font-family: "Anton", Impact, sans-serif; font-size: 11vmin; line-height: .86; letter-spacing: .005em; text-transform: uppercase; }
  .title span { color: #FFD400; }
  .meta { margin-left: auto; text-align: right; font-size: 1.7vmin; line-height: 1.6; letter-spacing: .08em; text-transform: uppercase; color: #9A978F; white-space: nowrap; }
  .meta b { display: inline-flex; align-items: center; gap: .8vmin; font-weight: 600; color: #F2F0EA; }
  .meta b i { width: 1.2vmin; height: 1.2vmin; border-radius: 50%; background: #FF3B30; box-shadow: 0 0 0 .5vmin rgba(255,59,48,.25); }

  .lot { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 3.4vmin; }
  .lot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; display: block; }
  .lot .tag { position: absolute; left: 0; top: 0; padding: 1.1vmin 1.8vmin; background: #FFD400; color: #0B0B0B; font-family: "Anton", Impact, sans-serif; font-size: 2.6vmin; letter-spacing: .06em; line-height: 1; }

  .board { position: relative; flex: none; margin-top: 3.4vmin; display: flex; gap: 4vmin; align-items: flex-start; }
  .now { flex: none; }
  .lbl { font-size: 1.6vmin; letter-spacing: .16em; text-transform: uppercase; color: #9A978F; }
  .now b { display: block; margin-top: .6vmin; font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 15vmin; line-height: .9; color: #FFD400; letter-spacing: -.01em; }
  .now small { display: block; margin-top: 1vmin; font-size: 1.7vmin; color: #C9C6BD; }
  .ladder { flex: 1 1 auto; min-width: 0; padding-top: .4vmin; }
  .ladder ol { list-style: none; margin: 1.2vmin 0 0; padding: 0; }
  .ladder li { display: flex; align-items: baseline; gap: 1.4vmin; padding: 1vmin 0; border-top: 1px solid #2A2A28; font-size: 1.9vmin; white-space: nowrap; }
  .ladder li span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #C9C6BD; }
  .ladder li b { font-weight: 600; }
  .ladder li em { font-style: normal; width: 5.6vmin; text-align: right; color: #6F6C66; font-size: 1.7vmin; }
  .ladder li:first-child span, .ladder li:first-child b { color: #FFD400; }
  .ladder li:nth-child(3) { opacity: .7; } .ladder li:nth-child(4) { opacity: .45; }

  .timer { flex: none; margin-top: 3vmin; }
  .timer .row { display: flex; align-items: baseline; font-size: 1.8vmin; letter-spacing: .1em; text-transform: uppercase; }
  .timer .row s { text-decoration: line-through; color: #6F6C66; margin-right: 1.4vmin; }
  .timer .row b { font-weight: 600; color: #F2F0EA; }
  .timer .row em { margin-left: auto; font-style: normal; font-weight: 600; color: #FF3B30; }
  .bar { margin-top: 1.2vmin; height: 1vmin; background: #2A2A28; }
  .bar i { display: block; width: 22%; height: 100%; background: #FF3B30; }

  .foot { flex: none; margin-top: 3vmin; display: flex; align-items: center; gap: 3vmin; }
  .cta { flex: none; padding: 2.2vmin 3.6vmin; background: #FFD400; color: #0B0B0B; font-family: "Anton", Impact, sans-serif; font-size: 3vmin; letter-spacing: .04em; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  .small { font-size: 1.6vmin; line-height: 1.5; color: #9A978F; }

  @media (min-aspect-ratio: 7/10) {
    .banner { padding: 4.4vmin 5.6vmin 4.4vmin; }
    .title { font-size: 9.4vmin; }
    .lot { margin-top: 3vmin; }
    .board { margin-top: 3vmin; }
    .now b { font-size: 12.4vmin; }
    .ladder li { padding: .8vmin 0; }
    .timer, .foot { margin-top: 2.4vmin; }
  }
  /* ── square: lot left, board right ── */
  @media (min-aspect-ratio: 9/10) {
    .banner { display: block; padding: 0; }
    .lot { position: absolute; left: 0; top: 0; bottom: 0; width: 46%; height: 100%; margin: 0; }
    .head, .board, .timer, .foot { position: absolute; left: calc(46% + 5vmin); right: 5vmin; margin: 0; }
    .head { top: 5vmin; flex-direction: column; align-items: flex-start; gap: 1.6vmin; }
    .title { font-size: 8.4vmin; }
    .meta { margin-left: 0; text-align: left; }
    .board { top: 25vmin; flex-direction: column; gap: 2.4vmin; }
    .now b { font-size: 12vmin; }
    .now small { display: none; }
    .ladder { width: 100%; padding: 0; }
    .ladder ol { margin-top: .6vmin; }
    .ladder li { padding: .7vmin 0; font-size: 1.8vmin; }
    .ladder li:nth-child(4) { display: none; }
    .timer { bottom: 22vmin; }
    .foot { bottom: 5vmin; flex-direction: column; align-items: stretch; gap: 1.6vmin; }
    .cta { text-align: center; font-size: 2.8vmin; padding: 2vmin 3vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .lot { width: 44%; }
    .head, .board, .timer, .foot { left: calc(44% + 7vmin); right: 7vmin; }
    .head { top: 7vmin; flex-direction: row; align-items: flex-end; }
    .title { font-size: 10vmin; }
    .meta { margin-left: auto; text-align: right; }
    .board { top: 26vmin; flex-direction: row; gap: 5vmin; }
    .now b { font-size: 14vmin; }
    .now small { display: block; }
    .ladder li:nth-child(4) { display: flex; }
    .timer { bottom: 20vmin; }
    .foot { bottom: 7vmin; flex-direction: row; align-items: center; gap: 3vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="head">
    <div class="title">Live <span>bid</span></div>
    <div class="meta"><b><i></i>Live · 5.6K</b><br>Lot 07 of 12</div>
  </div>
  <div class="lot"><img src="{{PRODUCT_IMAGE}}" alt=""><div class="tag">LOT 07</div></div>
  <div class="board">
    <div class="now"><div class="lbl">Current bid</div><b>$148</b><small>next raise +$10</small></div>
    <div class="ladder"><div class="lbl">Bids</div>
      <ol>
        <li><span>@nora.v</span><b>$148</b><em>now</em></li>
        <li><span>@kai_m</span><b>$140</b><em>12s</em></li>
        <li><span>@elif.s</span><b>$132</b><em>31s</em></li>
        <li><span>@ben.r</span><b>$120</b><em>1m</em></li>
      </ol>
    </div>
  </div>
  <div class="timer"><div class="row"><s>Going once</s><b>Going twice…</b><em>00:24</em></div><div class="bar"><i></i></div></div>
  <div class="foot"><div class="cta">Bid $158</div><div class="small">Opened at $60 · Kestrel Vintage<br>Winner checks out after the stream</div></div>
</div>
</body>
</html>
