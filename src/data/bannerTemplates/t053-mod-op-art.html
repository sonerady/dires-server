<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* 1960s Mod op-art — black/white concentric rings vibrate out from a target roundel; photo is a clean window in the pattern,
     all copy sits on solid black / white chips. tall: photo top, band + roundel below · square & wide: photo left, target right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F4F1EA; }
  .banner { --k: #0B0B0B; --w: #F4F1EA; --r: #E03A2F; --cx: 50%; --cy: calc(100% - 24vmin); --dd: 36vmin;
    position: fixed; inset: 0; overflow: hidden; color: var(--k); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    background: repeating-radial-gradient(circle at var(--cx) var(--cy), var(--k) 0 1.3vmin, var(--w) 1.3vmin 2.6vmin); }
  .photo { position: absolute; left: 13vmin; right: 13vmin; top: 12vmin; height: calc(100% - 12vmin - 66vmin); width: calc(100% - 26vmin); object-fit: cover; object-position: 50% 22%; display: block; }
  .kick { position: absolute; left: 13vmin; top: 4.4vmin; background: var(--k); color: var(--w); padding: 1.2vmin 2vmin; font-size: 1.9vmin; font-weight: 700; font-stretch: 125%; letter-spacing: .2em; text-transform: uppercase; }
  .kick b { color: var(--r); }
  .band { position: absolute; left: 0; right: 0; top: calc(100% - 60vmin); background: var(--k); color: var(--w); padding: 2.6vmin 5vmin 2.4vmin; text-align: center; }
  h1 { margin: 0; font-weight: 900; font-stretch: 125%; font-size: 7.6vmin; line-height: .95; letter-spacing: -.01em; text-transform: uppercase; }
  .band p { margin: 1.2vmin 0 0; font-size: 1.9vmin; font-weight: 600; font-stretch: 110%; letter-spacing: .26em; text-transform: uppercase; }
  .disc { position: absolute; left: var(--cx); top: var(--cy); width: var(--dd); height: var(--dd); transform: translate(-50%, -50%); border-radius: 50%; background: var(--w); box-shadow: 0 0 0 1.3vmin var(--k), 0 0 0 2.6vmin var(--w), 0 0 0 3.9vmin var(--r);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .disc span { font-size: 2vmin; font-weight: 700; font-stretch: 125%; letter-spacing: .24em; text-transform: uppercase; }
  .disc b { font-weight: 900; font-stretch: 125%; font-size: calc(var(--dd) * .3); line-height: .92; letter-spacing: -.04em; }
  .c { position: absolute; bottom: 5vmin; padding: 1.5vmin 2vmin; font-size: 2vmin; font-weight: 700; font-stretch: 112%; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .c1 { left: 4vmin; background: var(--w); border: .5vmin solid var(--k); }
  .c1 u { text-decoration: none; font-weight: 900; }
  .c2 { right: 4vmin; background: var(--r); color: #fff; border: .5vmin solid var(--r); }
  @media (min-aspect-ratio: 7/10) {
    .banner { --cy: calc(100% - 21vmin); --dd: 30vmin; }
    .photo { left: 17vmin; right: 17vmin; width: calc(100% - 34vmin); top: 11vmin; height: calc(100% - 11vmin - 56vmin); }
    .kick { left: 17vmin; top: 3.6vmin; }
    .band { top: calc(100% - 51vmin); padding: 2vmin 5vmin; }
    h1 { font-size: 7vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --cx: calc(100% - 24vmin); --cy: 63vmin; --dd: 27vmin; }
    .photo { left: 5vmin; top: 5vmin; bottom: 5vmin; right: auto; width: 45vmin; height: calc(100% - 10vmin); }
    .kick { left: 55vmin; top: 5vmin; }
    .band { left: 50vmin; top: 13vmin; padding: 2.4vmin 3.4vmin; text-align: left; }
    h1 { font-size: 5.8vmin; }
    .band p { font-size: 1.7vmin; letter-spacing: .18em; }
    .c { padding: 1.2vmin 1.6vmin; font-size: 1.8vmin; }
    .c1 { left: 55vmin; bottom: 11.6vmin; }
    .c2 { left: 55vmin; right: auto; bottom: 3.4vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --cx: calc(100% - 30vmin); --cy: 60vmin; --dd: 34vmin; }
    .photo { width: 54vmin; }
    .kick { left: 65vmin; top: 5vmin; }
    .band { left: 59vmin; top: 13vmin; padding: 2.6vmin 5vmin 2.6vmin 6vmin; }
    h1 { font-size: 6.6vmin; }
    .c { bottom: auto; }
    .c1 { left: 65vmin; top: 50vmin; }
    .c2 { left: 65vmin; right: auto; top: 62vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="kick">Studio Oro <b>·</b> Mod 66</div>
  <div class="band">
    <h1>Swing Season</h1>
    <p>The black &amp; white edit · ends Sunday</p>
  </div>
  <div class="disc"><span>Up to</span><b>40%</b><span>off</span></div>
  <div class="c c1">Code <u>OPART40</u></div>
  <div class="c c2">Shop the edit →</div>
</div>
</body>
</html>
