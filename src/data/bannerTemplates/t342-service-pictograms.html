<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Service Pictograms — a Nordic wayfinding legend: four petrol pictogram tiles (fitting rooms, returns,
     repairs, delivery) in a strict module, a signage headline and a muted signal-yellow offer strip.
     tall → photo above the legend (4 × 1); 3:4 and wider → legend beside the photo (2 × 2) */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #E7E5DF; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #E7E5DF; color: #1B2A2F; font-family: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 76vmin); object-fit: cover; object-position: 50% 20%; display: block; }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 76vmin; box-sizing: border-box; padding: 5vmin 5vmin 0; display: flex; flex-direction: column; }
  .meta { display: flex; justify-content: space-between; align-items: center; font-family: "Red Hat Mono", Menlo, monospace; font-size: 1.7vmin; letter-spacing: .14em; text-transform: uppercase; color: #52615F; white-space: nowrap; }
  .meta b { font-family: "Atkinson Hyperlegible", Arial, sans-serif; font-weight: 700; font-size: 2.4vmin; letter-spacing: .02em; text-transform: none; color: #1B2A2F; }
  h1 { margin: 3vmin 0 0; font-weight: 700; font-size: 8.4vmin; line-height: .98; letter-spacing: -.025em; }
  h1 span { color: #6A7A78; }

  .legend { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vmin; }
  .item { min-width: 0; }
  .tile { position: relative; aspect-ratio: 1 / 1; background: #27454D; display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 62%; height: 62%; }
  .tile i { position: absolute; left: 1vmin; top: .8vmin; font-style: normal; font-family: "Red Hat Mono", Menlo, monospace; font-size: 1.6vmin; color: #A9BDBD; }
  .item b { display: block; margin-top: 1.2vmin; font-weight: 700; font-size: 2.1vmin; line-height: 1.15; }
  .item span { display: block; font-size: 1.8vmin; color: #52615F; margin-top: .2vmin; }

  .offer { margin: 4vmin -5vmin 0; height: 11vmin; flex: none; background: #D8B64E; display: flex; align-items: center; justify-content: space-between; padding: 0 5vmin; white-space: nowrap; }
  .offer strong { font-weight: 700; font-size: 4.6vmin; letter-spacing: -.02em; }
  .offer span { font-family: "Red Hat Mono", Menlo, monospace; font-weight: 500; font-size: 1.9vmin; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 1.4vmin; }
  .offer svg { width: 4.4vmin; height: 4.4vmin; flex: none; }

  /* 3:4 / 4:5 → photo left, legend column 2 × 2 */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 52%; height: 100%; object-position: 50% 22%; }
    .panel { left: 52%; top: 0; height: auto; padding: 5vmin 4vmin 0; }
    .meta { flex-direction: column; align-items: flex-start; gap: 1vmin; }
    h1 { font-size: 6.6vmin; }
    .legend { grid-template-columns: repeat(2, 1fr); gap: 3vmin 2vmin; }
    .item b { font-size: 2vmin; }
    .offer { margin: 4vmin -4vmin 0; padding: 0 4vmin; height: 16vmin; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1.2vmin; }
    .offer strong { font-size: 4.8vmin; }
  }
  /* square → legend 4 × 1 under the headline, beside the photo */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 48%; }
    .panel { left: 48%; padding: 4.6vmin 4.4vmin 0; }
    .meta { flex-direction: row; align-items: center; }
    .meta b { font-size: 2.2vmin; }
    h1 { font-size: 6.4vmin; margin-top: 2.6vmin; }
    .legend { grid-template-columns: repeat(2, 1fr); gap: 2vmin 2vmin; width: 74%; }
    .tile svg { width: 58%; height: 58%; }
    .item b { font-size: 1.9vmin; margin-top: .8vmin; }
    .item span { font-size: 1.7vmin; }
    .offer { margin: 3.6vmin -4.4vmin 0; padding: 0 4.4vmin; height: 14vmin; }
    .offer strong { font-size: 4.2vmin; }
    .offer span { font-size: 1.7vmin; }
  }
  /* wide → legend 4 × 1 */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 50%; object-position: 50% 28%; }
    .panel { left: 50%; padding: 5vmin 5vmin 0; }
    h1 { font-size: 8.8vmin; }
    .legend { grid-template-columns: repeat(4, 1fr); width: auto; gap: 1.8vmin; }
    .item b { font-size: 1.9vmin; }
    .offer { margin: 4vmin -5vmin 0; padding: 0 5vmin; height: 11vmin; flex-direction: row; align-items: center; justify-content: space-between; }
    .offer strong { font-size: 4.6vmin; }
    .offer span { font-size: 1.8vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="meta"><b>Atelier Nord</b><span>Store &amp; online · AW26</span></div>
    <h1>The new season.<br><span>Fully serviced.</span></h1>
    <div class="legend">
      <div class="item">
        <div class="tile"><i>01</i><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19.5 12.5a4.5 4.5 0 1 1 4.5 4.5v3.6L6 33.5h36L24 20.6" fill="none" stroke="#F1EFE8" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
        <b>Fitting rooms</b><span>Level 1</span>
      </div>
      <div class="item">
        <div class="tile"><i>02</i><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 14h19a9 9 0 0 1 0 18H14" fill="none" stroke="#F1EFE8" stroke-width="3.4" stroke-linejoin="round"/><path d="M20 7l-7.5 7 7.5 7" fill="none" stroke="#F1EFE8" stroke-width="3.4" stroke-linejoin="round"/><path d="M11 38h26" stroke="#F1EFE8" stroke-width="3.4"/></svg></div>
        <b>Returns</b><span>30 days</span>
      </div>
      <div class="item">
        <div class="tile"><i>03</i><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 38L35 11" stroke="#F1EFE8" stroke-width="3.4" stroke-linecap="round"/><ellipse cx="33.2" cy="13.2" rx="1.1" ry="2.6" transform="rotate(41 33.2 13.2)" fill="#27454D"/><path d="M36 12c7 7-3 13-9 15s-12 5-15 11" fill="none" stroke="#F1EFE8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/></svg></div>
        <b>Repairs</b><span>Free, for life</span>
      </div>
      <div class="item">
        <div class="tile"><i>04</i><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 16l17-8 17 8v17l-17 8-17-8z M7 16l17 8 17-8 M24 24v17" fill="none" stroke="#F1EFE8" stroke-width="3.2" stroke-linejoin="round"/><path d="M15.5 12l17 8v6" fill="none" stroke="#F1EFE8" stroke-width="2.2"/></svg></div>
        <b>Delivery</b><span>Free over €80</span>
      </div>
    </div>
    <div class="offer"><strong>−20% first order</strong><span>Code NORD20<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" fill="#1B2A2F"/><path d="M13 24h20M25 15l9 9-9 9" fill="none" stroke="#D8B64E" stroke-width="4"/></svg></span></div>
  </div>
</div>
</body>
</html>
