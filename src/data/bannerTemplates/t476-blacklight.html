<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Tilt+Prism&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Blacklight — a flocked-velvet blacklight poster: UV magenta, acid lime and day-glo orange rays ripple out from
     behind the photo, which hangs in a double fluorescent keyline; prismatic lettering glows on black velvet.
     tall / 3:4 → photo up top, copy on the velvet below · square / wide → photo left, copy right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0A0610; }
  .banner { --cx: 50%; --cy: 62vmin; position: fixed; inset: 0; overflow: hidden; background: #0A0610; color: #F4ECFF; font-family: "Josefin Sans", "Futura", "Century Gothic", sans-serif; }
  .rays { position: absolute; left: var(--cx); top: var(--cy); width: 280vmin; height: 280vmin; transform: translate(-50%, -50%); opacity: .9; }
  .flock { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; mix-blend-mode: multiply; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 64vmin; background: linear-gradient(0deg, rgba(10,6,16,1) 0%, rgba(10,6,16,1) 48.0%, rgba(10,6,16,0.985) 52.0%, rgba(10,6,16,0.943) 56.0%, rgba(10,6,16,0.874) 60.0%, rgba(10,6,16,0.784) 64.0%, rgba(10,6,16,0.677) 68.0%, rgba(10,6,16,0.56) 72.0%, rgba(10,6,16,0.44) 76.0%, rgba(10,6,16,0.323) 80.0%, rgba(10,6,16,0.216) 84.0%, rgba(10,6,16,0.126) 88.0%, rgba(10,6,16,0.057) 92.0%, rgba(10,6,16,0.015) 96.0%, rgba(10,6,16,0) 100.0%); }
  .ph { position: absolute; left: 13vmin; right: 13vmin; top: 12vmin; height: min(100vmin, calc(100% - 60vmin)); box-shadow: 0 0 0 .7vmin #C6FF1A, 0 0 0 2vmin #0A0610, 0 0 0 2.7vmin #FF2BD6, 0 0 6vmin 3vmin rgba(255,43,214,.45); }
  .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
  .copy { position: absolute; left: 8vmin; right: 8vmin; bottom: 7vmin; text-align: center; }
  .k { font-size: 1.9vmin; font-weight: 700; letter-spacing: .38em; text-transform: uppercase; color: #C6FF1A; white-space: nowrap; }
  h1 { margin: 1.8vmin 0 0; font-family: "Tilt Prism", "Josefin Sans", sans-serif; font-weight: 400; font-size: 14vmin; line-height: .9; color: #FF2BD6; white-space: nowrap;
    text-shadow: 0 0 2.4vmin rgba(255,43,214,.7), 0 0 .6vmin rgba(255,43,214,.9); }
  .d { margin-top: 2.2vmin; font-size: 2.6vmin; font-weight: 400; letter-spacing: .04em; line-height: 1.35; }
  .d b { font-weight: 700; color: #FF9A2E; }
  .act { margin-top: 2.8vmin; display: flex; justify-content: center; align-items: center; gap: 3vmin; }
  .cta { border: .35vmin solid #C6FF1A; color: #C6FF1A; padding: 1.5vmin 3.2vmin 1.2vmin; font-size: 2.2vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 0 2vmin rgba(198,255,26,.35), inset 0 0 1.4vmin rgba(198,255,26,.25); }
  .code { font-size: 2vmin; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; color: #D9CCF0; }
  .code b { color: #FF2BD6; font-weight: 700; }
  @media (min-aspect-ratio: 7/10) {
    .banner { --cy: 45vmin; }
    .ph { left: 20vmin; right: 20vmin; top: 9vmin; height: 72vmin; }
    .fade { height: 52vmin; }
    .copy { bottom: 5vmin; }
    h1 { font-size: 11.4vmin; margin-top: 1.2vmin; }
    .d { font-size: 2.3vmin; margin-top: 1.6vmin; }
    .act { margin-top: 2.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --cx: 31vmin; --cy: 50%; }
    .ph { left: 8vmin; right: auto; width: 46vmin; top: 8vmin; height: calc(100% - 16vmin); }
    .fade { left: auto; top: 0; bottom: 0; right: 0; width: 60vmin; height: auto; background: linear-gradient(270deg, rgba(10,6,16,1) 0%, rgba(10,6,16,1) 46.0%, rgba(10,6,16,0.985) 50.2%, rgba(10,6,16,0.943) 54.3%, rgba(10,6,16,0.874) 58.5%, rgba(10,6,16,0.784) 62.6%, rgba(10,6,16,0.677) 66.8%, rgba(10,6,16,0.56) 70.9%, rgba(10,6,16,0.44) 75.1%, rgba(10,6,16,0.323) 79.2%, rgba(10,6,16,0.216) 83.4%, rgba(10,6,16,0.126) 87.5%, rgba(10,6,16,0.057) 91.7%, rgba(10,6,16,0.015) 95.8%, rgba(10,6,16,0) 100.0%); }
    .copy { left: auto; right: 6vmin; width: 36vmin; bottom: auto; top: 50%; transform: translateY(-50%); text-align: left; }
    .k { font-size: 1.7vmin; letter-spacing: .3em; }
    h1 { font-size: 10vmin; white-space: normal; }
    .d { font-size: 2.2vmin; }
    .k { white-space: normal; line-height: 1.7; }
    .act { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 2vmin; }
    .cta { font-size: 2vmin; }
    .code { font-size: 1.8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --cx: 40vmin; }
    .ph { left: 10vmin; width: 60vmin; top: 9vmin; height: calc(100% - 18vmin); }
    .fade { width: 84vmin; }
    .copy { right: 8vmin; width: 56vmin; }
    h1 { font-size: 12.6vmin; }
    .d { font-size: 2.5vmin; }
    .act { flex-direction: row; align-items: center; gap: 3vmin; }
    .cta { font-size: 2.1vmin; }
  }
</style>
</head>
