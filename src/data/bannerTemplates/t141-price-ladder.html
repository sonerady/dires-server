<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,300;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Price Ladder — the outlet told as a chart: three bars step down from the full-price line, each tread a deeper markdown, the last one oxblood */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ECE8E1; }
  .banner { --panel: 80vmin; --ch: 30vmin; position: fixed; inset: 0; overflow: hidden; background: #ECE8E1; color: #161512; font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); object-fit: cover; object-position: 50% 22%; }
  .panel { position: absolute; left: 6vmin; right: 6vmin; bottom: 5.4vmin; height: calc(var(--panel) - 10.4vmin); display: flex; flex-direction: column; }
  .kick { display: flex; justify-content: space-between; font-size: 1.8vmin; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; }
  .kick b { font-weight: 800; }
  h1 { margin: 2.2vmin 0 0; font-family: "Newsreader", Georgia, serif; font-weight: 300; font-style: italic; font-size: 10.4vmin; line-height: .92; letter-spacing: -.035em; font-variation-settings: "opsz" 72; white-space: nowrap; }
  h1 span { font-style: normal; font-weight: 400; }

  /* the chart */
  .chart { position: relative; margin-top: auto; height: var(--ch); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.4vmin; align-items: end; border-bottom: .4vmin solid #161512; }
  .full { position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed #161512; }
  .full span { position: absolute; left: 0; top: -2.6vmin; font-size: 1.6vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .full em { position: absolute; right: 0; top: -2.6vmin; font-family: "Newsreader", Georgia, serif; font-size: 2vmin; }
  .col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
  .num { font-weight: 800; font-size: 6.2vmin; line-height: 1; letter-spacing: -.045em; padding-bottom: 1.1vmin; white-space: nowrap; }
  .bar { height: calc(var(--ch) * var(--h)); background: #C9BFB0; }
  .c2 .bar { background: #8C7F6E; }
  .c3 .bar { background: #7B1D1D; }
  .c3 .num { color: #7B1D1D; }
  .labels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.4vmin; padding-top: 1.2vmin; }
  .labels div { font-size: 1.6vmin; line-height: 1.35; letter-spacing: .06em; }
  .labels b { display: block; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 3vmin; margin-top: 3.6vmin; }
  .foot p { margin: 0; font-family: "Newsreader", Georgia, serif; font-size: 2.6vmin; line-height: 1.3; color: #3C3832; }
  .cta { flex: none; font-size: 1.9vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; background: #161512; color: #ECE8E1; padding: 1.8vmin 2.8vmin; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 70vmin; --ch: 27vmin; }
    .panel { bottom: 4.6vmin; height: calc(var(--panel) - 9vmin); }
    h1 { font-size: 9vmin; margin-top: 1.8vmin; }
    .num { font-size: 5.6vmin; }
    .bar { height: calc(var(--ch) * var(--h)); }
    .foot { margin-top: 3vmin; }
    .foot p { font-size: 2.3vmin; }
  }
  /* square — photo left, the ladder on the paper side */
  @media (min-aspect-ratio: 9/10) {
    .banner { --ch: 42vmin; }
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .panel { left: calc(50% + 5vmin); right: 5vmin; top: 5vmin; bottom: 5vmin; height: auto; }
    .kick span:last-child { display: none; }
    h1 { font-size: 10vmin; margin-top: 2.6vmin; white-space: normal; }
    h1 span { display: block; }
    .num { font-size: 4.6vmin; }
    .bar { height: calc(var(--ch) * var(--h)); }
    .labels b { letter-spacing: .1em; }
    .labels span { display: none; }
    .foot { flex-direction: column; align-items: flex-start; gap: 2vmin; margin-top: 3vmin; }
    .foot p { font-size: 2.2vmin; }
  }
  /* wide — more room: the ladder stretches, the copy sits beside the heading */
  @media (min-aspect-ratio: 6/5) {
    .banner { --ch: 44vmin; }
    .photo { width: 48%; object-position: 62% 25%; }
    .panel { left: calc(48% + 6vmin); right: 6vmin; top: 6vmin; bottom: 6vmin; }
    .kick span:last-child { display: inline; }
    h1 { font-size: 11vmin; white-space: nowrap; }
    h1 span { display: inline; }
    .num { font-size: 5.6vmin; }
    .bar { height: calc(var(--ch) * var(--h)); }
    .labels span { display: inline; }
    .foot { flex-direction: row; align-items: center; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="kick"><b>End of season</b><span>Outlet · 03 steps</span></div>
    <h1>Step <span>down.</span></h1>
    <div class="chart">
      <div class="full"><span>Full price</span><em>100</em></div>
      <div class="col c1" style="--h:.7"><div class="num">−30%</div><div class="bar"></div></div>
      <div class="col c2" style="--h:.5"><div class="num">−50%</div><div class="bar"></div></div>
      <div class="col c3" style="--h:.3"><div class="num">−70%</div><div class="bar"></div></div>
    </div>
    <div class="labels">
      <div><b>Selected</b><span>First markdown</span></div>
      <div><b>Outlet</b><span>Second markdown</span></div>
      <div><b>Final</b><span>Last reduction</span></div>
    </div>
    <div class="foot"><p>The lower the step, the fewer the pieces.</p><div class="cta">Shop the outlet</div></div>
  </div>
</div>
</body>
</html>
