<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Not An Ad — after "The Treachery of Images": the photo hung as a painting on an oxblood gallery wall, on a
     beige canvas with a schoolroom-cursive caption beneath it — "This is not an ad." A museum placard beside it
     gives the game away (30% off), and a small cloud drifts out of the frame onto the wall.
     tall → painting on top, placard + offer below · 3:4 / square / wide → painting left, placard column right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #5A2A2C; }
  .banner { --ft: 9vmin; --fl: 7vmin; --fr: 7vmin; --fb: 36vmin;
    position: fixed; inset: 0; overflow: hidden; color: #F3E6D0; font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(80% 60% at 45% 35%, #6E3336 0%, #5A2A2C 55%, #461F21 100%); }
  .banner::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.4vmin; background: linear-gradient(180deg, #3A1A1B, #2E1415); }
  .light { position: absolute; left: var(--fl); right: var(--fr); top: 0; height: calc(var(--ft) + 30vmin); background: radial-gradient(50% 100% at 50% 0, rgba(255,226,180,.16), rgba(255,226,180,0)); }

  /* the painting */
  .frame { position: absolute; left: var(--fl); right: var(--fr); top: var(--ft); bottom: var(--fb); box-sizing: border-box; border: 1.8vmin solid #2A1E16;
    background: linear-gradient(180deg, #EADCBB 0%, #E2CFA8 60%, #D8C197 100%);
    box-shadow: inset 0 0 0 .4vmin #6B5238, inset 0 0 3vmin rgba(120,90,50,.25), 0 2.4vmin 4.6vmin rgba(20,6,6,.5); }
  .photo { position: absolute; left: 4vmin; top: 4vmin; width: calc(100% - 8vmin); height: calc(100% - 18.4vmin); object-fit: cover; object-position: 50% 25%; display: block; box-shadow: 0 .6vmin 1.4vmin rgba(90,60,30,.25); }
  .caption { position: absolute; left: 3vmin; right: 3vmin; bottom: 3.2vmin; text-align: center; font-family: "Cedarville Cursive", "Brush Script MT", cursive; font-size: 6vmin; line-height: 1.1; color: #1E1712; white-space: nowrap; }
  .cloud { position: absolute; right: calc(var(--fr) - 5vmin); top: calc(var(--ft) - 2.6vmin); width: 20vmin; height: 10vmin; display: block; overflow: visible; }

  /* placard + offer */
  .mast { position: absolute; left: var(--fl); right: var(--fr); top: 3.6vmin; display: flex; justify-content: space-between; gap: 3vmin; font-size: 1.6vmin; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; color: #E3C9A4; }
  .mast span + span { font-weight: 400; }
  .side { position: absolute; left: var(--fl); right: var(--fr); bottom: 7vmin; height: calc(var(--fb) - 13vmin); display: flex; align-items: stretch; justify-content: space-between; gap: 5vmin; }
  .placard { flex: 0 0 46vmin; box-sizing: border-box; padding: 2.4vmin 2.8vmin; background: #F7F1E6; color: #2A2320; box-shadow: .4vmin .8vmin 1.6vmin rgba(20,6,6,.35); display: flex; flex-direction: column; justify-content: center; }
  .placard .no { font-size: 1.6vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #8A3A34; }
  .placard .ti { margin-top: 1vmin; font-family: "Libre Caslon Text", Georgia, serif; font-style: italic; font-size: 2.6vmin; line-height: 1.2; }
  .placard .md { margin-top: .8vmin; font-size: 1.7vmin; line-height: 1.4; color: #5A504A; }
  .offer { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; text-align: right; }
  .offer b { font-family: "Libre Caslon Text", Georgia, serif; font-weight: 700; font-size: 8vmin; line-height: 1; letter-spacing: -.02em; }
  .offer span { margin-top: .8vmin; font-family: "Libre Caslon Text", Georgia, serif; font-style: italic; font-size: 2.2vmin; line-height: 1.3; color: #E3C9A4; }
  .cta { margin-top: 2vmin; padding-bottom: .5vmin; border-bottom: 1px solid #F3E6D0; font-size: 1.8vmin; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }

  /* 3:4 / 4:5 → painting left, placard column right */
  @media (min-aspect-ratio: 7/10) {
    .banner { --ft: 7vmin; --fl: 6vmin; --fr: 36vmin; --fb: 7vmin; }
    .mast { left: auto; right: 5vmin; width: 26vmin; top: 7vmin; flex-direction: column; gap: 1vmin; }
    .caption { font-size: 5vmin; }
    .photo { height: calc(100% - 16.4vmin); }
    .side { left: auto; right: 5vmin; width: 26vmin; top: 22vmin; bottom: 7vmin; height: auto; flex-direction: column; justify-content: flex-end; gap: 5vmin; }
    .placard { flex: none; }
    .offer { align-items: flex-start; text-align: left; }
    .offer b { font-size: 7vmin; }
    .cloud { right: auto; left: calc(var(--fl) - 7vmin); width: 20vmin; height: 10vmin; top: calc(var(--ft) - 4vmin); }
  }
  /* square */
  @media (min-aspect-ratio: 9/10) {
    .banner { --fl: 6vmin; --fr: calc(38% + 4vmin); --ft: 6vmin; --fb: 6vmin; }
    .mast { width: calc(38% - 6vmin); top: 6vmin; }
    .side { width: calc(38% - 6vmin); top: 20vmin; bottom: 6vmin; }
    .caption { font-size: 4.6vmin; }
    .photo { height: calc(100% - 15vmin); }
  }
  /* wide */
  @media (min-aspect-ratio: 6/5) {
    .banner { --fl: 8vmin; --fr: calc(46% + 4vmin); --ft: 7vmin; --fb: 7vmin; }
    .mast { width: calc(46% - 12vmin); right: 8vmin; top: 7vmin; flex-direction: row; }
    .side { width: calc(46% - 12vmin); right: 8vmin; top: 18vmin; bottom: 7vmin; justify-content: space-between; }
    .placard { padding: 3vmin 3.4vmin; }
    .placard .ti { font-size: 3vmin; }
    .offer b { font-size: 9vmin; }
    .caption { font-size: 5vmin; }
    .photo { height: calc(100% - 16vmin); }
    .cloud { right: auto; left: calc(var(--fl) - 9vmin); width: 24vmin; height: 12vmin; top: calc(var(--ft) - 5vmin); }
  }
</style>
</head>
<body>
<div class="banner">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset=".3" stop-color="#FFFFFF"/><stop offset=".75" stop-color="#F1ECE4"/><stop offset="1" stop-color="#D2C6B8"/></linearGradient>
      <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
      <symbol id="cl" viewBox="0 0 200 100"><g filter="url(#soft)" fill="url(#cg)"><circle cx="56" cy="60" r="22"/><circle cx="90" cy="44" r="30"/><circle cx="127" cy="50" r="24"/><circle cx="154" cy="63" r="16"/><circle cx="34" cy="71" r="12"/><circle cx="74" cy="66" r="17"/><circle cx="110" cy="64" r="18"/></g></symbol>
    </defs>
  </svg>
  <div class="light"></div>
  <div class="frame">
    <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
    <div class="caption">This is not an ad.</div>
  </div>
  <svg class="cloud" viewBox="0 0 200 100" aria-hidden="true"><use href="#cl"/></svg>
  <div class="mast"><span>Maison Vautrin</span><span>Room 7</span></div>
  <div class="side">
    <div class="placard">
      <div class="no">Nº 30</div>
      <div class="ti">“This is not an ad”, 2026</div>
      <div class="md">Mixed media on the new collection. Price on request — or simply 30% lower.</div>
    </div>
    <div class="offer">
      <b>−30%</b>
      <span>(It is, in fact, a sale.)</span>
      <div class="cta">View the collection →</div>
    </div>
  </div>
</div>
</body>
</html>
