<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Gaegu:wght@400;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Week Planner — a ring-bound weekly planner on a sage desk: punched binder holes, coloured month index tabs
     on the fore-edge (SEP pulled forward), the photo on one side and the week laid out Mon–Sun on the other with
     pencilled plans; Friday carries a yellow sticky note with the drop time and the launch offer.
     tall → binding on top, photo above the week · 3:4 & square → binding left, photo left, week right ·
     wide → open two-page spread with the rings in the middle */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #AEBBA5; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #22262A; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(ellipse at 40% 30%, #BCC8B3 0%, #AAB8A1 60%, #97A68F 100%); }

  .tabs { position: absolute; right: 2.4vmin; top: 22vmin; display: flex; flex-direction: column; gap: 1vmin; }
  .tabs b { display: block; width: 6vmin; padding: 2.2vmin 0; text-align: right; padding-right: .8vmin; box-sizing: border-box; border-radius: 0 1vmin 1vmin 0; font-size: 1.6vmin; font-weight: 800; letter-spacing: .08em; color: #22262A; writing-mode: vertical-rl; }
  .tabs b:nth-child(1) { background: #F4B7A6; }
  .tabs b:nth-child(2) { background: #F6D77A; width: 7.6vmin; }
  .tabs b:nth-child(3) { background: #9FC6E0; }
  .tabs b:nth-child(4) { background: #C8B6E2; }

  .page { position: absolute; left: 4vmin; right: 7vmin; top: 4vmin; bottom: 4vmin; background: #FBFAF5; border-radius: .8vmin;
    box-shadow: 0 1vmin 2.6vmin rgba(40,55,35,.35), .4vmin .4vmin 0 #EFEDE4, .8vmin .8vmin 0 #E4E1D6; }
  .page::before { content: ""; position: absolute; left: 6vmin; right: 6vmin; top: 2.4vmin; height: 2.4vmin;
    background: radial-gradient(circle, #9AA890 0 .9vmin, transparent 1vmin) 0 0 / calc(100% / 6) 100% repeat-x; }
  .spine { display: none; }

  .photo { position: absolute; left: 9vmin; top: 10vmin; width: calc(100% - 21vmin); height: calc(100% - 97vmin); object-fit: cover; object-position: 50% 30%; display: block; }

  .week { position: absolute; left: 9vmin; right: 12vmin; bottom: 8vmin; height: 77vmin; display: flex; flex-direction: column; }
  .wk { display: flex; justify-content: space-between; font-size: 1.7vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #6E7266; white-space: nowrap; }
  h1 { margin: 1.2vmin 0 2.4vmin; font-weight: 800; font-size: 7vmin; line-height: .98; letter-spacing: -.035em; }
  .days { border-top: .3vmin solid #22262A; }
  .d { display: flex; align-items: center; gap: 2.4vmin; height: 5.6vmin; border-bottom: 1px solid #D9D6CB; }
  .d span { flex: none; width: 11vmin; font-size: 1.9vmin; font-weight: 800; letter-spacing: .1em; color: #22262A; white-space: nowrap; }
  .d span small { font-size: 1.9vmin; font-weight: 400; color: #8B8E83; margin-left: .6vmin; }
  .d em { font-family: "Gaegu", "Comic Sans MS", cursive; font-style: normal; font-size: 3.3vmin; color: #4C5A6E; white-space: nowrap; }
  .d.we span { color: #B0543C; }
  .d.fri { height: 12vmin; background: linear-gradient(90deg, rgba(246,215,122,.22), transparent 70%); }
  .sticky { position: relative; padding: 1.2vmin 2vmin 1.4vmin; background: linear-gradient(180deg, #FCE57E 0%, #F8DC66 100%); transform: rotate(-2.2deg);
    box-shadow: 0 .6vmin 1vmin rgba(80,70,20,.25); font-family: "Gaegu", cursive; color: #2A2A22; }
  .sticky b { display: block; font-size: 3.4vmin; font-weight: 700; line-height: 1; white-space: nowrap; }
  .sticky i { display: block; margin-top: .4vmin; font-style: normal; font-size: 2.6vmin; line-height: 1.05; white-space: nowrap; }
  .buy { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; }
  .cta { font-size: 2vmin; font-weight: 800; color: #FBFAF5; background: #22262A; padding: 1.3vmin 2.6vmin; border-radius: 99vmin; white-space: nowrap; }
  .fine { font-size: 1.6vmin; color: #6E7266; white-space: nowrap; }

  /* ── 3:4 & square — binding left, photo left, week right ── */
  @media (min-aspect-ratio: 7/10) {
    .page::before { left: 2.2vmin; right: auto; top: 6vmin; bottom: 6vmin; width: 2.4vmin; height: auto;
      background: radial-gradient(circle, #9AA890 0 .9vmin, transparent 1vmin) 0 0 / 100% calc(100% / 6) repeat-y; }
    .tabs { top: 10vmin; }
    .photo { left: 10vmin; top: 8vmin; width: 44vmin; height: calc(100% - 16vmin); }
    .week { left: 58vmin; right: 11vmin; top: 8vmin; bottom: 8vmin; height: auto; }
    .wk span:last-child { display: none; }
    h1 { font-size: 5.6vmin; }
    .d { gap: 1.4vmin; height: 7vmin; }
    .d span { width: 8.6vmin; font-size: 1.6vmin; }
    .d span small { font-size: 1.6vmin; margin-left: .3vmin; }
    .d em { font-size: 2.9vmin; }
    .d.fri { height: 14vmin; }
    .sticky { padding: 1vmin 1.4vmin 1.2vmin; }
    .sticky b { font-size: 2.8vmin; }
    .sticky i { font-size: 2.2vmin; }
    .buy { flex-direction: column; align-items: flex-start; gap: 1.4vmin; }
    .cta { font-size: 1.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { top: 7vmin; width: 42vmin; height: calc(100% - 14vmin); }
    .week { left: 56vmin; top: 6.4vmin; bottom: 6.4vmin; }
    h1 { font-size: 5.2vmin; margin: .8vmin 0 1.6vmin; }
    .d { height: 5.4vmin; }
    .d em { font-size: 2.7vmin; }
    .d.fri { height: 11vmin; }
    .buy { flex-direction: row; align-items: center; gap: 1.6vmin; }
    .fine { display: none; }
  }
  /* ── wide — open spread, rings in the middle ── */
  @media (min-aspect-ratio: 6/5) {
    .page { right: 8vmin; }
    .page::before { left: calc(50% - 1.2vmin); top: 7vmin; bottom: 7vmin; }
    .spine { display: block; position: absolute; top: 4vmin; bottom: 4vmin; left: calc(50% - 6vmin); width: 10vmin;
      background: linear-gradient(90deg, transparent, rgba(60,70,50,.08) 40%, rgba(60,70,50,.18) 50%, rgba(60,70,50,.08) 60%, transparent); }
    .tabs { right: 3.4vmin; top: 12vmin; }
    .photo { left: 9vmin; top: 9vmin; width: calc(50% - 16vmin); height: calc(100% - 18vmin); }
    .week { left: calc(50% + 5vmin); right: 13vmin; top: 9vmin; bottom: 9vmin; }
    .wk span:last-child { display: inline; }
    h1 { font-size: 6.2vmin; margin: 1vmin 0 1.8vmin; }
    .d { gap: 2vmin; height: 5.2vmin; }
    .d span { width: 10.4vmin; font-size: 1.8vmin; }
    .d em { font-size: 3vmin; }
    .d.fri { height: 11.4vmin; }
    .sticky b { font-size: 3vmin; }
    .sticky i { font-size: 2.3vmin; }
    .fine { display: inline; }
    .buy { gap: 3vmin; justify-content: space-between; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="tabs" aria-hidden="true"><b>AUG</b><b>SEP</b><b>OCT</b><b>NOV</b></div>
  <div class="page"></div>
  <div class="spine"></div>
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">

  <div class="week">
    <div class="wk"><span>Week 39 · 22–28 Sept</span><span>Aveline planner</span></div>
    <h1>Plan your week<br>around it.</h1>
    <div class="days">
      <div class="d"><span>MON<small>22</small></span><em>wishlist check ✓</em></div>
      <div class="d"><span>TUE<small>23</small></span><em>see it in person</em></div>
      <div class="d"><span>WED<small>24</small></span><em>clear a spot for it</em></div>
      <div class="d"><span>THU<small>25</small></span><em>set an alarm!!</em></div>
      <div class="d fri"><span>FRI<small>26</small></span><div class="sticky"><b>DROP DAY · 10:00</b><i>−20% for the first 48h</i></div></div>
      <div class="d we"><span>SAT<small>27</small></span><em>show it off</em></div>
      <div class="d we"><span>SUN<small>28</small></span><em>no regrets</em></div>
    </div>
    <div class="buy"><span class="cta">Save the date →</span><span class="fine">Launch price ends Sun 28</span></div>
  </div>
</div>
</body>
</html>
