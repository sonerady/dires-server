<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* False Mirror — after Magritte: a huge almond eye on a black ground whose iris is a daytime sky with drifting
     clouds and a black pupil. The eye looks at the look; the look stays untouched in its own frame.
     tall → eye, headline, photo stacked · 3:4 → eye across the top, photo + copy column below
     square / wide → photo left, eye + copy column right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0D0C0B; }
  .banner { --e: 80vmin; position: fixed; inset: 0; overflow: hidden; color: #EFE7DA; font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(90% 60% at 50% 18%, #24201C 0%, #151311 55%, #0B0A09 100%); }

  /* the eye: a vesica made from a rotated square with two full-radius corners */
  .eye { position: absolute; left: 50%; top: 11vmin; width: var(--e); height: calc(var(--e) * .414); transform: translateX(-50%); }
  .brow { position: absolute; left: 14%; right: 14%; top: -18%; height: 60%; border-top: .5vmin solid rgba(239,231,218,.2); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .lens { position: absolute; left: 50%; top: 50%; width: calc(var(--e) * .7071); height: calc(var(--e) * .7071); transform: translate(-50%, -50%) rotate(45deg);
    border-radius: 100% 0; overflow: hidden;
    background: radial-gradient(circle, #F6F0E8 0%, #EDE2D6 34%, #D7BFB0 58%, #A9806F 76%, #6E4A3E 90%);
    box-shadow: inset 1.4vmin 1.4vmin 3vmin rgba(40,18,10,.6), 0 0 0 .5vmin #2B211C, 0 0 6vmin rgba(141,184,224,.18); }
  .iris { position: absolute; left: 50%; top: 50%; width: calc(var(--e) * .36); height: calc(var(--e) * .36); border-radius: 50%; overflow: hidden;
    transform: translate(-50%, -50%) rotate(-45deg);
    background: linear-gradient(180deg, #3F79BD 0%, #6C9FD6 40%, #A9C8E6 72%, #DCE8F2 100%);
    box-shadow: inset 0 0 0 .6vmin rgba(22,40,66,.55), inset 0 0 3vmin rgba(10,20,40,.5); }
  .iris svg { position: absolute; display: block; overflow: visible; }
  .k1 { left: -12%; top: 12%; width: 70%; height: 35%; }
  .k2 { left: 48%; top: 52%; width: 66%; height: 33%; }
  .k3 { left: -4%; top: 70%; width: 46%; height: 23%; }
  .pupil { position: absolute; left: 50%; top: 50%; width: 34%; height: 34%; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle at 36% 34%, #3A3A3A 0 6%, #0A0A0A 22%, #000 100%); box-shadow: 0 0 0 .3vmin rgba(0,0,0,.25); }
  .pupil::after { content: ""; position: absolute; left: 22%; top: 18%; width: 22%; height: 22%; border-radius: 50%; background: rgba(255,255,255,.85); }

  /* type */
  .mast { position: absolute; left: 7vmin; right: 7vmin; top: 4.6vmin; display: flex; justify-content: space-between; gap: 3vmin; font-size: 1.7vmin; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; }
  .mast span + span { font-weight: 400; color: rgba(239,231,218,.62); }
  .copy { position: absolute; left: 7vmin; right: 7vmin; top: calc(11vmin + var(--e) * .414 + 3.4vmin); text-align: center; }
  h1 { margin: 0; font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 400; font-size: 11vmin; line-height: .95; letter-spacing: -.02em; white-space: nowrap; }
  h1 i { font-weight: 400; color: #A9C8E6; }
  .sub { display: none; margin-top: 2vmin; font-size: 2vmin; line-height: 1.45; color: rgba(239,231,218,.78); }
  .photo { position: absolute; left: 7vmin; top: calc(11vmin + var(--e) * .414 + 18vmin); width: calc(100% - 14vmin); height: calc(100% - 11vmin - var(--e) * .414 - 32vmin); object-fit: cover; object-position: 50% 25%; display: block;
    box-shadow: 0 0 0 1px rgba(239,231,218,.12); }
  .foot { position: absolute; left: 7vmin; right: 7vmin; bottom: 0; height: 14vmin; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; }
  .offer { font-size: 2vmin; line-height: 1.4; color: rgba(239,231,218,.85); }
  .offer b { display: block; font-family: "Bodoni Moda", Didot, Georgia, serif; font-style: italic; font-weight: 500; font-size: 4.2vmin; line-height: 1.05; color: #EFE7DA; }
  .offer small { display: block; margin-top: .4vmin; font-size: 1.6vmin; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: #A9C8E6; }
  .cta { flex: none; padding: 1.8vmin 3.4vmin; border: 1px solid rgba(239,231,218,.6); border-radius: 99vmin; font-size: 1.9vmin; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }

  /* 3:4 / 4:5 → eye across the top; photo + copy column below */
  @media (min-aspect-ratio: 7/10) {
    .banner { --e: 66vmin; }
    .eye { top: 10vmin; }
    .mast { top: 4.4vmin; left: 6vmin; right: 6vmin; }
    .photo { left: 6vmin; top: calc(10vmin + var(--e) * .414 + 6vmin); width: 55vmin; height: calc(100% - 10vmin - var(--e) * .414 - 12vmin); }
    .copy { left: 66vmin; right: 5vmin; top: calc(10vmin + var(--e) * .414 + 6vmin); text-align: left; }
    h1 { font-size: 8vmin; white-space: normal; line-height: 1; }
    .sub { display: block; font-size: 1.8vmin; }
    .foot { left: 66vmin; right: 5vmin; bottom: 6vmin; height: auto; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 2.4vmin; }
    .offer b { font-size: 3.8vmin; }
    .cta { font-size: 1.7vmin; padding: 1.6vmin 2.8vmin; }
  }
  /* square → photo left, eye + copy right */
  @media (min-aspect-ratio: 9/10) {
    .banner { --e: 40vmin; }
    .photo { left: 0; top: 0; width: 52%; height: 100%; object-position: 50% 30%; box-shadow: none; }
    .mast { left: calc(52% + 5vmin); right: 5vmin; top: 6vmin; flex-direction: column; gap: 1vmin; }
    .eye { left: calc(52% + 5vmin); top: 17vmin; transform: none; }
    .copy { left: calc(52% + 5vmin); right: 5vmin; top: calc(17vmin + var(--e) * .414 + 5vmin); }
    h1 { font-size: 8.4vmin; }
    .foot { left: calc(52% + 5vmin); right: 5vmin; bottom: 6vmin; }
  }
  /* wide → bigger eye, one-line headline */
  @media (min-aspect-ratio: 6/5) {
    .banner { --e: 54vmin; }
    .photo { width: 44%; }
    .mast { left: calc(44% + 7vmin); right: 7vmin; top: 7vmin; flex-direction: row; }
    .eye { left: calc(44% + 7vmin); top: 15vmin; }
    .copy { left: calc(44% + 7vmin); right: 7vmin; top: calc(15vmin + var(--e) * .414 + 5vmin); }
    h1 { font-size: 9.4vmin; white-space: nowrap; }
    .sub { font-size: 2vmin; }
    .foot { left: calc(44% + 7vmin); right: 7vmin; bottom: 7vmin; flex-direction: row; align-items: flex-end; justify-content: space-between; }
    .cta { font-size: 1.8vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset=".3" stop-color="#FFFFFF"/><stop offset=".75" stop-color="#EEF3F7"/><stop offset="1" stop-color="#BFCFDF"/></linearGradient>
      <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4"/></filter>
      <symbol id="cl" viewBox="0 0 200 100"><g filter="url(#soft)" fill="url(#cg)"><circle cx="56" cy="60" r="22"/><circle cx="90" cy="44" r="30"/><circle cx="127" cy="50" r="24"/><circle cx="154" cy="63" r="16"/><circle cx="34" cy="71" r="12"/><rect x="30" y="60" width="140" height="22" rx="11"/></g></symbol>
    </defs>
  </svg>
  <div class="mast"><span>Maison Veille</span><span>Autumn · Nº 3</span></div>
  <div class="eye">
    <i class="brow"></i>
    <div class="lens">
      <div class="iris">
        <svg class="k1" viewBox="0 0 200 100" aria-hidden="true"><use href="#cl"/></svg>
        <svg class="k2" viewBox="0 0 200 100" aria-hidden="true"><use href="#cl"/></svg>
        <svg class="k3" viewBox="0 0 200 100" aria-hidden="true"><use href="#cl"/></svg>
        <i class="pupil"></i>
      </div>
    </div>
  </div>
  <div class="copy">
    <h1>Look <i>again.</i></h1>
    <div class="sub">A collection that sees you first — quiet cuts, clear-sky colours.</div>
  </div>
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="foot">
    <div class="offer"><b>15% off</b>your first order<small>Code SEEN15</small></div>
    <span class="cta">Look closer →</span>
  </div>
</div>
</body>
</html>
