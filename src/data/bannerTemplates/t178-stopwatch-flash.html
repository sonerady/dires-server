<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  /* 60-Minute Flash — a one-hour flash sale as a sports chronograph: sixty ticks, an orange sweep hand at 42,
     the last eighteen minutes arced in orange. Black performance panel, condensed and extended Archivo.
     tall → photo above the black panel; square / wide → photo left, stopwatch and copy right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0F0F0F; }
  .banner { --panel: 74vmin; position: fixed; inset: 0; overflow: hidden; background: #0F0F0F; color: #F2F2EE; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
  .shot { position: absolute; left: 0; right: 0; top: 0; height: calc(100% - var(--panel)); overflow: hidden; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 10vmin; background: linear-gradient(to top, rgba(15,15,15,1.0) 0.0%, rgba(15,15,15,0.985) 7.69%, rgba(15,15,15,0.943) 15.38%, rgba(15,15,15,0.874) 23.08%, rgba(15,15,15,0.784) 30.77%, rgba(15,15,15,0.677) 38.46%, rgba(15,15,15,0.56) 46.15%, rgba(15,15,15,0.44) 53.85%, rgba(15,15,15,0.323) 61.54%, rgba(15,15,15,0.216) 69.23%, rgba(15,15,15,0.126) 76.92%, rgba(15,15,15,0.057) 84.62%, rgba(15,15,15,0.015) 92.31%, rgba(15,15,15,0.0) 100.0%); }
  .flag { position: absolute; right: 0; top: 5vmin; background: #FF5B1F; color: #0F0F0F; padding: 1.3vmin 2.4vmin 1.3vmin 2vmin; font-weight: 800; font-stretch: 125%; font-size: 1.9vmin; letter-spacing: .14em; text-transform: uppercase; }

  .panel { position: absolute; left: 6vmin; right: 6vmin; bottom: 5vmin; height: calc(var(--panel) - 8vmin); display: grid; grid-template-columns: 1fr 30vmin; grid-template-rows: auto auto 1fr; column-gap: 5vmin; }
  .kick { grid-column: 1 / -1; display: flex; justify-content: space-between; font-weight: 700; font-stretch: 125%; font-size: 1.8vmin; letter-spacing: .18em; text-transform: uppercase; color: #8A8A85; padding-bottom: 1.4vmin; border-bottom: 1px solid #333331; }
  .kick b { color: #FF5B1F; font-weight: 800; }
  h1 { grid-column: 1 / -1; margin: 2.4vmin 0 0; font-weight: 900; font-stretch: 62%; font-size: 13vmin; line-height: .84; letter-spacing: -.01em; text-transform: uppercase; }
  h1 em { font-style: normal; color: #FF5B1F; }
  .watch { grid-column: 2; grid-row: 3; align-self: end; position: relative; width: 30vmin; height: 30vmin; }
  .watch::before { content: ""; position: absolute; left: 50%; top: -2.4vmin; width: 4.4vmin; height: 2.8vmin; transform: translateX(-50%); background: linear-gradient(90deg, #3A3A38, #6A6A66 50%, #3A3A38); border-radius: .6vmin .6vmin 0 0; }
  .watch::after { content: ""; position: absolute; right: 2.4vmin; top: 1.6vmin; width: 3vmin; height: 2vmin; transform: rotate(45deg); background: #3A3A38; border-radius: .4vmin; }
  .dial { position: relative; z-index: 1; display: block; width: 100%; height: 100%; }
  .info { grid-column: 1; grid-row: 3; align-self: end; display: flex; flex-direction: column; gap: 2.2vmin; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 1.2vmin; border-bottom: 1px solid #333331; font-size: 1.9vmin; letter-spacing: .12em; text-transform: uppercase; color: #8A8A85; font-weight: 600; }
  .row b { color: #F2F2EE; font-weight: 800; font-stretch: 110%; letter-spacing: .1em; }
  .cta { align-self: flex-start; background: #F2F2EE; color: #0F0F0F; padding: 2vmin 3.2vmin; font-weight: 800; font-stretch: 125%; font-size: 1.9vmin; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 66vmin; }
    .panel { bottom: 4.4vmin; height: calc(var(--panel) - 7vmin); grid-template-columns: 1fr 27vmin; }
    h1 { font-size: 11vmin; margin-top: 2vmin; }
    .watch { width: 27vmin; height: 27vmin; }
    .info { gap: 1.8vmin; }
    .cta { padding: 1.7vmin 2.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .shot { right: auto; width: 50%; height: 100%; }
    .fade { left: auto; top: 0; width: 8vmin; height: auto; background: linear-gradient(to left, rgba(15,15,15,1.0) 0.0%, rgba(15,15,15,0.985) 7.69%, rgba(15,15,15,0.943) 15.38%, rgba(15,15,15,0.874) 23.08%, rgba(15,15,15,0.784) 30.77%, rgba(15,15,15,0.677) 38.46%, rgba(15,15,15,0.56) 46.15%, rgba(15,15,15,0.44) 53.85%, rgba(15,15,15,0.323) 61.54%, rgba(15,15,15,0.216) 69.23%, rgba(15,15,15,0.126) 76.92%, rgba(15,15,15,0.057) 84.62%, rgba(15,15,15,0.015) 92.31%, rgba(15,15,15,0.0) 100.0%); }
    .flag { right: 50%; }
    .panel { left: calc(50% + 5vmin); right: 5vmin; top: 5vmin; bottom: 5vmin; height: auto; grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
    h1 { font-size: 11vmin; }
    .watch { grid-column: 1; grid-row: 3; align-self: center; justify-self: center; width: 28vmin; height: 28vmin; }
    .info { grid-column: 1; grid-row: 4; gap: 1.6vmin; }
    .kick span:first-child { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .shot { width: 44%; }
    .shot img { object-position: 65% 25%; }
    .flag { right: 56%; }
    .panel { left: calc(44% + 6vmin); right: 7vmin; top: 6vmin; bottom: 6vmin; grid-template-columns: 1fr 36vmin; grid-template-rows: auto auto 1fr; column-gap: 6vmin; }
    h1 { font-size: 13vmin; }
    .watch { grid-column: 2; grid-row: 3; align-self: end; width: 36vmin; height: 36vmin; }
    .info { grid-column: 1; grid-row: 3; gap: 2.2vmin; }
    .kick span:first-child { display: inline; }
  }
</style>
</head>
