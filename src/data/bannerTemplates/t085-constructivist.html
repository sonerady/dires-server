<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Forward! — constructivist poster: red wedge, black diagonal beam, condensed block capitals */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ECE2CC; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #ECE2CC; color: #141414; font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif; }

  /* TALL — photo top-left, a black mast on its right, the poster below */
  .photo { position: absolute; top: 0; left: 0; width: 80%; height: 57%; object-fit: cover; object-position: 50% 22%; }
  .mast { position: absolute; top: 0; right: 0; width: 20%; height: 57%; background: #141414; overflow: hidden; }
  .mast i { position: absolute; left: 50%; top: 4vmin; width: 12vmin; height: 12vmin; margin-left: -6vmin; border-radius: 50%; background: #D22A1C; }
  .mast span { position: absolute; left: 50%; bottom: 4vmin; transform-origin: 0 0; transform: rotate(-90deg) translateY(-50%); white-space: nowrap; color: #ECE2CC; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 700; font-size: 4.2vmin; letter-spacing: .12em; text-transform: uppercase; }

  .poster { position: absolute; left: 0; right: 0; top: 57%; bottom: 0; overflow: hidden; }
  .wedge { position: absolute; inset: 0; background: #D22A1C; clip-path: polygon(0 100%, 100% 18%, 100% 100%); }
  .beam { position: absolute; left: -20%; width: 140%; top: auto; bottom: 7vmin; height: 9vmin; background: #141414; transform: rotate(-5deg); overflow: hidden; display: flex; align-items: center; }
  .beam span { white-space: nowrap; color: #ECE2CC; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 5.6vmin; letter-spacing: .06em; text-transform: uppercase; padding-left: 17%; }
  .beam b { color: #D22A1C; font-weight: 900; }
  h1 { position: absolute; left: 6vmin; top: 4.6vmin; margin: 0; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 16vmin; line-height: .8; letter-spacing: -.005em; text-transform: uppercase; }
  h1 em { font-style: normal; color: #D22A1C; }
  .kick { display: none; position: absolute; right: 6vmin; top: 5vmin; text-align: right; font-size: 1.8vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; line-height: 1.5; }
  .deal { position: absolute; right: 6vmin; bottom: 21vmin; text-align: right; color: #141414; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 14vmin; line-height: .78; }
  .deal small { display: block; font-family: "Work Sans", sans-serif; font-weight: 700; font-size: 1.9vmin; letter-spacing: .2em; text-transform: uppercase; margin-top: 1.6vmin; }
  .foot { position: absolute; left: 6vmin; right: 6vmin; bottom: 4.4vmin; display: none; justify-content: space-between; align-items: center; gap: 2vmin; font-size: 2vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #ECE2CC; }
  .foot .code { background: #141414; padding: 1vmin 1.6vmin; }
  .cta { display: flex; align-items: center; gap: 1.2vmin; white-space: nowrap; color: #141414; }
  .cta::after { content: ""; width: 0; height: 0; border-left: 2.4vmin solid #141414; border-top: 1.4vmin solid transparent; border-bottom: 1.4vmin solid transparent; }

  /* SHORTER PORTRAIT & SQUARE — photo right, full height; the poster column left */
  @media (min-aspect-ratio: 7/10) {
    .photo { left: auto; right: 0; width: 52%; height: 100%; }
    .mast { display: none; }
    .poster { top: 0; right: auto; width: 48%; }
    .wedge { clip-path: polygon(0 100%, 100% 38%, 100% 100%); }
    .beam { top: 60%; bottom: auto; height: 7.4vmin; transform: rotate(-16deg); }
    .foot { display: flex; }
    .beam span { font-size: 4.4vmin; }
    h1 { left: 5vmin; top: 12vmin; font-size: 12.4vmin; }
    .kick { display: block; left: 5vmin; right: auto; top: 5vmin; text-align: left; font-size: 1.7vmin; }
    .deal { right: 5vmin; bottom: 11vmin; font-size: 12vmin; color: #ECE2CC; }
    .deal small { font-size: 1.7vmin; }
    .foot { left: 5vmin; right: 5vmin; bottom: 4vmin; font-size: 1.7vmin; letter-spacing: .08em; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; }
    .poster { width: 50%; }
    h1 { top: 10vmin; font-size: 11vmin; }
    .beam { top: 56%; }
    .deal { font-size: 11vmin; bottom: 10vmin; }
  }
  /* WIDE */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 42%; }
    .poster { width: 58%; }
    .wedge { clip-path: polygon(0 100%, 100% 26%, 100% 100%); }
    h1 { left: 6vmin; top: 11vmin; font-size: 14vmin; }
    .kick { left: 6vmin; top: 5.4vmin; font-size: 1.8vmin; }
    .beam { top: 60%; height: 8vmin; transform: rotate(-11deg); }
    .beam span { font-size: 4.8vmin; }
    .deal { right: 6vmin; bottom: 11vmin; font-size: 15vmin; }
    .foot { left: 6vmin; right: 6vmin; font-size: 1.9vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="mast"><i></i><span>Atelier Nord · №26</span></div>
  <div class="poster">
    <div class="wedge"></div>
    <div class="kick">New collection<br>autumn / winter</div>
    <h1>Wear the<br><em>future!</em></h1>
    <div class="beam"><span>Shop now <b>▶</b> code FORWARD40 <b>▶</b> the new season <b>▶</b> shop now <b>▶</b> code FORWARD40 <b>▶</b> the new season</span></div>
    <div class="deal">−40%<small>on everything new</small></div>
    <div class="foot"><span class="code">code FORWARD40</span><span class="cta">Shop now</span></div>
  </div>
</div>
</body>
</html>
