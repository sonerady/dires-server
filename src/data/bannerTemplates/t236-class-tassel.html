<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@500;700;800&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  /* Class Tassel — graduation season: a gold mortarboard tassel with a stamped "2026" year charm hangs from the seam
     into a deep navy panel; tall condensed collegiate caps say "Toss the cap." and the graduation edit offer.
     tall → photo above, tassel hanging from the seam; square/wide → navy panel left, tassel from the top edge */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #13203A; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #F3EEE2; font-family: "Crimson Pro", Georgia, serif; background: #13203A; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 78vmin); object-fit: cover; object-position: 50% 22%; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 78vmin;
    background: radial-gradient(70% 60% at 80% 10%, rgba(80,110,170,.22), transparent 70%), #13203A; }
  .panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .8vmin; background: #C9A45C; }

  /* the tassel */
  .tassel { position: absolute; right: 9vmin; top: 0; width: 16vmin; display: flex; flex-direction: column; align-items: center; transform: rotate(4deg); transform-origin: 50% 0; }
  .tassel .btn { width: 3.6vmin; height: 3.6vmin; margin-top: -1.4vmin; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4DDA0, #C9A45C 55%, #8E6E2E); box-shadow: 0 .4vmin .6vmin rgba(0,0,0,.4); position: relative; z-index: 2; }
  .tassel .cord { width: .7vmin; height: 7vmin; margin-top: -.6vmin; background: repeating-linear-gradient(160deg, #E6C77E 0 .5vmin, #A9863F .5vmin .9vmin); }
  .tassel .charm { position: relative; width: 14vmin; height: 7.2vmin; border-radius: .6vmin; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #F6E2A8, #D0AC5E 40%, #A57F35 70%, #E3C57E); box-shadow: inset 0 0 0 .35vmin rgba(255,240,200,.55), 0 .6vmin 1vmin rgba(0,0,0,.45);
    font-family: "Alumni Sans", "Arial Narrow", sans-serif; font-weight: 800; font-size: 6vmin; line-height: 1; letter-spacing: .04em; color: #5A4318; text-shadow: 0 .15vmin 0 rgba(255,240,200,.6); }
  .tassel .head { width: 5.4vmin; height: 6vmin; margin-top: .8vmin; border-radius: 50% 50% 22% 22%; background: repeating-linear-gradient(90deg, #E6C77E 0 .45vmin, #B89140 .45vmin .8vmin); box-shadow: 0 .4vmin .6vmin rgba(0,0,0,.35); }
  .tassel .band { width: 6.2vmin; height: 1.4vmin; margin-top: -.4vmin; background: linear-gradient(180deg, #F2D790, #A9863F); border-radius: .3vmin; }
  .tassel .fringe { width: 10vmin; height: 26vmin; margin-top: -.2vmin;
    background: repeating-linear-gradient(90deg, #F0D48C 0 .28vmin, #C9A45C .28vmin .5vmin, #9C7A34 .5vmin .62vmin), #C9A45C;
    clip-path: polygon(28% 0, 72% 0, 100% 94%, 96% 99%, 90% 95%, 84% 100%, 76% 96%, 68% 100%, 60% 96%, 52% 100%, 44% 97%, 36% 100%, 28% 96%, 20% 99%, 12% 95%, 5% 99%, 0 94%);
    filter: drop-shadow(0 .6vmin .8vmin rgba(0,0,0,.4)); }

  .copy { position: absolute; left: 8vmin; right: 34vmin; top: 9vmin; bottom: 7vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .ov { font-family: "Alumni Sans", "Arial Narrow", sans-serif; font-weight: 700; font-size: 2.4vmin; letter-spacing: .3em; text-transform: uppercase; color: #C9A45C; }
  h1 { margin: 1.6vmin 0 0; font-family: "Alumni Sans", "Arial Narrow", sans-serif; font-weight: 800; font-size: 19vmin; line-height: .82; letter-spacing: -.005em; text-transform: uppercase; }
  .sub { margin: 2.4vmin 0 0; font-style: italic; font-size: 3.2vmin; line-height: 1.25; color: #D9D3C4; }
  .offer { border-top: 1px solid rgba(201,164,92,.7); padding-top: 2vmin; display: flex; flex-direction: column; gap: 1vmin; }
  .offer b { font-family: "Crimson Pro", Georgia, serif; font-weight: 400; font-size: 4.6vmin; line-height: 1.05; }
  .offer b em { display: block; font-style: normal; font-size: 1.6em; line-height: .95; color: #E7C77F; margin-bottom: .6vmin; }
  .offer span { font-family: "Alumni Sans", "Arial Narrow", sans-serif; font-weight: 500; font-size: 2.3vmin; letter-spacing: .22em; text-transform: uppercase; color: #C9A45C; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 66vmin); }
    .panel { height: 66vmin; }
    .copy { top: 7vmin; bottom: 5.5vmin; }
    h1 { font-size: 15vmin; }
    .sub { font-size: 2.8vmin; margin-top: 1.6vmin; }
    .offer b { font-size: 4vmin; }
    .tassel .fringe { height: 20vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; width: 50%; height: 100%; object-position: 50% 25%; }
    .panel { top: 0; right: 50%; height: auto; }
    .panel::before { left: auto; top: 0; bottom: 0; right: 0; width: .8vmin; height: auto; }
    .tassel { right: auto; left: 50%; margin-left: -8vmin; transform: rotate(-3deg); }
    .tassel .fringe { height: 18vmin; }
    .copy { left: 6vmin; right: 6vmin; top: 45vmin; bottom: 6vmin; justify-content: flex-end; gap: 2.4vmin; }
    .ov { font-size: 2vmin; }
    h1 { font-size: 11vmin; margin-top: 1vmin; }
    .sub { font-size: 2.4vmin; margin-top: 1.4vmin; }
    .offer b { font-size: 3.8vmin; }
    .offer span { font-size: 2vmin; letter-spacing: .16em; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .panel { right: 46%; }
    .tassel { left: auto; right: 8vmin; margin-left: 0; transform: rotate(4deg); }
    .tassel .fringe { height: 30vmin; }
    .copy { left: 8vmin; right: 32vmin; top: 8vmin; bottom: 7vmin; justify-content: space-between; }
    .ov { font-size: 2.4vmin; }
    h1 { font-size: 17vmin; margin-top: 1.6vmin; }
    .sub { font-size: 3vmin; }
    .offer b { font-size: 4.4vmin; }
    .offer span { font-size: 2.2vmin; letter-spacing: .22em; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="copy">
      <div class="top">
        <div class="ov">Class of 2026</div>
        <h1>Toss<br>the cap.</h1>
        <p class="sub">Ceremony to after-party —<br>the graduation edit.</p>
      </div>
      <div class="offer"><b><em>15% off</em>with code GRAD26</b><span>Shop the edit →</span></div>
    </div>
    <div class="tassel"><div class="btn"></div><div class="cord"></div><div class="charm">2026</div><div class="head"></div><div class="band"></div><div class="fringe"></div></div>
  </div>
</div>
</body>
</html>
