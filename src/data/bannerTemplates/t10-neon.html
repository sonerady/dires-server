<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Night Sale — responsive: tall photo → photo melts into a night panel carrying the neon; square/wide → neon left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0A0710; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #0A0710; color: #fff; font-family: "Rubik", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 64%; object-fit: cover; object-position: 50% 15%; }
  .melt { position: absolute; left: 0; right: 0; top: 46%; height: 18.2%; background: linear-gradient(0deg, rgba(10,7,16,1) 0%, rgba(10,7,16,0.985) 7.7%, rgba(10,7,16,0.943) 15.4%, rgba(10,7,16,0.874) 23.1%, rgba(10,7,16,0.784) 30.8%, rgba(10,7,16,0.677) 38.5%, rgba(10,7,16,0.56) 46.2%, rgba(10,7,16,0.44) 53.8%, rgba(10,7,16,0.323) 61.5%, rgba(10,7,16,0.216) 69.2%, rgba(10,7,16,0.126) 76.9%, rgba(10,7,16,0.057) 84.6%, rgba(10,7,16,0.015) 92.3%, rgba(10,7,16,0) 100%); }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 16%; background: linear-gradient(180deg, rgba(10,7,16,0.55) 0%, rgba(10,7,16,0.542) 7.7%, rgba(10,7,16,0.519) 15.4%, rgba(10,7,16,0.481) 23.1%, rgba(10,7,16,0.431) 30.8%, rgba(10,7,16,0.372) 38.5%, rgba(10,7,16,0.308) 46.2%, rgba(10,7,16,0.242) 53.8%, rgba(10,7,16,0.178) 61.5%, rgba(10,7,16,0.119) 69.2%, rgba(10,7,16,0.069) 76.9%, rgba(10,7,16,0.031) 84.6%, rgba(10,7,16,0.008) 92.3%, rgba(10,7,16,0) 100%); }
  .open { position: absolute; left: 6vmin; top: 6vmin; display: flex; align-items: center; gap: 1.6vmin; font-size: 2.4vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; background: rgba(10,7,16,.6); border-radius: 99vmin; padding: 1.3vmin 2.6vmin; }
  .open i { width: 1.7vmin; height: 1.7vmin; border-radius: 50%; background: #FF4FA3; box-shadow: 0 0 1.6vmin #FF4FA3; }
  .copy { position: absolute; left: 6vmin; right: 6vmin; top: 60%; bottom: 5vmin; display: flex; flex-direction: column; justify-content: center; gap: 3vmin; }
  .neon { font-family: "Tilt Neon", "Arial Rounded MT Bold", sans-serif; font-size: 16vmin; line-height: 1; color: #FFE3F2; white-space: nowrap;
    text-shadow: 0 0 .6vmin #fff, 0 0 2vmin #FF4FA3, 0 0 5vmin #FF4FA3, 0 0 10vmin #E0147A, 0 0 16vmin #B10D63; }
  .neon span { color: #E4FBFF; text-shadow: 0 0 .6vmin #fff, 0 0 2vmin #38D5FF, 0 0 5vmin #38D5FF, 0 0 10vmin #0B8FD6, 0 0 16vmin #0A6BA8; }
  .deal { display: flex; align-items: center; gap: 4vmin; }
  .deal b { font-weight: 900; font-size: 19vmin; line-height: .8; letter-spacing: -.045em; }
  .deal b sup { font-size: .4em; vertical-align: .95em; letter-spacing: 0; }
  .deal div { font-size: 4vmin; font-weight: 700; line-height: 1.25; }
  .deal div small { display: block; margin-top: .8vmin; font-size: 2.7vmin; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: #FFC6E3; }
  .row { display: flex; align-items: center; gap: 5vmin; }
  .cta { border: .55vmin solid #FF4FA3; border-radius: 99vmin; padding: 2vmin 5vmin; font-size: 3.3vmin; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 0 3vmin rgba(255,79,163,.7), inset 0 0 2.4vmin rgba(255,79,163,.45); text-shadow: 0 0 2vmin rgba(255,79,163,.9); }
  .code { font-size: 3vmin; font-weight: 500; letter-spacing: .08em; color: rgba(255,255,255,.88); white-space: nowrap; }
  .code strong { color: #fff; font-weight: 900; letter-spacing: .14em; }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: 58%; }
    .melt { top: 40%; }
    .copy { top: 55%; gap: 2.2vmin; }
    .neon { font-size: 14vmin; }
    .deal b { font-size: 16vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; width: 58%; height: 100%; object-position: 50% 30%; }
    .melt { top: 0; bottom: 0; height: auto; left: 42%; right: auto; width: 16%; background: linear-gradient(90deg, rgba(10,7,16,1) 0%, rgba(10,7,16,0.985) 7.7%, rgba(10,7,16,0.943) 15.4%, rgba(10,7,16,0.874) 23.1%, rgba(10,7,16,0.784) 30.8%, rgba(10,7,16,0.677) 38.5%, rgba(10,7,16,0.56) 46.2%, rgba(10,7,16,0.44) 53.8%, rgba(10,7,16,0.323) 61.5%, rgba(10,7,16,0.216) 69.2%, rgba(10,7,16,0.126) 76.9%, rgba(10,7,16,0.057) 84.6%, rgba(10,7,16,0.015) 92.3%, rgba(10,7,16,0) 100%); }
    .top { display: none; }
    .open { left: auto; right: 4vmin; top: 4vmin; }
    .copy { top: 6vmin; bottom: 6vmin; right: auto; width: calc(46% - 6vmin); }
    .neon { font-size: 15vmin; white-space: normal; }
    .neon span { display: block; }
    .deal { display: block; }
    .deal div { margin-top: 1.4vmin; }
    .row { flex-wrap: wrap; gap: 3vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="top"></div>
  <div class="melt"></div>
  <div class="open"><i></i>Live tonight</div>
  <div class="copy">
    <div class="neon">Night <span>Sale</span></div>
    <div class="deal"><b>40<sup>%</sup></b><div>off summer dresses<small>8 PM – 2 AM</small></div></div>
    <div class="row"><div class="cta">Shop now</div><div class="code">Code <strong>NIGHT40</strong></div></div>
  </div>
</div>
</body>
</html>
