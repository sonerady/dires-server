<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tide Table — a harbour almanac page: the day's tide curve with the low-water mark flagged as the discount,
     and a three-day tide table where the lowest tide carries the deepest price. Paper, navy ink, one coral mark.
     tall → almanac above, photo below (the sea level) · square/wide → almanac left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F3EEE2; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F3EEE2; color: #1B2B44; font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; }
  .photo { position: absolute; left: 0; bottom: 0; width: 100%; height: calc(100% - 94vmin); object-fit: cover; object-position: 50% 18%; }
  .seam { position: absolute; left: 0; right: 0; top: 94vmin; height: .6vmin; background: #1B2B44; }
  .page { position: absolute; left: 0; right: 0; top: 0; height: 94vmin; }
  .kick { position: absolute; left: 6vmin; right: 6vmin; top: 5vmin; display: flex; justify-content: space-between; font-size: 2vmin; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding-bottom: 1.3vmin; border-bottom: 1px solid #1B2B44; }
  h1 { position: absolute; left: 6vmin; right: 6vmin; top: 10.5vmin; margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 300; font-style: italic; font-size: 10vmin; line-height: .95; letter-spacing: -.02em; }
  h1 b { font-weight: 400; font-style: normal; }
  .chart { position: absolute; left: 7vmin; right: 7vmin; top: 32vmin; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .ax { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: .4px; }
  table { position: absolute; left: 6vmin; right: 6vmin; top: 65vmin; width: calc(100% - 12vmin); border-collapse: collapse; font-size: 2.5vmin; }
  th { font-size: 1.7vmin; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; text-align: left; padding: 0 0 .9vmin; border-bottom: 1px solid #1B2B44; }
  td { padding: 1vmin 0; border-bottom: 1px solid rgba(27,43,68,.3); font-variant-numeric: tabular-nums; }
  th:last-child, td:last-child { text-align: right; }
  td:last-child { font-family: "Fraunces", Georgia, serif; font-size: 3.2vmin; }
  tr.low td { color: #E4572E; font-weight: 600; }
  tr.low td:last-child { font-weight: 400; }
  .cta { position: absolute; left: 6vmin; right: 6vmin; bottom: 4.4vmin; display: flex; justify-content: space-between; align-items: baseline; font-size: 2.2vmin; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; }
  .cta b { font-weight: 600; border-bottom: .35vmin solid #E4572E; padding-bottom: .3vmin; }

  .side { display: none; position: absolute; right: 5vmin; top: 58vmin; width: 22vmin; }
  .side .moon { width: 9vmin; height: 9vmin; border-radius: 50%; background: radial-gradient(circle at 70% 50%, #F3EEE2 0 46%, transparent 47%), #1B2B44; box-shadow: inset 0 0 0 1px #1B2B44; }
  .side p { margin: 1.6vmin 0 0; font-size: 1.8vmin; line-height: 1.45; letter-spacing: .04em; }
  .side p b { display: block; font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 400; font-size: 3.4vmin; letter-spacing: 0; margin-bottom: .6vmin; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 88vmin); }
    .seam { top: 88vmin; } .page { height: 88vmin; }
    h1 { top: 10vmin; font-size: 9.2vmin; }
    .chart { top: 29vmin; left: 12vmin; right: 12vmin; }
    table { top: 58vmin; font-size: 2.2vmin; }
    td { padding: .8vmin 0; }
    .cta { bottom: 3.6vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 74vmin); }
    .seam { top: 74vmin; } .page { height: 74vmin; }
    .kick { top: 4vmin; }
    h1 { top: 9vmin; font-size: 8vmin; }
    h1 br { display: none; }
    .chart { top: 20vmin; left: 12vmin; right: 12vmin; }
    table { top: 49vmin; font-size: 2.1vmin; }
    th { font-size: 1.6vmin; padding-bottom: .6vmin; }
    td { padding: .6vmin 0; }
    td:last-child { font-size: 2.7vmin; }
    .cta { bottom: 3vmin; font-size: 2vmin; }
  }
  /* square / wide → almanac left, photo right */
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; top: 0; width: 48%; height: 100%; object-position: 50% 25%; }
    .seam { top: 0; bottom: 0; left: 52%; right: auto; width: .5vmin; height: auto; }
    .page { right: 48%; height: 100%; }
    .kick { left: 5vmin; right: 5vmin; top: 5vmin; font-size: 1.7vmin; }
    .kick span:last-child { display: none; }
    h1 { left: 5vmin; right: 4vmin; top: 10vmin; font-size: 8.2vmin; }
    h1 br { display: inline; }
    .chart { left: 3vmin; right: 4vmin; top: 33vmin; }
    table { left: 5vmin; right: 4vmin; width: calc(100% - 9vmin); top: 60vmin; font-size: 2.1vmin; }
    th { font-size: 1.6vmin; }
    td { padding: .7vmin 0; }
    td:last-child { font-size: 2.5vmin; }
    .cta { left: 5vmin; right: 4vmin; bottom: 4.6vmin; font-size: 1.7vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .seam { left: 54%; }
    .page { right: 46%; }
    .kick { left: 6vmin; right: 5vmin; font-size: 1.8vmin; }
    .kick span:last-child { display: inline; }
    h1 { left: 6vmin; top: 10.5vmin; font-size: 7.6vmin; }
    h1 br { display: none; }
    .chart { left: 4vmin; right: 5vmin; top: 23vmin; }
    table { left: 6vmin; right: auto; width: 42vmin; top: 58vmin; font-size: 2vmin; }
    .side { display: block; }
    .cta { left: 6vmin; right: 5vmin; bottom: 5vmin; font-size: 1.8vmin; }
  }
</style>
