<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  /* Half Price — the offer shown literally: the look split down the middle, one half drained to grey at full price, the other in colour at half; the seam runs on through the prices */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F7F6F2; }
  .banner { --panel: 60vmin; position: fixed; inset: 0; overflow: hidden; background: #F7F6F2; color: #121211; font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); object-fit: cover; object-position: 50% 22%; }
  .photo.grey { clip-path: inset(0 50% 0 0); filter: grayscale(1) contrast(.92) brightness(1.06); }
  .seam { position: absolute; left: 50%; top: 0; bottom: 5vmin; width: 1px; background: #121211; }
  .seam::before { content: ""; position: absolute; left: 0; top: 0; width: 1px; height: calc(100% + 5vmin - var(--panel)); background: rgba(255,255,255,.9); }

  .prices { position: absolute; left: 0; right: 0; top: calc(100% - var(--panel) + 4.6vmin); display: grid; grid-template-columns: 1fr 1fr; }
  .p { padding: 0 6vmin; }
  .p small { display: block; font-size: 1.7vmin; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  .p b { display: block; margin-top: .8vmin; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; line-height: .9; letter-spacing: -.02em; white-space: nowrap; }
  .was { text-align: right; color: #8C8A84; }
  .was b { font-size: 11vmin; text-decoration: line-through; text-decoration-thickness: .35vmin; }
  .now b { font-size: 16.4vmin; }
  .now small i { font-style: normal; background: #121211; color: #F7F6F2; padding: .3vmin 1vmin; margin-left: 1vmin; letter-spacing: .08em; }

  .copy { position: absolute; left: 6vmin; right: 6vmin; bottom: 5vmin; display: flex; align-items: flex-end; justify-content: space-between; gap: 3vmin; background: #F7F6F2; padding-top: 2vmin; }
  h1 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 8.4vmin; line-height: .95; letter-spacing: -.01em; }
  h1 em { font-style: italic; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 1.8vmin; }
  .side p { margin: 0; font-size: 1.7vmin; letter-spacing: .12em; text-transform: uppercase; color: #5C5A55; white-space: nowrap; }
  .cta { font-size: 1.9vmin; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; background: #121211; color: #F7F6F2; padding: 1.8vmin 2.8vmin; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 52vmin; }
    .prices { top: calc(100% - var(--panel) + 3.6vmin); }
    .was b { font-size: 9.6vmin; }
    .now b { font-size: 14vmin; }
    h1 { font-size: 7.2vmin; }
    .copy { bottom: 4.4vmin; }
    .seam { bottom: 4.4vmin; }
  }
  /* square / wide — the split photo on the left, the price pair stacked on the paper */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 58%; height: 100%; object-position: 50% 25%; }
    .seam { left: 29%; bottom: 0; }
    .seam::before { height: 100%; background: rgba(255,255,255,.9); }
    .prices { left: 58%; top: 7vmin; grid-template-columns: 1fr; gap: 3vmin; }
    .p { padding: 0 5vmin; }
    .was { text-align: left; }
    .was b { font-size: 7.6vmin; }
    .now b { font-size: 12vmin; }
    .copy { left: calc(58% + 5vmin); right: 5vmin; bottom: 5vmin; flex-direction: column; align-items: flex-start; gap: 2.6vmin; padding-top: 0; }
    h1 { font-size: 6vmin; }
    .side { align-items: flex-start; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 52%; object-position: 64% 25%; }
    .seam { left: 26%; }
    .prices { left: 52%; top: 8vmin; }
    .p { padding: 0 7vmin; }
    .was b { font-size: 9vmin; }
    .now b { font-size: 15vmin; }
    .copy { left: calc(52% + 7vmin); right: 7vmin; bottom: 7vmin; }
    h1 { font-size: 7.4vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <img class="photo grey" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="seam"></div>
  <div class="prices">
    <div class="p was"><small>Full price</small><b>€240</b></div>
    <div class="p now"><small>Half price<i>½</i></small><b>€120</b></div>
  </div>
  <div class="copy">
    <h1>Half the price.<br><em>All of the look.</em></h1>
    <div class="side"><p>End of season · Final week</p><div class="cta">Shop −50%</div></div>
  </div>
</div>
</body>
</html>
