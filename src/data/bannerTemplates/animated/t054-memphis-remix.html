<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="4">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 1980s Memphis — primary-pop squiggles, triangles, dot grids and a hard offset block behind the photo.
     tall: copy + sticker on top, photo below · square & wide: photo left, copy right. Decoration never touches the photo. */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FFF4E4; }
  .banner { --bk: #151515; --pk: #FF8FB1; --yl: #FFD23F; --tl: #17B3A3; --bl: #2F4BFF; --rd: #FF4B3E; --cr: #FFF4E4;
    --pt: max(62vmin, calc(100% - 112vmin));
    position: fixed; inset: 0; overflow: hidden; background: var(--cr); color: var(--bk); font-family: "Space Mono", "Courier New", monospace; }
  .d { position: absolute; display: block; }
  .dots { background: radial-gradient(circle, var(--bk) 0 .38vmin, transparent .44vmin) 0 0 / 2.4vmin 2.4vmin; }
  .tri { background: var(--yl); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .half { border-radius: 99vmin 99vmin 0 0; background: var(--tl); }
  .ring { border-radius: 50%; border: 1.4vmin solid var(--pk); }
  .stripe { background: repeating-linear-gradient(45deg, var(--bk) 0 .8vmin, transparent .8vmin 2.2vmin); }
  .ph { position: absolute; left: 9vmin; right: 14vmin; top: var(--pt); bottom: 10vmin; }
  .ph::before { content: ""; position: absolute; left: 3.4vmin; top: 3.4vmin; right: -3.4vmin; bottom: -3.4vmin; background: var(--bl); }
  .ph::after { content: ""; position: absolute; left: -2vmin; top: -2vmin; width: 14vmin; height: 14vmin; background: repeating-linear-gradient(-45deg, var(--rd) 0 .9vmin, transparent .9vmin 2vmin); z-index: -1; }
  .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .copy { position: absolute; left: 8vmin; right: 6vmin; top: 9vmin; }
  .k { display: inline-block; background: var(--bk); color: var(--cr); padding: .9vmin 1.8vmin; font-size: 1.8vmin; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; transform: rotate(-3deg); }
  h1 { display: inline-block; margin: 3vmin 0 0; font-family: "Rubik Mono One", "Arial Black", sans-serif; font-weight: 400; font-size: 11.4vmin; line-height: 1.02; text-transform: uppercase; text-shadow: .7vmin .7vmin 0 var(--pk); }
  h1 span { display: block; color: var(--bl); text-shadow: .7vmin .7vmin 0 var(--yl); }
  .p { margin-top: 2.4vmin; font-size: 2.2vmin; line-height: 1.45; max-width: 56vmin; }
  .row { margin-top: 2.8vmin; display: flex; gap: 2vmin; align-items: center; white-space: nowrap; }
  .code { background: var(--yl); border: .45vmin solid var(--bk); box-shadow: .8vmin .8vmin 0 var(--bk); padding: 1.1vmin 1.8vmin; font-size: 2vmin; font-weight: 700; letter-spacing: .06em; }
  .cta { background: var(--bk); color: var(--cr); padding: 1.55vmin 2.4vmin; font-size: 2vmin; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .stk { position: absolute; right: 5vmin; top: 36vmin; width: 23vmin; height: 23vmin; border-radius: 50%; background: var(--tl); color: #fff; border: .5vmin solid var(--bk); box-shadow: 1vmin 1vmin 0 var(--bk); transform: rotate(-10deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .stk span { font-size: 2vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .stk b { font-family: "Rubik Mono One", "Arial Black", sans-serif; font-weight: 400; font-size: 7.4vmin; line-height: 1; margin: .6vmin 0; color: var(--yl); text-shadow: .5vmin .5vmin 0 var(--bk); }
  .foot { position: absolute; left: 9vmin; bottom: 3.4vmin; font-size: 1.7vmin; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  /* decoration positions (tall) */
  .sq { right: 4vmin; top: 3vmin; width: 26vmin; height: 7vmin; }
  .dt1 { left: 3vmin; top: 3vmin; width: 14vmin; height: 5vmin; }
  .tr1 { right: 7vmin; top: 12vmin; width: 7vmin; height: 6vmin; transform: rotate(18deg); }
  .rg1 { right: 3vmin; top: calc(var(--pt) - 16vmin); width: 7vmin; height: 7vmin; }
  .hf1 { right: 2vmin; bottom: 22vmin; width: 9vmin; height: 4.5vmin; transform: rotate(-90deg); transform-origin: 100% 100%; }
  .st1 { left: 2vmin; bottom: 3vmin; width: 5vmin; height: 26vmin; }
  .zz { right: 4vmin; bottom: 3.4vmin; width: 22vmin; height: 3.4vmin; }
  @media (min-aspect-ratio: 7/10) {
    .banner { --pt: 57vmin; }
    .ph { left: 16vmin; right: 20vmin; bottom: 8vmin; }
    .copy { top: 7vmin; }
    .p { display: none; }
    h1 { font-size: 10vmin; margin-top: 2.4vmin; }
    .stk { top: 29vmin; width: 21vmin; height: 21vmin; right: 7vmin; }
    .stk b { font-size: 6.4vmin; }
    .tr1 { top: 10vmin; right: 8vmin; }
    .foot { left: 16vmin; bottom: 2.6vmin; }
    .st1 { left: 6vmin; bottom: 8vmin; height: 34vmin; }
    .zz { bottom: 2.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --pt: 8vmin; }
    .ph { left: 8vmin; right: auto; width: 43vmin; bottom: 11vmin; }
    .copy { left: 60vmin; right: 3vmin; top: 8vmin; }
    .k { font-size: 1.6vmin; letter-spacing: .04em; }
    h1 { font-size: 5.8vmin; margin-top: 2.6vmin; }
    .p { display: block; font-size: 2vmin; margin-top: 2vmin; max-width: 34vmin; }
    .row { flex-direction: column; align-items: flex-start; gap: 2.4vmin; margin-top: 3vmin; }
    .stk { right: 5vmin; top: auto; bottom: 6vmin; width: 20vmin; height: 20vmin; }
    .stk span { font-size: 1.7vmin; }
    .stk b { font-size: 5.8vmin; }
    .foot { left: 8vmin; bottom: 3.6vmin; }
    .sq { right: auto; left: 56vmin; top: auto; bottom: 6vmin; width: 20vmin; }
    .dt1 { left: 53vmin; top: 3vmin; width: 5vmin; height: 16vmin; }
    .tr1 { right: 6vmin; top: 5vmin; width: 6vmin; height: 5vmin; }
    .rg1 { right: 27vmin; top: auto; bottom: 26vmin; width: 5vmin; height: 5vmin; border-width: 1vmin; }
    .hf1, .st1 { display: none; }
    .zz { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .ph { width: 54vmin; }
    .copy { left: 76vmin; right: 7vmin; top: 10vmin; }
    h1 { font-size: 7.6vmin; }
    .p { max-width: 44vmin; font-size: 2.2vmin; }
    .row { flex-direction: row; align-items: center; }
    .k { font-size: 1.8vmin; letter-spacing: .12em; }
    .stk { right: 9vmin; top: auto; bottom: 12vmin; width: 22vmin; height: 22vmin; }
    .copy .k { margin-bottom: 0; }
    .sq { left: 74vmin; bottom: 7vmin; width: 26vmin; }
    .dt1 { left: 67vmin; top: 8vmin; width: 5vmin; height: 20vmin; }
    .tr1 { right: 36vmin; top: auto; bottom: 30vmin; }
    .rg1 { right: 7vmin; top: 7vmin; bottom: auto; width: 7vmin; height: 7vmin; }
    .hf1 { display: block; right: 22vmin; bottom: 8vmin; width: 10vmin; height: 5vmin; transform: none; }
    .zz { display: block; left: 48vmin; right: auto; bottom: 3.4vmin; width: 16vmin; }
  }

  /* ───────── motion: 4s loop, t=0 = the static design — Memphis pop: everything bounces to one beat, nothing touches the photo ───────── */
  /* the squiggle is re-drawn like a marker line */
  .sq path { stroke-dasharray: 1 1; animation: squig 4s linear infinite; }
  @keyframes squig {
    0%, 50% { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    58% { stroke-dashoffset: -1; animation-timing-function: steps(1, end); }
    60% { stroke-dashoffset: -1; animation-timing-function: cubic-bezier(.3,0,.2,1); }
    78%, 100% { stroke-dashoffset: -2; }
  }
  /* the triangle does a full spin on every other beat and lands back in pose */
  .tr1 { animation: spin 2s linear infinite; }
  @keyframes spin {
    0%, 60% { transform: rotate(18deg); animation-timing-function: cubic-bezier(.7,0,.2,1.15); }
    92%, 100% { transform: rotate(378deg); }
  }
  /* the pink ring pulses on the beat */
  .rg1 { animation: pop 1s linear infinite; }
  @keyframes pop {
    0% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    12% { transform: scale(1.25); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    40%, 100% { transform: scale(1); }
  }
  /* the teal half-moon rocks like a see-saw (only where it is shown) */
  .hf1 { animation: rock 4s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes rock { 0%, 100% { rotate: 0deg; } 25% { rotate: -12deg; } 75% { rotate: 12deg; } }
  /* the zigzag hops on every beat */
  .zz { animation: wig 1s linear infinite; }
  @keyframes wig {
    0% { transform: translateY(0) scaleY(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    15% { transform: translateY(-.4vmin) scaleY(1.25); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    45%, 100% { transform: translateY(0) scaleY(1); }
  }
  /* the headline's hard shadows jump out and snap back */
  h1 { animation: shadow1 2s linear infinite; }
  h1 span { animation: shadow2 2s linear infinite; }
  @keyframes shadow1 {
    0%, 42% { text-shadow: .7vmin .7vmin 0 #FF8FB1; animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    48% { text-shadow: 1.4vmin 1.4vmin 0 #FF8FB1; animation-timing-function: cubic-bezier(.5,0,.3,1.4); }
    62%, 100% { text-shadow: .7vmin .7vmin 0 #FF8FB1; }
  }
  @keyframes shadow2 {
    0%, 46% { text-shadow: .7vmin .7vmin 0 #FFD23F; animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    52% { text-shadow: 1.4vmin 1.4vmin 0 #FFD23F; animation-timing-function: cubic-bezier(.5,0,.3,1.4); }
    66%, 100% { text-shadow: .7vmin .7vmin 0 #FFD23F; }
  }
  /* the sticker gets a springy wobble on the loop's big beat */
  .stk { animation: wobble 4s linear infinite; }
  @keyframes wobble {
    0%, 70% { transform: rotate(-10deg) scale(1); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    74% { transform: rotate(-2deg) scale(1.12); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    79% { transform: rotate(-16deg) scale(.96); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    85% { transform: rotate(-8deg) scale(1.02); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    92%, 100% { transform: rotate(-10deg) scale(1); }
  }
  /* the code chip presses flat into its shadow, the CTA answers */
  .code { animation: press 2s linear infinite; }
  @keyframes press {
    0%, 20% { transform: translate(0, 0); box-shadow: .8vmin .8vmin 0 #151515; animation-timing-function: cubic-bezier(.5,0,.5,1); }
    26% { transform: translate(.8vmin, .8vmin); box-shadow: 0 0 0 #151515; animation-timing-function: cubic-bezier(.2,.8,.3,1.3); }
    36%, 100% { transform: translate(0, 0); box-shadow: .8vmin .8vmin 0 #151515; }
  }
  /* the offset block behind the photo shifts to the beat (the photo itself never moves) */
  .ph::before { animation: block 2s linear infinite; }
  @keyframes block {
    0%, 60% { transform: translate(0, 0); animation-timing-function: cubic-bezier(.5,0,.3,1.4); }
    68% { transform: translate(1vmin, 1vmin); animation-timing-function: cubic-bezier(.5,0,.3,1); }
    84%, 100% { transform: translate(0, 0); }
  }
</style>
</head>
<body>
<div class="banner">
  <i class="d dots dt1"></i>
  <svg class="d sq" viewBox="0 0 120 30" fill="none" stroke="#151515" stroke-width="5" stroke-linecap="round"><path pathLength="1" d="M5 18c8-14 16-14 24 0s16 14 24 0 16-14 24 0 16 14 24 0 12-10 14-6"/></svg>
  <i class="d tri tr1"></i>
  <i class="d ring rg1"></i>
  <i class="d half hf1"></i>
  <i class="d stripe st1"></i>
  <svg class="d zz" viewBox="0 0 110 16" fill="none" stroke="#FF4B3E" stroke-width="4" stroke-linejoin="miter"><path d="M2 14L12 2 22 14 32 2 42 14 52 2 62 14 72 2 82 14 92 2 102 14 108 7"/></svg>
  <div class="ph"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="copy">
    <div class="k">Studio Oro · Collection 86</div>
    <h1>Summer <span>Remix</span></h1>
    <div class="p">Loud colour, easy shapes and the pieces you'll wear on repeat.</div>
    <div class="row"><div class="code">Code RAD50</div><div class="cta">Shop the remix →</div></div>
  </div>
  <div class="stk"><span>Up to</span><b>50%</b><span>off</span></div>
  <div class="foot">Free returns · 30 days</div>
</div>
</body>
</html>
