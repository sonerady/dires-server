<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Free Delivery — airmail stationery: a striped envelope edge, a postmark, and a small system of service badges */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F3EFE6; }
  .banner { --panel: 70vmin; position: fixed; inset: 0; overflow: hidden; background: #F3EFE6; color: #1C2B4B; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; }
  .air { position: absolute; left: 0; right: 0; top: 0; height: 2.6vmin; background: repeating-linear-gradient(135deg, #C8402F 0 2.6vmin, #F3EFE6 2.6vmin 3.9vmin, #1C2B4B 3.9vmin 6.5vmin, #F3EFE6 6.5vmin 7.8vmin); }
  .photo { position: absolute; left: 0; top: 2.6vmin; width: 100%; height: calc(100% - 2.6vmin - var(--panel)); object-fit: cover; object-position: 50% 22%; }
  .panel { position: absolute; left: 6vmin; right: 6vmin; bottom: 5vmin; height: calc(var(--panel) - 11vmin); display: flex; flex-direction: column; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .kick { font-size: 1.8vmin; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #C8402F; }
  h1 { margin: 1.6vmin 0 0; font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 11vmin; line-height: .92; letter-spacing: -.01em; }
  h1 em { color: #C8402F; }
  .pm { flex: none; position: relative; width: 36vmin; height: 20vmin; margin: -1vmin -2vmin 0 0; }
  .pm svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sub { margin: 2.6vmin 0 0; font-size: 2.4vmin; font-weight: 500; line-height: 1.45; color: #3B4867; max-width: 70vmin; }
  .badges { display: flex; justify-content: space-between; gap: 3vmin; margin-top: auto; padding: 3vmin 0; border-top: 1px solid rgba(28,43,75,.3); border-bottom: 1px solid rgba(28,43,75,.3); }
  .b { flex: 1; display: flex; align-items: center; gap: 1.8vmin; }
  .ic { flex: none; width: 8.4vmin; height: 8.4vmin; border-radius: 50%; border: .35vmin solid #1C2B4B; display: flex; align-items: center; justify-content: center; }
  .ic svg { width: 5vmin; height: 5vmin; }
  .b p { margin: 0; font-size: 1.9vmin; font-weight: 800; line-height: 1.3; letter-spacing: .02em; }
  .b p span { display: block; font-weight: 500; color: #56617C; }
  .cta { margin-top: 3vmin; display: flex; align-items: center; justify-content: space-between; background: #1C2B4B; color: #F3EFE6; padding: 2.2vmin 3vmin; font-size: 2.1vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .cta i { font-style: normal; font-family: "DM Serif Display", Georgia, serif; font-size: 2.8vmin; letter-spacing: 0; text-transform: none; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 60vmin; }
    .panel { bottom: 4vmin; height: calc(var(--panel) - 9vmin); }
    h1 { font-size: 9.4vmin; }
    .sub { font-size: 2.2vmin; margin-top: 2vmin; }
    .pm { width: 32vmin; height: 18vmin; }
    .badges { padding: 2.4vmin 0; }
    .ic { width: 7.4vmin; height: 7.4vmin; }
    .cta { margin-top: 2.4vmin; padding: 1.9vmin 2.6vmin; }
  }
  /* square — photo left, stationery right, badges as a list */
  @media (min-aspect-ratio: 9/10) {
    .air { left: 50%; }
    .photo { top: 0; width: 50%; height: 100%; }
    .panel { left: calc(50% + 5vmin); right: 5vmin; top: 7vmin; bottom: 5vmin; height: auto; }
    .top { display: block; }
    .pm { position: absolute; right: -2vmin; top: 36vmin; width: 30vmin; height: 16.6vmin; margin: 0; }
    h1 { font-size: 8.4vmin; margin-top: 1.4vmin; }
    .sub { font-size: 1.9vmin; margin-top: 1.8vmin; }
    .badges { flex-direction: column; gap: 1.4vmin; padding: 2vmin 0; }
    .ic { width: 6.4vmin; height: 6.4vmin; }
    .ic svg { width: 3.8vmin; height: 3.8vmin; }
    .b p { font-size: 1.8vmin; }
    .b p span { display: inline; margin-left: .8vmin; }
    .cta { margin-top: 2.4vmin; padding: 1.8vmin 2.4vmin; font-size: 1.8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .air { left: 48%; }
    .photo { width: 48%; }
    .panel { left: calc(48% + 7vmin); right: 7vmin; top: 9vmin; bottom: 6vmin; }
    .pm { right: 0; top: 40vmin; width: 36vmin; height: 20vmin; }
    h1 { font-size: 10vmin; }
    .sub { font-size: 2.1vmin; max-width: 56vmin; }
    .badges { flex-direction: row; gap: 2.4vmin; padding: 2.6vmin 0; }
    .b p span { display: block; margin: 0; }
    .ic { width: 7vmin; height: 7vmin; }
    .ic svg { width: 4.2vmin; height: 4.2vmin; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ─────────
     (each @keyframes carries an invisible outline-color so no effect is compositor-only: the frame-stepped
      video renderer parallel tabs otherwise freeze transform/opacity-only animations) */
  /* airmail edge: the stripes march along, exactly one stripe period (7.8vmin across the 135° bands) per loop */
  .air { z-index: 1; animation: march 6s linear infinite; }
  @keyframes march { from { outline-color: transparent; background-position: 0 0; } to { background-position: calc(7.8vmin * 1.41421356) 0; } }
  /* photo: slow push anchored on the edge that meets the paper; the stripe stays on top */
  .photo { transform-origin: 50% 100%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { outline-color: transparent; transform: scale(1); } 50% { transform: scale(1.03); } }
  @media (min-aspect-ratio: 9/10) { .photo { transform-origin: 100% 50%; } }
  /* postmark: the FREE SHIPPING · FREE RETURNS ring turns one full revolution, the cancellation waves re-ink */
  .pm .ring-txt { transform-box: view-box; transform-origin: 50px 50px; animation: turn 6s linear infinite; }
  @keyframes turn { from { outline-color: transparent; transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  .pm g[fill="none"] path { stroke-dasharray: 1 1; stroke-dashoffset: 0; animation: 6s linear infinite; }
  .pm g[fill="none"] path:nth-child(1) { animation-name: w1; } .pm g[fill="none"] path:nth-child(2) { animation-name: w2; }
  .pm g[fill="none"] path:nth-child(3) { animation-name: w3; } .pm g[fill="none"] path:nth-child(4) { animation-name: w4; }
  @keyframes w1 { 0%, 4% { outline-color: transparent; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.5,0,.9,.5); } 8% { stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1, end); } 10% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: cubic-bezier(.4,.1,.35,1); } 20%, 100% { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes w2 { 0%, 4% { outline-color: transparent; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.5,0,.9,.5); } 8% { stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1, end); } 12% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: cubic-bezier(.4,.1,.35,1); } 22%, 100% { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes w3 { 0%, 4% { outline-color: transparent; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.5,0,.9,.5); } 8% { stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1, end); } 14% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: cubic-bezier(.4,.1,.35,1); } 24%, 100% { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes w4 { 0%, 4% { outline-color: transparent; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(.5,0,.9,.5); } 8% { stroke-dashoffset: 0; opacity: 0; animation-timing-function: steps(1, end); } 16% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: cubic-bezier(.4,.1,.35,1); } 26%, 100% { stroke-dashoffset: 0; opacity: 1; } }
  /* service badges come alive in turn: the parcel hops, the return arrow loops, the exchange arrows trade places */
  .b:nth-child(1) .ic svg { animation: hop 6s linear infinite; }
  @keyframes hop {
    0%, 34% { outline-color: transparent; transform: translateY(0) scale(1, 1); animation-timing-function: cubic-bezier(.3,0,.5,1); }
    36% { transform: translateY(.3vmin) scale(1.08, .9); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
    40% { transform: translateY(-1.2vmin) scale(.96, 1.05); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
    44% { transform: translateY(0) scale(1.06, .93); animation-timing-function: cubic-bezier(.3,0,.5,1); }
    47%, 100% { transform: translateY(0) scale(1, 1); }
  }
  .b:nth-child(2) .ic svg { animation: loop 6s linear infinite; }
  @keyframes loop { 0%, 46% { outline-color: transparent; transform: rotate(0deg); animation-timing-function: cubic-bezier(.6,0,.3,1); } 58%, 100% { transform: rotate(-360deg); } }
  .b:nth-child(3) .ic svg path { animation: trade 6s linear infinite; }
  @keyframes trade {
    0%, 58% { outline-color: transparent; transform: translateX(0); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    63% { transform: translateX(2px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    69%, 100% { transform: translateX(0); }
  }
  .ic { animation: 6s linear infinite; }
  .b:nth-child(1) .ic { animation-name: ring1; } .b:nth-child(2) .ic { animation-name: ring2; } .b:nth-child(3) .ic { animation-name: ring3; }
  @keyframes ring1 { 0%, 34% { outline-color: transparent; background-color: rgba(200,64,47,0); } 38% { background-color: rgba(200,64,47,.12); } 48%, 100% { background-color: rgba(200,64,47,0); } }
  @keyframes ring2 { 0%, 46% { outline-color: transparent; background-color: rgba(200,64,47,0); } 50% { background-color: rgba(200,64,47,.12); } 60%, 100% { background-color: rgba(200,64,47,0); } }
  @keyframes ring3 { 0%, 58% { outline-color: transparent; background-color: rgba(200,64,47,0); } 62% { background-color: rgba(200,64,47,.12); } 72%, 100% { background-color: rgba(200,64,47,0); } }
  /* CTA arrow: flies off to the right and comes back in from the left */
  .cta i { display: inline-block; animation: fly 6s linear infinite; }
  @keyframes fly {
    0%, 76% { outline-color: transparent; transform: translateX(0); opacity: 1; animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    82% { transform: translateX(3vmin); opacity: 0; animation-timing-function: steps(1, end); }
    83% { transform: translateX(-3vmin); opacity: 0; animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    90%, 100% { transform: translateX(0); opacity: 1; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="air"></div>
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="top">
      <div>
        <div class="kick">Airmail · Always</div>
        <h1>Delivery's<br><em>on us.</em></h1>
      </div>
      <div class="pm">
        <svg viewBox="0 0 180 100">
          <defs><path id="ring" d="M50 50 m-36 0 a36 36 0 1 1 72 0 a36 36 0 1 1 -72 0"/></defs>
          <g fill="none" stroke="#1C2B4B" stroke-width="1.6" opacity=".85">
            <path pathLength="1" d="M94 30 q10 -6 20 0 t20 0 t20 0 t20 0"/>
            <path pathLength="1" d="M96 42 q10 -6 20 0 t20 0 t20 0 t20 0"/>
            <path pathLength="1" d="M96 54 q10 -6 20 0 t20 0 t20 0 t20 0"/>
            <path pathLength="1" d="M94 66 q10 -6 20 0 t20 0 t20 0 t20 0"/>
          </g>
          <g transform="rotate(-8 50 50)">
            <circle cx="50" cy="50" r="46" fill="none" stroke="#1C2B4B" stroke-width="2"/>
            <circle cx="50" cy="50" r="27" fill="none" stroke="#1C2B4B" stroke-width="1.2"/>
            <text class="ring-txt" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="8.6" letter-spacing="2.2" fill="#1C2B4B"><textPath href="#ring">FREE SHIPPING · FREE RETURNS ·</textPath></text>
            <text x="50" y="48" text-anchor="middle" font-family="DM Serif Display, Georgia, serif" font-size="16" fill="#C8402F">€0</text>
            <text x="50" y="62" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="6.4" letter-spacing="1.6" fill="#1C2B4B">POSTAGE</text>
          </g>
        </svg>
      </div>
    </div>
    <p class="sub">Free shipping and 30-day returns on every order. No minimum spend, no small print.</p>
    <div class="badges">
      <div class="b"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1C2B4B" stroke-width="1.5" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9M7.5 5.2l9 4.5"/></svg></div><p>Free shipping<span>2–4 days</span></p></div>
      <div class="b"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1C2B4B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M6 2.5v4h4"/></svg></div><p>Free returns<span>30 days</span></p></div>
      <div class="b"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1C2B4B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg></div><p>Easy exchange<span>Any size</span></p></div>
    </div>
    <div class="cta"><span>Shop the collection</span><i>→</i></div>
  </div>
</div>
</body>
</html>
