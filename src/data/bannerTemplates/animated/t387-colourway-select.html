<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Colourway Select — the colour picker of a luxury product page as the whole story: four tiles cut close
     into the same cloth and re-dyed (ecru as shot, sage, clay, noir), the chosen one underlined and flagged,
     each with its swatch dot and name, above the piece's name, price and the choose-colour link.
     tall → photo above the tiles panel; 3:4 / square → photo left, 2 × 2 tiles right; wide → photo | copy + 4 tiles */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EFEAE2; }
  .banner { --panel: 78vmin; position: fixed; inset: 0; overflow: hidden; background: #EFEAE2; color: #22201C; font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); object-fit: cover; object-position: 50% 22%; display: block; }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: var(--panel); box-sizing: border-box; padding: 5vmin 5vmin 5vmin; display: grid;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; grid-template-areas: "head" "tiles" "foot"; column-gap: 6vmin; }
  .head { grid-area: head; display: flex; justify-content: space-between; align-items: flex-end; gap: 3vmin; }
  .eb { font-size: 1.7vmin; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #7A7369; white-space: nowrap; }
  h1 { margin: 1.4vmin 0 0; font-family: "Fraunces", Georgia, serif; font-weight: 300; font-size: 8.4vmin; line-height: .95; letter-spacing: -.025em; }
  h1 i { font-style: italic; }
  .count { flex: none; text-align: right; font-family: "Fraunces", Georgia, serif; font-weight: 300; font-size: 12vmin; line-height: .8; color: #22201C; }
  .count small { display: block; margin-top: 1.2vmin; font-family: "Work Sans", sans-serif; font-size: 1.6vmin; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #7A7369; }

  .tiles { grid-area: tiles; align-self: center; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2vmin; margin-top: 4vmin; }
  .tile { position: relative; }
  .sw { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: #D8D1C5; }
  .sw img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; transform: scale(2.2); transform-origin: 50% 52%; }
  .sw .tint { position: absolute; inset: 0; mix-blend-mode: color; }
  .c2 .tint { background: #7C8E6C; }
  .c3 .tint { background: #A4553A; }
  .c4 img { filter: grayscale(1) brightness(.42) contrast(1.35); }
  .flag { position: absolute; left: 1.2vmin; top: 1.2vmin; padding: .7vmin 1.2vmin; background: #EFEAE2; font-size: 1.5vmin; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .nm { margin-top: 1.6vmin; padding-bottom: 1.2vmin; display: flex; align-items: center; gap: 1vmin; font-size: 1.8vmin; font-weight: 500; letter-spacing: .06em; white-space: nowrap; border-bottom: .35vmin solid transparent; }
  .nm i { flex: none; width: 1.9vmin; height: 1.9vmin; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(34,32,28,.2); }
  .c1 .nm { border-bottom-color: #22201C; }
  .c1 .nm i { background: #EDE3CF; }
  .c2 .nm i { background: #7C8E6C; }
  .c3 .nm i { background: #A4553A; }
  .c4 .nm i { background: #1E1D1B; }
  .tile:not(.c1) .nm { color: #7A7369; }

  .foot { grid-area: foot; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; padding-top: 3vmin; border-top: 1px solid rgba(34,32,28,.2); white-space: nowrap; }
  .foot .p { font-size: 1.9vmin; letter-spacing: .04em; }
  .foot .p b { margin-left: 1.4vmin; font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 3.4vmin; }
  .cta { display: flex; align-items: center; gap: 1.6vmin; padding: 2vmin 3vmin; background: #22201C; color: #EFEAE2; font-size: 1.8vmin; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }

  /* ── 3:4 / 4:5 and square: photo left, 2 × 2 tiles right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 48%; height: 100%; }
    .panel { left: 48%; top: 0; height: auto; padding: 5vmin 4.5vmin 4.5vmin; }
    .head { flex-direction: column; align-items: flex-start; }
    .count { display: none; }
    h1 { font-size: 6.6vmin; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.2vmin 2vmin; margin-top: 3vmin; }
    .sw { aspect-ratio: 4 / 3.4; }
    .nm { margin-top: 1.1vmin; padding-bottom: .9vmin; font-size: 1.7vmin; }
    .foot { flex-direction: column; align-items: stretch; gap: 2vmin; padding-top: 2.4vmin; }
    .foot .p { display: flex; justify-content: space-between; align-items: baseline; }
    .cta { justify-content: space-between; padding: 1.9vmin 2.4vmin; font-size: 1.7vmin; letter-spacing: .12em; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; }
    .panel { left: 46%; padding: 4.5vmin 5vmin 4.5vmin; }
    h1 { font-size: 6.2vmin; }
    .sw { aspect-ratio: 4 / 2.7; }
    .tiles { gap: 1.8vmin 2vmin; margin-top: 2.6vmin; }
    .foot { gap: 1.6vmin; padding-top: 2vmin; }
  }
  /* ── wide: photo | copy over four tiles ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 40%; }
    .panel { left: 40%; padding: 6vmin 6vmin 6vmin; }
    .head { flex-direction: row; align-items: flex-end; }
    .count { display: block; font-size: 11vmin; }
    h1 { font-size: 7.4vmin; }
    .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2vmin; margin-top: 3vmin; }
    .sw { aspect-ratio: 3 / 3.6; }
    .nm { margin-top: 1.4vmin; font-size: 1.8vmin; }
    .foot { flex-direction: row; align-items: center; gap: 3vmin; padding-top: 3vmin; }
    .cta { padding: 2vmin 3vmin; font-size: 1.8vmin; letter-spacing: .16em; }
  }

  /* ───────── motion (6 s loop · t=0 = static design) ─────────
     the picker cycles through the four colourways, 1.5 s each: the underline wipes across to the next tile,
     its name darkens, its swatch dot rings, its tile leans in — and the hero photo is re-dyed to match
     (ecru = as shot → sage → clay → noir → back to ecru). "Selected" flag bows out while ecru isn't chosen. */
  .ptint { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); mix-blend-mode: color; opacity: 0; pointer-events: none; }
  .pt2 { background: #7C8E6C; animation: pt2 6s cubic-bezier(.45,0,.55,1) infinite; }
  .pt3 { background: #A4553A; animation: pt3 6s cubic-bezier(.45,0,.55,1) infinite; }
  .pt4 { background: #3A3936; animation: pt4 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes pt2 { 0%, 21%, 50%, 100% { opacity: 0; } 25%, 46% { opacity: .62; } }
  @keyframes pt3 { 0%, 46%, 75%, 100% { opacity: 0; } 50%, 71% { opacity: .58; } }
  @keyframes pt4 { 0%, 71%, 96%, 100% { opacity: 0; } 75%, 92% { opacity: .85; } }
  @media (min-aspect-ratio: 7/10) { .ptint { width: 48%; height: 100%; } }
  @media (min-aspect-ratio: 9/10) { .ptint { width: 46%; } }
  @media (min-aspect-ratio: 6/5) { .ptint { width: 40%; } }

  .nm { position: relative; }
  .c1 .nm { border-bottom-color: transparent; }
  .nm::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.35vmin; height: .35vmin; background: #22201C; clip-path: inset(0 100% 0 0); }
  .c1 .nm::after { animation: u1 6s cubic-bezier(.65,0,.35,1) infinite; }
  .c2 .nm::after { animation: u2 6s cubic-bezier(.65,0,.35,1) infinite; }
  .c3 .nm::after { animation: u3 6s cubic-bezier(.65,0,.35,1) infinite; }
  .c4 .nm::after { animation: u4 6s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes u1 { 0%, 21%, 100% { clip-path: inset(0 0 0 0); } 25%, 96% { clip-path: inset(0 0 0 100%); } 96.01% { clip-path: inset(0 100% 0 0); } }
  @keyframes u2 { 0%, 21% { clip-path: inset(0 100% 0 0); } 25%, 46% { clip-path: inset(0 0 0 0); } 50%, 100% { clip-path: inset(0 0 0 100%); } }
  @keyframes u3 { 0%, 46% { clip-path: inset(0 100% 0 0); } 50%, 71% { clip-path: inset(0 0 0 0); } 75%, 100% { clip-path: inset(0 0 0 100%); } }
  @keyframes u4 { 0%, 71% { clip-path: inset(0 100% 0 0); } 75%, 96% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 0 0 100%); } }

  .c1 .nm { animation: n1 6s ease infinite; }
  .c2 .nm { animation: n2 6s ease infinite; }
  .c3 .nm { animation: n3 6s ease infinite; }
  .c4 .nm { animation: n4 6s ease infinite; }
  @keyframes n1 { 0%, 21%, 97%, 100% { color: #22201C; } 25%, 94% { color: #7A7369; } }
  @keyframes n2 { 0%, 21%, 50%, 100% { color: #7A7369; } 25%, 46% { color: #22201C; } }
  @keyframes n3 { 0%, 46%, 75%, 100% { color: #7A7369; } 50%, 71% { color: #22201C; } }
  @keyframes n4 { 0%, 71%, 96%, 100% { color: #7A7369; } 75%, 92% { color: #22201C; } }

  .nm i { animation: dot 6s cubic-bezier(.2,.6,.3,1) infinite; }
  .c2 .nm i { animation-delay: -4.5s; }
  .c3 .nm i { animation-delay: -3s; }
  .c4 .nm i { animation-delay: -1.5s; }
  .c1 .nm i { animation-name: dot1; }
  @keyframes dot { 0%, 25%, 40%, 100% { box-shadow: inset 0 0 0 1px rgba(34,32,28,.2), 0 0 0 0 rgba(34,32,28,0); }
                   28% { box-shadow: inset 0 0 0 1px rgba(34,32,28,.2), 0 0 0 .3vmin rgba(34,32,28,.5); }
                   36% { box-shadow: inset 0 0 0 1px rgba(34,32,28,.2), 0 0 0 .9vmin rgba(34,32,28,0); } }
  @keyframes dot1 { 0%, 3%, 12%, 100% { box-shadow: inset 0 0 0 1px rgba(34,32,28,.2), 0 0 0 0 rgba(34,32,28,0); }
                    4% { box-shadow: inset 0 0 0 1px rgba(34,32,28,.2), 0 0 0 .3vmin rgba(34,32,28,.5); }
                    10% { box-shadow: inset 0 0 0 1px rgba(34,32,28,.2), 0 0 0 .9vmin rgba(34,32,28,0); } }

  .sw img { animation: lean 6s cubic-bezier(.45,0,.55,1) infinite; }
  .c2 .sw img { animation-delay: -4.5s; }
  .c3 .sw img { animation-delay: -3s; }
  .c4 .sw img { animation-delay: -1.5s; }
  .c1 .sw img { animation-name: lean1; }
  @keyframes lean { 0%, 22%, 50%, 100% { transform: scale(2.2); } 30%, 44% { transform: scale(2.34); } }
  @keyframes lean1 { 0%, 21%, 100% { transform: scale(2.2); } 8%, 16% { transform: scale(2.3); } }

  .flag { animation: flag 6s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes flag { 0%, 20%, 97%, 100% { opacity: 1; transform: translateY(0); } 24%, 93% { opacity: 0; transform: translateY(-.8vmin); } }

  .cta span { display: inline-block; animation: nudge 1.5s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 78% { transform: translateX(.7vmin); } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <span class="ptint pt2"></span><span class="ptint pt3"></span><span class="ptint pt4"></span>
  <div class="panel">
    <div class="head">
      <div><div class="eb">Studio Oro — Colour</div><h1>One piece,<br><i>four moods.</i></h1></div>
      <div class="count">04<small>Colourways</small></div>
    </div>
    <div class="tiles">
      <div class="tile c1"><div class="sw"><img src="{{PRODUCT_IMAGE}}" alt=""><span class="flag">Selected</span></div><div class="nm"><i></i>Ecru</div></div>
      <div class="tile c2"><div class="sw"><img src="{{PRODUCT_IMAGE}}" alt=""><span class="tint"></span></div><div class="nm"><i></i>Sage</div></div>
      <div class="tile c3"><div class="sw"><img src="{{PRODUCT_IMAGE}}" alt=""><span class="tint"></span></div><div class="nm"><i></i>Clay</div></div>
      <div class="tile c4"><div class="sw"><img src="{{PRODUCT_IMAGE}}" alt=""></div><div class="nm"><i></i>Noir</div></div>
    </div>
    <div class="foot"><span class="p">The Soleil Piece <b>$480</b></span><span class="cta">Choose your colour <span>→</span></span></div>
  </div>
</div>
</body>
</html>
