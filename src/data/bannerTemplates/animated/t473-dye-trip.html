<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Tie-Dye Spiral — a hand-dyed six-colour spiral (bleeding edges, white crinkle rings where the cloth was bound)
     fills the panel; at its eye sits a cream woven label with the offer, the tagline running round its rim.
     tall / 3:4 → photo on top, dye panel below · square / wide → photo left, dye panel right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F7811E; }
  .banner { --ph: 55%; --d: min(66vmin, calc(45vh - 8vmin)); position: fixed; inset: 0; overflow: hidden; color: #3B1238; font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; background: #F7811E; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: var(--ph); object-fit: cover; object-position: 50% 20%; display: block; }
  .dye { position: absolute; left: 0; right: 0; bottom: 0; top: var(--ph); overflow: hidden; background: #E6337A; }
  .dye svg { position: absolute; inset: -4vmin; width: calc(100% + 8vmin); height: calc(100% + 8vmin); display: block; }
  /* label disc */
  .disc { position: absolute; left: 50%; top: calc(var(--ph) + (100% - var(--ph)) / 2); width: var(--d); height: var(--d); transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, #FFF6E6 0 60%, #F8E9D0 100%); box-shadow: 0 1.2vmin 3vmin rgba(59,18,56,.35), 0 0 0 calc(var(--d) * .018) rgba(255,246,230,.55); }
  .disc svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .disc .ring text { font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 4.4px; letter-spacing: .8px; fill: #3B1238; text-transform: uppercase; }
  .disc .ring text.t2 { fill: #C2266A; }
  .in { position: absolute; left: 14%; right: 14%; top: 28%; bottom: 35%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .in .k { font-size: max(1.7vmin, calc(var(--d) * .03)); font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #C2266A; white-space: nowrap; }
  h1 { margin: 0; font-family: "Gluten", "Cooper Black", Georgia, serif; font-weight: 900; font-size: calc(var(--d) * .1); line-height: .9; letter-spacing: -.01em; color: #3B1238; white-space: nowrap; }
  .off { margin-top: calc(var(--d) * .015); display: flex; align-items: center; gap: calc(var(--d) * .025); }
  .off b { font-family: "Gluten", "Cooper Black", Georgia, serif; font-weight: 900; font-size: calc(var(--d) * .15); line-height: .9;
    background: linear-gradient(90deg, #E6337A, #F7811E 55%, #E9B21B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .off span { text-align: left; font-size: max(1.7vmin, calc(var(--d) * .032)); font-weight: 700; letter-spacing: .12em; line-height: 1.2; text-transform: uppercase; }
  .cta { margin-top: calc(var(--d) * .03); background: #3B1238; color: #FFF6E6; border-radius: 99vmin; padding: calc(var(--d) * .02) calc(var(--d) * .05); font-size: max(1.7vmin, calc(var(--d) * .032)); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .code { margin-top: calc(var(--d) * .022); font-size: max(1.7vmin, calc(var(--d) * .027)); font-weight: 500; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .code b { font-weight: 700; color: #C2266A; }
  /* small corner tag on the dye */
  .tag { position: absolute; left: 4vmin; top: calc(var(--ph) + 3.5vmin); background: #FFF6E6; color: #3B1238; font-size: 1.7vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; padding: 1vmin 1.6vmin; white-space: nowrap; transform: rotate(-3deg); }
  .tag b { color: #C2266A; }
  @media (min-aspect-ratio: 7/10) {
    .banner { --ph: 52%; --d: min(58vmin, calc(48vh - 5vmin)); }
    .tag { top: calc(var(--ph) + 2.5vmin); left: 3vmin; font-size: 1.6vmin; }
    .tag .dt { display: none; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --d: 47vmin; }
    .photo { width: 50%; height: 100%; object-position: 50% 24%; }
    .dye { top: 0; left: 50%; }
    .disc { left: 75%; top: 50%; }
    .tag { top: auto; left: calc(50% + 3vmin); bottom: 3.5vmin; font-size: 1.6vmin; }
    .tag .dt { display: inline; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --d: 64vmin; }
    .photo { width: 48%; }
    .dye { left: 48%; }
    .disc { left: 74%; }
    .tag { left: calc(48% + 3.5vmin); bottom: 4vmin; font-size: 1.7vmin; }
  }

  /* ───────── motion (8s loop) — psychedelic but smooth ─────────
     constant: the woven label's rim text turns like a spinning record (one revolution per loop);
     the dye spiral twists in and unwinds (−24°, swelling 6 %) while the crinkle rings counter-twist, all on one breath
     beats: 2.6s the "35%" colour runs through its dye (gradient slides across and back) · 4.4s the label disc throbs ·
            6.2s "Get tangled" wiggles and the code tag swings */
  .dye svg > g { transform-box: view-box; transform-origin: 100px 100px; }
  .dye svg > g:first-of-type { animation: twist 8s cubic-bezier(.45,0,.55,1) infinite; }
  .dye svg > g:last-of-type { animation: counter 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes twist { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(-24deg) scale(1.06); } }
  @keyframes counter { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(16deg) scale(1.03); } }

  .disc svg.ring { animation: spin 8s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .off b { background-image: linear-gradient(90deg, #E6337A 0%, #F7811E 27.5%, #E9B21B 50%, #F7811E 72.5%, #E6337A 100%);
    background-size: 200% 100%; background-position: 0 0; animation: run 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes run { 0%, 30%, 62%, 100% { background-position: 0 0; } 46% { background-position: 100% 0; } }

  .disc { animation: throb 8s cubic-bezier(.3,1.4,.5,1) infinite; }
  @keyframes throb { 0%, 53%, 63%, 100% { transform: translate(-50%, -50%) scale(1); } 57% { transform: translate(-50%, -50%) scale(1.045); } }

  .cta { animation: wiggle 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes wiggle { 0%, 76%, 88%, 100% { transform: none; } 79% { transform: rotate(-4deg) scale(1.05); } 82% { transform: rotate(3deg) scale(1.05); } 85% { transform: rotate(-1.5deg); } }
  .tag { transform-origin: 8% 0; animation: swing 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes swing { 0%, 76%, 92%, 100% { transform: rotate(-3deg); } 80% { transform: rotate(3deg); } 85% { transform: rotate(-5deg); } 89% { transform: rotate(-2deg); } }
</style>
</head>
