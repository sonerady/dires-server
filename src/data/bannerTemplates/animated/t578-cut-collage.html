<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Bodoni+Moda:ital,wght@1,600&family=Rubik+Mono+One&family=Work+Sans:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Cut Collage — a black journal page with a cut-and-paste collage: the headline spelled out in letters snipped
     from different magazines (every letter its own paper, typeface and tilt), a torn strip of editorial copy,
     a gingham fabric swatch with pinking-shear edges, a torn yellow price scrap and a strip of red tape as the CTA.
     The photo is glued down clean. tall → letters / photo / scraps · 3:4 & square → photo left, collage column right ·
     wide → photo left, wider collage right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1E1C1A; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #F3EEE4; font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle, rgba(255,255,255,.05) 0 .12vmin, transparent .2vmin) 0 0 / 1.7vmin 2.1vmin,
      radial-gradient(ellipse at 40% 30%, #2A2724 0%, #1E1C1A 65%, #141312 100%); }

  .photo { position: absolute; left: 7vmin; top: 37vmin; width: calc(100% - 14vmin); height: calc(100% - 81vmin); object-fit: cover; object-position: 50% 30%; display: block;
    box-shadow: 0 .8vmin 2vmin rgba(0,0,0,.55); }

  .side { position: absolute; left: 6vmin; right: 6vmin; top: 5vmin; bottom: 5vmin; display: flex; flex-direction: column; justify-content: space-between; }

  /* ransom letters */
  .hl { --L: 11vmin; display: flex; flex-wrap: wrap; gap: 1.8vmin 3vmin; }
  .w { display: flex; gap: .9vmin; white-space: nowrap; }
  .w i { display: inline-block; font-style: normal; font-size: var(--L); line-height: 1; padding: .12em .14em .08em; box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.45); }
  .a { background: #F2E9D8; color: #151311; font-family: "Abril Fatface", Georgia, serif; transform: rotate(-4deg); }
  .b { background: #E4412C; color: #FFF; font-family: "Anton", Impact, sans-serif; transform: rotate(3deg) translateY(.4vmin); }
  .c { background: #FFFFFF; color: #151311; font-family: "Bodoni Moda", Georgia, serif; font-style: italic !important; font-weight: 600; transform: rotate(-2deg) translateY(-.3vmin); }
  .d { background: #151311; color: #F5D33C; font-family: "Rubik Mono One", sans-serif; font-size: calc(var(--L) * .86) !important; outline: .3vmin solid #F3EEE4; outline-offset: -.8vmin; transform: rotate(4deg); }
  .e { background: #86B7D6; color: #0F2233; font-family: "Abril Fatface", Georgia, serif; transform: rotate(-3deg) translateY(.3vmin); }
  .f { background: #EBD6C4; color: #7A2E22; font-family: "Anton", Impact, sans-serif; transform: rotate(2deg); }

  .lower { display: flex; flex-direction: column; gap: 3vmin; }
  .strip { align-self: flex-start; max-width: 60vmin; background: #F4F0E6; color: #1E1C1A; padding: 2vmin 3.4vmin 2.2vmin; transform: rotate(-1.2deg);
    font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-weight: 600; font-size: 3vmin; line-height: 1.2;
    clip-path: polygon(0 6%, 4% 0, 12% 4%, 22% 0, 34% 5%, 47% 1%, 58% 5%, 71% 0, 83% 4%, 93% 0, 100% 5%, 98% 50%, 100% 96%, 90% 100%, 78% 95%, 64% 100%, 52% 96%, 38% 100%, 26% 95%, 14% 100%, 3% 96%, 1% 50%); }
  .strip small { display: block; margin-top: .8vmin; font-family: "Work Sans", sans-serif; font-style: normal; font-weight: 600; font-size: 1.6vmin; letter-spacing: .16em; text-transform: uppercase; color: #6B645A; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 3vmin 4vmin; }
  .swatch { flex: none; width: 17vmin; height: 17vmin; transform: rotate(7deg); filter: drop-shadow(0 .5vmin .6vmin rgba(0,0,0,.5)); }
  .swatch i { display: block; width: 100%; height: 100%;
    background:
      repeating-linear-gradient(0deg, rgba(200,70,60,.55) 0 1.3vmin, transparent 1.3vmin 2.6vmin),
      repeating-linear-gradient(90deg, rgba(200,70,60,.55) 0 1.3vmin, transparent 1.3vmin 2.6vmin), #F6EFE4;
    clip-path: polygon(0 0, 5% 3%, 10% 0, 15% 3%, 20% 0, 25% 3%, 30% 0, 35% 3%, 40% 0, 45% 3%, 50% 0, 55% 3%, 60% 0, 65% 3%, 70% 0, 75% 3%, 80% 0, 85% 3%, 90% 0, 95% 3%, 100% 0,
      97% 5%, 100% 10%, 97% 15%, 100% 20%, 97% 25%, 100% 30%, 97% 35%, 100% 40%, 97% 45%, 100% 50%, 97% 55%, 100% 60%, 97% 65%, 100% 70%, 97% 75%, 100% 80%, 97% 85%, 100% 90%, 97% 95%, 100% 100%,
      95% 97%, 90% 100%, 85% 97%, 80% 100%, 75% 97%, 70% 100%, 65% 97%, 60% 100%, 55% 97%, 50% 100%, 45% 97%, 40% 100%, 35% 97%, 30% 100%, 25% 97%, 20% 100%, 15% 97%, 10% 100%, 5% 97%, 0 100%,
      3% 95%, 0 90%, 3% 85%, 0 80%, 3% 75%, 0 70%, 3% 65%, 0 60%, 3% 55%, 0 50%, 3% 45%, 0 40%, 3% 35%, 0 30%, 3% 25%, 0 20%, 3% 15%, 0 10%, 3% 5%); }
  .price { flex: none; background: #F5D33C; color: #151311; padding: 1.2vmin 3vmin 1.4vmin; transform: rotate(-4deg); font-family: "Anton", Impact, sans-serif; font-size: 7vmin; line-height: 1;
    clip-path: polygon(2% 4%, 30% 0, 60% 5%, 97% 0, 100% 40%, 96% 70%, 100% 100%, 64% 95%, 32% 100%, 0 96%, 3% 60%, 0 30%); }
  .price small { display: block; font-family: "Work Sans", sans-serif; font-weight: 600; font-size: 1.6vmin; letter-spacing: .14em; margin-bottom: .4vmin; }
  .tape { flex: none; background: rgba(214,52,40,.92); color: #FFF; padding: 1.4vmin 3.6vmin; transform: rotate(2deg); font-weight: 600; font-size: 2.1vmin; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
    clip-path: polygon(0 0, 100% 0, 98% 25%, 100% 50%, 97.5% 75%, 100% 100%, 0 100%, 2% 70%, 0 45%, 2.5% 20%); }

  /* ── 3:4 & square — photo left, collage column right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { left: 6vmin; top: 6vmin; width: 50vmin; height: calc(100% - 12vmin); }
    .side { left: 61vmin; right: 4vmin; top: 6vmin; bottom: 6vmin; justify-content: center; gap: 7vmin; }
    .hl { --L: 6.2vmin; gap: 1.6vmin; }
    .w { gap: .7vmin; }
    .strip { max-width: none; font-size: 2.5vmin; padding: 1.8vmin 2.6vmin 2vmin; }
    .row { gap: 2.4vmin 2.6vmin; }
    .swatch { width: 13vmin; height: 13vmin; }
    .price { font-size: 6vmin; padding: 1vmin 2.4vmin 1.2vmin; }
    .tape { font-size: 1.9vmin; padding: 1.2vmin 2.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46vmin; top: 5vmin; height: calc(100% - 10vmin); left: 5vmin; }
    .side { left: 56vmin; top: 5vmin; bottom: 5vmin; gap: 5vmin; }
    .hl { --L: 5.6vmin; }
    .lower { gap: 2.4vmin; }
    .strip { font-size: 2.3vmin; }
    .swatch { width: 10vmin; height: 10vmin; }
    .price { font-size: 5vmin; }
  }
  /* ── wide — photo left, wider collage right ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { left: 6vmin; top: 6vmin; width: 58vmin; height: calc(100% - 12vmin); }
    .side { left: 72vmin; right: 6vmin; top: 7vmin; bottom: 6vmin; justify-content: space-between; }
    .hl { --L: 9.6vmin; gap: 2.2vmin 3vmin; }
    .w { gap: 1vmin; }
    .strip { font-size: 3.1vmin; max-width: 60vmin; }
    .swatch { width: 16vmin; height: 16vmin; }
    .price { font-size: 7vmin; }
    .tape { font-size: 2.1vmin; }
  }
  /* ───────── motion (6s loop · t=0 = static design) ─────────
     first ~1s calm · 1.0–2.6s the cut-out letters are lifted and re-pasted one by one, J → D, each flipping its tilt ·
     3.3s the yellow price scrap flutters as if caught by a draft · 4.2s a light sheen runs along the red tape CTA ·
     the gingham swatch sways gently all loop */
  @keyframes pop-a {
    0%, 35%, 46%, 100% { transform: translateY(0) rotate(-4deg) scale(1); box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.45); }
    38.5% { transform: translateY(-1.4vmin) rotate(4.8deg) scale(1.12); box-shadow: 0 1.6vmin 1.8vmin rgba(0,0,0,.4); }
    42% { transform: translateY(0) rotate(-4.6deg) scale(.96); box-shadow: 0 .2vmin .3vmin rgba(0,0,0,.5); }
  }
  .hl i.a { animation: pop-a 6s cubic-bezier(.35,0,.25,1) infinite; }
  @keyframes pop-b {
    0%, 35%, 46%, 100% { transform: translateY(.4vmin) rotate(3deg) scale(1); box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.45); }
    38.5% { transform: translateY(-1.4vmin) rotate(-3.6deg) scale(1.12); box-shadow: 0 1.6vmin 1.8vmin rgba(0,0,0,.4); }
    42% { transform: translateY(.4vmin) rotate(3.45deg) scale(.96); box-shadow: 0 .2vmin .3vmin rgba(0,0,0,.5); }
  }
  .hl i.b { animation: pop-b 6s cubic-bezier(.35,0,.25,1) infinite; }
  @keyframes pop-c {
    0%, 35%, 46%, 100% { transform: translateY(-.3vmin) rotate(-2deg) scale(1); box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.45); }
    38.5% { transform: translateY(-1.4vmin) rotate(2.4deg) scale(1.12); box-shadow: 0 1.6vmin 1.8vmin rgba(0,0,0,.4); }
    42% { transform: translateY(-.3vmin) rotate(-2.3deg) scale(.96); box-shadow: 0 .2vmin .3vmin rgba(0,0,0,.5); }
  }
  .hl i.c { animation: pop-c 6s cubic-bezier(.35,0,.25,1) infinite; }
  @keyframes pop-d {
    0%, 35%, 46%, 100% { transform: translateY(0) rotate(4deg) scale(1); box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.45); }
    38.5% { transform: translateY(-1.4vmin) rotate(-4.8deg) scale(1.12); box-shadow: 0 1.6vmin 1.8vmin rgba(0,0,0,.4); }
    42% { transform: translateY(0) rotate(4.6deg) scale(.96); box-shadow: 0 .2vmin .3vmin rgba(0,0,0,.5); }
  }
  .hl i.d { animation: pop-d 6s cubic-bezier(.35,0,.25,1) infinite; }
  @keyframes pop-e {
    0%, 35%, 46%, 100% { transform: translateY(.3vmin) rotate(-3deg) scale(1); box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.45); }
    38.5% { transform: translateY(-1.4vmin) rotate(3.6deg) scale(1.12); box-shadow: 0 1.6vmin 1.8vmin rgba(0,0,0,.4); }
    42% { transform: translateY(.3vmin) rotate(-3.45deg) scale(.96); box-shadow: 0 .2vmin .3vmin rgba(0,0,0,.5); }
  }
  .hl i.e { animation: pop-e 6s cubic-bezier(.35,0,.25,1) infinite; }
  @keyframes pop-f {
    0%, 35%, 46%, 100% { transform: translateY(0) rotate(2deg) scale(1); box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.45); }
    38.5% { transform: translateY(-1.4vmin) rotate(-2.4deg) scale(1.12); box-shadow: 0 1.6vmin 1.8vmin rgba(0,0,0,.4); }
    42% { transform: translateY(0) rotate(2.3deg) scale(.96); box-shadow: 0 .2vmin .3vmin rgba(0,0,0,.5); }
  }
  .hl i.f { animation: pop-f 6s cubic-bezier(.35,0,.25,1) infinite; }
  .hl .w:nth-child(1) i:nth-child(1) { animation-delay: -1.17s; }
  .hl .w:nth-child(1) i:nth-child(2) { animation-delay: -1.04s; }
  .hl .w:nth-child(1) i:nth-child(3) { animation-delay: -0.91s; }
  .hl .w:nth-child(1) i:nth-child(4) { animation-delay: -0.78s; }
  .hl .w:nth-child(2) i:nth-child(1) { animation-delay: -0.65s; }
  .hl .w:nth-child(2) i:nth-child(2) { animation-delay: -0.52s; }
  .hl .w:nth-child(2) i:nth-child(3) { animation-delay: -0.39s; }
  .hl .w:nth-child(2) i:nth-child(4) { animation-delay: -0.26s; }
  .hl .w:nth-child(2) i:nth-child(5) { animation-delay: -0.13s; }
  .hl .w:nth-child(2) i:nth-child(6) { animation-delay: 0.00s; }

  .price { animation: flutter 6s cubic-bezier(.4,0,.3,1) infinite; transform-origin: 20% 10%; }
  @keyframes flutter {
    0%, 54%, 70%, 100% { transform: rotate(-4deg); }
    57% { transform: rotate(-8deg) translateY(-.4vmin); }
    61% { transform: rotate(-1.5deg); }
    65% { transform: rotate(-5.5deg); }
  }
  .tape { background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.42) 50%, transparent 62%) 100% 0 / 260% 100% no-repeat, rgba(214,52,40,.92);
    animation: sheen 6s cubic-bezier(.45,0,.3,1) infinite; }
  @keyframes sheen { 0%, 70% { background-position: 100% 0, 0 0; } 84%, 100% { background-position: 0% 0, 0 0; } }
  .swatch { animation: sway 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(9.5deg) translateY(-.3vmin); } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="side">
    <div class="hl" aria-label="Just landed">
      <span class="w"><i class="a">J</i><i class="b">U</i><i class="c">s</i><i class="d">T</i></span>
      <span class="w"><i class="e">L</i><i class="f">A</i><i class="c">n</i><i class="a">D</i><i class="b">E</i><i class="d">D</i></span>
    </div>
    <div class="lower">
      <div class="strip">Cut from this season's best, glued straight to your wishlist.<small>Collage Nº 12 · Fenwick &amp; Rue</small></div>
      <div class="row">
        <div class="swatch"><i></i></div>
        <div class="price"><small>NOW</small>$89</div>
        <div class="tape">Shop the edit →</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
