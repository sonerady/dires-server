<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Missing Piece — complete-the-look as a jigsaw: hairline puzzle cuts run over the photo, one piece is
     traced in signal orange, and that piece — a close crop of the same photo cut to a jigsaw shape —
     lies lifted beside it with a soft shadow. tall / 3:4 → photo above, piece + copy below;
     square → photo left, piece over the copy on the right; wide → photo left, piece beside the copy */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F2EFE9; }
  .banner { --p: 30vmin; position: fixed; inset: 0; overflow: hidden; background: #F2EFE9; color: #141414; font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; }
  .ph { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
  .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .ph svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

  .copy { flex: none; display: flex; align-items: center; gap: 5vmin; padding: 5vmin 5vmin 0; }
  .pw { flex: none; position: relative; width: var(--p); height: var(--p); filter: drop-shadow(0 1.2vmin 1.4vmin rgba(20,20,20,.28)); transform: rotate(-8deg); }
  .pc { position: absolute; inset: 0; clip-path: url(#jig); overflow: hidden; }
  .pc img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; transform: scale(2.2); transform-origin: 50% 42%; display: block; }
  .pw svg.o { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .txt { flex: 1 1 auto; min-width: 0; }
  .k { font-size: 1.8vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #FF5A1F; }
  h1 { margin: 1.8vmin 0 0; font-family: "Unbounded", "Arial Black", sans-serif; font-weight: 700; font-size: 6.6vmin; line-height: 1.02; letter-spacing: -.035em; }
  .sub { margin: 2vmin 0 0; font-size: 2.1vmin; line-height: 1.4; color: #4A4742; }

  .foot { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 3vmin; margin: 4vmin 5vmin 5vmin; padding-top: 2.4vmin; border-top: 1px solid #141414; }
  .foot p { margin: 0; font-size: 2vmin; font-weight: 500; }
  .foot p b { font-weight: 700; }
  .cta { flex: none; background: #FF5A1F; color: #141414; padding: 1.8vmin 3vmin; font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 1.9vmin; letter-spacing: .02em; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --p: 24vmin; }
    .copy { padding-top: 4vmin; }
    h1 { font-size: 5.6vmin; }
    .sub { font-size: 1.9vmin; margin-top: 1.4vmin; }
    .foot { margin: 3vmin 5vmin 4.4vmin; padding-top: 2vmin; }
  }
  /* square — photo left, piece above the copy on the right */
  @media (min-aspect-ratio: 9/10) {
    .banner { --p: 30vmin; display: grid; grid-template-columns: 52% minmax(0, 1fr); grid-template-rows: 1fr auto; }
    .ph { grid-column: 1; grid-row: 1 / -1; }
    .copy { grid-column: 2; grid-row: 1; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4vmin; padding: 5vmin 5vmin 0; }
    .pw { margin-left: 2vmin; }
    h1 { font-size: 5vmin; }
    .foot { grid-column: 2; grid-row: 2; flex-direction: column; align-items: flex-start; gap: 2vmin; margin: 3vmin 5vmin 5vmin; }
    .foot p { font-size: 1.8vmin; }
    .cta { font-size: 1.7vmin; padding: 1.6vmin 2.4vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --p: 28vmin; grid-template-columns: 42% minmax(0, 1fr); }
    .copy { flex-direction: row; align-items: center; gap: 5vmin; padding: 6vmin 6vmin 0; }
    h1 { font-size: 6vmin; }
    .sub { font-size: 2vmin; }
    .foot { flex-direction: row; align-items: center; margin: 3vmin 6vmin 6vmin; }
    .foot p { font-size: 1.9vmin; }
    .cta { font-size: 1.8vmin; padding: 1.8vmin 2.8vmin; }
  }

  /* ───────── motion (6s loop · t=0 = static design) ─────────
     constant: the traced hole's orange dashes march round it (marching ants) and its tint breathes ·
     the loose piece floats gently (3s) · 2.6s the piece lifts, turns toward the hole and "tries" it
     with a small wiggle, then settles · 4.2s the headline wipes up again · 5.1s light sweep on the CTA */
  .ph svg path:nth-child(2) { animation: ants 1.5s linear infinite, hole 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes ants { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -24; } }
  @keyframes hole { 0%, 100% { fill-opacity: .12; } 50% { fill-opacity: .2; } }

  .pw { animation: float 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes float {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    20% { transform: rotate(-7deg) translateY(-.6vmin); }
    40% { transform: rotate(-8deg) translateY(0); }
    47% { transform: rotate(0deg) translateY(-2.6vmin) scale(1.06); filter: drop-shadow(0 2.6vmin 2.2vmin rgba(20,20,20,.22)); }
    51% { transform: rotate(3deg) translateY(-2.6vmin) scale(1.06); }
    54% { transform: rotate(-2deg) translateY(-2.6vmin) scale(1.06); }
    57% { transform: rotate(1deg) translateY(-2.4vmin) scale(1.06); filter: drop-shadow(0 2.6vmin 2.2vmin rgba(20,20,20,.22)); }
    66% { transform: rotate(-8.6deg) translateY(.2vmin) scale(1); filter: drop-shadow(0 1.2vmin 1.4vmin rgba(20,20,20,.28)); }
    72% { transform: rotate(-8deg) translateY(0); }
    86% { transform: rotate(-7deg) translateY(-.6vmin); }
  }

  h1 { animation: head 6s cubic-bezier(.7,0,.2,1) infinite; }
  @keyframes head {
    0%, 68% { clip-path: inset(-10% -2% -10% -2%); transform: translateY(0); }
    71% { clip-path: inset(-10% -2% 110% -2%); transform: translateY(-1vmin); }
    72% { clip-path: inset(110% -2% -10% -2%); transform: translateY(1.6vmin); }
    80%, 100% { clip-path: inset(-10% -2% -10% -2%); transform: translateY(0); }
  }
  .k { animation: kick 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes kick { 0%, 66%, 84%, 100% { opacity: 1; } 74% { opacity: .35; } }

  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%; background-position: 120% 0; animation: sheen 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sheen { 0%, 84% { background-position: 120% 0; } 97%, 100% { background-position: -20% 0; } }
</style>
</head>
