<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Flow Card — the teacher's ruled index card: typed class header, the sequence pencilled line by line with
     breath arrows, the offer highlighted and the CTA circled by hand; a scribbled arrow points to the look.
     tall → photo above, card below · 3:4 and wider → photo left, card right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FBF8F1; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #FBF8F1; color: #2B2D35; font-family: "Caveat", "Bradley Hand", cursive; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 84vmin); object-fit: cover; object-position: 50% 20%; display: block; }
  .card { position: absolute; left: 0; right: 0; bottom: 0; height: 84vmin; box-sizing: border-box; padding: 0 5vmin 0 15vmin;
    background:
      linear-gradient(90deg, transparent 12vmin, rgba(222,122,106,.8) 12vmin, rgba(222,122,106,.8) calc(12vmin + 1px), transparent calc(12vmin + 1px), transparent 12.6vmin, rgba(222,122,106,.8) 12.6vmin, rgba(222,122,106,.8) calc(12.6vmin + 1px), transparent calc(12.6vmin + 1px)),
      repeating-linear-gradient(180deg, transparent 0 calc(5.2vmin - 1px), #BCD0E4 calc(5.2vmin - 1px) 5.2vmin) 0 0 / 100% 100%,
      #FBF8F1; }
  .hd { height: 10.4vmin; margin: 0 -5vmin 0 -15vmin; padding: 0 5vmin 0 5vmin; box-sizing: border-box; background: #FBF8F1; border-bottom: .3vmin solid #DE7A6A; display: flex; align-items: center; justify-content: space-between; gap: 2vmin; font-family: "Courier Prime", Courier, monospace; font-size: 1.8vmin; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .hd b { font-weight: 700; }
  .hd .note { font-family: "Caveat", cursive; font-size: 3.4vmin; font-weight: 600; text-transform: none; letter-spacing: 0; color: #C2503E; display: flex; align-items: center; gap: .8vmin; }
  .hd .note svg { width: 4.4vmin; height: 5vmin; }
  h1 { margin: 0; font-weight: 700; font-size: 9.8vmin; line-height: 10.4vmin; letter-spacing: -.01em; white-space: nowrap; }
  h1 span { color: #2F5DA8; }
  ol { margin: 0; padding: 0; list-style: none; }
  li { position: relative; height: 5.2vmin; line-height: 5.6vmin; font-size: 3.6vmin; font-weight: 500; white-space: nowrap; }
  li::before { content: attr(data-n); position: absolute; left: -9.6vmin; font-family: "Courier Prime", Courier, monospace; font-size: 1.7vmin; line-height: 5.8vmin; color: #C2503E; }
  li i { font-style: normal; font-weight: 700; color: #2F5DA8; }
  .offer { height: 5.2vmin; line-height: 5.6vmin; font-size: 3.8vmin; font-weight: 700; white-space: nowrap; }
  .offer mark { background: linear-gradient(180deg, transparent 22%, rgba(226,240,96,.85) 22%, rgba(226,240,96,.85) 88%, transparent 88%); color: inherit; padding: 0 .8vmin; margin: 0 -.8vmin; }
  .cta { position: relative; display: inline-block; height: 5.2vmin; line-height: 5.6vmin; margin-top: 5.2vmin; padding: 0 1.4vmin; font-size: 4.2vmin; font-weight: 700; color: #C2503E; white-space: nowrap; }
  .cta svg { position: absolute; left: -2vmin; top: -2vmin; width: calc(100% + 4vmin); height: calc(100% + 3.6vmin); overflow: visible; }
  .cta svg path { stroke-width: .36vmin; }
  .sig { position: absolute; right: 5vmin; bottom: 4.6vmin; font-family: "Courier Prime", Courier, monospace; font-size: 1.6vmin; letter-spacing: .08em; text-transform: uppercase; color: #6A6C74; white-space: nowrap; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 73.6vmin); }
    .card { height: 73.6vmin; }
    li.x { display: none; }
  }
  /* ── 3:4 and wider → photo left, card right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 48%; height: 100%; object-position: 50% 22%; }
    .card { left: 48%; top: 0; height: auto; padding: 0 3vmin 0 11vmin;
      background:
        linear-gradient(90deg, transparent 8.6vmin, rgba(222,122,106,.8) 8.6vmin, rgba(222,122,106,.8) calc(8.6vmin + 1px), transparent calc(8.6vmin + 1px), transparent 9.2vmin, rgba(222,122,106,.8) 9.2vmin, rgba(222,122,106,.8) calc(9.2vmin + 1px), transparent calc(9.2vmin + 1px)),
        repeating-linear-gradient(180deg, transparent 0 calc(5.2vmin - 1px), #BCD0E4 calc(5.2vmin - 1px) 5.2vmin) 0 0 / 100% 100%,
        #FBF8F1;
      box-shadow: -1vmin 0 2.4vmin rgba(60,50,40,.12); }
    .hd { height: 15.6vmin; margin: 0 -3vmin 0 -11vmin; padding: 0 3vmin 0 3.6vmin; flex-direction: column; align-items: flex-start; justify-content: center; gap: .6vmin; }
    h1 { font-size: 8.6vmin; }
    li { font-size: 3.1vmin; }
    li::before { left: -7.6vmin; }
    li.x { display: block; }
    .offer { font-size: 3.2vmin; }
    .cta { font-size: 3.6vmin; }
    .sig { right: 3vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; }
    .card { left: 46%; }
    .hd { height: 10.4vmin; flex-direction: row; align-items: center; justify-content: space-between; }
    .hd .note { display: none; }
    h1 { font-size: 7.6vmin; }
    li { font-size: 2.9vmin; }
    li.x2 { display: none; }
    .offer { font-size: 2.9vmin; }
    .cta { font-size: 3.4vmin; }
    .sig { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; object-position: 70% 30%; }
    .card { left: 44%; padding: 0 5vmin 0 13vmin;
      background:
        linear-gradient(90deg, transparent 10vmin, rgba(222,122,106,.8) 10vmin, rgba(222,122,106,.8) calc(10vmin + 1px), transparent calc(10vmin + 1px), transparent 10.6vmin, rgba(222,122,106,.8) 10.6vmin, rgba(222,122,106,.8) calc(10.6vmin + 1px), transparent calc(10.6vmin + 1px)),
        repeating-linear-gradient(180deg, transparent 0 calc(5.2vmin - 1px), #BCD0E4 calc(5.2vmin - 1px) 5.2vmin) 0 0 / 100% 100%,
        #FBF8F1; }
    .hd { margin: 0 -5vmin 0 -13vmin; padding: 0 5vmin 0 4.4vmin; }
    .hd .note { display: flex; }
    h1 { font-size: 9.6vmin; }
    li { font-size: 3.3vmin; }
    li::before { left: -9vmin; }
    li.x2 { display: block; }
    .offer { font-size: 3.4vmin; }
    .cta { font-size: 3.8vmin; }
    .sig { display: block; right: 5vmin; bottom: 5vmin; }
  }

  /* ───────── motion (6 s loop · t=0 = static design) ─────────
     constant: the breath arrows rise on every inhale and sink on every exhale (3 s breath), the scribbled
     "wear this" arrow keeps pointing at the look, the photo breathes (≤1.03)
     beats: 1.2 s "the flow." is re-written left→right · 3 s the highlighter re-swipes the offer ·
            4 s the pen re-circles the CTA */
  .photo { transform-origin: 50% 35%; animation: breathe 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  li .up, li .dn { display: inline-block; }
  li .up { animation: inhale 3s cubic-bezier(.45,0,.55,1) infinite; }
  li .dn { animation: exhale 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes inhale { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.8vmin); } }
  @keyframes exhale { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(.8vmin); } }

  .hd .note svg { animation: point 1.5s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes point { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-.5vmin, -.5vmin); } }

  h1 span { display: inline-block; animation: write 6s cubic-bezier(.55,0,.35,1) infinite; }
  @keyframes write {
    0%, 16% { clip-path: inset(-20% -4% -30% 0); }
    20% { clip-path: inset(-20% -4% -30% 0); opacity: 0; }
    21% { clip-path: inset(-20% 100% -30% 0); opacity: 1; }
    38%, 100% { clip-path: inset(-20% -4% -30% 0); opacity: 1; }
  }

  .offer mark { background-repeat: no-repeat; background-position: 0 0; background-size: 100% 100%; animation: marker 6s cubic-bezier(.6,0,.3,1) infinite; }
  @keyframes marker { 0%, 46% { background-size: 100% 100%; } 50% { background-size: 0% 100%; } 51% { background-size: 0% 100%; } 62%, 100% { background-size: 100% 100%; } }

  .cta svg path { stroke-dasharray: 1 1; stroke-dashoffset: 0; animation: circle 6s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes circle {
    0%, 62% { stroke-dashoffset: 0; opacity: 1; }
    65% { stroke-dashoffset: 0; opacity: 0; }
    66% { stroke-dashoffset: 1; opacity: 0; }
    67% { stroke-dashoffset: 1; opacity: 1; }
    82%, 100% { stroke-dashoffset: 0; opacity: 1; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="card">
    <div class="hd"><span><b>Sequence Nº 12</b> · Sun flow · 45 min</span><span class="note"><svg viewBox="0 0 22 26" aria-hidden="true"><path d="M4 24 C6 14 10 8 17 3 M11 3.4 L17 3 L16.2 9" fill="none" stroke="#C2503E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>wear this</span></div>
    <h1>Go with<br><span>the flow.</span></h1>
    <ol>
      <li data-n="01">Mountain — <i>inhale <span class="up">↑</span></i></li>
      <li data-n="02">Reach up — <i>inhale <span class="up">↑</span></i></li>
      <li data-n="03">Forward fold — <i>exhale <span class="dn">↓</span></i></li>
      <li data-n="04" class="x">Plank — hold for 5</li>
      <li data-n="05" class="x x2">Up dog → down dog</li>
    </ol>
    <div class="offer"><mark>New flow edit −20% · FLOW20</mark></div>
    <div class="cta">Shop the flow →<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M8 22 C4 8 40 3 70 5 C96 7 99 20 92 30 C82 40 30 40 12 33 C4 29 5 20 18 14" fill="none" stroke="#C2503E" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
    <div class="sig">Studio Nord · Tue 07:00</div>
  </div>
</div>
</body>
</html>
