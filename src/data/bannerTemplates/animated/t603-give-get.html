<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;800;900&family=Young+Serif&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Give & Get — refer-a-friend: a two-part voucher torn along a perforation (GIVE $20 in deep green, GET $20 in coral),
     half-moon notches where the halves meet, a three-step "how it works" line and the terms in small print.
     tall / 3:4 → headline, photo, voucher halves side by side, steps · square / wide → photo left, headline + stacked voucher right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #E3EEE5; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #E3EEE5; color: #0F3B2E; box-sizing: border-box;
    font-family: "Gabarito", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; padding: 5.4vmin 6vmin 5vmin; }

  .head { flex: none; }
  .kick { display: flex; align-items: center; gap: 1.4vmin; font-size: 1.7vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
  .kick i { width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #FF6B4A; }
  h1 { margin: 2vmin 0 0; font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 8.4vmin; line-height: .98; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #E0533A; }

  .photo { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 3.6vmin; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; display: block; }

  .coupon { flex: none; display: grid; grid-template-columns: 1fr 1fr; margin-top: 3vmin; }
  .half { position: relative; padding: 2.8vmin 3.4vmin 3vmin; }
  .give { color: #E3EEE5;
    background: radial-gradient(circle at 100% 0, #E3EEE5 2.2vmin, transparent 2.3vmin), radial-gradient(circle at 100% 100%, #E3EEE5 2.2vmin, transparent 2.3vmin), #0F3B2E; }
  .get { color: #1D1512;
    background: radial-gradient(circle at 0 0, #E3EEE5 2.2vmin, transparent 2.3vmin), radial-gradient(circle at 0 100%, #E3EEE5 2.2vmin, transparent 2.3vmin), #FF6B4A; }
  .get::before { content: ""; position: absolute; left: 0; top: 3.2vmin; bottom: 3.2vmin; border-left: .35vmin dashed #E3EEE5; }
  .lab { font-size: 1.8vmin; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; }
  .amt { margin-top: .6vmin; font-weight: 900; font-size: 12vmin; line-height: .9; letter-spacing: -.04em; }
  .amt sup { font-size: .42em; vertical-align: .9em; margin-right: .3vmin; letter-spacing: 0; }
  .desc { margin-top: 1vmin; font-size: 1.9vmin; font-weight: 500; line-height: 1.3; }

  .foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; margin-top: 3vmin; }
  .steps { display: flex; align-items: center; gap: 1.2vmin; font-size: 1.9vmin; font-weight: 700; white-space: nowrap; }
  .steps b { display: inline-flex; align-items: center; justify-content: center; width: 3vmin; height: 3vmin; border-radius: 50%; border: 1px solid #0F3B2E; font-size: 1.6vmin; }
  .steps s { text-decoration: none; opacity: .4; margin: 0 .4vmin; }
  .cta { flex: none; padding: 1.8vmin 3vmin; border-radius: 99vmin; background: #0F3B2E; color: #E3EEE5; font-size: 2vmin; font-weight: 700; white-space: nowrap; }
  .fine { flex: none; margin-top: 2.2vmin; font-size: 1.6vmin; color: rgba(15,59,46,.66); }

  @media (min-aspect-ratio: 7/10) {
    .banner { padding: 4.6vmin 6vmin 4.4vmin; }
    h1 { font-size: 7.2vmin; margin-top: 1.6vmin; }
    .photo { margin-top: 3vmin; }
    .coupon { margin-top: 2.6vmin; }
    .half { padding: 2.2vmin 3vmin 2.4vmin; }
    .amt { font-size: 9.6vmin; }
    .foot { margin-top: 2.4vmin; }
    .fine { margin-top: 1.6vmin; }
  }
  /* ── square / wide: photo left, headline and a stacked voucher on the right ── */
  @media (min-aspect-ratio: 9/10) {
    .banner { display: grid; padding: 5vmin; column-gap: 5vmin;
      grid-template-columns: 46% 1fr; grid-template-rows: auto 1fr auto auto auto;
      grid-template-areas: "photo head" "photo coupon" "photo foot" "photo fine" "photo ."; }
    .head { grid-area: head; }
    .photo { grid-area: photo; margin: 0; }
    .coupon { grid-area: coupon; align-self: center; grid-template-columns: 1fr; margin: 3vmin 0; }
    .give { background: radial-gradient(circle at 0 100%, #E3EEE5 2.2vmin, transparent 2.3vmin), radial-gradient(circle at 100% 100%, #E3EEE5 2.2vmin, transparent 2.3vmin), #0F3B2E; }
    .get { background: radial-gradient(circle at 0 0, #E3EEE5 2.2vmin, transparent 2.3vmin), radial-gradient(circle at 100% 0, #E3EEE5 2.2vmin, transparent 2.3vmin), #FF6B4A; }
    .get::before { left: 3.2vmin; right: 3.2vmin; top: 0; bottom: auto; border-left: 0; border-top: .35vmin dashed #E3EEE5; }
    .half { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 3vmin; padding: 2vmin 3vmin; }
    .lab { grid-column: 2; grid-row: 1; align-self: end; }
    .amt { grid-column: 1; grid-row: 1 / 3; font-size: 8.6vmin; margin: 0; }
    .desc { grid-column: 2; grid-row: 2; align-self: start; margin-top: .4vmin; font-size: 1.8vmin; }
    h1 { font-size: 6.6vmin; }
    .foot { grid-area: foot; margin: 0; flex-direction: column; align-items: flex-start; gap: 2.4vmin; }
    .steps { font-size: 1.7vmin; gap: 1vmin; }
    .fine { grid-area: fine; margin-top: 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { padding: 6vmin 7vmin; column-gap: 7vmin; grid-template-columns: 44% 1fr; }
    h1 { font-size: 7.6vmin; }
    .half { padding: 2.6vmin 3.6vmin; }
    .amt { font-size: 10vmin; }
    .desc { font-size: 2vmin; }
    .foot { flex-direction: row; align-items: center; justify-content: space-between; }
    .steps { font-size: 1.8vmin; }
  }
  /* ───────────── motion (6 s loop · t=0 = static design) ───────────── */
  /* the voucher tears along its perforation and snaps back, each $20 punches in turn, the 1-2-3 steps light up in sequence */
  .photo { overflow: hidden; }
  .photo img { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  .kick i { animation: dot 1.5s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes dot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.7); opacity: .5; } }

  .give { transform-origin: 100% 100%; animation: tearL 6s cubic-bezier(.6,0,.2,1) infinite; }
  .get { transform-origin: 0 100%; animation: tearR 6s cubic-bezier(.6,0,.2,1) infinite; }
  @keyframes tearL { 0%, 8%, 40%, 100% { transform: none; } 16%, 30% { transform: translateX(-1.2vmin) rotate(-2deg); } }
  @keyframes tearR { 0%, 8%, 40%, 100% { transform: none; } 16%, 30% { transform: translateX(1.2vmin) rotate(2deg); } }
  @media (min-aspect-ratio: 9/10) {
    .give { transform-origin: 0 100%; animation-name: tearU; }
    .get { transform-origin: 0 0; animation-name: tearD; }
    @keyframes tearU { 0%, 8%, 40%, 100% { transform: none; } 16%, 30% { transform: translateY(-1vmin) rotate(-1.2deg); } }
    @keyframes tearD { 0%, 8%, 40%, 100% { transform: none; } 16%, 30% { transform: translateY(1vmin) rotate(1.2deg); } }
  }

  .amt { transform-origin: 0 80%; animation: amt 6s cubic-bezier(.3,0,.3,1) infinite; }
  .get .amt { animation-delay: -5.7s; }
  @keyframes amt { 0%, 34%, 50%, 100% { transform: scale(1); } 39% { transform: scale(1.12) rotate(-2deg); } 44% { transform: scale(.98); } }

  .steps b { animation: step 6s cubic-bezier(.3,0,.3,1) infinite; }
  .steps b:nth-of-type(2) { animation-delay: -5.7s; }
  .steps b:nth-of-type(3) { animation-delay: -5.4s; }
  @keyframes step {
    0%, 52%, 80%, 100% { background: transparent; color: #0F3B2E; border-color: #0F3B2E; transform: scale(1); }
    55% { background: #FF6B4A; color: #1D1512; border-color: #FF6B4A; transform: scale(1.2); }
    58%, 75% { background: #FF6B4A; color: #1D1512; border-color: #FF6B4A; transform: scale(1); }
  }

  .cta .ar { display: inline-block; animation: nudge 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes nudge { 0%, 40%, 62%, 100% { transform: translateX(0); } 50% { transform: translateX(.7vmin); } }
</style>
</head>
<body>
<div class="banner">
  <div class="head">
    <div class="kick"><i></i>Refer a friend · Loma Studio</div>
    <h1>Good taste is<br>better <em>shared.</em></h1>
  </div>
  <div class="photo"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="coupon">
    <div class="half give"><div class="lab">Give</div><div class="amt"><sup>$</sup>20</div><div class="desc">off your friend's<br>first order</div></div>
    <div class="half get"><div class="lab">Get</div><div class="amt"><sup>$</sup>20</div><div class="desc">credit for you<br>when they shop</div></div>
  </div>
  <div class="foot">
    <div class="steps"><b>1</b>Share<s>—</s><b>2</b>They shop<s>—</s><b>3</b>You both save</div>
    <div class="cta">Invite friends <span class="ar">→</span></div>
  </div>
  <div class="fine">Min. spend $60 · credit valid 90 days · no limit on invites</div>
</div>
</body>
</html>
