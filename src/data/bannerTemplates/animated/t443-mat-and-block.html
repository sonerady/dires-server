<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mat & Block — a studio still life: a rolled mat, a cork block and a coiled strap drawn on a plaster wall
     and a warm floor, each with a catalogue index, the product photo standing as the fourth object of the set.
     tall → photo above, still life below · 3:4 and wider → still life left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ECE3D5; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #ECE3D5; color: #2F2A24; font-family: "Jost", "Futura", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 82vmin); object-fit: cover; object-position: 50% 20%; display: block; }
  .tagn { position: absolute; right: 4.4vmin; top: calc(100% - 82vmin - 6.6vmin); padding: .9vmin 1.6vmin; background: #ECE3D5; font-size: 1.6vmin; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 82vmin; display: flex; flex-direction: column; }
  .top { padding: 4.6vmin 6vmin 0; }
  .kick { display: flex; justify-content: space-between; font-size: 1.7vmin; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: #6B6055; white-space: nowrap; }
  h1 { margin: 2vmin 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: 11.4vmin; line-height: .88; letter-spacing: -.02em; }
  h1 i { font-weight: 500; }

  /* wall → floor, the horizon sits at 82.5% of the stage (y = 33 of 40) */
  .stagewrap { flex: none; display: flex; justify-content: center; margin-top: auto; background: linear-gradient(180deg, rgba(0,0,0,0) 82.5%, #D7C5AB 82.5%); }
  .stage { display: block; width: 100%; height: auto; overflow: visible; }
  .stage text { font-family: "Jost", Arial, sans-serif; font-size: 1.7px; font-weight: 600; letter-spacing: .18px; fill: #2F2A24; }
  .floor { background: #D7C5AB; padding: 0 6vmin 5vmin; display: flex; align-items: flex-end; justify-content: space-between; gap: 3vmin; }
  .list { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: auto auto; gap: .8vmin 4vmin; font-size: 1.7vmin; letter-spacing: .06em; color: #3F372F; white-space: nowrap; }
  .list b { font-weight: 600; margin-right: 1vmin; color: #9A4A34; }
  .buy { display: flex; flex-direction: column; align-items: flex-end; gap: 1.4vmin; text-align: right; }
  .price { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 3.4vmin; line-height: 1; white-space: nowrap; }
  .cta { padding: 1.7vmin 3vmin; background: #2F2A24; color: #ECE3D5; font-size: 1.8vmin; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 74vmin); }
    .tagn { top: calc(100% - 74vmin - 6.6vmin); }
    .panel { height: 74vmin; }
    .top { padding-top: 4vmin; }
    h1 { font-size: 10vmin; }
    .stage { width: 88%; }
    .floor { padding-bottom: 4.4vmin; }
  }
  /* ── 3:4 / 4:5 → still life left, photo right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { left: auto; right: 0; width: 48%; height: 100%; object-position: 50% 22%; }
    .tagn { top: auto; bottom: 4.4vmin; right: 4.4vmin; }
    .panel { left: 0; right: 48%; top: 0; height: auto; }
    .top { padding: 6vmin 5vmin 0 5.4vmin; }
    .kick span:last-child { display: none; }
    h1 { font-size: 9.4vmin; margin-top: 3vmin; }
    .stage { width: 100%; }
    .floor { flex: none; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 3vmin; padding: 3vmin 5vmin 5.4vmin 5.4vmin; }
    .list { grid-template-columns: auto; }
    .buy { align-items: flex-start; text-align: left; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; }
    .panel { right: 46%; }
    .top { padding: 5vmin 4.6vmin 0 5vmin; }
    h1 { font-size: 8.4vmin; margin-top: 2.4vmin; }
    .stagewrap { margin-top: auto; }
    .floor { flex: none; padding: 2.4vmin 4.6vmin 5vmin 5vmin; gap: 2.2vmin; }
    .list { grid-template-columns: auto auto; gap: .6vmin 3vmin; font-size: 1.6vmin; }
    .buy { flex-direction: row; align-items: center; gap: 2.4vmin; }
    .price { font-size: 3vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; object-position: 70% 30%; }
    .panel { right: 46%; }
    .top { padding: 6vmin 6vmin 0 6.4vmin; }
    .kick span:last-child { display: inline; }
    h1 { font-size: 10.6vmin; margin-top: 2.6vmin; }
    .stage { width: 94%; }
    .floor { flex-direction: row; align-items: flex-end; justify-content: space-between; padding: 2.4vmin 6vmin 6vmin 6.4vmin; }
    .list { font-size: 1.7vmin; }
    .buy { flex-direction: column; align-items: flex-end; text-align: right; gap: 1.6vmin; }
  }

  /* ───────── motion (8 s loop · t=0 = static design) — a quiet studio afternoon ─────────
     constant: a soft window-light patch drifts across the plaster wall and back · 1.0 s the catalogue is read out:
     index 01 → 02 → 03 → 04 warm to terracotta one after another (the list entry and its number in the drawing
     together), 04 lights the "The look" tag on the photo · 5 s "set." wipes out & back · 6.4 s a glint crosses the CTA */
  .panel::before { content: ""; position: absolute; top: 0; bottom: 18%; left: 0; width: 70%; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,250,240,0) 20%, rgba(255,250,240,.55) 45%, rgba(255,250,240,.55) 60%, rgba(255,250,240,0) 85%);
    transform: translateX(-20%) skewX(-14deg); opacity: .5; animation: sun 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sun { 0%, 100% { transform: translateX(-20%) skewX(-14deg); opacity: .5; } 50% { transform: translateX(60%) skewX(-8deg); opacity: .85; } }
  .top, .stagewrap, .floor { position: relative; z-index: 1; }
  @keyframes li1 { 0%, 12.5%, 27.5%, 100% { color: #3F372F; transform: translateX(0); } 15.62%, 23.12% { color: #9A4A34; transform: translateX(.6vmin); } }
  @keyframes tx1 { 0%, 12.5%, 27.5%, 100% { fill: #2F2A24; } 15.62%, 23.12% { fill: #9A4A34; } }
  .list li:nth-child(1) { animation: li1 8s cubic-bezier(.45,0,.55,1) infinite; }
  .stage text:nth-of-type(1) { animation: tx1 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes li2 { 0%, 22.5%, 37.5%, 100% { color: #3F372F; transform: translateX(0); } 25.62%, 33.12% { color: #9A4A34; transform: translateX(.6vmin); } }
  @keyframes tx2 { 0%, 22.5%, 37.5%, 100% { fill: #2F2A24; } 25.62%, 33.12% { fill: #9A4A34; } }
  .list li:nth-child(2) { animation: li2 8s cubic-bezier(.45,0,.55,1) infinite; }
  .stage text:nth-of-type(2) { animation: tx2 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes li3 { 0%, 32.5%, 47.5%, 100% { color: #3F372F; transform: translateX(0); } 35.62%, 43.12% { color: #9A4A34; transform: translateX(.6vmin); } }
  @keyframes tx3 { 0%, 32.5%, 47.5%, 100% { fill: #2F2A24; } 35.62%, 43.12% { fill: #9A4A34; } }
  .list li:nth-child(3) { animation: li3 8s cubic-bezier(.45,0,.55,1) infinite; }
  .stage text:nth-of-type(3) { animation: tx3 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes li4 { 0%, 42.5%, 57.5%, 100% { color: #3F372F; transform: translateX(0); } 45.62%, 53.12% { color: #9A4A34; transform: translateX(.6vmin); } }
  @keyframes tx4 { 0%, 42.5%, 57.5%, 100% { fill: #2F2A24; } 45.62%, 53.12% { fill: #9A4A34; } }
  .list li:nth-child(4) { animation: li4 8s cubic-bezier(.45,0,.55,1) infinite; }
  .tagn { animation: tag 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes tag { 0%, 42.5%, 57.5%, 100% { background: #ECE3D5; color: #2F2A24; } 45.62%, 53.12% { background: #9A4A34; color: #F6EEE2; } }
  .list li { display: block; }

  h1 i { display: inline-block; animation: wipe 8s cubic-bezier(.7,0,.2,1) infinite; }
  @keyframes wipe {
    0%, 62%, 100% { clip-path: inset(-12% -10% -20% 0); transform: translateX(0); }
    66% { clip-path: inset(-12% 110% -20% 0); transform: translateX(0); }
    67% { clip-path: inset(-12% -10% -20% 100%); transform: translateX(-1.4vmin); }
    74% { clip-path: inset(-12% -10% -20% 0); transform: translateX(0); }
  }
  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(236,227,213,.35) 50%, transparent 80%);
    transform: translateX(-120%); animation: glint 8s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes glint { 0%, 80%, 100% { transform: translateX(-120%); } 92% { transform: translateX(330%); } 92.1% { transform: translateX(-120%); } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="tagn">04 — The look</div>
  <div class="panel">
    <div class="top">
      <div class="kick"><span>Studio still life</span><span>Practice collection</span></div>
      <h1>The practice<br><i>set.</i></h1>
    </div>
    <div class="stagewrap">
      <svg class="stage" viewBox="0 0 100 40" aria-hidden="true">
        <defs>
          <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6BAA2"/><stop offset=".45" stop-color="#8CA289"/><stop offset="1" stop-color="#627A60"/></linearGradient>
          <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5A4632" stop-opacity=".34"/><stop offset=".6" stop-color="#5A4632" stop-opacity=".12"/><stop offset="1" stop-color="#5A4632" stop-opacity="0"/></radialGradient>
          <pattern id="cork" width="1.6" height="1.6" patternUnits="userSpaceOnUse"><rect width="1.6" height="1.6" fill="#C9A174"/><circle cx=".35" cy=".4" r=".18" fill="#9C7449"/><circle cx="1.15" cy="1.1" r=".13" fill="#E0BE92"/><circle cx="1.2" cy=".3" r=".09" fill="#8A6440"/><circle cx=".5" cy="1.3" r=".1" fill="#B38a5E"/></pattern>
        </defs>
        <!-- contact shadows -->
        <ellipse cx="30" cy="36.3" rx="27" ry="1.6" fill="url(#sh)"/>
        <ellipse cx="68" cy="36.2" rx="10" ry="1.4" fill="url(#sh)"/>
        <ellipse cx="88" cy="34.6" rx="10" ry="2.2" fill="url(#sh)"/>
        <!-- rolled mat -->
        <path d="M8 21.6 H50 A3.2 7.2 0 0 1 50 36 H8 A3.2 7.2 0 0 1 8 21.6 Z" fill="url(#mat)"/>
        <path d="M8 21.6 H50" stroke="#C3D2BF" stroke-width=".35"/>
        <ellipse cx="50" cy="28.8" rx="3.2" ry="7.2" fill="#B4C5AF"/>
        <ellipse cx="50.1" cy="28.9" rx="2.35" ry="5.4" fill="none" stroke="#7F977C" stroke-width=".3"/>
        <ellipse cx="50.2" cy="29" rx="1.55" ry="3.6" fill="none" stroke="#7F977C" stroke-width=".3"/>
        <ellipse cx="50.25" cy="29.1" rx=".8" ry="1.9" fill="#6E866B"/>
        <!-- cork block, standing -->
        <path d="M60 13.4 L63.4 10.8 H77.4 L74 13.4 Z" fill="#DDBB90"/>
        <path d="M74 13.4 L77.4 10.8 V33.4 L74 36 Z" fill="#A98056"/>
        <rect x="60" y="13.4" width="14" height="22.6" fill="url(#cork)"/>
        <!-- coiled strap with D-ring -->
        <ellipse cx="88.5" cy="33" rx="8" ry="2.6" fill="none" stroke="#C9644A" stroke-width="1.5"/>
        <ellipse cx="88.3" cy="32.4" rx="5.6" ry="1.7" fill="none" stroke="#D97B5F" stroke-width="1.4"/>
        <path d="M80.6 33.4 Q78 35.6 74.8 36.2" fill="none" stroke="#C9644A" stroke-width="1.4" stroke-linecap="round"/>
        <ellipse cx="94.4" cy="31.2" rx="1.3" ry="1.7" fill="none" stroke="#8C8C88" stroke-width=".45"/>
        <!-- index numbers -->
        <text x="8" y="19.4">01</text>
        <text x="60" y="8.8">02</text>
        <text x="82.4" y="27.8">03</text>
        <line x1="8" y1="20" x2="11.6" y2="20" stroke="#2F2A24" stroke-width=".18"/>
        <line x1="60" y1="9.4" x2="63.6" y2="9.4" stroke="#2F2A24" stroke-width=".18"/>
        <line x1="82.4" y1="28.4" x2="86" y2="28.4" stroke="#2F2A24" stroke-width=".18"/>
      </svg>
    </div>
    <div class="floor">
      <ul class="list">
        <li><b>01</b>Mat — natural rubber</li>
        <li><b>02</b>Block — cork</li>
        <li><b>03</b>Strap — cotton</li>
        <li><b>04</b>The look — new in</li>
      </ul>
      <div class="buy"><span class="price">The set from $64</span><span class="cta">Shop the set</span></div>
    </div>
  </div>
</div>
</body>
</html>
