<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Witness Cones — three pyrometric cones set in a clay pat on the kiln shelf, seen through the spy-hole glow:
     the first still standing, the second bending, the third bent flat. Each cone is a sale day; the hotter the
     kiln, the deeper the cut. tall → photo above, kiln shelf below · 3:4 and wider → photo left, kiln on the right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EFE6D8; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #2A211B; font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; background: #EFE6D8; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 84vmin); object-fit: cover; object-position: 50% 20%; display: block; }
  .kiln { position: absolute; left: 0; right: 0; bottom: 0; height: 84vmin; box-sizing: border-box; padding: 5vmin 6vmin 5vmin; display: flex; flex-direction: column;
    background: radial-gradient(70% 55% at 50% 64%, #F7D9AE 0%, #F3E1C6 45%, #EFE6D8 80%); }

  .k { display: flex; justify-content: space-between; gap: 2vmin; font-family: "JetBrains Mono", Menlo, monospace; font-size: 1.7vmin; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .k b { font-weight: 600; color: #B8502A; }
  h1 { margin: 2.6vmin 0 0; font-weight: 800; font-size: 11.6vmin; line-height: .9; letter-spacing: -.045em; }
  h1 span { font-weight: 400; color: #B8502A; }
  h1 .br { display: none; }

  /* one cone per sale day, all standing on the same kiln shelf */
  .scene { position: relative; flex: 1; min-height: 0; margin: 2vmin -6vmin 0; padding: 0 6vmin; display: grid; grid-template-columns: repeat(3, 1fr);
    border-bottom: 3.4vmin solid #CCC1B0; border-image: linear-gradient(180deg, #DDD3C4, #BDB09E) 1; }
  .scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3.4vmin; height: 3.4vmin; background: radial-gradient(circle, rgba(110,90,70,.35) 0 .18vmin, transparent .3vmin) 0 0 / 1.3vmin 1.1vmin; }
  .c { position: relative; min-height: 0; }
  .c svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; max-height: 40vmin; filter: drop-shadow(.4vmin .3vmin .4vmin rgba(90,60,30,.18)); }

  .days { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 2.8vmin; }
  .day { padding-left: 1.6vmin; border-left: 1px solid rgba(42,33,27,.35); }
  .days { margin-top: 2.4vmin; }
  .day small { display: block; font-family: "JetBrains Mono", Menlo, monospace; font-size: 1.6vmin; letter-spacing: .1em; text-transform: uppercase; color: #5E534A; white-space: nowrap; }
  .day b { display: block; margin-top: .6vmin; font-weight: 800; font-size: 7.4vmin; line-height: .95; letter-spacing: -.04em; white-space: nowrap; }
  .day:last-child b { color: #B8502A; }

  .foot { flex: none; margin-top: 3vmin; display: flex; justify-content: space-between; align-items: center; gap: 3vmin; white-space: nowrap; }
  .foot p { margin: 0; font-family: "JetBrains Mono", Menlo, monospace; font-size: 1.7vmin; letter-spacing: .06em; color: #5E534A; }
  .cta { font-weight: 600; font-size: 2.6vmin; padding: 1.2vmin 2.6vmin; border-radius: 99vmin; background: #2A211B; color: #F6EDDF; }

  /* ── 3:4 / 4:5 → photo left, kiln right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 22%; }
    .kiln { left: 50%; top: 0; height: auto; padding: 6vmin 4.6vmin 5vmin; }
    .scene { margin: 2vmin -4.6vmin 0; padding: 0 4.6vmin; }
    .k { flex-direction: column; gap: .8vmin; }
    h1 { font-size: 9.4vmin; margin-top: 3vmin; }
    h1 .br { display: inline; }
    .day { padding-left: 1.2vmin; }
    .day small { font-size: 1.6vmin; letter-spacing: .04em; }
    .day b { font-size: 5.2vmin; }
    .foot { flex-direction: column; align-items: flex-start; gap: 2.2vmin; }
  }
  /* ── square ── */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 48%; }
    .kiln { left: 48%; padding: 5vmin 4.6vmin 4.6vmin; }
    .k { flex-direction: row; }
    .k span:last-child { display: none; }
    h1 { font-size: 8.4vmin; margin-top: 2.4vmin; }
    .day b { font-size: 4.9vmin; }
    .day small span { display: none; }
    .foot { flex-direction: row; align-items: center; margin-top: 2.6vmin; }
    .foot p { display: none; }
    .cta { font-size: 2.2vmin; padding: 1vmin 2.2vmin; }
  }
  /* ── wide ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; object-position: 72% 30%; }
    .kiln { left: 44%; padding: 5.6vmin 6vmin 5vmin; }
    .scene { margin: 2vmin -6vmin 0; padding: 0 6vmin; }
    .k span:last-child { display: inline; }
    h1 { font-size: 9.6vmin; }
    .day { padding-left: 1.8vmin; }
    .day b { font-size: 7vmin; }
    .day small span { display: inline; }
    .foot p { display: block; font-size: 1.7vmin; letter-spacing: .06em; }
    .cta { font-size: 2.4vmin; padding: 1.2vmin 2.6vmin; }
  }

  /* ───────── motion (6s loop · t=0 = static design) ─────────
     constant: embers drift up out of the kiln; the spy-hole glow swells and cools over the loop
     1.3s  a heat wave rolls across the shelf left→right: each cone flushes orange and softens (leans a touch further),
           its day's discount flushes kiln-hot in turn (0.5s apart) · 3.1s "hotter." flares · 4.4s CTA glows like a coal */
  .kiln::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 45% at 50% 66%, rgba(255,170,95,.55) 0%, rgba(255,190,120,.22) 45%, transparent 80%);
    opacity: 0; animation: swell 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes swell { 0%, 12% { opacity: 0; } 50% { opacity: 1; } 88%, 100% { opacity: 0; } }
  .kiln > * { position: relative; }
  .scene::before { content: ""; position: absolute; inset: 0 6vmin; pointer-events: none;
    background:
      radial-gradient(circle, rgba(236,120,50,.8) 0 .22vmin, rgba(255,160,80,.3) .4vmin, transparent .6vmin) 1vmin 0 / 7vmin 9vmin,
      radial-gradient(circle, rgba(250,150,70,.7) 0 .16vmin, rgba(255,170,90,.25) .32vmin, transparent .5vmin) 4.4vmin 3vmin / 11vmin 11vmin;
    -webkit-mask-image: linear-gradient(0deg, transparent 0%, #000 30%, #000 55%, transparent 100%);
            mask-image: linear-gradient(0deg, transparent 0%, #000 30%, #000 55%, transparent 100%);
    opacity: .75; animation: embers 6s linear infinite; }
  @keyframes embers { from { background-position: 1vmin 0, 4.4vmin 3vmin; } to { background-position: 1vmin -18vmin, 4.4vmin -19vmin; } }

  .c svg { transform-origin: 50% 100%; animation: soften 6s linear infinite; }
  .c:nth-child(2) svg { animation-delay: -5.5s; }
  .c:nth-child(3) svg { animation-delay: -5s; }
  @keyframes soften {
    0%, 21% { transform: skewX(0deg); filter: drop-shadow(.4vmin .3vmin .4vmin rgba(90,60,30,.18)) brightness(1); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    29% { transform: skewX(-3.5deg); filter: drop-shadow(0 0 1.6vmin rgba(240,120,50,.55)) brightness(1.06); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    38% { transform: skewX(-2deg); filter: drop-shadow(0 0 1vmin rgba(240,120,50,.35)) brightness(1.03); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    62%, 100% { transform: skewX(0deg); filter: drop-shadow(.4vmin .3vmin .4vmin rgba(90,60,30,.18)) brightness(1); }
  }
  .day b { transform-origin: 0 80%; animation: flush 6s linear infinite; }
  .day:nth-child(2) b { animation-delay: -5.5s; }
  .day:nth-child(3) b { animation-delay: -5s; }
  @keyframes flush {
    0%, 24% { color: #2A211B; text-shadow: 0 0 0 rgba(240,110,40,0); transform: scale(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    29% { color: #D0582A; text-shadow: 0 0 2vmin rgba(240,110,40,.55); transform: scale(1.06); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    42% { color: #C2542B; text-shadow: 0 0 1vmin rgba(240,110,40,.25); transform: scale(1); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    62%, 100% { color: #2A211B; text-shadow: 0 0 0 rgba(240,110,40,0); transform: scale(1); }
  }
  .day:last-child b { animation-name: flush-hot; }
  @keyframes flush-hot {
    0%, 24% { color: #B8502A; text-shadow: 0 0 0 rgba(240,110,40,0); transform: scale(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    29% { color: #E0602A; text-shadow: 0 0 2.4vmin rgba(245,110,40,.7); transform: scale(1.1); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    42% { color: #CC5A2B; text-shadow: 0 0 1.2vmin rgba(240,110,40,.35); transform: scale(1); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    62%, 100% { color: #B8502A; text-shadow: 0 0 0 rgba(240,110,40,0); transform: scale(1); }
  }
  h1 span { display: inline-block; animation: flare 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes flare {
    0%, 46% { color: #B8502A; text-shadow: 0 0 0 rgba(255,120,40,0), 0 0 0 rgba(255,170,90,0); }
    56% { color: #DE5E26; text-shadow: 0 0 1.4vmin rgba(255,120,40,.55), 0 0 4vmin rgba(255,170,90,.45); }
    74%, 100% { color: #B8502A; text-shadow: 0 0 0 rgba(255,120,40,0), 0 0 0 rgba(255,170,90,0); }
  }
  .cta { animation: coal 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes coal {
    0%, 68% { box-shadow: 0 0 0 0 rgba(222,94,38,0), 0 0 0 0 rgba(222,94,38,0); }
    76% { box-shadow: 0 0 0 .5vmin rgba(222,94,38,.55), 0 0 3vmin .4vmin rgba(240,120,50,.5); }
    92%, 100% { box-shadow: 0 0 0 0 rgba(222,94,38,0), 0 0 0 0 rgba(222,94,38,0); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="kiln">
    <div class="k"><span>Kiln sale · <b>3 days</b></span><span>Witness cones 04 / 6 / 10</span></div>
    <h1>Getting<br class="br"> <span>hotter.</span></h1>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F2E7"/><stop offset=".6" stop-color="#E9DDCB"/><stop offset="1" stop-color="#CDBDA6"/></linearGradient>
      <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAE6CB"/><stop offset=".6" stop-color="#F1CFA4"/><stop offset="1" stop-color="#DDAE80"/></linearGradient>
      <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBDDB6"/><stop offset=".6" stop-color="#EFB783"/><stop offset="1" stop-color="#D38E5C"/></linearGradient>
      <radialGradient id="pat" cx=".45" cy=".2" r=".9"><stop offset="0" stop-color="#D8C3A6"/><stop offset="1" stop-color="#B39777"/></radialGradient>
    </defs></svg>
    <div class="scene">
      <div class="c"><svg viewBox="0 0 100 124" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M57.0 114.6 L56.5 111.0 L56.3 107.4 L56.0 103.7 L55.8 100.1 L55.7 96.5 L55.5 92.9 L55.3 89.3 L55.2 85.7 L55.1 82.0 L55.0 78.4 L54.9 74.8 L54.8 71.2 L54.7 67.6 L54.6 64.0 L54.6 60.3 L54.5 56.7 L54.4 53.1 L54.4 49.5 L54.3 45.9 L54.3 42.3 L54.2 38.6 L54.2 35.0 L54.2 31.4 L54.2 27.8 L54.1 24.2 L54.1 20.6 L54.1 16.9 L54.1 13.3 L54.1 9.7 L54.1 6.1 L51.9 5.9 L51.4 9.5 L50.8 13.1 L50.3 16.7 L49.8 20.2 L49.3 23.8 L48.7 27.4 L48.2 31.0 L47.7 34.6 L47.1 38.2 L46.6 41.7 L46.1 45.3 L45.5 48.9 L45.0 52.5 L44.5 56.1 L43.9 59.7 L43.4 63.2 L42.9 66.8 L42.3 70.4 L41.8 74.0 L41.2 77.6 L40.7 81.2 L40.1 84.7 L39.6 88.3 L39.0 91.9 L38.4 95.5 L37.8 99.1 L37.2 102.7 L36.6 106.2 L35.9 109.8 L35.0 113.4 Z" fill="url(#cone)" stroke="#A08A70" stroke-width=".8" stroke-linejoin="round"/><text x="50" y="104" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#8C7A64">04</text><path d="M8 124 C8 116 22 111 50 111 C78 111 92 116 92 124 Z" fill="url(#pat)"/></svg></div>
      <div class="c"><svg viewBox="0 0 100 124" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M55.0 113.7 L54.3 108.5 L53.8 103.5 L53.6 98.7 L53.4 94.1 L53.4 89.8 L53.5 85.7 L53.8 81.8 L54.2 78.2 L54.6 74.8 L55.2 71.7 L55.9 68.8 L56.7 66.1 L57.6 63.6 L58.6 61.3 L59.7 59.3 L60.9 57.4 L62.2 55.7 L63.6 54.2 L65.2 52.9 L66.9 51.8 L68.7 50.8 L70.8 49.9 L73.0 49.3 L75.4 48.9 L78.0 48.7 L80.8 48.7 L83.8 48.9 L86.9 49.4 L90.2 50.1 L93.6 51.0 L94.4 49.0 L91.0 47.5 L87.7 46.2 L84.5 45.2 L81.4 44.4 L78.3 43.8 L75.3 43.4 L72.4 43.4 L69.4 43.5 L66.6 44.0 L63.8 44.7 L61.1 45.7 L58.5 47.0 L56.0 48.6 L53.6 50.6 L51.3 52.7 L49.2 55.2 L47.2 57.9 L45.4 60.8 L43.7 64.0 L42.1 67.4 L40.7 71.1 L39.4 75.0 L38.2 79.1 L37.2 83.4 L36.2 88.0 L35.4 92.8 L34.7 97.8 L34.1 103.1 L33.6 108.5 L33.0 114.3 Z" fill="url(#warm)" stroke="#A08A70" stroke-width=".8" stroke-linejoin="round"/><text x="46" y="104" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#8C7A64">6</text><path d="M8 124 C8 116 22 111 50 111 C78 111 92 116 92 124 Z" fill="url(#pat)"/></svg></div>
      <div class="c"><svg viewBox="0 0 100 124" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M47.0 113.8 L46.3 108.2 L45.9 103.1 L45.6 98.3 L45.6 94.0 L45.6 90.1 L45.8 86.7 L46.1 83.7 L46.5 81.1 L47.0 79.0 L47.4 77.4 L47.9 76.1 L48.3 75.3 L48.6 74.7 L49.0 74.2 L49.7 73.8 L50.7 73.6 L52.2 73.6 L54.0 74.1 L56.2 74.9 L58.6 76.2 L61.3 77.9 L64.2 80.1 L67.2 82.7 L70.5 85.7 L73.9 89.2 L77.4 93.1 L81.1 97.3 L85.0 102.0 L89.0 107.1 L93.1 112.6 L94.9 111.4 L91.2 105.5 L87.6 100.1 L84.1 95.0 L80.8 90.3 L77.6 86.0 L74.5 82.1 L71.5 78.5 L68.6 75.3 L65.9 72.5 L63.2 70.0 L60.5 67.9 L57.8 66.1 L55.1 64.7 L52.3 63.7 L49.3 63.2 L46.2 63.3 L43.2 64.2 L40.3 65.7 L37.8 67.7 L35.7 70.2 L33.8 73.0 L32.2 76.2 L30.8 79.7 L29.6 83.6 L28.5 87.8 L27.6 92.3 L26.8 97.2 L26.1 102.5 L25.6 108.2 L25.0 114.2 Z" fill="url(#hot)" stroke="#A08A70" stroke-width=".8" stroke-linejoin="round"/><text x="40" y="104" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" fill="#8C7A64">10</text><path d="M8 124 C8 116 22 111 50 111 C78 111 92 116 92 124 Z" fill="url(#pat)"/></svg></div>
    </div>
    <div class="days">
      <div class="day"><small>Mon<span> · cone 04</span></small><b>−20%</b></div>
      <div class="day"><small>Wed<span> · cone 6</span></small><b>−30%</b></div>
      <div class="day"><small>Fri<span> · cone 10</span></small><b>−40%</b></div>
    </div>
    <div class="foot">
      <p>The deeper the heat, the deeper the cut.</p>
      <div class="cta">Shop the sale</div>
    </div>
  </div>
</div>
</body>
</html>
