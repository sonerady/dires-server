<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Scandi Block — oat paper, one moss colour block, one grotesk. Nordic, practical, calm.
     tall → photo on top, the block anchors the lower-left corner; square/wide → photo right, block fills the lower half of the left column */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ECE6DC; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #ECE6DC; color: #2C2B26; font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 64%; object-fit: cover; object-position: 50% 16%; }
  .block { position: absolute; left: 0; bottom: 0; width: 62%; height: 36%; background: #5D6A4F; color: #ECE6DC; box-sizing: border-box; padding: 6vmin 6vmin 6.4vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .block .k { font-size: 1.9vmin; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
  h1 { margin: 0; font-weight: 700; font-size: 10vmin; line-height: .88; letter-spacing: -.045em; }
  .side { position: absolute; left: 62%; right: 0; bottom: 0; height: 36%; box-sizing: border-box; padding: 6vmin 5vmin 6.4vmin 5vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font-size: 2.6vmin; font-weight: 700; letter-spacing: -.01em; }
  .brand span { display: block; font-weight: 400; font-size: 2vmin; color: #6B665C; margin-top: .6vmin; letter-spacing: 0; }
  .off { font-weight: 700; font-size: 9.6vmin; line-height: .9; letter-spacing: -.05em; color: #5D6A4F; }
  .off small { display: block; font-weight: 500; font-size: 2.1vmin; letter-spacing: .02em; color: #2C2B26; margin-top: 1vmin; }
  .code { font-size: 2vmin; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
  .code b { display: inline-block; margin-top: .8vmin; padding: .7vmin 1.2vmin; border: 1px solid #2C2B26; letter-spacing: .16em; font-weight: 700; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: 60%; }
    .block, .side { height: 40%; }
    h1 { font-size: 9.4vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; width: 55%; height: 100%; object-position: 50% 25%; }
    .block { width: 45%; height: 54%; padding: 5.4vmin; }
    h1 { font-size: 7.2vmin; }
    .side { left: 0; right: auto; top: 0; bottom: auto; width: 45%; height: 46%; padding: 5.4vmin 5.4vmin 4vmin; }
    .off { font-size: 12vmin; }
    .off small { font-size: 2.2vmin; margin-top: 1.4vmin; }
    .brand { font-size: 2.8vmin; }
    .brand span { font-size: 2vmin; }
    .code { font-size: 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 56%; object-position: 58% 25%; }
    .block { width: 44%; }
    .side { width: 44%; }
    h1 { font-size: 9vmin; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design — calm, practical ───────── */
  .photo { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  /* the headline lines slide up out of their slots and back in, one after the other */
  h1 .ln { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
  h1 .ln > span { display: inline-block; animation: lineA 6s linear infinite; }
  h1 .ln + br + .ln > span { animation-name: lineB; }
  @keyframes lineA {
    0%, 26% { transform: translateY(0); animation-timing-function: cubic-bezier(.7,0,.84,0); }
    31% { transform: translateY(-105%); animation-timing-function: steps(1, end); }
    32% { transform: translateY(105%); animation-timing-function: linear; }
    35% { transform: translateY(105%); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    46%, 100% { transform: translateY(0); }
  }
  @keyframes lineB {
    0%, 28% { transform: translateY(0); animation-timing-function: cubic-bezier(.7,0,.84,0); }
    33% { transform: translateY(-105%); animation-timing-function: steps(1, end); }
    34% { transform: translateY(105%); animation-timing-function: linear; }
    38% { transform: translateY(105%); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    50%, 100% { transform: translateY(0); }
  }
  /* the offer slides up out of its slot and punches back in */
  .off .pct { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .3em .12em 0; margin: -.14em -.3em -.12em 0; }
  .off .pct > span { display: inline-block; transform-origin: 0 100%; animation: offer 6s linear infinite; }
  @keyframes offer {
    0%, 52% { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(.7,0,.84,0); }
    56% { transform: translateY(-135%) scale(1); animation-timing-function: steps(1, end); }
    57% { transform: translateY(135%) scale(1); animation-timing-function: cubic-bezier(.16,1,.3,1); }
    64% { transform: translateY(0) scale(1.08); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    70%, 100% { transform: translateY(0) scale(1); }
  }
  .off small { animation: under 6s linear infinite; }
  @keyframes under { 0%, 55% { opacity: 1; } 58% { opacity: .35; } 70%, 100% { opacity: 1; } }
  /* the code box fills with ink from below, then drains */
  .code b { background: linear-gradient(#2C2B26, #2C2B26) 0 100% / 100% 0% no-repeat; animation: ink 6s linear infinite; }
  @keyframes ink {
    0%, 76% { background-size: 100% 0%; background-position: 0 100%; color: #2C2B26; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    82% { background-size: 100% 100%; background-position: 0 100%; color: #ECE6DC; animation-timing-function: steps(1, end); }
    88% { background-size: 100% 100%; background-position: 0 0; color: #ECE6DC; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    95%, 100% { background-size: 100% 0%; background-position: 0 0; color: #2C2B26; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="block">
    <div class="k">Autumn / Winter 26</div>
    <h1><span class="ln"><span>slow</span></span><br><span class="ln"><span>wardrobe.</span></span></h1>
  </div>
  <div class="side">
    <div class="brand">Atelier Nord<span>Made to be worn for years</span></div>
    <div class="off"><span class="pct"><span>−20%</span></span><small>on the new collection</small></div>
    <div class="code">Code <b>NORD20</b></div>
  </div>
</div>
</body>
</html>
