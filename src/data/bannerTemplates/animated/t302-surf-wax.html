<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Surf Wax — the offer as a bar of surf wax: a scalloped round label with curved lettering and a Shrikhand
     "Sale" in the middle, the pack's water-temperature grades (cold → tropical) become the discount ladder with
     the tropical box ticked, and the tri-stripe of the wrapper runs along the seam.
     tall → photo above, label + grades below · square → photo left, label over grade grid · wide → photo left, label beside grades */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FFF1DA; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #FFF1DA; color: #1C2A5A; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 80vmin); object-fit: cover; object-position: 50% 20%; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 80vmin; }
  .stripe { position: absolute; left: 0; right: 0; top: 0; height: 2.4vmin; background: linear-gradient(180deg, #EE5A87 0 33.3%, #FFF1DA 33.3% 44%, #F6B53C 44% 66.6%, #FFF1DA 66.6% 77%, #2E9CC4 77%); }
  .label { position: absolute; left: 4vmin; top: 7vmin; width: 56vmin; height: 56vmin; transform: rotate(-8deg); filter: drop-shadow(0 .8vmin 1vmin rgba(28,42,90,.22)); }
  .label svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .label text { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; }
  .label .script { font-family: "Shrikhand", Georgia, serif; font-weight: 400; }

  .grades { position: absolute; left: 63vmin; right: 5vmin; top: 7vmin; }
  .grades h3 { margin: 0 0 1.4vmin; font-size: 2.2vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .grades ul { margin: 0; padding: 0; list-style: none; }
  .grades li { display: grid; grid-template-columns: 3vmin 1fr auto; align-items: center; column-gap: 1.6vmin; padding: 1.3vmin 0; border-top: .3vmin solid #1C2A5A; }
  .grades li:last-child { border-bottom: .3vmin solid #1C2A5A; }
  .grades i { width: 3vmin; height: 3vmin; border: .3vmin solid #1C2A5A; box-sizing: border-box; position: relative; }
  .grades li.on i::after { content: ""; position: absolute; left: .5vmin; top: -.9vmin; width: 1.2vmin; height: 2.4vmin; border: solid #EE5A87; border-width: 0 .6vmin .6vmin 0; transform: rotate(40deg); }
  .grades .n { display: flex; flex-direction: column; line-height: 1; }
  .grades .n b { font-size: 3vmin; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .grades .n small { font-size: 1.7vmin; font-weight: 500; letter-spacing: .08em; margin-top: .4vmin; opacity: .8; white-space: nowrap; }
  .grades .p { font-size: 3.6vmin; font-weight: 700; }
  .grades li.on .p { color: #EE5A87; }
  .c1 b { color: #2E9CC4; } .c2 b { color: #3E9E6B; } .c3 b { color: #E08A1E; } .c4 b { color: #EE5A87; }

  .foot { position: absolute; left: 6vmin; right: 5vmin; bottom: 5vmin; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; }
  .foot .tag { font-family: "Shrikhand", Georgia, serif; font-size: 4.4vmin; line-height: 1; white-space: nowrap; }
  .foot .cta { display: flex; align-items: center; gap: 1.6vmin; padding: 1.6vmin 3vmin; background: #1C2A5A; color: #FFF1DA; border-radius: 99vmin; font-size: 2.5vmin; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .foot .cta span { color: #F6B53C; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 72vmin); }
    .panel { height: 72vmin; }
    .label { top: 5.5vmin; width: 50vmin; height: 50vmin; left: 5vmin; }
    .grades { left: 60vmin; top: 5.5vmin; }
    .grades li { padding: 1vmin 0; }
    .foot { bottom: 4vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 62vmin); }
    .panel { height: 62vmin; }
    .label { top: 4.5vmin; width: 42vmin; height: 42vmin; left: 6vmin; }
    .grades { left: 55vmin; top: 4.5vmin; }
    .grades h3 { font-size: 1.9vmin; margin-bottom: 1vmin; }
    .grades li { padding: .7vmin 0; }
    .grades .n b { font-size: 2.6vmin; }
    .grades .p { font-size: 3vmin; }
    .foot { bottom: 3.5vmin; }
    .foot .tag { font-size: 3.8vmin; }
    .foot .cta { padding: 1.3vmin 2.6vmin; font-size: 2.2vmin; }
  }
  /* square → photo left, label over a 2×2 grade grid */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .panel { left: 50%; top: 0; height: auto; }
    .stripe { top: 0; bottom: 0; left: 0; right: auto; width: 2vmin; height: auto; background: linear-gradient(90deg, #EE5A87 0 33.3%, #FFF1DA 33.3% 44%, #F6B53C 44% 66.6%, #FFF1DA 66.6% 77%, #2E9CC4 77%); }
    .label { left: 50%; top: 5vmin; width: 40vmin; height: 40vmin; margin-left: -19vmin; }
    .grades { left: 6vmin; right: 4vmin; top: 50vmin; }
    .grades h3 { display: none; }
    .grades li { padding: .8vmin 0; column-gap: 1.4vmin; grid-template-columns: 2.6vmin 1fr auto; }
    .grades i { width: 2.6vmin; height: 2.6vmin; }
    .grades .n b { font-size: 2.4vmin; }
    .grades .n small { font-size: 1.6vmin; }
    .grades .p { font-size: 2.8vmin; }
    .foot { left: 6vmin; right: 4vmin; bottom: 5vmin; }
    .foot .tag { font-size: 3.4vmin; }
    .foot .cta { padding: 1.2vmin 2.2vmin; font-size: 1.9vmin; }
  }
  /* wide → photo left, label beside the grade list */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .panel { left: 46%; }
    .label { left: 5vmin; top: 10vmin; width: 45vmin; height: 45vmin; margin-left: 0; }
    .grades { left: 54vmin; right: 5vmin; top: 10vmin; }
    .grades h3 { display: block; font-size: 1.9vmin; }
    .grades li { padding: 1.1vmin 0; }
    .foot { left: 8vmin; right: 6vmin; bottom: 7vmin; }
    .foot .tag { font-size: 4.6vmin; }
    .foot .cta { padding: 1.6vmin 3vmin; font-size: 2.3vmin; }
  }

  /* ───────── motion (6s loop) ─────────
     constant: the wax label is "rubbed in" — small circular strokes with a gentle rock (3s) ·
     beats: 1.8s the water grades heat up one by one (cold → tropical, discounts pop) → 3.0s the tropical tick is re-drawn ·
     4.2s a gloss runs along the wrapper stripe · 5.0s the CTA arrow paddles twice */
  .label { animation: rub 3s linear infinite; }
  @keyframes rub {
    0%, 100% { transform: rotate(-8deg) translate(0, 0); }
    25% { transform: rotate(-6.5deg) translate(.7vmin, -.5vmin); }
    50% { transform: rotate(-8deg) translate(0, -1vmin); }
    75% { transform: rotate(-9.5deg) translate(-.7vmin, -.5vmin); }
  }
  .grades li .p { display: inline-block; transform-origin: 100% 60%; animation: heat 6s linear infinite; }
  .grades li.c1 .p { animation-delay: -.75s; }
  .grades li.c2 .p { animation-delay: -.5s; }
  .grades li.c3 .p { animation-delay: -.25s; }
  .grades li.c4 .p { animation-delay: 0s; }
  @keyframes heat {
    0%, 42% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.9,.3,1.3); }
    46% { transform: scale(1.22) rotate(-4deg); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    52%, 100% { transform: scale(1) rotate(0); }
  }
  .grades li.on i::after { animation: tick 6s linear infinite; }
  @keyframes tick {
    0%, 52% { clip-path: inset(-20% -20% -20% -20%); animation-timing-function: steps(1, end); }
    53% { clip-path: inset(-20% 120% -20% -20%); animation-timing-function: cubic-bezier(.5,0,.3,1); }
    61%, 100% { clip-path: inset(-20% -20% -20% -20%); }
  }
  .grades li.on i { animation: box 6s linear infinite; }
  @keyframes box { 0%, 52% { transform: scale(1); } 54% { transform: scale(.85); animation-timing-function: cubic-bezier(.2,.9,.3,1.3); } 60%, 100% { transform: scale(1); } }

  .stripe { overflow: hidden; }
  .stripe::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 30%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.7) 50%, rgba(255,255,255,0));
    transform: translateX(-110%); animation: gloss 6s linear infinite; }
  @keyframes gloss { 0%, 70% { transform: translateX(-110%); animation-timing-function: cubic-bezier(.45,0,.3,1); } 86%, 100% { transform: translateX(360%); } }
  .foot .cta span { display: inline-block; animation: nudge 6s linear infinite; }
  @keyframes nudge { 0%, 83% { transform: translateX(0); } 85.5% { transform: translateX(.9vmin); } 88% { transform: translateX(0); } 90.5% { transform: translateX(.9vmin); } 93%, 100% { transform: translateX(0); } }

  @media (min-aspect-ratio: 9/10) {
    .stripe::after { left: 0; right: 0; top: 0; bottom: auto; width: auto; height: 30%; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.7) 50%, rgba(255,255,255,0)); transform: translateY(-110%); animation-name: glossV; }
    @keyframes glossV { 0%, 70% { transform: translateY(-110%); animation-timing-function: cubic-bezier(.45,0,.3,1); } 86%, 100% { transform: translateY(360%); } }
  }
</style>
</head>

    </div>
    <div class="grades">
      <h3>Pick your water</h3>
      <ul>
        <li class="c1"><i></i><span class="n"><b>Cold</b><small>New arrivals</small></span><span class="p">−20%</span></li>

</div>
</body>
</html>
