<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Reeded Glass — a shop partition of fluted glass beside the clear pane: the same photo seen through vertical
     reeds (blurred, washed warm, each rib catching a highlight and a shadow), a brushed-brass mullion at the join,
     and the sharp photo in the clear pane. The copy sits on a bone-coloured plate fixed to the reeds; tall condensed
     type echoes the flutes. tall → clear pane above, reeded pane below · 3:4 → reeds left, photo right ·
     square → photo left, reeds right · wide → narrow reeds, photo, reeds with the plate */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #E6DDD0; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #2B241D; font-family: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; background: #E6DDD0; }

  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 66vmin); object-fit: cover; object-position: 50% 22%; display: block; }
  .reed { position: absolute; overflow: hidden; left: 0; right: 0; bottom: 0; height: 66vmin; background: #D9CEBF; }
  .reed img { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%; object-fit: cover; object-position: 50% 70%; filter: blur(1.8vmin) saturate(.85) brightness(1.05); display: block; }
  .reed::before { content: ""; position: absolute; inset: 0; background: rgba(236,226,212,.38); }
  .reed::after { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.34) 0, rgba(255,255,255,.08) .9vmin, rgba(60,40,20,.05) 1.7vmin, rgba(60,40,20,.2) 2.5vmin, rgba(255,255,255,.4) 2.6vmin, rgba(255,255,255,.34) 2.8vmin); }
  .r2 { display: none; }
  .bar { position: absolute; left: 0; right: 0; bottom: 66vmin; height: 1.2vmin; margin-bottom: -.6vmin; z-index: 2;
    background: linear-gradient(180deg, #F4DFA8 0%, #C9A45A 40%, #9C7A36 70%, #D8B874 100%); box-shadow: 0 .4vmin 1vmin rgba(60,40,10,.3); }
  .b2 { display: none; }

  .plate { position: absolute; z-index: 3; left: 7vmin; right: 7vmin; bottom: 7vmin; height: calc(66vmin - 15vmin); box-sizing: border-box; padding: 4vmin 4.4vmin; border-radius: .6vmin;
    background: linear-gradient(160deg, #F5EFE6, #ECE3D6); box-shadow: 0 1.6vmin 4vmin rgba(60,40,20,.22), inset 0 0 0 1px rgba(255,255,255,.7);
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto; column-gap: 4vmin; }
  .screw { position: absolute; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4DFA8, #A5813E 70%); }
  .screw::after { content: ""; position: absolute; left: 20%; right: 20%; top: 50%; height: 1px; background: rgba(60,40,10,.6); transform: rotate(35deg); }
  .sa { left: 1.6vmin; top: 1.6vmin; } .sb { right: 1.6vmin; top: 1.6vmin; } .sc { left: 1.6vmin; bottom: 1.6vmin; } .sd { right: 1.6vmin; bottom: 1.6vmin; }
  .kick { grid-column: 1 / 3; font-size: 1.7vmin; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: #8A7760; white-space: nowrap; }
  h1 { grid-column: 1; grid-row: 2; align-self: center; margin: 0; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; font-size: 13vmin; line-height: .84; letter-spacing: .005em; text-transform: uppercase; }
  .side { grid-column: 2; grid-row: 2; align-self: center; display: flex; flex-direction: column; align-items: flex-start; gap: 2vmin; max-width: 30vmin; }
  .sub { font-size: 2.1vmin; line-height: 1.45; color: #5A4C3D; }
  .price { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 6.4vmin; line-height: 1; white-space: nowrap; }
  .foot { grid-column: 1 / 3; grid-row: 3; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; }
  .cta { padding: 1.8vmin 3.2vmin; background: #2B241D; color: #F5EFE6; font-size: 2vmin; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
  .fine { font-size: 1.6vmin; color: #8A7760; white-space: nowrap; }

  /* ── 3:4 — reeds left carrying the plate, clear pane right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { left: auto; right: 0; width: 58%; height: 100%; }
    .reed { right: auto; top: 0; width: 42%; height: 100%; }
    .reed img { object-position: 40% 30%; }
    .bar { left: calc(42% - .6vmin); right: auto; top: 0; bottom: 0; width: 1.2vmin; height: auto; margin: 0;
      background: linear-gradient(90deg, #F4DFA8 0%, #C9A45A 40%, #9C7A36 70%, #D8B874 100%); }
    .plate { left: 4.4vmin; right: auto; width: calc(42% - 8.8vmin); top: 6vmin; bottom: 6vmin; height: auto; padding: 4vmin 3.2vmin;
      grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
    .kick { grid-column: 1; white-space: normal; line-height: 1.5; }
    h1 { grid-row: 2; margin-top: 2.4vmin; font-size: 8.4vmin; }
    .side { grid-column: 1; grid-row: 3; align-self: end; margin-bottom: 3vmin; gap: 1.8vmin; }
    .sub { font-size: 1.9vmin; }
    .foot { grid-column: 1; grid-row: 4; flex-direction: column; align-items: flex-start; gap: 1.6vmin; }
  }
  /* ── square — clear pane left, reeds right ── */
  @media (min-aspect-ratio: 9/10) {
    .photo { right: auto; left: 0; width: 52%; }
    .reed { right: 0; left: auto; width: 48%; }
    .bar { left: calc(52% - .6vmin); }
    .plate { left: auto; right: 4.4vmin; width: calc(48% - 8.8vmin); top: 5.4vmin; bottom: 5.4vmin; }
    h1 { font-size: 9.4vmin; }
  }
  /* ── wide — reeds | photo | reeds + plate ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { left: 14%; width: 40%; }
    .reed { left: auto; right: 0; width: 46%; }
    .r2 { display: block; left: 0; right: auto; top: 0; width: 14%; height: 100%; }
    .r2 img { object-position: 20% 40%; }
    .bar { left: calc(54% - .6vmin); }
    .b2 { display: block; left: calc(14% - .6vmin); }
    .plate { right: 5vmin; width: calc(46% - 10vmin); top: 6.4vmin; bottom: 6.4vmin; padding: 4.4vmin 4vmin; }
    .kick { white-space: nowrap; }
    h1 { font-size: min(11vmin, calc((46vw - 18vmin) / 3.9)); margin-top: 3vmin; }
    .side { margin-bottom: 3.4vmin; max-width: 40vmin; flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 3vmin; width: 100%; }
    .sub { font-size: 2vmin; max-width: 30vmin; }
    .foot { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 1.6vmin 3vmin; }
  }

  /* ───────── motion (8s loop · t=0 = the static design) ─────────
     slow and quiet, like standing at a shop window: the blurred world behind the reeds drifts sideways and back ·
     a broad soft light slides across the fluted glass · a specular glint runs along the brass mullion ·
     4.4s "focus pull" — the headline and the reeds go softer for a breath and snap back sharp while the clear pane never blurs */
  .reed img { animation: drift 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes drift { 0%, 100% { transform: translateX(0); filter: blur(1.8vmin) saturate(.85) brightness(1.05); }
    30% { transform: translateX(5%); filter: blur(1.8vmin) saturate(.85) brightness(1.05); }
    55% { filter: blur(2.8vmin) saturate(.85) brightness(1.08); } 62% { filter: blur(1.8vmin) saturate(.85) brightness(1.05); }
    70% { transform: translateX(-4%); } }

  .reed::before { background: linear-gradient(100deg, rgba(255,255,255,0) 40%, rgba(255,250,240,.38) 50%, rgba(255,255,255,0) 60%) no-repeat, rgba(236,226,212,.38);
    background-size: 300% 100%, auto; background-position: 0% 0, 0 0; animation: slide 8s cubic-bezier(.45,0,.4,1) infinite; }
  @keyframes slide { 0%, 8% { background-position: 0% 0, 0 0; } 48%, 100% { background-position: 100% 0, 0 0; } }
  .r2::before { animation-delay: -.6s; }

  .bar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,0) 45%, rgba(255,250,225,.95) 50%, rgba(255,255,255,0) 55%) no-repeat;
    background-size: 400% 400%; background-position: 0% 0%; animation: glint 8s cubic-bezier(.5,0,.4,1) infinite; }
  @keyframes glint { 0%, 62% { background-position: 0% 0%; } 88%, 100% { background-position: 100% 100%; } }
  .b2::after { animation-delay: -.5s; }

  h1 { animation: focus 8s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes focus { 0%, 50%, 64%, 100% { filter: blur(0); opacity: 1; } 55%, 57% { filter: blur(.45vmin); opacity: .72; } }
  .price { animation: focus2 8s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes focus2 { 0%, 52%, 66%, 100% { filter: blur(0); opacity: 1; } 57%, 59% { filter: blur(.35vmin); opacity: .75; } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="reed"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="reed r2"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <i class="bar"></i><i class="bar b2"></i>
  <div class="plate">
    <i class="screw sa"></i><i class="screw sb"></i><i class="screw sc"></i><i class="screw sd"></i>
    <div class="kick">Atelier Rill · Autumn 26</div>
    <h1>Seen<br>through.</h1>
    <div class="side">
      <div class="sub">Everything else goes soft. The piece stays sharp.</div>
      <div class="price">€96</div>
    </div>
    <div class="foot">
      <div class="cta">Shop the collection →</div>
      <div class="fine">Free delivery · 30-day returns</div>
    </div>
  </div>
</div>
</body>
</html>
