<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="loop-duration" content="8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Quiet Luxury (animated, 8 s loop) — slow photo push-in · wordmark letter-spacing breath · soft light across the headline · CTA hairline redraw · faint sheen over the photo */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F2ECE2; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F2ECE2; color: #2B2620; font-family: "Jost", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 66%; object-fit: cover; object-position: 50% 12%;
    transform-origin: 50% 100%;
    animation: push 8s cubic-bezier(.45,0,.55,1) 0s infinite; }
  .sheen { position: absolute; top: 0; left: 0; width: 100%; height: 66%; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(108deg, rgba(255,247,234,0) 0%, rgba(255,247,234,0) 40%, rgba(255,247,234,.07) 45%, rgba(255,247,234,.16) 50%, rgba(255,247,234,.07) 55%, rgba(255,247,234,0) 60%, rgba(255,247,234,0) 100%) no-repeat;
    background-size: 300% 100%; background-position: 100% 0;
    animation: sheen 8s linear 0s infinite; }
  .melt { position: absolute; left: 0; right: 0; top: 48%; height: 18.2%; background: linear-gradient(0deg, rgba(242,236,226,1) 0%, rgba(242,236,226,0.985) 7.7%, rgba(242,236,226,0.943) 15.4%, rgba(242,236,226,0.874) 23.1%, rgba(242,236,226,0.784) 30.8%, rgba(242,236,226,0.677) 38.5%, rgba(242,236,226,0.56) 46.2%, rgba(242,236,226,0.44) 53.8%, rgba(242,236,226,0.323) 61.5%, rgba(242,236,226,0.216) 69.2%, rgba(242,236,226,0.126) 76.9%, rgba(242,236,226,0.057) 84.6%, rgba(242,236,226,0.015) 92.3%, rgba(242,236,226,0) 100%); }
  .copy { position: absolute; left: 6vmin; right: 6vmin; top: 63%; bottom: 4vmin; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .k { font-size: 2.6vmin; font-weight: 500; letter-spacing: .5em; text-transform: uppercase; color: #7A6A55; margin-right: -.5em; white-space: nowrap;
    animation: breathe 8s linear 0s infinite; }
  h1 { margin: 2vmin 0 0; padding: 0 .12em; font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif; font-weight: 400; font-style: italic; font-size: 11.5vmin; line-height: .92; letter-spacing: -.01em;
    color: #2B2620;
    background: linear-gradient(100deg, #2B2620 0%, #2B2620 41%, #6E5B45 46%, #C9B391 50%, #6E5B45 54%, #2B2620 59%, #2B2620 100%) no-repeat;
    background-size: 300% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: glint 8s linear 0s infinite; }
  .d { margin-top: 2.4vmin; font-size: 3.1vmin; line-height: 1.5; color: #4A4035; max-width: 70vmin; }
  .cta { display: inline-flex; align-items: center; gap: 3vmin; margin-top: 3vmin; font-size: 2.7vmin; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
  .cta i { display: block; width: 10vmin; height: .25vmin; background: #2B2620; clip-path: inset(0 0 0 0);
    animation: draw 8s linear 0s infinite; }

  /* 0→4 s in, 4→8 s out: barely perceptible, never more than 3 % */
  @keyframes push {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  /* wordmark exhales wide and pale, then settles (0.6 s → 3.4 s) */
  @keyframes breathe {
    0%, 7.5% { letter-spacing: .5em; margin-right: -.5em; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
    24%      { letter-spacing: .74em; margin-right: -.74em; opacity: .55; animation-timing-function: cubic-bezier(.4,0,.2,1); }
    42.5%, 100% { letter-spacing: .5em; margin-right: -.5em; opacity: 1; }
  }
  /* champagne light travels across the italic headline (2.6 s → 4.8 s) */
  @keyframes glint {
    0%, 32.5% { background-position: 100% 0; animation-timing-function: cubic-bezier(.55,.1,.35,1); }
    60%, 100% { background-position: 0% 0; }
  }
  /* hairline wipes away to the right, then redraws from the left (4.9 s → 6.9 s) */
  @keyframes draw {
    0%, 61%  { clip-path: inset(0 0 0 0); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
    69%      { clip-path: inset(0 0 0 100%); animation-timing-function: step-end; }
    71%      { clip-path: inset(0 100% 0 0); animation-timing-function: cubic-bezier(.22,.7,.2,1); }
    86%, 100% { clip-path: inset(0 0 0 0); }
  }
  /* a very faint sheen drifts over the photo in the second half (5 s → 7.6 s) */
  @keyframes sheen {
    0%, 62.5% { background-position: 100% 0; animation-timing-function: cubic-bezier(.45,0,.55,1); }
    95%, 100% { background-position: 0% 0; }
  }

  @media (min-aspect-ratio: 7/10) {
    .photo, .sheen { height: 61%; }
    .melt { top: 43%; }
    .copy { top: 58%; }
    h1 { font-size: 10vmin; }
  }
  @media (min-aspect-ratio: 19/20) {
    .photo { width: 56%; height: 100%; object-position: 50% 30%; transform-origin: 100% 50%; }
    .sheen { width: 56%; height: 100%; }
    .melt { top: 0; bottom: 0; height: auto; left: 40%; right: auto; width: 16%; background: linear-gradient(270deg, rgba(242,236,226,1) 0%, rgba(242,236,226,0.985) 7.7%, rgba(242,236,226,0.943) 15.4%, rgba(242,236,226,0.874) 23.1%, rgba(242,236,226,0.784) 30.8%, rgba(242,236,226,0.677) 38.5%, rgba(242,236,226,0.56) 46.2%, rgba(242,236,226,0.44) 53.8%, rgba(242,236,226,0.323) 61.5%, rgba(242,236,226,0.216) 69.2%, rgba(242,236,226,0.126) 76.9%, rgba(242,236,226,0.057) 84.6%, rgba(242,236,226,0.015) 92.3%, rgba(242,236,226,0) 100%); }
    .copy { top: 5vmin; bottom: 5vmin; left: 58%; right: 5vmin; }
    h1 { font-size: 9vmin; }
    .d { font-size: 2.6vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="sheen"></div>
  <div class="melt"></div>
  <div class="copy">
    <div class="k">New arrivals</div>
    <h1>The Embroidered<br>Edit</h1>
    <div class="d">Hand-stitched cotton maxi dresses, made for slow summer evenings.</div>
    <div class="cta">Discover <i></i></div>
  </div>
</div>
</body>
</html>
