<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Karla:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Mooncake Press — the Mid-Autumn Festival (15th day of the 8th lunar month): the offer is pressed into a
     twelve-lobed mooncake like a wooden-mould stamp — golden crust, beaded ring, embossed numerals — set on
     ink-teal night with a soft moon-glow. 15% off, on the 15th. tall → photo above, mooncake right of the copy;
     square → mooncake over the copy; wide → photo left, copy + mooncake right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #13302F; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #13302F; color: #F2E6CF; font-family: "Karla", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 64vmin); object-fit: cover; object-position: 50% 18%; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; top: calc(100% - 64vmin); overflow: hidden;
    background: radial-gradient(46vmin 46vmin at 74% 42%, rgba(232,182,76,.22) 0%, rgba(232,182,76,.08) 45%, rgba(232,182,76,0) 70%), linear-gradient(180deg, #163837, #102928); }
  .cake { position: absolute; right: 5vmin; top: 7vmin; width: 40vmin; height: 40vmin; filter: drop-shadow(0 1.2vmin 1.6vmin rgba(0,0,0,.45)); }
  .cake svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cake .t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6B3E14; text-shadow: 0 .25vmin 0 rgba(255,228,170,.55), 0 -.15vmin 0 rgba(80,40,10,.35); text-align: center; }
  .cake .t small { font-size: 1.7vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
  .cake .t b { font-family: "Gilda Display", Georgia, serif; font-weight: 400; font-size: 11vmin; line-height: .9; }
  .cake .t b sup { font-size: .4em; vertical-align: .9em; }
  .copy { position: absolute; left: 7vmin; right: 49vmin; top: 7vmin; bottom: 6vmin; display: flex; flex-direction: column; }
  .k { font-size: 1.8vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #E8B64C; line-height: 1.5; }
  h1 { margin: 2vmin 0 0; font-family: "Gilda Display", Georgia, serif; font-weight: 400; font-size: 8.4vmin; line-height: 1; letter-spacing: -.005em; }
  .p { margin-top: 2vmin; font-size: 2.2vmin; line-height: 1.45; color: #C9D3C8; }
  .foot { position: absolute; left: 7vmin; right: 7vmin; bottom: 6vmin; display: flex; align-items: center; justify-content: space-between; gap: 2vmin; font-size: 2vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; border-top: 1px solid rgba(232,182,76,.45); padding-top: 2.6vmin; }
  .foot .code { white-space: nowrap; color: #C9D3C8; }
  .foot .code em { font-style: normal; color: #F2E6CF; }
  .foot .cta { background: #E8B64C; color: #13302F; padding: 1.5vmin 2.8vmin; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 58vmin); }
    .panel { top: calc(100% - 58vmin); }
    .cake { top: 5vmin; width: 36vmin; height: 36vmin; }
    .copy { top: 5.4vmin; right: 45vmin; }
    h1 { font-size: 7.6vmin; }
    .p { display: none; }
    .cake .t b { font-size: 10vmin; }
    .foot { bottom: 4.6vmin; padding-top: 2vmin; }
  }
  /* square → photo left; mooncake crowns the copy */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .panel { left: 50%; top: 0; background: radial-gradient(36vmin 36vmin at 50% 26%, rgba(232,182,76,.22) 0%, rgba(232,182,76,.08) 45%, rgba(232,182,76,0) 70%), linear-gradient(180deg, #163837, #102928); }
    .cake { left: 50%; right: auto; top: 6vmin; width: 32vmin; height: 32vmin; margin-left: -16vmin; }
    .cake .t b { font-size: 9vmin; }
    .cake .t small { font-size: 1.6vmin; letter-spacing: .18em; }
    .copy { left: 5vmin; right: 5vmin; top: 42vmin; bottom: auto; align-items: center; text-align: center; }
    h1 { font-size: 7vmin; margin-top: 1.4vmin; }
    .p { display: block; font-size: 2vmin; }
    .foot { left: 5vmin; right: 5vmin; bottom: 5vmin; flex-direction: column; gap: 1.8vmin; font-size: 1.8vmin; padding-top: 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; }
    .panel { left: 44%; background: radial-gradient(40vmin 40vmin at 74% 42%, rgba(232,182,76,.22) 0%, rgba(232,182,76,.08) 45%, rgba(232,182,76,0) 70%), linear-gradient(180deg, #163837, #102928); }
    .cake { left: auto; right: 6vmin; top: 12vmin; width: 36vmin; height: 36vmin; margin-left: 0; }
    .cake .t b { font-size: 10vmin; }
    .copy { left: 7vmin; right: 46vmin; top: 13vmin; bottom: auto; align-items: flex-start; text-align: left; }
    h1 { font-size: 7.6vmin; margin-top: 2vmin; }
    .p { display: block; }
    .foot { left: 7vmin; right: 6vmin; bottom: 8vmin; flex-direction: row; font-size: 1.9vmin; padding-top: 2.6vmin; }
  }

  /* ───────── motion (6s loop) ─────────
     constant: the beaded ring and leaf motifs of the mould turn slowly (exactly one 30° repeat per loop)
     beats: 1.2s the mooncake is pressed: a squash-and-rebound while the 15% debosses deeper and a moon-glow blooms behind it ·
     3.2s "season." wipes away and re-inks itself · 4.8s a sheen crosses the gold CTA */
  .spin { transform-origin: 50px 50px; animation: spin 6s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(30deg); } }
  .cake { animation: press 6s linear infinite; }
  @keyframes press {
    0%, 20% { transform: scale(1, 1) translateY(0); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    24% { transform: scale(1.04, .92) translateY(1vmin); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    30% { transform: scale(.985, 1.025) translateY(-.4vmin); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    35%, 100% { transform: scale(1, 1) translateY(0); }
  }
  .cake::before { content: ""; position: absolute; inset: -32%; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, rgba(246,205,122,.5), rgba(246,205,122,.18) 50%, rgba(246,205,122,0)); animation: glow 6s linear infinite; }
  @keyframes glow {
    0%, 23% { opacity: 0; transform: scale(.8); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    32% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    58%, 100% { opacity: 0; transform: scale(1.1); }
  }
  .cake .t b { animation: deboss 6s linear infinite; }
  @keyframes deboss {
    0%, 22% { color: #6B3E14; text-shadow: 0 .25vmin 0 rgba(255,228,170,.55), 0 -.15vmin 0 rgba(80,40,10,.35); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    26%, 40% { color: #5A3008; text-shadow: 0 .45vmin 0 rgba(255,228,170,.8), 0 -.3vmin 0 rgba(80,40,10,.55); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    55%, 100% { color: #6B3E14; text-shadow: 0 .25vmin 0 rgba(255,228,170,.55), 0 -.15vmin 0 rgba(80,40,10,.35); }
  }
  h1 .w { display: inline-block; animation: ink 6s linear infinite; }
  @keyframes ink {
    0%, 52% { clip-path: inset(-20% -6% -25% -6%); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    60% { clip-path: inset(-20% -6% -25% 106%); animation-timing-function: steps(1, end); }
    61% { clip-path: inset(-20% 106% -25% -6%); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    71%, 100% { clip-path: inset(-20% -6% -25% -6%); }
  }
  .foot .cta { position: relative; overflow: hidden; }
  .foot .cta::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 30%;
    background: linear-gradient(90deg, rgba(255,250,230,0), rgba(255,255,255,.7) 50%, rgba(255,250,230,0));
    transform: translateX(-160%) skewX(-18deg); animation: sheen 6s linear infinite; }
  @keyframes sheen {
    0%, 80% { transform: translateX(-160%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    94%, 100% { transform: translateX(420%) skewX(-18deg); }
  }
</style>
</head>
