<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300;1,9..144,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Folio Spread — a fashion-story page: bleeding photo, giant folio number, caption and shoot credits, crop marks.
     tall → photo bleeds from the top, folio + caption beneath · square & wide → photo bleeds left, folio column right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FAF8F4; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #FAF8F4; color: #1C1A17; font-family: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif; }
  .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; }

  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 55vmin); object-fit: cover; object-position: 50% 18%; }
  .crop { position: absolute; width: 3vmin; height: 3vmin; }
  .crop.a { left: 1.6vmin; bottom: calc(55vmin - 4.6vmin); border-top: 1px solid #1C1A17; border-right: 1px solid #1C1A17; }
  .crop.b { right: 1.6vmin; bottom: calc(55vmin - 4.6vmin); border-top: 1px solid #1C1A17; border-left: 1px solid #1C1A17; }
  .reg { position: absolute; right: 5vmin; bottom: 5vmin; width: 4vmin; height: 4vmin; }
  .reg svg { display: block; width: 100%; height: 100%; }

  .folio { position: absolute; left: 3.6vmin; bottom: 7.5vmin; font-family: "Fraunces", Georgia, serif; font-weight: 300; font-variation-settings: "opsz" 144; font-size: 38vmin; line-height: .74; letter-spacing: -.06em; }
  .look { position: absolute; left: 5.4vmin; bottom: 4vmin; font-size: 1.8vmin; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; }

  .copy { position: absolute; right: 5vmin; width: 42vmin; bottom: 11vmin; height: 40vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .kick { font-size: 1.8vmin; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; padding-bottom: 1.2vmin; border-bottom: 1px solid #1C1A17; }
  .cap { margin: 0; font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 300; font-size: 3.7vmin; line-height: 1.12; letter-spacing: -.01em; }
  .cap b { font-style: normal; font-weight: 600; }
  .cred { display: grid; grid-template-columns: auto 1fr; column-gap: 2vmin; row-gap: .5vmin; font-size: 1.8vmin; line-height: 1.3; }
  .cred dt { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #7A736A; }
  .cred dd { margin: 0; }
  .cta { display: flex; align-items: center; gap: 1.6vmin; font-size: 1.9vmin; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
  .cta i { display: block; width: 8vmin; height: 1px; background: #1C1A17; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 46vmin); }
    .crop.a, .crop.b { bottom: calc(46vmin - 4.6vmin); }
    .folio { font-size: 32vmin; bottom: 7.5vmin; }
    .copy { height: 33vmin; width: 50vmin; bottom: 7vmin; }
    .cap { font-size: 3.3vmin; }
    .reg { display: none; }
  }
  /* square — photo bleeds off the left edge, folio column on the right */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 56%; height: 100%; object-position: 50% 25%; }
    .crop.a { left: calc(56% + 1.6vmin); top: 1.6vmin; bottom: auto; border: 0; border-bottom: 1px solid #1C1A17; border-left: 1px solid #1C1A17; }
    .crop.b { left: calc(56% + 1.6vmin); right: auto; bottom: 1.6vmin; border: 0; border-top: 1px solid #1C1A17; border-left: 1px solid #1C1A17; }
    .folio { left: calc(56% + 4vmin); top: 4vmin; bottom: auto; font-size: 25vmin; }
    .look { left: calc(56% + 5.4vmin); top: 25vmin; bottom: auto; }
    .copy { left: calc(56% + 5vmin); right: 4.5vmin; width: auto; top: 33vmin; bottom: 4.5vmin; height: auto; }
    .cap { font-size: 3vmin; }
    .cred { font-size: 1.7vmin; }
    .reg { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 50%; }
    .crop.a, .crop.b { left: calc(50% + 1.6vmin); }
    .folio { left: calc(50% + 5vmin); top: 5vmin; font-size: 34vmin; }
    .look { left: calc(50% + 6.6vmin); top: 32vmin; }
    .copy { left: calc(50% + 6vmin); right: 6vmin; top: 40vmin; bottom: 6vmin; }
    .cap { font-size: 3.6vmin; }
    .reg { display: block; right: 5vmin; top: 5vmin; bottom: auto; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ───────── */
  /* the folio number sinks below its baseline and rises again, like a page being turned to */
  .folio { clip-path: inset(-30% -5% -3% -5%); animation: folio 6s linear infinite; }
  @keyframes folio {
    0%, 26% { transform: translateY(0); clip-path: inset(-30% -5% -3% -5%); opacity: 1; animation-timing-function: cubic-bezier(.6,0,.4,1); }
    36% { transform: translateY(100%); clip-path: inset(0 -5% 100% -5%); opacity: 1; animation-timing-function: steps(1, end); }
    38% { transform: translateY(100%); clip-path: inset(0 -5% 100% -5%); opacity: 1; animation-timing-function: cubic-bezier(.2,.7,.2,1); }
    54%, 100% { transform: translateY(0); clip-path: inset(-30% -5% -3% -5%); opacity: 1; }
  }
  /* "Look 07 of 24" follows the number, a beat later */
  .look { animation: look 6s linear infinite; }
  @keyframes look {
    0%, 28% { opacity: 1; transform: translateY(0); animation-timing-function: cubic-bezier(.6,0,.9,.4); }
    33% { opacity: 0; transform: translateY(0); animation-timing-function: steps(1, end); }
    50% { opacity: 0; transform: translateY(.8vmin); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    60%, 100% { opacity: 1; transform: translateY(0); }
  }
  /* crop marks tighten on the frame, like a proof being registered */
  .crop.a, .crop.b { animation: register 6s linear infinite; }
  @keyframes register {
    0%, 58% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
    64%, 70% { transform: scale(.7); opacity: .55; animation-timing-function: cubic-bezier(.4,0,.2,1); }
    78%, 100% { transform: scale(1); opacity: 1; }
  }
  .reg svg { animation: spin 6s linear infinite; }
  @keyframes spin {
    0%, 58% { transform: rotate(0); animation-timing-function: cubic-bezier(.5,0,.2,1); }
    78%, 100% { transform: rotate(180deg); }
  }
  /* CTA rule reaches out */
  .cta i { transform-origin: 0 50%; animation: reach 6s linear infinite; }
  @keyframes reach {
    0%, 76% { transform: scaleX(1); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    84% { transform: scaleX(1.6); animation-timing-function: cubic-bezier(.5,0,.3,1); }
    94%, 100% { transform: scaleX(1); }
  }
  /* photo: an unhurried push-in from the edge it bleeds off */
  .photo { transform-origin: 50% 0; animation: push 6s linear infinite; }
  @keyframes push {
    0% { transform: scale(1); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    50% { transform: scale(1.03); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    100% { transform: scale(1); }
  }
  @media (min-aspect-ratio: 9/10) { .photo { transform-origin: 0 50%; } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="crop a"></div><div class="crop b"></div>
  <div class="folio">112</div>
  <div class="look">Look 07 of 24</div>
  <div class="copy">
    <div class="kick">The Autumn Story</div>
    <p class="cap"><b>Studio Oro.</b> The new collection in its purest form — quiet colour, considered cuts, made to wear for years.</p>
    <dl class="cred" style="margin:0">
      <dt>Photo</dt><dd>Mara Ilić</dd>
      <dt>Styling</dt><dd>Jonas Berg</dd>
      <dt>Price</dt><dd>From $129</dd>
    </dl>
    <div class="cta">Shop the look<i></i></div>
  </div>
  <div class="reg"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="#1C1A17" stroke-width="1"/><path d="M20 2V38M2 20H38" stroke="#1C1A17" stroke-width="1"/><circle cx="20" cy="20" r="5" fill="#1C1A17"/></svg></div>
</div>
</body>
</html>
