<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Mr+Dafoe&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Vintage "Greetings from" postcard — big block letters filled with the photo (screen-blend knockout, no text-clip),
     outlined with an off-register keyline; the real photo below; a postcard back with handwritten note, address lines,
     a perforated stamp (photo crop, 25% denomination) and a wavy postmark.
     tall: letters / photo / back · square: letters across, photo left + back right · wide: photo right, the card left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F2E7D0; }
  .banner { --paper: #F2E7D0; --navy: #1D2F55; --red: #D2462F; --teal: #2B7A78; --mus: #E6A83A;
    --lt: 13vmin; --lh: 24vmin; --fs: 26vmin;
    position: fixed; inset: 0; overflow: hidden; background: var(--paper); color: var(--navy); font-family: "Courier Prime", "Courier New", monospace; }
  .greet { position: absolute; left: 7vmin; top: 3vmin; font-family: "Mr Dafoe", "Brush Script MT", cursive; font-size: 10vmin; line-height: 1; color: var(--red); transform: rotate(-6deg); z-index: 3; white-space: nowrap; }
  .lt { position: absolute; left: 4vmin; right: 4vmin; top: var(--lt); height: var(--lh); isolation: isolate; overflow: hidden; }
  .lt img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; display: block; }
  .ko, .ol { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Anton", Impact, "Arial Narrow", sans-serif; font-size: var(--fs); line-height: 1; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
  .ko { background: #fff; color: #000; mix-blend-mode: screen; }
  .tint { position: absolute; inset: 0; background: var(--paper); mix-blend-mode: multiply; }
  .ol { color: transparent; -webkit-text-stroke: .45vmin var(--navy); }
  .ol.o2 { -webkit-text-stroke: .35vmin var(--red); transform: translate(.9vmin, .9vmin); }
  .ph { position: absolute; left: 6vmin; right: 6vmin; top: calc(var(--lt) + var(--lh) + 3vmin); bottom: 29vmin; }
  .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .back { position: absolute; left: 6vmin; right: 6vmin; bottom: 4vmin; height: 22vmin; display: flex; gap: 3.4vmin; }
  .msg { flex: 1.1; min-width: 0; }
  .msg .s { font-family: "Mr Dafoe", "Brush Script MT", cursive; font-size: 6.4vmin; line-height: 1; color: var(--red); white-space: nowrap; }
  .msg p { margin: 1.2vmin 0 0; font-size: 2.1vmin; line-height: 1.45; }
  .msg b { color: var(--red); }
  .vr { width: 1px; background: var(--navy); opacity: .55; }
  .adr { flex: 1; min-width: 0; position: relative; padding-top: 7.4vmin; }
  .adr .ln { border-bottom: 1px solid rgba(29,47,85,.55); padding: .9vmin 0 .5vmin; font-size: 2vmin; white-space: nowrap; }
  .adr b { font-weight: 700; letter-spacing: .06em; }
  .stamp { position: absolute; right: 0; top: 0; width: 13vmin; height: 15.5vmin; box-sizing: border-box; background: #fff; border: .9vmin dotted var(--paper); padding: .9vmin; transform: rotate(4deg); box-shadow: 0 .3vmin .8vmin rgba(0,0,0,.08); }
  .stamp .in { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .stamp img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
  .stamp span { position: absolute; left: .5vmin; top: .4vmin; font-family: "Anton", Impact, sans-serif; font-size: 2.6vmin; color: #fff; text-shadow: 0 0 .6vmin rgba(0,0,0,.6); }
  .adr .pm { position: absolute; right: 5vmin; top: 2.4vmin; width: 20vmin; height: 11vmin; z-index: 2; }
  .pm svg { width: 100%; height: 100%; display: block; overflow: visible; }
  @media (min-aspect-ratio: 7/10) {
    .banner { --lt: 11vmin; --lh: 23vmin; --fs: 25.5vmin; }
    .greet { font-size: 8.6vmin; }
    .ph { left: 14vmin; right: 14vmin; bottom: 27vmin; }
    .back { height: 20vmin; bottom: 3.6vmin; }
    .msg p { font-size: 2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --lt: 9vmin; --lh: 20vmin; --fs: 24vmin; }
    .greet { font-size: 7.6vmin; top: 2vmin; left: 6vmin; }
    .ph { left: 5vmin; right: auto; width: 46vmin; top: 33vmin; bottom: 5vmin; }
    .back { left: 56vmin; right: 5vmin; top: 33vmin; bottom: 5vmin; height: auto; flex-direction: column; gap: 2.6vmin; }
    .vr { width: auto; height: 1px; }
    .adr { flex: none; }
    .msg { flex: none; }
    .msg .s { font-size: 5.6vmin; }
    .msg p { max-width: 24vmin; }
    .stamp { top: -.6vmin; width: 11vmin; height: 13vmin; }
    .adr { padding-top: 12vmin; }
    .adr .pm { right: 6vmin; top: 1vmin; width: 17vmin; height: 9.4vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --lt: 13vmin; --lh: 22vmin; --fs: 23vmin; }
    .greet { left: 7vmin; top: 3vmin; font-size: 9vmin; }
    .lt { right: auto; width: calc(100% - 64vmin); left: 5vmin; }
    .ph { left: auto; right: 5vmin; width: 52vmin; top: 5vmin; }
    .back { left: 7vmin; right: 64vmin; top: 45vmin; bottom: 8vmin; flex-direction: row; gap: 3.4vmin; }
    .msg .s { font-size: 6.4vmin; }
    .msg p { font-size: 2.4vmin; }
    .adr .ln { font-size: 2.3vmin; padding: 1.4vmin 0 .7vmin; }
    .vr { width: 1px; height: auto; }
    .msg, .adr { flex: 1; }
    .msg p { max-width: none; }
    .adr { padding-top: 16vmin; }
    .stamp { top: 0; width: 13vmin; height: 15.5vmin; }
    .adr .pm { right: 7vmin; top: 2vmin; width: 20vmin; height: 11vmin; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ─────────
     (each @keyframes carries an invisible outline-color so no effect is compositor-only: the frame-stepped
      video renderer parallel tabs otherwise freeze transform/opacity-only animations) */
  /* "Greetings from": re-written by hand, left to right, early in the loop */
  .greet { animation: write 6s linear infinite; }
  @keyframes write {
    0%, 6% { outline-color: transparent; clip-path: inset(-30% -5% -30% -5%); opacity: 1; animation-timing-function: cubic-bezier(.5,0,.9,.5); }
    11% { clip-path: inset(-30% -5% -30% -5%); opacity: 0; animation-timing-function: steps(1, end); }
    12% { clip-path: inset(-30% 105% -30% -5%); opacity: 1; animation-timing-function: cubic-bezier(.45,.1,.35,1); }
    30%, 100% { clip-path: inset(-30% -5% -30% -5%); opacity: 1; }
  }
  /* the photo inside the block letters drifts like a slide in a viewer */
  .lt img { transform-origin: 50% 45%; animation: drift 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes drift { 0%, 100% { outline-color: transparent; transform: scale(1) translateX(0); } 50% { transform: scale(1.06) translateX(-2%); } }
  /* off-register red keyline: the press wobbles out of register and settles back */
  .ol.o2 { animation: register 6s linear infinite; }
  @keyframes register {
    0%, 30% { outline-color: transparent; transform: translate(.9vmin, .9vmin); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    36% { transform: translate(1.8vmin, .3vmin); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    42% { transform: translate(.3vmin, 1.5vmin); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    49% { transform: translate(1.1vmin, .8vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    54%, 100% { transform: translate(.9vmin, .9vmin); }
  }
  /* hero photo: a very slow push-in */
  .ph { overflow: hidden; }
  .ph img { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { outline-color: transparent; transform: scale(1); } 50% { transform: scale(1.03); } }
  /* the postmark: lifts off, then is franked back down with a thump that jolts the stamp */
  .adr .pm { transform-origin: 70% 50%; animation: frank 6s linear infinite; }
  @keyframes frank {
    0%, 60% { outline-color: transparent; transform: scale(1) rotate(0); opacity: 1; animation-timing-function: cubic-bezier(.5,0,.7,.5); }
    65% { transform: scale(1.12) rotate(-4deg); opacity: 0; animation-timing-function: steps(1, end); }
    72% { transform: scale(1.35) rotate(-6deg); opacity: 0; animation-timing-function: cubic-bezier(.7,0,.9,.4); }
    76% { transform: scale(.95) rotate(0); opacity: 1; animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    81%, 100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .stamp { animation: jolt 6s linear infinite; }
  @keyframes jolt {
    0%, 75.5% { outline-color: transparent; transform: rotate(4deg) translateY(0); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    77.5% { transform: rotate(2.6deg) translateY(.5vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    82% { transform: rotate(4.6deg) translateY(-.15vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    86%, 100% { transform: rotate(4deg) translateY(0); }
  }
  /* "Wish you were here!": a soft swing of the pen after the stamp lands */
  .msg .s { display: inline-block; transform-origin: 0 80%; animation: sway 6s linear infinite; }
  @keyframes sway {
    0%, 84% { outline-color: transparent; transform: rotate(0); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    89% { transform: rotate(-2.2deg); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    95%, 100% { transform: rotate(0); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="greet">Greetings from</div>
  <div class="lt">
    <img src="{{PRODUCT_IMAGE}}" alt="">
    <div class="ko">Summer</div>
    <div class="tint"></div>
    <div class="ol o2" aria-hidden="true">Summer</div>
    <div class="ol" aria-hidden="true">Summer</div>
  </div>
  <div class="ph"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="back">
    <div class="msg">
      <div class="s">Wish you were here!</div>
      <p>The whole summer edit is <b>25% off</b> this week. Sent with love, the studio.</p>
    </div>
    <div class="vr"></div>
    <div class="adr">
      <div class="stamp"><div class="in"><img src="{{PRODUCT_IMAGE}}" alt=""><span>25%</span></div></div>
      <div class="pm"><svg viewBox="0 0 110 60" fill="none" stroke="#1D2F55" stroke-width="1.3" opacity=".7"><circle cx="84" cy="30" r="21"/><circle cx="84" cy="30" r="17"/><path d="M0 18c8-5 16 5 24 0s16 5 24 0 12 4 16 2M0 30c8-5 16 5 24 0s16 5 24 0 12 4 16 2M0 42c8-5 16 5 24 0s16 5 24 0 12 4 16 2"/>
    <text x="84" y="27" text-anchor="middle" font-family="Courier Prime, monospace" font-size="6.4" font-weight="700" fill="#1D2F55" stroke="none">SUMMER</text><text x="84" y="37" text-anchor="middle" font-family="Courier Prime, monospace" font-size="6.4" fill="#1D2F55" stroke="none">SALE ✦ 26</text></svg></div>
      <div class="ln">To: <b>You</b></div>
      <div class="ln">Code <b>POSTCARD25</b></div>
      <div class="ln">Until 30 September</div>
    </div>
  </div>
</div>
</body>
</html>
