<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  /* Sheet Pouch — the banner is a K-beauty sheet-mask sachet: pearlescent foil, crimped heat-seal bands with
     pinked zigzag edges top and bottom, a tear notch with "tear here", a clear product window (the photo),
     airy spaced caps, three tiny benefit pictograms and a net-content line — the drop packaged like skincare.
     tall → window above the label copy · square & wide → window left, label right, seals still top + bottom */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F7EEEC; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #3A2F3D; font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    background:
      linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 42%, rgba(255,255,255,0) 54%),
      linear-gradient(160deg, #FCE3DC 0%, #F6E6F4 38%, #E3EEF9 70%, #FBEDE3 100%); }

  /* seals */
  .seal { position: absolute; left: 0; right: 0; height: 7vmin;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.6) 0 .35vmin, rgba(160,120,150,.16) .35vmin .8vmin); }
  .seal.t { top: 0; box-shadow: 0 1px 0 rgba(255,255,255,.8), 0 .5vmin 1vmin rgba(150,110,140,.1); }
  .seal.b { bottom: 0; box-shadow: 0 -1px 0 rgba(255,255,255,.8), 0 -.5vmin 1vmin rgba(150,110,140,.1); }
  .seal::before { content: ""; position: absolute; left: 0; right: 0; height: 1.2vmin; background-size: 2.4vmin 1.2vmin; background-repeat: repeat-x; }
  .seal.t::before { top: 0; background-image: conic-gradient(from -45deg at 50% 100%, #F7EEEC 90deg, rgba(247,238,236,0) 0); }
  .seal.b::before { bottom: 0; background-image: conic-gradient(from 135deg at 50% 0, #F7EEEC 90deg, rgba(247,238,236,0) 0); }
  .notch { position: absolute; left: 0; top: 3.2vmin; width: 0; height: 0; border-top: 1.4vmin solid transparent; border-bottom: 1.4vmin solid transparent; border-left: 2.2vmin solid #F7EEEC; }
  .tear { position: absolute; left: 3.6vmin; top: 3.2vmin; font-size: 1.6vmin; letter-spacing: .16em; text-transform: uppercase; color: #7C6A7F; white-space: nowrap; background: rgba(252,236,232,.9); padding: .3vmin .8vmin; border-radius: .4vmin; }
  .tear::after { content: ""; display: inline-block; width: 10vmin; margin-left: 1vmin; border-top: 1px dashed #9C8A9F; vertical-align: .5vmin; }

  .brand { position: absolute; left: 6vmin; right: 6vmin; top: 10.5vmin; display: flex; justify-content: space-between; align-items: baseline; font-size: 1.8vmin; letter-spacing: .34em; text-transform: uppercase; white-space: nowrap; }
  .brand b { font-weight: 500; }
  .brand span { letter-spacing: .12em; color: #7C6A7F; }

  .win { position: absolute; left: 10vmin; right: 10vmin; top: 17vmin; height: calc(62% - 17vmin); overflow: hidden; outline: .5vmin solid rgba(255,255,255,.7); outline-offset: .9vmin; }
  .win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }

  .lab { position: absolute; left: 6vmin; right: 6vmin; top: calc(62% + 4vmin); bottom: 12.6vmin; display: flex; flex-direction: column; align-items: center; text-align: center; }
  h1 { margin: 0; font-weight: 300; font-size: 13vmin; line-height: .9; letter-spacing: .14em; text-transform: uppercase; padding-left: .14em; white-space: nowrap; }
  h1 i { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 6.4vmin; margin-top: .6vmin; color: #B25C80; padding-left: 0; }
  .lab p { margin: 2.4vmin 0 0; font-size: 2.3vmin; letter-spacing: .08em; color: #5E4F61; }
  .ben { margin-top: auto; display: flex; gap: 4vmin; }
  .ben div { display: flex; flex-direction: column; align-items: center; gap: .8vmin; font-size: 1.6vmin; letter-spacing: .12em; text-transform: uppercase; color: #5E4F61; white-space: nowrap; }
  .ben svg { width: 4.6vmin; height: 4.6vmin; fill: none; stroke: #8E6C92; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .net { position: absolute; left: 6vmin; right: 6vmin; bottom: 7.4vmin; display: none; }
  .deal { position: absolute; right: 5vmin; top: calc(62% + 1.6vmin); width: 16vmin; height: 16vmin; border-radius: 50%; background: #fff; box-shadow: 0 1vmin 2vmin rgba(160,100,140,.18), inset 0 0 0 .6vmin #FCE3EA; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg); text-align: center; }
  .deal b { font-weight: 500; font-size: 4.6vmin; line-height: 1; letter-spacing: -.02em; color: #B25C80; }
  .deal span { font-size: 1.6vmin; letter-spacing: .1em; margin-top: .6vmin; font-weight: 500; }
  .foot { position: absolute; left: 6vmin; right: 6vmin; bottom: 8.6vmin; display: flex; justify-content: space-between; font-size: 1.7vmin; letter-spacing: .14em; text-transform: uppercase; color: #6E5E71; white-space: nowrap; }

  /* SHORTER PORTRAIT */
  @media (min-aspect-ratio: 7/10) {
    .win { left: 14vmin; right: 14vmin; height: calc(58% - 17vmin); }
    .lab { top: calc(58% + 3.4vmin); }
    .deal { top: calc(58% + 1.4vmin); right: 5vmin; width: 14vmin; height: 14vmin; }
    .deal b { font-size: 4vmin; }
    h1 { font-size: 9vmin; }
    h1 i { font-size: 4.6vmin; }
    .lab p { display: none; }
  }
  /* SQUARE — window left, label right */
  @media (min-aspect-ratio: 9/10) {
    .brand { right: auto; width: 42%; }
    .win { left: 6vmin; right: auto; width: 42%; top: 17vmin; height: calc(100% - 34vmin); }
    .lab { left: calc(42% + 12vmin); right: 5vmin; top: 17vmin; bottom: 17vmin; align-items: flex-start; text-align: left; }
    h1 { font-size: 8.6vmin; padding-left: 0; }
    h1 i { font-size: 5vmin; }
    .lab p { display: block; font-size: 1.9vmin; line-height: 1.5; }
    .ben { gap: 3vmin; }
    .deal { right: 6vmin; top: auto; bottom: 17vmin; width: 15vmin; height: 15vmin; }
    .deal b { font-size: 4.2vmin; }
    .foot { left: calc(42% + 12vmin); right: 5vmin; }
  }
  /* WIDE */
  @media (min-aspect-ratio: 6/5) {
    .brand { width: 40%; }
    .win { width: 40%; left: 7vmin; }
    .lab { left: calc(40% + 16vmin); right: 26vmin; }
    h1 { font-size: 10vmin; }
    .deal { right: 7vmin; top: auto; bottom: 18vmin; width: 17vmin; height: 17vmin; }
    .deal b { font-size: 4.8vmin; }
    .foot { left: calc(40% + 16vmin); right: 7vmin; }
  }
  /* ───────────── motion (6 s loop · t=0 = static design) ─────────────
     a sachet turning in the light: a pearlescent sheen travels across the foil, the "tear here" line
     redraws, the benefit pictograms ink themselves one by one, "Glow" glows, the −20% sticker wiggles */
  .win img { transform-origin: 50% 30%; animation: sp-push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sp-push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  .banner::before { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 70%; pointer-events: none;
    background: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.08) 25%, rgba(255,236,250,.75) 45%, rgba(226,240,255,.75) 55%, rgba(255,255,255,.12) 75%, rgba(255,255,255,0) 100%);
    transform: translateX(-110%); animation: sp-foil 6s cubic-bezier(.45,0,.3,1) infinite; }
  @keyframes sp-foil { 0%, 8% { transform: translateX(-110%); } 58%, 100% { transform: translateX(260%); } }

  .tear::after { animation: sp-tear 6s cubic-bezier(.6,0,.2,1) infinite; }
  @keyframes sp-tear { 0%, 62%, 100% { clip-path: inset(-2px 0 -2px 0); } 66% { clip-path: inset(-2px 0 -2px 100%); } 67% { clip-path: inset(-2px 100% -2px 0); } 80% { clip-path: inset(-2px 0 -2px 0); } }

  .ben svg path, .ben svg circle { stroke-dasharray: 90; stroke-dashoffset: 0; animation: sp-ink1 6s cubic-bezier(.5,0,.3,1) infinite; }
  .ben div:nth-child(2) svg path { animation-name: sp-ink2; }
  .ben div:nth-child(3) svg path, .ben div:nth-child(3) svg circle { animation-name: sp-ink3; }
  @keyframes sp-ink1 { 0%, 18%, 100% { stroke-dashoffset: 0; opacity: 1; } 22% { stroke-dashoffset: 0; opacity: 0; } 23% { stroke-dashoffset: 90; opacity: 1; } 36% { stroke-dashoffset: 0; } }
  @keyframes sp-ink2 { 0%, 24%, 100% { stroke-dashoffset: 0; opacity: 1; } 28% { stroke-dashoffset: 0; opacity: 0; } 29% { stroke-dashoffset: 90; opacity: 1; } 42% { stroke-dashoffset: 0; } }
  @keyframes sp-ink3 { 0%, 30%, 100% { stroke-dashoffset: 0; opacity: 1; } 34% { stroke-dashoffset: 0; opacity: 0; } 35% { stroke-dashoffset: 90; opacity: 1; } 48% { stroke-dashoffset: 0; } }

  h1 { animation: sp-glow 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sp-glow { 0%, 36%, 76%, 100% { text-shadow: 0 0 0 rgba(255,255,255,0), 0 0 0 rgba(178,92,128,0); } 56% { text-shadow: 0 0 1.4vmin rgba(255,255,255,.95), 0 0 3.4vmin rgba(178,92,128,.35); } }
  h1 i { animation: sp-sub 6s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes sp-sub { 0%, 40%, 72%, 100% { opacity: 1; transform: translateY(0); } 50%, 54% { opacity: 0; transform: translateY(1vmin); } }

  .deal { animation: sp-deal 6s linear infinite; }
  @keyframes sp-deal {
    0%, 78% { transform: rotate(-8deg) scale(1); animation-timing-function: cubic-bezier(.3,0,.4,1); }
    82% { transform: rotate(-14deg) scale(1.08); animation-timing-function: cubic-bezier(.3,0,.4,1); }
    86% { transform: rotate(-3deg) scale(1.02); animation-timing-function: cubic-bezier(.3,0,.4,1); }
    90% { transform: rotate(-10deg) scale(1); animation-timing-function: cubic-bezier(.3,0,.4,1); }
    94%, 100% { transform: rotate(-8deg) scale(1); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="seal t"></div><div class="seal b"></div>
  <div class="notch"></div><div class="tear">Tear here</div>
  <div class="brand"><b>Studio Oro</b><span>시트 · No. 07</span></div>
  <div class="win"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="deal"><b>−20%</b><span>GLOW20</span></div>
  <div class="lab">
    <h1>Glow<i>the fresh edit</i></h1>
    <p>Light layers for every day of the season.</p>
    <div class="ben">
      <div><svg viewBox="0 0 24 24"><path d="M12 3c3 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.5 6-11z"/><path d="M9.5 14.5a2.6 2.6 0 0 0 2.5 2.4"/></svg>Fresh</div>
      <div><svg viewBox="0 0 24 24"><path d="M4 15c3-1 5-4 8-4s5 3 8 4M4 10c3-1 5-4 8-4s5 3 8 4M4 20c3-1 5-4 8-4s5 3 8 4"/></svg>Light</div>
      <div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Daily</div>
    </div>
  </div>
  <div class="foot"><span>Net 12 pieces</span><span>Until 10.12</span></div>
</div>
</body>
</html>
