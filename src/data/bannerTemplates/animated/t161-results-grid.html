<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Results Grid — a curated search-results page: the query as a serif headline, filter chips,
     a hero tile with a best-seller corner ribbon, detail-crop tiles and an in-grid offer tile.
     tall → hero across, three tiles below; 3:4 / square → hero left, stack right; wide → hero + 2 tiles + long offer */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F5F2EC; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F5F2EC; color: #17140F; font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; }

  .head { position: absolute; left: 5vmin; right: 5vmin; top: 5.4vmin; }
  .q { display: flex; align-items: flex-end; justify-content: space-between; gap: 3vmin; padding-bottom: 2vmin; border-bottom: 1px solid #17140F; }
  .q small { display: block; margin-bottom: .6vmin; font-size: 1.8vmin; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #6B645A; }
  .q h1 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 9.6vmin; line-height: .95; letter-spacing: -.015em; white-space: nowrap; }
  .q h1 i { color: #9A3B22; }
  .n { flex: none; text-align: right; font-size: 1.8vmin; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; line-height: 1.2; color: #6B645A; }
  .n b { display: block; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 5vmin; letter-spacing: 0; text-transform: none; color: #17140F; line-height: 1; }
  .chips { display: flex; gap: 1.3vmin; margin-top: 2.2vmin; }
  .chips span { flex: none; display: inline-flex; align-items: center; gap: .8vmin; border: 1px solid rgba(23,20,15,.32); border-radius: 99vmin; padding: 1vmin 2.1vmin; font-size: 1.8vmin; font-weight: 500; white-space: nowrap; }
  .chips span.on { background: #17140F; border-color: #17140F; color: #F5F2EC; }
  .chips svg { width: 1.6vmin; height: 1.6vmin; }

  .grid { position: absolute; left: 5vmin; right: 5vmin; top: 35vmin; bottom: 5vmin; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr auto; gap: 3.4vmin 2.4vmin; }
  .tile { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .hero { grid-column: 1 / span 3; }
  .ph { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #E4DDD2; }
  .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
  .s1 .ph img { transform: scale(1.9); transform-origin: 50% 34%; }
  .s2 .ph img { transform: scale(2.3); transform-origin: 50% 72%; }
  .sm .ph { flex: none; height: 25vmin; }
  .s2 { display: flex; }

  .fav { position: absolute; right: 1.6vmin; top: 1.6vmin; width: 5.2vmin; height: 5.2vmin; border-radius: 50%; background: rgba(245,242,236,.94); display: flex; align-items: center; justify-content: center; }
  .fav svg { width: 2.8vmin; height: 2.8vmin; }
  .sm .fav { width: 4.4vmin; height: 4.4vmin; right: 1.2vmin; top: 1.2vmin; }
  .sm .fav svg { width: 2.3vmin; height: 2.3vmin; }
  .idx { position: absolute; left: 1.4vmin; bottom: 1.2vmin; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 3.4vmin; line-height: 1; color: #F5F2EC; text-shadow: 0 0 2vmin rgba(0,0,0,.35); }

  .rib { position: absolute; left: -10.5vmin; top: 5.6vmin; width: 40vmin; transform: rotate(-45deg); background: #9A3B22; color: #F5F2EC; text-align: center; padding: 1.1vmin 0; font-size: 1.8vmin; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; box-shadow: 0 .4vmin 1.2vmin rgba(0,0,0,.18); }
  .rib::before, .rib::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; background: rgba(245,242,236,.55); }
  .rib::before { top: .45vmin; } .rib::after { bottom: .45vmin; }

  .cap { padding-top: 1.5vmin; }
  .cap .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 1.2vmin; font-size: 1.8vmin; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .cap .pr { margin-top: .7vmin; font-size: 2.3vmin; font-weight: 700; white-space: nowrap; }
  .cap .pr s { margin-left: .8vmin; font-weight: 400; color: #8A8276; }
  .cap .pr em { margin-left: .8vmin; font-style: normal; color: #9A3B22; }
  .st { color: #9A3B22; letter-spacing: .08em; font-weight: 500; text-transform: none; }
  .st span { color: #6B645A; letter-spacing: 0; }
  .hero .cap { display: flex; justify-content: space-between; align-items: flex-end; gap: 2vmin; }
  .hero .cap .nm { display: block; font-size: 1.9vmin; }
  .hero .cap .pr { font-size: 3vmin; }
  .hero .cap .pr s, .hero .cap .pr em { font-size: 2.4vmin; }
  .deliv { flex: none; text-align: right; font-size: 1.8vmin; font-weight: 500; line-height: 1.35; }
  .deliv b { display: block; font-weight: 700; }
  .deliv .st { font-size: 2vmin; }

  .promo { background: #17140F; color: #F5F2EC; padding: 2.2vmin; justify-content: space-between; }
  .promo small { font-size: 1.7vmin; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #CFC5B6; }
  .promo .big { font-family: "Instrument Serif", Georgia, serif; font-size: 8.4vmin; line-height: .9; letter-spacing: -.02em; }
  .promo .big i { display: block; font-size: 3.4vmin; letter-spacing: 0; color: #E3A58F; }
  .promo .code { align-self: flex-start; display: inline-block; border: 1px dashed rgba(245,242,236,.7); padding: .7vmin 1.2vmin; font-size: 1.8vmin; font-weight: 700; letter-spacing: .14em; white-space: nowrap; }
  .promo .txt { display: contents; }

  /* 3:4 and square — hero on the left, a tile and the offer stacked on the right */
  @media (min-aspect-ratio: 7/10) {
    .head { top: 5vmin; }
    .q h1 { font-size: 8.4vmin; }
    .grid { top: 32vmin; grid-template-columns: 1.45fr 1fr; grid-template-rows: 1fr 1fr; gap: 2.6vmin 2.6vmin; }
    .hero { grid-column: 1; grid-row: 1 / span 2; }
    .s1 { grid-column: 2; grid-row: 1; }
    .s2 { display: none; }
    .promo { grid-column: 2; grid-row: 2; }
    .sm .ph { flex: 1; height: auto; }
    .hero .cap { display: block; }
    .deliv { text-align: left; margin-top: 1vmin; }
    .deliv b { display: inline; margin-right: .8vmin; }
    .rib { left: -11vmin; top: 5vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .head { top: 4.6vmin; }
    .q { padding-bottom: 1.6vmin; }
    .q h1 { font-size: 7.4vmin; }
    .n b { font-size: 4.2vmin; }
    .chips { margin-top: 1.8vmin; }
    .chips span { padding: .9vmin 1.8vmin; font-size: 1.7vmin; }
    .grid { top: 28vmin; bottom: 4.4vmin; grid-template-columns: 1.3fr 1fr; }
    .deliv { display: none; }
    .promo .big { font-size: 7vmin; }
    .promo .big i { font-size: 2.8vmin; }
    .rib { left: -12vmin; top: 4.4vmin; font-size: 1.7vmin; }
  }
  /* wide — hero, two crops and a long offer strip */
  @media (min-aspect-ratio: 6/5) {
    .head { left: 6vmin; right: 6vmin; }
    .q h1 { font-size: 7.8vmin; }
    .grid { left: 6vmin; right: 6vmin; top: 28.5vmin; grid-template-columns: 1.3fr 1fr 1fr; grid-template-rows: 1fr auto; gap: 2.6vmin 2.6vmin; }
    .hero { grid-column: 1; grid-row: 1 / span 2; }
    .s1 { grid-column: 2; grid-row: 1; }
    .s2 { display: flex; grid-column: 3; grid-row: 1; }
    .promo { grid-column: 2 / span 2; grid-row: 2; flex-direction: row; align-items: center; gap: 3vmin; padding: 2vmin 2.6vmin; }
    .promo .big { font-size: 6.4vmin; display: flex; align-items: baseline; gap: 1.6vmin; }
    .promo .big i { display: inline; font-size: 2.6vmin; }
    .promo .txt { display: flex; flex-direction: column; align-items: flex-end; gap: 1vmin; }
    .deliv { display: block; }
  }

  /* ───────── motion (6s loop, t=0 = the static design) ─────────
     constant: the hero photo breathes, the detail crops pan slowly like a browsing eye
     beats: .6s a rust underline draws under "new" · 1.2s the hero heart beats with a ring ·
            2.4s a glint runs along the best-seller ribbon · 3.0s Look 02 gets favourited (heart fills, holds, clears) ·
            3.8s the −20% offer punches · 4.8s the sort chevron flicks */
  .hero .ph img { transform-origin: 50% 18%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .s1 .ph img { animation: pan1 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes pan1 { 0%, 100% { transform: scale(1.9) translate(0, 0); } 50% { transform: scale(1.9) translate(-2%, 3%); } }
  .s2 .ph img { animation: pan2 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes pan2 { 0%, 100% { transform: scale(2.3) translate(0, 0); } 50% { transform: scale(2.3) translate(2.5%, -2%); } }

  .q h1 i { position: relative; }
  .q h1 i::after { content: ""; position: absolute; left: .04em; right: .04em; bottom: .02em; height: .5vmin; background: #9A3B22;
    transform: scaleX(0); transform-origin: 0 50%; animation: under 6s linear infinite; }
  @keyframes under {
    0%, 9% { transform: scaleX(0); transform-origin: 0 50%; animation-timing-function: cubic-bezier(.6,0,.2,1); }
    19%, 40% { transform: scaleX(1); transform-origin: 0 50%; animation-timing-function: steps(1, end); }
    40.1% { transform: scaleX(1); transform-origin: 100% 50%; animation-timing-function: cubic-bezier(.6,0,.3,1); }
    49%, 100% { transform: scaleX(0); transform-origin: 100% 50%; }
  }

  .hero .fav { animation: beat 6s linear infinite; }
  @keyframes beat {
    0%, 19% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    21% { transform: scale(1.22); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    23.5% { transform: scale(.96); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    25.5% { transform: scale(1.12); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    29%, 100% { transform: scale(1); }
  }
  .hero .fav::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: .35vmin solid #9A3B22; opacity: 0; animation: ring 6s linear infinite; }
  @keyframes ring {
    0%, 20.5% { transform: scale(1); opacity: 0; }
    21.5% { transform: scale(1.05); opacity: .9; animation-timing-function: cubic-bezier(.15,.6,.35,1); }
    33%, 100% { transform: scale(1.9); opacity: 0; }
  }

  .rib { background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,240,225,.12) 30%, rgba(255,245,235,.45) 50%, rgba(255,240,225,.12) 70%, rgba(255,255,255,0) 100%) no-repeat -100% 0 / 40% 100%, #9A3B22;
    animation: glint 6s linear infinite; }
  @keyframes glint {
    0%, 39% { background-position: -100% 0, 0 0; animation-timing-function: cubic-bezier(.45,0,.3,1); }
    52%, 100% { background-position: 220% 0, 0 0; }
  }

  .s1 .fav path { animation: faved 6s linear infinite; }
  @keyframes faved {
    0%, 50% { fill: rgba(154,59,34,0); stroke: #17140F; }
    52%, 86% { fill: #9A3B22; stroke: #9A3B22; }
    89%, 100% { fill: rgba(154,59,34,0); stroke: #17140F; }
  }
  .s1 .fav { animation: favpop 6s linear infinite; }
  @keyframes favpop {
    0%, 50% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    52.5% { transform: scale(1.25); animation-timing-function: cubic-bezier(.4,0,.3,1); }
    57%, 100% { transform: scale(1); }
  }

  .promo .big { transform-origin: 0 60%; animation: punch 6s linear infinite; }
  @keyframes punch {
    0%, 62% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.55,0,.9,.4); }
    64.5% { transform: scale(.86); opacity: .2; animation-timing-function: cubic-bezier(.2,.9,.3,1.25); }
    68.5% { transform: scale(1.07); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.4,1); }
    73%, 100% { transform: scale(1); opacity: 1; }
  }

  .chips .on svg { animation: flick 6s linear infinite; }
  @keyframes flick {
    0%, 79% { transform: rotate(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    82%, 88% { transform: rotate(180deg); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    91%, 100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="head">
    <div class="q">
      <div><small>Results for</small><h1>“the <i>new</i> season”</h1></div>
      <div class="n"><b>248</b>pieces</div>
    </div>
    <div class="chips">
      <span class="on">Best selling <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg></span>
      <span>Size</span><span>Colour</span><span>Under €150</span>
    </div>
  </div>

  <div class="grid">
    <div class="tile hero">
      <div class="ph">
        <img src="{{PRODUCT_IMAGE}}" alt="">
        <div class="rib">Best seller</div>
        <div class="fav"><svg viewBox="0 0 24 24"><path d="M12 20.3s-7.6-4.6-7.6-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.7c0 5.6-7.6 10.2-7.6 10.2z" fill="#9A3B22"/></svg></div>
        <div class="idx">01</div>
      </div>
      <div class="cap">
        <div>
          <div class="nm">The Edit · Look 01 <span class="st">★★★★★ <span>4.9 (1.2k)</span></span></div>
          <div class="pr">€129<s>€159</s><em>−20%</em></div>
        </div>
        <div class="deliv"><b>Free delivery</b>Arrives tomorrow</div>
      </div>
    </div>

    <div class="tile sm s1">
      <div class="ph"><img src="{{PRODUCT_IMAGE}}" alt=""><div class="fav"><svg viewBox="0 0 24 24"><path d="M12 20.3s-7.6-4.6-7.6-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.7c0 5.6-7.6 10.2-7.6 10.2z" fill="none" stroke="#17140F" stroke-width="1.6"/></svg></div><div class="idx">02</div></div>
      <div class="cap"><div class="nm">Look 02</div><div class="pr">€89<s>€110</s></div></div>
    </div>

    <div class="tile sm s2">
      <div class="ph"><img src="{{PRODUCT_IMAGE}}" alt=""><div class="fav"><svg viewBox="0 0 24 24"><path d="M12 20.3s-7.6-4.6-7.6-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.7c0 5.6-7.6 10.2-7.6 10.2z" fill="none" stroke="#17140F" stroke-width="1.6"/></svg></div><div class="idx">03</div></div>
      <div class="cap"><div class="nm">Look 03</div><div class="pr">€74<s>€95</s></div></div>
    </div>

    <div class="tile promo">
      <small>Members only</small>
      <div class="big">−20%<i>on the whole edit</i></div>
      <div class="txt"><span class="code">EDIT20</span></div>
    </div>
  </div>
</div>
</body>
</html>
