<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Little Footsteps — a walk in wet sand: a trail of big bare footprints and, beside them, a trail of small ones
     taking twice as many steps, pressed into a sand panel next to the copy ("Follow in their footsteps").
     tall → photo above the sand panel, trail on the right; square/wide → photo left, copy + trail right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #E3D5BD; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #E3D5BD; color: #2E241A; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; }
  .sand { position: absolute; inset: 0; background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.28) 0 .12vmin, transparent .18vmin) 0 0 / 1.1vmin 1.1vmin,
    radial-gradient(circle at 60% 70%, rgba(94,70,44,.16) 0 .12vmin, transparent .18vmin) 0 0 / 1.5vmin 1.5vmin,
    radial-gradient(ellipse at 80% 100%, rgba(255,255,255,.3), transparent 60%); }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 72vmin); object-fit: cover; object-position: 50% 22%; }

  /* footprint trail */
  .trail { position: absolute; right: 5vmin; width: 26vmin; top: calc(100% - 72vmin + 6vmin); bottom: 6vmin; }
  .fp { position: absolute; top: var(--t); left: var(--l); width: var(--w); height: calc(var(--w) * 2.25); transform: rotate(var(--r, 0deg)); }
  .fp svg { display: block; width: 100%; height: 100%; }
  .fp.R svg { transform: scaleX(-1); }
  .big { --w: 6.4vmin; } .small { --w: 3.6vmin; }
  .fp use { fill: rgba(96,70,42,.3); }
  .trail .lab { position: absolute; font-size: 1.6vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; color: #6B5539; }
  .lab.a { left: 0; bottom: -4vmin; } .lab.b { right: 0; bottom: -4vmin; }

  .copy { position: absolute; left: 6vmin; right: 36vmin; top: calc(100% - 72vmin + 6vmin); bottom: 6vmin; display: flex; flex-direction: column; }
  .k { font-size: 1.7vmin; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
  .k::after { content: ""; display: block; width: 7vmin; margin-top: 1.8vmin; border-top: .3vmin solid #B0532E; }
  h1 { margin: 2.6vmin 0 0; font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 9.6vmin; line-height: .98; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #B0532E; }
  .p { margin-top: 2.6vmin; font-size: 2.4vmin; line-height: 1.45; }
  .foot { margin-top: auto; }
  .offer { font-size: 2.3vmin; line-height: 1.35; }
  .offer b { font-weight: 700; color: #B0532E; }
  .cta { display: inline-block; margin-top: 2.4vmin; background: #2E241A; color: #F3EADA; padding: 1.9vmin 3.2vmin; font-size: 2.1vmin; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }

  /* 2:3 */
  @media (min-aspect-ratio: 5/8) {
    .photo { height: calc(100% - 64vmin); }
    .trail, .copy { top: calc(100% - 64vmin + 5vmin); bottom: 5vmin; }
    h1 { font-size: 8.6vmin; margin-top: 2vmin; }
    .p { display: none; }
  }
  /* 3:4 / 4:5 → photo left, copy + trail right */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 26%; }
    .copy { left: calc(50% + 5vmin); right: 5vmin; top: 6vmin; bottom: auto; }
    .p { display: block; font-size: 2.2vmin; }
    .foot { margin-top: 3vmin; }
    .trail { right: 7vmin; width: 30vmin; top: auto; height: 52vmin; bottom: 9vmin; }
    h1 { font-size: 7.6vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 44%; }
    .copy { left: calc(44% + 5vmin); right: 22vmin; top: 7vmin; bottom: 7vmin; }
    .foot { margin-top: auto; }
    .trail { right: 4vmin; width: 16vmin; top: 7vmin; bottom: 10vmin; height: auto; }
    .big { --w: 4.4vmin; } .small { --w: 2.6vmin; }
    h1 { font-size: 6.6vmin; }
    .p { font-size: 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 42%; }
    .copy { left: calc(42% + 7vmin); right: 38vmin; top: 8vmin; bottom: 8vmin; }
    .trail { right: 7vmin; width: 25vmin; top: 7vmin; bottom: 11vmin; }
    .big { --w: 6vmin; } .small { --w: 3.4vmin; }
    h1 { font-size: 8.4vmin; }
    .p { font-size: 2.3vmin; }
  }

  /* ───────── motion (6 s loop · t=0 = static design) — a walk along the shoreline ─────────
     0.6 s a thin sheet of surf washes over the sand and smooths the prints away, recedes by 1.9 s,
     then the walk replays bottom → top: the big feet press in every 0.6 s while the little ones take two steps
     for each (every 0.3 s), both arriving together at 3.8 s · 4.4 s "their footsteps." wipes out & back ·
     5.2 s a glint crosses the CTA */
  .trail::before { content: ""; position: absolute; inset: -4vmin -3vmin; pointer-events: none; z-index: 2; -webkit-mask-image: radial-gradient(70% 90% at 50% 50%, #000 55%, transparent 100%); mask-image: radial-gradient(70% 90% at 50% 50%, #000 55%, transparent 100%);
    background: linear-gradient(0deg, rgba(246,240,228,0) 0%, rgba(246,240,228,.55) 18%, rgba(250,247,240,.62) 62%, rgba(255,255,255,.95) 70%, rgba(255,255,255,.35) 74%, rgba(255,255,255,0) 82%);
    opacity: 0; transform: translateY(40%); animation: surf 6s cubic-bezier(.45,0,.4,1) infinite; }
  @keyframes surf {
    0%, 9% { opacity: 0; transform: translateY(40%); }
    17% { opacity: 1; transform: translateY(0); }
    23% { opacity: .9; transform: translateY(-2%); }
    32%, 100% { opacity: 0; transform: translateY(30%); }
  }
  .trail .fp { animation: fp1 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes fp1 { 0%, 15%, 38.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 33.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 35.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp2 { 0%, 15%, 48.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 43.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 45.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp3 { 0%, 15%, 58.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 53.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 55.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp4 { 0%, 15%, 68.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 63.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 65.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp5 { 0%, 15%, 38.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 33.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 35.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp6 { 0%, 15%, 43.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 38.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 40.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp7 { 0%, 15%, 48.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 43.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 45.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp8 { 0%, 15%, 53.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 48.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 50.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp9 { 0%, 15%, 58.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 53.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 55.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp10 { 0%, 15%, 63.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 58.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 60.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  @keyframes fp11 { 0%, 15%, 68.33%, 100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } 20%, 63.33% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(1.18); } 65.33% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(.94); } }
  .trail .fp:nth-child(1) { animation-name: fp1; }
  .trail .fp:nth-child(2) { animation-name: fp2; }
  .trail .fp:nth-child(3) { animation-name: fp3; }
  .trail .fp:nth-child(4) { animation-name: fp4; }
  .trail .fp:nth-child(5) { animation-name: fp5; }
  .trail .fp:nth-child(6) { animation-name: fp6; }
  .trail .fp:nth-child(7) { animation-name: fp7; }
  .trail .fp:nth-child(8) { animation-name: fp8; }
  .trail .fp:nth-child(9) { animation-name: fp9; }
  .trail .fp:nth-child(10) { animation-name: fp10; }
  .trail .fp:nth-child(11) { animation-name: fp11; }

  h1 em { display: inline-block; animation: wipe 6s cubic-bezier(.7,0,.2,1) infinite; }
  @keyframes wipe {
    0%, 72%, 100% { clip-path: inset(-12% -4% -20% 0); transform: translateX(0); }
    77% { clip-path: inset(-12% 104% -20% 0); transform: translateX(0); }
    78% { clip-path: inset(-12% -4% -20% 100%); transform: translateX(-1.4vmin); }
    86% { clip-path: inset(-12% -4% -20% 0); transform: translateX(0); }
  }
  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(243,234,218,.35) 50%, transparent 80%);
    transform: translateX(-120%); animation: glint 6s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes glint { 0%, 86%, 100% { transform: translateX(-120%); } 98% { transform: translateX(330%); } 98.1% { transform: translateX(-120%); } }
</style>
</head>
<body>
<div class="banner">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="foot">
        <path d="M21 89C12 89 9.5 80 10 69 10.5 57 7 47 7.5 37 8 26 13.5 21 21.5 21 30 21 33.5 28 33 38 32.5 48 29 57 29.5 68 30 79 29 89 21 89Z"/>
        <circle cx="27.5" cy="11" r="5.4"/><circle cx="18.5" cy="8" r="3.7"/><circle cx="11.5" cy="9.5" r="3.2"/><circle cx="6.2" cy="13.6" r="2.7"/><circle cx="3" cy="19.5" r="2.3"/>
      </g>
    </defs>
  </svg>
  <div class="sand"></div>
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="trail">
    <div class="fp big L" style="--t:70%;--l:4%;--r:-6deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp big R" style="--t:48%;--l:30%;--r:5deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp big L" style="--t:26%;--l:4%;--r:-4deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp big R" style="--t:4%;--l:30%;--r:6deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp small L" style="--t:82%;--l:68%;--r:-8deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp small R" style="--t:73%;--l:84%;--r:6deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp small L" style="--t:60%;--l:68%;--r:-5deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp small R" style="--t:47%;--l:84%;--r:8deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp small L" style="--t:34%;--l:68%;--r:-7deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp small R" style="--t:21%;--l:84%;--r:5deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="fp small L" style="--t:8%;--l:68%;--r:-6deg"><svg viewBox="0 0 36 92"><use href="#foot"/></svg></div>
    <div class="lab a">Big</div><div class="lab b">Little</div>
  </div>
  <div class="copy">
    <div class="k">The Family Edit · SS27</div>
    <h1>Follow in <em>their footsteps.</em></h1>
    <div class="p">One look, walked in two sizes — for the grown-up in front and the little one keeping up.</div>
    <div class="foot">
      <div class="offer">Matching family sets<br><b>15% off</b> with code STEPS15</div>
      <div class="cta">Shop the edit</div>
    </div>
  </div>
</div>
</body>
</html>
