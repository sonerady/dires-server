<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Pressed Compact — an open powder compact seen from above: the mirror reflects a detail of the look,
     the pressed-powder pan carries the offer debossed into it (with a finger swipe).
     tall → photo above, compact open sideways; square → photo left, compact open upright; wide → photo left, compact sideways */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EAD8CF; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #3B2620; font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(100% 70% at 50% 85%, #F2E3DA 0%, #EAD8CF 55%, #E0CBC0 100%); --d: 40vmin; --rim: 1.6vmin; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 50%; object-fit: cover; object-position: 50% 22%; }

  .panel { position: absolute; left: 6vmin; right: 6vmin; top: calc(50% + 4.6vmin); bottom: 4.4vmin; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
  .kick { font-size: 1.8vmin; font-weight: 500; letter-spacing: .34em; margin-right: -.34em; text-transform: uppercase; color: #8A6557; }
  h1 { margin: 1.2vmin 0 0; font-family: "Poiret One", "Didot", Georgia, serif; font-weight: 400; font-size: 9.6vmin; line-height: 1; letter-spacing: .02em; white-space: nowrap; }

  .compact { display: flex; align-items: center; flex: none; }
  .rim { width: var(--d); height: var(--d); box-sizing: border-box; padding: var(--rim); border-radius: 50%; flex: none;
    background: conic-gradient(from 20deg, #B38B47, #F3DDA2, #A87F3C, #EBD197, #9C7434, #F6E3AE, #B38B47);
    box-shadow: 0 1.4vmin 2.6vmin rgba(90,50,35,.28), inset 0 0 0 .3vmin rgba(255,240,210,.35); }
  .hinge { width: 3.4vmin; height: 7vmin; flex: none; margin: 0 -.4vmin; background: linear-gradient(90deg, #9C7434, #F3DDA2 50%, #9C7434); box-shadow: 0 .6vmin 1vmin rgba(90,50,35,.25); z-index: 1; }
  .mir { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #CFC6C0; box-shadow: inset 0 0 0 .4vmin rgba(60,40,30,.35); }
  .mir img { position: absolute; left: -35%; top: -20%; width: 170%; height: 170%; object-fit: cover; object-position: 50% 30%; }
  .mir::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(125deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.28) 38%, rgba(255,255,255,0) 46%, rgba(255,255,255,0) 58%, rgba(255,255,255,.14) 62%, rgba(255,255,255,0) 66%); }
  .pan { position: relative; width: 100%; height: 100%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(38% 22% at 64% 70%, rgba(255,236,226,.55), rgba(255,236,226,0)),
      repeating-radial-gradient(circle at 50% 50%, rgba(150,90,70,.07) 0 .25vmin, rgba(150,90,70,0) .25vmin .9vmin),
      radial-gradient(circle at 38% 32%, #F2CFBE 0%, #E2B19C 60%, #D09A84 100%);
    box-shadow: inset 0 .8vmin 1.4vmin rgba(110,60,45,.35), inset 0 -.4vmin .8vmin rgba(255,230,215,.5); }
  .pan b { font-family: "Jost", sans-serif; font-weight: 700; font-size: calc(var(--d) * .3); line-height: .9; letter-spacing: -.03em; color: rgba(158,98,78,.62);
    text-shadow: 0 .22vmin 0 rgba(255,232,220,.85), 0 -.18vmin 0 rgba(110,58,42,.35); }
  .pan span { margin-top: .6vmin; font-family: "Poiret One", serif; font-size: calc(var(--d) * .1); letter-spacing: .3em; margin-right: -.3em; color: rgba(140,84,66,.75);
    text-shadow: 0 .16vmin 0 rgba(255,232,220,.8); }

  .foot { font-size: 2.1vmin; letter-spacing: .12em; color: #5E433A; white-space: nowrap; }
  .foot b { font-weight: 500; letter-spacing: .24em; text-transform: uppercase; padding: .9vmin 1.8vmin; border: 1px solid #8A6557; margin-left: 1.6vmin; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: 50%; }
    .panel { top: calc(50% + 3.6vmin); bottom: 3.6vmin; }
    .banner { --d: 33vmin; }
    h1 { font-size: 8.4vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; height: 100%; object-position: 50% 25%; }
    .panel { left: calc(46% + 4vmin); right: 4vmin; top: 5vmin; bottom: 4.4vmin; }
    .banner { --d: 30vmin; --rim: 1.2vmin; }
    .compact { flex-direction: column; }
    .hinge { width: 7vmin; height: 3vmin; margin: -.4vmin 0; background: linear-gradient(180deg, #9C7434, #F3DDA2 50%, #9C7434); }
    h1 { font-size: 6.6vmin; }
    .kick { font-size: 1.6vmin; }
    .foot { display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; font-size: 1.9vmin; }
    .foot b { margin-left: 0; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 42%; }
    .panel { left: calc(42% + 6vmin); right: 6vmin; top: 7vmin; bottom: 6.4vmin; }
    .banner { --d: 40vmin; --rim: 1.6vmin; }
    .compact { flex-direction: row; }
    .hinge { width: 3.4vmin; height: 7vmin; margin: 0 -.4vmin; background: linear-gradient(90deg, #9C7434, #F3DDA2 50%, #9C7434); }
    h1 { font-size: 8.4vmin; }
    .kick { font-size: 1.8vmin; }
    .foot { display: block; font-size: 2.1vmin; }
    .foot b { margin-left: 1.6vmin; }
  }
  /* ── animated loop (6s) ── the compact lid closes on its hinge and flips back open with a soft bounce,
     a glint crosses the mirror, the pressed "30%" catches the light and punches */
  .compact > .rim:first-child { transform-origin: 100% 50%; animation: pcLid 6s linear infinite; }
  @keyframes pcLid {
    0%, 6% { transform: perspective(80vmin) rotateY(0deg); animation-timing-function: cubic-bezier(.55,0,.4,1); }
    20%, 26% { transform: perspective(80vmin) rotateY(72deg); animation-timing-function: cubic-bezier(.3,0,.3,1.3); }
    40%, 100% { transform: perspective(80vmin) rotateY(0deg); }
  }
  @media (min-aspect-ratio: 9/10) {
    .compact > .rim:first-child { transform-origin: 50% 100%; animation-name: pcLidV; }
    @keyframes pcLidV {
      0%, 6% { transform: perspective(80vmin) rotateX(0deg); animation-timing-function: cubic-bezier(.55,0,.4,1); }
      20%, 26% { transform: perspective(80vmin) rotateX(-72deg); animation-timing-function: cubic-bezier(.3,0,.3,1.3); }
      40%, 100% { transform: perspective(80vmin) rotateX(0deg); }
    }
  }
  @media (min-aspect-ratio: 6/5) {
    .compact > .rim:first-child { transform-origin: 100% 50%; animation-name: pcLid; }
  }
  .mir::before { content: ""; position: absolute; inset: -10%; z-index: 2; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.5) 48%, rgba(255,255,255,0) 58%) 100% 0 / 300% 100% no-repeat;
    animation: pcGlint 6s linear infinite; }
  @keyframes pcGlint { 0%, 44% { background-position: 100% 0; animation-timing-function: cubic-bezier(.45,0,.3,1); } 62%, 100% { background-position: 0% 0; } }
  .pan b, .pan span { animation: pcPress 6s linear infinite; }
  @keyframes pcPress {
    0%, 64% { transform: none; filter: brightness(1); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
    67% { transform: scale(.93); filter: brightness(.95); animation-timing-function: cubic-bezier(.2,.9,.3,1); }
    72% { transform: scale(1.06); filter: brightness(1.12); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    80%, 100% { transform: none; filter: brightness(1); }
  }
  .pan span { animation-delay: -.12s; }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div>
      <div class="kick">Studio Oro · The compact edit</div>
      <h1>Touch-up sale</h1>
    </div>
    <div class="compact">
      <div class="rim"><div class="mir"><img src="{{PRODUCT_IMAGE}}" alt=""></div></div>
      <div class="hinge"></div>
      <div class="rim"><div class="pan"><b>30%</b><span>OFF</span></div></div>
    </div>
    <div class="foot">Pocket-sized prices, 48 hours only <b>COMPACT30</b></div>
  </div>
</div>
</body>
</html>
