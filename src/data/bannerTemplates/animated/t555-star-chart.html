<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Star Chart — an observatory plate: navy sky with right-ascension grid and declination arcs, a hand-plotted
     constellation, crosshair registration marks round the photo (the "observed object") and mono coordinates.
     tall → header, plate, copy + constellation below · 3:4 → plate left, constellation + copy right
     · square → constellation + copy left, plate right · wide → copy left, constellation mid, plate right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0B1426; }
  .banner { --txt: #E6ECF5; --ice: #A9C6F0; --dim: #7F8DA6;
    position: fixed; inset: 0; overflow: hidden; color: var(--txt); font-family: "IBM Plex Mono", Menlo, monospace;
    background:
      repeating-radial-gradient(circle at 50% -60vmin, transparent 0 calc(14vmin - 1px), rgba(169,198,240,.12) calc(14vmin - 1px) 14vmin),
      repeating-linear-gradient(90deg, transparent 0 calc(12vmin - 1px), rgba(169,198,240,.08) calc(12vmin - 1px) 12vmin),
      radial-gradient(ellipse 90% 70% at 70% 30%, #16264A 0%, #0E1B33 50%, #0B1426 100%); }
  .dots { position: absolute; inset: 0;
    background:
      radial-gradient(circle, rgba(255,255,255,.85) 0 .12vmin, transparent .24vmin) 3vmin 5vmin / 17vmin 23vmin,
      radial-gradient(circle, rgba(255,255,255,.5) 0 .1vmin, transparent .2vmin) 11vmin 2vmin / 13vmin 11vmin,
      radial-gradient(circle, rgba(200,220,255,.9) 0 .18vmin, transparent .34vmin) 7vmin 14vmin / 31vmin 37vmin; }

  .hdr { position: absolute; left: 7vmin; right: 7vmin; top: 4.4vmin; display: flex; justify-content: space-between; gap: 2vmin; font-size: 1.6vmin; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .hdr b { font-weight: 500; color: var(--ice); }
  .plate { position: absolute; left: 9vmin; right: 9vmin; top: 12vmin; bottom: 60vmin; }
  .plate img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; display: block; }
  .plate::before { content: ""; position: absolute; inset: -2.2vmin; pointer-events: none;
    background:
      linear-gradient(var(--ice), var(--ice)) left top / 4vmin 1px no-repeat, linear-gradient(var(--ice), var(--ice)) left top / 1px 4vmin no-repeat,
      linear-gradient(var(--ice), var(--ice)) right top / 4vmin 1px no-repeat, linear-gradient(var(--ice), var(--ice)) right top / 1px 4vmin no-repeat,
      linear-gradient(var(--ice), var(--ice)) left bottom / 4vmin 1px no-repeat, linear-gradient(var(--ice), var(--ice)) left bottom / 1px 4vmin no-repeat,
      linear-gradient(var(--ice), var(--ice)) right bottom / 4vmin 1px no-repeat, linear-gradient(var(--ice), var(--ice)) right bottom / 1px 4vmin no-repeat; }
  .plate::after { content: ""; position: absolute; right: 4vmin; bottom: -4.6vmin; width: 1px; height: 2.4vmin; background: var(--ice); }
  .tag { position: absolute; left: 0; bottom: -5.2vmin; font-size: 1.6vmin; letter-spacing: .1em; color: var(--dim); white-space: nowrap; }

  .const { position: absolute; right: 6vmin; bottom: 8vmin; width: 30vmin; height: 36vmin; }
  .const svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .cname { position: absolute; right: 6vmin; bottom: 4.4vmin; font-size: 1.6vmin; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .cname i { font-family: "Bodoni Moda", serif; font-size: 2.2vmin; letter-spacing: 0; text-transform: none; color: var(--ice); }

  .copy { position: absolute; left: 7vmin; width: 54vmin; bottom: 6vmin; display: flex; flex-direction: column; align-items: flex-start; }
  .kick { font-size: 1.6vmin; letter-spacing: .16em; text-transform: uppercase; color: var(--ice); white-space: nowrap; }
  h1 { margin: 2vmin 0 0; font-family: "Bodoni Moda", Didot, serif; font-weight: 400; font-size: 7.6vmin; line-height: 1; letter-spacing: -.02em; }
  h1 i { font-weight: 500; }
  .offer { margin-top: 2.6vmin; font-size: 1.8vmin; line-height: 1.5; color: #C4CEDD; }
  .offer b { font-weight: 500; color: var(--txt); }
  .cta { margin-top: 2.6vmin; padding: 1.5vmin 3vmin; border: 1px solid var(--ice); color: var(--txt); font-size: 1.7vmin; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .hdr { left: 60vmin; right: 5vmin; flex-direction: column; gap: .8vmin; top: 6vmin; }
    .plate { left: 7vmin; right: auto; width: 45vmin; top: 7vmin; bottom: 11vmin; }
    .const { left: 62vmin; right: auto; top: 16vmin; bottom: auto; width: 26vmin; height: 30vmin; }
    .cname { display: none; }
    .copy { left: 60vmin; width: 35vmin; bottom: 6vmin; }
    h1 { font-size: 5.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .hdr { left: 6vmin; right: auto; width: calc(50% - 10vmin); top: 6vmin; flex-direction: column; gap: .8vmin; }
    .plate { left: auto; right: 7vmin; width: calc(50% - 4vmin); top: 7vmin; bottom: 12vmin; }
    .const { left: 8vmin; right: auto; top: 17vmin; bottom: auto; width: 22vmin; height: 26vmin; }
    .copy { left: 6vmin; width: calc(50% - 10vmin); bottom: 6vmin; }
    h1 { font-size: 5.8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .hdr { left: 7vmin; width: calc(54% - 14vmin); top: 7vmin; }
    .plate { right: 8vmin; width: 44%; top: 8vmin; bottom: 13vmin; }
    .const { left: auto; right: calc(44% + 14vmin); top: 16vmin; width: 26vmin; height: 31vmin; }
    .cname { display: block; left: auto; right: calc(44% + 14vmin); bottom: auto; top: 49vmin; }
    .copy { left: 7vmin; width: calc(54% - 32vmin); min-width: 40vmin; bottom: 7vmin; }
    h1 { font-size: 7.4vmin; }
  }
  /* ───────────── motion (6 s loop · t=0 = static design) ───────────── */
  .dots { animation: twinkle 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  /* the constellation's dashed lines flow star to star (one dash period per 1.5 s — seamless) */
  .const polyline { animation: flow 1.5s linear infinite; }
  @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -2.8; } }
  .const g circle { transform-box: fill-box; transform-origin: center; animation: star 3s cubic-bezier(.45,0,.55,1) infinite; }
  .const g circle:nth-child(2) { animation-delay: -.4s; } .const g circle:nth-child(3) { animation-delay: -.9s; } .const g circle:nth-child(4) { animation-delay: -1.3s; }
  .const g circle:nth-child(5) { animation-delay: -1.8s; } .const g circle:nth-child(6) { animation-delay: -2.2s; } .const g circle:nth-child(7) { animation-delay: -2.6s; }
  @keyframes star { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  /* the observed star flares and turns; its ring pings */
  .const path { transform-box: fill-box; transform-origin: center; animation: flare 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes flare { 0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 0 rgba(200,220,255,0)); }
    12% { transform: scale(1.35) rotate(45deg); filter: drop-shadow(0 0 2px rgba(200,220,255,.9)); } 30% { transform: scale(1) rotate(90deg); filter: drop-shadow(0 0 0 rgba(200,220,255,0)); } 30.01%, 99.99% { transform: scale(1) rotate(0deg); } }
  .const svg > circle { transform-box: fill-box; transform-origin: center; animation: ring 6s cubic-bezier(.2,.6,.3,1) infinite; }
  @keyframes ring { 0%, 6% { opacity: 1; transform: scale(1); } 7% { opacity: 1; transform: scale(1); } 40% { opacity: 0; transform: scale(1.9); } 41% { opacity: 0; transform: scale(1); } 60%, 100% { opacity: 1; transform: scale(1); } }

  /* registration marks lock on to the plate, and a faint scan line reads it */
  .plate::before { animation: lock 6s cubic-bezier(.6,0,.2,1) infinite; }
  @keyframes lock { 0%, 44%, 100% { inset: -2.2vmin; opacity: 1; } 52% { inset: -3.4vmin; opacity: .5; } 60% { inset: -1.4vmin; opacity: 1; } 68% { inset: -2.2vmin; } }
  .plate { overflow: visible; }
  .plate .scan { position: absolute; left: 0; right: 0; top: 0; height: 12%; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg, rgba(169,198,240,0), rgba(169,198,240,.16) 90%, rgba(200,220,255,.7) 100%);
    animation: scan 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes scan { 0%, 50% { opacity: 0; transform: translateY(-100%); } 54% { opacity: 1; } 84% { opacity: 1; transform: translateY(740%); } 88%, 100% { opacity: 0; transform: translateY(740%); } }
  h1 i { animation: bright 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes bright { 0%, 4%, 34%, 100% { text-shadow: 0 0 0 rgba(200,220,255,0); } 14% { text-shadow: 0 0 2.4vmin rgba(200,220,255,.65); } }
</style>
</head>
<body>
<div class="banner">
  <div class="dots"></div>
  <div class="hdr"><span>Plate <b>No. 14</b> · Northern sky</span><span>RA 14h 29m · Dec +42°</span></div>
  <div class="const">
    <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <polyline points="12,18 34,30 46,58 30,84 58,104 86,92" fill="none" stroke="#A9C6F0" stroke-opacity=".55" stroke-width=".5" stroke-dasharray="1.6 1.2"/>
      <polyline points="46,58 76,50 90,24" fill="none" stroke="#A9C6F0" stroke-opacity=".55" stroke-width=".5" stroke-dasharray="1.6 1.2"/>
      <circle cx="46" cy="58" r="9" fill="none" stroke="#A9C6F0" stroke-opacity=".5" stroke-width=".4"/>
      <g fill="#EAF1FF"><circle cx="12" cy="18" r="1.2"/><circle cx="34" cy="30" r="1.6"/><circle cx="30" cy="84" r="1.3"/><circle cx="58" cy="104" r="1.8"/><circle cx="86" cy="92" r="1.1"/><circle cx="76" cy="50" r="1.4"/><circle cx="90" cy="24" r="1"/></g>
      <path d="M46 49 C46.8 56 48 57.2 55 58 C48 58.8 46.8 60 46 67 C45.2 60 44 58.8 37 58 C44 57.2 45.2 56 46 49Z" fill="#FFFFFF"/>
    </svg>
  </div>
  <div class="cname">Const. <i>Vestis</i></div>
  <div class="plate"><img src="{{PRODUCT_IMAGE}}" alt=""><i class="scan"></i><span class="tag">Obj. 01 — new arrival · mag. −4.6</span></div>
  <div class="copy">
    <div class="kick">Observatoire Nuit</div>
    <h1>Spotted: the season's <i>brightest.</i></h1>
    <div class="offer"><b>−25% launch night</b><br>21:00 – 00:00 · online only</div>
    <div class="cta">Observe it now</div>
  </div>
</div>
</body>
</html>
