<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Travel Guide — the edit as a cloth-bound destination guide: woven terracotta cloth, a hinge groove along the spine,
     a butter-yellow ribbon marker, foil-blocked series line and city title, a tipped-in photo plate, a chapter index.
     tall → title above the plate, index below; square / wide → title + index left, plate right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #B0513A; }
  .banner { --cloth: #B0513A; --foil: #F5E3B5; --dark: #7E3322; --rib: #F2C94C;
    position: fixed; inset: 0; overflow: hidden; color: var(--foil); font-family: "Jost", "Futura", "Helvetica Neue", sans-serif;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px .45vmin),
      repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px .45vmin),
      radial-gradient(130% 90% at 60% 30%, #BC5C43 0%, var(--cloth) 55%, #9B4431 100%); }
  .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 6vmin; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,.12) 60%, rgba(0,0,0,.04)); }
  .spine::after { content: ""; position: absolute; right: -1.4vmin; top: 0; bottom: 0; width: 1.4vmin; background: linear-gradient(90deg, rgba(0,0,0,.26), rgba(255,255,255,.08) 55%, rgba(0,0,0,0)); }
  .ribbon { position: absolute; right: 10vmin; top: 0; width: 3.8vmin; height: 24vmin; background: linear-gradient(90deg, #E2B535, var(--rib) 40%, #F7D774 60%, #E2B535); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); filter: drop-shadow(0 .3vmin .4vmin rgba(0,0,0,.3)); }
  .head { position: absolute; left: 12vmin; right: 18vmin; top: 7vmin; }
  .series { display: flex; align-items: center; gap: 1.8vmin; font-weight: 500; font-size: 1.8vmin; letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
  .series i { font-style: normal; font-family: "DM Serif Display", Georgia, serif; font-size: 2.4vmin; letter-spacing: .04em; }
  .series::after { content: ""; flex: 1; height: 1px; background: rgba(245,227,181,.6); }
  .title { margin-top: 2vmin; font-family: "DM Serif Display", Georgia, serif; font-size: 21vmin; line-height: .86; letter-spacing: -.02em; text-shadow: 0 .25vmin 0 rgba(90,30,15,.35); }
  .sub { margin-top: 2.2vmin; font-size: 2.4vmin; letter-spacing: .02em; color: #F9EBCB; }
  .sub i { font-family: "DM Serif Display", Georgia, serif; font-size: 2.8vmin; }
  .medal { display: none; position: absolute; width: 17vmin; height: 17vmin; box-sizing: border-box; border-radius: 50%; border: .35vmin solid var(--foil); flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .medal::before { content: ""; position: absolute; inset: 1.1vmin; border-radius: 50%; border: 1px dashed rgba(245,227,181,.7); }
  .medal b { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 3.4vmin; line-height: 1; }
  .medal small { margin-top: .8vmin; font-size: 1.6vmin; letter-spacing: .2em; text-transform: uppercase; line-height: 1.3; }
  .plate { position: absolute; left: 12vmin; right: 7vmin; top: 50vmin; bottom: 27vmin; box-shadow: 0 .8vmin 1.6vmin rgba(60,15,5,.35), 0 0 0 1px rgba(60,15,5,.2); }
  .plate img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .cap { position: absolute; left: 12vmin; right: 7vmin; bottom: 22.6vmin; display: flex; justify-content: space-between; font-size: 1.6vmin; letter-spacing: .18em; text-transform: uppercase; color: #F9EBCB; white-space: nowrap; }
  .idx { position: absolute; left: 12vmin; right: 7vmin; bottom: 5vmin; border-top: 1px solid rgba(245,227,181,.55); }
  .ch { display: flex; justify-content: space-between; gap: 2vmin; padding: 1.8vmin 0 1.6vmin; border-bottom: 1px solid rgba(245,227,181,.55); }
  .ch div { display: flex; align-items: baseline; gap: 1vmin; font-family: "DM Serif Display", Georgia, serif; font-size: 3vmin; white-space: nowrap; }
  .ch small { font-family: "Jost", sans-serif; font-size: 1.6vmin; letter-spacing: .1em; opacity: .85; }
  .buy { display: flex; justify-content: space-between; align-items: center; gap: 2vmin; padding-top: 2vmin; font-size: 1.9vmin; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .buy b { font-weight: 500; background: var(--foil); color: var(--dark); padding: 1.1vmin 2.2vmin; letter-spacing: .2em; }

  @media (min-aspect-ratio: 7/10) {
    .head { top: 5.6vmin; }
    .title { font-size: 17vmin; }
    .plate { top: 41vmin; bottom: 25vmin; }
    .cap { bottom: 21vmin; }
    .idx { bottom: 4vmin; }
    .ch { padding: 1.4vmin 0 1.2vmin; }
    .ribbon { height: 20vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .spine { width: 5vmin; }
    .ribbon { right: auto; left: 45.4vmin; width: 3vmin; height: 20vmin; }
    .head { left: 10vmin; right: auto; width: 33vmin; top: 7vmin; }
    .series { font-size: 1.6vmin; letter-spacing: .22em; }
    .title { font-size: 11.6vmin; margin-top: 3vmin; }
    .sub { font-size: 2.1vmin; line-height: 1.45; }
    .plate { left: 50%; right: 6vmin; top: 6vmin; bottom: 10vmin; }
    .cap { left: 50%; right: 6vmin; bottom: 5.4vmin; font-size: 1.6vmin; letter-spacing: .12em; }
    .idx { left: 10vmin; right: auto; width: 36vmin; bottom: 6vmin; }
    .ch { flex-direction: column; gap: .8vmin; padding: 1.6vmin 0; }
    .ch div { font-size: 2.8vmin; }
    .buy { flex-direction: column; align-items: flex-start; gap: 1.6vmin; font-size: 1.7vmin; }
    .medal { display: flex; left: 10vmin; top: 48vmin; transform: rotate(-8deg); }
  }
  @media (min-aspect-ratio: 6/5) {
    .ribbon { left: 69vmin; width: 3.8vmin; height: 26vmin; }
    .head { left: 12vmin; width: 52vmin; top: 9vmin; }
    .series { font-size: 1.8vmin; letter-spacing: .3em; }
    .title { font-size: 17vmin; }
    .sub { font-size: 2.4vmin; }
    .plate { left: 52%; right: 7vmin; top: 7vmin; bottom: 12vmin; }
    .cap { left: 52%; right: 7vmin; bottom: 7vmin; font-size: 1.7vmin; }
    .idx { left: 12vmin; width: 54vmin; bottom: 7vmin; }
    .ch { flex-direction: row; gap: 2vmin; padding: 1.8vmin 0 1.6vmin; }
    .ch div { font-size: 3vmin; }
    .buy { flex-direction: row; align-items: center; font-size: 1.9vmin; }
    .medal { left: 49vmin; top: 50vmin; width: 18vmin; height: 18vmin; }
  }

  /* ───────── motion (6s loop, t=0 = the static cover) — slow, bookish ─────────
     constant: the ribbon marker sways (3s), the medal's dashed ring turns, the plate breathes (≤1.03)
     beats: 0.9s a light catches the foil-blocked title and travels across it · 2.6–3.8s the chapter index reads
            01 → 02 → 03 (each lifts and brightens) · 4.8s sheen over "Open the guide" */
  .title { text-shadow: none; filter: drop-shadow(0 .25vmin 0 rgba(90,30,15,.35)); }
  .title span { display: block; background: linear-gradient(100deg, var(--foil) 0 37%, #FFF6DC 45%, #FFFFFF 50%, #FFF6DC 55%, var(--foil) 63% 100%) 100% 0 / 320% 100% no-repeat;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: foil 6s linear infinite; }
  @keyframes foil {
    0%, 12% { background-position: 100% 0; animation-timing-function: cubic-bezier(.45,0,.35,1); }
    38%, 100% { background-position: 0% 0; }
  }
  .ribbon { transform-origin: 50% 0; animation: sway 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1.6deg); } }
  .medal::before { animation: turn 6s linear infinite; }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .plate { overflow: hidden; }
  .plate img { animation: breathe 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .ch div { animation: read 6s linear infinite; }
  .ch div:nth-child(2) { animation-delay: -5.6s; }
  .ch div:nth-child(3) { animation-delay: -5.2s; }
  @keyframes read {
    0%, 42% { transform: translateY(0); color: var(--foil); text-shadow: 0 0 0 rgba(255,240,200,0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    46% { transform: translateY(-.6vmin); color: #FFFDF4; text-shadow: 0 0 1.4vmin rgba(255,236,180,.55); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    56%, 100% { transform: translateY(0); color: var(--foil); text-shadow: 0 0 0 rgba(255,240,200,0); }
  }
  .buy b { position: relative; overflow: hidden; }
  .buy b::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 35%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.6), rgba(255,255,255,0));
    transform: translateX(-150%) skewX(-18deg); animation: sheen 6s linear infinite; }
  @keyframes sheen {
    0%, 78% { transform: translateX(-150%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    92%, 100% { transform: translateX(350%) skewX(-18deg); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="spine"></div>
  <div class="head">
    <div class="series"><span>The Resort Guides</span><i>No. 07</i></div>
    <div class="title"><span>Amalfi</span></div>
    <div class="sub"><i>Where to wear</i> the new collection, chapter by chapter.</div>
  </div>
  <div class="medal"><b>Vol. VII</b><small>Resort<br>2027</small></div>
  <div class="plate"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="cap"><span>Plate I</span><span>Resort 2027</span></div>
  <div class="idx">
    <div class="ch"><div><small>01</small>Positano</div><div><small>02</small>Ravello</div><div><small>03</small>Capri</div></div>
    <div class="buy"><span>48 looks · from €39</span><b>Open the guide →</b></div>
  </div>
  <div class="ribbon"></div>
</div>
</body>
</html>
