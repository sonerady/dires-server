<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Cyber Monday — a desktop of its own: the look opens in a window, the offer runs as code in a terminal */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #E3E3DE; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #E3E3DE; color: #0C0C0C; font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    background-image: radial-gradient(rgba(12,12,12,.16) 12%, transparent 13%); background-size: 2.2vmin 2.2vmin; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 6vmin; background: #0C0C0C; color: #E3E3DE; display: flex; align-items: center; justify-content: space-between; padding: 0 4vmin; font-size: 1.8vmin; letter-spacing: .08em; }
  .bar b { font-family: "Silkscreen", monospace; font-weight: 700; font-size: 2.2vmin; letter-spacing: .06em; }
  .bar b i { font-style: normal; color: #7C85FF; }

  .win { position: absolute; left: 5vmin; right: 5vmin; top: 10vmin; height: calc(100% - 85vmin); background: #F4F4F0; border: .4vmin solid #0C0C0C; box-shadow: 1.4vmin 1.4vmin 0 #2B35FF; }
  .tb { position: absolute; left: 0; right: 0; top: 0; height: 4.6vmin; border-bottom: .4vmin solid #0C0C0C; display: flex; align-items: center; gap: 2vmin; padding: 0 1.6vmin;
    background: repeating-linear-gradient(to bottom, #0C0C0C 0 .3vmin, transparent .3vmin .8vmin) 50% 50% / 100% 2.6vmin no-repeat, #F4F4F0; }
  .tb i { flex: none; width: 2.2vmin; height: 2.2vmin; border: .4vmin solid #0C0C0C; background: #F4F4F0; box-sizing: border-box; }
  .tb span { margin: 0 auto; background: #F4F4F0; padding: 0 1.6vmin; font-size: 1.8vmin; font-weight: 700; white-space: nowrap; }
  .win img { position: absolute; left: 0; top: 5vmin; width: 100%; height: calc(100% - 5vmin); object-fit: cover; object-position: 50% 22%; }
  .tag { position: absolute; right: 0; bottom: 0; background: #0C0C0C; color: #F4F4F0; font-size: 1.7vmin; padding: .8vmin 1.4vmin; }

  .copy { position: absolute; left: 5vmin; right: 5vmin; bottom: 5vmin; height: 66vmin; display: flex; flex-direction: column; }
  .big { display: flex; flex-direction: column; }
  .big h1 { margin: 0; font-family: "Silkscreen", monospace; font-weight: 700; font-size: 28vmin; line-height: .8; letter-spacing: -.02em; color: #2B35FF; white-space: nowrap; }
  .big p { margin: 2.4vmin 0 0; display: flex; justify-content: space-between; font-family: "Silkscreen", monospace; font-size: 3vmin; line-height: 1; white-space: nowrap; }
  .big h1 small { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: .5em; letter-spacing: -.04em; margin-left: .06em; }
  .term { margin-top: 3.6vmin; background: #0C0C0C; color: #E3E3DE; padding: 2.6vmin 3vmin; font-size: 2.3vmin; line-height: 1.75; box-shadow: 1.4vmin 1.4vmin 0 #2B35FF; }
  .term div { white-space: nowrap; }
  .term .c { color: #8A8A86; }
  .term b { color: #9EA4FF; font-weight: 700; }
  .term u { text-decoration: none; background: #E3E3DE; color: #0C0C0C; padding: 0 .8vmin; font-weight: 700; }
  .cur { display: inline-block; width: 1.3vmin; height: 2.5vmin; background: #E3E3DE; vertical-align: -.4vmin; margin-left: .4vmin; }
  .cta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-family: "Silkscreen", monospace; font-size: 3vmin; }
  .cta span:last-child { font-family: "JetBrains Mono", monospace; font-size: 1.8vmin; letter-spacing: .06em; }

  @media (min-aspect-ratio: 7/10) {
    .win { height: calc(100% - 76vmin); }
    .copy { height: 59vmin; bottom: 4vmin; }
    .big h1 { font-size: 20vmin; }
    .big p { margin-top: 2vmin; font-size: 2.6vmin; }
    .term { margin-top: 2.6vmin; padding: 1.8vmin 2.6vmin; font-size: 2vmin; line-height: 1.6; }
  }
  /* square — window on the left, offer on the right */
  @media (min-aspect-ratio: 9/10) {
    .win { right: auto; width: 45%; height: auto; bottom: 6vmin; }
    .copy { left: calc(45% + 10vmin); top: 11vmin; bottom: 6vmin; height: auto; right: 4vmin; }
    .big h1 { font-size: 14vmin; }
    .big p { font-size: 2.2vmin; margin-top: 1.8vmin; }
    .term { font-size: 1.9vmin; padding: 2vmin 2.2vmin; line-height: 1.8; }
    .term div { white-space: normal; }
    .cta { flex-direction: column; align-items: flex-start; gap: 1.2vmin; font-size: 2.8vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .win { width: 50%; }
    .copy { left: calc(50% + 12vmin); right: 6vmin; }
    .big h1 { font-size: 19vmin; }
    .big p { font-size: 2.8vmin; }
    .term { font-size: 2.1vmin; padding: 2.2vmin 2.6vmin; }
    .term div { white-space: nowrap; }
    .cta { flex-direction: row; align-items: center; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ─────────
     (each @keyframes carries an invisible outline-color so no effect is compositor-only: the frame-stepped
      video renderer parallel tabs otherwise freeze transform/opacity-only animations) */
  /* menu-bar underscore + terminal cursor: blink like a shell prompt */
  .bar b i { animation: blink 1s steps(1, end) infinite; }
  .cur { animation: blink 1s steps(1, end) infinite; }
  @keyframes blink { 0%, 55% { outline-color: transparent; opacity: 1; } 56%, 100% { opacity: 0; } }
  /* the terminal clears and re-runs the command, line by line, typed in character steps */
  .term div { animation: 6s linear infinite; }
  .term div:nth-child(1) { animation-name: ty1; } .term div:nth-child(2) { animation-name: ty2; } .term div:nth-child(3) { animation-name: ty3; }
  .term div:nth-child(4) { animation-name: ty4; } .term div:nth-child(5) { animation-name: ty5; }
  @keyframes ty1 { 0%, 6% { outline-color: transparent; clip-path: inset(0 0 0 0); animation-timing-function: steps(1, end); } 7% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(1, end); } 9% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(22, end); } 19%, 100% { clip-path: inset(0 0 0 0); } }
  @keyframes ty2 { 0%, 6% { outline-color: transparent; clip-path: inset(0 0 0 0); animation-timing-function: steps(1, end); } 7% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(1, end); } 21% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(24, end); } 27%, 100% { clip-path: inset(0 0 0 0); } }
  @keyframes ty3 { 0%, 6% { outline-color: transparent; clip-path: inset(0 0 0 0); animation-timing-function: steps(1, end); } 7% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(1, end); } 28.5% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(28, end); } 35%, 100% { clip-path: inset(0 0 0 0); } }
  @keyframes ty4 { 0%, 6% { outline-color: transparent; clip-path: inset(0 0 0 0); animation-timing-function: steps(1, end); } 7% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(1, end); } 36.5% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(28, end); } 43.5%, 100% { clip-path: inset(0 0 0 0); } }
  @keyframes ty5 { 0%, 6% { outline-color: transparent; clip-path: inset(0 0 0 0); animation-timing-function: steps(1, end); } 7% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(1, end); } 45% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(14, end); } 50%, 100% { clip-path: inset(0 0 0 0); } }
  /* "LIVE" lights up once the last line lands */
  .term div:nth-child(5) b { animation: live 6s linear infinite; }
  @keyframes live { 0%, 50% { outline-color: transparent; color: #9EA4FF; text-shadow: none; } 51%, 53% { color: #fff; text-shadow: 0 0 1vmin rgba(158,164,255,.9); } 54%, 55% { color: #9EA4FF; text-shadow: none; } 56%, 60% { color: #fff; text-shadow: 0 0 1vmin rgba(158,164,255,.9); } 66%, 100% { color: #9EA4FF; text-shadow: none; } }
  /* -30%: an RGB-split glitch hit, then a clean snap back */
  .big h1 { animation: glitch 6s linear infinite; }
  @keyframes glitch {
    0%, 62% { outline-color: transparent; transform: translate(0, 0); text-shadow: 0 0 0 rgba(255,40,90,0), 0 0 0 rgba(0,220,255,0); animation-timing-function: steps(1, end); }
    63% { transform: translate(-1vmin, 0); text-shadow: .9vmin 0 0 rgba(255,40,90,.85), -.9vmin 0 0 rgba(0,220,255,.85); animation-timing-function: steps(1, end); }
    64.5% { transform: translate(.8vmin, -.4vmin); text-shadow: -.6vmin 0 0 rgba(255,40,90,.85), .6vmin 0 0 rgba(0,220,255,.85); animation-timing-function: steps(1, end); }
    66% { transform: translate(-.3vmin, .3vmin); text-shadow: .4vmin 0 0 rgba(255,40,90,.7), -.4vmin 0 0 rgba(0,220,255,.7); animation-timing-function: steps(1, end); }
    67.5% { transform: translate(0, 0); text-shadow: 0 0 0 rgba(255,40,90,0), 0 0 0 rgba(0,220,255,0); animation-timing-function: steps(1, end); }
    69% { transform: translate(.4vmin, 0); text-shadow: -.3vmin 0 0 rgba(255,40,90,.6), .3vmin 0 0 rgba(0,220,255,.6); animation-timing-function: steps(1, end); }
    70%, 100% { transform: translate(0, 0); text-shadow: 0 0 0 rgba(255,40,90,0), 0 0 0 rgba(0,220,255,0); }
  }
  /* the window's hard blue shadow jolts with the glitch; the picture breathes slowly inside */
  .win, .term { animation: jolt 6s linear infinite; }
  @keyframes jolt {
    0%, 62% { outline-color: transparent; box-shadow: 1.4vmin 1.4vmin 0 #2B35FF; animation-timing-function: steps(1, end); }
    63% { box-shadow: 2.2vmin .8vmin 0 #2B35FF; animation-timing-function: steps(1, end); }
    65% { box-shadow: .8vmin 2vmin 0 #2B35FF; animation-timing-function: steps(1, end); }
    67%, 100% { box-shadow: 1.4vmin 1.4vmin 0 #2B35FF; }
  }
  .win { overflow: hidden; }
  .tb, .tag { z-index: 1; }
  .win img { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { outline-color: transparent; transform: scale(1); } 50% { transform: scale(1.03); } }
  /* CTA: brackets close in on the button, twice */
  .cta span:first-child { display: inline-block; animation: tap 6s linear infinite; transform-origin: 0 50%; }
  @keyframes tap {
    0%, 78% { outline-color: transparent; transform: scale(1); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    81% { transform: scale(1.06); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    84% { transform: scale(1); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    87% { transform: scale(1.06); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    91%, 100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="bar"><b>CYBER<i>_</i>MONDAY</b><span>01.12 · 00:00—23:59</span></div>
  <div class="win">
    <div class="tb"><i></i><span>new_season.jpg</span><i></i></div>
    <img src="{{PRODUCT_IMAGE}}" alt="">
    <div class="tag">1 / 1 — 100%</div>
  </div>
  <div class="copy">
    <div class="big"><h1>-30<small>%</small></h1><p><span>on everything</span><span>24h</span></p></div>
    <div class="term">
      <div><span class="c">$</span> apply --code <u>CYBER30</u></div>
      <div><span class="c">&gt;</span> discount <b>30%</b> sitewide</div>
      <div><span class="c">&gt;</span> shipping <b>free</b>, today only</div>
      <div><span class="c">&gt;</span> stock <b>[########··]</b> 80% gone</div>
      <div><span class="c">&gt;</span> status <b>LIVE</b><span class="cur"></span></div>
    </div>
    <div class="cta"><span>[ SHOP NOW ]</span><span>ends at midnight</span></div>
  </div>
</div>
</body>
</html>
