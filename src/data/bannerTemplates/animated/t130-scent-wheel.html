<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Cormorant:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Scent Wheel — the perfumer's fragrance wheel as a collection finder: four families, twelve moods,
     a gold pointer on today's note and the offer in the hub. Midnight counter palette.
     tall → photo above, copy left + wheel right; square → photo left, copy over the wheel; wide → photo | copy | wheel */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #16152B; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #F3EBDD; font-family: "Syne", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(80% 60% at 75% 78%, #242142 0%, #16152B 65%, #110F22 100%); --D: 56vmin; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 50%; object-fit: cover; object-position: 50% 22%; }

  .copy { position: absolute; left: 6vmin; width: 32vmin; top: calc(50% + 5.5vmin); bottom: 5.5vmin; display: flex; flex-direction: column; }
  .kick { font-size: 1.7vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #C9A55B; line-height: 1.5; }
  h1 { margin: 2vmin 0 0; font-family: "Cormorant", Garamond, Georgia, serif; font-style: italic; font-weight: 500; font-size: 9.6vmin; line-height: .9; letter-spacing: -.01em; }
  p { margin: 2.4vmin 0 0; font-size: 2.2vmin; line-height: 1.4; color: #CFC6D8; }
  .foot { margin-top: auto; }
  .code { display: inline-block; padding: 1.1vmin 1.8vmin; border: 1px solid #C9A55B; font-size: 1.9vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
  .cta { margin-top: 1.8vmin; font-size: 1.8vmin; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #CFC6D8; white-space: nowrap; }

  .wrap { position: absolute; right: 5vmin; width: var(--D); height: var(--D); top: calc(75% - var(--D) / 2); }
  .wheel { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .wheel .sl { font-family: "Syne", Arial, sans-serif; font-weight: 700; fill: #1A1830; letter-spacing: .02em; }
  .wheel .fl { font-family: "Syne", Arial, sans-serif; font-weight: 800; fill: #F3EBDD; letter-spacing: .32em; text-transform: uppercase; }
  .wheel .tk { stroke: #C9A55B; stroke-width: .6; }
  .wheel .hl { fill: none; stroke: #F3EBDD; stroke-width: 1.6; }
  .wheel .ptr { fill: #C9A55B; }
  .hub { position: absolute; left: 28%; top: 28%; width: 44%; height: 44%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #1A1830; }
  .hub b { font-size: calc(var(--D) * .1); font-weight: 800; line-height: .9; letter-spacing: -.03em; }
  .hub span { margin-top: calc(var(--D) * .012); font-family: "Cormorant", Georgia, serif; font-style: italic; font-weight: 600; font-size: calc(var(--D) * .045); line-height: 1.05; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: 50%; }
    .banner { --D: 50vmin; }
    .copy { top: calc(50% + 4.4vmin); bottom: 4.4vmin; width: 36vmin; }
    .wrap { right: 6vmin; }
    h1 { font-size: 8.6vmin; }
    p { font-size: 2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 42%; height: 100%; object-position: 50% 25%; }
    .banner { --D: 50vmin; }
    .copy { left: calc(42% + 5vmin); right: 5vmin; width: auto; top: 5.5vmin; bottom: 5vmin; }
    h1 { font-size: 6.4vmin; margin-top: 1.4vmin; }
    h1 br { display: none; }
    p { display: none; }
    .foot { margin-top: 2.6vmin; display: flex; align-items: center; gap: 2.4vmin; }
    .code { padding: 1vmin 1.4vmin; font-size: 1.7vmin; letter-spacing: .14em; }
    .cta { margin-top: 0; font-size: 1.7vmin; letter-spacing: .14em; }
    .banner { --D: 47vmin; }
    .wrap { right: auto; left: calc(42% + 5vmin + (58% - 10vmin - var(--D)) / 2); top: auto; bottom: 4.5vmin; }
    .wheel .sl { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 36%; }
    .banner { --D: 62vmin; }
    .copy { left: calc(36% + 6vmin); right: auto; width: 26vmin; top: 7vmin; bottom: 7vmin; }
    h1 { font-size: 8.4vmin; margin-top: 2vmin; }
    h1 br { display: inline; }
    p { display: block; font-size: 2vmin; }
    .foot { margin-top: auto; display: block; }
    .cta { margin-top: 1.8vmin; }
    .code { padding: 1.1vmin 1.6vmin; font-size: 1.8vmin; letter-spacing: .16em; }
    .cta { font-size: 1.7vmin; letter-spacing: .16em; white-space: nowrap; }
    .wrap { left: auto; right: 5vmin; bottom: auto; top: calc(50% - var(--D) / 2); }
    .wheel .sl { display: inline; }
  }
  /* ── animated loop (6s) ── the finder spins: the white selector and gold pointer sweep once around all twelve moods
     and settle back on Citrus, the hub "20%" lands with a punch, the gold code frame catches a sheen */
  .sel { position: absolute; inset: 0; animation: swSpin 6s linear infinite; }
  @keyframes swSpin {
    0%, 14% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.55,0,.25,1); }
    58% { transform: rotate(366deg); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    64%, 100% { transform: rotate(360deg); }
  }
  .hub b { animation: swHub 6s linear infinite; }
  @keyframes swHub {
    0%, 58% { transform: none; animation-timing-function: cubic-bezier(.5,0,.8,.4); }
    61% { transform: scale(.88); animation-timing-function: cubic-bezier(.2,.9,.3,1); }
    66% { transform: scale(1.12); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    73%, 100% { transform: none; }
  }
  .code { position: relative; clip-path: inset(0); }
  .code::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 30%;
    background: linear-gradient(90deg, rgba(201,165,91,0), rgba(201,165,91,.35) 50%, rgba(201,165,91,0));
    transform: translateX(-150%) skewX(-18deg); animation: swSheen 6s linear infinite; }
  @keyframes swSheen { 0%, 74% { transform: translateX(-150%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); } 90%, 100% { transform: translateX(420%) skewX(-18deg); } }
</style>
</head>
<body>

      <path d="M180.17 78.52 L195.63 74.38" class="tk"/><path d="M121.48 180.17 L125.62 195.63" class="tk"/><path d="M19.83 121.48 L4.37 125.62" class="tk"/><path d="M78.52 19.83 L74.38 4.37" class="tk"/>
      
      <circle cx="100" cy="100" r="44" fill="#F3EBDD"/>

      <text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s0" startOffset="50%">Citrus</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s1" startOffset="50%">Water</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s2" startOffset="50%">Green</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s3" startOffset="50%">Fruity</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s4" startOffset="50%">Floral</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s5" startOffset="50%">Powdery</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s6" startOffset="50%">Spice</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s7" startOffset="50%">Amber</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s8" startOffset="50%">Resin</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s9" startOffset="50%">Leather</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s10" startOffset="50%">Woods</textPath></text><text class="sl" font-size="6.2" text-anchor="middle"><textPath href="#s11" startOffset="50%">Moss</textPath></text><text class="fl" font-size="8.4" text-anchor="middle"><textPath href="#f0" startOffset="50%">Fresh</textPath></text><text class="fl" font-size="8.4" text-anchor="middle"><textPath href="#f1" startOffset="50%">Floral</textPath></text><text class="fl" font-size="8.4" text-anchor="middle"><textPath href="#f2" startOffset="50%">Amber</textPath></text><text class="fl" font-size="8.4" text-anchor="middle"><textPath href="#f3" startOffset="50%">Woody</textPath></text>

</div>
</body>
</html>
