<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Silk Carré — the copy sits on a printed silk-scarf panel: navy hem with a rope stitch,
     a sky chain-link border, corner medallions, an ivory centre. The photo stays clean.
     tall → photo above the carré; square/wide → photo left, carré right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1F2A4A; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #1F2A4A; color: #1F2A4A; font-family: "Jost", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 56%; object-fit: cover; object-position: 50% 18%; }
  .carre { position: absolute; left: 0; right: 0; top: 56%; bottom: 0; box-sizing: border-box; padding: 2.4vmin; background: #1F2A4A; }
  .carre::before { content: ""; position: absolute; inset: 1vmin; border: .3vmin dotted rgba(247,241,230,.75); pointer-events: none; }
  .chain { position: relative; height: 100%; box-sizing: border-box; padding: 4.4vmin;
    background:
      radial-gradient(circle, transparent 0 1.05vmin, #C0563A 1.1vmin 1.5vmin, transparent 1.55vmin) 0 0 / 4.4vmin 4.4vmin space,
      radial-gradient(circle, #1F2A4A 0 .42vmin, transparent .47vmin) 0 0 / 4.4vmin 4.4vmin space,
      #A7C4D8; }
  .chain > i { position: absolute; width: 4.4vmin; height: 4.4vmin; background: radial-gradient(circle, #F7F1E6 0 .7vmin, #1F2A4A .75vmin 1.1vmin, #C0563A 1.15vmin 2.2vmin, transparent 2.25vmin); z-index: 1; }
  .chain > i:nth-of-type(1) { left: 0; top: 0; }
  .chain > i:nth-of-type(2) { right: 0; top: 0; }
  .chain > i:nth-of-type(3) { left: 0; bottom: 0; }
  .chain > i:nth-of-type(4) { right: 0; bottom: 0; }
  .field { height: 100%; box-sizing: border-box; background: #F7F1E6; border: .5vmin solid #1F2A4A; box-shadow: inset 0 0 0 1.3vmin #F7F1E6, inset 0 0 0 1.55vmin #C0563A;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3vmin 4vmin; }
  .k { font-size: 1.9vmin; font-weight: 500; letter-spacing: .5em; margin-right: -.5em; text-transform: uppercase; color: #C0563A; }
  .h { margin-top: 1.6vmin; font-family: "Gilda Display", Didot, "Times New Roman", serif; font-size: min(12.5vmin, 7.2vh); line-height: .92; letter-spacing: -.01em; }
  .orn { margin: 2.2vmin 0 1.8vmin; display: flex; align-items: center; gap: 1.2vmin; }
  .orn i { width: 1vmin; height: 1vmin; background: #C0563A; transform: rotate(45deg); }
  .orn i:nth-child(2) { width: 1.4vmin; height: 1.4vmin; background: #1F2A4A; }
  .d { font-size: 2.7vmin; line-height: 1.45; color: #3A4460; }
  .cta { margin-top: 2.4vmin; font-size: 2vmin; font-weight: 500; letter-spacing: .3em; margin-right: -.3em; text-transform: uppercase; padding-bottom: .7vmin; border-bottom: .3vmin solid #C0563A; }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: 53%; }
    .carre { top: 53%; }
    .h { font-size: 10.4vmin; }
    .d { font-size: 2.5vmin; }
    .orn { margin: 1.6vmin 0 1.4vmin; }
    .cta { margin-top: 1.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 52%; height: 100%; object-position: 50% 25%; }
    .carre { left: 52%; top: 0; }
    .field { padding: 3vmin 2.4vmin; }
    .k { font-size: 1.7vmin; letter-spacing: .36em; margin-right: -.36em; }
    .h { font-size: 7.4vmin; }
    .d { font-size: 2.1vmin; }
    .cta { font-size: 1.8vmin; letter-spacing: .22em; margin-right: -.22em; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 55%; }
    .carre { left: 55%; }
    .field { padding: 4vmin 4vmin; }
    .k { font-size: 1.9vmin; letter-spacing: .5em; margin-right: -.5em; }
    .h { font-size: 10.4vmin; }
    .d { font-size: 2.4vmin; }
    .cta { font-size: 2vmin; letter-spacing: .3em; margin-right: -.3em; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ───────── */
  .photo { transform-origin: 50% 50%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push {
    0%, 100% { transform: scale(1); clip-path: inset(0); }
    50% { transform: scale(1.03); clip-path: inset(1.456%); }
  }
  /* satin sheen slides across the silk centre (behind the type) */
  .field { position: relative; isolation: isolate; overflow: hidden; }
  .field::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,0) 38%, rgba(214,196,170,.18) 44%, rgba(255,255,255,.9) 50%, rgba(214,196,170,.18) 56%, rgba(255,255,255,0) 62%) 100% 0 / 300% 100% no-repeat;
    animation: satin 6s linear infinite; }
  @keyframes satin {
    0%, 4% { background-position: 100% 0; animation-timing-function: cubic-bezier(.45,0,.25,1); }
    42% { background-position: 0% 0; animation-timing-function: steps(1, end); }
    42.2%, 100% { background-position: 100% 0; }
  }
  /* corner medallions pulse one after another, around the hem */
  .chain > i { animation: medal 6s linear infinite; }
  .chain > i:nth-of-type(2) { animation-delay: -5.8s; }
  .chain > i:nth-of-type(4) { animation-delay: -5.6s; }
  .chain > i:nth-of-type(3) { animation-delay: -5.4s; }
  @keyframes medal {
    0%, 6% { transform: scale(1) rotate(0deg); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    11% { transform: scale(1.22) rotate(45deg); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    18%, 100% { transform: scale(1) rotate(90deg); }
  }
  /* the headline is printed again, top to bottom */
  .h { animation: print 6s linear infinite; }
  @keyframes print {
    0%, 44% { opacity: 1; clip-path: inset(-20% -10% -20% -10%); animation-timing-function: ease-in; }
    49% { opacity: 0; clip-path: inset(-20% -10% -20% -10%); animation-timing-function: steps(1, end); }
    49.2% { opacity: 1; clip-path: inset(-20% -10% 120% -10%); animation-timing-function: cubic-bezier(.45,.1,.3,1); }
    66%, 100% { opacity: 1; clip-path: inset(-20% -10% -20% -10%); }
  }
  /* ornament diamonds turn a quarter, one by one */
  .orn i { animation: orn 6s linear infinite; }
  .orn i:nth-child(2) { animation-delay: -5.85s; }
  .orn i:nth-child(3) { animation-delay: -5.7s; }
  @keyframes orn {
    0%, 66% { transform: rotate(45deg); animation-timing-function: cubic-bezier(.5,0,.3,1); }
    74%, 100% { transform: rotate(135deg); }
  }
  /* the terracotta underline is redrawn */
  .cta { border-bottom-color: transparent; background: linear-gradient(#C0563A, #C0563A) 0 100% / 100% .3vmin no-repeat; background-origin: border-box; animation: uline 6s linear infinite; }
  @keyframes uline {
    0%, 80% { background-size: 100% .3vmin; background-position: 100% 100%; animation-timing-function: cubic-bezier(.6,0,.4,1); }
    86% { background-size: 0% .3vmin; background-position: 100% 100%; animation-timing-function: steps(1, end); }
    86.2% { background-size: 0% .3vmin; background-position: 0 100%; animation-timing-function: cubic-bezier(.2,.7,.2,1); }
    96%, 100% { background-size: 100% .3vmin; background-position: 0 100%; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="carre">
    <div class="chain">
      <i></i><i></i><i></i><i></i>
      <div class="field">
        <div class="k">Le Carré</div>
        <div class="h">Summer<br>in Print</div>
        <div class="orn"><i></i><i></i><i></i></div>
        <div class="d">Hand-drawn motifs,<br>printed in Italy.</div>
        <div class="cta">Shop the collection</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
