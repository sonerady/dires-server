<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,100;1,9..144,400..700,100&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Impact Report — recycled kraft paper with grain + fibre flecks, a torn edge over the photo seam,
     a rubber "made to last" stamp and three impact numbers. tall → photo above; 7/10+ → photo left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #DCCDAE; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #DCCDAE; color: #1F3A2B; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 64vmin); object-fit: cover; object-position: 50% 22%; }

  /* the paper: fibres, flecks and grain, clipped by a torn top edge */
  .paper { position: absolute; left: 0; right: 0; bottom: 0; height: calc(64vmin + 2.6vmin); }
  .paper .fill { position: absolute; inset: 2.4vmin 0 0 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(90,70,40,.35) 0 .15vmin, transparent .25vmin) 0 0 / 7vmin 6vmin,
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.5) 0 .12vmin, transparent .22vmin) 0 0 / 5vmin 8vmin,
      radial-gradient(circle at 40% 80%, rgba(60,45,25,.28) 0 .1vmin, transparent .2vmin) 0 0 / 3.6vmin 4.2vmin,
      #DCCDAE; }
  .paper .tear { position: absolute; left: 0; top: 0; width: 100%; height: 2.6vmin; display: block; }
  .paper .tear.h { filter: drop-shadow(0 -.4vmin 0 #F3ECDC) drop-shadow(0 -.3vmin .8vmin rgba(40,30,15,.35)); }
  .paper .tear.v { display: none; filter: drop-shadow(-.4vmin 0 0 #F3ECDC) drop-shadow(-.3vmin 0 .8vmin rgba(40,30,15,.35)); }
  .grain { position: absolute; left: 0; top: 2.4vmin; width: 100%; height: calc(100% - 2.4vmin); opacity: .7; mix-blend-mode: multiply; pointer-events: none; }

  .panel { position: absolute; left: 6vmin; right: 6vmin; bottom: 6vmin; height: 56vmin; display: flex; flex-direction: column; }
  .k { display: flex; justify-content: space-between; font-size: 1.8vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #3F5B45; }
  h1 { width: fit-content; margin: 3.4vmin 0 0; font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-weight: 500; font-size: 11.4vmin; line-height: .92; letter-spacing: -.025em; }
  h1 i { font-weight: 400; color: #5E7440; }
  .lede { display: none; margin-top: 3vmin; font-size: 2.2vmin; font-weight: 500; line-height: 1.5; color: #2E4A38; max-width: 46vmin; }
  .stats { display: flex; margin-top: auto; }
  .stats div { flex: 1; padding-top: 1.8vmin; border-top: .3vmin solid #1F3A2B; }
  .stats div + div { margin-left: 3vmin; }
  .stats b { display: block; font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-weight: 600; font-size: 7vmin; line-height: 1; letter-spacing: -.03em; }
  .stats span { display: block; margin-top: 1vmin; font-size: 1.8vmin; font-weight: 600; line-height: 1.3; color: #3F5B45; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 3vmin; margin-top: 4vmin; }
  .foot .p { font-size: 2.1vmin; font-weight: 600; }
  .foot .p b { font-family: "Fraunces", Georgia, serif; font-size: 3.4vmin; font-weight: 600; margin-left: .6vmin; }
  .cta { flex: none; padding: 1.9vmin 3.4vmin; background: #1F3A2B; color: #EFE6D2; font-size: 2.1vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }

  /* rubber stamp */
  .stamp { position: absolute; right: 6vmin; bottom: 31vmin; width: 21vmin; height: 21vmin; transform: rotate(-14deg); color: #B4552F; opacity: .9; }
  .stamp svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .stamp text { font-family: "Manrope", Arial, sans-serif; font-weight: 700; fill: currentColor; text-transform: uppercase; }
  .stamp .mid { font-family: "Fraunces", Georgia, serif; font-weight: 700; }

  /* ── 7/10+ : photo left, torn edge runs vertically ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 54%; height: 100%; object-position: 50% 25%; }
    .paper { left: calc(54% - 2.6vmin); top: 0; height: auto; }
    .paper .fill { inset: 0 0 0 2.4vmin; }
    .paper .tear { width: 2.6vmin; height: 100%; }
    .paper .tear.h { display: none; }
    .paper .tear.v { display: block; }
    .grain { top: 0; left: 2.4vmin; width: calc(100% - 2.4vmin); height: 100%; }
    .panel { left: calc(54% + 5vmin); right: 5vmin; top: 7vmin; bottom: 6vmin; height: auto; }
    .k { flex-direction: column; gap: 1vmin; }
    h1 { font-size: 8.6vmin; margin-top: 4vmin; }
    .lede { display: block; }
    .stats { flex-direction: column; }
    .stats div { display: flex; align-items: baseline; gap: 2vmin; padding: 1.4vmin 0; border-top: 1px solid rgba(31,58,43,.5); }
    .stats div + div { margin-left: 0; }
    .stats b { font-size: 5.4vmin; min-width: 14vmin; }
    .stats span { margin-top: 0; }
    .foot { flex-direction: column; align-items: stretch; gap: 2.4vmin; margin-top: 3vmin; }
    .cta { text-align: center; }
    .stamp { right: 6vmin; bottom: auto; top: 50%; width: 18vmin; height: 18vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; }
    .paper { left: calc(50% - 2.6vmin); }
    .panel { left: calc(50% + 5vmin); top: 6vmin; bottom: 5vmin; }
    .k { flex-direction: row; }
    .k span + span { display: none; }
    h1 { font-size: 7.4vmin; margin-top: 3vmin; }
    .lede { font-size: 2vmin; margin-top: 2.4vmin; max-width: 25vmin; }
    .stats div { padding: 1vmin 0; }
    .stats b { font-size: 4.2vmin; min-width: 11vmin; }
    .stats span { font-size: 1.7vmin; }
    .foot { flex-direction: row; align-items: center; margin-top: 2.4vmin; }
    .cta { padding: 1.7vmin 2.6vmin; font-size: 1.9vmin; }
    .stamp { top: 25vmin; right: 4vmin; width: 15vmin; height: 15vmin; }
  }
  /* ── wide: stats back in a row under the headline ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; }
    .paper { left: calc(44% - 2.6vmin); }
    .panel { left: calc(44% + 7vmin); right: 7vmin; top: 8vmin; bottom: 7vmin; }
    .k span + span { display: inline; }
    h1 { font-size: 10.4vmin; margin-top: 4vmin; }
    .lede { font-size: 2.3vmin; margin-top: 3vmin; max-width: 44vmin; }
    .stats { flex-direction: row; }
    .stats div { display: block; padding: 1.8vmin 0 0; border-top: .3vmin solid #1F3A2B; }
    .stats div + div { margin-left: 3vmin; }
    .stats b { font-size: 6vmin; min-width: 0; }
    .stats span { margin-top: 1vmin; font-size: 1.8vmin; }
    .foot { margin-top: 4vmin; }
    .cta { padding: 1.9vmin 3.4vmin; font-size: 2.1vmin; }
    .stamp { top: 17vmin; right: 9vmin; width: 19vmin; height: 19vmin; }
  }

  /* ───────── motion: 6s loop, calm & considered — t=0 = the static design ───────── */
  .photo { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  /* impact numbers: each lifts away and re-forms in place, one after another */
  .stats b { transform-origin: 0 70%; animation: roll 6s linear infinite; }
  .stats div:nth-child(2) b { animation-delay: -5.7s; }
  .stats div:nth-child(3) b { animation-delay: -5.4s; }
  @keyframes roll {
    0%, 8% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); animation-timing-function: cubic-bezier(.6,0,.9,.4); }
    13% { transform: translateY(-.6em) scale(1); opacity: 0; filter: blur(0); animation-timing-function: steps(1, end); }
    14% { transform: translateY(0) scale(.82); opacity: 0; filter: blur(.4vmin); animation-timing-function: cubic-bezier(.2,.8,.25,1); }
    24%, 100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
  }
  /* the rule above each figure flushes terracotta as it lands */
  .stats div { animation: mark 6s linear infinite; }
  .stats div:nth-child(2) { animation-delay: -5.7s; }
  .stats div:nth-child(3) { animation-delay: -5.4s; }
  @keyframes mark {
    0%, 13% { border-top-color: #1F3A2B; }
    20%, 34% { border-top-color: #B4552F; animation-timing-function: cubic-bezier(.4,0,.6,1); }
    46%, 100% { border-top-color: #1F3A2B; }
  }
  /* rubber stamp: lifted off the paper, then thumped back down */
  .stamp { animation: stamp 6s linear infinite; }
  @keyframes stamp {
    0%, 48% { transform: rotate(-14deg) scale(1); opacity: .9; filter: blur(0); animation-timing-function: cubic-bezier(.4,0,.6,1); }
    54% { transform: rotate(-8deg) scale(1.28); opacity: 0; filter: blur(.4vmin); animation-timing-function: steps(1, end); }
    60% { transform: rotate(-17deg) scale(1.3); opacity: 0; filter: blur(.4vmin); animation-timing-function: cubic-bezier(.7,0,.9,.5); }
    66% { transform: rotate(-14deg) scale(.95); opacity: .95; filter: blur(0); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    71%, 100% { transform: rotate(-14deg) scale(1); opacity: .9; filter: blur(0); }
  }
  /* CTA: a soft light pass after the stamp */
  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 30%;
    background: linear-gradient(90deg, rgba(239,230,210,0) 0%, rgba(239,230,210,.08) 30%, rgba(239,230,210,.28) 50%, rgba(239,230,210,.08) 70%, rgba(239,230,210,0) 100%);
    transform: translateX(-160%) skewX(-18deg); animation: sheen 6s linear infinite; }
  @keyframes sheen {
    0%, 74% { transform: translateX(-160%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    90%, 100% { transform: translateX(420%) skewX(-18deg); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="paper">
    <div class="fill"></div>
    <svg class="tear h" viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true"><path fill="#DCCDAE" d="M0 6 L4 4.2 7 6.1 11 3.6 15 5.4 18 3.1 22 5.8 26 4.4 29 6.3 33 3.9 37 5.2 41 2.8 44 5.6 48 4 52 6.2 55 3.4 59 5 63 3.8 67 6 70 4.1 74 5.7 78 3.2 82 5.3 85 4.5 89 6.4 93 3.5 96 5.1 100 3.7 104 5.9 108 4.2 111 6.1 115 3.3 119 5.5 122 4 126 5.8 130 2.9 134 5.2 137 4.4 141 6.2 145 3.6 148 5.4 152 4.1 156 6 160 3.4 163 5.3 167 4.6 171 6.3 174 3.8 178 5.1 182 3.2 185 5.7 189 4.3 193 6 196 3.9 200 5.2 L200 10 L0 10 Z"/></svg>
    <svg class="tear v" viewBox="0 0 10 200" preserveAspectRatio="none" aria-hidden="true"><path fill="#DCCDAE" d="M6 0 L4.2 4 6.1 7 3.6 11 5.4 15 3.1 18 5.8 22 4.4 26 6.3 29 3.9 33 5.2 37 2.8 41 5.6 44 4 48 6.2 52 3.4 55 5 59 3.8 63 6 67 4.1 70 5.7 74 3.2 78 5.3 82 4.5 85 6.4 89 3.5 93 5.1 96 3.7 100 5.9 104 4.2 108 6.1 111 3.3 115 5.5 119 4 122 5.8 126 2.9 130 5.2 134 4.4 137 6.2 141 3.6 145 5.4 148 4.1 152 6 156 3.4 160 5.3 163 4.6 167 6.3 171 3.8 174 5.1 178 3.2 182 5.7 185 4.3 189 6 193 3.9 196 5.2 200 L10 200 L10 0 Z"/></svg>
    <svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .16  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
  <div class="stamp"><svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <defs><path id="ring" d="M50 50 m-38 0 a38 38 0 1 1 76 0 a38 38 0 1 1 -76 0"/></defs>
    <text font-size="10.5" letter-spacing="2.4"><textPath href="#ring">Made to last · Made to last · </textPath></text>
    <text class="mid" font-size="17" x="50" y="56" text-anchor="middle">2026</text>
  </svg></div>
  <div class="panel">
    <div class="k"><span>Impact Report</span><span>The Conscious Edit</span></div>
    <h1>Less, but<br><i>better.</i></h1>
    <div class="lede">Recycled and organic materials, traced from source to the finished piece.</div>
    <div class="stats">
      <div><b>−62%</b><span>Water used</span></div>
      <div><b>100%</b><span>Traceable supply</span></div>
      <div><b>0</b><span>Virgin plastic</span></div>
    </div>
    <div class="foot">
      <div class="p">From<b>$59</b></div>
      <div class="cta">Shop the edit</div>
    </div>
  </div>
</div>
</body>
</html>
