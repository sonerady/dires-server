<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Built to Spec — blueprint / technical drawing: grid paper, dimension lines, callouts and a title block */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1C4A87; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #F2F6FF; font-family: "IBM Plex Mono", "Courier New", monospace;
    background-color: #1C4A87;
    background-image:
      linear-gradient(rgba(242,246,255,.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242,246,255,.2) 1px, transparent 1px),
      linear-gradient(rgba(242,246,255,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242,246,255,.08) 1px, transparent 1px);
    background-size: 12.5vmin 12.5vmin, 12.5vmin 12.5vmin, 2.5vmin 2.5vmin, 2.5vmin 2.5vmin; }

  .top { position: absolute; left: 5vmin; right: 5vmin; top: 4vmin; display: flex; justify-content: space-between; gap: 2vmin; font-size: 1.7vmin; letter-spacing: .1em; text-transform: uppercase; padding-bottom: 1.2vmin; border-bottom: .25vmin solid #F2F6FF; }

  /* the drawing: photo + dimension lines + callouts */
  .fig { position: absolute; left: 15vmin; right: 7vmin; top: 12vmin; height: calc(60% - 14vmin); }
  .fig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .fig .frame { position: absolute; inset: 0; outline: 1px solid rgba(242,246,255,.9); outline-offset: .8vmin; }
  .dim { position: absolute; }
  .dim.v { left: -7vmin; top: 0; bottom: 0; width: 3vmin; border-left: .25vmin solid #F2F6FF; margin-left: 1.4vmin; }
  .dim.v::before, .dim.v::after { content: ""; position: absolute; left: -1.6vmin; width: 5vmin; border-top: .25vmin solid #F2F6FF; }
  .dim.v::before { top: 0; } .dim.v::after { bottom: 0; }
  .dim.v span { position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); background: #1C4A87; padding: .4vmin 1.2vmin; font-size: 1.7vmin; letter-spacing: .08em; white-space: nowrap; }
  .dim.h { left: 0; right: 0; bottom: -5.6vmin; height: 3vmin; border-top: .25vmin solid #F2F6FF; }
  .dim.h::before, .dim.h::after { content: ""; position: absolute; top: -3.4vmin; height: 5vmin; border-left: .25vmin solid #F2F6FF; }
  .dim.h::before { left: 0; } .dim.h::after { right: 0; }
  .dim.h span { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); background: #1C4A87; padding: .2vmin 1.2vmin; font-size: 1.7vmin; letter-spacing: .08em; white-space: nowrap; }
  .pin { position: absolute; right: -2.2vmin; width: 4.4vmin; height: 4.4vmin; border-radius: 50%; background: #1C4A87; border: .25vmin solid #F2F6FF; display: flex; align-items: center; justify-content: center; font-size: 1.8vmin; font-weight: 500; box-sizing: border-box; }
  .p1 { top: 14%; } .p2 { top: 46%; } .p3 { top: 78%; }

  /* the text block */
  .spec { position: absolute; left: 5vmin; right: 5vmin; top: calc(60% + 5.4vmin); bottom: 5vmin; display: flex; flex-direction: column; }
  .row1 { display: flex; justify-content: space-between; gap: 4vmin; }
  h1 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600; font-size: 14vmin; line-height: .84; letter-spacing: -.005em; text-transform: uppercase; }
  .notes { margin: .6vmin 0 0; padding: 0; list-style: none; font-size: 1.9vmin; line-height: 1.3; min-width: 0; }
  .notes li { display: flex; gap: 1.4vmin; align-items: baseline; padding: .9vmin 0; border-bottom: 1px dashed rgba(242,246,255,.55); white-space: nowrap; }
  .notes li i { font-style: normal; flex: none; width: 3vmin; height: 3vmin; border-radius: 50%; border: .2vmin solid #F2F6FF; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6vmin; box-sizing: border-box; }

  .ruler { margin-top: auto; padding-top: 2.4vmin; width: 40vmin; max-width: 100%; }
  .ruler i { display: block; height: 1.2vmin; border: .2vmin solid #F2F6FF; background: repeating-linear-gradient(90deg, #F2F6FF 0 20%, transparent 20% 40%); }
  .ruler div { display: flex; justify-content: space-between; margin-top: .6vmin; font-size: 1.6vmin; letter-spacing: .06em; }
  .tb { margin-top: 2.4vmin; display: grid; grid-template-columns: 1fr 1fr 1.25fr; border: .25vmin solid #F2F6FF; }
  .tb div { padding: 1.3vmin 1.6vmin; border-right: .25vmin solid #F2F6FF; display: flex; flex-direction: column; justify-content: space-between; gap: .6vmin; min-width: 0; }
  .tb div:last-child { border-right: 0; }
  .tb small { font-size: 1.6vmin; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
  .tb b { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 4.4vmin; line-height: 1; white-space: nowrap; }
  .tb .cta { background: #F2F6FF; color: #1C4A87; justify-content: center; }
  .tb .cta small { opacity: 1; }
  .tb .cta b { font-size: 3.6vmin; }

  /* SHORTER PORTRAIT / SQUARE / WIDE — drawing left, spec sheet right */
  @media (min-aspect-ratio: 7/10) {
    .top { left: 4.4vmin; right: 4.4vmin; }
    .fig { left: 13vmin; top: 12vmin; right: auto; width: calc(52% - 16vmin); height: calc(100% - 23vmin); }
    .spec { left: calc(52% + 3vmin); right: 4.4vmin; top: 11vmin; bottom: 4.4vmin; }
    .row1 { flex-direction: column; gap: 2.6vmin; }
    h1 { font-size: 10.4vmin; }
    .notes { font-size: 1.8vmin; }
    .tb { grid-template-columns: 1fr 1fr; }
    .tb .cta { grid-column: 1 / -1; border-right: 0; border-top: .25vmin solid #F2F6FF; flex-direction: row; align-items: center; justify-content: space-between; }
    .tb div:nth-child(2) { border-right: 0; }
    .tb b { font-size: 3.8vmin; }
    .tb .cta b { font-size: 3.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .fig { width: calc(48% - 16vmin); }
    .spec { left: calc(48% + 3vmin); }
    h1 { font-size: 9.4vmin; }
    .row1 { gap: 2vmin; }
    .notes li { padding: .6vmin 0; }
  }
  @media (min-aspect-ratio: 6/5) {
    .fig { width: calc(40% - 16vmin); }
    .spec { left: calc(40% + 4vmin); right: 5vmin; top: 12vmin; bottom: 5vmin; }
    .row1 { flex-direction: row; gap: 5vmin; align-items: flex-start; }
    h1 { font-size: 15vmin; }
    .notes { flex: 1; }
    .tb { grid-template-columns: 1fr 1fr 1.25fr; }
    .tb .cta { grid-column: auto; border-top: 0; flex-direction: column; align-items: flex-start; justify-content: center; }
    .tb div:nth-child(2) { border-right: .25vmin solid #F2F6FF; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ───────── */
  /* the drafting sheet drifts diagonally by exactly one major grid square per loop */
  .banner { animation: drift 6s linear infinite; }
  @keyframes drift { from { background-position: 0 0, 0 0, 0 0, 0 0; } to { background-position: 12.5vmin 12.5vmin, 12.5vmin 12.5vmin, 12.5vmin 12.5vmin, 12.5vmin 12.5vmin; } }
  /* callouts: pins 1-2-3 light up in sequence, each with its spec line */
  .pin { animation: pin 6s linear infinite; }
  .p2 { animation-delay: -5.4s; } .p3 { animation-delay: -4.8s; }
  @keyframes pin {
    0%, 6% { transform: scale(1); background-color: #1C4A87; color: #F2F6FF; animation-timing-function: cubic-bezier(.2,.8,.3,1.3); }
    9% { transform: scale(1.22); background-color: #F2F6FF; color: #1C4A87; animation-timing-function: cubic-bezier(.4,0,.3,1); }
    14%, 22% { transform: scale(1); background-color: #F2F6FF; color: #1C4A87; animation-timing-function: cubic-bezier(.4,0,.3,1); }
    28%, 100% { transform: scale(1); background-color: #1C4A87; color: #F2F6FF; }
  }
  .pin::after { content: ""; position: absolute; inset: -.25vmin; border-radius: 50%; border: .25vmin solid #F2F6FF; opacity: 0; animation: ping 6s linear infinite; animation-delay: inherit; }
  @keyframes ping {
    0%, 7% { transform: scale(1); opacity: 0; }
    8% { transform: scale(1); opacity: .9; animation-timing-function: cubic-bezier(.15,.6,.35,1); }
    24%, 100% { transform: scale(2.1); opacity: 0; }
  }
  .notes li { animation: note 6s linear infinite; }
  .notes li:nth-child(2) { animation-delay: -5.4s; } .notes li:nth-child(3) { animation-delay: -4.8s; }
  @keyframes note {
    0%, 7% { background-color: rgba(242,246,255,0); }
    10%, 22% { background-color: rgba(242,246,255,.13); }
    28%, 100% { background-color: rgba(242,246,255,0); }
  }
  .notes li i { animation: noteI 6s linear infinite; animation-delay: inherit; }
  @keyframes noteI {
    0%, 7% { background-color: rgba(242,246,255,0); color: #F2F6FF; }
    10%, 22% { background-color: #F2F6FF; color: #1C4A87; }
    28%, 100% { background-color: rgba(242,246,255,0); color: #F2F6FF; }
  }
  /* dimension lines are re-drafted: they close to their midpoint and draw back out */
  .dim.v { clip-path: inset(0 -7vmin 0 -7vmin); animation: drawV 6s linear infinite; }
  @keyframes drawV {
    0%, 50% { clip-path: inset(0 -7vmin 0 -7vmin); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    55% { clip-path: inset(50% -7vmin 50% -7vmin); animation-timing-function: cubic-bezier(.2,.7,.2,1); }
    56% { clip-path: inset(50% -7vmin 50% -7vmin); animation-timing-function: cubic-bezier(.3,0,.1,1); }
    68%, 100% { clip-path: inset(0 -7vmin 0 -7vmin); }
  }
  .dim.h { clip-path: inset(-7vmin -1vmin -7vmin -1vmin); animation: drawH 6s linear infinite; }
  @keyframes drawH {
    0%, 53% { clip-path: inset(-7vmin -1vmin -7vmin -1vmin); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    58%, 59% { clip-path: inset(-7vmin 50% -7vmin 50%); animation-timing-function: cubic-bezier(.3,0,.1,1); }
    71%, 100% { clip-path: inset(-7vmin -1vmin -7vmin -1vmin); }
  }
  /* photo: a slow push-in inside its drawing frame */
  .fig .ph { position: absolute; inset: 0; overflow: hidden; }
  .fig img { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  /* title block CTA: a light sheen + the arrow nudges */
  .tb .cta { position: relative; overflow: hidden; }
  .tb .cta::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 30%;
    background: linear-gradient(90deg, rgba(28,74,135,0) 0%, rgba(28,74,135,.06) 30%, rgba(28,74,135,.2) 50%, rgba(28,74,135,.06) 70%, rgba(28,74,135,0) 100%);
    transform: translateX(-160%) skewX(-18deg); animation: sheen 6s linear infinite; }
  @keyframes sheen {
    0%, 74% { transform: translateX(-160%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    90%, 100% { transform: translateX(400%) skewX(-18deg); }
  }
  .tb .cta .ar { display: inline-block; animation: nudge 6s linear infinite; }
  @keyframes nudge {
    0%, 78% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    82% { transform: translateX(1vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    86% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    90% { transform: translateX(1vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    94%, 100% { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="top"><span>Dwg. D-26-07 · front elevation</span><span>Scale 1:1</span></div>
  <div class="fig">
    <div class="ph"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
    <div class="frame"></div>
    <div class="dim v"><span>H — fig. 01</span></div>
    <div class="dim h"><span>W — the new core</span></div>
    <div class="pin p1">1</div><div class="pin p2">2</div><div class="pin p3">3</div>
  </div>
  <div class="spec">
    <div class="row1">
      <h1>Built<br>to spec.</h1>
      <ul class="notes">
        <li><i>1</i>Cut — made to move</li>
        <li><i>2</i>Material — made to last</li>
        <li><i>3</i>Finish — checked by hand</li>
      </ul>
    </div>
    <div class="ruler"><i></i><div><span>0</span><span>5</span><span>10</span><span>15</span><span>20</span><span>25 cm</span></div></div>
    <div class="tb">
      <div><small>Offer</small><b>−20%</b></div>
      <div><small>Code</small><b>SPEC20</b></div>
      <div class="cta"><small>Atelier Nord</small><b>Shop the core <span class="ar">→</span></b></div>
    </div>
  </div>
</div>
</body>
</html>
