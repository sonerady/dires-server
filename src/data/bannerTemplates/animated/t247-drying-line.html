<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Drying Line — prints hung to dry on a steel wire against the darkroom's white tiles: the big colour print held by
     two bulldog clips, two small silver (B&W) proofs on a second line, and a pencilled slip clipped beside them.
     tall → big print on top, proofs + copy below · square & wide → big print left, proofs + copy right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #E7E6E2; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #1A1918; font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif;
    background-color: #E7E6E2;
    background-image: linear-gradient(90deg, rgba(150,148,142,.35) 1px, transparent 1px), linear-gradient(0deg, rgba(150,148,142,.35) 1px, transparent 1px);
    background-size: 14vmin 14vmin; background-position: -1vmin -1vmin; }
  .wire { position: absolute; left: 0; right: 0; height: .35vmin; background: linear-gradient(180deg, #8C8B86, #3A3936); box-shadow: 0 .4vmin .5vmin rgba(0,0,0,.15); }
  .w1 { top: 6.4vmin; }

  /* bulldog clip */
  .clip { position: absolute; top: -2.2vmin; width: 4vmin; height: 3.4vmin; z-index: 2; }
  .clip::before { content: ""; position: absolute; left: .6vmin; right: .6vmin; top: -1.6vmin; height: 2.4vmin; border: .35vmin solid #6F6E69; border-bottom: 0; border-radius: 1.4vmin 1.4vmin 0 0; }
  .clip::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #2E2D2B, #151413); border-radius: .3vmin .3vmin .5vmin .5vmin; box-shadow: 0 .3vmin .6vmin rgba(0,0,0,.35); }

  .main { position: absolute; left: 7vmin; top: 8.2vmin; width: calc(100% - 14vmin); height: calc(100% - 8.2vmin - 64vmin); box-shadow: 0 1.2vmin 2.4vmin rgba(40,38,34,.22); }
  .main img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  .main .c1 { left: 18%; } .main .c2 { right: 18%; }

  .side { position: absolute; left: 7vmin; right: 7vmin; bottom: 5.6vmin; height: 57vmin; display: flex; flex-direction: column; }
  .side .wire { top: 0; left: -7vmin; right: -7vmin; }
  .line { position: relative; flex: none; display: flex; gap: 3.4vmin; align-items: flex-start; padding-top: 1.6vmin; }
  .proof { position: relative; flex: none; width: 23vmin; height: 18vmin; background: #FBFAF7; padding: 1vmin; box-sizing: border-box; box-shadow: 0 .8vmin 1.6vmin rgba(40,38,34,.2); }
  .proof img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.1); }
  .proof .clip { left: calc(50% - 2vmin); }
  .p1 { transform: rotate(-2.4deg); transform-origin: 50% 0; }
  .p1 img { object-position: 50% 18%; }
  .p2 { transform: rotate(1.8deg); transform-origin: 50% 0; }
  .p2 img { object-position: 50% 60%; transform: scale(1.5); transform-origin: 50% 55%; }
  .p2 { overflow: visible; }
  .p2 .win { width: 100%; height: 100%; overflow: hidden; }
  .slip { position: relative; flex: 1; min-width: 0; margin-top: .4vmin; background: #FBFAF7; padding: 2vmin 1.8vmin 1.6vmin; box-shadow: 0 .6vmin 1.2vmin rgba(40,38,34,.16); transform: rotate(-1.2deg); transform-origin: 50% 0; font-family: "Caveat", "Bradley Hand", cursive; font-weight: 600; font-size: 3.2vmin; line-height: 1.05; color: #3A3936; }
  .slip .clip { left: calc(50% - 2vmin); }
  .slip b { display: block; font-weight: 700; font-size: 5.4vmin; color: #B8321F; line-height: 1; margin-top: .6vmin; }

  .copy { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; }
  .kick { font-size: 1.7vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #5E5C57; }
  h1 { margin: 1.2vmin 0 0; font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 13vmin; line-height: .86; letter-spacing: -.03em; }
  .row { margin-top: 2.4vmin; display: flex; justify-content: space-between; align-items: flex-end; gap: 3vmin; }
  .sub { margin: 0; font-size: 2.1vmin; line-height: 1.4; }
  .cta { flex: none; background: #1A1918; color: #F2F1ED; padding: 1.4vmin 2.2vmin; font-size: 1.8vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .w1 { top: 5.4vmin; }
    .main { left: 5vmin; top: 7.2vmin; width: 52%; height: calc(100% - 12.2vmin); }
    .side { left: calc(52% + 10vmin); right: 5vmin; top: 7.2vmin; bottom: 5vmin; height: auto; }
    .side > .wire { display: none; }
    .line { padding-top: 0; gap: 2.4vmin; }
    .proof { width: calc(50% - 1.2vmin); height: 26vmin; padding: .8vmin; }
    .p2 { display: none; }
    .slip { font-size: 2.6vmin; padding: 1.8vmin 1.4vmin 1.4vmin; }
    .slip b { font-size: 4.4vmin; }
    h1 { font-size: 8.6vmin; }
    .row { flex-direction: column; align-items: flex-start; gap: 2.2vmin; }
    .sub { font-size: 1.8vmin; }
    .cta { font-size: 1.7vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .main { width: 48%; }
    .side { left: calc(48% + 10vmin); }
    .proof { height: 24vmin; }
    h1 { font-size: 9.4vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .main { width: 42%; left: 6vmin; }
    .side { left: calc(42% + 12vmin); right: 6vmin; }
    .line { flex-wrap: nowrap; gap: 3vmin; }
    .proof { width: 20vmin; height: 27vmin; }
    .p2 { display: block; }
    .slip { margin-top: .4vmin; font-size: 2.8vmin; }
    .slip b { font-size: 4.6vmin; }
    h1 { font-size: 13vmin; }
    .row { flex-direction: row; align-items: flex-end; }
    .sub { font-size: 2vmin; }
  }

  /* ── motion (6s loop) · a draught through the darkroom: the proofs and the pencilled slip swing on the wire
     out of phase · a wet-gloss sheen slides down the big print · the −15% is re-pencilled · "Fresh prints."
     is re-developed from the top, the CTA pulses once */
  .p1 { animation: swing1 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes swing1 { 0%, 100% { transform: rotate(-2.4deg); } 50% { transform: rotate(-.6deg); } }
  .p2 { animation: swing2 3s cubic-bezier(.45,0,.55,1) infinite; animation-delay: -.5s; }
  @keyframes swing2 { 0%, 100% { transform: rotate(1.8deg); } 33.3% { transform: rotate(1.8deg); } 50% { transform: rotate(3deg); } 83.3% { transform: rotate(.9deg); } }
  .slip { animation: swing3 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes swing3 { 0%, 100% { transform: rotate(-1.2deg); } 30% { transform: rotate(.4deg); } 65% { transform: rotate(-2.2deg); } }

  .main::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(175deg, transparent 0 42%, rgba(255,255,255,.2) 50%, transparent 58% 100%) no-repeat; background-size: 100% 300%; background-position: 0 100%;
    animation: wet 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes wet { 0%, 10% { background-position: 0 100%; } 40%, 100% { background-position: 0 0; } }

  .slip b { animation: pencil 6s cubic-bezier(.6,0,.3,1) infinite; }
  @keyframes pencil { 0%, 44% { clip-path: inset(-20% -10% -20% 0); } 48% { clip-path: inset(-20% 100% -20% 0); } 50% { clip-path: inset(-20% 100% -20% 0); } 60%, 100% { clip-path: inset(-20% -10% -20% 0); } }

  h1 { animation: develop 6s cubic-bezier(.7,0,.3,1) infinite; }
  @keyframes develop { 0%, 64% { clip-path: inset(-10% -5% -15% -5%); opacity: 1; } 70% { clip-path: inset(-10% -5% 100% -5%); opacity: 1; } 70.01% { clip-path: inset(-10% -5% -15% -5%); opacity: 0; } 82%, 100% { clip-path: inset(-10% -5% -15% -5%); opacity: 1; } }
  .cta { animation: cta 6s cubic-bezier(.3,0,.2,1) infinite; }
  @keyframes cta { 0%, 84% { transform: none; } 88% { transform: scale(1.07); } 92% { transform: scale(.98); } 95%, 100% { transform: none; } }
</style>
</head>
<body>
<div class="banner">
  <div class="wire w1"></div>
  <div class="main"><img src="{{PRODUCT_IMAGE}}" alt=""><i class="clip c1"></i><i class="clip c2"></i></div>
  <div class="side">
    <div class="wire"></div>
    <div class="line">
      <div class="proof p1"><img src="{{PRODUCT_IMAGE}}" alt=""><i class="clip"></i></div>
      <div class="proof p2"><div class="win"><img src="{{PRODUCT_IMAGE}}" alt=""></div><i class="clip"></i></div>
      <div class="slip"><i class="clip"></i>Still wet — first order<b>−15%</b></div>
    </div>
    <div class="copy">
      <div class="kick">Hung today · New in</div>
      <h1>Fresh<br>prints.</h1>
      <div class="row"><p class="sub">The new-in edit, straight<br>from the darkroom to you.</p><div class="cta">Shop new in →</div></div>
    </div>
  </div>
</div>
</body>
</html>
