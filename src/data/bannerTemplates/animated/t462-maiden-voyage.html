<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Maiden Voyage — a 1930s ocean-liner poster seen from the waterline: the black bow rises head-on under the photo,
     a cream rail and a row of portholes along the flare, the red boot-topping at the waterline, the stem splitting a
     white bow wave on a banded sea. All copy is painted on the hull. tall / 3:4 → photo above the bow;
     square / wide → the bow fills the left panel full height, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #111418; }
  .banner { --hull: #111418; --cream: #F2EBDD; --red: #B8322A; --sky: #C9D8DF; --pan: 86vmin; --wl: 80%; --in: 21%;
    position: fixed; inset: 0; overflow: hidden; background: var(--sky); color: var(--cream);
    font-family: "Jost", "Futura", "Helvetica Neue", Arial, sans-serif; }
  .ph { position: absolute; left: 0; right: 0; top: 0; height: calc(100% - var(--pan)); overflow: hidden; }
  .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .ph::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 13vmin;
    background: linear-gradient(to bottom, rgba(17,20,24,0.5) 0%, rgba(17,20,24,0.493) 7.7%, rgba(17,20,24,0.472) 15.4%, rgba(17,20,24,0.437) 23.1%, rgba(17,20,24,0.392) 30.8%, rgba(17,20,24,0.339) 38.5%, rgba(17,20,24,0.28) 46.2%, rgba(17,20,24,0.22) 53.8%, rgba(17,20,24,0.162) 61.5%, rgba(17,20,24,0.108) 69.2%, rgba(17,20,24,0.063) 76.9%, rgba(17,20,24,0.029) 84.6%, rgba(17,20,24,0.008) 92.3%, rgba(17,20,24,0) 100%); }
  .line { position: absolute; left: 6vmin; right: 6vmin; top: 4vmin; display: flex; justify-content: space-between; font-size: 1.8vmin; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 .2vmin .8vmin rgba(0,0,0,.45); z-index: 2; }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: var(--pan); overflow: hidden;
    background: repeating-linear-gradient(180deg, transparent 0 2.2vmin, rgba(255,255,255,.22) 2.2vmin 2.5vmin), var(--sky); }
  .hull { position: absolute; left: 0; right: 0; top: 0; height: var(--wl);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--in) * .42) 22%, calc(100% - var(--in) * .7) 46%, calc(100% - var(--in) * .88) 72%, calc(100% - var(--in)) 100%, var(--in) 100%, calc(var(--in) * .88) 72%, calc(var(--in) * .7) 46%, calc(var(--in) * .42) 22%);
    background: linear-gradient(90deg, #07090B 0%, #15191E 38%, #1E232A 50%, #15191E 62%, #0B0D10 100%); }
  .hull::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1.4vmin; background: var(--cream); box-shadow: 0 1.2vmin 0 -.9vmin var(--cream); }
  .hull::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(242,235,221,.18); }
  .boot { position: absolute; left: 0; right: 0; bottom: 0; height: 7vmin; background: var(--red); }
  .ports { position: absolute; left: 7vmin; right: 7vmin; top: 5vmin; display: flex; justify-content: space-between; }
  .ports i { width: 2.6vmin; height: 2.6vmin; border-radius: 50%; box-sizing: border-box; border: .5vmin solid #B9B2A4; background: radial-gradient(circle at 35% 35%, #F6D892, #C98F3A 70%); box-shadow: 0 0 1.4vmin rgba(246,216,146,.35); }
  .sea { position: absolute; left: 0; right: 0; bottom: 0; height: calc(100% - var(--wl) + 2.4vmin);
    background: linear-gradient(180deg, #2F6698 0 2.6vmin, #24507F 2.6vmin 6vmin, #1B3A63 6vmin); }
  .sea::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, transparent 0 2vmin, rgba(242,235,221,.16) 2vmin 2.3vmin); }
  .foam { position: absolute; left: 50%; bottom: calc(100% - var(--wl) - 5.4vmin); width: 64vmin; height: 10vmin; transform: translateX(-50%); }

  .copy { position: absolute; left: 0; right: 0; top: 10vmin; text-align: center; }
  .copy small { display: block; font-size: 1.9vmin; font-weight: 600; letter-spacing: .42em; padding-left: .42em; text-transform: uppercase; color: #D9C9A6; }
  h1 { margin: 1.4vmin 0 0; font-family: "Bebas Neue", "Oswald", "Arial Narrow", sans-serif; font-weight: 400; font-size: 14.4vmin; line-height: .86; letter-spacing: .03em; }
  h1 span { display: inline; }
  .sub { margin-top: 1.8vmin; font-size: 2.3vmin; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .deal { display: inline-flex; margin-top: 3.4vmin; border-top: 1px solid rgba(242,235,221,.5); border-bottom: 1px solid rgba(242,235,221,.5); white-space: nowrap; }
  .deal div { padding: 1.3vmin 2.4vmin 1.1vmin; font-size: 1.9vmin; letter-spacing: .14em; text-transform: uppercase; }
  .deal div + div { border-left: 1px solid rgba(242,235,221,.5); }
  .deal b { display: block; font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: 5.4vmin; line-height: 1; letter-spacing: .04em; margin-top: .4vmin; color: #F6D892; }
  .wl { position: absolute; left: 0; right: 0; bottom: calc(100% - var(--wl) + 9.4vmin); text-align: center; font-size: 1.9vmin; font-weight: 600; letter-spacing: .34em; padding-left: .34em; text-transform: uppercase; color: var(--cream); white-space: nowrap; z-index: 1; }

  /* 3:4 · 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .banner { --pan: 76vmin; --wl: 80%; --in: 20%; }
    .copy { top: 8.4vmin; }
    h1 { font-size: 12.8vmin; }
    .deal { margin-top: 2.6vmin; }
    .deal b { font-size: 4.8vmin; }
    .boot { height: 6vmin; }
  }
  /* square */
  @media (min-aspect-ratio: 9/10) {
    .banner { --pan: 100%; --wl: 82%; --in: 16%; }
    .ph { left: auto; right: 0; width: 52%; height: 100%; }
    .ph::after { display: none; }
    .line { display: none; }
    .panel { top: 0; right: auto; width: 48%; height: 100%; }
    .ports { left: 5vmin; right: 5vmin; top: 4.6vmin; }
    .ports i { width: 2.2vmin; height: 2.2vmin; border-width: .4vmin; }
    .copy { top: 13vmin; }
    h1 { font-size: 13.4vmin; }
    h1 span { display: block; }
    .sub { font-size: 1.8vmin; letter-spacing: .1em; margin-top: 2vmin; }
    .deal { margin-top: 3vmin; }
    .deal div { padding: 1.1vmin 1.6vmin .9vmin; font-size: 1.6vmin; letter-spacing: .1em; }
    .deal b { font-size: 4.4vmin; }
    .boot { height: 5.4vmin; }
    .wl { font-size: 1.7vmin; letter-spacing: .24em; }
    .foam { width: 40vmin; height: 8vmin; bottom: calc(100% - var(--wl) - 4.4vmin); }
  }
  /* wide */
  @media (min-aspect-ratio: 6/5) {
    .banner { --in: 15%; }
    .ph { width: 54%; }
    .panel { width: 46%; }
    .ports { left: 6vmin; right: 6vmin; }
    .copy { top: 12vmin; }
    h1 { font-size: 15vmin; }
    .sub { font-size: 2vmin; letter-spacing: .14em; }
    .deal div { padding: 1.2vmin 2.2vmin 1vmin; font-size: 1.8vmin; }
    .deal b { font-size: 5vmin; }
    .wl { font-size: 1.8vmin; letter-spacing: .3em; }
    .foam { width: 50vmin; }
  }
  /* ───────── motion (6s loop) ─────────
     constant: the banded sea rolls toward the viewer (one band per 3s) and the bow wave surges and settles with it ·
     photo breathes (slow 1.03 push) · 1.2s the portholes light up down the flare, one after another ·
     2.8s the name rises back out of the horizon (bottom-up wipe) · 4.4s the gold fare catches the light */
  .ph img { animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  .sea::before { animation: roll 3s linear infinite; }
  @keyframes roll { from { background-position: 0 0; } to { background-position: 0 2.3vmin; } }
  .foam { transform-origin: 50% 10%; animation: surge 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes surge { 0%, 100% { transform: translateX(-50%) scale(1, 1); } 50% { transform: translateX(-50%) scale(1.07, 1.14); } }

  .ports i { animation: lamp 6s cubic-bezier(.3,0,.3,1) infinite; }
  .ports i:nth-child(1) { animation-delay: .0s; }
  .ports i:nth-child(2) { animation-delay: -.08s; }
  .ports i:nth-child(3) { animation-delay: -.16s; }
  .ports i:nth-child(4) { animation-delay: -.24s; }
  .ports i:nth-child(5) { animation-delay: -.32s; }
  .ports i:nth-child(6) { animation-delay: -.40s; }
  .ports i:nth-child(7) { animation-delay: -.48s; }
  .ports i:nth-child(8) { animation-delay: -.56s; }
  .ports i:nth-child(9) { animation-delay: -.64s; }
  @keyframes lamp {
    0%, 20%, 42%, 100% { filter: brightness(1); box-shadow: 0 0 1.4vmin rgba(246,216,146,.35); }
    24% { filter: brightness(1.45); box-shadow: 0 0 3.2vmin rgba(246,216,146,.9); }
  }

  h1 { animation: rise 6s cubic-bezier(.7,0,.2,1) infinite; }
  @keyframes rise {
    0%, 44% { clip-path: inset(-10% -5% -10% -5%); transform: translateY(0); }
    50%, 52% { clip-path: inset(-10% -5% 100% -5%); transform: translateY(3vmin); }
    63%, 100% { clip-path: inset(-10% -5% -10% -5%); transform: translateY(0); }
  }
  .deal b { animation: fare 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes fare {
    0%, 72%, 90%, 100% { color: #F6D892; text-shadow: 0 0 0 rgba(246,216,146,0); }
    78% { color: #FFF1C9; text-shadow: 0 0 2vmin rgba(246,216,146,.8); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="ph"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="line"><span>Atelier Nord Line</span><span>Nº 4</span></div>
  <div class="panel">
    <div class="hull">
      <div class="ports"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="boot"></div>
    </div>
    <div class="sea"></div>
    <svg class="foam" viewBox="0 0 640 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M320 0 Q 306 34 262 50 Q 244 40 226 56 Q 196 50 176 66 Q 140 58 112 74 Q 70 68 0 86 L 0 100 L 640 100 L 640 86 Q 570 68 528 74 Q 500 58 464 66 Q 444 50 414 56 Q 396 40 378 50 Q 334 34 320 0 Z" fill="#F2EBDD"/>
      <path d="M320 26 Q 300 56 240 70 Q 180 80 60 92 L 580 92 Q 460 80 400 70 Q 340 56 320 26 Z" fill="#2F6698" opacity=".45"/>
      <path d="M20 97 Q 170 90 300 95 T 620 96" stroke="#F2EBDD" stroke-width="2.5" fill="none" opacity=".7"/>
    </svg>
    <div class="copy">
      <small>The resort collection</small>
      <h1><span>Maiden</span> <span>Voyage</span></h1>
      <div class="sub">Sets sail 14 May</div>
      <div class="deal"><div>First class<b>−25%</b></div><div>Code<b>MAIDEN25</b></div></div>
    </div>
    <div class="wl">Board online · All ports</div>
  </div>
</div>
</body>
</html>
