<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500;12..96,75..100,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* School Run — the family morning on tarmac: a zebra crossing band, a round crossing-patrol sign in signal yellow,
     and the 07:30 → 08:25 timeline of the school run. tall → photo above, crossing band, copy on tarmac;
     square/wide → photo left, crossing band as a vertical strip, copy right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #26272A; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #26272A; color: #F4F1E8; font-family: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif; }
  .tar { position: absolute; inset: 0; background:
    radial-gradient(circle at 30% 40%, rgba(255,255,255,.035) 0 .15vmin, transparent .2vmin) 0 0 / 1.3vmin 1.3vmin,
    radial-gradient(circle at 70% 70%, rgba(0,0,0,.25) 0 .15vmin, transparent .2vmin) 0 0 / 1.7vmin 1.7vmin; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 74vmin); object-fit: cover; object-position: 50% 22%; }
  .zebra { position: absolute; left: 0; right: 0; top: calc(100% - 74vmin); height: 7vmin;
    background: repeating-linear-gradient(90deg, #EDEAE0 0 7vmin, transparent 7vmin 12vmin); opacity: .92; }

  .sign { position: absolute; right: 6vmin; top: calc(100% - 74vmin + 11vmin); width: 21vmin; height: 21vmin; border-radius: 50%; background: #F2C230; color: #1D1D1F;
    box-shadow: inset 0 0 0 .9vmin #F2C230, inset 0 0 0 1.3vmin #1D1D1F; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-6deg); z-index: 2; }
  .sign span { font-family: "DM Mono", monospace; font-size: 1.6vmin; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .sign b { font-stretch: 75%; font-weight: 800; font-size: 5.6vmin; line-height: .9; text-transform: uppercase; margin: 1vmin 0 .8vmin; }

  .copy { position: absolute; left: 6vmin; right: 6vmin; bottom: 5vmin; top: calc(100% - 74vmin + 12vmin); display: flex; flex-direction: column; }
  .k { width: fit-content; font-family: "DM Mono", monospace; font-size: 1.8vmin; letter-spacing: .14em; text-transform: uppercase; color: #F2C230; }
  h1 { margin: 1.6vmin 0 0; max-width: calc(100% - 24vmin); width: fit-content; font-stretch: 75%; font-weight: 800; font-size: 12vmin; line-height: .86; letter-spacing: -.01em; text-transform: uppercase; }
  h1 em { font-style: normal; color: #F2C230; }

  .tl { position: relative; display: flex; justify-content: space-between; margin-top: auto; padding-top: 2.6vmin; }
  .tl::before { content: ""; position: absolute; left: .8vmin; right: .8vmin; top: .75vmin; border-top: .3vmin dashed rgba(244,241,232,.45); }
  .st { position: relative; font-family: "DM Mono", monospace; font-size: 1.8vmin; line-height: 1.35; }
  .st::before { content: ""; position: absolute; left: 0; top: -2.6vmin; width: 1.6vmin; height: 1.6vmin; border-radius: 50%; background: #26272A; box-shadow: inset 0 0 0 .3vmin #F4F1E8; }
  .st b { display: block; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 3.2vmin; letter-spacing: -.01em; }
  .st.on::before { background: #F2C230; box-shadow: none; }
  .st.on { color: #F2C230; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 3vmin; margin-top: 4vmin; padding-top: 3vmin; border-top: 1px solid rgba(244,241,232,.25); }
  .offer { font-size: 2.6vmin; font-weight: 500; line-height: 1.25; }
  .offer b { font-weight: 800; color: #F2C230; }
  .cta { flex: none; background: #F2C230; color: #1D1D1F; padding: 2vmin 3.4vmin; border-radius: 99vmin; font-weight: 800; font-size: 2.6vmin; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }

  /* 3:4 / 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 64vmin); }
    .zebra { top: calc(100% - 64vmin); height: 6vmin; }
    .sign { top: calc(100% - 64vmin + 9vmin); width: 18vmin; height: 18vmin; }
    .sign b { font-size: 4.8vmin; }
    .copy { top: calc(100% - 64vmin + 10vmin); bottom: 4.4vmin; }
    h1 { font-size: 10.4vmin; max-width: calc(100% - 22vmin); }
    .foot { margin-top: 3vmin; padding-top: 2.4vmin; }
  }
  /* square / wide: photo left, crossing as a vertical strip */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 48%; height: 100%; object-position: 50% 28%; }
    .zebra { left: 48%; right: auto; top: 0; bottom: 0; width: 6vmin; height: auto;
      background: repeating-linear-gradient(0deg, #EDEAE0 0 6vmin, transparent 6vmin 10.5vmin); }
    .copy { left: calc(48% + 11vmin); right: 5vmin; top: 6vmin; bottom: 5vmin; }
    .sign { top: auto; bottom: 30vmin; right: 5vmin; width: 16vmin; height: 16vmin; }
    .sign b { font-size: 4.2vmin; }
    .sign span { font-size: 1.6vmin; }
    h1 { max-width: none; font-size: 8.4vmin; margin-top: 2vmin; }
    .tl { flex-direction: column; gap: 1.8vmin; padding-top: 0; margin-top: 4vmin; }
    .tl::before { left: .75vmin; right: auto; top: 1vmin; bottom: 1vmin; border-top: 0; border-left: .3vmin dashed rgba(244,241,232,.45); }
    .st { padding-left: 3.6vmin; font-size: 1.7vmin; }
    .st::before { top: .6vmin; }
    .st b { display: inline; font-size: 2.6vmin; margin-right: 1.4vmin; }
    .foot { flex-direction: column; align-items: flex-start; gap: 2.4vmin; margin-top: auto; padding-top: 2.6vmin; }
    .offer { font-size: 2.3vmin; }
    .cta { font-size: 2.3vmin; padding: 1.8vmin 3vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .zebra { left: 46%; width: 7vmin; }
    .copy { left: calc(46% + 14vmin); right: 7vmin; top: 8vmin; bottom: 7vmin; }
    h1 { font-size: 10.4vmin; max-width: calc(100% - 26vmin); }
    .sign { top: 7vmin; bottom: auto; right: 7vmin; width: 21vmin; height: 21vmin; }
    .sign b { font-size: 5.4vmin; }
    .tl { margin-top: 5vmin; }
    .foot { flex-direction: row; align-items: center; justify-content: space-between; }
    .offer { font-size: 2.5vmin; }
  }

  /* ───────── motion (6 s loop · t=0 = static design) ─────────
     the school run plays out: the timeline's lit stop walks 07:45 → 08:10 → 08:25 → (next day) 07:30 → back to 07:45,
     headlights sweep across the crossing at 0.7 s, the patrol sign sways and gets raised ("stop!") at 3.4 s,
     "together." wipes out & back at 3.9 s, and a light glints across the CTA at 5 s */
  /* headlights sweep across the crossing (a car waiting at the stripes) */
  .zebra::after { content: ""; position: absolute; inset: -40% 0; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(90deg, transparent 0 38%, rgba(255,236,170,.55) 47%, rgba(255,250,230,.8) 50%, rgba(255,236,170,.55) 53%, transparent 62% 100%);
    background-size: 100% 100%; transform: translateX(-100%); animation: beam 6s cubic-bezier(.55,0,.35,1) infinite; }
  @keyframes beam { 0%, 12% { transform: translateX(-100%); } 42%, 100% { transform: translateX(100%); } }
  .zebra { overflow: hidden; }

  .sign { transform-origin: 50% 120%; animation: sway 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    18% { transform: rotate(-8deg) translateY(0); }
    40% { transform: rotate(-4.5deg) translateY(0); }
    56% { transform: rotate(-6deg) translateY(0); }
    60% { transform: rotate(-1.5deg) translateY(-1.6vmin) scale(1.05); }
    64% { transform: rotate(-7deg) translateY(.2vmin) scale(.99); }
    68% { transform: rotate(-5deg) translateY(0) scale(1); }
    82% { transform: rotate(-7.4deg) translateY(0); }
  }

  .st { animation: lab2 6s linear infinite; }
  .st::before { animation: dot2 6s cubic-bezier(.3,0,.3,1) infinite; }
  .st:nth-child(1) { animation-name: lab1; } .st:nth-child(1)::before { animation-name: dot1; }
  .st:nth-child(2) { animation-name: lab2; } .st:nth-child(2)::before { animation-name: dot2; }
  .st:nth-child(3) { animation-name: lab3; } .st:nth-child(3)::before { animation-name: dot3; }
  .st:nth-child(4) { animation-name: lab4; } .st:nth-child(4)::before { animation-name: dot4; }
  @keyframes lab1 { 0%, 68%, 87%, 100% { color: #F4F1E8; } 70%, 85% { color: #F2C230; } }
  @keyframes lab2 { 0%, 19%, 87%, 100% { color: #F2C230; } 21%, 85% { color: #F4F1E8; } }
  @keyframes lab3 { 0%, 19%, 37.7%, 100% { color: #F4F1E8; } 21%, 35.7% { color: #F2C230; } }
  @keyframes lab4 { 0%, 35.7%, 70%, 100% { color: #F4F1E8; } 37.7%, 68% { color: #F2C230; } }
  @keyframes dot1 { 0%, 68%, 87%, 100% { background: #26272A; box-shadow: inset 0 0 0 .3vmin #F4F1E8; transform: scale(1); }
    70% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1.35); } 73%, 85% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1); } }
  @keyframes dot2 { 0%, 19%, 100% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1); } 21%, 85% { background: #26272A; box-shadow: inset 0 0 0 .3vmin #F4F1E8; transform: scale(1); }
    87% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1.35); } 90% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1); } }
  @keyframes dot3 { 0%, 19%, 37.7%, 100% { background: #26272A; box-shadow: inset 0 0 0 .3vmin #F4F1E8; transform: scale(1); }
    21% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1.35); } 24%, 35.7% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1); } }
  @keyframes dot4 { 0%, 35.7%, 70%, 100% { background: #26272A; box-shadow: inset 0 0 0 .3vmin #F4F1E8; transform: scale(1); }
    37.7% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1.35); } 40.7%, 68% { background: #F2C230; box-shadow: inset 0 0 0 0 #F2C230; transform: scale(1); } }

  h1 em { display: inline-block; animation: wipe 6s cubic-bezier(.7,0,.2,1) infinite; }
  @keyframes wipe {
    0%, 64%, 100% { clip-path: inset(-10% -4% -10% 0); transform: translateX(0); }
    69% { clip-path: inset(-10% 104% -10% 0); transform: translateX(0); }
    70% { clip-path: inset(-10% -4% -10% 100%); transform: translateX(-2vmin); }
    77% { clip-path: inset(-10% -4% -10% 0); transform: translateX(0); }
  }

  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 60%; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.75) 50%, transparent 80%);
    transform: translateX(-120%); animation: glint 6s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes glint { 0%, 80% { transform: translateX(-120%); } 92%, 100% { transform: translateX(260%); } }
  .cta { animation: nudge 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes nudge { 0%, 80%, 92%, 100% { transform: scale(1); } 84% { transform: scale(1.05); } }

  @media (min-aspect-ratio: 9/10) {
    .zebra::after { inset: 0 -40%; background: linear-gradient(180deg, transparent 0 38%, rgba(255,236,170,.55) 47%, rgba(255,250,230,.8) 50%, rgba(255,236,170,.55) 53%, transparent 62% 100%);
      transform: translateY(-100%); animation-name: beamV; }
    @keyframes beamV { 0%, 12% { transform: translateY(-100%); } 42%, 100% { transform: translateY(100%); } }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="tar"></div>
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="zebra"></div>
  <div class="sign"><span>Big+small</span><b>School<br>run</b><span>edit</span></div>
  <div class="copy">
    <div class="k">Mon–Fri · 07:30 → 08:25</div>
    <h1>Out the door <em>together.</em></h1>
    <div class="tl">
      <div class="st"><b>07:30</b>Up</div>
      <div class="st on"><b>07:45</b>Dressed</div>
      <div class="st"><b>08:10</b>Out</div>
      <div class="st"><b>08:25</b>Gates</div>
    </div>
    <div class="foot">
      <div class="offer">Grown-up &amp; mini sets<br><b>3 for 2</b> this week</div>
      <div class="cta">Shop the edit</div>
    </div>
  </div>
</div>
</body>
</html>
