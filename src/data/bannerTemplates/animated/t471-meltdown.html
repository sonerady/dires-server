<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Meltdown — a 70s end-of-summer sale where the photo itself melts: its lower edge runs in heavy drips onto a
     chocolate floor, sunset-gradient Cooper-style type, a wavy sun sticker for the offer and a five-stripe horizon.
     tall / 3:4 → photo on top dripping into the copy panel · square / wide → photo left dripping onto the horizon */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #3A1A10; }
  .banner { --ph: 60%; position: fixed; inset: 0; overflow: hidden; background: #3A1A10; color: #F6E7CB; font-family: "Figtree", "Helvetica Neue", Arial, sans-serif; }
  .ph { position: absolute; left: 0; top: 0; width: 100%; height: var(--ph); }
  .ph img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; clip-path: url(#melt); }
  /* five-stripe horizon */
  .hz { position: absolute; left: 0; right: 0; bottom: 0; height: 6.5vmin;
    background: linear-gradient(180deg, #F2B33D 0 16%, transparent 16% 21%, #EB6B25 21% 37%, transparent 37% 42%, #C2401F 42% 58%, transparent 58% 63%, #E2587A 63% 79%, transparent 79% 84%, #7A2E57 84% 100%); }
  .copy { position: absolute; left: 7vmin; right: 7vmin; top: calc(var(--ph) + 5vmin); }
  .k { display: flex; justify-content: space-between; gap: 3vmin; font-size: 1.9vmin; font-weight: 900; letter-spacing: .26em; text-transform: uppercase; color: #F2B33D; white-space: nowrap; }
  .k span + span { color: rgba(246,231,203,.7); letter-spacing: .18em; }
  .pre { margin-top: 3.2vmin; font-size: 3vmin; font-weight: 900; letter-spacing: .34em; text-transform: uppercase; }
  h1 { margin: .6vmin 0 0 -.6vmin; font-family: "Caprasimo", "Cooper Black", Georgia, serif; font-weight: 400; font-size: 15.4vmin; line-height: .92; letter-spacing: -.01em;
    background: linear-gradient(180deg, #F9D05A 12%, #F08A2C 52%, #E0506A 92%); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
  h1 i { display: none; }
  .d { margin-top: 2.6vmin; font-size: 2.7vmin; font-weight: 500; line-height: 1.4; max-width: 54vmin; color: rgba(246,231,203,.9); }
  .d b { font-weight: 900; color: #F6E7CB; }
  .act { margin-top: 3.4vmin; display: flex; align-items: center; gap: 3vmin; flex-wrap: wrap; }
  .cta { display: inline-block; background: #F6E7CB; color: #3A1A10; border-radius: 99vmin; padding: 1.9vmin 4vmin; font-size: 2.4vmin; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .code { font-size: 2vmin; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(246,231,203,.78); white-space: nowrap; }
  .code b { color: #F2B33D; font-weight: 900; border-bottom: .3vmin solid #EB6B25; padding-bottom: .2vmin; }
  /* wavy sun sticker */
  .sun { position: absolute; right: 6vmin; top: calc(var(--ph) + 31vmin); width: 23vmin; height: 23vmin; }
  .sun svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; transform: rotate(-10deg); }
  .sun .t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #3A1A10; text-align: center; }
  .sun small { font-size: 1.8vmin; font-weight: 900; letter-spacing: .2em; line-height: 1.2; text-transform: uppercase; }
  .sun b { font-family: "Caprasimo", "Cooper Black", Georgia, serif; font-weight: 400; font-size: 7.8vmin; line-height: .95; }
  @media (min-aspect-ratio: 3/5) {
    .sun { width: 19vmin; height: 19vmin; }
    .sun b { font-size: 6.6vmin; }
    .sun small { font-size: 1.6vmin; }
  }
  /* 3:4 / 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .banner { --ph: 55%; }
    .copy { top: calc(var(--ph) + 3.6vmin); }
    .pre { margin-top: 2.4vmin; font-size: 2.6vmin; }
    h1 { font-size: 14vmin; }
    .d { display: none; }
    .act { margin-top: 2.8vmin; }
    .sun { top: calc(var(--ph) + 24vmin); width: 20vmin; height: 20vmin; right: 7vmin; }
    .sun b { font-size: 7vmin; }
    .sun small { font-size: 1.7vmin; }
    .hz { height: 5vmin; }
  }
  /* square → photo left, dripping onto the horizon */
  @media (min-aspect-ratio: 9/10) {
    .ph { width: 52%; height: 93%; }
    .ph img { object-position: 50% 22%; }
    .hz { height: 5vmin; }
    .copy { left: calc(52% + 5vmin); right: 5vmin; top: 7vmin; }
    .k { flex-direction: column; gap: 1vmin; font-size: 1.7vmin; }
    .pre { margin-top: 5vmin; font-size: 2.4vmin; }
    h1 { font-size: 12.4vmin; }
    h1 i { display: block; height: 0; }
    .d { display: block; font-size: 2.2vmin; max-width: none; margin-top: 2vmin; }
    .act { flex-direction: column; align-items: flex-start; gap: 2vmin; margin-top: 3vmin; }
    .cta { font-size: 2.1vmin; padding: 1.7vmin 3.4vmin; }
    .code { font-size: 1.8vmin; }
    .sun { top: auto; bottom: 7.5vmin; right: 5vmin; width: 18vmin; height: 18vmin; }
    .sun b { font-size: 6.4vmin; }
    .sun small { font-size: 1.6vmin; }
  }
  /* wide */
  @media (min-aspect-ratio: 6/5) {
    .ph { width: 50%; }
    .copy { left: calc(50% + 6vmin); right: 6vmin; top: 8vmin; }
    .k { flex-direction: row; font-size: 1.8vmin; }
    .pre { margin-top: 6vmin; font-size: 2.8vmin; }
    h1 { font-size: 15vmin; }
    .d { font-size: 2.4vmin; max-width: 46vmin; }
    .act { flex-direction: row; align-items: center; margin-top: 4vmin; }
    .sun { bottom: 8.5vmin; right: 6vmin; width: 18vmin; height: 18vmin; }
    .sun b { font-size: 6.4vmin; }
  }

  /* ───────── motion (6s loop) ─────────
     constant: the wavy sun sticker turns lazily back and forth (−10° ↔ +2°) like it's shimmering in the heat
     beat 2.2–4.4s: the photo sags (scaleY → 1.03 from the top, so the drips stretch) and four hot drops swell at the
     drip tips and fall into the panel, one after another · 3.2s the MELTDOWN headline droops and recovers ·
     5.0s the sun sticker throbs */
  .ph img { transform-origin: 50% 0; animation: sag 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sag { 0%, 30%, 88%, 100% { transform: scale(1, 1); } 58% { transform: scale(1.012, 1.03); } }

  .drop { position: absolute; width: 2.2vmin; height: 2.9vmin; margin-left: -1.1vmin; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: linear-gradient(180deg, #F9D05A 0%, #F08A2C 55%, #E0506A 100%); box-shadow: 0 0 .8vmin rgba(240,138,44,.45);
    transform-origin: 50% 0; opacity: 0; animation: drip 6s cubic-bezier(.5,0,.75,.2) infinite; pointer-events: none; }
  .drop.d1 { left: 63%; top: calc(99.6% - 1.6vmin); }
  .drop.d2 { left: 86%; top: calc(98.2% - 1.6vmin); animation-delay: -.8s; }
  .drop.d3 { left: 17%; top: calc(99.2% - 1.6vmin); animation-delay: -1.6s; }
  .drop.d4 { left: 41%; top: calc(97.2% - 1.6vmin); animation-delay: -5.2s; }
  @keyframes drip {
    0%, 40% { opacity: 0; transform: translateY(0) scale(.2); }
    47% { opacity: 1; transform: translateY(0) scale(.7, .8); }
    56% { opacity: 1; transform: translateY(.3vmin) scale(1, 1); }
    60% { opacity: 1; transform: translateY(.9vmin) scale(.85, 1.2); }
    70% { opacity: 1; transform: translateY(4vmin) scale(.8, 1.1); }
    75%, 100% { opacity: 0; transform: translateY(5.2vmin) scale(.7, 1); }
  }

  h1 { transform-origin: 50% 0; animation: droop 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes droop { 0%, 46%, 68%, 100% { transform: none; } 55% { transform: scale(1, 1.06) skewX(-2deg); } }

  .sun svg { animation: sway 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(2deg); } }
  .sun { animation: throb 6s cubic-bezier(.3,1.5,.5,1) infinite; }
  @keyframes throb { 0%, 80%, 92%, 100% { transform: scale(1); } 85% { transform: scale(1.1); } }
</style>
</head>
