<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Repair Ticket — the cobbler-and-tailor claim check: a mint two-part ticket with a perforated keep-this-half stub,
     a red serial number printed on both halves, a brass eyelet, the repair boxes ticked in pencil and the charge
     written as nothing, for life. The offer is the service: free repairs on the work edit.
     tall / 3:4 → photo above a tobacco-leather bench; square → ticket turns upright; wide → ticket beside the photo */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #4E3222; }
  .banner { --P: 88vmin; --k: .9vmin; position: fixed; inset: 0; overflow: hidden; color: #F5E9D6; font-family: "Karla", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(110% 70% at 70% 90%, #6A4530 0%, #4E3222 60%, #3E2719 100%); }
  .banner::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(94deg, rgba(0,0,0,.05) 0 .3vmin, rgba(0,0,0,0) .3vmin 1.6vmin); }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--P)); object-fit: cover; object-position: 50% 22%; display: block; }
  /* saddle-stitch along the seam */
  .seam { position: absolute; left: 0; right: 0; top: calc(100% - var(--P)); height: 3.2vmin; z-index: 2; background: #3A2417; }
  .seam::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: .45vmin dashed #E9C98F; }

  .bench { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--P) - 3.2vmin); box-sizing: border-box; padding: 5vmin 5.5vmin 4.6vmin; display: flex; flex-direction: column; z-index: 1; }
  .kick { display: flex; justify-content: space-between; font-size: 1.8vmin; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #D8B98A; white-space: nowrap; }
  h1 { margin: 2.2vmin 0 0; font-family: "Alfa Slab One", Rockwell, Georgia, serif; font-weight: 400; font-size: 10.4vmin; line-height: .95; letter-spacing: -.005em; }
  h1 em { font-style: normal; color: #E9C98F; }
  .lede { margin: 2vmin 0 0; font-size: 2.6vmin; line-height: 1.4; color: #E6D6BE; max-width: 70vmin; }
  .lede b { color: #F5E9D6; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

  /* the ticket */
  .tkt { position: relative; display: flex; width: calc(var(--k) * 86); height: calc(var(--k) * 36); transform: rotate(-2.2deg); color: #23302A; filter: drop-shadow(0 calc(var(--k) * 1.2) calc(var(--k) * 1.4) rgba(0,0,0,.45)); }
  .stub, .main { position: relative; background: linear-gradient(160deg, #D9E8CC 0%, #CBDDBC 100%); box-sizing: border-box; }
  .stub { flex: none; width: 27%; padding: calc(var(--k) * 3) calc(var(--k) * 2.4); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
    border-right: calc(var(--k) * .45) dotted rgba(35,48,42,.55); margin-right: calc(var(--k) * .6); transform: rotate(1.4deg) translateX(calc(var(--k) * -.6)); }
  .main { flex: 1; padding: calc(var(--k) * 3) calc(var(--k) * 3.4) calc(var(--k) * 2.6); display: flex; flex-direction: column; }
  .eye { position: absolute; right: calc(var(--k) * 2.4); top: calc(var(--k) * 2.4); width: calc(var(--k) * 3.4); height: calc(var(--k) * 3.4); border-radius: 50%;
    background: radial-gradient(circle, #4E3222 0 38%, #F6D98E 42%, #B7852E 70%, #6E4B15 100%); box-shadow: 0 calc(var(--k) * .2) calc(var(--k) * .4) rgba(0,0,0,.4); }
  .stub .num, .main .num { font-family: "Alfa Slab One", Rockwell, Georgia, serif; color: #C4302B; line-height: 1; }
  .stub .num { margin-top: calc(var(--k) * 5); font-size: calc(var(--k) * 5.2); }
  .stub small { display: block; font-size: max(1.6vmin, calc(var(--k) * 1.7)); font-weight: 800; letter-spacing: .16em; text-transform: uppercase; line-height: 1.3; }
  .row1 { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: calc(var(--k) * .35) solid #23302A; padding-bottom: calc(var(--k) * 1.2); }
  .row1 h2 { margin: 0; font-family: "Alfa Slab One", Rockwell, Georgia, serif; font-weight: 400; font-size: calc(var(--k) * 3.6); line-height: 1; letter-spacing: .01em; }
  .row1 h2 span { display: block; margin-top: calc(var(--k) * .8); font-family: "Karla", Arial, sans-serif; font-weight: 800; font-size: max(1.6vmin, calc(var(--k) * 1.7)); letter-spacing: .2em; text-transform: uppercase; }
  .main .num { font-size: calc(var(--k) * 4.2); }
  .boxes { margin-top: calc(var(--k) * 2); display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--k) * 1.3) calc(var(--k) * 1.6); }
  .bx { display: flex; align-items: center; gap: calc(var(--k) * 1); font-size: max(1.7vmin, calc(var(--k) * 2.1)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .bx i { position: relative; flex: none; width: calc(var(--k) * 2.4); height: calc(var(--k) * 2.4); border: calc(var(--k) * .3) solid #23302A; box-sizing: border-box; }
  .bx.on i::after { content: ""; position: absolute; left: 18%; top: -38%; width: 36%; height: 90%; border-right: calc(var(--k) * .5) solid #3A3F48; border-bottom: calc(var(--k) * .5) solid #3A3F48; transform: rotate(40deg); opacity: .9; }
  .chg { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(35,48,42,.5); padding-top: calc(var(--k) * 1.2); }
  .chg span { font-size: max(1.6vmin, calc(var(--k) * 1.7)); font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .chg b { font-family: "Alfa Slab One", Rockwell, Georgia, serif; font-weight: 400; font-size: calc(var(--k) * 3.4); color: #C4302B; line-height: 1; letter-spacing: .01em; }

  .foot { display: flex; justify-content: space-between; align-items: center; white-space: nowrap; }
  .cta { background: #E9C98F; color: #2E1D12; font-weight: 800; font-size: 2.5vmin; letter-spacing: .12em; text-transform: uppercase; padding: 1.5vmin 2.6vmin; }
  .note { font-size: 1.8vmin; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #D8B98A; }

  /* 3:4 / 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .banner { --P: 74vmin; --k: .8vmin; }
    .bench { padding: 4vmin 5.5vmin 3.8vmin; }
    h1 { margin-top: 1.6vmin; font-size: 9.6vmin; }
    .lede { font-size: 2.2vmin; margin-top: 1.4vmin; }
    .cta { font-size: 2.2vmin; padding: 1.2vmin 2.2vmin; }
  }
  /* square → photo left, the ticket stands upright (stub on top) */
  @media (min-aspect-ratio: 9/10) {
    .banner { --k: .9vmin; }
    .photo { width: 46%; height: 100%; object-position: 50% 24%; }
    .seam { top: 0; bottom: 0; left: 46%; right: auto; width: 3.2vmin; height: auto; }
    .seam::after { left: 50%; right: auto; top: 0; bottom: 0; border-top: 0; border-left: .45vmin dashed #E9C98F; }
    .bench { left: calc(46% + 3.2vmin); top: 0; height: auto; padding: 4.8vmin 4.6vmin 4.4vmin; }
    .kick span:last-child { display: none; }
    h1 { font-size: 7.6vmin; }
    .lede { font-size: 1.9vmin; }
    .tkt { flex-direction: column; width: calc(var(--k) * 40); height: calc(var(--k) * 48); transform: rotate(2deg); }
    .stub { width: auto; height: 24%; flex-direction: row; align-items: flex-end; border-right: 0; margin: 0 0 calc(var(--k) * .6); border-bottom: calc(var(--k) * .45) dotted rgba(35,48,42,.55); transform: rotate(-1.6deg) translateY(calc(var(--k) * -.6)); padding: calc(var(--k) * 2) calc(var(--k) * 2.6); }
    .stub .num { margin: 0; font-size: calc(var(--k) * 4.4); }
    .eye { top: 50%; margin-top: calc(var(--k) * -1.7); }
    .stub { justify-content: flex-start; gap: calc(var(--k) * 2); }
    .stub small:last-child, .main .num { display: none; }
    .main { padding: calc(var(--k) * 2.6) calc(var(--k) * 2.8) calc(var(--k) * 2.4); }
    .boxes { grid-template-columns: repeat(2, 1fr); }
    .cta { font-size: 2vmin; padding: 1.2vmin 2vmin; }
    .note { display: none; }
  }
  /* wide → ticket horizontal again */
  @media (min-aspect-ratio: 6/5) {
    .banner { --k: .8vmin; }
    .photo { width: 44%; object-position: 50% 30%; }
    .seam { left: 44%; }
    .bench { left: calc(44% + 3.2vmin); padding: 5.4vmin 6vmin 5vmin; }
    .kick span:last-child { display: inline; }
    h1 { font-size: 9vmin; }
    .lede { font-size: 2.1vmin; }
    .tkt { flex-direction: row; width: calc(var(--k) * 86); height: calc(var(--k) * 38); transform: rotate(-2deg); }
    .stub { width: 27%; height: auto; flex-direction: column; align-items: flex-start; border-bottom: 0; border-right: calc(var(--k) * .45) dotted rgba(35,48,42,.55); margin: 0 calc(var(--k) * .6) 0 0; transform: rotate(1.4deg) translateX(calc(var(--k) * -.6)); padding: calc(var(--k) * 3) calc(var(--k) * 2.4); }
    .stub .num { margin-top: calc(var(--k) * 5); font-size: calc(var(--k) * 5.2); }
    .stub small:last-child { display: block; }
    .main .num { display: inline; }
    .eye { top: calc(var(--k) * 2.4); margin-top: 0; }
    .stub { justify-content: space-between; gap: 0; }
    .boxes { grid-template-columns: repeat(3, 1fr); }
    .note { display: inline; }
  }

  /* ───────── motion (6s loop · t=0 = static design) ─────────
     0.7s the keep-this-half stub tugs away along the perforation and settles back ·
     2.7s the pencil ticks vanish and are re-ticked one by one · 4.6s "Free, for life" is stamped · 5.2s light glides over the CTA */
  .stub { animation: tearT 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes tearT {
    0%, 11% { transform: rotate(1.4deg) translateX(calc(var(--k) * -.6)); }
    21%, 27% { transform: rotate(-1deg) translate(calc(var(--k) * -2.8), calc(var(--k) * .5)); }
    38%, 100% { transform: rotate(1.4deg) translateX(calc(var(--k) * -.6)); }
  }
  @keyframes tearS {
    0%, 11% { transform: rotate(-1.6deg) translateY(calc(var(--k) * -.6)); }
    21%, 27% { transform: rotate(-3.6deg) translate(calc(var(--k) * -.4), calc(var(--k) * -2.8)); }
    38%, 100% { transform: rotate(-1.6deg) translateY(calc(var(--k) * -.6)); }
  }
  @media (min-aspect-ratio: 9/10) { .stub { animation-name: tearS; } }
  @media (min-aspect-ratio: 6/5) { .stub { animation-name: tearT; } }

  .bx.on i::after { animation: tick0 6s cubic-bezier(.5,0,.35,1) infinite; }
  .bx.on:nth-child(3) i::after { animation-name: tick1; }
  .bx.on:nth-child(4) i::after { animation-name: tick2; }
  .bx.on:nth-child(6) i::after { animation-name: tick3; }
  @keyframes tick0 {
    0%, 42% { opacity: .9; clip-path: inset(0 0 0 0); }
    45% { opacity: 0; clip-path: inset(0 0 0 0); }
    45.5%, 50% { opacity: .9; clip-path: inset(76% 100% 0 0); }
    52.2% { clip-path: inset(76% 0 0 0); }
    54.4%, 100% { opacity: .9; clip-path: inset(0 0 0 0); }
  }
  @keyframes tick1 {
    0%, 42% { opacity: .9; clip-path: inset(0 0 0 0); }
    45% { opacity: 0; clip-path: inset(0 0 0 0); }
    45.5%, 56% { opacity: .9; clip-path: inset(76% 100% 0 0); }
    58.2% { clip-path: inset(76% 0 0 0); }
    60.4%, 100% { opacity: .9; clip-path: inset(0 0 0 0); }
  }
  @keyframes tick2 {
    0%, 42% { opacity: .9; clip-path: inset(0 0 0 0); }
    45% { opacity: 0; clip-path: inset(0 0 0 0); }
    45.5%, 62% { opacity: .9; clip-path: inset(76% 100% 0 0); }
    64.2% { clip-path: inset(76% 0 0 0); }
    66.4%, 100% { opacity: .9; clip-path: inset(0 0 0 0); }
  }
  @keyframes tick3 {
    0%, 42% { opacity: .9; clip-path: inset(0 0 0 0); }
    45% { opacity: 0; clip-path: inset(0 0 0 0); }
    45.5%, 68% { opacity: .9; clip-path: inset(76% 100% 0 0); }
    70.2% { clip-path: inset(76% 0 0 0); }
    72.4%, 100% { opacity: .9; clip-path: inset(0 0 0 0); }
  }

  .chg b { transform-origin: 100% 60%; animation: stamp 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes stamp {
    0%, 75% { transform: scale(1) rotate(0deg); }
    78.5% { transform: scale(1.16) rotate(-3deg); }
    81.5% { transform: scale(.96) rotate(.6deg); }
    84.5%, 100% { transform: scale(1) rotate(0deg); }
  }

  .cta { background: linear-gradient(100deg, rgba(0,0,0,0) 40%, #FFF3D6 50%, rgba(0,0,0,0) 60%) 100% 0 / 300% 100% no-repeat, #E9C98F; animation: glide 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes glide { 0%, 84% { background-position: 100% 0, 0 0; } 98%, 100% { background-position: 0 0, 0 0; } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="seam"></div>
  <div class="bench">
    <div class="kick"><span>Atelier Nord · Repair Desk</span><span>Since 1926</span></div>
    <h1>Mended,<br><em>not ended.</em></h1>
    <p class="lede"><b>Free repairs for life</b> on everything in the new work edit.</p>
    <div class="stage">
      <div class="tkt">
        <div class="stub"><span class="eye"></span><small>Keep<br>this half</small><span class="num">4431</span><small>Claim Nº</small></div>
        <div class="main">
          <div class="row1"><h2>Repairs<span>&amp; alterations</span></h2><span class="num">Nº 4431</span></div>
          <div class="boxes">
            <span class="bx on"><i></i>Seam</span><span class="bx"><i></i>Heel</span><span class="bx on"><i></i>Button</span>
            <span class="bx on"><i></i>Patch</span><span class="bx"><i></i>Zip</span><span class="bx on"><i></i>Strap</span>
          </div>
          <div class="chg"><span>Charge</span><b>Free, for life</b></div>
        </div>
      </div>
    </div>
    <div class="foot"><span class="cta">Shop the work edit</span><span class="note">Bring it back, always</span></div>
  </div>
</div>
</body>
</html>
