<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Carousel Cover — slide 1 of a swipe post: a giant Bodoni "5", the next slide peeking in from the edge, page dots and a swipe arrow.
     tall → headline on top, slides below; square / wide → headline left, slides right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EDE7DA; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #EDE7DA; color: #1A1A1A; font-family: "Outfit", "Helvetica Neue", Arial, sans-serif; }
  .blue { color: #2437C4; }

  .top { position: absolute; left: 6vmin; right: 6vmin; top: 5vmin; display: flex; justify-content: space-between; align-items: center; font-size: 1.9vmin; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
  .count { border: 1px solid #1A1A1A; border-radius: 99vmin; padding: .9vmin 2vmin; letter-spacing: .08em; }

  .hero { position: absolute; left: 5vmin; right: 6vmin; top: 10.5vmin; display: flex; align-items: flex-end; gap: 3.4vmin; }
  .num { flex: none; font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 500; font-size: 44vmin; line-height: .74; letter-spacing: -.04em; color: #2437C4; font-variation-settings: "opsz" 20; }
  .words { padding-bottom: 1.4vmin; }
  h1 { margin: 0; font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 400; font-size: 8.8vmin; line-height: .92; letter-spacing: -.02em; font-variation-settings: "opsz" 96; }
  h1 i { color: #2437C4; }
  .deck { margin-top: 2.2vmin; font-size: 2.3vmin; line-height: 1.35; color: #4A463F; max-width: 34vmin; }

  .slide { position: absolute; top: 37%; bottom: 13vmin; overflow: hidden; }
  .s1 { left: 6vmin; width: calc(100% - 20vmin); }
  .s2 { left: calc(100% - 11.5vmin); width: 60vmin; }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .s2 img { object-position: 50% 45%; transform: scale(1.7); transform-origin: 30% 45%; }
  .lk { position: absolute; left: 0; bottom: 0; background: #EDE7DA; padding: 1vmin 1.8vmin .8vmin 0; font-size: 1.8vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }

  .bottom { position: absolute; left: 6vmin; right: 6vmin; bottom: 4.6vmin; height: 4vmin; display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 1.2vmin; align-items: center; }
  .dots i { width: 1.3vmin; height: 1.3vmin; border-radius: 99vmin; background: rgba(26,26,26,.25); }
  .dots i:first-child { width: 4.4vmin; background: #2437C4; }
  .swipe { display: flex; align-items: center; gap: 1.8vmin; font-size: 2.2vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2437C4; }
  .swipe svg { width: 12vmin; height: 3vmin; }

  @media (min-aspect-ratio: 7/10) {
    .top { top: 4.2vmin; }
    .hero { top: 9vmin; }
    .num { font-size: 34vmin; }
    h1 { font-size: 7.2vmin; }
    .deck { font-size: 2.1vmin; margin-top: 1.6vmin; }
    .slide { top: 38%; bottom: 11.5vmin; }
    .bottom { bottom: 3.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .top { right: auto; width: calc(44% - 12vmin); top: 6vmin; }
    .hero { top: 14vmin; left: 5vmin; right: auto; width: calc(44% - 11vmin); display: block; }
    .num { font-size: 36vmin; }
    .words { padding: 0; margin-top: 2.6vmin; }
    h1 { font-size: 7.4vmin; }
    .deck { font-size: 2.1vmin; }
    .slide { top: 6vmin; bottom: 6vmin; }
    .s1 { left: 44%; width: calc(56% - 16vmin); }
    .s2 { left: calc(100% - 9.5vmin); }
    .bottom { right: auto; width: calc(44% - 12vmin); bottom: 6vmin; }
    .swipe svg { width: 8vmin; }
    .bottom { height: auto; flex-direction: column; align-items: flex-start; gap: 2.6vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .top, .bottom { left: 7vmin; width: calc(42% - 14vmin); top: auto; }
    .top { top: 7vmin; }
    .bottom { bottom: 7vmin; }
    .hero { left: 6vmin; top: 15vmin; width: calc(42% - 12vmin); display: flex; align-items: flex-end; gap: 3vmin; }
    .num { font-size: 42vmin; }
    .words { margin: 0; padding-bottom: 1.6vmin; }
    h1 { font-size: 7.6vmin; }
    .deck { font-size: 2.2vmin; max-width: 30vmin; }
    .slide { top: 7vmin; bottom: 7vmin; }
    .s1 { left: 42%; width: calc(58% - 18vmin); }
    .s2 { left: calc(100% - 11vmin); }
    .swipe svg { width: 10vmin; }
    .bottom { height: 4vmin; flex-direction: row; align-items: center; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ───────── */
  /* a swipe post teasing itself: the slides nudge left like a swipe hint and spring back, the page pill stretches,
     "wear it" re-reveals, the swipe arrow keeps pointing */
  .s1 img { animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  /* the swipe hint: both slides travel left together, then spring back */
  .slide { animation: hint 6s linear infinite; }
  @keyframes hint {
    0%, 14% { transform: translateX(0); animation-timing-function: cubic-bezier(.6,0,.3,1); }
    24% { transform: translateX(-4vmin); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    28% { transform: translateX(-4vmin); animation-timing-function: cubic-bezier(.25,.9,.3,1.25); }
    40%, 100% { transform: translateX(0); }
  }
  /* page dots: the active pill stretches toward page 2 with the hint */
  .dots i:first-child { transform-origin: 0 50%; animation: pill 6s linear infinite; }
  @keyframes pill {
    0%, 14% { transform: scaleX(1); animation-timing-function: cubic-bezier(.6,0,.3,1); }
    24%, 28% { transform: scaleX(1.5); animation-timing-function: cubic-bezier(.25,.9,.3,1.2); }
    40%, 100% { transform: scaleX(1); }
  }
  .dots i:nth-child(2) { animation: nextdot 6s linear infinite; }
  @keyframes nextdot {
    0%, 16% { background-color: rgba(26,26,26,.25); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    24%, 28% { background-color: rgba(36,55,196,.7); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    40%, 100% { background-color: rgba(26,26,26,.25); }
  }
  /* the swipe arrow keeps gesturing, twice per loop */
  .swipe svg { animation: arrow 3s linear infinite; }
  @keyframes arrow {
    0%, 50% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    60% { transform: translateX(1.2vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    70% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    80% { transform: translateX(1.2vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    90%, 100% { transform: translateX(0); }
  }
  /* "wear it" wipes off and back on, the big 5 answers with a small tilt */
  h1 i { display: inline-block; animation: wear 6s linear infinite; }
  @keyframes wear {
    0%, 56% { clip-path: inset(-10% -10% -25% 0); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    63% { clip-path: inset(-10% -10% -25% 100%); animation-timing-function: steps(1, end); }
    64% { clip-path: inset(-10% 100% -25% 0); animation-timing-function: cubic-bezier(.6,0,.2,1); }
    74%, 100% { clip-path: inset(-10% -10% -25% 0); }
  }
  .num { transform-origin: 50% 90%; animation: five 6s linear infinite; }
  @keyframes five {
    0%, 62% { transform: rotate(0) translateY(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    68% { transform: rotate(-4deg) translateY(-1vmin); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    76% { transform: rotate(1deg) translateY(0); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    82%, 100% { transform: rotate(0) translateY(0); }
  }
  /* "Look 01" tab slides back in after the hint */
  .lk { animation: lk 6s linear infinite; }
  @keyframes lk {
    0%, 16% { clip-path: inset(0 0 0 0); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    22% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(1, end); }
    34% { clip-path: inset(0 100% 0 0); animation-timing-function: cubic-bezier(.6,0,.2,1); }
    44%, 100% { clip-path: inset(0 0 0 0); }
  }

</style>
</head>
<body>
<div class="banner">
  <div class="top"><span>Style notes · Nº 12</span><span class="count">1 / 5</span></div>
  <div class="hero">
    <div class="num">5</div>
    <div class="words">
      <h1>ways to<br><i>wear it</i></h1>
      <div class="deck">One piece, five looks. Swipe through all of them.</div>
    </div>
  </div>
  <div class="slide s1"><img src="{{PRODUCT_IMAGE}}" alt=""><div class="lk">Look 01</div></div>
  <div class="slide s2"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="bottom">
    <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="swipe">Swipe <svg viewBox="0 0 120 30" preserveAspectRatio="none"><path d="M0 15 H116 M104 4 L117 15 L104 26" fill="none" stroke="#2437C4" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg></div>
  </div>
</div>
</body>
</html>
