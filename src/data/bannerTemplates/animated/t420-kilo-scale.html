<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Kilo Scale — vintage sold by weight: the read-out of a market scale, green LCD with ghost segments
     behind every digit (weight · price per kilo · total), mounted in a charcoal housing with screws.
     tall / 3:4 → photo on the pan above, scale below; square / wide → photo left, scale right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #DAD6CC; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #DAD6CC; color: #1E1E1C; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 94vmin); object-fit: cover; object-position: 50% 20%; display: block; }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 94vmin; box-sizing: border-box; padding: 5vmin 6vmin 0; display: flex; flex-direction: column; }
  .kick { display: flex; justify-content: space-between; font-weight: 700; font-size: 2.2vmin; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; color: #5B5850; }
  .kick b { color: #D2462A; }
  h1 { margin: 1.4vmin 0 0; font-weight: 800; font-size: 14vmin; line-height: .82; letter-spacing: -.01em; text-transform: uppercase; }
  h1 span { color: #D2462A; }

  /* scale housing */
  .scale { position: relative; flex: 1; min-height: 0; margin: 4vmin 0 0; background: #2A2B2A; padding: 3vmin; box-sizing: border-box; display: flex; flex-direction: column;
           box-shadow: inset 0 .4vmin 0 rgba(255,255,255,.08), 0 1vmin 2vmin rgba(0,0,0,.2); }
  .scale::before, .scale::after { content: ""; position: absolute; top: 1.2vmin; width: 1.2vmin; height: 1.2vmin; border-radius: 50%;
           background: radial-gradient(circle at 35% 35%, #9A9C9A, #4A4B4A); }
  .scale::before { left: 1.2vmin; } .scale::after { right: 1.2vmin; }
  .brand { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.8vmin; letter-spacing: .2em; text-transform: uppercase; color: #A9AAA5; white-space: nowrap; padding: 0 1vmin 1.8vmin; }
  .lcd { flex: 1; min-height: 0; background: linear-gradient(180deg, #A9B895, #98A984); box-shadow: inset 0 .6vmin 1.2vmin rgba(0,0,0,.35); padding: 1.4vmin 3vmin;
         display: flex; flex-direction: column; justify-content: space-evenly; color: #1D2618; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 2vmin; }
  .row + .row { border-top: 1px solid rgba(29,38,24,.25); }
  .row i { font-style: normal; font-weight: 700; font-size: 2vmin; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .num { position: relative; font-family: "Share Tech Mono", "Courier New", monospace; font-size: 8vmin; line-height: 1.05; white-space: nowrap; }
  .num::before { content: attr(data-g); position: absolute; right: 0; top: 0; color: rgba(29,38,24,.1); }
  .row.total .num { font-size: 12vmin; }

  .foot { flex: none; height: 12vmin; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; }
  .foot span { font-weight: 700; font-size: 2.2vmin; letter-spacing: .12em; text-transform: uppercase; color: #5B5850; }
  .foot .cta { font-weight: 800; font-size: 3.4vmin; letter-spacing: .02em; color: #1E1E1C; background: #F2C230; padding: 1vmin 2.6vmin; }

  /* 3:4 / 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 78vmin); }
    .panel { height: 78vmin; padding-top: 4.2vmin; }
    h1 { font-size: 11.4vmin; }
    .scale { margin-top: 3vmin; padding: 2.4vmin; }
    .brand { padding-bottom: 1.2vmin; }
    .num { font-size: 6.4vmin; }
    .row.total .num { font-size: 9.4vmin; }
    .foot { height: 10vmin; }
  }
  /* square → photo left */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; height: 100%; object-position: 50% 25%; }
    .panel { left: 46%; top: 0; height: auto; padding: 5vmin 4.6vmin 0; }
    .kick span + span { display: none; }
    h1 { font-size: 10.6vmin; }
    .scale { padding: 2.2vmin; }
    .brand span + span { display: none; }
    .lcd { padding: 1vmin 2.2vmin; }
    .row i { font-size: 1.7vmin; }
    .num { font-size: 5.4vmin; }
    .row.total .num { font-size: 8.4vmin; }
    .foot { height: 10vmin; }
    .foot span { font-size: 1.8vmin; }
    .foot .cta { font-size: 2.8vmin; }
  }
  /* wide */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 45%; object-position: 50% 30%; }
    .panel { left: 45%; padding: 5vmin 5.6vmin 0; }
    .kick span + span { display: inline; }
    h1 { font-size: 11vmin; }
    .brand span + span { display: inline; }
    .lcd { padding: 1vmin 3vmin; }
    .num { font-size: 7vmin; }
    .row.total .num { font-size: 11vmin; }
    .foot span { font-size: 2vmin; }
  }

  /* ───────── motion (6s loop) ─────────
     beat: 1.4s the scale tares — every reading drops out, leaving only the ghost 8-segments · 1.9s the piece lands on the pan (photo dips a hair)
           and the weight hunts (flickers) before it locks · 2.9s price per kilo comes up · 3.3s the total appears and double-blinks with a
           backlight pulse like a till beep · 4.6s the yellow CTA gets a press */
  .num { animation: lcdW 6s linear infinite; }
  .row:nth-child(2) .num { animation-name: lcdP; }
  .row.total .num { animation-name: lcdT; }
  @keyframes lcdW {
    0%, 22% { color: #1D2618; } 23%, 31% { color: transparent; }
    32%, 33.5% { color: rgba(29,38,24,.8); } 34%, 35% { color: transparent; } 35.5%, 37.5% { color: #1D2618; } 38%, 39% { color: transparent; }
    39.5%, 100% { color: #1D2618; }
  }
  @keyframes lcdP { 0%, 22% { color: #1D2618; } 23%, 47.9% { color: transparent; } 48%, 100% { color: #1D2618; } }
  @keyframes lcdT {
    0%, 22% { color: #1D2618; } 23%, 54.9% { color: transparent; }
    55%, 58% { color: #1D2618; } 58.1%, 60% { color: transparent; } 60.1%, 63% { color: #1D2618; } 63.1%, 65% { color: transparent; }
    65.1%, 100% { color: #1D2618; }
  }
  .lcd { animation: backlight 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes backlight { 0%, 53%, 72%, 100% { filter: none; } 58% { filter: brightness(1.12) saturate(1.15); } }
  .photo { transform-origin: 50% 0; animation: pan 6s cubic-bezier(.3,.7,.3,1) infinite; }
  @keyframes pan { 0%, 30% { transform: none; } 33% { transform: scale(1.018); } 37% { transform: scale(1.003); } 41%, 100% { transform: none; } }
  .foot .cta { display: inline-block; animation: press 6s cubic-bezier(.3,.7,.3,1) infinite; }
  @keyframes press { 0%, 75% { transform: none; } 78% { transform: scale(.93); } 82% { transform: scale(1.05); } 86%, 100% { transform: none; } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="panel">
    <div class="kick"><span><b>Weigh-in weekend</b> · Rerun Vintage</span><span>Sat – Sun</span></div>
    <h1>Vintage<br><span>by the kilo.</span></h1>
    <div class="scale">
      <div class="brand"><span>Rerun · Market scale</span><span>Max 15 kg</span></div>
      <div class="lcd">
        <div class="row"><i>Weight kg</i><span class="num" data-g="88.888">1.240</span></div>
        <div class="row"><i>Price / kg</i><span class="num" data-g="888.88">€25.00</span></div>
        <div class="row total"><i>Total</i><span class="num" data-g="888.88">€31.00</span></div>
      </div>
    </div>
    <div class="foot"><span>Mix any pieces · 11–12 Oct</span><span class="cta">Fill a bag →</span></div>
  </div>
</div>
</body>
</html>
