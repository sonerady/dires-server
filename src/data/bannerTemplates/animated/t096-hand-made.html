<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  /* Made by Hand — linen ground, a red running stitch sewn along the seam with needle + thread tail,
     a woven "Made in" label, batch numbering and the maker's signature. tall → photo above; 7/10+ → photo left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EDE5D7; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #2A2420; font-family: "EB Garamond", Garamond, "Times New Roman", serif;
    background:
      repeating-linear-gradient(0deg, rgba(120,100,70,.07) 0 1px, transparent 1px .55vmin),
      repeating-linear-gradient(90deg, rgba(120,100,70,.06) 0 1px, transparent 1px .7vmin),
      #EDE5D7; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 66vmin); object-fit: cover; object-position: 50% 22%; }

  /* running stitch + needle */
  .seam { position: absolute; left: 0; right: 0; top: calc(100% - 66vmin + 3.6vmin); height: 3vmin; }
  .seam .run { position: absolute; left: 0; right: 13vmin; top: 50%; height: 0; border-top: .45vmin dashed #A02E26; transform: translateY(-50%); }
  .seam svg { position: absolute; right: 2vmin; top: 50%; width: 13vmin; height: 5vmin; transform: translateY(-50%); overflow: visible; }

  .panel { position: absolute; left: 7vmin; right: 7vmin; bottom: 6vmin; height: 53vmin; }
  .k { font-size: 2vmin; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: #7B6B58; font-variant-numeric: oldstyle-nums; }
  h1 { width: fit-content; margin: 2vmin 0 0; font-weight: 400; font-size: 14vmin; line-height: .86; letter-spacing: -.02em; }
  h1 i { color: #A02E26; }
  .lede { margin-top: 2.6vmin; width: 48vmin; font-size: 2.9vmin; line-height: 1.3; color: #4A3F35; }
  .batch { position: absolute; left: 0; bottom: 0; display: flex; gap: 2.4vmin; align-items: baseline; font-size: 2.2vmin; letter-spacing: .12em; text-transform: uppercase; color: #4A3F35; white-space: nowrap; }
  .batch b { font-weight: 600; color: #2A2420; }
  .batch i { font-style: normal; color: #A02E26; }

  /* woven label */
  .label { position: absolute; right: 0; top: 1vmin; width: 30vmin; padding: 2.2vmin 1.4vmin; box-sizing: border-box; text-align: center; color: #A02E26;
    background: repeating-linear-gradient(0deg, rgba(160,46,38,.06) 0 1px, transparent 1px .4vmin), #FBF8F1;
    box-shadow: inset 0 0 0 .5vmin #FBF8F1, inset 0 0 0 .8vmin #A02E26, inset 0 0 0 1.1vmin #FBF8F1, inset 0 0 0 1.25vmin #A02E26, 0 .5vmin 1.2vmin rgba(60,40,20,.18); }
  .label::before, .label::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1.2vmin; background: repeating-linear-gradient(180deg, #A02E26 0 .9vmin, transparent .9vmin 1.6vmin); opacity: .8; }
  .label::before { left: -1.9vmin; } .label::after { right: -1.9vmin; }
  .label small { display: block; font-size: 1.7vmin; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; }
  .label b { display: block; margin: .5vmin 0; font-size: 4.6vmin; font-weight: 500; font-style: italic; line-height: 1; }

  .sig { position: absolute; right: 0; bottom: 5vmin; text-align: right; }
  .sig .s { font-family: "Mrs Saint Delafield", "Snell Roundhand", cursive; font-size: 10vmin; line-height: .8; color: #2A2420; transform: rotate(-5deg); transform-origin: right bottom; }
  .sig .c { margin-top: 1.2vmin; font-size: 1.8vmin; letter-spacing: .2em; text-transform: uppercase; color: #7B6B58; }
  .cta { position: absolute; right: 0; bottom: 0; font-size: 2.4vmin; font-weight: 500; font-style: italic; border-bottom: 1px solid #2A2420; padding-bottom: .4vmin; white-space: nowrap; }

  /* ── 7/10+ : photo left, stitch runs down the seam, needle at the foot ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 54%; height: 100%; object-position: 50% 25%; }
    .seam { left: calc(54% + 3.6vmin); right: auto; top: 0; bottom: 0; width: 3vmin; height: auto; }
    .seam .run { left: 50%; right: auto; top: 0; bottom: 13vmin; height: auto; width: 0; border-top: 0; border-left: .45vmin dashed #A02E26; transform: translateX(-50%); }
    .seam svg { right: auto; left: 50%; top: auto; bottom: 6vmin; transform: translateX(-50%) rotate(90deg); }
    .panel { left: calc(54% + 10vmin); right: 5vmin; top: 7vmin; bottom: 6vmin; height: auto; }
    h1 { font-size: 10vmin; margin-top: 3vmin; }
    .lede { width: auto; font-size: 2.4vmin; }
    .label { position: relative; right: auto; top: auto; width: 26vmin; margin: 5vmin 0 0 2vmin; }
    .label b { font-size: 3.8vmin; }
    .sig { right: auto; left: 0; bottom: 11vmin; text-align: left; }
    .sig .s { font-size: 8.6vmin; transform-origin: left bottom; }
    .batch { flex-direction: column; gap: .6vmin; bottom: 26vmin; }
    .cta { right: auto; left: 0; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; }
    .seam { left: calc(50% + 3.4vmin); }
    .panel { left: calc(50% + 9.5vmin); top: 6vmin; bottom: 5vmin; }
    .k { font-size: 1.7vmin; letter-spacing: .22em; }
    h1 { font-size: 8.6vmin; margin-top: 2vmin; }
    .lede { font-size: 2.1vmin; margin-top: 2vmin; }
    .label { width: 23vmin; margin-top: 3.6vmin; padding: 1.8vmin 1.2vmin; }
    .label b { font-size: 3.2vmin; }
    .sig { bottom: 7.4vmin; }
    .sig .s { font-size: 7vmin; }
    .sig .c { font-size: 1.6vmin; margin-top: .8vmin; }
    .batch { bottom: 21vmin; font-size: 1.9vmin; }
  }
  /* ── wide: copy left, label + signature right ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; }
    .seam { left: calc(44% + 3.6vmin); }
    .panel { left: calc(44% + 11vmin); right: 6vmin; top: 9vmin; bottom: 8vmin; }
    .k { font-size: 2vmin; letter-spacing: .3em; }
    h1 { font-size: 12vmin; margin-top: 2.6vmin; }
    .lede { width: 42vmin; font-size: 2.5vmin; margin-top: 3vmin; }
    .label { position: absolute; right: 0; top: 0; margin: 0; width: 26vmin; padding: 2.2vmin 1.4vmin; }
    .label b { font-size: 3.8vmin; }
    .sig { left: auto; right: 0; bottom: 0; text-align: right; }
    .sig .s { font-size: 9vmin; transform-origin: right bottom; }
    .batch { flex-direction: row; gap: 2.4vmin; bottom: 14vmin; font-size: 2.2vmin; }
    .cta { bottom: 0; }
  }

  /* ───────── motion: 8s loop, slow & handmade — t=0 = the static design ───────── */
  .photo { transform-origin: 50% 30%; animation: push 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  /* the needle works: it pushes through and draws back, a stitch every 2 s */
  .needle { animation: needle 2s linear infinite; }
  @keyframes needle {
    0%, 20% { transform: translateX(0); animation-timing-function: cubic-bezier(.5,0,.3,1); }
    45%, 55% { transform: translateX(7px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    85%, 100% { transform: translateX(0); }
  }
  /* the thread tail tugs with each pull */
  .seam svg > path { transform-origin: 84px 25px; animation: tug 2s linear infinite; }
  @keyframes tug {
    0%, 20% { transform: scaleY(1); animation-timing-function: cubic-bezier(.5,0,.3,1); }
    45%, 55% { transform: scaleY(.6); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    85%, 100% { transform: scaleY(1); }
  }
  /* woven label: its side tacking runs slowly, one stitch per loop */
  .label::before, .label::after { animation: tack 8s linear infinite; }
  @keyframes tack { from { background-position: 0 0; } to { background-position: 0 1.6vmin; } }
  /* the maker signs again: the signature lifts away, then is written left to right */
  .sig .s { clip-path: inset(-40% -10% -40% -10%); animation: sign 8s linear infinite; }
  @keyframes sign {
    0%, 40% { clip-path: inset(-40% -10% -40% -10%); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.6,1); }
    46% { clip-path: inset(-40% -10% -40% -10%); opacity: 0; animation-timing-function: steps(1, end); }
    47% { clip-path: inset(-40% 110% -40% -10%); opacity: 1; animation-timing-function: cubic-bezier(.35,.1,.45,1); }
    72%, 100% { clip-path: inset(-40% -10% -40% -10%); opacity: 1; }
  }
  /* CTA: the arrow steps forward twice after the signature lands */
  .cta .ar { display: inline-block; animation: nudge 8s linear infinite; }
  @keyframes nudge {
    0%, 76% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    79% { transform: translateX(.9vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    82% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    85% { transform: translateX(.9vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    88%, 100% { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="seam">
    <div class="run"></div>
    <svg viewBox="0 0 130 50" aria-hidden="true"><path d="M2 25 C 20 25, 30 40, 48 32 S 70 14, 84 25" fill="none" stroke="#A02E26" stroke-width="2.6" stroke-linecap="round"/><g class="needle"><g transform="translate(78 25)"><path d="M0 -2.6 L46 -.6 Q50 0 46 .6 L0 2.6 Q-3 0 0 -2.6 Z" fill="#8F8A83"/><path d="M0 -2.6 L46 -.6 Q50 0 46 .6 L0 2.6" fill="none" stroke="#5E5A55" stroke-width=".8"/><ellipse cx="6" cy="0" rx="3.4" ry="1.1" fill="#EDE5D7"/></g></g></svg>
  </div>
  <div class="panel">
    <div class="k">The Atelier · Est. 2011</div>
    <h1>Slow<br><i>made.</i></h1>
    <div class="lede">Every piece cut, sewn and finished by one pair of hands.</div>
    <div class="label"><small>Made by hand</small><b>in Porto</b><small>Nº 07 / 32</small></div>
    <div class="sig"><div class="s">Inês Duarte</div><div class="c">Head of atelier</div></div>
    <div class="batch"><span>Batch <b>07</b></span><span>32 pieces</span><span>From <i>$180</i></span></div>
    <div class="cta">Meet the maker <span class="ar">→</span></div>
  </div>
</div>
</body>
</html>
