<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Lobster+Two:ital,wght@1,700&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Plate Tag — the back of a two-tone cruiser: glossy teal paint, a chrome lamp hood, an embossed mustard license plate
     stamped SAVE-30 with a red registration sticker and a territory slogan, a chrome bumper and a strip of highway below.
     tall → car tail on top, photo, road strip · square → car tail column left, photo right · wide → photo left, car tail right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #2E7F7C; }
  .banner { --paint: #3E9C98; --mus: #E7B634; --ink: #17130F; --cream: #FFF6E2; --body: 70vmin; --road: 17vmin; --pw: 62vmin;
    position: fixed; inset: 0; overflow: hidden; color: var(--cream); font-family: "Saira Condensed", "Arial Narrow", Arial, sans-serif; background: #232427; }

  .photo { position: absolute; left: 0; top: var(--body); width: 100%; height: calc(100% - var(--body) - var(--road)); object-fit: cover; object-position: 50% 22%; display: block; }

  /* the car tail */
  .car { position: absolute; left: 0; top: 0; width: 100%; height: var(--body); box-sizing: border-box; padding: 5vmin 6vmin 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background:
      linear-gradient(180deg, transparent 0 18%, rgba(255,255,255,.22) 19%, transparent 23%),
      radial-gradient(90% 60% at 30% 10%, rgba(255,255,255,.28), transparent 60%),
      linear-gradient(180deg, #62C3BE 0%, #3E9C98 45%, #2C7774 85%, #235E5C 100%); }
  .k { font-size: 2.1vmin; font-weight: 700; letter-spacing: .38em; padding-left: .38em; text-transform: uppercase; white-space: nowrap; color: rgba(255,246,226,.85); }
  h1 { margin: 1vmin 0 0; font-family: "Lobster Two", cursive; font-style: italic; font-weight: 700; font-size: 9vmin; line-height: 1.05; white-space: nowrap;
    color: var(--cream); text-shadow: 0 .4vmin 0 rgba(20,60,58,.45); }

  .mount { position: relative; margin-top: 3.4vmin; display: flex; flex-direction: column; align-items: center; }
  .hood { width: calc(var(--pw) * .5); height: calc(var(--pw) * .06); border-radius: calc(var(--pw) * .03) calc(var(--pw) * .03) 0 0;
    background: linear-gradient(180deg, #FFFFFF 0%, #B9C1C8 45%, #EEF2F4 60%, #7C858E 100%); box-shadow: 0 .5vmin .8vmin rgba(0,0,0,.3); }
  .plate { position: relative; width: var(--pw); aspect-ratio: 2 / 1; box-sizing: border-box; border-radius: calc(var(--pw) * .045); color: var(--ink);
    display: grid; grid-template-rows: auto 1fr auto; align-items: center; justify-items: center; padding: calc(var(--pw) * .045) calc(var(--pw) * .06) calc(var(--pw) * .04);
    background:
      radial-gradient(60% 50% at 25% 20%, rgba(255,255,255,.35), transparent 70%),
      linear-gradient(170deg, #F2C652 0%, #E7B634 50%, #D29F22 100%);
    box-shadow: inset 0 0 0 calc(var(--pw) * .012) #C99620, inset 0 0 0 calc(var(--pw) * .02) #F6D475, inset 0 0 0 calc(var(--pw) * .026) rgba(120,80,10,.45),
      0 calc(var(--pw) * .02) calc(var(--pw) * .03) rgba(0,0,0,.4); }
  .plate .hole { position: absolute; width: calc(var(--pw) * .045); height: calc(var(--pw) * .025); border-radius: 50%; background: radial-gradient(#1A1A1A 45%, #6E5A22 75%); }
  .plate .h1 { left: 20%; top: 7%; } .plate .h2 { right: 20%; top: 7%; } .plate .h3 { left: 20%; bottom: 7%; } .plate .h4 { right: 20%; bottom: 7%; }
  .plate .st { font-family: "Antonio", sans-serif; font-weight: 700; font-size: calc(var(--pw) * .054); letter-spacing: .12em; padding-left: .12em; line-height: 1; white-space: nowrap;
    text-shadow: -1px -1px 0 rgba(255,245,200,.7), .15vmin .2vmin .15vmin rgba(60,40,0,.5); }
  .plate .num { font-family: "Antonio", sans-serif; font-weight: 700; font-size: calc(var(--pw) * .245); line-height: 1; letter-spacing: .02em; white-space: nowrap;
    text-shadow: calc(var(--pw) * -.004) calc(var(--pw) * -.004) 0 rgba(255,245,200,.8), calc(var(--pw) * .006) calc(var(--pw) * .008) calc(var(--pw) * .004) rgba(60,40,0,.55); }
  .plate .num i { font-style: normal; display: inline-block; width: calc(var(--pw) * .05); height: calc(var(--pw) * .018); margin: 0 calc(var(--pw) * .025); vertical-align: middle; background: var(--ink); transform: translateY(-40%); }
  .plate .sl { font-family: "Lobster Two", cursive; font-style: italic; font-weight: 700; font-size: calc(var(--pw) * .052); line-height: 1; white-space: nowrap; }
  .plate .reg { position: absolute; right: 4.6%; bottom: 10%; width: calc(var(--pw) * .1); height: calc(var(--pw) * .09); display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #C8322A; color: #FFF2DC; border-radius: calc(var(--pw) * .006); transform: rotate(-4deg); font-family: "Antonio", sans-serif; font-weight: 700; line-height: 1;
    font-size: max(1.6vmin, calc(var(--pw) * .026)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .plate .reg b { font-size: 1.25em; }

  /* chrome script emblem (shown when the body has room) */
  .emb { display: none; font-family: "Lobster Two", cursive; font-style: italic; font-weight: 700; line-height: 1.2; white-space: nowrap; padding: 0 1vmin;
    background: linear-gradient(180deg, #FFFFFF 0%, #C9D0D6 40%, #7E8891 52%, #EEF2F5 70%, #9AA3AB 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .3vmin .2vmin rgba(15,50,48,.55)); }

  .bumper { position: absolute; left: 0; right: 0; bottom: 0; height: 7vmin;
    background: linear-gradient(180deg, #5E666E 0%, #F6F8FA 18%, #AEB6BE 45%, #FFFFFF 58%, #8D959E 80%, #4A5057 100%); box-shadow: 0 -.6vmin 1.2vmin rgba(0,0,0,.25); }

  /* road strip */
  .road { position: absolute; left: 0; right: 0; bottom: 0; height: var(--road); box-sizing: border-box; padding: 0 6vmin;
    display: flex; align-items: center; justify-content: space-between; gap: 3vmin;
    background: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.18) 50%, transparent 51%) 0 0 / 2.4vmin 2.4vmin, #232427; }
  .road::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .9vmin; background: repeating-linear-gradient(90deg, var(--mus) 0 7vmin, transparent 7vmin 11vmin); }
  .road .l { font-size: 2.6vmin; font-weight: 600; letter-spacing: .08em; line-height: 1.3; text-transform: uppercase; white-space: nowrap; }
  .road .l b { color: var(--mus); font-weight: 700; }
  .road .l span { display: block; font-size: 1.9vmin; font-weight: 500; letter-spacing: .2em; color: rgba(255,246,226,.65); }
  .road .go { flex: none; font-size: 2.3vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; background: var(--mus); color: var(--ink); padding: 1.3vmin 2.6vmin 1.1vmin; }

  /* 3:4 – 4:5 */
  @media (min-aspect-ratio: 7/10) {
    .banner { --body: 60vmin; --road: 15vmin; --pw: 54vmin; }
    .car { padding-top: 4vmin; }
    h1 { font-size: 7.6vmin; }
    .mount { margin-top: 2.4vmin; }
    .bumper { height: 5.6vmin; }
    .road .l { font-size: 2.3vmin; }
  }
  /* square: car tail column on the left, photo right */
  @media (min-aspect-ratio: 9/10) {
    .banner { --pw: 42vmin; --road: 16vmin; }
    .photo { left: 50%; top: 0; width: 50%; height: 100%; }
    .car { width: 50%; height: calc(100% - var(--road)); padding: 7vmin 4vmin 0; justify-content: flex-start; }
    .k { font-size: 1.8vmin; letter-spacing: .3em; padding-left: .3em; }
    h1 { font-size: 6.8vmin; margin-top: 1.4vmin; }
    .mount { margin-top: 6vmin; }
    .emb { display: block; margin: auto 0 10vmin; font-size: 6.4vmin; }
    .bumper { height: 6vmin; }
    .road { right: 50%; padding: 0 4vmin; gap: 2vmin; }
    .road::before { background: repeating-linear-gradient(90deg, var(--mus) 0 5vmin, transparent 5vmin 8vmin); }
    .road .l { font-size: 1.9vmin; letter-spacing: .06em; }
    .road .l span { font-size: 1.6vmin; letter-spacing: .14em; }
    .road .go { font-size: 1.8vmin; letter-spacing: .14em; padding: 1vmin 1.6vmin .9vmin; }
  }
  /* wide: photo left, car tail right */
  @media (min-aspect-ratio: 6/5) {
    .banner { --pw: 54vmin; --road: 17vmin; }
    .photo { left: 0; width: 48%; }
    .car { left: 48%; width: 52%; padding: 6.6vmin 6vmin 0; }
    .k { font-size: 2vmin; letter-spacing: .36em; padding-left: .36em; }
    h1 { font-size: 8vmin; margin-top: 1vmin; }
    .mount { margin-top: 3.6vmin; }
    .emb { margin-bottom: 10.6vmin; font-size: 6.4vmin; }
    .road { left: 48%; right: 0; padding: 0 6vmin; gap: 3vmin; }
    .road .l { font-size: 2.3vmin; letter-spacing: .08em; }
    .road .l span { font-size: 1.8vmin; letter-spacing: .18em; }
    .road .go { font-size: 2.1vmin; letter-spacing: .18em; padding: 1.2vmin 2.4vmin 1vmin; }
  }

  /* ───────── motion (6s loop · t=0 = the parked tail) ─────────
     constant: lane dashes stream past under the car (one dash period per 1.5s); passing streetlights sweep a reflection
               over the glossy paint twice per loop; chrome bumper catches a glint
     beats: 1.4s a highlight rolls across the embossed plate · 3.0s the registration sticker pops (fresh for the season) ·
            4.6s "Hit the road" revs forward and back */
  .road::before { animation: lane 1.5s linear infinite; }
  @keyframes lane { from { background-position: 0 0; } to { background-position: -11vmin 0; } }
  @media (min-aspect-ratio: 9/10) { @keyframes lane { from { background-position: 0 0; } to { background-position: -8vmin 0; } } }

  .car::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(100deg, transparent 0 38%, rgba(255,255,255,.7) 46%, rgba(255,255,255,.15) 50%, transparent 58% 100%) 150% 0 / 300% 100% no-repeat;
    animation: street 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes street { 0%, 30%, 100% { background-position: 150% 0; } 75% { background-position: -50% 0; } }

  .bumper::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent 0 44%, rgba(255,255,255,.9) 50%, transparent 56% 100%) 150% 0 / 300% 100% no-repeat;
    animation: street 3s cubic-bezier(.45,0,.55,1) infinite; animation-delay: -.25s; }

  .plate::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(115deg, transparent 0 40%, rgba(255,255,255,.95) 50%, transparent 60% 100%) 150% 0 / 300% 100% no-repeat;
    animation: plate 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes plate { 0%, 16%, 100% { background-position: 150% 0; } 36% { background-position: -50% 0; } }

  .plate .reg { z-index: 1; animation: sticker 6s linear infinite; }
  @keyframes sticker {
    0%, 47%, 100% { transform: rotate(-4deg) scale(1); }
    50% { transform: rotate(-12deg) scale(1.28); animation-timing-function: cubic-bezier(.5,0,.8,.5); }
    53.5% { transform: rotate(-2deg) scale(.94); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    58% { transform: rotate(-4deg) scale(1); }
  }

  .road .go { animation: rev 6s linear infinite; }
  @keyframes rev {
    0%, 74%, 100% { transform: translateX(0); }
    76% { transform: translateX(-.5vmin); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    80% { transform: translateX(1.4vmin); animation-timing-function: cubic-bezier(.45,0,.55,1); }
    86% { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="car">
    <div class="k">The Road-Trip Edit · Nº 26</div>
    <h1>Pack the trunk.</h1>
    <div class="mount">
      <div class="hood"></div>
      <div class="plate">
        <i class="hole h1"></i><i class="hole h2"></i><i class="hole h3"></i><i class="hole h4"></i>
        <span class="st">SUNSET TERRITORY</span>
        <span class="num">SAVE<i></i>30</span>
        <span class="sl">Land of the long weekend</span>
        <span class="reg"><span>SEP</span><b>26</b></span>
      </div>
    </div>
    <div class="emb">Cruiser Deluxe</div>
    <div class="bumper"></div>
  </div>
  <div class="road">
    <div class="l"><b>30% off</b> the new season<span>Code SAVE30 · ends Sunday</span></div>
    <span class="go">Hit the road →</span>
  </div>
</div>
</body>
</html>
