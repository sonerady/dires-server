<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Sealed Deal — a mystery offer as the back of a sealed envelope: folded flaps drawn in paper tones,
     an oxblood wax seal with a "?" where the flaps meet, the discount revealed only at checkout.
     tall → photo above the envelope; square / wide → photo left, envelope right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #E7D9C7; }
  .banner { --panel: 78vmin; --tip: 27vmin; position: fixed; inset: 0; overflow: hidden; background: #E7D9C7; color: #2B1F1A; font-family: "DM Mono", ui-monospace, Menlo, monospace; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - var(--panel)); object-fit: cover; object-position: 50% 22%; }
  .env { position: absolute; left: 0; right: 0; bottom: 0; height: var(--panel); overflow: hidden; background: #E7D9C7; box-shadow: 0 -1.2vmin 2.4vmin rgba(43,31,26,.18); }
  .env svg { position: absolute; display: block; }
  .pocket { left: 0; top: 0; width: 100%; height: 100%; }
  .flap { left: 0; top: 0; width: 100%; height: var(--tip); filter: drop-shadow(0 .8vmin .9vmin rgba(43,31,26,.22)); }
  .grain { left: 0; top: 0; width: 100%; height: 100%; opacity: .5; mix-blend-mode: multiply; }

  .seal { position: absolute; left: 50%; top: var(--tip); width: 21vmin; height: 21vmin; transform: translate(-50%, -50%) rotate(-8deg); filter: drop-shadow(0 .6vmin .8vmin rgba(60,10,12,.35)); }
  .seal svg { width: 100%; height: 100%; display: block; }

  .kick { position: absolute; left: 6vmin; right: 6vmin; top: 3.6vmin; display: flex; justify-content: space-between; font-size: 1.8vmin; letter-spacing: .16em; text-transform: uppercase; color: #5C4A3E; }
  .copy { position: absolute; left: 6vmin; right: 6vmin; top: calc(var(--tip) + 13vmin); bottom: 5vmin; display: flex; flex-direction: column; align-items: center; text-align: center; }
  h1 { margin: 0; font-family: "Playfair Display", Didot, Georgia, serif; font-style: italic; font-weight: 400; font-size: 10vmin; line-height: .95; letter-spacing: -.01em; }
  h1 br.b { display: none; }
  .sub { margin: 1.8vmin 0 0; font-family: "Playfair Display", Georgia, serif; font-size: 2.8vmin; line-height: 1.3; color: #4A3A30; }
  .sub b { font-weight: 600; color: #7B1E22; }
  .foot { margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; }
  .code { font-size: 1.9vmin; letter-spacing: .14em; text-transform: uppercase; color: #5C4A3E; text-align: left; }
  .code b { display: block; margin-top: .6vmin; font-weight: 500; font-size: 2.6vmin; letter-spacing: .26em; color: #2B1F1A; }
  .cta { background: #7B1E22; color: #F6ECDF; padding: 2vmin 3.2vmin; font-size: 1.9vmin; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { --panel: 70vmin; --tip: 24vmin; }
    .seal { width: 18vmin; height: 18vmin; }
    .copy { top: calc(var(--tip) + 11vmin); bottom: 4.4vmin; }
    h1 { font-size: 8.6vmin; }
    .sub { font-size: 2.5vmin; margin-top: 1.4vmin; }
    .cta { padding: 1.7vmin 2.8vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --tip: 38vmin; }
    .photo { width: 50%; height: 100%; }
    .env { left: 50%; top: 0; height: auto; box-shadow: -1.2vmin 0 2.4vmin rgba(43,31,26,.18); }
    .seal { width: 19vmin; height: 19vmin; }
    .kick { left: 5vmin; right: 5vmin; top: 4.4vmin; flex-direction: column; align-items: center; gap: .8vmin; }
    .copy { left: 5vmin; right: 5vmin; top: calc(var(--tip) + 12vmin); bottom: 5vmin; }
    h1 { font-size: 7vmin; }
    h1 br.b { display: inline; }
    .sub { font-size: 2.3vmin; }
    .foot { flex-direction: column; gap: 2.2vmin; }
    .code { text-align: center; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --tip: 36vmin; }
    .photo { width: 46%; object-position: 65% 25%; }
    .env { left: 46%; }
    .seal { width: 20vmin; height: 20vmin; }
    .kick { left: 7vmin; right: 7vmin; top: 5vmin; flex-direction: row; }
    .copy { left: 7vmin; right: 7vmin; top: calc(var(--tip) + 13vmin); bottom: 6vmin; }
    h1 { font-size: 9.6vmin; }
    h1 br.b { display: none; }
    .sub { font-size: 2.7vmin; }
    .foot { flex-direction: row; }
    .code { text-align: left; }
  }

  /* ───────── motion (6s loop, t=0 = the static design) ─────────
     constant: photo breathes (≤1.03)
     beats: 1.0s the flap tugs up twice against the wax, the seal rides with it and settles ·
            2.6s the seal throbs once while a specular glint crosses the wax · 3.6s "50% off" is underlined in oxblood ink, then the ink lifts ·
            4.8s sheen crosses the CTA */
  .photo { transform-origin: 50% 30%; animation: breathe 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  .flap { transform-origin: 50% 0; animation: tug 6s linear infinite; }
  @keyframes tug {
    0%, 16% { transform: scaleY(1); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    20% { transform: scaleY(.93); animation-timing-function: cubic-bezier(.5,0,.4,1.4); }
    25% { transform: scaleY(1); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    29% { transform: scaleY(.9); animation-timing-function: cubic-bezier(.5,0,.4,1.3); }
    36%, 100% { transform: scaleY(1); }
  }
  .seal { animation: ride 6s linear infinite; }
  @keyframes ride {
    0%, 16% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    20% { transform: translate(-50%, calc(-50% - var(--tip) * .07)) rotate(-6deg) scale(1); animation-timing-function: cubic-bezier(.5,0,.4,1.4); }
    25% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    29% { transform: translate(-50%, calc(-50% - var(--tip) * .1)) rotate(-5deg) scale(1); animation-timing-function: cubic-bezier(.5,0,.4,1.3); }
    36%, 43% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    47% { transform: translate(-50%, -50%) rotate(-8deg) scale(1.07); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    52% { transform: translate(-50%, -50%) rotate(-8deg) scale(.985); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    56%, 100% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
  }
  .seal::after { content: ""; position: absolute; inset: 17%; border-radius: 50%; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,220,210,0) 38%, rgba(255,220,210,.42) 50%, rgba(255,220,210,0) 62%) 130% 0 / 300% 100% no-repeat;
    mix-blend-mode: screen; animation: glint 6s linear infinite; }
  @keyframes glint {
    0%, 42% { background-position: 130% 0; animation-timing-function: cubic-bezier(.45,0,.3,1); }
    56%, 100% { background-position: -30% 0; }
  }

  .sub b { background: linear-gradient(#7B1E22, #7B1E22) 0 100% / 0% .3vmin no-repeat; padding-bottom: .2vmin; animation: ink 6s linear infinite; }
  @keyframes ink {
    0%, 58% { background-size: 0% .3vmin; background-position: 0 100%; animation-timing-function: cubic-bezier(.6,0,.3,1); }
    66%, 74% { background-size: 100% .3vmin; background-position: 0 100%; animation-timing-function: steps(1, end); }
    74.1% { background-size: 100% .3vmin; background-position: 100% 100%; animation-timing-function: cubic-bezier(.6,0,.3,1); }
    82%, 100% { background-size: 0% .3vmin; background-position: 100% 100%; }
  }

  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 30%; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,240,225,0), rgba(255,240,225,.32) 50%, rgba(255,240,225,0));
    transform: translateX(-160%) skewX(-18deg); animation: sheen 6s linear infinite; }
  @keyframes sheen {
    0%, 80% { transform: translateX(-160%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    94%, 100% { transform: translateX(400%) skewX(-18deg); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="env">
    <svg class="pocket" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,0 47,50 0,100" fill="#E1D1BD"/>
      <polygon points="100,0 53,50 100,100" fill="#E1D1BD"/>
      <polygon points="0,100 50,46 100,100" fill="#DBC9B3"/>
      <path d="M0 0 L47 50 L0 100 M100 0 L53 50 L100 100 M0 100 L50 46 L100 100" fill="none" stroke="#B9A389" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="flap" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,0 100,0 50,100" fill="#EDE1D2"/>
      <path d="M0 0 L50 100 L100 0" fill="none" stroke="#B9A389" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .36  0 0 0 .35 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
    <div class="kick"><span>Sealed offer Nº 0925</span><span>Opens at checkout</span></div>
    <div class="seal"><svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M98.1 50.0 L98.0 54.2 L96.7 58.2 L95.7 62.3 L94.2 66.1 L91.3 69.2 L88.6 72.3 L87.0 75.9 L85.0 79.4 L81.5 81.5 L77.9 83.3 L75.9 87.1 L74.3 92.1 L71.1 95.3 L66.5 95.4 L62.0 94.6 L57.8 94.3 L53.8 93.5 L50.0 92.6 L46.2 93.6 L41.9 96.2 L37.4 96.9 L33.8 94.6 L30.6 91.6 L26.7 90.3 L22.6 89.1 L19.8 85.9 L18.3 81.7 L16.3 78.2 L13.9 75.3 L11.8 72.0 L9.6 68.8 L5.7 66.1 L1.6 63.0 L0.8 58.7 L3.5 54.1 L6.1 50.0 L6.4 46.2 L6.1 42.3 L6.9 38.4 L7.7 34.6 L7.9 30.4 L8.9 26.3 L11.7 23.2 L14.6 20.3 L16.4 16.4 L18.8 12.8 L23.2 11.7 L28.3 12.5 L32.2 11.9 L35.1 9.0 L38.2 5.8 L41.8 3.7 L45.8 1.9 L50.0 0.6 L54.2 2.0 L57.8 5.6 L61.2 8.1 L65.2 8.1 L69.5 8.3 L72.7 10.7 L75.4 13.7 L79.0 15.5 L83.3 16.7 L86.8 19.1 L89.2 22.5 L91.5 26.0 L93.0 30.0 L92.2 34.6 L90.5 39.2 L91.4 42.7 L95.1 46.1Z" fill="#7B1E22"/>
      <circle cx="50" cy="50" r="33" fill="#8C2A2D"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#5E1417" stroke-width="2.4"/>
      <circle cx="50" cy="50" r="28.5" fill="none" stroke="#A63B3D" stroke-width=".8" stroke-dasharray="1.6 2.2"/>
      <text x="50" y="66" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-style="italic" font-size="44" fill="#5E1417">?</text>
      <text x="49.2" y="65" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-style="italic" font-size="44" fill="#C0585A" opacity=".55">?</text>
      <ellipse cx="36" cy="30" rx="10" ry="5" fill="#fff" opacity=".12" transform="rotate(-30 36 30)"/>
    </svg></div>
    <div class="copy">
      <h1>The Mystery<br class="b"> Deal</h1>
      <p class="sub">20, 30 or <b>50% off</b> — sealed<br>until you reach checkout.</p>
      <div class="foot"><span class="code">Code<b>OPENME</b></span><span class="cta">Break the seal</span></div>
    </div>
  </div>
</div>
</body>
</html>
