<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Sub Board — the fourth official's LED substitution board held up on the touchline: dot-matrix red OUT (25)
     and green IN (26) with arrows, an amber header, and a second little board showing added time (+4 days early access).
     Behind it, mown pitch stripes and a chalk touchline. tall/4:5 → photo above, touchline below ·
     square/wide → touchline panel left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #2C6A3A; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #2C6A3A; color: #F4F6F0; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 90vmin); object-fit: cover; object-position: 50% 20%; }
  .pitch { position: absolute; left: 0; right: 0; bottom: 0; height: 90vmin; overflow: hidden;
    background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 30%, rgba(0,0,0,.25)), repeating-linear-gradient(90deg, #2F7040 0 12.5vmin, #276236 12.5vmin 25vmin); }
  .line { position: absolute; left: 0; right: 0; top: 3vmin; height: .9vmin; background: rgba(250,250,245,.88); box-shadow: 0 0 .3vmin rgba(250,250,245,.5); }

  .board { position: absolute; left: 7vmin; top: 9vmin; width: 60vmin; height: 40vmin; transform: rotate(-3deg); }
  .case { position: absolute; inset: 0 7vmin 0 0; border-radius: 2.4vmin; background: linear-gradient(160deg, #2A2C2F, #0F1011 60%); box-shadow: inset 0 0 0 .5vmin #3A3D41, 0 1.6vmin 2.4vmin rgba(0,0,0,.45); display: flex; flex-direction: column; padding: 2.4vmin 3vmin; box-sizing: border-box; }
  .grip { position: absolute; right: 0; top: 30%; width: 8vmin; height: 40%; border-radius: 0 2vmin 2vmin 0; background: linear-gradient(90deg, #1A1B1D, #44474B 50%, #1A1B1D); }
  .grip::after { content: ""; position: absolute; left: 1.4vmin; right: 1.4vmin; top: 50%; height: 3vmin; margin-top: -1.5vmin; border-radius: 1.5vmin; background: repeating-linear-gradient(90deg, #111 0 .4vmin, #2B2D30 .4vmin .9vmin); }
  .dots { -webkit-mask-image: radial-gradient(circle, #000 .3vmin, transparent .36vmin); mask-image: radial-gradient(circle, #000 .3vmin, transparent .36vmin); -webkit-mask-size: .9vmin .9vmin; mask-size: .9vmin .9vmin; }
  .hdr { flex: none; font-family: "Teko", "Arial Narrow", sans-serif; font-weight: 500; font-size: 3.2vmin; line-height: 1; letter-spacing: .12em; color: #FFB22E; text-transform: uppercase; filter: drop-shadow(0 0 .8vmin rgba(255,178,46,.6)); white-space: nowrap; }
  .row { flex: 1; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,.08); }
  .row .n { font-family: "Teko", "Arial Narrow", sans-serif; font-weight: 600; font-size: 17vmin; line-height: .7; padding-top: 2.2vmin; font-variant-numeric: tabular-nums; }
  .row .a { width: 9vmin; height: 7vmin; }
  .out { color: #FF3B30; filter: drop-shadow(0 0 1vmin rgba(255,59,48,.65)); }
  .in { color: #3DFF6E; filter: drop-shadow(0 0 1vmin rgba(61,255,110,.6)); }
  .out .a { background: #FF3B30; clip-path: polygon(0 50%, 45% 0, 45% 28%, 100% 28%, 100% 72%, 45% 72%, 45% 100%); }
  .in .a { background: #3DFF6E; clip-path: polygon(100% 50%, 55% 0, 55% 28%, 0 28%, 0 72%, 55% 72%, 55% 100%); }
  .row .l { font-family: "Teko", sans-serif; font-weight: 500; font-size: 3vmin; letter-spacing: .14em; text-transform: uppercase; }

  .added { position: absolute; right: 7vmin; top: 14vmin; width: 18vmin; height: 20vmin; border-radius: 1.8vmin; background: linear-gradient(160deg, #2A2C2F, #0F1011 60%); box-shadow: inset 0 0 0 .5vmin #3A3D41, 0 1.2vmin 2vmin rgba(0,0,0,.45); transform: rotate(4deg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .added b span { display: block; }
  .added b { font-family: "Teko", sans-serif; font-weight: 600; font-size: 12vmin; line-height: .72; padding-top: 1.6vmin; color: #FFB22E; filter: drop-shadow(0 0 1vmin rgba(255,178,46,.6)); }
  .added small { margin-top: 1.4vmin; font-weight: 700; font-size: 1.6vmin; letter-spacing: .16em; text-transform: uppercase; color: #C9CCD1; text-align: center; line-height: 1.3; }

  .copy { position: absolute; left: 7vmin; right: 7vmin; top: 55vmin; }
  .copy h2 { margin: 0; font-weight: 800; font-size: 6.4vmin; line-height: 1.02; letter-spacing: -.025em; }
  .copy h2 span { color: #FF8A80; } .copy h2 em { font-style: normal; color: #9DFFB5; }
  .copy p { margin: 1.6vmin 0 0; font-weight: 500; font-size: 2.2vmin; line-height: 1.45; color: #E3EADF; }
  .copy p b { color: #FFD27A; font-weight: 800; letter-spacing: .06em; }
  .cta { position: absolute; left: 7vmin; right: 7vmin; bottom: 5vmin; display: flex; justify-content: space-between; align-items: center; padding: 1.8vmin 3vmin; background: #F4F6F0; color: #16361F; font-weight: 800; font-size: 2.3vmin; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 82vmin); }
    .pitch { height: 82vmin; }
    .board { top: 8vmin; width: 56vmin; height: 37vmin; }
    .row .n { font-size: 15.6vmin; }
    .added { top: 12vmin; height: 19vmin; }
    .copy { top: 50vmin; }
    .copy h2 { font-size: 6vmin; }
    .cta { bottom: 4.4vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 64vmin); }
    .pitch { height: 64vmin; }
    .line { top: 2.4vmin; height: .7vmin; }
    .board { left: 7vmin; top: 7vmin; width: 46vmin; height: 31vmin; }
    .case { inset: 0 5.4vmin 0 0; padding: 1.8vmin 2.4vmin; border-radius: 2vmin; }
    .grip { width: 6vmin; }
    .hdr { font-size: 2.6vmin; }
    .row .n { font-size: 12.6vmin; padding-top: 1.8vmin; }
    .row .a { width: 7vmin; height: 5.4vmin; }
    .row .l { font-size: 2.6vmin; }
    .added { right: auto; left: 58vmin; top: 9vmin; width: 15vmin; height: 16.5vmin; }
    .added b { font-size: 9.6vmin; }
    .copy { left: 58vmin; right: 6vmin; top: 29vmin; }
    .copy h2 { font-size: 3.6vmin; }
    .copy p { font-size: 1.8vmin; margin-top: 1.2vmin; }
    .cta { left: 7vmin; right: 6vmin; bottom: 4.4vmin; padding: 1.5vmin 2.6vmin; font-size: 2.1vmin; }
  }
  /* square / wide → touchline panel left, photo right */
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; width: 48%; height: 100%; object-position: 50% 25%; }
    .pitch { right: 48%; top: 0; height: auto; }
    .line { left: auto; right: 2.6vmin; top: 0; bottom: 0; width: .8vmin; height: auto; }
    .board { left: 5vmin; top: 7vmin; width: 42vmin; height: 29vmin; }
    .case { inset: 0 5vmin 0 0; padding: 1.8vmin 2.2vmin; border-radius: 2vmin; }
    .grip { width: 5.6vmin; }
    .hdr { font-size: 2.4vmin; }
    .row .n { font-size: 11.6vmin; padding-top: 1.6vmin; }
    .row .a { width: 6.4vmin; height: 5vmin; }
    .row .l { font-size: 2.4vmin; }
    .added { display: none; }
    .copy { left: 5vmin; right: 6vmin; top: 46vmin; }
    .copy h2 { font-size: 4.4vmin; }
    .copy p { font-size: 2vmin; margin-top: 2vmin; }
    .cta { left: 5vmin; right: 6vmin; bottom: 5vmin; padding: 1.5vmin 2.2vmin; font-size: 1.9vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .pitch { right: 46%; }
    .board { left: 6vmin; top: 8vmin; width: 50vmin; height: 34vmin; }
    .case { inset: 0 6vmin 0 0; padding: 2vmin 2.6vmin; }
    .grip { width: 6.6vmin; }
    .hdr { font-size: 2.8vmin; }
    .row .n { font-size: 14vmin; padding-top: 2vmin; }
    .row .a { width: 7.6vmin; height: 6vmin; }
    .row .l { font-size: 2.8vmin; }
    .added { display: flex; right: 7vmin; left: auto; top: 12vmin; width: 16vmin; height: 18vmin; }
    .added b { font-size: 10.6vmin; }
    .copy { left: 6vmin; right: 7vmin; top: 50vmin; }
    .copy h2 { font-size: 5.4vmin; }
    .copy p { font-size: 2.1vmin; }
    .cta { left: 6vmin; right: 7vmin; bottom: 6vmin; padding: 1.7vmin 2.8vmin; font-size: 2.2vmin; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ───────── */
  /* 1 · the board is held up by hand: a slow, weighted sway */
  .board { transform-origin: 90% 50%; animation: hold 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes hold {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    25% { transform: rotate(-2.2deg) translateY(-.5vmin); }
    50% { transform: rotate(-3.5deg) translateY(.2vmin); }
    75% { transform: rotate(-2.6deg) translateY(-.3vmin); }
  }
  .added { animation: hold2 3s cubic-bezier(.45,0,.55,1) infinite; animation-delay: -.8s; }
  @keyframes hold2 { 0%, 100% { transform: rotate(4deg) translateY(0); } 50% { transform: rotate(3.2deg) translateY(-.5vmin); } }
  /* 2 · the numbers are re-lit line by line, like the LED matrix refreshing — OUT first, then IN */
  .out .n { animation: relight 6s linear infinite; }
  .in .n { animation: relight 6s linear infinite; animation-delay: -5.6s; }
  @keyframes relight {
    0%, 14% { clip-path: inset(0 0 0 0); opacity: 1; }
    14.1%, 18% { clip-path: inset(0 0 0 0); opacity: 0; animation-timing-function: steps(8, end); }
    18.1% { clip-path: inset(0 0 100% 0); opacity: 1; animation-timing-function: steps(8, end); }
    26%, 100% { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  /* 3 · the arrows chase in their direction, one dot at a time */
  .out .a { animation: chaseL 1.5s steps(1, end) infinite; }
  .in .a { animation: chaseR 1.5s steps(1, end) infinite; }
  @keyframes chaseL { 0%, 60% { transform: translateX(0); } 70% { transform: translateX(-.9vmin); } 80% { transform: translateX(-1.8vmin); } 90%, 100% { transform: translateX(0); } }
  @keyframes chaseR { 0%, 60% { transform: translateX(0); } 70% { transform: translateX(.9vmin); } 80% { transform: translateX(1.8vmin); } 90%, 100% { transform: translateX(0); } }
  /* 4 · added time: the +4 blinks three times, then burns steady */
  .added b span { animation: added 6s steps(1, end) infinite; }
  @keyframes added { 0%, 50% { opacity: 1; } 51%, 53% { opacity: .08; } 54%, 56% { opacity: 1; } 57%, 59% { opacity: .08; } 60%, 62% { opacity: 1; } 63%, 65% { opacity: .08; } 66%, 100% { opacity: 1; } }
  /* the amber header breathes */
  .hdr { animation: amber 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes amber { 0%, 100% { filter: drop-shadow(0 0 .8vmin rgba(255,178,46,.6)); } 50% { filter: drop-shadow(0 0 1.6vmin rgba(255,178,46,.85)); } }
  /* 5 · CTA: the arrow steps across, twice */
  .cta span:last-child { animation: nudge 6s linear infinite; }
  @keyframes nudge {
    0%, 74% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    78% { transform: translateX(1.2vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    82% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    86% { transform: translateX(1.2vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    90%, 100% { transform: translateX(0); }
  }

</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="pitch">
    <div class="line"></div>
    <div class="board">
      <span class="grip"></span>
      <div class="case">
        <div class="hdr">Substitution · Nord</div>
        <div class="row out"><span class="a dots"></span><span class="l">Out</span><span class="n dots">25</span></div>
        <div class="row in"><span class="a dots"></span><span class="l">In</span><span class="n dots">26</span></div>
      </div>
    </div>
    <div class="added"><b><span class="dots">+4</span></b><small>Days early<br>access</small></div>
    <div class="copy">
      <h2><span>Out:</span> last season.<br><em>In:</em> the new one.</h2>
      <p>The 26 collection lands 29.09. Members get four days early from 25.09. Code <b>IN26</b></p>
    </div>
    <div class="cta"><span>Make the change</span><span>→</span></div>
  </div>
</div>
</body>
</html>
