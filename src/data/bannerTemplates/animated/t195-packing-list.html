<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Packing List — the festival-outfit edit as a scribbled packing list: a torn notebook page (ruled lines the writing
     sits on, red margin), marker ticks and strike-throughs, the last line circled — "the look" — with the saving scrawled
     beside it, a strip of pink tape and a glitter sticker.
     tall → photo above, torn page below · square & wide → photo left, page right (torn along its left edge) */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FDFBF5; }
  .banner { --r: 7.4vmin; --m: 15vmin; --top: 55%; position: fixed; inset: 0; overflow: hidden; background: #FDFBF5; color: #1D2A55; font-family: "Caveat", "Comic Sans MS", cursive; }
  .mono { font-family: "DM Mono", "Courier New", monospace; }

  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--top) + 1.4vmin); object-fit: cover; object-position: 50% 20%; }
  .page { position: absolute; left: 0; right: 0; top: var(--top); bottom: 0;
    background:
      linear-gradient(90deg, transparent calc(var(--m) - 3vmin), rgba(232,71,43,.6) calc(var(--m) - 3vmin), rgba(232,71,43,.6) calc(var(--m) - 3vmin + 1px), transparent calc(var(--m) - 3vmin + 1px)),
      repeating-linear-gradient(to bottom, transparent 0 calc(var(--r) - 1px), rgba(62,120,200,.3) calc(var(--r) - 1px) var(--r)),
      #FDFBF5; }
  .tear { position: absolute; left: 0; right: 0; top: calc(var(--top) - 2.2vmin); height: 2.6vmin; width: 100%; }
  .tear.v { display: none; }
  .tape { position: absolute; right: 7vmin; top: calc(var(--top) - 4vmin); width: 20vmin; height: 6vmin; transform: rotate(5deg); background: rgba(255,120,170,.8);
    clip-path: polygon(2% 8%, 8% 0, 16% 10%, 24% 1%, 33% 9%, 41% 0, 50% 8%, 59% 1%, 67% 9%, 76% 0, 84% 8%, 92% 0, 98% 10%, 100% 90%, 93% 100%, 85% 91%, 76% 100%, 67% 92%, 58% 100%, 50% 91%, 41% 100%, 33% 91%, 24% 100%, 16% 92%, 8% 100%, 0 90%); }
  .sticker { position: absolute; left: 4.5vmin; top: 4.5vmin; width: 16vmin; height: 16vmin; border-radius: 50%; background: radial-gradient(circle at 24% 30%, #FFE17A 0 6%, transparent 7%), radial-gradient(circle at 80% 62%, #9BE8FF 0 5%, transparent 6%), radial-gradient(circle at 30% 78%, #FFFFFF 0 4%, transparent 5%), radial-gradient(circle at 72% 22%, #FFFFFF 0 3%, transparent 4%), #FF5FA2; display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(-12deg); box-shadow: 0 .6vmin 1.2vmin rgba(0,0,0,.18); color: #fff; }
  .sticker b { font-size: 4.4vmin; font-weight: 700; line-height: .82; }

  /* every line box is a multiple of --r, so the handwriting sits on the ruling */
  .sheet { position: absolute; left: var(--m); right: 6vmin; top: var(--top); bottom: 0; padding-top: var(--r); box-sizing: border-box; display: flex; flex-direction: column; }
  .date { height: var(--r); line-height: calc(var(--r) * 1.3); font-size: 1.7vmin; letter-spacing: .12em; text-transform: uppercase; color: #6A7090; }
  h1 { margin: 0; height: calc(var(--r) * 2); line-height: calc(var(--r) * 2.3); font-size: calc(var(--r) * 1.75); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  h1 u { text-decoration: none; background: linear-gradient(transparent 58%, rgba(255,225,80,.85) 58% 84%, transparent 84%); }
  ul { list-style: none; margin: 0; padding: 0; font-size: calc(var(--r) * .78); font-weight: 500; }
  li { position: relative; height: var(--r); line-height: calc(var(--r) * 1.18); padding-left: calc(var(--r) * .85); white-space: nowrap; }
  li::before { content: ""; position: absolute; left: 0; bottom: calc(var(--r) * .14); width: calc(var(--r) * .44); height: calc(var(--r) * .44); border: .35vmin solid #1D2A55; border-radius: .4vmin; box-sizing: border-box; }
  li.done s { text-decoration: none; background: linear-gradient(transparent 56%, #1D2A55 56% 63%, transparent 63%); color: #6A7090; }
  li.done::after { content: ""; position: absolute; left: calc(var(--r) * .1); bottom: calc(var(--r) * .2); width: calc(var(--r) * .2); height: calc(var(--r) * .42); border: solid #E8472B; border-width: 0 .6vmin .6vmin 0; transform: rotate(40deg); }
  li.look { font-weight: 700; color: #E8472B; }
  li.look span { position: relative; }
  li.look span::after { content: ""; position: absolute; left: -2vmin; right: -2.4vmin; top: 14%; bottom: -8%; border: .45vmin solid #E8472B; border-radius: 50%; transform: rotate(-3deg); }
  li.look em { display: inline-block; font-style: normal; font-weight: 700; font-size: 1.3em; margin-left: 4vmin; transform: rotate(-6deg); color: #E8472B; }
  li.look em::before { content: "← "; font-size: .6em; }
  .foot { margin-top: auto; height: calc(var(--r) * 2); display: flex; justify-content: space-between; align-items: center; gap: 2vmin; }
  .code { font-size: 1.8vmin; line-height: 1.5; letter-spacing: .06em; text-transform: uppercase; color: #4A5170; }
  .code b { font-weight: 500; color: #1D2A55; font-size: 2.2vmin; letter-spacing: .1em; }
  .cta { font-size: 4.8vmin; font-weight: 700; white-space: nowrap; color: #1D2A55; background: linear-gradient(transparent 70%, #FF5FA2 70% 84%, transparent 84%); }

  @media (min-aspect-ratio: 5/8) { li.x { display: none; } }
  @media (min-aspect-ratio: 7/10) {
    .banner { --r: 6.6vmin; --top: 50%; }
    .sticker { width: 13vmin; height: 13vmin; }
    .sticker b { font-size: 3.6vmin; }
    .cta { font-size: 4.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --r: 6.4vmin; --top: 0%; --m: calc(48% + 11vmin); }
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .page { left: 48%; background-image: linear-gradient(90deg, transparent 8.4vmin, rgba(232,71,43,.6) 8.4vmin, rgba(232,71,43,.6) calc(8.4vmin + 1px), transparent calc(8.4vmin + 1px)), repeating-linear-gradient(to bottom, transparent 0 calc(var(--r) - 1px), rgba(62,120,200,.3) calc(var(--r) - 1px) var(--r)); background-color: #FDFBF5; }
    .tear { display: none; }
    .tear.v { display: block; left: calc(48% - 2.2vmin); top: 0; width: 2.6vmin; height: 100%; right: auto; }
    .tape { right: auto; left: calc(48% - 6vmin); top: 4vmin; transform: rotate(-38deg); width: 16vmin; height: 5vmin; }
    .sheet { right: 4vmin; }
    h1 { font-size: calc(var(--r) * 1.3); }
    li.x { display: block; }
    li.look em { margin-left: 3vmin; }
    .foot { height: calc(var(--r) * 3); flex-direction: column; align-items: flex-start; justify-content: center; gap: 1.2vmin; }
    .cta { font-size: 4.2vmin; }
    .sticker { width: 12vmin; height: 12vmin; left: 3.5vmin; top: 3.5vmin; }
    .sticker b { font-size: 3.3vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { --r: 7.6vmin; --m: calc(42% + 15vmin); }
    .photo { width: 44%; object-position: 50% 30%; }
    .page { left: 42%; background-image: linear-gradient(90deg, transparent 12vmin, rgba(232,71,43,.6) 12vmin, rgba(232,71,43,.6) calc(12vmin + 1px), transparent calc(12vmin + 1px)), repeating-linear-gradient(to bottom, transparent 0 calc(var(--r) - 1px), rgba(62,120,200,.3) calc(var(--r) - 1px) var(--r)); }
    .tear.v { left: calc(42% - 2.2vmin); }
    .tape { left: calc(42% - 6vmin); }
    .sheet { right: 6vmin; }
    h1 { font-size: calc(var(--r) * 1.7); }
    .foot { height: calc(var(--r) * 2); flex-direction: row; align-items: center; justify-content: space-between; }
    .cta { font-size: 4.8vmin; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ─────────
     calm first 1.2s · 1.2s the list is re-written line by line (strike erased → pen re-crosses it → red tick pops) ·
     3.2s the marker circle is redrawn round "The look", the −25% scrawl punches · 4.7s the pink highlighter re-swipes the CTA ·
     constant: photo breathes (≤1.03), the glitter sticker sways and a glint crosses it */
  .photo { transform-origin: 50% 20%; animation: breathe 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  li.done s { background-repeat: no-repeat; background-size: 100% 100%; animation: restrike 6s linear infinite; }
  @keyframes restrike {
    0%, 19.5% { background-size: 100% 100%; animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    21.5% { background-size: 0% 100%; }
    23.5% { background-size: 0% 100%; animation-timing-function: cubic-bezier(.3,.1,.2,1); }
    29%, 100% { background-size: 100% 100%; }
  }
  li.done::after { animation: tick 6s linear infinite; }
  @keyframes tick {
    0%, 19.5% { opacity: 1; transform: rotate(40deg) scale(1); }
    21% { opacity: 0; transform: rotate(40deg) scale(.5); }
    28.5% { opacity: 0; transform: rotate(40deg) scale(.5); animation-timing-function: cubic-bezier(.2,.9,.3,1.2); }
    31.5% { opacity: 1; transform: rotate(40deg) scale(1.25); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    34%, 100% { opacity: 1; transform: rotate(40deg) scale(1); }
  }
  /* lines 2 and 3 follow 0.5s / 1s later (negative delay = L − shift) */
  li.done:nth-child(2) s, li.done:nth-child(2)::after { animation-delay: -5.5s; }
  li.done:nth-child(3) s, li.done:nth-child(3)::after { animation-delay: -5s; }

  li.look span::after { clip-path: inset(-30% -30% -30% -30%); animation: circle 6s linear infinite; }
  @keyframes circle {
    0%, 53% { clip-path: inset(-30% -30% -30% -30%); animation-timing-function: steps(1, end); }
    53.3% { clip-path: inset(-30% 130% -30% -30%); }
    55% { clip-path: inset(-30% 130% -30% -30%); animation-timing-function: cubic-bezier(.45,.05,.25,1); }
    64%, 100% { clip-path: inset(-30% -30% -30% -30%); }
  }
  li.look em { animation: scrawl 6s linear infinite; }
  @keyframes scrawl {
    0%, 65% { transform: rotate(-6deg) scale(1); animation-timing-function: cubic-bezier(.2,.9,.3,1); }
    68% { transform: rotate(-11deg) scale(1.28); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    71.5% { transform: rotate(-4deg) scale(.95); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    75%, 100% { transform: rotate(-6deg) scale(1); }
  }

  .cta { background-repeat: no-repeat; background-size: 100% 100%; animation: marker 6s linear infinite; }
  @keyframes marker {
    0%, 78% { background-size: 100% 100%; animation-timing-function: steps(1, end); }
    78.3% { background-size: 0% 100%; }
    79% { background-size: 0% 100%; animation-timing-function: cubic-bezier(.35,.1,.2,1); }
    87%, 100% { background-size: 100% 100%; }
  }

  .sticker { overflow: hidden; animation: sway 3s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(-6deg) scale(1.03); } }
  .sticker::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 40%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55) 50%, rgba(255,255,255,0));
    transform: translateX(-180%) skewX(-18deg); animation: glint 6s linear infinite; }
  @keyframes glint {
    0%, 86% { transform: translateX(-180%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    96%, 100% { transform: translateX(330%) skewX(-18deg); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="page"></div>
  <svg class="tear" viewBox="0 0 100 4" preserveAspectRatio="none" aria-hidden="true"><path d="M0 4 L0 2.2 L3 1.4 L5 2.6 L8 1 L11 2.4 L14 1.6 L17 2.8 L20 1.2 L24 2.2 L27 .8 L30 2.4 L34 1.4 L37 2.6 L40 1 L44 2.2 L47 1.2 L50 2.8 L54 1.4 L57 2.4 L60 .9 L64 2.2 L67 1.6 L70 2.8 L74 1.2 L77 2.2 L80 1 L84 2.6 L87 1.4 L90 2.4 L94 1.2 L97 2.2 L100 1.4 L100 4 Z" fill="#FDFBF5"/></svg>
  <svg class="tear v" viewBox="0 0 4 100" preserveAspectRatio="none" aria-hidden="true"><path d="M4 0 L2.2 0 L1.4 3 L2.6 5 L1 8 L2.4 11 L1.6 14 L2.8 17 L1.2 20 L2.2 24 L.8 27 L2.4 30 L1.4 34 L2.6 37 L1 40 L2.2 44 L1.2 47 L2.8 50 L1.4 54 L2.4 57 L.9 60 L2.2 64 L1.6 67 L2.8 70 L1.2 74 L2.2 77 L1 80 L2.6 84 L1.4 87 L2.4 90 L1.2 94 L2.2 97 L1.4 100 L4 100 Z" fill="#FDFBF5"/></svg>
  <div class="tape"></div>
  <div class="sticker"><b>fest<br>edit<br>’26</b></div>
  <div class="sheet">
    <div class="date mono">To pack · Fri 03 July</div>
    <h1>Festival <u>bag</u></h1>
    <ul>
      <li class="done"><s>Sunnies</s></li>
      <li class="done x"><s>Power bank</s></li>
      <li class="done"><s>Glitter</s></li>
      <li class="look"><span>The look</span><em>−25%</em></li>
    </ul>
    <div class="foot">
      <div class="code mono">Code <b>PACK25</b><br>Ends Sunday</div>
      <div class="cta">Shop the edit →</div>
    </div>
  </div>
</div>
</body>
</html>
