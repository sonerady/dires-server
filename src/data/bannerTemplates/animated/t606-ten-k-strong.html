<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Work+Sans:ital,wght@0,400;0,500;0,700;1,800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  /* Ten K Strong — community milestone: a giant bubble-weight "10k" in pink on cobalt with "of you." stacked beside it,
     CSS confetti, an initials avatar stack "+9,994", then the photo and a thank-you code.
     tall / 3:4 → number band, avatars, photo, code · square / wide → number column left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #2437D4; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #2437D4; color: #FFF5EC; box-sizing: border-box;
    font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; padding: 5.4vmin 6vmin 5vmin; }
  .banner::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(80vmin 60vmin at 0% 0%, rgba(255,196,218,.18), transparent 70%), radial-gradient(70vmin 60vmin at 100% 100%, rgba(10,16,90,.45), transparent 70%); }

  .top { position: relative; flex: none; }
  .kick { display: flex; justify-content: space-between; gap: 2vmin; font-size: 1.7vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #C9D0FF; white-space: nowrap; }
  .fig { position: relative; display: flex; align-items: flex-end; gap: 3vmin; margin-top: 2.6vmin; }
  .big { font-family: "Bowlby One", Impact, sans-serif; font-size: 27vmin; line-height: .8; letter-spacing: -.03em; color: #FFC4DA; text-shadow: .8vmin .8vmin 0 #0F1B8C; white-space: nowrap; }
  .big .one { display: inline-block; line-height: .8; margin-right: -.1em; }
  .of { padding-bottom: .6vmin; font-style: italic; font-weight: 800; font-size: 6.6vmin; line-height: .92; letter-spacing: -.02em; }
  .conf i { position: absolute; display: block; }
  .c1 { right: 2vmin; top: 1vmin; width: 3vmin; height: 1vmin; background: #FFC4DA; transform: rotate(28deg); }
  .c2 { right: 12vmin; top: -2vmin; width: 1.6vmin; height: 1.6vmin; border-radius: 50%; background: #FFD84A; }
  .c3 { right: 4vmin; top: 8vmin; width: 1.4vmin; height: 3.2vmin; background: #7CF0C8; transform: rotate(-24deg); }
  .c4 { right: 17vmin; top: 5vmin; width: 2.4vmin; height: 2.4vmin; border: .5vmin solid #FFF5EC; border-radius: 50%; box-sizing: border-box; }
  .c5 { right: 26vmin; top: -1vmin; width: 2.6vmin; height: .9vmin; background: #7CF0C8; transform: rotate(-40deg); }

  .crowd { position: relative; flex: none; display: flex; align-items: center; margin-top: 3.6vmin; }
  .crowd span { width: 6vmin; height: 6vmin; margin-right: .5vmin; border-radius: 50%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; font-size: 1.8vmin; font-weight: 700; color: #16125A; }
  .crowd span:nth-child(1) { background: #FFC4DA; } .crowd span:nth-child(2) { background: #FFD84A; } .crowd span:nth-child(3) { background: #7CF0C8; }
  .crowd span:nth-child(4) { background: #FFF5EC; } .crowd span:nth-child(5) { background: #A9B4FF; } .crowd span:nth-child(6) { background: #FF9C7A; }
  .crowd p { margin: 0 0 0 3.4vmin; font-size: 1.9vmin; line-height: 1.3; color: #DDE1FF; }
  .crowd p b { display: block; font-size: 2.6vmin; color: #FFF5EC; }

  .photo { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 3.6vmin; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; display: block; }

  .foot { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 3vmin; margin-top: 3vmin; }
  .thanks { font-size: 1.9vmin; line-height: 1.35; color: #DDE1FF; }
  .thanks b { display: block; font-size: 3.2vmin; line-height: 1.1; font-weight: 800; font-style: italic; color: #FFF5EC; }
  .code { flex: none; text-align: center; padding: 1.4vmin 2.8vmin; border: .35vmin dashed #FFC4DA; font-size: 1.6vmin; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #FFC4DA; white-space: nowrap; }
  .code b { display: block; font-family: "Bowlby One", Impact, sans-serif; font-weight: 400; font-size: 3.2vmin; letter-spacing: .06em; color: #FFF5EC; }

  @media (min-aspect-ratio: 7/10) {
    .banner { padding: 4.6vmin 6vmin 4.4vmin; }
    .fig { margin-top: 2vmin; }
    .big { font-size: 22vmin; }
    .of { font-size: 5.6vmin; }
    .crowd { margin-top: 2.6vmin; }
    .crowd span { width: 5.2vmin; height: 5.2vmin; }
    .photo { margin-top: 3vmin; }
    .foot { margin-top: 2.4vmin; }
    .thanks b { font-size: 2.8vmin; }
  }
  /* ── square / wide: the celebration column left, photo right ── */
  @media (min-aspect-ratio: 9/10) {
    .banner { display: grid; padding: 5vmin; column-gap: 5vmin; grid-template-columns: 1fr 46%;
      grid-template-rows: auto 1fr auto auto; grid-template-areas: "top photo" ". photo" "crowd photo" "foot photo"; }
    .top { grid-area: top; }
    .crowd { grid-area: crowd; margin: 3vmin 0 4.4vmin; }
    .photo { grid-area: photo; margin: 0; }
    .foot { grid-area: foot; margin: 0; flex-direction: column; align-items: flex-start; gap: 2.4vmin; }
    .fig { flex-direction: column; align-items: flex-start; gap: 1.6vmin; margin-top: 3vmin; }
    .big { font-size: 19vmin; }
    .of { font-size: 7vmin; }
    .of br { display: none; }
    .crowd span { width: 5vmin; height: 5vmin; font-size: 1.6vmin; }
    .crowd p { margin-left: 2.4vmin; font-size: 1.7vmin; white-space: nowrap; }
    .crowd p b { font-size: 2.3vmin; }
    .crowd span:nth-child(n+5) { display: none; }
    .kick span:last-child { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { padding: 6vmin 7vmin; column-gap: 7vmin; grid-template-columns: 1fr 44%; }
    .kick span:last-child { display: inline; }
    .big { font-size: 28vmin; }
    .of { font-size: 8.4vmin; }
    .crowd span { width: 5.8vmin; height: 5.8vmin; font-size: 1.8vmin; }
    .crowd span:nth-child(n+5) { display: flex; }
    .crowd p { margin-left: 3vmin; font-size: 1.9vmin; }
    .crowd p b { font-size: 2.6vmin; }
    .foot { flex-direction: row; align-items: center; }
  }
  /* ───────────── motion (6 s loop · t=0 = static design) ───────────── */
  /* the 10k jumps and lands with a squash, confetti floats and spins, the avatar stack does a wave, the code taps in */
  .big { transform-origin: 30% 100%; animation: jump 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes jump {
    0%, 6% { transform: none; text-shadow: .8vmin .8vmin 0 #0F1B8C; }
    10% { transform: scale(1.04, .94); text-shadow: .8vmin .8vmin 0 #0F1B8C; }
    17% { transform: translate(-.8vmin, -.8vmin) scale(.98, 1.03); text-shadow: 1.8vmin 1.8vmin 0 #0F1B8C; }
    24% { transform: scale(1.06, .92); text-shadow: .6vmin .6vmin 0 #0F1B8C; }
    29% { transform: scale(.99, 1.02); text-shadow: .9vmin .9vmin 0 #0F1B8C; }
    33%, 100% { transform: none; text-shadow: .8vmin .8vmin 0 #0F1B8C; }
  }
  .big .one { transform-origin: 50% 100%; animation: one 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes one { 0%, 24%, 40%, 100% { transform: rotate(0); } 30% { transform: rotate(-6deg); } 35% { transform: rotate(2deg); } }
  .of { transform-origin: 0 100%; animation: of 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes of { 0%, 24%, 38%, 100% { transform: none; } 29% { transform: rotate(-4deg) scale(1.08); } }

  .conf i { animation: fl 3s cubic-bezier(.45,0,.55,1) infinite; }
  .conf .c1 { --r: 28deg; animation-duration: 3s; }
  .conf .c2 { --r: 0deg; animation-duration: 2s; animation-delay: -.7s; }
  .conf .c3 { --r: -24deg; animation-duration: 3s; animation-delay: -1.4s; }
  .conf .c4 { --r: 0deg; animation-duration: 6s; animation-delay: -2s; }
  .conf .c5 { --r: -40deg; animation-duration: 2s; animation-delay: -1.2s; }
  @keyframes fl {
    0%, 100% { transform: translate(0, 0) rotate(var(--r)); }
    25% { transform: translate(.6vmin, -1.2vmin) rotate(calc(var(--r) + 40deg)); }
    50% { transform: translate(0, -.4vmin) rotate(calc(var(--r) + 90deg)); }
    75% { transform: translate(-.6vmin, -1vmin) rotate(calc(var(--r) + 40deg)); }
  }

  .crowd span { animation: wave 6s cubic-bezier(.3,0,.3,1) infinite; }
  .crowd span:nth-child(1) { animation-delay: -0.00s; }
  .crowd span:nth-child(2) { animation-delay: -5.88s; }
  .crowd span:nth-child(3) { animation-delay: -5.76s; }
  .crowd span:nth-child(4) { animation-delay: -5.64s; }
  .crowd span:nth-child(5) { animation-delay: -5.52s; }
  .crowd span:nth-child(6) { animation-delay: -5.40s; }
  @keyframes wave { 0%, 44%, 58%, 100% { transform: translateY(0); } 49% { transform: translateY(-1.4vmin); } 54% { transform: translateY(.2vmin); } }
  .crowd p b { transform-origin: 0 50%; animation: cnt 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes cnt { 0%, 58%, 70%, 100% { transform: scale(1); color: #FFF5EC; } 63% { transform: scale(1.08); color: #FFC4DA; } }

  .photo { overflow: hidden; }
  .photo img { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  .code { animation: code 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes code { 0%, 78%, 92%, 100% { transform: scale(1) rotate(0); background: rgba(255,196,218,0); } 83% { transform: scale(1.08) rotate(-2deg); background: rgba(255,196,218,.16); } 88% { transform: scale(.99); } }
</style>
</head>
<body>
<div class="banner">
  <div class="top">
    <div class="kick"><span>Solenne community</span><span>Est. 2022</span></div>
    <div class="fig"><div class="big"><span class="one">1</span>0k</div><div class="of">of <br>you.</div>
      <div class="conf"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><i class="c5"></i></div></div>
  </div>
  <div class="crowd"><span>AM</span><span>JK</span><span>LR</span><span>TS</span><span>OB</span><span>NE</span><p><b>+9,994 members</b>and every one of you counted</p></div>
  <div class="photo"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
  <div class="foot">
    <div class="thanks"><b>Thank you — 30% off, on us.</b>Everything, for 48 hours only.</div>
    <div class="code">Use code<b>10KYOU</b></div>
  </div>
</div>
</body>
</html>
