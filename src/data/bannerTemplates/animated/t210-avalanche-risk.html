<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;800;900&family=Chivo+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Avalanche Risk — an official avalanche bulletin repurposed as a "sell-out risk" warning: black header with hazard
     triangle, a level-4 danger pictogram, the five-step European danger scale with a pointer, and field advice.
     tall → photo above; square/wide → photo left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F4F3EE; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #111111; font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; background: #F4F3EE; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 84vmin); object-fit: cover; object-position: 50% 20%; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 84vmin; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 2vmin; padding: 1.8vmin 6vmin; background: #111; color: #F4F3EE; font-family: "Chivo Mono", Menlo, monospace; font-size: 1.8vmin; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .head svg { flex: none; width: 3.4vmin; height: 3vmin; }
  .head span:last-child { margin-left: auto; color: #B9B8B0; }
  .body { flex: 1; min-height: 0; padding: 4.6vmin 6vmin 5vmin; display: flex; flex-direction: column; justify-content: space-between; }
  .lvl { display: flex; align-items: center; gap: 4vmin; }
  .pict { flex: none; width: 25vmin; height: 25vmin; }
  .lvl small { display: block; font-family: "Chivo Mono", Menlo, monospace; font-size: 1.9vmin; letter-spacing: .14em; text-transform: uppercase; color: #55544E; }
  .lvl h1 { margin: .4vmin 0 0; font-weight: 900; font-size: 17vmin; line-height: .84; letter-spacing: -.045em; }
  .lvl p { margin: 1.4vmin 0 0; font-weight: 800; font-size: 3.4vmin; letter-spacing: -.01em; }
  .lvl p b { color: #D8261E; }
  .scale { position: relative; margin-top: 4vmin; }
  .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5vmin; }
  .bar i { display: flex; align-items: center; justify-content: center; height: 6.4vmin; font-style: normal; font-weight: 900; font-size: 2.8vmin; }
  .s1 { background: #CCFF66; } .s2 { background: #FFFF00; } .s3 { background: #FF9900; } .s4 { background: #D8261E; color: #fff; outline: .5vmin solid #111; outline-offset: .3vmin; }
  .s5 { background: conic-gradient(#D8261E 25%, #111 0 50%, #D8261E 0 75%, #111 0) 0 0 / 2.7vmin 2.7vmin; color: #fff; }
  .s5 span { background: #111; padding: 0 .8vmin; }
  .names { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5vmin; margin-top: 1.4vmin; font-family: "Chivo Mono", Menlo, monospace; font-size: 1.7vmin; letter-spacing: 0; color: #55544E; }
  .names span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .names .on { color: #111; font-weight: 600; }
  .ptr { position: absolute; left: 70%; top: -3.4vmin; width: 0; height: 0; margin-left: -1.6vmin; border-left: 1.6vmin solid transparent; border-right: 1.6vmin solid transparent; border-top: 2vmin solid #111; }
  .adv { margin-top: 3vmin; padding-left: 2.4vmin; border-left: .6vmin solid #D8261E; font-family: "Chivo Mono", Menlo, monospace; font-size: 2.4vmin; line-height: 1.45; }
  .cta { margin-top: 3vmin; display: flex; align-items: stretch; font-weight: 800; font-size: 2.3vmin; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .cta .go { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 1.8vmin 2.6vmin; background: #111; color: #F4F3EE; }
  .cta .code { display: flex; align-items: center; padding: 0 2.4vmin; background: #D8261E; color: #fff; font-family: "Chivo Mono", Menlo, monospace; font-weight: 600; font-size: 2vmin; letter-spacing: .1em; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 78vmin); }
    .sheet { height: 78vmin; }
    .body { padding: 3.4vmin 6vmin 4.4vmin; }
    .pict { width: 21vmin; height: 21vmin; }
    .lvl h1 { font-size: 15vmin; }
    .scale { margin-top: 5vmin; }
    .adv { margin-top: 3.4vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 66vmin); }
    .sheet { height: 66vmin; }
    .head { padding: 1.4vmin 6vmin; }
    .body { padding: 3vmin 6vmin 3.6vmin; }
    .pict { width: 16vmin; height: 16vmin; }
    .lvl h1 { font-size: 11.6vmin; }
    .lvl p { font-size: 3vmin; margin-top: 1vmin; }
    .scale { margin-top: 4.6vmin; }
    .bar i { height: 4.4vmin; font-size: 2.4vmin; }
    .adv { display: none; }
    .cta .go { padding: 1.4vmin 2.4vmin; }
  }
  /* square / wide → photo left, bulletin right */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 46%; height: 100%; object-position: 50% 25%; }
    .sheet { left: 46%; top: 0; height: auto; }
    .head { padding: 2vmin 4.4vmin; font-size: 1.7vmin; }
    .head span:last-child { display: none; }
    .body { padding: 4.4vmin 4.4vmin 4.4vmin; }
    .lvl { flex-direction: column; align-items: flex-start; gap: 2.6vmin; }
    .pict { width: 17vmin; height: 17vmin; }
    .lvl h1 { font-size: 13vmin; }
    .lvl p { font-size: 2.8vmin; }
    .scale { margin-top: 5.6vmin; }
    .bar i { height: 4.4vmin; font-size: 2.3vmin; }
    .names span { display: none; }
    .names .on { display: block; grid-column: 4; justify-self: center; overflow: visible; }
    .adv { display: block; font-size: 1.9vmin; padding-left: 1.8vmin; }
    .cta { flex-direction: column; font-size: 2vmin; }
    .cta .code { justify-content: center; padding: 1.1vmin 2vmin; font-size: 1.8vmin; }
    .cta .go { padding: 1.4vmin 2vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; }
    .sheet { left: 44%; }
    .head { padding: 2vmin 6vmin; font-size: 1.8vmin; }
    .head span:last-child { display: inline; }
    .body { padding: 5vmin 6vmin 5.4vmin; }
    .lvl { flex-direction: row; align-items: center; gap: 4vmin; }
    .pict { width: 21vmin; height: 21vmin; }
    .lvl h1 { font-size: 14.4vmin; }
    .lvl p { font-size: 3.2vmin; }
    .scale { margin-top: 6vmin; }
    .bar i { height: 5vmin; font-size: 2.6vmin; }
    .names span { display: block; }
    .names .on { grid-column: auto; justify-self: stretch; overflow: hidden; }
    .adv { display: block; margin-top: 4vmin; font-size: 2vmin; }
    .cta { flex-direction: row; font-size: 2.2vmin; }
    .cta .code { padding: 0 2.4vmin; font-size: 1.9vmin; }
    .cta .go { padding: 1.7vmin 2.6vmin; }
  }

  /* ───────── motion (6s loop, t=0 = the static design) ─────────
     constant: the hazard triangle in the header flashes like a warning beacon (1s); snow debris in the pictogram slides
     beats: 1.8s the pointer creeps toward level 5 and falls back · 2.4s level 5 strobes · 2.7s "High." rumbles ·
            4.2s "40% off" highlight wipes across · 5s the CTA arrow nudges */
  .head svg { animation: beacon 1s steps(1, end) infinite; }
  @keyframes beacon { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .3; } }
  .pict g { animation: slide 3s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes slide { 0%, 100% { transform: translate(0, 0); opacity: 1; } 45% { transform: translate(5px, 6px); opacity: .25; } 46% { transform: translate(-3px, -4px); opacity: 0; } 70% { opacity: 1; } }
  .ptr { animation: creep 6s linear infinite; }
  @keyframes creep {
    0%, 26% { transform: none; animation-timing-function: cubic-bezier(.5,0,.3,1); }
    38% { transform: translateX(5vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    41% { transform: translateX(4.2vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    44% { transform: translateX(5.4vmin); animation-timing-function: cubic-bezier(.6,0,.3,1.3); }
    54%, 100% { transform: none; }
  }
  .s5 { animation: strobe 6s steps(1, end) infinite; }
  @keyframes strobe { 0%, 39% { filter: none; } 40%, 42% { filter: brightness(1.8) saturate(1.4); } 43%, 45% { filter: none; } 46%, 48% { filter: brightness(1.8) saturate(1.4); } 49%, 100% { filter: none; } }
  .lvl h1 { animation: rumble 6s linear infinite; }
  @keyframes rumble {
    0%, 44% { transform: none; }
    45% { transform: translate(-.4vmin, .1vmin); } 46% { transform: translate(.35vmin, -.1vmin); }
    47% { transform: translate(-.3vmin, 0); } 48% { transform: translate(.25vmin, .1vmin); }
    49% { transform: translate(-.15vmin, 0); } 50% { transform: translate(.1vmin, 0); }
    51%, 100% { transform: none; }
  }
  .lvl p b { background: linear-gradient(90deg, rgba(255,210,0,0), rgba(255,210,0,.55) 50%, rgba(255,210,0,0)) -150% 60% / 60% 70% no-repeat;
    animation: marker 6s linear infinite; }
  @keyframes marker {
    0%, 66% { background-position: -150% 60%; animation-timing-function: cubic-bezier(.5,0,.4,1); }
    82%, 100% { background-position: 250% 60%; }
  }
  .cta .go > span { display: inline-block; animation: nudge 6s linear infinite; }
  @keyframes nudge {
    0%, 80% { transform: none; animation-timing-function: cubic-bezier(.3,0,.3,1); }
    83% { transform: translateX(1vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    86% { transform: none; animation-timing-function: cubic-bezier(.3,0,.3,1); }
    89% { transform: translateX(1vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    93%, 100% { transform: none; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="sheet">
    <div class="head">
      <svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#FFD200" stroke="#FFD200" stroke-width="2" stroke-linejoin="round"/><path d="M17 10 V19" stroke="#111" stroke-width="3" stroke-linecap="round"/><circle cx="17" cy="24" r="1.8" fill="#111"/></svg>
      <span>Bulletin · Studio Oro</span><span>Issued Fri 07:00</span>
    </div>
    <div class="body">
      <div class="lvl">
        <svg class="pict" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" fill="#D8261E"/>
          <path d="M8 84 L38 34 L52 52 L64 38 L92 84 Z" fill="#111"/>
          <path d="M38 34 L46 47 L40 45 L34 52 L30 47 Z M64 38 L70 48 L64 46 L60 50 Z" fill="#F4F3EE"/>
          <g fill="#F4F3EE"><circle cx="70" cy="60" r="3"/><circle cx="78" cy="68" r="2.4"/><circle cx="84" cy="58" r="2"/><circle cx="74" cy="72" r="1.8"/></g>
          <text x="14" y="30" font-family="Public Sans, Arial, sans-serif" font-weight="900" font-size="28" fill="#F4F3EE">4</text>
        </svg>
        <div>
          <small>Sell-out risk · level 4</small>
          <h1>High.</h1>
          <p><b>40% off</b> the winter edit</p>
        </div>
      </div>
      <div class="scale">
        <div class="ptr"></div>
        <div class="bar"><i class="s1">1</i><i class="s2">2</i><i class="s3">3</i><i class="s4">4</i><i class="s5"><span>5</span></i></div>
        <div class="names"><span>Low</span><span>Moderate</span><span>Considerable</span><span class="on">High</span><span>Very high</span></div>
      </div>
      <div class="adv">Sizes are sliding fast on all slopes. Travel light, shop early.</div>
      <div class="cta"><span class="code">RISK40</span><span class="go">Shop before it goes <span>→</span></span></div>
    </div>
  </div>
</div>
</body>
</html>
