<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  /* Heritage Crest — a centenary house seal (drawn in SVG) on bottle green.
     tall → photo above the green; square/wide → photo left, green right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #1C3327; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #1C3327; color: #EFE7D6; font-family: "EB Garamond", Garamond, "Times New Roman", serif; }
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 60%; object-fit: cover; object-position: 50% 18%; }
  .rule2 { position: absolute; left: 0; right: 0; top: 60%; height: .5vmin; border-top: .5vmin solid #0F2219; border-bottom: 1px solid rgba(239,231,214,.35); }
  .panel { position: absolute; left: 5vmin; right: 5vmin; top: calc(60% + 3vmin); bottom: 3vmin; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .crest { width: min(30vmin, 16vh); height: min(30vmin, 16vh); flex: none; }
  .since { margin-top: 2.2vmin; display: flex; align-items: center; gap: 2vmin; font-family: "Cinzel", "Trajan Pro", serif; font-weight: 500; font-size: 2vmin; letter-spacing: .5em; margin-right: -.5em; }
  .since i { width: 7vmin; height: 1px; background: rgba(239,231,214,.6); }
  .h { margin-top: 1.6vmin; font-style: italic; font-size: min(8.6vmin, 4.7vh); line-height: 1; }
  .s { margin-top: 1.8vmin; font-family: "Cinzel", serif; font-size: 2.1vmin; letter-spacing: .32em; margin-right: -.32em; color: #CFC4AC; }
  .cta { margin-top: 2.8vmin; padding: 1.4vmin 3.6vmin; border: 1px solid rgba(239,231,214,.7); font-family: "Cinzel", serif; font-weight: 600; font-size: 1.9vmin; letter-spacing: .34em; }
  .crest text { font-family: "Cinzel", "Trajan Pro", serif; fill: #EFE7D6; }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: 58%; }
    .rule2 { top: 58%; }
    .panel { top: calc(58% + 2.4vmin); bottom: 2.4vmin; }
    .crest { width: 20vmin; height: 20vmin; }
    .h { font-size: 6.6vmin; }
    .cta { margin-top: 2.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 52%; height: 100%; object-position: 50% 25%; }
    .rule2 { top: 0; bottom: 0; left: 52%; right: auto; width: .5vmin; height: auto; border-top: 0; border-left: .5vmin solid #0F2219; border-bottom: 0; border-right: 1px solid rgba(239,231,214,.35); }
    .panel { left: calc(52% + 4vmin); right: 4vmin; top: 5vmin; bottom: 5vmin; }
    .crest { width: 26vmin; height: 26vmin; }
    .since { font-size: 1.8vmin; letter-spacing: .4em; margin-right: -.4em; }
    .since i { width: 4vmin; }
    .h { font-size: 6vmin; }
    .s { font-size: 1.7vmin; letter-spacing: .2em; margin-right: -.2em; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 54%; }
    .rule2 { left: 54%; }
    .panel { left: calc(54% + 5vmin); right: 5vmin; }
    .crest { width: 30vmin; height: 30vmin; }
    .since { font-size: 2vmin; letter-spacing: .5em; margin-right: -.5em; }
    .since i { width: 7vmin; }
    .h { font-size: 7.4vmin; }
    .s { font-size: 1.9vmin; letter-spacing: .3em; margin-right: -.3em; }
  }

  /* ───────── motion: 8s loop, t=0 = the static design ───────── */
  .photo { transform-origin: 50% 50%; animation: push 8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push {
    0%, 100% { transform: scale(1); clip-path: inset(0); }
    50% { transform: scale(1.03); clip-path: inset(1.456%); }
  }
  /* the seal: the ring legend turns once per loop, the dotted track counter-turns */
  .crest > text:first-of-type { transform-box: view-box; transform-origin: 50% 50%; animation: legend 8s linear infinite; }
  @keyframes legend { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .crest g:first-of-type circle:last-child { transform-box: view-box; transform-origin: 50% 50%; animation: track 8s linear infinite; }
  @keyframes track { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  /* a wax-seal press on the beat */
  .crest { animation: press 8s linear infinite; }
  @keyframes press {
    0%, 40% { transform: scale(1); filter: brightness(1); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
    44% { transform: scale(.94); filter: brightness(1.25); animation-timing-function: cubic-bezier(.2,.9,.3,1.3); }
    50% { transform: scale(1.02); filter: brightness(1.1); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    56%, 100% { transform: scale(1); filter: brightness(1); }
  }
  /* Since 1924: hairlines reach out from the date */
  .since i { animation: reach 8s linear infinite; }
  .since i:first-child { transform-origin: 100% 50%; }
  .since i:last-child { transform-origin: 0 50%; }
  @keyframes reach {
    0%, 44% { transform: scaleX(1); animation-timing-function: cubic-bezier(.6,0,.4,1); }
    48% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.7,.2,1); }
    60%, 100% { transform: scaleX(1); }
  }
  /* the italic headline is set again */
  .h { animation: seth 8s linear infinite; }
  @keyframes seth {
    0%, 62% { clip-path: inset(-25% -10% -25% -10%); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    69% { clip-path: inset(-25% -10% -25% 110%); animation-timing-function: steps(1, end); }
    69.2% { clip-path: inset(-25% 110% -25% -10%); animation-timing-function: cubic-bezier(.22,.7,.2,1); }
    84%, 100% { clip-path: inset(-25% -10% -25% -10%); }
  }
  /* a quiet sheen along the Discover button */
  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 40%;
    background: linear-gradient(90deg, rgba(239,231,214,0) 0%, rgba(239,231,214,.1) 30%, rgba(239,231,214,.28) 50%, rgba(239,231,214,.1) 70%, rgba(239,231,214,0) 100%);
    transform: translateX(-160%) skewX(-18deg); animation: glow 8s linear infinite; }
  @keyframes glow {
    0%, 86% { transform: translateX(-160%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    97%, 100% { transform: translateX(300%) skewX(-18deg); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="rule2"></div>
  <div class="panel">
    <svg class="crest" viewBox="0 0 200 200" aria-hidden="true">
      <defs><path id="ring" d="M 24,100 a 76,76 0 1,1 152,0 a 76,76 0 1,1 -152,0"/></defs>
      <g fill="none" stroke="#EFE7D6">
        <circle cx="100" cy="100" r="97" stroke-width="1.6"/>
        <circle cx="100" cy="100" r="92.5" stroke-width=".6"/>
        <circle cx="100" cy="100" r="61" stroke-width="1.2"/>
        <circle cx="100" cy="100" r="57.5" stroke-width=".5" stroke-dasharray="1.2 2.4"/>
      </g>
      <text font-size="11.5" font-weight="500" letter-spacing="1"><textPath href="#ring" textLength="470" lengthAdjust="spacing">ATELIER NORD · PARIS · MAISON FONDÉE EN 1924 ·</textPath></text>
      <text x="100" y="106" text-anchor="middle" font-size="50" font-weight="500">N</text>
      <text x="100" y="125" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="3">1924</text>
      <g fill="#EFE7D6"><path d="M100 63 l2.2 3.2 l-2.2 3.2 l-2.2 -3.2z"/><circle cx="72" cy="94" r="1.4"/><circle cx="128" cy="94" r="1.4"/></g>
      <g fill="#EFE7D6" opacity=".92"><ellipse cx="149.2" cy="108.7" rx="2.2" ry="5.2" transform="rotate(135 149.2 108.7)"/><ellipse cx="146.7" cy="117.9" rx="2.2" ry="5.2" transform="rotate(146 146.7 117.9)"/><ellipse cx="142.4" cy="126.5" rx="2.2" ry="5.2" transform="rotate(157 142.4 126.5)"/><ellipse cx="136.6" cy="134.1" rx="2.2" ry="5.2" transform="rotate(168 136.6 134.1)"/><ellipse cx="129.4" cy="140.5" rx="2.2" ry="5.2" transform="rotate(179 129.4 140.5)"/><ellipse cx="121.1" cy="145.3" rx="2.2" ry="5.2" transform="rotate(190 121.1 145.3)"/><ellipse cx="112.1" cy="148.5" rx="2.2" ry="5.2" transform="rotate(201 112.1 148.5)"/><ellipse cx="50.8" cy="108.7" rx="2.2" ry="5.2" transform="rotate(-135 50.8 108.7)"/><ellipse cx="53.3" cy="117.9" rx="2.2" ry="5.2" transform="rotate(-146 53.3 117.9)"/><ellipse cx="57.6" cy="126.5" rx="2.2" ry="5.2" transform="rotate(-157 57.6 126.5)"/><ellipse cx="63.4" cy="134.1" rx="2.2" ry="5.2" transform="rotate(-168 63.4 134.1)"/><ellipse cx="70.6" cy="140.5" rx="2.2" ry="5.2" transform="rotate(-179 70.6 140.5)"/><ellipse cx="78.9" cy="145.3" rx="2.2" ry="5.2" transform="rotate(-190 78.9 145.3)"/><ellipse cx="87.9" cy="148.5" rx="2.2" ry="5.2" transform="rotate(-201 87.9 148.5)"/></g>
    </svg>
    <div class="since"><i></i>Since 1924<i></i></div>
    <div class="h">A Century of <span style="white-space:nowrap">Savoir&#8209;Faire</span></div>
    <div class="s">The Heritage Collection</div>
    <div class="cta">Discover</div>
  </div>
</div>
</body>
</html>
