<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
  /* Flip Book — the children's mix-and-match flip book, grown up: a spiral binding along the top and the
     look cut into three flippable strips (top / middle / base), each nudged a little out of line, with
     stacked page edges and coloured index tabs on the right. tall / 3:4 → book above, copy below;
     square / wide → book on the left, copy on the right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F2ECDF; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F2ECDF; color: #1A1A1A; font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; padding: 5vmin; box-sizing: border-box; }
  .top { flex: none; display: flex; justify-content: space-between; font-size: 1.8vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .top span:last-child { color: #E4492F; }

  .book { flex: 1 1 auto; min-height: 0; position: relative; margin: 3vmin 12vmin 0 0; display: flex; flex-direction: column; }
  .coil { flex: none; position: relative; height: 5.4vmin; margin: 0 1vmin; z-index: 2;
    background: repeating-linear-gradient(90deg, transparent 0 1vmin, #1A1A1A 1vmin 1.7vmin, #6B6B6B 1.7vmin 1.9vmin, transparent 1.9vmin 3.4vmin); border-radius: 0; }
  .coil::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.4vmin; height: 1.4vmin; background: repeating-linear-gradient(90deg, transparent 0 .9vmin, #F2ECDF .9vmin 2vmin, transparent 2vmin 3.4vmin); }
  .pages { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 1.2vmin; margin-top: -.8vmin; }
  .strip { position: relative; flex: 1 1 0; min-height: 0; }
  .pg { position: absolute; inset: 0; overflow: hidden; background: #DDD4C3; }
  .pg img { position: absolute; left: 0; width: 100%; height: calc(300% + 2.4vmin); object-fit: cover; object-position: 50% 22%; display: block; }
  .s1 .pg img { top: 0; }
  .s2 .pg img { top: calc(-100% - 1.2vmin); }
  .s3 .pg img { top: calc(-200% - 2.4vmin); }
  .s2 { transform: translateX(-2.4vmin); }
  .s3 { transform: translateX(1.6vmin); }
  /* stacked page edges */
  .strip::before { content: ""; position: absolute; top: .8vmin; bottom: .8vmin; right: -2.2vmin; width: 2.2vmin;
    background: repeating-linear-gradient(90deg, #FBF8F1 0 .38vmin, #C9BFAC .38vmin .5vmin); }
  .tab { position: absolute; right: -8.6vmin; top: 50%; transform: translateY(-50%); width: 6.4vmin; padding: 2vmin 0; display: flex; flex-direction: column; align-items: center; gap: 1vmin;
    color: #fff; font-weight: 800; }
  .tab b { font-size: 3.6vmin; line-height: 1; font-variation-settings: "wdth" 75; }
  .tab span { writing-mode: vertical-rl; font-size: 1.7vmin; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  .s1 .tab { background: #E4492F; }
  .s2 .tab { background: #2140A8; }
  .s3 .tab { background: #1A1A1A; }

  .copy { flex: none; margin-top: 4vmin; display: flex; flex-direction: column; }
  h1 { margin: 0; font-weight: 800; font-variation-settings: "wdth" 80, "opsz" 96; font-size: 11.5vmin; line-height: .86; letter-spacing: -.035em; }
  h1 span { color: #E4492F; }
  h1 em { font-style: normal; color: #2140A8; }
  .sub { margin-top: 2vmin; font-size: 2.1vmin; line-height: 1.4; font-weight: 500; }
  .sub b { font-weight: 800; }
  .foot { grid-column: 1 / -1; margin-top: 3vmin; display: flex; justify-content: space-between; align-items: center; gap: 3vmin; border-top: .35vmin solid #1A1A1A; padding-top: 2.2vmin; }
  .foot p { margin: 0; font-size: 2vmin; font-weight: 600; }
  .foot p b { color: #E4492F; font-weight: 800; }
  .cta { flex: none; background: #1A1A1A; color: #F2ECDF; padding: 1.8vmin 3vmin; font-size: 2.1vmin; font-weight: 800; letter-spacing: .06em; white-space: nowrap; }

  @media (min-aspect-ratio: 7/10) {
    .banner { padding: 4.4vmin 5vmin; }
    .book { margin-top: 2.4vmin; }
    .copy { margin-top: 3vmin; }
    h1 { font-size: 9.4vmin; }
    .foot { margin-top: 2.4vmin; padding-top: 1.8vmin; }
  }
  /* square / wide — book left, copy right */
  @media (min-aspect-ratio: 9/10) {
    .banner { display: grid; grid-template-columns: 54% 1fr; grid-template-rows: auto 1fr; column-gap: 3vmin; }
    .top { grid-column: 1 / -1; }
    .book { grid-column: 1; grid-row: 2; margin: 3vmin 11vmin 0 2.4vmin; }
    .copy { grid-column: 2; grid-row: 2; margin: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; }
    h1 { font-size: 8vmin; }
    .sub { margin-top: 3vmin; font-size: 1.9vmin; max-width: none; }
    .foot { align-self: stretch; flex-direction: column; align-items: flex-start; gap: 2vmin; margin-top: 3.4vmin; }
    .foot p { font-size: 1.8vmin; }
    .cta { font-size: 1.9vmin; padding: 1.6vmin 2.6vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .banner { grid-template-columns: 46% 1fr; column-gap: 5vmin; padding: 6vmin; }
    .book { margin-right: 11vmin; }
    h1 { font-size: 11vmin; }
    .sub { font-size: 2.1vmin; max-width: 44vmin; }
    .foot { flex-direction: row; align-items: center; }
  }

  /* ───────── motion (6 s loop · t=0 = static design) ─────────
     flipping the book: 0.6 s the three strips flip over on the spiral one after another (top-hinged page turn,
     0.35 s apart), each index tab bumps as its page lands and the matching word of the headline pops ·
     3.0 s the strips slide into line — a perfect match — hold, then 4.4 s drift back to their mixed offsets */
  .pg { transform-origin: 50% 0; animation: flip 6s cubic-bezier(.5,0,.4,1) infinite; }
  .s2 .pg { animation-delay: -5.65s; }
  .s3 .pg { animation-delay: -5.3s; }
  /* flat page turn (no perspective: an edge-on page would swell past the frame) — the page folds up into the
     spiral, the next one drops down with a small settle */
  @keyframes flip {
    0%, 10% { transform: scaleY(1); filter: brightness(1); }
    14% { transform: scaleY(.03); filter: brightness(1.3); }
    14.01% { transform: scaleY(.03); filter: brightness(.75); }
    19% { transform: scaleY(1.025); filter: brightness(1); }
    21.5%, 100% { transform: scaleY(1); filter: brightness(1); }
  }
  .tab { animation: tabb 6s cubic-bezier(.3,0,.3,1) infinite; }
  .s2 .tab { animation-delay: -5.65s; }
  .s3 .tab { animation-delay: -5.3s; }
  @keyframes tabb { 0%, 18%, 26%, 100% { transform: translateY(-50%) translateX(0); } 21% { transform: translateY(-50%) translateX(1vmin); } }

  .s2 { animation: al2 6s cubic-bezier(.65,0,.35,1) infinite; }
  .s3 { animation: al3 6s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes al2 { 0%, 50%, 100% { transform: translateX(-2.4vmin); } 60%, 73% { transform: translateX(0); } 83% { transform: translateX(-2.4vmin); } }
  @keyframes al3 { 0%, 51%, 100% { transform: translateX(1.6vmin); } 61%, 74% { transform: translateX(0); } 84% { transform: translateX(1.6vmin); } }

  h1 span, h1 em { display: inline-block; transform-origin: 0 80%; animation: word 6s cubic-bezier(.3,0,.3,1) infinite; }
  h1 em { animation-delay: -5.3s; }
  @keyframes word { 0%, 17%, 27%, 100% { transform: scale(1); } 21% { transform: scale(1.06) rotate(-1.5deg); } }
</style>
</head>
<body>
<div class="banner">
  <div class="top"><span>Mix &amp; match · flip book</span><span>Vol. 02</span></div>
  <div class="book">
    <div class="coil"></div>
    <div class="pages">
      <div class="strip s1"><div class="pg"><img src="{{PRODUCT_IMAGE}}" alt=""></div><div class="tab"><b>A</b><span>Top</span></div></div>
      <div class="strip s2"><div class="pg"><img src="{{PRODUCT_IMAGE}}" alt=""></div><div class="tab"><b>B</b><span>Mid</span></div></div>
      <div class="strip s3"><div class="pg"><img src="{{PRODUCT_IMAGE}}" alt=""></div><div class="tab"><b>C</b><span>Base</span></div></div>
    </div>
  </div>
  <div class="copy">
    <h1><span>Flip it.</span><br>Mix it. <em>Wear it.</em></h1>
    <div class="sub">Swap any third of the look. <b>64 ways</b> to wear one edit.</div>
    <div class="foot"><p>Mix 2+ pieces · <b>−20%</b> · code FLIP20</p><div class="cta">Start flipping →</div></div>
  </div>
</div>
</body>
</html>
