<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;700;800&family=Grenze+Gotisch:wght@600&display=swap" rel="stylesheet">
<style>
  /* Hallmark — the offer is struck into brushed silver as a row of assay marks (maker, fineness,
     office, date letter), each explained in a key, like a hallmark reference book.
     tall → photo above the silver plate; 3:4 / square → photo left, marks in a 2×2 key; wide → photo left, marks in a row */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #D3D6DA; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #22262B; font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; background: #D3D6DA; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 72vmin); object-fit: cover; object-position: 50% 22%; }
  /* brushed silver plate with a bevelled top edge */
  .plate { position: absolute; left: 0; right: 0; bottom: 0; height: 72vmin; padding: 5vmin 6vmin 5vmin; box-sizing: border-box; display: flex; flex-direction: column;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 .12vmin, rgba(0,0,0,0) .12vmin .4vmin, rgba(60,66,74,.06) .4vmin .5vmin, rgba(0,0,0,0) .5vmin .9vmin),
      linear-gradient(100deg, rgba(255,255,255,0) 20%, rgba(255,255,255,.55) 42%, rgba(255,255,255,0) 64%),
      linear-gradient(180deg, #E6E8EB 0%, #CDD1D6 55%, #BFC4CA 100%);
    box-shadow: inset 0 .5vmin 0 rgba(255,255,255,.85), inset 0 .9vmin 0 rgba(120,126,134,.25), 0 -.8vmin 1.6vmin rgba(0,0,0,.25); }
  .top { display: flex; justify-content: space-between; gap: 3vmin; padding-bottom: 1.6vmin; border-bottom: 1px solid rgba(34,38,43,.35); font-size: 1.7vmin; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: #4A5058; }
  .top span:last-child { white-space: nowrap; }
  h1 { margin: 3.4vmin 0 0; font-weight: 800; font-size: 8.6vmin; line-height: .98; letter-spacing: -.035em; }
  h1 span { font-weight: 400; color: #5A616A; }
  .marks { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.2vmin; }
  .m svg { display: block; width: 100%; height: auto; }
  .m b { display: block; margin-top: 1.4vmin; padding-top: 1.1vmin; border-top: 1px solid rgba(34,38,43,.3); font-size: 1.6vmin; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #5A616A; }
  .m span { display: block; margin-top: .5vmin; font-size: 2vmin; font-weight: 500; white-space: nowrap; }
  .foot { margin-top: 4vmin; display: flex; justify-content: space-between; align-items: center; gap: 3vmin; }
  .cta { padding: 1.9vmin 3vmin; background: #22262B; color: #EEF0F2; font-size: 1.9vmin; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
  .until { font-size: 1.9vmin; color: #4A5058; text-align: right; white-space: nowrap; }
  .note { margin: 2.2vmin 0 0; max-width: 62vmin; font-size: 2.1vmin; line-height: 1.5; color: #3E444B; }
  .until b { color: #22262B; }
  svg text { font-family: "Cinzel", "Trajan Pro", Georgia, serif; font-weight: 700; }
  svg .gt { font-family: "Grenze Gotisch", "UnifrakturMaguntia", serif; font-weight: 600; }

  /* ── 3:4 / square — photo left, a 2×2 hallmark key right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { width: 50%; height: 100%; }
    .plate { left: 50%; top: 0; height: auto; padding: 6vmin 5vmin 5vmin; box-shadow: inset .5vmin 0 0 rgba(255,255,255,.85), inset .9vmin 0 0 rgba(120,126,134,.25), -.8vmin 0 1.6vmin rgba(0,0,0,.25); }
    .top { flex-direction: column; gap: .8vmin; font-size: 1.6vmin; letter-spacing: .2em; }
    h1 { font-size: 7vmin; margin-top: 3vmin; }
    .marks { grid-template-columns: 1fr 1fr; gap: 3vmin 3.4vmin; }
    .m span { font-size: 1.9vmin; }
    .note { display: none; }
    .foot { flex-direction: column; align-items: stretch; gap: 1.8vmin; }
    .cta { text-align: center; }
    .until { text-align: left; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 48%; }
    .plate { left: 48%; padding: 4.6vmin 4.6vmin 4.4vmin; }
    .top { flex-direction: row; font-size: 1.6vmin; letter-spacing: .16em; }
    .top span:first-child { display: none; }
    h1 { font-size: 5.8vmin; margin-top: 2.6vmin; }
    .marks { gap: 2.2vmin 4vmin; padding: 0 3vmin; }
    .m b { margin-top: .9vmin; padding-top: .8vmin; }
    .m span { font-size: 1.8vmin; }
    .foot { flex-direction: row; align-items: center; margin-top: 3vmin; }
    .until { text-align: right; font-size: 1.7vmin; }
  }
  /* ── wide — photo left, the marks in one struck row ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 42%; object-position: 55% 22%; }
    .plate { left: 42%; padding: 6vmin 6vmin 5.4vmin; }
    .top span:first-child { display: inline; }
    .top { font-size: 1.7vmin; letter-spacing: .24em; }
    h1 { font-size: 7.6vmin; margin-top: 3.6vmin; }
    .note { display: block; font-size: 2vmin; }
    .marks { grid-template-columns: repeat(4, 1fr); gap: 3vmin; padding: 0; }
    .m span { font-size: 1.9vmin; }
    .foot { margin-top: 4vmin; }
    .until { font-size: 1.9vmin; }
  }

  /* ───────── motion: 6s loop, t=0 = the static design ───────── */
  .photo { transform-origin: 50% 30%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
  /* the four marks are struck one after the other, left to right */
  .m svg { transform-origin: 50% 60%; animation: strike 6s linear infinite; }
  .m:nth-child(1) svg { animation-delay: -1.35s; }
  .m:nth-child(2) svg { animation-delay: -.9s; }
  .m:nth-child(3) svg { animation-delay: -.45s; }
  @keyframes strike {
    0%, 38% { transform: translateY(0) scale(1); filter: brightness(1); animation-timing-function: cubic-bezier(.4,0,.2,1); }
    42% { transform: translateY(0) scale(1.025); filter: brightness(1.05); animation-timing-function: cubic-bezier(.7,0,1,.6); }
    44% { transform: translateY(.2vmin) scale(.9); filter: brightness(1.45); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    50% { transform: translateY(0) scale(1.02); filter: brightness(1.1); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    56%, 100% { transform: translateY(0) scale(1); filter: brightness(1); }
  }
  /* after the last strike, a brushed-light sweep runs across the silver */
  .plate { overflow: hidden; }
  .plate::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.12) 30%, rgba(255,255,255,.42) 50%, rgba(255,255,255,.12) 70%, rgba(255,255,255,0) 100%);
    mix-blend-mode: soft-light; transform: translateX(-110%); animation: brush 6s linear infinite; }
  @keyframes brush {
    0%, 58% { transform: translateX(-110%); animation-timing-function: cubic-bezier(.45,0,.3,1); }
    80%, 100% { transform: translateX(260%); }
  }

  .cta { position: relative; overflow: hidden; }
  .cta::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 34%; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.07) 30%, rgba(255,255,255,.3) 50%, rgba(255,255,255,.07) 70%, rgba(255,255,255,0) 100%);
    transform: translateX(-160%) skewX(-18deg); animation: ctaSheen 6s linear infinite; }
  @keyframes ctaSheen {
    0%, 80% { transform: translateX(-160%) skewX(-18deg); animation-timing-function: cubic-bezier(.45,0,.25,1); }
    93%, 100% { transform: translateX(330%) skewX(-18deg); }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C828A"/><stop offset=".6" stop-color="#A2A8AF"/><stop offset="1" stop-color="#B7BCC2"/></linearGradient>
      <filter id="punch" x="-10%" y="-10%" width="120%" height="120%">
        <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
        <feGaussianBlur in="inv" stdDeviation="2.6"/><feOffset dx="2" dy="3.2" result="off"/>
        <feFlood flood-color="#1E2227" flood-opacity=".95"/><feComposite in2="off" operator="in"/><feComposite in2="SourceAlpha" operator="in" result="sh"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge>
      </filter>
      <filter id="raise" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation=".8" flood-color="#2B3036" flood-opacity=".55"/></filter>
    </defs>
  </svg>
  <div class="plate">
    <div class="top"><span>Assay Nº 26 · Sterling Sale</span><span>Atelier Nord</span></div>
    <h1>Marked down.<br><span>Still sterling.</span></h1>
    <p class="note">Every piece in the sale carries the house marks. Same standard, lower price.</p>
    <div class="marks">
      <div class="m">
        <svg viewBox="0 0 120 84" aria-hidden="true"><path filter="url(#punch)" fill="url(#rec)" d="M20 6 H100 L114 20 V64 L100 78 H20 L6 64 V20 Z"/><text filter="url(#raise)" x="60" y="58" text-anchor="middle" font-size="40" fill="#EDEFF1" letter-spacing="2">AN</text></svg>
        <b>Maker</b><span>Atelier Nord</span>
      </div>
      <div class="m">
        <svg viewBox="0 0 120 84" aria-hidden="true"><ellipse filter="url(#punch)" fill="url(#rec)" cx="60" cy="42" rx="55" ry="36"/><text filter="url(#raise)" x="60" y="54" text-anchor="middle" font-size="33" fill="#EDEFF1">30%</text></svg>
        <b>Fineness</b><span>30% off</span>
      </div>
      <div class="m">
        <svg viewBox="0 0 120 84" aria-hidden="true"><circle filter="url(#punch)" fill="url(#rec)" cx="60" cy="42" r="38"/><g filter="url(#raise)" fill="#EDEFF1"><path d="M38 56 L33 29 L47 40 L60 22 L73 40 L87 29 L82 56 Z"/><rect x="38" y="59" width="44" height="6"/><circle cx="33" cy="27" r="3"/><circle cx="60" cy="20" r="3"/><circle cx="87" cy="27" r="3"/></g></svg>
        <b>Office</b><span>Paris</span>
      </div>
      <div class="m">
        <svg viewBox="0 0 120 84" aria-hidden="true"><path filter="url(#punch)" fill="url(#rec)" d="M22 6 H98 V40 C98 60 82 73 60 80 C38 73 22 60 22 40 Z"/><text class="gt" filter="url(#raise)" x="60" y="56" text-anchor="middle" font-size="50" fill="#EDEFF1">k</text></svg>
        <b>Date</b><span>Winter ’26</span>
      </div>
    </div>
    <div class="foot">
      <div class="cta">Shop the sale →</div>
      <div class="until">Struck until <b>30 Nov</b></div>
    </div>
  </div>
</div>
</body>
</html>
