<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="4">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* Bleed Word — "new", lowercase, black weight, tracked so tight the letters touch, set far too big
     for its cobalt block so it bleeds off the edges: type as a cropped shape, still readable.
     TALL → photo + caption strip above, the word bleeding across the bottom block
     7/10+ → the letters stack into a n/e/w tower bleeding off the right-hand column */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #2340D8; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F2EEE4; color: #111; font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
  .left { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .ph { position: relative; flex: 1; min-height: 0; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
  .strip { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 2vmin; padding: 2.2vmin 4.4vmin; font-size: 1.9vmin; font-weight: 500; letter-spacing: .02em; }
  .strip b { font-weight: 900; }
  .strip .cta { font-weight: 700; padding-bottom: .4vmin; border-bottom: .35vmin solid #111; white-space: nowrap; }
  .strip .mid { color: #2340D8; font-weight: 700; }

  .blk { flex: none; position: relative; height: 36vmin; background: #2340D8; overflow: hidden; }
  .word { position: absolute; left: -2vmin; bottom: 9vmin; font-weight: 900; font-size: 52vmin; line-height: .56; letter-spacing: -.075em; color: #F2EEE4; white-space: nowrap; }
  .word span { display: inline-block; }

  /* SHORTER PORTRAIT — a n/e/w tower in a cobalt column on the right */
  @media (min-aspect-ratio: 7/10) {
    .banner { flex-direction: row; }
    .blk { height: 100%; width: 42%; }
    .word { left: auto; right: -6vmin; bottom: auto; top: 50%; transform: translateY(-50%); font-size: 60vmin; line-height: .5; letter-spacing: -.05em; text-align: right; }
    .word span { display: block; }
    .word span + span { margin-top: 3.6vmin; }
    .strip { padding: 2vmin 3.6vmin; white-space: nowrap; }
    .strip .mid { display: none; }
  }
  @media (min-aspect-ratio: 9/10) {
    .blk { width: 40%; }
    .word { font-size: 56vmin; right: -5vmin; }
    .word span + span { margin-top: 3vmin; }
    .strip .mid { display: none; }
  }
  @media (min-aspect-ratio: 6/5) {
    .blk { width: 38%; }
    .word { font-size: 58vmin; right: -3vmin; }
    .strip .mid { display: inline; }
    .strip { padding: 2.2vmin 4.4vmin; }
  }

  /* ───────── motion: 4s loop, t=0 = the static design ─────────
     the cropped word is the actor: n, e, w drop out of the cobalt block one after another and slam back
     (in the tower layout they slide out to the right) · the price pops · the CTA underline redraws, arrow nudges */
  .photo { transform-origin: 50% 30%; animation: breathe 4s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }

  .word span { animation: dropY 4s linear infinite; }
  .word span:nth-child(1) { animation-delay: -.24s; }
  .word span:nth-child(2) { animation-delay: -.12s; }
  @keyframes dropY {
    0%, 30% { transform: translateY(0); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    37%, 41% { transform: translateY(48vmin); animation-timing-function: cubic-bezier(.15,.8,.3,1); }
    48% { transform: translateY(-2.4vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    53% { transform: translateY(.6vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    57%, 100% { transform: translateY(0); }
  }
  @keyframes dropX {
    0%, 30% { transform: translateX(0); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    37%, 41% { transform: translateX(46vmin); animation-timing-function: cubic-bezier(.15,.8,.3,1); }
    48% { transform: translateX(-2.4vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    53% { transform: translateX(.6vmin); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    57%, 100% { transform: translateX(0); }
  }
  @media (min-aspect-ratio: 7/10) { .word span { animation-name: dropX; } }

  /* the cobalt block flashes a touch brighter at the slam */
  .blk { animation: slam 4s linear infinite; }
  @keyframes slam {
    0%, 46% { background-color: #2340D8; }
    48% { background-color: #3553F0; animation-timing-function: cubic-bezier(.2,0,.3,1); }
    60%, 100% { background-color: #2340D8; }
  }

  .strip .mid { display: inline-block; animation: pop 4s linear infinite; }
  @media (min-aspect-ratio: 7/10) { .strip .mid { display: none; } }
  @media (min-aspect-ratio: 6/5) { .strip .mid { display: inline-block; } }
  @keyframes pop {
    0%, 58% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.9,.3,1.5); }
    62% { transform: scale(1.14); animation-timing-function: cubic-bezier(.4,0,.4,1); }
    68%, 100% { transform: scale(1); }
  }

  /* CTA: the underline wipes away and redraws, then the arrow nudges */
  .strip .cta { border-bottom-color: transparent; background: linear-gradient(#111, #111) no-repeat 0 100% / 100% .35vmin; animation: rule 4s linear infinite; }
  @keyframes rule {
    0%, 70% { background-size: 100% .35vmin; background-position: 100% 100%; animation-timing-function: cubic-bezier(.6,0,.3,1); }
    76% { background-size: 0% .35vmin; background-position: 100% 100%; animation-timing-function: steps(1, end); }
    76.5% { background-size: 0% .35vmin; background-position: 0 100%; animation-timing-function: cubic-bezier(.6,0,.3,1); }
    84%, 100% { background-size: 100% .35vmin; background-position: 0 100%; }
  }
  .strip .cta span { display: inline-block; animation: nudge 4s linear infinite; }
  @keyframes nudge {
    0%, 84% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    87% { transform: translateX(.8vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    90% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
    93% { transform: translateX(.8vmin); animation-timing-function: cubic-bezier(.5,0,.5,1); }
    96%, 100% { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="left">
    <div class="ph"><img class="photo" src="{{PRODUCT_IMAGE}}" alt=""></div>
    <div class="strip"><span><b>Just landed</b> — the new collection</span><span class="mid">From $45</span><span class="cta">Shop now <span>→</span></span></div>
  </div>
  <div class="blk">
    <div class="word"><span>n</span><span>e</span><span>w</span></div>
  </div>
</div>
</body>
</html>
