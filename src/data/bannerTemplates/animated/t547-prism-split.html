<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="loop-duration" content="6">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400;1,6..96,500&family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Prism Split — one white beam enters a glass prism (layered translucent triangle, bright rim, inner caustic)
     and leaves as a seven-band spectrum that fans out and lands on the photo, as if the colour of the product came
     from the light itself. Seven colourway dots echo the bands; elegant Bodoni italic on near-black.
     tall → beam from the left, spectrum pours down onto the photo · 3:4 and wider → beam → prism → spectrum → photo on the right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0E0D12; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #F3F0EA; font-family: "Red Hat Display", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(70vmin 50vmin at 60% 40%, #1B1924 0%, rgba(27,25,36,0) 70%), #0E0D12; }

  .photo { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - 82vmin); object-fit: cover; object-position: 50% 25%; display: block; }

  .beam { position: absolute; left: 0; top: 44vmin; width: 56vmin; height: .5vmin; margin-top: -.25vmin;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, #FFFFFF 40%); box-shadow: 0 0 1.2vmin rgba(255,255,255,.8), 0 0 3vmin rgba(255,255,255,.35); }
  .fan { position: absolute; left: 0; top: 0; width: 100%; height: 82vmin; opacity: .9; filter: blur(.5vmin);
    clip-path: polygon(70vmin 42.6vmin, 70vmin 45.4vmin, 100% 82vmin, 38vmin 82vmin);
    background: linear-gradient(90deg, rgba(0,0,0,0) 30vmin, #FF3B3B 40vmin, #FF8A2A 49vmin, #FFD83A 58vmin, #4BE36A 67vmin, #33B6FF 76vmin, #5A5CFF 85vmin, #B455FF 96vmin); }
  .prism { position: absolute; left: 51vmin; top: calc(44vmin - 13vmin); width: 24vmin; height: 20.8vmin; }
  .prism i { position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .prism .rim { background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(255,255,255,.35) 50%, rgba(255,255,255,.8)); }
  .prism .glass { inset: .45vmin .5vmin .3vmin; background: linear-gradient(165deg, #3A3847 0%, #1C1B24 55%, #2A2835 100%); }
  .prism .sheen { inset: .45vmin .5vmin .3vmin; background: linear-gradient(118deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.22) 46%, rgba(255,255,255,0) 54%),
    linear-gradient(0deg, rgba(180,85,255,.18), rgba(255,59,59,0) 60%); }

  .head { position: absolute; left: 6vmin; top: 6vmin; width: 60vmin; }
  .kick { font-size: 1.7vmin; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: #9B96A8; white-space: nowrap; }
  h1 { margin: 1.6vmin 0 0; font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 500; font-size: 10vmin; line-height: .92; letter-spacing: -.02em; }
  h1 i { font-weight: 400; display: inline-block; }
  .sub { margin-top: 2vmin; font-size: 2vmin; line-height: 1.45; color: #B9B4C4; max-width: 44vmin; }

  .buy { position: absolute; left: 6vmin; top: 50vmin; width: 32vmin; display: flex; flex-direction: column; align-items: flex-start; gap: 2vmin; }
  .dots { display: flex; gap: 1vmin; }
  .dots i { width: 2.8vmin; height: 2.8vmin; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .dots i:nth-child(1) { background: #B8322C; } .dots i:nth-child(2) { background: #D97A2B; } .dots i:nth-child(3) { background: #E5C44A; } .dots i:nth-child(4) { background: #4E8B5B; }
  .dots i:nth-child(5) { background: #3C7FB4; } .dots i:nth-child(6) { background: #3F3F8F; } .dots i:nth-child(7) { background: #7C4A9E; }
  .lab { font-size: 1.7vmin; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #9B96A8; white-space: nowrap; }
  .price { font-family: "Bodoni Moda", Didot, Georgia, serif; font-style: italic; font-size: 6vmin; line-height: 1; white-space: nowrap; }
  .cta { padding: 1.8vmin 3.2vmin; border-radius: 99vmin; background: #F3F0EA; color: #0E0D12; font-size: 2vmin; font-weight: 700; white-space: nowrap; }
  .fine { font-size: 1.6vmin; color: #7E7989; white-space: nowrap; }

  /* ── 3:4 and wider — horizontal optics, photo on the right ── */
  @media (min-aspect-ratio: 7/10) {
    .photo { left: auto; right: 0; top: 0; width: 46%; height: 100%; object-position: 50% 25%; }
    .beam { top: 50%; width: 20vmin; }
    .prism { left: 18vmin; top: calc(50% - 12.4vmin); width: 22vmin; height: 19vmin; }
    .fan { left: 35vmin; right: calc(46% - 2vmin); width: auto; top: calc(50% - 16vmin); height: 32vmin;
      clip-path: polygon(0 45%, 100% 0, 100% 100%, 0 55%);
      background: linear-gradient(180deg, #FF3B3B 0%, #FF8A2A 16%, #FFD83A 32%, #4BE36A 50%, #33B6FF 66%, #5A5CFF 82%, #B455FF 100%); }
    .head { width: calc(54% - 10vmin); top: 6vmin; }
    h1 { font-size: 8.4vmin; }
    .sub { display: none; }
    .buy { top: auto; bottom: 6vmin; width: calc(54% - 10vmin); }
    .price { font-size: 5.4vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .head { top: 5.6vmin; }
    h1 { font-size: 7.4vmin; }
    .beam { width: 16vmin; }
    .prism { left: 14vmin; width: 18vmin; height: 15.6vmin; top: calc(50% - 10.2vmin); }
    .fan { left: 28vmin; top: calc(50% - 13vmin); height: 26vmin; }
    .buy { bottom: 5.6vmin; gap: 1.6vmin; }
    .dots i { width: 2.4vmin; height: 2.4vmin; }
    .price { font-size: 4.8vmin; }
    .cta { padding: 1.6vmin 2.8vmin; }
  }
  /* ── wide — room for the sub line and a row of buy details ── */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 44%; }
    .head { left: 7vmin; top: 7vmin; width: calc(56% - 14vmin); }
    h1 { font-size: 8.6vmin; }
    .sub { display: block; font-size: 2vmin; }
    .beam { width: 22vmin; top: 55%; }
    .prism { left: 20vmin; width: 20vmin; height: 17.3vmin; top: calc(55% - 11.2vmin); }
    .fan { left: 35vmin; right: calc(44% - 2vmin); top: calc(55% - 12vmin); height: 24vmin; }
    .buy { left: 7vmin; bottom: 6vmin; width: calc(56% - 14vmin); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 1.6vmin 3vmin; }
    .buy .dots { flex-basis: 100%; }
    .lab { display: none; }
    .fine { flex-basis: 100%; }
  }

  /* ───────── motion (6s loop · t=0 = the static design) ─────────
     restrained, optical: a light pulse runs down the white beam twice per loop and, as it hits the prism, the spectrum
     swells brighter · 2.4s a specular glint crosses the prism glass · 4.0s the seven colourway dots ripple left → right
     and "spectrum." disperses into a red/blue fringe for a moment · the photo breathes with a slow push-in */
  .beam::after { content: ""; position: absolute; top: 50%; left: -12%; width: 9vmin; height: 2.2vmin; margin-top: -1.1vmin; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,255,255,1), rgba(255,255,255,.4) 45%, rgba(255,255,255,0));
    opacity: 0; animation: pulse 3s cubic-bezier(.5,0,.7,1) infinite; }
  @keyframes pulse { 0%, 8% { left: -12%; opacity: 0; } 14% { opacity: 1; } 40% { left: 88%; opacity: 1; } 44%, 100% { left: 96%; opacity: 0; } }

  .fan { animation: swell 3s cubic-bezier(.3,0,.4,1) infinite; }
  @keyframes swell { 0%, 38%, 100% { opacity: .9; filter: blur(.5vmin) brightness(1); } 50% { opacity: 1; filter: blur(.5vmin) brightness(1.35) saturate(1.15); } 75% { opacity: .82; filter: blur(.5vmin) brightness(1); } }

  .prism::after { content: ""; position: absolute; inset: .45vmin .5vmin .3vmin; clip-path: polygon(50% 0, 100% 100%, 0 100%); pointer-events: none;
    background: linear-gradient(112deg, rgba(255,255,255,0) 42%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 58%) no-repeat;
    background-size: 300% 100%; background-position: 100% 0; animation: glint 6s cubic-bezier(.45,0,.3,1) infinite; }
  @keyframes glint { 0%, 38% { background-position: 100% 0; } 58%, 100% { background-position: 0% 0; } }
  .prism .rim { animation: rim 6s cubic-bezier(.45,0,.3,1) infinite; }
  @keyframes rim { 0%, 42%, 62%, 100% { filter: none; } 50% { filter: brightness(1.25) drop-shadow(0 0 .8vmin rgba(255,255,255,.5)); } }

  .dots i { animation: ripple 6s cubic-bezier(.3,0,.3,1) infinite; }
  .dots i:nth-child(1) { animation-delay: 0s; } .dots i:nth-child(2) { animation-delay: -.08s; } .dots i:nth-child(3) { animation-delay: -.16s; }
  .dots i:nth-child(4) { animation-delay: -.24s; } .dots i:nth-child(5) { animation-delay: -.32s; } .dots i:nth-child(6) { animation-delay: -.4s; } .dots i:nth-child(7) { animation-delay: -.48s; }
  @keyframes ripple { 0%, 72%, 84%, 100% { transform: translateY(0); } 77% { transform: translateY(-.9vmin) scale(1.12); } }

  h1 i { animation: disperse 6s cubic-bezier(.3,0,.3,1) infinite; }
  @keyframes disperse { 0%, 70%, 88%, 100% { text-shadow: 0 0 0 rgba(255,59,59,0), 0 0 0 rgba(51,182,255,0); }
    76%, 80% { text-shadow: -.45vmin 0 0 rgba(255,59,59,.6), .45vmin 0 0 rgba(51,182,255,.6); } }

  .photo { transform-origin: 50% 100%; animation: push 6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @media (min-aspect-ratio: 7/10) { .photo { transform-origin: 100% 50%; } }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="fan"></div>
  <div class="beam"></div>
  <div class="prism"><i class="rim"></i><i class="glass"></i><i class="sheen"></i></div>
  <div class="head">
    <div class="kick">Refrakt · Colour story</div>
    <h1>Full <i>spectrum.</i></h1>
    <div class="sub">One cut, split into seven colourways. Pick the band that's yours.</div>
  </div>
  <div class="buy">
    <div class="lab">7 colourways</div>
    <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="price">€115</div>
    <div class="cta">Pick your colour →</div>
    <div class="fine">Free exchanges on colour</div>
  </div>
</div>
</body>
</html>
