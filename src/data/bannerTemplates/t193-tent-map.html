<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Tent Map — the festival site map as the shopping guide: an illustrated field plan (mown stripes, river, paths,
     tent clusters, trees, main stage), a "you are here" pin on the look, and a legend card that maps zones to offers.
     tall → photo above, map below · square & wide → map left, photo right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #C9D8A7; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #C9D8A7; color: #1F2A1B; font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "IBM Plex Mono", "Courier New", monospace; }

  .photo { position: absolute; left: 0; top: 0; width: 100%; height: 52%; object-fit: cover; object-position: 50% 20%; }
  .map { position: absolute; left: 0; right: 0; top: 52%; bottom: 0; overflow: hidden; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .pin { position: absolute; left: 5vmin; top: calc(52% - 13.6vmin); display: flex; align-items: flex-end; gap: 1.2vmin; }
  .pin svg { width: 7vmin; height: 10vmin; flex: none; filter: drop-shadow(0 .6vmin .6vmin rgba(0,0,0,.25)); }
  .pin span { margin-bottom: 4.6vmin; padding: .9vmin 1.4vmin; background: #1F2A1B; color: #FBF6E9; font-size: 1.7vmin; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }

  .card { position: absolute; left: 5vmin; right: 5vmin; bottom: 5vmin; box-sizing: border-box; padding: 3.4vmin 3.6vmin 3vmin; background: #FBF6E9; box-shadow: 0 1vmin 2.4vmin rgba(31,42,27,.18); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.7vmin; letter-spacing: .12em; text-transform: uppercase; color: #5B6650; }
  h1 { margin: 1.6vmin 0 2.2vmin; font-size: 8.8vmin; font-weight: 800; line-height: .94; letter-spacing: -.03em; font-variation-settings: "opsz" 96; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid #1F2A1B; }
  li { display: grid; grid-template-columns: 5vmin 1fr auto; align-items: center; gap: 1.4vmin; padding: 1.3vmin 0; border-bottom: 1px solid rgba(31,42,27,.28); font-size: 2.6vmin; font-weight: 500; }
  li svg { width: 4.4vmin; height: 3.4vmin; }
  li em { font-style: normal; font-family: "IBM Plex Mono", monospace; font-size: 1.9vmin; font-weight: 600; letter-spacing: .04em; }
  li.hot em { background: #E8472B; color: #FBF6E9; padding: .4vmin 1vmin; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 2.4vmin; font-size: 1.8vmin; letter-spacing: .08em; text-transform: uppercase; }
  .foot b { font-weight: 600; }
  .cta { font-family: "Bricolage Grotesque", sans-serif; text-transform: none; letter-spacing: 0; font-size: 2.4vmin; font-weight: 800; color: #E8472B; white-space: nowrap; }
  .n { position: absolute; right: 5vmin; top: calc(52% + 3vmin); width: 11vmin; height: 11vmin; }

  @media (min-aspect-ratio: 7/10) {
    .photo { height: 46%; }
    .map { top: 46%; }
    .pin { top: calc(46% - 13.6vmin); }
    .n { top: calc(46% + 2.6vmin); width: 9vmin; height: 9vmin; }
    .card { bottom: 4vmin; padding: 2.8vmin 3.4vmin 2.6vmin; }
    h1 { font-size: 6.6vmin; margin: 1.2vmin 0 1.6vmin; }
    li { padding: 1vmin 0; font-size: 2.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .photo { left: auto; right: 0; width: 48%; height: 100%; object-position: 50% 25%; }
    .map { top: 0; right: 48%; }
    .pin { left: auto; right: calc(48% - 4.6vmin); top: 5vmin; flex-direction: row-reverse; }
    .pin span { display: none; }
    .n { right: auto; left: 4vmin; top: 4vmin; width: 9vmin; height: 9vmin; }
    .card { left: 4vmin; right: calc(48% + 4vmin); bottom: 4vmin; padding: 2.8vmin 3vmin 2.6vmin; }
    h1 { font-size: 5.6vmin; }
    li { grid-template-columns: 4.4vmin 1fr auto; font-size: 2vmin; padding: .9vmin 0; }
    li svg { width: 3.8vmin; height: 3vmin; }
    li em { font-size: 1.7vmin; }
    .card .top span:last-child { display: none; }
    .foot { font-size: 1.6vmin; }
    .cta { font-size: 2.1vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 42%; object-position: 50% 30%; }
    .map { right: 42%; }
    .pin { right: calc(42% - 4.6vmin); }
    .card { left: auto; right: calc(42% + 5vmin); width: 62vmin; bottom: 5vmin; padding: 3.2vmin 3.6vmin 3vmin; }
    .n { left: 5vmin; top: 5vmin; width: 11vmin; height: 11vmin; }
    h1 { font-size: 6.4vmin; }
    li { font-size: 2.2vmin; padding: 1.1vmin 0; }
    .card .top span:last-child { display: inline; }
    .foot { font-size: 1.7vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="map">
    <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="200" height="200" fill="#C9D8A7"/>
      <g fill="#BFD09A"><rect x="0" y="0" width="200" height="12"/><rect x="0" y="24" width="200" height="12"/><rect x="0" y="48" width="200" height="12"/><rect x="0" y="72" width="200" height="12"/><rect x="0" y="96" width="200" height="12"/><rect x="0" y="120" width="200" height="12"/><rect x="0" y="144" width="200" height="12"/><rect x="0" y="168" width="200" height="12"/><rect x="0" y="192" width="200" height="12"/></g>
      <path d="M150 -5 C 140 30, 175 55, 160 85 S 130 130, 150 160 S 185 190, 175 210" fill="none" stroke="#8CC3D9" stroke-width="11" stroke-linecap="round"/>
      <path d="M150 -5 C 140 30, 175 55, 160 85 S 130 130, 150 160 S 185 190, 175 210" fill="none" stroke="#B5DCEA" stroke-width="3" stroke-dasharray="4 6"/>
      <g fill="none" stroke="#F4EEDC" stroke-width="5" stroke-linecap="round"><path d="M-5 40 C 40 45, 70 20, 120 38 S 170 60, 205 50"/><path d="M60 -5 C 55 40, 80 80, 70 120 S 40 170, 60 205"/><path d="M70 120 C 110 115, 130 140, 205 130"/></g>
      <g fill="none" stroke="#1F2A1B" stroke-width=".8" stroke-dasharray="2 2.4" opacity=".55"><path d="M-5 40 C 40 45, 70 20, 120 38 S 170 60, 205 50"/><path d="M60 -5 C 55 40, 80 80, 70 120 S 40 170, 60 205"/><path d="M70 120 C 110 115, 130 140, 205 130"/></g>
      <g fill="#6E8F4E"><circle cx="18" cy="16" r="6"/><circle cx="28" cy="10" r="5"/><circle cx="185" cy="96" r="6"/><circle cx="192" cy="108" r="5"/><circle cx="110" cy="182" r="6"/><circle cx="121" cy="188" r="5"/><circle cx="8" cy="120" r="5"/><circle cx="96" cy="70" r="4"/></g>
      <g fill="#4F6D37" opacity=".6"><circle cx="20" cy="18" r="2.4"/><circle cx="187" cy="98" r="2.4"/><circle cx="112" cy="184" r="2.4"/></g>
      <g><rect x="92" y="4" width="36" height="16" fill="#1F2A1B"/><path d="M92 20 Q110 32 128 20" fill="#1F2A1B"/><rect x="98" y="8" width="24" height="3" fill="#F2B53A"/></g>
      <g id="tents">
        <path d="M14 60 l6 -9 l6 9 z" fill="#E8472B"/><path d="M26 66 l6 -9 l6 9 z" fill="#2F5BD3"/><path d="M12 74 l6 -9 l6 9 z" fill="#F2B53A"/><path d="M28 80 l6 -9 l6 9 z" fill="#E8472B"/><path d="M40 70 l6 -9 l6 9 z" fill="#FBF6E9"/>
        <path d="M86 90 l6 -9 l6 9 z" fill="#2F5BD3"/><path d="M98 96 l6 -9 l6 9 z" fill="#E8472B"/><path d="M110 88 l6 -9 l6 9 z" fill="#F2B53A"/><path d="M104 108 l6 -9 l6 9 z" fill="#FBF6E9"/><path d="M118 102 l6 -9 l6 9 z" fill="#2F5BD3"/>
        <path d="M20 150 l6 -9 l6 9 z" fill="#F2B53A"/><path d="M32 158 l6 -9 l6 9 z" fill="#E8472B"/><path d="M18 166 l6 -9 l6 9 z" fill="#2F5BD3"/><path d="M84 150 l6 -9 l6 9 z" fill="#FBF6E9"/><path d="M96 158 l6 -9 l6 9 z" fill="#E8472B"/>
        <path d="M168 150 l6 -9 l6 9 z" fill="#E8472B"/><path d="M180 160 l6 -9 l6 9 z" fill="#F2B53A"/><path d="M170 20 l6 -9 l6 9 z" fill="#2F5BD3"/><path d="M182 28 l6 -9 l6 9 z" fill="#FBF6E9"/>
      </g>
      <g fill="none" stroke="#E8472B" stroke-width="1.1" stroke-dasharray="1.6 2"><path d="M40 70 C 70 70, 90 60, 104 96"/></g>
    </svg>
  </div>
  <svg class="n" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#FBF6E9" stroke="#1F2A1B" stroke-width="1"/><path d="M20 6 L25 21 L20 18 L15 21 Z" fill="#E8472B"/><path d="M20 34 L25 19 L20 22 L15 19 Z" fill="#1F2A1B"/></svg>
  <div class="pin">
    <svg viewBox="0 0 28 40" aria-hidden="true"><path d="M14 39 C 14 39, 1 23, 1 14 A 13 13 0 0 1 27 14 C 27 23, 14 39, 14 39 Z" fill="#E8472B" stroke="#FBF6E9" stroke-width="1.6"/><circle cx="14" cy="14" r="5" fill="#FBF6E9"/></svg>
    <span>You are here</span>
  </div>
  <div class="card">
    <div class="top mono"><span>Site map · Summer 26</span><span>Gates open Fri</span></div>
    <h1>Find your<br>festival look.</h1>
    <ul>
      <li><svg viewBox="0 0 22 16"><path d="M2 15 L11 1 L20 15 Z" fill="#E8472B"/></svg>Main stage — new in<em>A1</em></li>
      <li class="hot"><svg viewBox="0 0 22 16"><path d="M2 15 L11 1 L20 15 Z" fill="#2F5BD3"/></svg>The fields — sale<em>−40%</em></li>
      <li><svg viewBox="0 0 22 16"><path d="M2 15 L11 1 L20 15 Z" fill="#F2B53A"/></svg>Camp — free returns<em>C3</em></li>
    </ul>
    <div class="foot mono"><span>Code <b>CAMP40</b></span><span class="cta">Explore the site →</span></div>
  </div>
</div>
</body>
</html>
