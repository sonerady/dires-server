<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Crag Topo — a page from a climbing guidebook: a pen-drawn crag with three numbered routes (bolts,
     lower-off anchors, a crux flag), the route table with grades and quality stars turned into the sale tiers,
     and a climber's pencil notes in the margin. Off-white guidebook stock, black ink, route red.
     tall → photo above, topo page below · square → photo left, page right stacked · wide → photo left, topo beside table */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #F1ECE0; }
  .banner { position: fixed; inset: 0; overflow: hidden; background: #F1ECE0; color: #161514; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; --red: #D1342A; }
  .photo { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 92vmin); object-fit: cover; object-position: 50% 20%; }
  .page { position: absolute; left: 0; right: 0; bottom: 0; height: 92vmin; box-sizing: border-box; padding: 0 6vmin 5vmin; display: flex; flex-direction: column;
    background: radial-gradient(circle at 20% 30%, rgba(120,100,60,.06), transparent 50%), #F1ECE0; }
  .bar { display: flex; justify-content: space-between; margin: 0 -6vmin; padding: 1.4vmin 6vmin; background: #161514; color: #F1ECE0; font-weight: 600; font-size: 2vmin; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .bar b { color: #FF8A7F; font-weight: 600; }
  .ttl { display: flex; align-items: baseline; justify-content: space-between; gap: 2vmin; margin-top: 3vmin; }
  h1 { margin: 0; font-weight: 800; font-size: 11vmin; line-height: .86; letter-spacing: -.01em; text-transform: uppercase; }
  .pg { font-weight: 600; font-size: 2vmin; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: #5E5A52; }
  .body { flex: 1; min-height: 0; display: flex; gap: 4vmin; margin-top: 3vmin; }
  .crag { position: relative; width: 42%; min-height: 0; }
  .crag svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .note { position: absolute; font-family: "Caveat", "Comic Sans MS", cursive; font-weight: 700; font-size: 3.4vmin; line-height: 1; color: #2E5AA8; white-space: nowrap; transform: rotate(-8deg); }
  .crux { right: -2vmin; top: 20%; }
  .table { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .rt { display: flex; align-items: center; gap: 2vmin; padding: 1.6vmin 0; border-bottom: 1px solid #161514; }
  .rt:first-child { border-top: 2px solid #161514; }
  .no { flex: none; width: 4.2vmin; height: 4.2vmin; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 2.6vmin; }
  .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .nm b { font-weight: 800; font-size: 3.6vmin; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  .nm small { font-weight: 500; font-size: 1.9vmin; letter-spacing: .04em; color: #5E5A52; white-space: nowrap; margin-top: .4vmin; }
  .gr { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
  .gr b { font-weight: 800; font-size: 3.4vmin; line-height: 1; white-space: nowrap; }
  .gr i { font-style: normal; color: var(--red); font-size: 1.9vmin; letter-spacing: .1em; margin-top: .4vmin; white-space: nowrap; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 3vmin; margin-top: 3.4vmin; }
  .code { font-family: "Caveat", "Comic Sans MS", cursive; font-weight: 700; font-size: 4.6vmin; line-height: 1; color: #2E5AA8; white-space: nowrap; transform: rotate(-3deg); padding-bottom: .6vmin;
    background: linear-gradient(#2E5AA8, #2E5AA8) 0 100% / 100% .35vmin no-repeat; }
  .go { padding: 1.6vmin 2.8vmin; background: #161514; color: #F1ECE0; font-weight: 600; font-size: 2.6vmin; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }

  @media (min-aspect-ratio: 3/5) {
    .photo { height: calc(100% - 82vmin); }
    .page { height: 82vmin; padding-bottom: 4.4vmin; }
    .ttl { margin-top: 2.4vmin; }
    h1 { font-size: 9.6vmin; }
    .body { margin-top: 2.4vmin; }
    .rt { padding: 1.3vmin 0; }
    .foot { margin-top: 2.6vmin; }
  }
  @media (min-aspect-ratio: 7/10) {
    .photo { height: calc(100% - 66vmin); }
    .page { height: 66vmin; padding-bottom: 3.6vmin; }
    .bar { padding: 1.1vmin 6vmin; font-size: 1.8vmin; }
    .ttl { margin-top: 2vmin; }
    h1 { font-size: 8vmin; }
    h1 br { display: none; }
    .body { margin-top: 2vmin; }
    .crag { width: 34%; }
    .rt { padding: 1vmin 0; }
    .no { width: 3.6vmin; height: 3.6vmin; font-size: 2.2vmin; }
    .nm b { font-size: 3vmin; }
    .nm small { font-size: 1.7vmin; }
    .gr b { font-size: 2.9vmin; }
    .gr i { font-size: 1.7vmin; }
    .note { font-size: 3vmin; }
    .foot { margin-top: 2vmin; }
    .code { font-size: 4vmin; }
    .go { padding: 1.3vmin 2.4vmin; font-size: 2.2vmin; }
  }
  /* square → photo left, topo stacked over the table */
  @media (min-aspect-ratio: 9/10) {
    .photo { width: 50%; height: 100%; object-position: 50% 25%; }
    .page { left: 50%; top: 0; height: auto; padding: 0 4.4vmin 4.4vmin; }
    .bar { margin: 0 -4.4vmin; padding: 1.3vmin 4.4vmin; font-size: 1.6vmin; letter-spacing: .1em; }
    .bar .r { display: none; }
    .ttl { margin-top: 2.6vmin; }
    h1 { font-size: 7.4vmin; }
    h1 br { display: inline; }
    .pg { display: none; }
    .body { flex-direction: column; gap: 2vmin; margin-top: 2vmin; }
    .crag { width: 100%; flex: 1; }
    .crux { right: 4vmin; top: 12%; }
    .table { flex: none; }
    .rt { padding: .9vmin 0; gap: 1.4vmin; }
    .no { width: 3.2vmin; height: 3.2vmin; font-size: 1.9vmin; }
    .nm b { font-size: 2.5vmin; }
    .nm small { display: none; }
    .gr { flex-direction: row; align-items: baseline; gap: 1vmin; }
    .gr b { font-size: 2.4vmin; }
    .gr i { font-size: 1.6vmin; margin: 0; }
    .note { font-size: 2.8vmin; }
    .foot { margin-top: 2vmin; gap: 2vmin; }
    .code { font-size: 3.4vmin; }
    .go { padding: 1.1vmin 1.8vmin; font-size: 1.9vmin; }
  }
  /* wide → photo left, topo beside the table */
  @media (min-aspect-ratio: 6/5) {
    .photo { width: 46%; }
    .page { left: 46%; padding: 0 6vmin 5vmin; }
    .bar { margin: 0 -6vmin; padding: 1.4vmin 6vmin; font-size: 1.9vmin; letter-spacing: .16em; }
    .bar .r { display: inline; }
    .ttl { margin-top: 3.4vmin; }
    h1 { font-size: 9vmin; }
    h1 br { display: none; }
    .pg { display: inline; }
    .body { flex-direction: row; gap: 4vmin; margin-top: 3vmin; }
    .crag { width: 35%; }
    .crux { right: -3vmin; top: 18%; }
    .table { flex: 1; }
    .rt { padding: 1.4vmin 0; gap: 2vmin; }
    .no { width: 4vmin; height: 4vmin; font-size: 2.4vmin; }
    .nm b { font-size: 2.9vmin; }
    .nm small { display: block; font-size: 1.8vmin; }
    .gr { flex-direction: column; align-items: flex-end; gap: 0; }
    .gr b { font-size: 3.1vmin; }
    .gr i { font-size: 1.8vmin; margin-top: .4vmin; }
    .note { font-size: 3.2vmin; }
    .foot { margin-top: 3vmin; }
    .code { font-size: 4.4vmin; }
    .go { padding: 1.5vmin 2.6vmin; font-size: 2.4vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="page">
    <div class="bar"><span>Sector Sale · <b>Topo 03</b></span><span class="r">Approach 5 min · South face</span></div>
    <div class="ttl"><h1>Send the <br>season.</h1><span class="pg">p. 311</span></div>
    <div class="body">
      <div class="crag">
        <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs><filter id="pen" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter></defs>
          <g filter="url(#pen)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 118 L4 98 L8 91 L6 76 L11 64 L9 52 L15 43 L21 38 L24 27 L32 22 L38 13 L46 15 L53 6 L62 10 L69 7 L75 15 L83 17 L87 29 L93 36 L91 50 L96 60 L94 78 L98 90 L98 118 Z" fill="#E6DFCD" stroke="#161514" stroke-width="1.3"/>
            <path d="M-2 118 H102 M2 118 l-3 3 M10 118 l-3 3 M18 118 l-3 3 M26 118 l-3 3 M34 118 l-3 3 M42 118 l-3 3 M58 118 l-3 3 M66 118 l-3 3 M74 118 l-3 3 M86 118 l-3 3 M94 118 l-3 3 M102 118 l-3 3" fill="none" stroke="#161514" stroke-width=".8"/>
            <g fill="none" stroke="#161514" stroke-width=".55" stroke-opacity=".75">
              <path d="M17 40 Q24 46 21 58 Q18 70 23 82"/><path d="M40 11 Q38 22 42 30 M62 8 Q60 20 64 30 Q67 38 63 48"/><path d="M89 33 Q82 42 86 54 Q90 66 85 78"/>
              <path d="M8 92 H22 M9 95 H19 M70 64 H90 M72 67 H86 M30 48 H44 M32 51 H40"/>
              <path d="M44 72 Q48 78 45 90 M58 86 Q55 96 60 106 M14 104 Q20 108 16 116"/>
            </g>
            <!-- routes -->
            <g fill="none" stroke="#D1342A" stroke-width="1.5">
              <path d="M22 116 Q24 100 21 88 Q18 74 24 62 Q28 52 27 42"/>
              <path d="M50 116 Q48 98 52 84 Q56 68 51 52 Q47 36 52 22 Q54 16 53 12"/>
              <path d="M78 116 Q80 104 76 92 Q72 80 78 66 Q84 52 79 38 Q76 30 78 24" stroke-dasharray="3 2"/>
            </g>
            <g stroke="#161514" stroke-width="1">
              <path d="M22 96 l2 2 m0 -2 l-2 2 M20 76 l2 2 m0 -2 l-2 2 M25 58 l2 2 m0 -2 l-2 2"/>
              <path d="M49 100 l2 2 m0 -2 l-2 2 M53 80 l2 2 m0 -2 l-2 2 M52 62 l2 2 m0 -2 l-2 2 M49 44 l2 2 m0 -2 l-2 2 M51 28 l2 2 m0 -2 l-2 2"/>
            </g>
            <g fill="#F1ECE0" stroke="#161514" stroke-width="1"><circle cx="26" cy="40" r="1.6"/><circle cx="29" cy="40" r="1.6"/><circle cx="52" cy="11" r="1.6"/><circle cx="55" cy="11" r="1.6"/><circle cx="77" cy="22" r="1.6"/><circle cx="80" cy="22" r="1.6"/></g>
          </g>
          <g font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="6" text-anchor="middle">
            <circle cx="22" cy="113" r="4.4" fill="#D1342A"/><text x="22" y="115.2" fill="#fff">1</text>
            <circle cx="50" cy="113" r="4.4" fill="#D1342A"/><text x="50" y="115.2" fill="#fff">2</text>
            <circle cx="78" cy="113" r="4.4" fill="#D1342A"/><text x="78" y="115.2" fill="#fff">3</text>
          </g>
          <path d="M84 54 q6 -2 9 -8" fill="none" stroke="#2E5AA8" stroke-width=".9" stroke-linecap="round"/>
        </svg>
        <span class="note crux">crux!</span>
      </div>
      <div class="table">
        <div class="rt"><span class="no">1</span><div class="nm"><b>New arrivals</b><small>Warm-up, just bolted</small></div><div class="gr"><b>5.9</b><i>★</i></div></div>
        <div class="rt"><span class="no">2</span><div class="nm"><b>The edit −30%</b><small>Classic line, all day</small></div><div class="gr"><b>5.10b</b><i>★★</i></div></div>
        <div class="rt"><span class="no">3</span><div class="nm"><b>Final sale −50%</b><small>Last sizes, go fast</small></div><div class="gr"><b>5.12a</b><i>★★★</i></div></div>
      </div>
    </div>
    <div class="foot"><span class="code">code CRUX30</span><span class="go">Rack up →</span></div>
  </div>
</div>
</body>
</html>
