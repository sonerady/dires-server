<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Ultra&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Seed Packet — an 1890s seedsman's packet printed in two inks: pointed green flap, fat-face variety name,
     a Latin binomial, the look as the lithographed plate, a sowing table and a red rubber date stamp.
     tall → flap / name / plate / table · square & wide → flap across, plate left, name + table right */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #9DA784; }
  .banner { --grn: #2F4B35; --red: #B03A29; --och: #C9923A; --paper: #F4EAD0; --ink: #2A2A22; --fh: 17vmin;
    position: fixed; inset: 0; overflow: hidden; font-family: "Spectral", "Baskerville", Georgia, serif; color: var(--ink);
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px .7vmin),
      repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px .7vmin),
      radial-gradient(110% 80% at 50% 40%, #AEB894 0%, #9DA784 60%, #879272 100%); }
  .pk { position: absolute; inset: 5vmin 6vmin; background: linear-gradient(170deg, #F7EEDA 0%, #F2E6C9 60%, #EADBB8 100%);
    box-shadow: 0 1.6vmin 3vmin rgba(40,50,30,.35), 0 .2vmin .4vmin rgba(40,50,30,.3); }
  /* flap folded over the top */
  .flap { position: absolute; left: 0; right: 0; top: 0; height: var(--fh); z-index: 2;
    background: radial-gradient(80% 120% at 30% 0%, #3C5E43 0%, #2F4B35 60%, #243B2A 100%);
    clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); filter: drop-shadow(0 .6vmin .6vmin rgba(0,0,0,.3));
    display: flex; flex-direction: column; align-items: center; padding-top: 3vmin; box-sizing: border-box; color: var(--paper); text-align: center; }
  .flap .co { font-family: "Ultra", "Rockwell Extra Bold", Georgia, serif; font-size: 3.6vmin; letter-spacing: .04em; line-height: 1; white-space: nowrap; }
  .flap .co i { font-style: normal; color: var(--och); }
  .flap .sm { margin-top: .9vmin; font-size: 1.7vmin; font-weight: 600; letter-spacing: .34em; margin-right: -.34em; text-transform: uppercase; color: #E7D6A6; white-space: nowrap; }

  .in { position: absolute; left: 4vmin; right: 4vmin; top: calc(var(--fh) + 1.6vmin); bottom: 3.6vmin; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; justify-content: center; gap: 3vmin; text-align: center; }
  .no { width: 11vmin; height: 11vmin; flex: none; border-radius: 50%; border: .5vmin solid var(--red); box-shadow: inset 0 0 0 .5vmin var(--paper), inset 0 0 0 .7vmin var(--red);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--red); }
  .no small { font-size: 1.6vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .no b { font-family: "Ultra", Georgia, serif; font-weight: 400; font-size: 4.4vmin; line-height: 1; }
  .ttl .choice { font-size: 1.9vmin; font-weight: 700; letter-spacing: .4em; margin-right: -.4em; text-transform: uppercase; color: var(--grn); white-space: nowrap; }
  h1 { margin: .4vmin 0 0; font-family: "Ultra", "Rockwell Extra Bold", Georgia, serif; font-weight: 400; font-size: 8.4vmin; line-height: .98; color: var(--red); white-space: nowrap; text-shadow: .45vmin .45vmin 0 rgba(47,75,53,.9); }
  .lat { margin-top: .6vmin; font-style: italic; font-size: 2.5vmin; color: var(--grn); white-space: nowrap; }

  .plate { position: relative; flex: 1; min-height: 0; margin: 2.6vmin 1.2vmin 0; }
  .plate::before { content: ""; position: absolute; inset: -1.2vmin; border: .35vmin solid var(--grn); box-shadow: inset 0 0 0 .5vmin var(--paper), inset 0 0 0 .65vmin var(--grn); }
  .plate img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
  .cap { margin-top: 2vmin; text-align: center; font-style: italic; font-size: 2vmin; color: #55503F; white-space: nowrap; }

  .tbl { margin-top: 1.6vmin; display: grid; grid-template-columns: repeat(3, 1fr); border-top: .35vmin solid var(--grn); border-bottom: .35vmin solid var(--grn); position: relative; }
  .tbl div { padding: 1.4vmin 1vmin 1.2vmin; text-align: center; border-left: 1px solid rgba(47,75,53,.5); }
  .tbl div:first-child { border-left: 0; }
  .tbl small { display: block; font-size: 1.6vmin; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--grn); }
  .tbl b { display: block; margin-top: .5vmin; font-family: "Ultra", Georgia, serif; font-weight: 400; font-size: 3.4vmin; line-height: 1.05; white-space: nowrap; }
  .tbl .hot b { color: var(--red); }
  .foot { margin-top: 1.6vmin; display: flex; justify-content: space-between; align-items: center; gap: 2vmin; font-size: 1.9vmin; line-height: 1.5; white-space: nowrap; }
  .foot b { font-weight: 700; letter-spacing: .16em; color: var(--red); }
  .stamp { display: block; margin-right: 1vmin; transform: rotate(-7deg); padding: .8vmin 1.8vmin .6vmin; border: .45vmin solid rgba(176,58,41,.85); border-radius: .8vmin; color: rgba(176,58,41,.9);
    font-family: "Ultra", Georgia, serif; font-size: 2.2vmin; letter-spacing: .06em; line-height: 1.1; text-align: center; white-space: nowrap; background: rgba(244,234,208,.55); }
  .stamp small { display: block; margin-top: .7vmin; font-family: "Spectral", Georgia, serif; font-weight: 700; font-size: 1.6vmin; line-height: 1.2; letter-spacing: .24em; }

  @media (min-aspect-ratio: 7/10) {
    .pk { inset: 4.4vmin 9vmin; }
    .banner { --fh: 15vmin; }
    .flap { padding-top: 2.4vmin; }
    h1 { font-size: 7.2vmin; }
    .no { width: 10vmin; height: 10vmin; }
    .cap { display: none; }
    .tbl b { font-size: 3vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .banner { --fh: 15vmin; }
    .pk { inset: 5vmin 6vmin; }
    .in { display: grid; grid-template-columns: 50% minmax(0, 1fr); grid-template-rows: 1fr auto auto auto 1fr; column-gap: 5vmin; top: calc(var(--fh) + .4vmin); bottom: 4vmin; }
    .plate { grid-column: 1; grid-row: 1 / 6; margin: 1.4vmin 1.2vmin 1.2vmin; }
    .head { grid-column: 2; grid-row: 2; flex-direction: column; gap: 1.6vmin; }
    .cap { display: none; }
    .tbl { grid-column: 2; grid-row: 3; margin-top: 3vmin; grid-template-columns: 1fr; border-bottom: 0; }
    .tbl div { border-left: 0; border-bottom: 1px solid rgba(47,75,53,.5); display: flex; justify-content: space-between; align-items: baseline; padding: 1vmin .4vmin .8vmin; }
    .tbl div:last-child { border-bottom: .35vmin solid var(--grn); }
    .tbl b { margin-top: 0; font-size: 2.8vmin; }
    .foot { grid-column: 2; grid-row: 4; flex-direction: column; align-items: center; gap: 2vmin; margin-top: 2.4vmin; text-align: center; }
    h1 { font-size: 7.4vmin; white-space: normal; line-height: 1.08; }
    .lat { font-size: 2.2vmin; }
    .no { width: 9vmin; height: 9vmin; }
    .no b { font-size: 3.6vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .pk { inset: 5vmin 7vmin; }
    .in { grid-template-columns: 46% minmax(0, 1fr); column-gap: 7vmin; }
    h1 { font-size: 8vmin; white-space: nowrap; }
    .lat { font-size: 2.4vmin; }
    .tbl b { font-size: 3vmin; }
    .foot { flex-direction: row; justify-content: space-between; text-align: left; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="pk">
    <div class="flap">
      <div class="co">Nord <i>&amp;</i> Field</div>
      <div class="sm">Seedsmen · Est. 1891</div>
    </div>
    <div class="in">
      <div class="head">
        <div class="no"><small>Pkt.</small><b>42</b></div>
        <div class="ttl">
          <div class="choice">Choice seeds</div>
          <h1>Spring Crop</h1>
          <div class="lat">Collectio vernalis, var. 2026</div>
        </div>
      </div>
      <div class="plate"><img src="{{PRODUCT_IMAGE}}" alt=""></div>
      <div class="cap">Fig. 1 — grown from the new season's stock</div>
      <div class="tbl">
        <div><small>Sow</small><b>Now</b></div>
        <div><small>Blooms</small><b>All season</b></div>
        <div class="hot"><small>Yield</small><b>30% off</b></div>
      </div>
      <div class="foot"><span>Packed for the <b>2026</b> season<br>nordandfield.com</span><span class="stamp">Sow by 30 Apr<small>Code SEED30</small></span></div>
    </div>
  </div>
</div>
</body>
</html>
