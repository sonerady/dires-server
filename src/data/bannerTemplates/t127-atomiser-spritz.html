<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
  /* Atomiser Spritz — an eau-fraîche ad: a chrome atomiser head fires a halftone mist cone across
     a tangerine field; a huge "Spritz." sits in the spray. tall → colour field above the photo; square/wide → field left */
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #EC6A2E; }
  .banner { position: fixed; inset: 0; overflow: hidden; color: #FFF3E4; font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; background: #EC6A2E; }
  .field { position: absolute; left: 0; top: 0; width: 100%; height: 44%; overflow: hidden;
    background: radial-gradient(80% 90% at 10% 40%, #F58445 0%, #EC6A2E 60%, #E25E24 100%); }
  .photo { position: absolute; left: 0; top: 44%; width: 100%; height: 56%; object-fit: cover; object-position: 50% 22%; }

  /* chrome atomiser head, cropped by the left edge */
  .atom { position: absolute; left: -3vmin; top: var(--ny); width: 10vmin; height: 11vmin; transform: translateY(-50%);
    background: linear-gradient(180deg, #8E8C88 0%, #F4F2EE 22%, #C9C6C0 45%, #FFFFFF 58%, #9C9994 100%);
    border-radius: 0 1.6vmin 1.6vmin 0; box-shadow: .6vmin .8vmin 1.6vmin rgba(90,30,0,.35); }
  .atom::before { content: ""; position: absolute; right: -1.2vmin; top: 50%; width: 1.6vmin; height: 2.2vmin; transform: translateY(-50%); border-radius: 0 .6vmin .6vmin 0;
    background: linear-gradient(180deg, #7A7874, #E8E6E2 50%, #7A7874); }
  .atom::after { content: ""; position: absolute; left: 0; right: 1vmin; top: 100%; height: 3vmin; background: linear-gradient(180deg, #C9A45C, #F3DA9C 40%, #A8843F); }
  .mist { position: absolute; left: 7.6vmin; top: calc(var(--ny) - 30vmin); width: 110vmin; height: 60vmin;
    background:
      radial-gradient(circle, rgba(255,243,228,.95) 0 .26vmin, rgba(255,243,228,0) .34vmin) 0 0 / 1.9vmin 1.7vmin,
      radial-gradient(circle, rgba(255,243,228,.8) 0 .16vmin, rgba(255,243,228,0) .22vmin) .7vmin .9vmin / 1.3vmin 1.1vmin,
      radial-gradient(circle, rgba(255,243,228,.7) 0 .38vmin, rgba(255,243,228,0) .46vmin) 1.3vmin .3vmin / 4.3vmin 3.7vmin,
      radial-gradient(circle, rgba(255,243,228,.6) 0 .2vmin, rgba(255,243,228,0) .26vmin) 2.1vmin 1.7vmin / 2.9vmin 2.3vmin,
      radial-gradient(circle, rgba(255,243,228,.55) 0 .52vmin, rgba(255,243,228,0) .62vmin) .4vmin 2.2vmin / 6.7vmin 5.3vmin,
      radial-gradient(circle, rgba(255,243,228,.5) 0 .12vmin, rgba(255,243,228,0) .18vmin) .3vmin .2vmin / .9vmin 1.5vmin,
      radial-gradient(55% 45% at 0% 50%, rgba(255,243,228,.5), rgba(255,243,228,0));
    -webkit-mask-image: conic-gradient(from 0deg at 0% 50%, transparent 62deg, #000 80deg, #000 100deg, transparent 118deg), radial-gradient(100% 100% at 0% 50%, #000 0%, rgba(0,0,0,.6) 45%, transparent 90%);
    -webkit-mask-composite: source-in;
    mask-image: conic-gradient(from 0deg at 0% 50%, transparent 62deg, #000 80deg, #000 100deg, transparent 118deg), radial-gradient(100% 100% at 0% 50%, #000 0%, rgba(0,0,0,.6) 45%, transparent 90%);
    mask-composite: intersect; opacity: .75; }

  .top { position: absolute; left: 6vmin; right: 6vmin; top: 5vmin; display: flex; justify-content: space-between; font-size: 1.8vmin; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; white-space: nowrap; color: #FFE7D0; }
  .copy { position: absolute; left: 6vmin; right: 6vmin; bottom: calc(56% + 4.6vmin); }
  h1 { margin: 0; font-weight: 800; font-size: 25vmin; line-height: .8; letter-spacing: -.055em; text-shadow: 0 .4vmin 2vmin rgba(150,40,0,.25); }
  .line { margin-top: 2.6vmin; display: flex; justify-content: space-between; align-items: flex-end; gap: 3vmin; }
  .line p { margin: 0; font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 3.6vmin; line-height: 1.1; color: #FFF3E4; }
  .deal { flex: none; text-align: right; }
  .deal b { display: block; font-weight: 800; font-size: 5.6vmin; line-height: 1; letter-spacing: -.02em; color: #3A1206; }
  .deal span { display: block; margin-top: .8vmin; font-size: 1.8vmin; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: #3A1206; }
  .banner { --ny: 17vmin; }

  @media (min-aspect-ratio: 7/10) {
    .field { height: 42%; }
    .photo { top: 42%; height: 58%; }
    .copy { bottom: calc(58% + 4vmin); }
    h1 { font-size: 21vmin; }
    .banner { --ny: 15vmin; }
    .line p { font-size: 3.2vmin; }
  }
  @media (min-aspect-ratio: 9/10) {
    .field { width: 52%; height: 100%; }
    .photo { top: 0; left: 52%; width: 48%; height: 100%; object-position: 50% 25%; }
    .top { right: calc(48% + 5vmin); left: 5vmin; }
    .top span + span { display: none; }
    .copy { left: 5vmin; right: calc(48% + 5vmin); bottom: 6vmin; }
    h1 { font-size: 15.6vmin; }
    .line { flex-direction: column; align-items: flex-start; gap: 3vmin; }
    .line p { font-size: 3.2vmin; }
    .deal { text-align: left; }
    .deal b { font-size: 5.4vmin; }
    .banner { --ny: 34vmin; }
    .mist { width: 80vmin; }
  }
  @media (min-aspect-ratio: 6/5) {
    .field { width: 50%; }
    .photo { left: 50%; width: 50%; }
    .top { right: calc(50% + 6vmin); left: 6vmin; }
    .top span + span { display: inline; }
    .copy { left: 6vmin; right: calc(50% + 6vmin); bottom: 7vmin; }
    h1 { font-size: 20vmin; }
    .line { flex-direction: row; align-items: flex-end; }
    .deal { text-align: right; }
    .banner { --ny: 34vmin; }
    .mist { width: 100vmin; }
  }
</style>
</head>
<body>
<div class="banner">
  <div class="field"><div class="mist"></div></div>
  <div class="atom"></div>
  <img class="photo" src="{{PRODUCT_IMAGE}}" alt="">
  <div class="top"><span>Studio Oro · Eau Fraîche</span><span>Nº 04</span></div>
  <div class="copy">
    <h1>Spritz.</h1>
    <div class="line">
      <p>The fresh-cut collection,<br>sprayed on.</p>
      <div class="deal"><b>25% off</b><span>Code SPRITZ25</span></div>
    </div>
  </div>
</div>
</body>
</html>
