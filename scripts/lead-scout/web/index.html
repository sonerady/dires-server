<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead Scout</title>
<style>
:root{
  color-scheme: light;
  --surface-0:#f5f5f3; --surface-1:#fcfcfb; --border:#e4e3df;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#78766f;
  --series-1:#2a78d6; --track:#e9e8e4;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --surface-0:#111110; --surface-1:#1a1a19; --border:#33322f;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d85;
  --series-1:#3987e5; --track:#2a2a27;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#111110; --surface-1:#1a1a19; --border:#33322f;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d85;
  --series-1:#3987e5; --track:#2a2a27;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-block:26px;padding-left:16px;padding-right:16px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
h1 a{color:inherit;text-decoration:none}h1 a:hover{text-decoration:underline}
.sub{color:var(--text-muted);font-size:13px;margin-bottom:20px}
.back{display:inline-block;color:var(--series-1);text-decoration:none;font-size:13px;margin-bottom:12px}
.back:hover{text-decoration:underline}

.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.kpi{flex:1 1 150px;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.kpi .n{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--text-muted);font-size:11.5px;margin-top:3px}

.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
input[type=search],select{background:var(--surface-1);color:var(--text-primary);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
input[type=search]{flex:1 1 200px;min-width:0}
label.chk{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:13px;white-space:nowrap}

.tablewrap{overflow-x:auto;background:var(--surface-1);border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:880px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;
  cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--surface-1);z-index:1}
th[aria-sort]{color:var(--text-primary)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--series-1) 5%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dom{font-weight:550}
.dom a.drill{color:var(--series-1);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.dom a.drill:hover{text-decoration:underline}
.arrow{opacity:.6}

.meter{display:flex;align-items:center;gap:8px;min-width:132px}
.meter .track{position:relative;flex:1;height:7px;background:var(--track);border-radius:4px}
.meter .fill{height:100%;background:var(--series-1);border-radius:4px}
.meter .median{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-muted);opacity:.65}
.meter .v{font-variant-numeric:tabular-nums;color:var(--text-secondary);min-width:30px;font-size:12.5px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.mail a{color:var(--series-1);text-decoration:none}.mail a:hover{text-decoration:underline}
.none{color:var(--text-muted)}
.line{color:var(--text-secondary);font-size:12.5px;max-width:320px}
.copy{margin-left:6px;background:none;border:1px solid var(--border);border-radius:5px;
  color:var(--text-muted);cursor:pointer;font-size:10.5px;padding:2px 5px}
.copy:hover{color:var(--text-primary)}
.empty{padding:34px 16px;text-align:center;color:var(--text-muted)}
footer{margin-top:14px;color:var(--text-muted);font-size:12px}

/* --- tüm mağazalarda arama --- */
.gsearch{display:flex;gap:9px;align-items:center;margin-bottom:14px}
.gsearch input{flex:1;min-width:0;background:var(--surface-1);color:var(--text-primary);
  border:1px solid var(--border);border-radius:10px;padding:11px 14px;font:inherit;font-size:14.5px}
.gsearch input:focus{outline:2px solid color-mix(in srgb,var(--series-1) 45%,transparent);outline-offset:1px}
.modes{display:flex;gap:0;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex:none}
.mode{background:var(--surface-1);border:none;padding:9px 13px;font:inherit;font-size:12.5px;
  color:var(--text-muted);cursor:pointer}
.mode.on{background:color-mix(in srgb,var(--series-1) 15%,var(--surface-1));color:var(--text-primary)}
.gmeta{color:var(--text-muted);font-size:12.5px;margin-bottom:12px}
.gmeta b{color:var(--text-primary)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.rcard{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rthumb{position:relative;aspect-ratio:3/4;background:var(--track);cursor:zoom-in}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rstore{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;border-radius:5px;
  padding:2px 6px;font-size:10px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbody{padding:8px 10px 10px}
.rtitle{color:var(--text-primary);text-decoration:none;font-size:12.5px;font-weight:550;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rtitle:hover{text-decoration:underline}
.rmeta{color:var(--text-secondary);font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:3px}

/* --- mağaza kartları (ana sayfa) --- */
.store{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px 12px;margin-bottom:12px}
.store-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:6px}
.store-name{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.store-name a{color:var(--series-1);text-decoration:none}
.store-name a:hover{text-decoration:underline}
.plat{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);
  border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.store-head .chip{margin-left:auto}
.store-stats{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--text-secondary);
  font-size:12.5px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.store-stats b{color:var(--text-primary);font-weight:600}
.store-mail{font-size:12.5px;margin-bottom:10px}
.store-mail a{color:var(--series-1);text-decoration:none}
.store-mail a:hover{text-decoration:underline}

.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:9px;
  scrollbar-width:thin}
.strip figure{margin:0;flex:none;width:92px}
.strip .sh{width:92px;aspect-ratio:3/4;border-radius:7px;overflow:hidden;background:var(--track);cursor:zoom-in}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip figcaption{font-size:10.5px;color:var(--text-muted);margin-top:4px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-empty{color:var(--text-muted);font-size:12px;padding:10px 0 14px}

.store-line{color:var(--text-secondary);font-size:12.5px;display:flex;align-items:flex-start;gap:8px}
.store-line span{flex:1}

/* --- mağaza detayı --- */
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cat{background:var(--surface-1);border:1px solid var(--border);border-radius:999px;
  padding:5px 11px;font:inherit;font-size:12.5px;color:var(--text-secondary);cursor:pointer}
.cat span{color:var(--text-muted);font-variant-numeric:tabular-nums;margin-left:3px}
.cat:hover{color:var(--text-primary)}
.cat.on{background:color-mix(in srgb,var(--series-1) 14%,var(--surface-1));
  border-color:color-mix(in srgb,var(--series-1) 45%,var(--border));color:var(--text-primary)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:3/4;background:var(--track)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:12px}
.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;
  border-radius:6px;padding:2px 6px;font-size:11px;font-variant-numeric:tabular-nums}
.badge.low{background:var(--critical)}
.cbody{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px}
.ctitle{color:var(--text-primary);text-decoration:none;font-size:13px;font-weight:550;line-height:1.35}
.ctitle:hover{text-decoration:underline}
.ctype{color:var(--text-muted);font-size:11px;line-height:1.3}
.cmeta{color:var(--text-secondary);font-size:12px;font-variant-numeric:tabular-nums}
.warn{color:var(--critical)}
.cdesc{color:var(--text-muted);font-size:11.5px;margin:3px 0 0;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--text-muted);font-size:12.5px}
.pager button{background:var(--surface-1);border:1px solid var(--border);border-radius:7px;
  padding:5px 11px;font:inherit;font-size:13px;color:var(--text-primary);cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}

/* --- görsel önizleme (lightbox) --- */
.thumb{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.93);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#f2f1ed;flex:none}
.lb-title{font-size:14px;font-weight:550;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-count{font-size:12.5px;color:#a9a79f;font-variant-numeric:tabular-nums;flex:none}
.lb-open{color:#8fbdf0;text-decoration:none;font-size:12.5px;flex:none}
.lb-open:hover{text-decoration:underline}
.lb-x{background:none;border:none;color:#f2f1ed;font-size:22px;line-height:1;cursor:pointer;padding:0 4px;flex:none}
.lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);
  border:none;color:#fff;font-size:24px;line-height:1;width:42px;height:56px;border-radius:8px;cursor:pointer}
.lb-nav:hover{background:rgba(255,255,255,.26)}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-strip{display:flex;gap:7px;overflow-x:auto;padding:12px 16px;flex:none}
.lb-strip img{height:62px;width:48px;object-fit:cover;border-radius:5px;cursor:pointer;
  opacity:.5;border:2px solid transparent}
.lb-strip img.on{opacity:1;border-color:#8fbdf0}
@media (max-width:520px){.lb-nav{width:36px;height:48px;font-size:20px}.lb-strip img{height:52px;width:40px}}
</style>
</head>
<body>
<div class="wrap">

  <section id="listView">
    <h1>Lead Scout</h1>
    <div class="sub" id="sub">yükleniyor…</div>
    <div class="gsearch">
      <input type="search" id="gq" placeholder="Tüm mağazalarda ürün ara —  red dress, siyah şal, blazer…" autocomplete="off">
      <div class="modes">
        <button class="mode on" data-m="local">yerel indeks</button>
        <button class="mode" data-m="live">canlı</button>
      </div>
    </div>
    <div id="gmeta" class="gmeta" hidden></div>
    <div id="gresults" hidden></div>

    <div id="browse">
    <div class="kpis" id="kpis"></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Mağaza ara…">
      <select id="seg"><option value="">Tüm sektörler</option></select>
      <select id="fit">
        <option value="0" selected>Tüm uygunluklar</option>
        <option value="1">fit ≥ 1</option>
        <option value="2">fit ≥ 2 (aday)</option>
        <option value="2.5">fit ≥ 2.5 (güçlü)</option>
      </select>
      <label class="chk"><input type="checkbox" id="onlymail"> Sadece e-postası olanlar</label>
      <label class="chk"><input type="checkbox" id="showall"> Elenenleri de göster</label>
      <select id="sort">
        <option value="fit">Uygunluk ↓</option>
        <option value="pctOneImage">Tek fotolu oranı ↓</option>
        <option value="products">Ürün sayısı ↓</option>
        <option value="imagesPerProduct">Foto/ürün ↑</option>
        <option value="domain">İsme göre</option>
      </select>
    </div>
    <div id="storeList"></div>
    <footer id="foot"></footer>
    </div>
  </section>

  <section id="detailView" hidden>
    <a class="back" href="#">‹ tüm mağazalar</a>
    <h1 id="dTitle"></h1>
    <div class="sub" id="dCount"></div>
    <div class="kpis" id="dKpis"></div>
    <div class="cats" id="dCats"></div>
    <div class="filters">
      <input type="search" id="dq" placeholder="Ürün adı, açıklama, etiket ara…">
      <select id="dimg">
        <option value="">Tüm ürünler</option>
        <option value="1">Tek görselli (≤1)</option>
        <option value="lt3">3'ten az görselli</option>
        <option value="nodesc">Açıklaması olmayan</option>
      </select>
      <select id="dsort">
        <option value="images:asc">Görsel sayısı ↑ (en zayıf önce)</option>
        <option value="images:desc" selected>Görsel sayısı ↓</option>
        <option value="title:asc">İsme göre</option>
        <option value="price:desc">Fiyat ↓</option>
        <option value="desc:asc">Açıklama uzunluğu ↑</option>
      </select>
    </div>
    <div id="dBody"></div>
    <div class="pager">
      <button id="dPrev">‹ önceki</button>
      <button id="dNext">sonraki ›</button>
    </div>
  </section>

</div>

<div class="lb" id="lb" hidden>
  <div class="lb-top">
    <span class="lb-title" id="lbTitle"></span>
    <span class="lb-count" id="lbCount"></span>
    <a class="lb-open" id="lbOpen" target="_blank" rel="noopener">ürün sayfası ↗</a>
    <button class="lb-x" id="lbX" aria-label="Kapat">×</button>
  </div>
  <div class="lb-stage">
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Önceki">‹</button>
    <img id="lbImg" referrerpolicy="no-referrer" alt="">
    <button class="lb-nav lb-next" id="lbNext" aria-label="Sonraki">›</button>
  </div>
  <div class="lb-strip" id="lbStrip"></div>
</div>

<script src="app.js"></script>
</body>
</html>
